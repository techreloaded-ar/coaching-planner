name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/coaching_planner_ci"
      E2E_DATABASE_URL: "postgresql://ci:ci@localhost:5432/coaching_planner_e2e"
      SESSION_SECRET: "ci-session-secret-not-for-production-use"
      AUTH_SECRET: "ci-auth-secret-not-for-production-use"
      GOOGLE_CLIENT_ID: "ci-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-google-client-secret"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      E2E_TEST_MODE: "true"
      PLAYWRIGHT_WEB_SERVER_COMMAND: "npm run start"
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: coaching_planner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create dedicated E2E database
        run: |
          node <<'EOF'
          const { Client } = require('pg');

          async function main() {
            const connectionString =
              'postgresql://ci:ci@localhost:5432/postgres';
            const client = new Client({ connectionString });
            await client.connect();

            const query =
              'SELECT 1 FROM pg_database ' +
              "WHERE datname = 'coaching_planner_e2e'";
            const result = await client.query(query);

            if (result.rowCount === 0) {
              await client.query('CREATE DATABASE coaching_planner_e2e');
            }

            await client.end();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests (Playwright)
        run: npm run test:e2e
