<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso negato — Coaching Planner (US-027)</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<!-- Blob decorativi di sfondo, come nella home/login reale -->
<div class="blobs" aria-hidden="true">
  <div class="blob blob-emerald"></div>
  <div class="blob blob-indigo"></div>
  <div class="blob blob-rose"></div>
</div>

<!-- Toggle tema (solo per il mockup) -->
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema chiaro/scuro" title="Tema chiaro/scuro">
  <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.8A8.6 8.6 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"/></svg>
  <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
</button>

<!-- ============ PAGINA RADICE CON ESITO DI ACCESSO NEGATO (US-027) ============ -->
<div class="stage">
  <main class="accesso">

    <div class="logo-targa">
      <img src="agile-reloaded-logo.png" alt="Agile Reloaded">
    </div>

    <h1 class="titolo">Coaching Planner</h1>
    <div class="filo-brand" aria-hidden="true"></div>
    <p class="payoff">Consuntivi mensili di collaboratori, clienti e offerte.</p>

    <!-- Messaggio di accesso negato: rosso rose -->
    <div class="banner banner-err" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.2M12 16.4h.01"/>
      </svg>
      <span>Questo account Google non è autorizzato ad accedere.</span>
    </div>

    <button class="google-btn" id="googleBtn" type="button">
      <svg class="g-logo" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 0 1-.29-1.71c0-.6.1-1.18.29-1.71V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33Z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
      </svg>
      <span class="lbl">Accedi con Google</span>
    </button>

    <p class="nota-riservata">Area riservata · accesso consentito solo al personale autorizzato</p>

  </main>
</div>

<!-- Barra demo: navigazione fra gli stati della pagina (solo mockup) -->
<nav class="demo-bar" aria-label="Stati del mockup">
  <span class="demo-tag">Demo stati</span>

<script src="app.js"></script>
</body>
</html>
