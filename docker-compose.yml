# PostgreSQL locale per sviluppo Coaching Planner
# Avvia con: docker compose up -d
# Arresta con: docker compose down
# Reset completo: docker compose down -v && docker compose up -d
#
# Gli script in ./docker/postgres/initdb vengono eseguiti dall'entrypoint di
# Postgres SOLO alla prima inizializzazione del volume `pgdata`: creano il
# database dedicato agli e2e accanto a quello di sviluppo. Su un volume già
# inizializzato non vengono rieseguiti; per ottenerli serve
# `docker compose down -v && docker compose up -d` (che cancella anche i dati di
# sviluppo). In alternativa il database e2e mancante viene creato dalla suite
# stessa al primo `npm run test:e2e`.

services:
  postgres:
    image: postgres:17-alpine
    container_name: coaching-planner-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coaching_planner
      POSTGRES_E2E_DB: coaching_planner_e2e
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d coaching_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
