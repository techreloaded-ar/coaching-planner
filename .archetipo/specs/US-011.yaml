body: |-
  #### US-011: Calendario mensile delle proprie attività

  **Epic:** EP-003 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come Giulia, collaboratrice,
  voglio navigare le mie attività su base mensile, spostandomi tra i mesi e vedendo i giorni del mese selezionato,
  così da avere sempre il quadro di cosa ho già registrato e di cosa manca.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, una collaboratrice autenticata apre il front office, vede il mese corrente con i suoi giorni, si sposta al mese precedente e successivo e riconosce a colpo d'occhio i giorni con attività registrate.

  **Criteri di Accettazione**
  - [ ] All'accesso al front office viene mostrato il mese corrente con tutti i suoi giorni
  - [ ] La collaboratrice naviga al mese precedente e successivo senza limiti di periodo
  - [ ] I giorni con attività registrate sono distinguibili e mostrano una sintesi delle righe presenti
  - [ ] Sono visibili esclusivamente le attività della collaboratrice autenticata
