body: |-
  **Come** collaboratore, **voglio** che le proposte dal calendario siano raccolte in un pannello chiuso con il loro numero, **così** che la giornata resti leggibile e le apra solo quando servono.

  **Demonstrates:** aprendo una giornata con 3 proposte compare un pannello chiuso «Proposte dal calendario · 3 da proporre»; cliccandolo si espande l'elenco; confermando o rifiutando una proposta il numero scende a 2.

  ### Criteri di accettazione
  - [ ] All'apertura della giornata il pannello delle proposte è chiuso e mostra il numero di proposte
  - [ ] Il pannello si apre e si richiude con un controllo accessibile da tastiera che ne espone lo stato aperto/chiuso
  - [ ] Aperto, il pannello mostra le proposte con le azioni «Conferma», «Modifica» e «Rifiuta» di oggi
  - [ ] Il numero si aggiorna quando una proposta viene confermata o rifiutata
  - [ ] Lettura in corso, errore del calendario e assenza di proposte restano visibili senza dover aprire il pannello
  - [ ] Senza calendario collegato il pannello non compare, come oggi

