body: |-
  **Come** utente del coaching planner con più account Google attivi nel browser **voglio** scegliere esplicitamente con quale account accedere **così da** non entrare (o vedermi negare l'accesso) con il mio account personale predefinito.

  **Demonstrates:** dalla pagina di accesso premo «Accedi con Google»: l'URL di autorizzazione Google contiene `prompt=select_account`, quindi Google mostra sempre l elenco degli account invece di usare automaticamente quello predefinito.

  ## Criteri di accettazione
  - [ ] L URL di autorizzazione del login Google include `prompt=select_account`, così Google mostra sempre la scelta dell'account anche con una sola sessione attiva.
  - [ ] Scope (`openid`, `email`, `profile`), state, PKCE e callback del login restano invariati; le regole di accesso (solo email registrate e attive) non cambiano.
  - [ ] Un test unitario verifica i parametri dell'URL di autorizzazione del login.

  <!-- archetipo-increment:inc-800bf08708b20f44:US-004 -->

  Proposta di incremento: https://github.com/techreloaded-ar/coaching-planner/pull/3
