title: Fatturare le trasferte forfettarie nel report Fatturazione clienti
epic:
  code: EP-013
  title: Quando definiamo un'offerta, dobbiamo aggiungere l'informazione su come …
priority: HIGH
points: 5
status: DONE
blocked_by:
