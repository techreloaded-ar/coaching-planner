body: |-
  #### US-047: Anagrafica collaboratori dedicata alla sola modifica del profilo

  **Epic:** EP-005 | **Priorità:** MEDIUM | **Punti:** 2 | **Stato:** TODO
  **Bloccata da:** US-045, US-046

  **Storia Utente**
  Come amministratore,
  voglio che l'anagrafica collaboratori non permetta più censimento, eliminazione o cambio di stato dei collaboratori,
  così che il ciclo di vita di utenze e ruoli sia governato solo dalla schermata utenti, mentre lì restano modificabili i dati anagrafici e di costo.

  **Dimostrazione**
  Il revisore apre l'anagrafica collaboratori e osserva che non sono presenti il pulsante "Nuovo collaboratore" né le azioni Disattiva/Riattiva, mentre lo stato attivo/disattivato resta visibile in sola lettura. Navigando direttamente all'indirizzo della pagina di censimento collaboratore, il revisore viene reindirizzato alla schermata utenti. Apre poi la modifica di un collaboratore, cambia la tariffa giornaliera, salva e vede il nuovo valore in elenco; osserva infine che il campo email è in sola lettura.

  **Criteri di Accettazione**
  - [ ] AC-1 — Il pulsante "Nuovo collaboratore" non è più presente e l'accesso diretto all'indirizzo della pagina di censimento non consente la creazione, reindirizzando l'amministratore alla schermata utenti
  - [ ] AC-2 — Le azioni Disattiva e Riattiva non sono più presenti nell'elenco né nella modifica del collaboratore
  - [ ] AC-3 — Lo stato attivo/disattivato di ogni collaboratore resta visibile in sola lettura nell'elenco
  - [ ] AC-4 — La modifica di nome, cognome, partita IVA e tariffa giornaliera resta possibile e i nuovi valori sono persistiti e visibili in elenco dopo il salvataggio
  - [ ] AC-5 — Il campo email è in sola lettura nella modifica del collaboratore ed è modificabile solo dalla schermata utenti

  **Fuori Perimetro**
  Nessuna azione di eliminazione fisica dei collaboratori viene introdotta. La pagina di dettaglio del collaboratore con storico e abilitazioni (US-038, US-042) resta invariata. La sincronizzazione del nome tra profilo e utente resta come oggi.

  **Contesto Wiki**
  `domains/collaboratori`, `domains/identita-accesso`
