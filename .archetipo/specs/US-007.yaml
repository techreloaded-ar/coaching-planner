body: |-
  #### US-007: Anagrafica clienti con dati di fatturazione

  **Epic:** EP-002 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come Stefano, amministratore,
  voglio censire i clienti con i loro dati di fatturazione e poterli modificare o disattivare,
  così da avere un'unica fonte di verità per le anagrafiche su cui costruire offerte e consuntivi.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, l'amministratore può aprire l'elenco clienti nel back office, creare un nuovo cliente con i dati di fatturazione, modificarlo e disattivarlo vedendolo sparire dalle scelte operative.

  **Criteri di Accettazione**
  - [ ] L'amministratore crea un cliente con ragione sociale e dati di fatturazione; i campi obbligatori sono validati
  - [ ] L'amministratore modifica i dati di un cliente esistente e le modifiche sono persistite
  - [ ] La disattivazione di un cliente lo esclude dalle selezioni per nuove attività e offerte, preservando lo storico
  - [ ] L'elenco clienti mostra stato attivo/disattivo e consente di distinguere i clienti disattivati
