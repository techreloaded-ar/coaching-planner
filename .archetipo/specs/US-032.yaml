body: |-
  #### US-032: Dettaglio avanzamento espandibile nella pagina Offerte e dismissione della pagina Avanzamento Offerte

  **Epic:** EP-002 | **Priorità:** HIGH | **Punti:** 5 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come amministratore,
  voglio espandere una riga della pagina Offerte per vedere il dettaglio di avanzamento dell'offerta direttamente lì,
  così da monitorare erogato, residuo e ripartizione per collaboratore senza dover aprire una pagina di report separata.

  **Dimostrazione**
  Partendo dalla pagina Offerte con offerte attive e non attive presenti, l'amministratore clicca una riga e la vede espandersi sotto la riga stessa con: classificazione di avanzamento (In corso, In allerta, Esaurita, Oltre budget), giornate previste, erogate e residuo, percentuale di utilizzo con barra di avanzamento e tabella delle giornate erogate per collaboratore con ore, giornate e quota. Clicca di nuovo la stessa riga e la vede richiudersi. Visita poi la vecchia rotta della pagina Avanzamento Offerte e viene riportato alla pagina Offerte; la voce di navigazione non è più presente nel menu.

  **Criteri di Accettazione**
  - [ ] AC-1 — Il click su una riga della pagina Offerte espande sotto la riga il dettaglio con classificazione di avanzamento, giornate previste, erogate, residuo e percentuale di utilizzo con barra
  - [ ] AC-2 — Il dettaglio espanso include la ripartizione per collaboratore con ore consuntivate, giornate erogate e quota percentuale
  - [ ] AC-3 — L'espansione funziona sia per le offerte attive sia per quelle non attive
  - [ ] AC-4 — Un secondo click sulla riga espansa la richiude, riportando la tabella allo stato compatto
  - [ ] AC-5 — Per un'offerta senza attività registrate il dettaglio espanso mostra il messaggio che nessuna attività è stata registrata per quell'offerta
  - [ ] AC-6 — Le azioni esistenti della riga (interruttore attiva/non attiva, Modifica, Elimina) e il filtro di ricerca continuano a funzionare senza attivare né perdere l'espansione della riga su cui non si è agito
  - [ ] AC-7 — La voce di navigazione verso Avanzamento Offerte non compare più nel menu e la vecchia rotta reindirizza alla pagina Offerte

  **Fuori Perimetro**
  Il riepilogo cumulativo di portafoglio (totali di previste, erogate e residuo complessivo su tutte le offerte) presente nella vecchia pagina non viene ricreato nella pagina Offerte. Nessuna modifica al calcolo dell'avanzamento, alle soglie di classificazione o alle colonne già presenti nella tabella.

  **Wiki context**
  - domains.offerte
