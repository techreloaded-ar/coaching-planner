scope: MVP
body: |-
  **Come** collaboratore, **voglio** che non mi vengano proposti eventi «Fuori sede» o palesemente non lavorativi, **così** da vedere solo impegni che ha senso consuntivare.

  **Demonstrates:** in una giornata con un evento di lavoro, un evento «Fuori sede» di Google Calendar e un evento «Pranzo», compare solo la proposta dell'evento di lavoro.

  ### Criteri di accettazione
  - [ ] Gli eventi Google Calendar di tipo «Fuori sede» (eventType outOfOffice) non vengono mai proposti, anche senza Gemini
  - [ ] Gemini indica per ogni evento se è palesemente non lavorativo (es. pranzo, palestra, visita medica, impegno personale); questi eventi non vengono proposti
  - [ ] Nel dubbio l'evento resta proposto: l'esclusione AI vale solo per i casi palesi indicati da Gemini
  - [ ] Senza Gemini o con errore di Gemini non si applica il filtro AI e gli altri eventi restano proposti
  - [ ] Se tutti gli eventi sono esclusi compare il messaggio «Nessun impegno da proporre per questa giornata»
  - [ ] L'esclusione «Fuori sede» e quella AI simulata in e2e sono coperte da test

