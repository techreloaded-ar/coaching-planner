body: |-
  #### US-026: Gestione delle offerte dalla pagina offerte

  **Epic:** EP-002 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** US-025

  **Storia Utente**
  Come Stefano, amministratore,
  voglio creare, modificare, attivare o disattivare ed eliminare le offerte direttamente dalla pagina Offerte,
  così da gestire l'intero ciclo di vita delle offerte da un unico punto senza passare dall'anagrafica del singolo cliente.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, dalla pagina Offerte l'amministratore aggiunge una nuova offerta scegliendo il cliente, modifica un'offerta esistente, la disattiva e la riattiva, ed elimina un'offerta priva di attività collegate; tentando di eliminare un'offerta con attività registrate riceve un messaggio che lo blocca e gli propone la disattivazione.

  **Criteri di Accettazione**
  - [ ] Dalla pagina Offerte l'amministratore crea una nuova offerta scegliendo il cliente e indicando codice, descrizione, tariffa giornaliera e giorni previsti, con le stesse validazioni dell'anagrafica offerte esistente
  - [ ] L'amministratore modifica un'offerta esistente dalla pagina e le modifiche sono persistite e riflesse nell'elenco
  - [ ] L'amministratore attiva o disattiva un'offerta tramite il flag manuale di stato e il cambiamento è immediatamente visibile nell'elenco
  - [ ] L'amministratore elimina un'offerta priva di attività collegate; l'eliminazione è bloccata con un messaggio chiaro quando esistono righe di attività collegate, invitando a disattivare l'offerta invece di eliminarla
