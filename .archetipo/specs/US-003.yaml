body: |-
  #### US-003: Suite di test e pipeline di integrazione continua

  **Epic:** EP-000 | **Priorità:** HIGH | **Punti:** 2 | **Stato:** TODO
  **Bloccata da:** US-001

  **Storia Utente**
  Come sviluppatore del progetto Coaching Planner,
  voglio una suite di test unitari (Vitest) ed end-to-end (Playwright) eseguita automaticamente a ogni push,
  così da intercettare le regressioni prima che raggiungano la produzione.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, uno sviluppatore può lanciare i test unitari ed e2e in locale e vederli passare; a ogni push la pipeline esegue install, lint, test unitari, build e test e2e.

  **Criteri di Accettazione**
  - [ ] Vitest è configurato e almeno un test unitario di esempio passa
  - [ ] Playwright è configurato e un test e2e di smoke sulla pagina iniziale passa
  - [ ] La pipeline CI esegue install, lint, test unitari, build e test e2e a ogni push e fallisce se uno step fallisce
