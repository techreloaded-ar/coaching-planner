body: |-
  #### US-029: Attivazione del proxy di autenticazione con rinnovo sliding della sessione

  **Epic:** EP-001 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** US-027

  **Storia Utente**
  Come utente autenticato di Coaching Planner (titolare o collaboratore),
  voglio che la mia sessione si rinnovi automaticamente finché uso l'applicazione e che le rotte protette mi reindirizzino subito alla pagina di accesso quando non sono autenticato,
  così da non essere disconnesso a metà lavoro dopo un tempo fisso dalla creazione della sessione e da non vedere mai un caricamento parziale prima del rinvio all'accesso.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, il proxy risiede nella posizione riconosciuta da Next.js e risulta attivo all'avvio dell'applicazione; un utente non autenticato che apre una rotta protetta riceve un redirect verso la pagina radice prima di qualsiasi rendering, mentre un utente che continua a usare l'applicazione vede la scadenza del cookie di sessione avanzare a ogni richiesta, invece di scadere a tempo fisso dalla creazione.

  **Criteri di Accettazione**
  - [ ] Il proxy è attivo: una richiesta a una rotta protetta senza sessione riceve un redirect verso la pagina radice prima del rendering, mentre la radice e le altre rotte pubbliche (avvio dell'autenticazione Google, supporto ai test e2e) restano raggiungibili senza sessione
  - [ ] La scadenza della sessione si rinnova a ogni richiesta di un utente attivo (rinnovo sliding): la sessione resta valida finché l'applicazione viene usata ed è l'inattività per la durata configurata a farla scadere; la documentazione interna che attribuisce il rinnovo al proxy torna a corrispondere al comportamento reale
  - [ ] Un utente autenticato che apre una rotta riservata a un ruolo diverso dal proprio viene reindirizzato alla home della propria area senza accessi al database (controllo ottimistico dal cookie)
  - [ ] Un cookie di sessione presente ma non valido viene rimosso e la richiesta reindirizzata alla pagina radice
  - [ ] Con SESSION_SECRET assente o al valore di default l'applicazione fallisce in modo esplicito anche in sviluppo (fail-fast, nessun percorso permissivo); ambiente locale e test e2e usano un secret valido
  - [ ] La suite e2e esistente passa invariata rispetto al comportamento atteso dopo US-027 (radice pubblica come pagina di accesso, aree protette raggiungibili dopo l'autenticazione)
