body: |-
  #### US-020: Override della tariffa collaboratore per offerta

  **Epic:** EP-005 | **Priorità:** LOW | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come Stefano, amministratore,
  voglio poter definire, quando serve, una tariffa specifica per la coppia collaboratore-offerta che prevale sulla tariffa standard,
  così da gestire accordi particolari senza alterare la tariffa generale del collaboratore.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, l'amministratore imposta su un'offerta una tariffa specifica per un collaboratore e i consuntivi di quel collaboratore su quell'offerta usano la tariffa in override, mentre le altre offerte restano alla tariffa standard.

  **Criteri di Accettazione**
  - [ ] L'amministratore definisce una tariffa specifica per la combinazione collaboratore-offerta
  - [ ] I calcoli di riepilogo e report usano la tariffa in override quando presente, altrimenti la tariffa standard del collaboratore
  - [ ] La rimozione dell'override ripristina la tariffa standard nei calcoli correnti
  - [ ] L'override è tracciato e visibile nell'anagrafica dell'offerta
