body: |-
  #### US-002: Database PostgreSQL con Prisma, migrazioni e seed

  **Epic:** EP-000 | **Priorità:** HIGH | **Punti:** 2 | **Stato:** TODO
  **Bloccata da:** US-001

  **Storia Utente**
  Come sviluppatore del progetto Coaching Planner,
  voglio un database PostgreSQL locale collegato all'applicazione tramite Prisma, con migrazioni versionate e dati di esempio,
  così da poter evolvere lo schema dati in modo controllato e sviluppare senza dipendere dal database di produzione.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, uno sviluppatore può avviare il Postgres locale, applicare le migrazioni, eseguire il seed e verificare dall'applicazione che la connessione al database funziona.

  **Criteri di Accettazione**
  - [ ] Lo schema Prisma iniziale è versionato e le migrazioni si applicano con successo su un database locale vuoto
  - [ ] Il comando di seed popola dati di esempio utilizzabili in sviluppo
  - [ ] La connessione usa una DATABASE_URL configurata via variabili d'ambiente, distinta tra locale e produzione
  - [ ] I tipi monetari nello schema usano Decimal, mai float
