body: |-
  #### US-027: Accesso diretto dalla pagina radice con brand Agile Reloaded

  **Epic:** EP-001 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come utente di Coaching Planner (titolare o collaboratore),
  voglio autenticarmi con Google direttamente dalla pagina radice dell'applicazione, senza passare da una pagina di login separata,
  così da entrare nella mia area con un passaggio in meno.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, un utente non autenticato che apre l'indirizzo radice vede un'unica pagina di accesso curata — logo Agile Reloaded, nome dell'applicazione, breve payoff e pulsante "Accedi con Google" — e cliccando il pulsante completa l'autenticazione e atterra nell'area del proprio ruolo. Aprendo `/login` si ottiene una pagina non trovata.

  **Criteri di Accettazione**
  - [ ] Un utente non autenticato sulla pagina radice avvia l'accesso con Google direttamente da lì, senza pagine intermedie, e ad autenticazione completata raggiunge l'area del proprio ruolo
  - [ ] La pagina mostra il logo Agile Reloaded, il nome dell'applicazione e un breve payoff, con stile coerente con il resto del sito (palette, tipografia, tema scuro) e ben composta sia su desktop sia su schermi piccoli
  - [ ] Il logo è servito dall'applicazione stessa e non caricato a runtime dal sito esterno
  - [ ] La route `/login` non esiste più: aprirla restituisce una pagina non trovata e nessun flusso interno (redirect da route protette, esito di accesso negato) vi fa più riferimento — tutti puntano alla radice
  - [ ] Un utente la cui email Google non è censita vede sulla pagina radice il messaggio generico di accesso negato già previsto, senza creazione di nuovi utenti
  - [ ] Un utente già autenticato che apre la pagina radice viene ancora reindirizzato all'area del proprio ruolo

  *Nota: il logo di riferimento è disponibile all'indirizzo https://agilereloaded.com/wp-content/uploads/2022/03/share-facebook.png; trattandosi di un'immagine pensata per la condivisione social, in implementazione va adattata (ritaglio/sfondo) alla resa della pagina.*
