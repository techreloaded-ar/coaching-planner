body: |-
  #### US-024: Home page di accesso minimale e curata

  **Epic:** EP-001 | **Priorità:** HIGH | **Punti:** 2 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come utente di Coaching Planner (titolare o collaboratore),
  voglio che la pagina iniziale dell'applicazione sia una pagina di accesso minimale ma visivamente curata, coerente con lo stile del resto del sito,
  così da avere un ingresso all'applicazione gradevole e immediato, senza contenuti superflui.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, un utente non autenticato che apre l'indirizzo radice dell'applicazione vede una home page con una sezione hero curata — nome dell'applicazione, breve payoff e trattamento grafico coerente con la palette e la tipografia del sito — e un'unica azione ben visibile per accedere; cliccandola raggiunge la pagina di login. Un utente già autenticato che apre lo stesso indirizzo viene ancora reindirizzato alla propria area in base al ruolo.

  **Criteri di Accettazione**
  - [ ] Un utente non autenticato sulla pagina radice vede una hero con nome dell'applicazione, payoff sintetico e un'unica azione di accesso ben visibile che porta alla pagina di login
  - [ ] La pagina non contiene sezioni di marketing, elenchi di funzionalità o descrizioni del prodotto: solo l'essenziale per accedere
  - [ ] Lo stile (colori, tipografia, spaziature, supporto al tema scuro) è coerente con le pagine esistenti dell'applicazione
  - [ ] Il comportamento esistente è preservato: un utente autenticato che apre la pagina radice viene reindirizzato alla home del proprio ruolo
  - [ ] La pagina è leggibile e ben composta sia su desktop sia su schermi piccoli
