body: |-
  #### US-019: Promemoria automatici di compilazione per i collaboratori

  **Epic:** EP-005 | **Priorità:** LOW | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come Giulia, collaboratrice,
  voglio ricevere un promemoria quando ho giorni lavorativi senza attività registrate,
  così da compilare in tempo ed evitare i solleciti dell'amministrazione a fine mese.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, una collaboratrice con giorni recenti privi di registrazioni riceve un promemoria che la invita a completare la compilazione, mentre chi è in regola non riceve nulla.

  **Criteri di Accettazione**
  - [ ] Il sistema individua i giorni lavorativi recenti senza alcuna riga registrata per ciascun collaboratore attivo
  - [ ] Il collaboratore riceve un promemoria con l'indicazione dei giorni mancanti
  - [ ] I collaboratori senza giorni mancanti non ricevono promemoria
  - [ ] La frequenza dei promemoria è configurabile dall'amministratore o disattivabile
