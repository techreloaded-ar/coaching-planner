body: |-
  #### US-019: Promemoria email di fine mese per compilazione e fattura

  **Epic:** EP-005 | **Priorità:** LOW | **Punti:** 5 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come Giulia, collaboratrice,
  voglio ricevere a fine mese una email personale che mi ricordi di completare la compilazione del coaching planner e di emettere la fattura,
  così da chiudere il mese in tempo ed evitare i solleciti dell'amministrazione.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, l'amministratore apre il report di fatturazione mensile, preme "Invia promemoria di fine mese" e vede quante email sono partite; ogni collaboratore attivo trova nella propria casella una email personale che gli ricorda di completare il coaching planner del mese e di emettere la fattura. Lo stesso invio parte da solo l'ultimo giorno lavorativo del mese.

  **Criteri di Accettazione**
  - [ ] L'ultimo giorno lavorativo (lunedì–venerdì) di ogni mese ciascun collaboratore attivo riceve automaticamente una email personale, inviata al proprio indirizzo
  - [ ] L'email ricorda di completare la compilazione del coaching planner per il mese in corso e di emettere la fattura, e contiene il link all'applicazione
  - [ ] L'invio non dipende dalle attività registrate: la ricevono tutti i collaboratori attivi, anche chi ha già compilato tutto il mese
  - [ ] I collaboratori disattivati non ricevono l'email
  - [ ] L'invio automatico raggiunge ogni collaboratore al massimo una volta per mese, anche se viene ripetuto
  - [ ] Dalla pagina del report di fatturazione mensile l'amministratore può inviare subito il promemoria a tutti i collaboratori attivi e vede quante email sono state inviate e quante non sono riuscite
