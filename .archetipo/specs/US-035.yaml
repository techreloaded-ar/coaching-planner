body: |-
  #### US-035: Riga compatta nell'elenco offerte con giorni erogati aggregati e stato a indicatore

  **Epic:** EP-002 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come amministratore,
  voglio che ogni riga della pagina Offerte mostri le informazioni essenziali in forma compatta,
  così da vedere i pulsanti Modifica ed Elimina senza dover scorrere orizzontalmente la tabella.

  **Dimostrazione**
  Partendo dall'elenco offerte del seed con almeno un'offerta attiva e una non attiva, il revisore apre `/offerte` in una finestra desktop da 1366px di larghezza e osserva che tutte le colonne, inclusi i pulsanti Modifica ed Elimina, sono visibili senza barra di scorrimento orizzontale; la colonna unica "Giorni erogati" mostra un valore nel formato "2/23". Il revisore poi clicca l'indicatore circolare accanto al codice di un'offerta attiva con riga espansa e osserva che l'offerta diventa non attiva (indicatore grigio, riga attenuata) e che la riga resta espansa.

  **Criteri di Accettazione**
  - [ ] AC-1 — Le colonne "Giorni previsti", "Erogate" e "Residuo" sono sostituite da un'unica colonna "Giorni erogati" che mostra erogate e previste nel formato "erogate/previste" (es. "2/23"), con numeri in formato it-IT e al massimo un decimale
  - [ ] AC-2 — La cella "Giorni erogati" conserva un indicatore visivo di avanzamento e, quando il residuo è zero o negativo, la segnalazione rossa "Esaurita" o "Oltre budget" resta visibile sulla riga
  - [ ] AC-3 — La colonna "Stato" con interruttore ed etichetta è rimossa; accanto al badge del codice offerta compare un indicatore circolare verde per le offerte attive e grigio per le non attive, con tooltip testuale che ne dichiara lo stato
  - [ ] AC-4 — Il click sull'indicatore circolare attiva/disattiva l'offerta e, se la riga era espansa, la riga resta espansa dopo il cambio di stato
  - [ ] AC-5 — Con finestra desktop da 1366px di larghezza, la tabella offerte mostra tutte le colonne inclusi i pulsanti Modifica ed Elimina senza scorrimento orizzontale

  **Fuori Perimetro**
  L'elenco offerte annidato nel dettaglio cliente e il contenuto del pannello di dettaglio espanso non cambiano in questa spec.

  **Contesto Wiki**
  `domains/offerte.md`, `decisions/giornata-otto-ore.md`
