body: |-
  **Come** collaboratore con più account Google attivi nel browser **voglio** scegliere esplicitamente l'account da collegare e avere la garanzia che venga collegato solo quello con cui accedo al coaching planner **così da** non collegare per errore un calendario personale o di un'altra organizzazione.

  **Demonstrates:** da `/attivita` avvio il collegamento del calendario. Google mostra la scelta dell'account. Se autorizzo un account diverso da quello di accesso, torno su `/attivita` con un messaggio che indica l'account corretto e il calendario risulta non collegato. Se autorizzo l'account di accesso, il calendario risulta collegato.

  ## Criteri di accettazione
  - [ ] Il consenso Google per il calendario forza sempre la schermata di scelta dell'account (`prompt` con `select_account`), mantiene il token di rinnovo (`consent`, `access_type=offline`) e suggerisce l'email di accesso (`login_hint`).
  - [ ] Al ritorno dal consenso il sistema ricava l'email dell'account Google autorizzato e la confronta, senza distinzione tra maiuscole e minuscole, con l'email dell'utente in sessione.
  - [ ] Se le email non coincidono non viene salvato nessun token: un eventuale collegamento esistente resta invariato e l'utente torna su `/attivita` con un esito dedicato. Un messaggio spiega che è stato autorizzato un account diverso e indica l'email con cui riprovare.
  - [ ] Se le email coincidono il comportamento resta quello attuale: token salvato cifrato ed esito «collegato».
  - [ ] Consenso negato, state errato e scambio fallito restano gestiti come oggi.
  - [ ] La modalità di test e2e simula sia l'account corretto sia un account diverso. Un test copre il rifiuto dell'account diverso e un test unitario copre il confronto delle email.

