scope: MVP
body: |-
  **Come** amministratore, **voglio** che il report di marginalità includa il costo delle attività non fatturabili, **così che** il margine rifletta quanto Agile Reloaded paga senza fatturare al cliente.

  ### Demonstrates
  Su un'offerta con tariffa 800 €/giornata e un collaboratore a 400 €/giornata, con 8 h Fatturabile, 8 h Non fatturabile e 8 h Investimento nel periodo: ricavi 800,00 €, costi 800,00 €, margine 0,00 €; le giornate fatturabili mostrate sono 1.

  ### Criteri di accettazione
  - [ ] Ricavi calcolati solo sulle ore Fatturabile (invariato, coincidono con il report fatturazione clienti).
  - [ ] Costi calcolati su ore Fatturabile + Non fatturabile × tariffa del collaboratore; le ore Investimento non generano costo.
  - [ ] Un'offerta o un cliente con sole ore Non fatturabile compare con ricavi 0,00 €, costo positivo e margine negativo evidenziato.
  - [ ] La nota del report spiega quali categorie concorrono a ricavi e costi.
  - [ ] Test unitari del calcolo aggiornati, incluso il caso con sole ore Non fatturabile.

  <!-- archetipo-increment:inc-f99252df7ce0354d:US-003 -->

