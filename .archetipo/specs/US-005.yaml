body: |-
  #### US-005: Accesso con credenziali e sessione utente

  **Epic:** EP-001 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come utente del sistema (amministratore o collaboratore),
  voglio accedere all'applicazione con le mie credenziali personali,
  così da lavorare in un'area riservata e protetta corrispondente al mio ruolo.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, un utente può aprire la pagina di login, inserire le proprie credenziali e accedere all'area del proprio ruolo; un amministratore di esempio è disponibile tramite seed.

  **Criteri di Accettazione**
  - [ ] Con credenziali valide l'utente accede ed è reindirizzato all'area del proprio ruolo
  - [ ] Con credenziali errate viene mostrato un errore generico, senza indicare quale campo è sbagliato
  - [ ] Le password sono memorizzate con hashing robusto, mai in chiaro
  - [ ] La sessione scade dopo inattività prolungata e l'utente può disconnettersi esplicitamente
