body: |-
  **Come** amministratore **voglio** che il cambio mese nella Fatturazione Clienti risponda subito, come nel calendario di `/attivita`, **così da** consultare più mesi senza attese ripetute.

  **Demonstrates:** nella Fatturazione Clienti premo «Mese successivo»: l'etichetta cambia immediatamente e compare un indicatore di attesa finché arrivano i dati. Torno al mese precedente: i dati compaiono subito, senza nuova attesa, perché il mese è già in cache.

  ## Criteri di accettazione
  - [ ] Con frecce, selettore diretto o «Mese corrente», l'etichetta del mese si aggiorna subito, senza aspettare il server.
  - [ ] Mentre i dati del nuovo mese sono in caricamento, l'area del report espone `aria-busy="true"` e mostra l'indicatore di attesa usato in `/attivita`. Il report non mostra mai dati di un mese diverso da quello dell'etichetta.
  - [ ] I mesi già visitati e i mesi adiacenti a quello mostrato sono serviti da una cache client in memoria con lo stesso TTL della cache di `/attivita` (300 s): tornando a un mese in cache i dati compaiono senza richiesta al server.
  - [ ] I dati del mese arrivano da un endpoint GET dedicato, accessibile solo al ruolo AMMINISTRATORE: senza sessione risponde `401`, a un ruolo diverso `403`. Le risposte non sono memorizzabili da cache condivise.
  - [ ] L'URL resta sincronizzato con il mese mostrato e Indietro/Avanti del browser funzionano. Aprire o ricaricare la pagina mostra sempre dati aggiornati dal server.
  - [ ] Un errore di caricamento mostra un messaggio e lascia il report in uno stato coerente, senza dati di un altro mese.
  - [ ] Test unitari sull'endpoint (autorizzazione e dati) e un test e2e sulla navigazione reattiva, con mesi riservati e factory.

