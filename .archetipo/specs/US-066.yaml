body: |-
  **Come** amministratore **voglio** scegliere direttamente mese e anno nel report Fatturazione Clienti **così da** raggiungere un mese lontano senza scorrere avanti e indietro un mese alla volta.

  **Demonstrates:** come amministratore apro `/report/fatturazione-clienti`, clicco sull'etichetta del mese, passo all'anno precedente nel pannello e scelgo marzo. Il report mostra i dati di marzo dell'anno precedente, l'URL contiene `?mese=AAAA-03` e il link «Esporta Excel» esporta quel mese.

  ## Criteri di accettazione
  - [ ] L'etichetta del mese nella barra di navigazione della Fatturazione Clienti apre lo stesso selettore compatto usato in `/attivita` (`SelettoreMese`): anno con frecce precedente/successivo e griglia dei dodici mesi.
  - [ ] Scegliendo un mese il report mostra i dati di quel mese e l'URL riporta `?mese=AAAA-MM`. Il pulsante Indietro del browser riporta al mese precedentemente mostrato.
  - [ ] Restano disponibili le frecce mese precedente/successivo e il pulsante «Mese corrente».
  - [ ] Il selettore ha lo stesso comportamento da tastiera di `/attivita`: frecce per spostarsi, Invio per scegliere, Esc per chiudere.
  - [ ] Il link «Esporta Excel» esporta sempre il mese mostrato.
  - [ ] Un test e2e copre il salto diretto a un mese di un altro anno, usando mesi riservati e dati creati da factory.

