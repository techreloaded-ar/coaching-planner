body: |-
  #### US-025: Pagina offerte trasversale con stato e avanzamento

  **Epic:** EP-002 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come Stefano, amministratore,
  voglio una pagina Offerte nel back office che elenchi in un unico posto tutte le offerte di tutti i clienti con il loro stato e l'avanzamento delle giornate,
  così da avere una visione d'insieme senza dover entrare cliente per cliente.

  **Dimostrazione**
  Dopo l'implementazione di questa spec, l'amministratore apre dalla navigazione del back office la nuova pagina Offerte e vede l'elenco di tutte le offerte con cliente, codice, descrizione, tariffa, giorni previsti, stato attiva/non attiva, giornate erogate e residuo; le offerte non attive e quelle con giornate esaurite sono distinguibili a colpo d'occhio.

  **Criteri di Accettazione**
  - [ ] Una voce Offerte nella navigazione del back office apre una pagina che elenca tutte le offerte di tutti i clienti
  - [ ] Per ogni offerta sono mostrati cliente, codice, descrizione, tariffa giornaliera, giorni previsti e stato attiva/non attiva
  - [ ] Per ogni offerta sono mostrate giornate erogate e residuo, coerenti con la vista di avanzamento esistente a parità di dati
  - [ ] Le offerte non attive e quelle con residuo esaurito o negativo sono evidenziate visivamente
  - [ ] Se non esistono offerte la pagina mostra uno stato vuoto chiaro
