body: |-
  #### US-042: Abilitazione dei collaboratori sulle offerte dal dettaglio collaboratore

  **Epic:** EP-005 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** -

  **Storia Utente**
  Come amministratore,
  voglio vedere e gestire dal dettaglio di un collaboratore l'elenco delle offerte su cui è abilitato,
  così da controllare chi è ingaggiato su ciascun impegno commerciale prima di vincolare l'inserimento delle ore.

  **Dimostrazione**
  Partendo da un collaboratore con almeno una riga di attività registrata su un'offerta attiva, il revisore apre il dettaglio del collaboratore nel back office e osserva la sezione delle abilitazioni con quell'offerta già presente come abilitata (pre-popolamento iniziale). Il revisore abilita un'ulteriore offerta attiva, ricarica la pagina e la vede elencata come abilitata; poi revoca la stessa abilitazione, ricarica e osserva che l'offerta non risulta più abilitata, mentre l'abilitazione pre-popolata resta invariata.

  **Criteri di Accettazione**
  - [ ] AC-1 — Nel dettaglio di un collaboratore l'amministratore vede l'elenco delle offerte con l'indicazione, per ciascuna, se il collaboratore è abilitato, insieme a codice offerta e cliente di appartenenza
  - [ ] AC-2 — L'amministratore abilita un collaboratore su un'offerta e l'abilitazione risulta persistita: dopo il ricaricamento della pagina l'offerta compare come abilitata
  - [ ] AC-3 — L'amministratore revoca un'abilitazione esistente e, dopo il ricaricamento, l'offerta risulta non abilitata; le altre abilitazioni del collaboratore restano invariate
  - [ ] AC-4 — Al primo rilascio ogni collaboratore risulta già abilitato su tutte le offerte attive su cui ha almeno una riga di attività registrata
  - [ ] AC-5 — Un utente con ruolo collaboratore che tenta di accedere alla gestione delle abilitazioni riceve il medesimo esito di accesso negato già previsto per le rotte del back office

  **Fuori Perimetro**
  Il vincolo sull'inserimento delle ore nel front office (US-043) e la gestione delle abilitazioni dal lato offerta (US-044). Nessuna notifica al collaboratore quando viene abilitato o revocato.

  **Contesto Wiki**
