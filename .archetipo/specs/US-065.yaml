scope: MVP
body: |-
  **Come** utente di Coaching Planner
  **voglio** che ogni schermata rispetti il tema scelto
  **così da** non trovare parti dell'interfaccia con colori incoerenti o illeggibili.

  ### Demonstrates
  Con il tema "Scuro" selezionato e il sistema in modalità chiara, percorrere: pagina di accesso, calendario mensile, dettaglio giornata con un dialog aperto, riepilogo mese, anagrafiche (clienti, collaboratori, utenti, voci rimborso) con un form aperto, offerte e report fatturazione, pagina 404. Ogni schermata è scura e leggibile, inclusi date picker, select e scrollbar. Ripetere con "Chiaro" e il sistema in modalità scura: tutto è chiaro.

  ### Acceptance Criteria
  - [ ] Ogni pagina del front office, della console amministrativa, la pagina di accesso e la pagina 404 usano i colori del tema scelto, non quelli del sistema
  - [ ] Componenti condivisi (pulsanti di attesa, dialog, form, tabelle, sidebar) rispettano il tema scelto
  - [ ] I controlli nativi del browser (input data, select, scrollbar) usano lo schema di colori del tema scelto
  - [ ] Nessun testo o controllo diventa illeggibile per contrasto insufficiente in nessuno dei due temi

