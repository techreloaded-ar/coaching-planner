  - id: TASK-08
    title: 'Test e2e Playwright: download, confronto con lo schermo e autorizzazioni'
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-02
    body: |-
      ## Objective
      Un e2e deterministico scarica il file dal browser, lo legge e prova che cliente e totali coincidono con lo schermo; verifica inoltre che collaboratore e utente senza sessione non ottengano il file.

      ## Read
      - `tests/e2e/README.md` — contratto e2e (factory, mesi riservati, slot esclusivi)
      - `tests/e2e/report-fatturazione-clienti.spec.ts` — localizzatori e formattatori (`report-client-{id}-rimborsi`, `-totale`, `report-total-imponibile`, `report-total-rimborsi`, `report-total-importo`)
      - `tests/e2e/support/report-data.ts` — `creaDatasetReportFatturazioneClienti(factory, { codiceSpec })`, `dataset.atteso`
      - `tests/e2e/support/date.ts` — `SLOT_MESI_RISERVATI_ESCLUSIVI`
      - `tests/e2e/autorizzazione-ruoli.spec.ts` — come si fanno richieste HTTP autenticate/anonime
      - `tests/e2e/support/auth.ts` — `accediComeAdmin`, `accediComeCollaboratore`
      - `tests/e2e/support/xlsx-lettura.ts` — `leggiXlsx`

      ## Change
      - `tests/e2e/support/date.ts` — aggiungere alla mappa `SLOT_MESI_RISERVATI_ESCLUSIVI` la chiave `"US-018-ESPORTAZIONE-FATTURAZIONE": 7` (7 è il primo slot libero: la mappa arriva a 6; se nel frattempo un'altra spec ha preso 7, usare il primo intero non presente; il blocco di controllo duplicati in fondo alla mappa deve restare verde).
      - `tests/e2e/esportazione-fatturazione.spec.ts` — nuovo file. Importare `test, expect` da `./support/fixtures`.
      - Non modificare entità del seed (Giulia Conti, TechSolutions, DataFlow).

      ## Steps
      1. `const CODICE_SPEC = "US-018-ESPORTAZIONE-FATTURAZIONE"` passato come **letterale** o costante risolvibile a `creaDatasetReportFatturazioneClienti(factory, { codiceSpec: CODICE_SPEC })` (mese = `dataset.mese`, 1 mese indietro nello slot esclusivo).
      2. Test "scarica il file con gli stessi dati dello schermo" (AC-1, AC-2): `accediComeAdmin(page)`; `page.goto(`/report/fatturazione-clienti?mese=${dataset.mese}`)`; leggere dallo schermo con i testid: `report-client-{cliente.id}-rimborsi`, `report-client-{cliente.id}-totale`, `report-total-imponibile`, `report-total-rimborsi`, `report-total-importo` (testo formattato euro `it-IT`; convertire con una funzione locale che toglie `€`, spazi e punti migliaia e sostituisce la virgola con il punto, poi `Number`).
         Poi `const [download] = await Promise.all([page.waitForEvent("download"), page.getByTestId("esporta-excel").click()])`; asserire `download.suggestedFilename() === `fatturazione-clienti-${dataset.mese}.xlsx``; `leggiXlsx(await fs.readFile(await download.path()))`.
         Asserire sul foglio "Fatturazione clienti": esiste una riga la cui colonna A è `Totale {ragioneSociale del cliente}` con rimborsi e totale uguali a quelli letti a schermo; la riga `Totale mese` ha imponibile, rimborsi e totale uguali ai `report-total-*` letti a schermo; esiste la riga offerta con `dataset.offerta.codice` e imponibile uguale a `dataset.atteso.perCliente[0].perOfferta[0].totali.imponibile`. Il foglio "Dettaglio collaboratori" contiene i due collaboratori del dataset (cognome dei `dataset.collaboratori`).
      3. Test "la richiesta del collaboratore è negata" (AC-3): `accediComeCollaboratore(page, collaboratore.utente.email)` con la fixture `collaboratore`; `const risposta = await page.request.get(`/report/fatturazione-clienti/esporta?mese=${mese}`)`; asserire `status() === 403` e che `headers()["content-type"]` non contenga `spreadsheetml`.
      4. Test "senza sessione si viene reindirizzati" (AC-3): contesto senza cookie, `request.get(url, { maxRedirects: 0 })` → status 3xx e `location` che termina con `/` (radice), nessun xlsx.
      5. Nessun `waitForTimeout`, nessun selettore di classi Tailwind, nessun `selectOption({ index })`; ruoli/testid/label.

      ## Verify
      - Run (variabili `ARCHETIPO_*` della Baseline): `sh scripts/archetipo/ambiente.sh e2e tests/e2e/esportazione-fatturazione.spec.ts --retries=0`
      - Expect: 3 test passati.
      - Run: `sh scripts/archetipo/ambiente.sh e2e tests/e2e/esportazione-fatturazione.spec.ts tests/e2e/report-fatturazione-clienti.spec.ts --repeat-each=3`
      - Expect: tutti passati (nessuna dipendenza dall'ordine o da dati condivisi).
      - Run: `npm run lint`
      - Expect: exit 0, nessun nuovo warning oltre a quelli della Baseline.

      ## Done
      - [ ] AC-1 — il click su "Esporta Excel" produce un download `fatturazione-clienti-{mese}.xlsx` leggibile con i due fogli
      - [ ] AC-2 — oracolo: cliente (rimborsi, totale), riga offerta e "Totale mese" del file uguali ai valori `report-client-*`/`report-total-*` mostrati a schermo nello stesso test
      - [ ] AC-3 — collaboratore: 403 senza xlsx; senza sessione: redirect alla radice

      ## Blockers
      None.
