  - id: TASK-04
    title: 'Unit test del builder: il file contiene gli stessi dati e totali del report'
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-02
    body: |-
      ## Objective
      Una suite Vitest prova, cifra per cifra, che i fogli prodotti da `costruisciFogliFatturazioneClienti` (letti dopo `creaXlsx` + `leggiXlsx`) coincidono con il report calcolato dal dominio.

      ## Read
      - `src/lib/esportazione-fatturazione.ts` — `costruisciFogliFatturazioneClienti`, `nomeFileFatturazioneClienti`
      - `src/domain/consuntivi/index.ts` — `calcolaReportFatturazioneClienti`, `RigaReportFatturazione`
      - `tests/unit/report-fatturazione-clienti.test.ts` — helper `riga()` da replicare
      - `tests/e2e/support/xlsx-lettura.ts` — `leggiXlsx`

      ## Change
      - `tests/unit/esportazione-fatturazione.test.ts` — nuovo file. Nessun'altra modifica.

      ## Steps
      1. Helper `riga(modifiche)` come nel test del report (cliente, offerta, collaboratore, ore, fatturabile, rimborso), e helper `esporta(righe, etichetta)` che costruisce `{ token: "2026-05", ...calcolaReportFatturazioneClienti(righe) }`, chiama il builder, `creaXlsx` e `leggiXlsx`, restituendo i due fogli.
      2. Scenario principale (dominio reale, non fixture a mano): 2 clienti ("Alfa", "Beta"), il primo con 2 offerte e 2 collaboratori (ore 8 e 4, una riga non fatturabile, un rimborso 35.00), il secondo con un'offerta a tariffa 512.50 e ore 2.5 + 5.75. Asserire sul foglio 1: riga titolo `Fatturazione clienti — Maggio 2026`; intestazioni nell'ordine; per ogni offerta tariffa/giornate/imponibile uguali ai valori del report (`Number(...)`); riga `Totale Alfa` con giornate, imponibile manodopera, rimborsi, importo totale uguali al report; riga `Totale mese` uguale a `report.totali`.
      3. Cliente di soli rimborsi (nessuna riga fatturabile, un rimborso 20.00): compare la riga `Totale {cliente}` con giornate 0, imponibile 0, rimborsi 20, totale 20 e nessuna riga offerta.
      4. Report vuoto (`[]`): solo titolo, intestazioni e `Totale mese` con quattro valori 0.
      5. Foglio 2: una riga per collaboratore per offerta con ore, giornate e imponibile uguali a `perCollaboratore` del report, nell'ordine del report.
      6. Tipi: gli importi sono `number` (non stringhe) nelle celle lette; i testi con `&` nella ragione sociale ("Rossi & Figli") tornano identici.
      7. `nomeFileFatturazioneClienti("2026-05")` → `fatturazione-clienti-2026-05.xlsx`.

