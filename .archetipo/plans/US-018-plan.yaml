  - id: TASK-05
    title: Route handler GET /report/fatturazione-clienti/esporta
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      `GET /report/fatturazione-clienti/esporta?mese=YYYY-MM` restituisce il file xlsx come download all'amministratore e nega l'accesso a chiunque altro.

      ## Read
      - `node_modules/next/dist/docs/` — la guida sui Route Handlers (cercare `route.ts`/"route handlers"; questa versione di Next ha differenze rispetto al training: usare solo ciò che la guida conferma)
      - `src/app/api/attivita/offerte-cliente/route.ts` — schema di gestione errori (`ErroreAutorizzazione`, `console.error`, nessun dettaglio verso il client)
      - `src/lib/risposta-dati-privati.ts` — `INTESTAZIONI_DATI_PRIVATI`
      - `src/lib/report.ts` — `reportFatturazioneClientiMese` (chiama `richiediRuoloApi("AMMINISTRATORE")`)
      - `src/lib/dal.ts` — `ErroreAutorizzazione` (`statusCode: 401 | 403`)
      - `src/app/(back-office)/report/fatturazione-clienti/page.tsx` — fallback del token mese (`parseTokenMese`, `tokenMeseCorrente`) e `etichettaMese`

      ## Change
      - `src/app/(back-office)/report/fatturazione-clienti/esporta/route.ts` — nuovo file con `export async function GET(request: NextRequest)`.
      - Non-goal: nessuna modifica a `src/proxy.ts` o `src/lib/policy-rotte.ts` (il prefisso `/report` è già riservato; la guardia autorevole è `richiediRuoloApi`).

      ## Steps
      1. Leggere `request.nextUrl.searchParams.get("mese")`; se assente o se `parseTokenMese` è `null` usare `tokenMeseCorrente()` (stesso comportamento della pagina).
      2. `const report = await reportFatturazioneClientiMese(token)` — la chiamata applica l'autorizzazione e lancia `ErroreAutorizzazione` se il ruolo non è amministratore.
      3. `const fogli = costruisciFogliFatturazioneClienti(report, etichettaMese(token))`; `const corpo = creaXlsx(fogli)`.
      4. Rispondere `new Response(new Uint8Array(corpo), { status: 200, headers })` con `Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`, `Content-Disposition: attachment; filename="${nomeFileFatturazioneClienti(token)}"`, `Content-Length` e le `INTESTAZIONI_DATI_PRIVATI`.
      5. `catch`: se `errore instanceof ErroreAutorizzazione` → `rispostaDatiPrivati({ errore: errore.message }, errore.statusCode)`; altrimenti `console.error("Errore nell'esportazione del report di fatturazione:", errore)` e `rispostaDatiPrivati({ errore: "Errore interno" }, 500)`.
      6. Dichiarare `export const dynamic = "force-dynamic"` solo se la guida di Next lo richiede per i route handler che leggono cookie; altrimenti non aggiungerlo.

      ## Verify
      - Run: `npx tsc --noEmit && npx eslint "src/app/(back-office)/report/fatturazione-clienti/esporta/route.ts"`
      - Expect: exit 0, nessun warning.
      - Run: `npm run build`
      - Expect: build riuscita con la route `/report/fatturazione-clienti/esporta` nell'elenco (richiede `DATABASE_URL`; usare `sh scripts/archetipo/ambiente.sh build` con le variabili `ARCHETIPO_*` descritte nella Baseline).

      ## Done
      - [ ] AC-1 — la route risponde `200` con un xlsx e `Content-Disposition: attachment`
      - [ ] AC-3 — ogni errore di autorizzazione diventa `401/403` JSON, nessun dettaglio interno nelle `500`

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Unit test della route di esportazione (risposta, mese, errori)
    type: Test
    status: DONE
    dependencies:
      - TASK-05
      - TASK-02
    body: |-
      ## Objective
      Una suite Vitest prova il contratto HTTP della route: file valido con le intestazioni giuste, fallback del mese, propagazione di 401/403 senza corpo xlsx, 500 opaco.

      ## Read
      - `src/app/(back-office)/report/fatturazione-clienti/esporta/route.ts` — `GET`
      - `tests/unit/attivita-giornata-routes.test.ts` — come i test esistenti mockano `@/lib/dal`/moduli e costruiscono `NextRequest`
      - `tests/e2e/support/xlsx-lettura.ts` — `leggiXlsx`
      - `src/lib/dal.ts` — `ErroreAutorizzazione`

      ## Change
      - `tests/unit/esportazione-fatturazione-route.test.ts` — nuovo file. Nessun'altra modifica.

      ## Steps
      1. `vi.mock("@/lib/report")` limitando il mock a `reportFatturazioneClientiMese` (il writer e il builder restano reali, così il corpo viene davvero prodotto e letto). `ErroreAutorizzazione` si importa reale da `@/lib/dal` solo se il modulo è importabile nei test; altrimenti mockare `@/lib/dal` come fanno i test esistenti, mantenendo una classe `ErroreAutorizzazione` equivalente con `statusCode`.
      2. Caso 200: il mock restituisce un `RisultatoReportFatturazione` con un cliente; `GET(new NextRequest("http://localhost/report/fatturazione-clienti/esporta?mese=2026-05"))` → `status 200`, `Content-Type` xlsx, `Content-Disposition` contenente `attachment` e `fatturazione-clienti-2026-05.xlsx`, `Cache-Control: private, no-store`; `leggiXlsx(Buffer.from(await risposta.arrayBuffer()))` produce i due fogli e la ragione sociale del cliente compare nel foglio 1; il mock è stato chiamato con `"2026-05"`.
      3. Mese assente e mese non valido (`2026-13`, `abc`): `reportFatturazioneClientiMese` chiamato con il mese corrente (`tokenMeseCorrente()`) e nome file coerente.
      4. Autorizzazione: il mock lancia `ErroreAutorizzazione(403, …)` → `status 403`, `Content-Type` JSON, corpo `{ errore }`, **nessun** `Content-Disposition` e nessun `Content-Type` xlsx; stesso per `401`.
      5. Errore generico (`new Error("boom")`) → `status 500`, corpo `{ errore: "Errore interno" }` che non contiene `boom`.

      ## Verify
      - Run: `npx vitest run tests/unit/esportazione-fatturazione-route.test.ts`
      - Expect: tutti i test passano.
      - Run: `npm test && npx tsc --noEmit && npx eslint tests/unit/esportazione-fatturazione-route.test.ts`
      - Expect: tutti i test verdi (≥ 51 file), exit 0.

      ## Done
