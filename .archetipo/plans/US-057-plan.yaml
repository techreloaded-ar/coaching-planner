    body: |-
      ## Objective

      `docs/wiki/domains/attivita.md` (ID canonico `domains/attivita`) descrive la duplicazione come quinto comando del dominio, con la sua regola di ammissibilità, la propagazione dello scatto di rimborso e l'invalidazione estesa a più giorni e più mesi.

      ## Read

      - `docs/wiki/domains/attivita.md` — frontmatter `sources` e blocco `review`; sezione `contracts` (il paragrafo che elenca `creaRiga`, `modificaRiga`, `eliminaRiga`, `rimuoviRimborsoTrasferta` e la regola di abilitazione differenziata fra creazione e modifica); punti 3, 4, 5 e 9 di «Flussi osservati»; tabella della sezione `code`; sezione `invariants`; sezione `verification`.
      - Il codice come lasciato dai task precedenti: `src/lib/actions/righe-attivita.ts`, `src/app/(front-office)/attivita/[data]/selettore-duplicazione.tsx`, `dettaglio-giornata.tsx`, `isola-giornata.tsx`, `tests/unit/righe-attivita-actions.test.ts`, `tests/e2e/duplica-riga-su-giorni.spec.ts`.

      ## Change

      - `docs/wiki/domains/attivita.md` — frontmatter `sources` e blocco `review`, e le sezioni marcate `contracts`, `flows`, `code`, `invariants`, `verification`.
      - `docs/wiki/index.md` e `docs/wiki/log.md` solo come **output** dei comandi `archetipo wiki reset` e `archetipo wiki catalog`, mai modificati a mano.

      Non-goal: nessuna modifica ad altre pagine Wiki (hanno i loro task); nessuna modifica al codice; nessun marcatore `archetipo:wiki` rimosso o rinominato.

      ## Steps

      1. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner reset domains/attivita`, che riporta la pagina a `status: generated` rimuovendo il blocco `review`.
      2. Nel frontmatter, aggiungere `duplicaRigaSuGiorni` al `symbol` della fonte `src/lib/actions/righe-attivita.ts` (ruolo `inbound-commands`) e aggiungere due nuove fonti: `src/app/(front-office)/attivita/[data]/selettore-duplicazione.tsx` con ruolo `inbound-ui`, e `tests/e2e/duplica-riga-su-giorni.spec.ts` con ruolo `verification`. Verificare che ogni percorso dichiarato esista davvero su disco.
      3. Sezione `contracts`: aggiungere `duplicaRigaSuGiorni(rigaId, giorni)` all'elenco dei comandi, dichiarando che restituisce `{ success, error?, giorniCreati? }` e che, a differenza di `modificaRiga`, **riverifica sempre** coerenza offerta-cliente e abilitazione, perché crea righe nuove: una riga storica su offerta decaduta resta modificabile ed eliminabile ma non duplicabile.
      4. Sezione `flows`: aggiungere un punto che descrive il flusso osservato — dalla card della riga si apre un pannello modale, si compongono uno o più giorni arbitrari (non contigui, anche di mesi diversi), il giorno di origine è escluso e la conferma è indisponibile a elenco vuoto; alla conferma una sola `createMany` scrive tutte le righe o nessuna, e la pagina dichiara su quanti giorni la riga è stata replicata. Dichiarare esplicitamente che etichetta e importo del rimborso vengono **copiati dalla riga sorgente** e che il catalogo delle voci non viene interrogato.
      5. Sempre in `flows`, estendere il punto 9 (invalidazione dopo mutazione): una mutazione può ora toccare più giorni, quindi il dettaglio giornata invalida l'insieme dei giorni toccati e l'insieme dei **token di mese distinti**, mentre la rilettura forzata resta sul solo giorno visualizzato. È da qui che discende la valorizzazione delle celle di un mese diverso senza reload.
      6. Sezione `code`: aggiungere `selettore-duplicazione.tsx` alla riga «Isola giornata» (o creare la voce più appropriata) e i due nuovi file di test all'elenco «Test».
      7. Sezione `invariants`: annotare che la duplicazione non confronta le righe già presenti sui giorni di destinazione — aggiunge righe, non le deduplica — e che il giorno di origine è derivato con getter UTC dalla colonna `@db.Date`.
      8. Sezione `verification`: descrivere fedelmente ciò che i test provano davvero — negli unit, il payload `createMany` campo per campo, l'**assenza** di qualunque lettura di `voceRimborsoTrasferta`, i rifiuti su lista vuota/solo origine/data malformata e su offerta non attiva o non abilitata, tutti senza scrittura né invalidazione; negli e2e, i quattro scenari di `tests/e2e/duplica-riga-su-giorni.spec.ts`. Non attribuire ai test garanzie che non asseriscono.
      9. Eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner catalog` per rigenerare la navigazione.

      ## Verify

      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner validate --profile bootstrap`
      - Attendi: envelope `kind: "validation_result"` con `data.ok: true`. Le eventuali `warnings` vanno lette e risolte se banali; non sono bloccanti.
      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner status`
      - Attendi: `domains/attivita` risulta `generated`, pronta per la riconferma in accettazione — non va riportata a `reviewed` a mano.

      ## Done

      - [ ] La pagina `domains/attivita` descrive `duplicaRigaSuGiorni`, la sua regola di ammissibilità e la propagazione dello scatto di rimborso — conoscenza a supporto di **AC-2** e **AC-4**.
      - [ ] Il punto sull'invalidazione dopo mutazione copre l'insieme di giorni e mesi toccati — conoscenza a supporto di **AC-5**.
      - [ ] Tutti i marcatori `archetipo:wiki` preesistenti sono conservati e ogni percorso in `sources` esiste su disco.
      - [ ] `archetipo wiki validate --profile bootstrap` restituisce `data.ok: true`.

      ## Blockers

      None.
