    body: |-
      ## Objective

      `tests/e2e/duplica-riga-su-giorni.spec.ts` prova nel browser i cinque criteri della spec su entità create dalle factory e giorni riservati, restando deterministico con `fullyParallel: true`.

      ## Read

      - `tests/e2e/README.md` — contratto completo della suite: seed read-only, factory per i test mutanti, mesi riservati, selettori, idratazione.
      - `tests/e2e/support/fixtures.ts` — fixture `test` con `factory`, `collaboratore`, `clienteConOfferta`.
      - `tests/e2e/support/factory.ts` — `createCollaboratore`, `createClienteConOfferta`, `createOfferta({ attiva })`, `createAbilitazioneOfferta`, `createRigaAttivita` (accetta `rimborsoTrasfertaEtichetta` e `rimborsoTrasfertaImporto`, quindi la riga sorgente nasce con lo scatto già congelato senza passare dal catalogo).
      - `tests/e2e/support/date.ts` — `meseRiservato`, `dataNelMeseRiservato`, `mesePassatoRiservato`, `dataNelMesePassatoRiservato` e il commento su `SLOT_MESI_RISERVATI_ESCLUSIVI`.
      - `tests/e2e/support/auth.ts` — `accediComeCollaboratore(page, email)`.
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts` — attesa dell'idratazione dell'isola (`data-idratata`) prima di cliccare su handler client, e forma delle asserzioni sul dettaglio giornata.
      - `tests/e2e/calendario-salto-mese.spec.ts` — uso del campo «Vai a un mese specifico» e del pulsante «Vai al mese selezionato», e asserzioni su `cella-giorno` / `etichetta-cliente`.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — le celle sono `<Link data-testid="cella-giorno" href="/attivita/{data}?mese={token}" data-con-attivita="true|false">`.

      ## Change

      Nuovo file `tests/e2e/duplica-riga-su-giorni.spec.ts`.

      Non-goal: nessuna modifica a `tests/e2e/support/*` (gli helper esistenti bastano); nessuna registrazione in `SLOT_MESI_RISERVATI_ESCLUSIVI`, perché nessuna asserzione riguarda totali globali o vuoto di un mese; nessuno spec `demo__` (la registrazione video è di `archetipo-review`); nessun `page.reload()` negli scenari di AC-5.

      ## Steps

      1. Definire in cima le costanti dei giorni, tutte derivate dagli helper: `const MESE_ORIGINE = meseRiservato("US-057-DUPLICAZIONE")` con `GIORNO_ORIGINE = dataNelMeseRiservato("US-057-DUPLICAZIONE", 11)` e due destinazioni non contigue nello stesso mese (giorni 17 e 24); `const MESE_ALTRO = mesePassatoRiservato("US-057-DUPLICAZIONE")` con `GIORNO_ALTRO_MESE = dataNelMesePassatoRiservato("US-057-DUPLICAZIONE", 7)`; un `GIORNO_RIFIUTO = dataNelMeseRiservato("US-057-DUPLICAZIONE", 4)` per lo scenario AC-4.
      2. Scrivere un helper locale che prepara lo scenario nominale: dalla `factory`, un `collaboratore`, un `clienteConOfferta` con offerta attiva, una `createAbilitazioneOfferta` fra i due, e una `createRigaAttivita` sul `GIORNO_ORIGINE` con `ore: "6.00"`, una `nota` che contiene il namespace del test, `fatturabile: true`, `rimborsoTrasfertaEtichetta: "Trasferta US-057"` e `rimborsoTrasfertaImporto: "85.00"`. Costruire la `Date` del giorno con `new Date(\`${GIORNO}T12:00:00.000Z\`)`, coerente con la scrittura UTC dell'applicazione.
      3. In ogni test: `await accediComeCollaboratore(page, collaboratore.utente.email)`, poi `page.goto('/attivita/' + GIORNO_ORIGINE)` e attesa dell'idratazione dell'isola prima del primo click su un handler client (`expect(page.getByTestId('contenuto-giornata')).toHaveAttribute('data-idratata', 'true')`).
      4. **Scenario AC-1 + AC-2 + AC-5.** Cliccare `duplica-riga` sulla card della riga sorgente (individuata per ragione sociale del cliente factory). Nel selettore aggiungere le tre destinazioni: per ciascuna `fill` del campo `data-duplicazione` con il token e click su «Aggiungi data»; asserire che `conteggio-giorni-duplicazione` arriva a «3 giorni». Confermare con `conferma-duplicazione`. Asserire che `esito-duplicazione` è visibile e contiene «3 giorni». Poi, per ognuno dei tre giorni, navigare con il selettore data del dettaglio (`selettore-giorno`) — non con `goto`, così resta provato anche il percorso client — e asserire su quella giornata: una `activity-row` con la ragione sociale del cliente factory, il codice offerta della factory, `6.0 h`, il testo della nota, il badge `Fatt.` e la banda rimborso con `Trasferta US-057` ed `€ 85.00`. Quindi, **senza reload**, tornare al calendario con il link «Torna al calendario», portarsi su `MESE_ALTRO` con il campo mese «Vai a un mese specifico» + «Vai», e asserire che il link `cella-giorno` con `href` che inizia per `/attivita/${GIORNO_ALTRO_MESE}` ha `data-con-attivita="true"` e mostra una `etichetta-cliente` con la ragione sociale del cliente factory.
      5. **Scenario AC-3.** Aprire il selettore sulla riga sorgente e asserire, con pista vuota, che `conferma-duplicazione` è disabilitato. Provare ad aggiungere `GIORNO_ORIGINE`: asserire che `avviso-duplicazione` è visibile, che non esiste alcun `giorno-scelto` e che la conferma è ancora disabilitata. Aggiungere una data valida e asserire che la conferma diventa abilitata e che il conteggio dice «1 giorno».
      6. **Scenario AC-4.** Creare, per lo stesso collaboratore, un secondo cliente con offerta attiva **senza** `createAbilitazioneOfferta`, e una `createRigaAttivita` sul `GIORNO_ORIGINE` su quella offerta. Aprire il selettore da quella riga, aggiungere `GIORNO_RIFIUTO`, confermare, e asserire che `errore-duplicazione` è visibile con `role="alert"` e che `esito-duplicazione` non esiste. Poi aprire `GIORNO_RIFIUTO` e asserire che non esiste alcuna `activity-row` con quella ragione sociale — è la prova che nessuna riga è stata creata sul giorno scelto.
      7. Rispettare i vincoli del guardrail: nessuna email seed, nessun `waitForTimeout`, nessun `selectOption({ index })`, nessuna classe Tailwind come selettore, nessun XPath. Ogni attesa nasce da un'asserzione web-first.

      ## Verify

      - Esegui: `npx playwright test tests/e2e/duplica-riga-su-giorni.spec.ts --retries=0`
      - Attendi: tutti gli scenari verdi. Se fallisce per prerequisiti d'ambiente (`E2E_DATABASE_URL`, Chromium, client Prisma), risolvi il prerequisito — vedi la sezione Baseline — invece di ridurre le asserzioni.
      - Esegui: `npm run lint`
      - Attendi: verde. Il guardrail anti-flakiness gira dentro `npm run lint` e deve continuare a emettere solo i 9 avvisi preesistenti, senza errori nuovi.
      - Esegui: `npx playwright test --retries=0`
      - Attendi: intera suite verde, `fullyParallel: true` invariato e nessun `workers: 1`.

      ## Done

      - [ ] Il banner di esito dichiara «3 giorni» dopo tre destinazioni non contigue di cui una in un altro mese — **AC-1**.
      - [ ] Su ciascuno dei tre giorni la riga mostra cliente, offerta, `6.0 h`, nota, badge `Fatt.` ed etichetta/importo di rimborso identici a quelli della sorgente — **AC-2**.
      - [ ] Conferma disabilitata a pista vuota e giorno di origine rifiutato con avviso senza entrare in pista — **AC-3**.
      - [ ] Riga su offerta non abilitata: errore visibile e nessuna `activity-row` sul giorno scelto — **AC-4**.
      - [ ] La cella del giorno duplicato nel secondo mese risulta valorizzata raggiungendola con i controlli dell'app, senza alcun `page.reload()` nello scenario — **AC-5**.
      - [ ] Il file usa solo entità della factory e giorni riservati; `npm run lint` e l'intera suite Playwright restano verdi.

