    body: |-
      ## Objective

      L'intero incremento passa le stesse verifiche che eseguirebbe la CI, e la richiesta di review parte solo quando nessun task della spec è rimasto `TODO`.

      ## Read

      - La sezione **Baseline** di questo piano: `npm run lint`, `npm test` e `npx tsc --noEmit` erano tutti verdi, quindi qualunque fallimento qui è una regressione introdotta dall'incremento, mai un rosso preesistente da tollerare.
      - `.github/workflows/ci.yml` — la sequenza che la pipeline eseguirà: `npm ci`, `prisma migrate deploy`, `prisma db seed`, `npm run lint`, `npm test`, `npm run build`, `npm run test:e2e`. Questo gate la riproduce localmente nella stessa successione.
      - `tests/e2e/README.md`, sezione «Gate locale».

      ## Change

      Nessuna modifica di codice attesa. Se una verifica fallisce, la correzione appartiene al task che ha introdotto la regressione: correggila lì e rilancia questo gate da capo, non aggirare l'asserzione.

      ## Steps

      1. Da `/Users/smarello/repo/coaching-planner` eseguire, nell'ordine, i comandi della sezione **Verify**.
      2. Verificare che nessuna migrazione Prisma sia stata aggiunta o attesa: questa spec non tocca `prisma/schema.prisma`, quindi `npx prisma validate` deve passare e non deve esistere alcuna migrazione nuova non applicata.
      3. Solo quando tutte le verifiche sono verdi, marcare **questo** task come `DONE`.
      4. Poi ricaricare la spec con `archetipo spec show US-057` da `/Users/smarello/repo/coaching-planner` e confermare che **nessun** task risulta ancora `TODO`.
      5. Solo a quel punto invocare `archetipo spec review US-057`. L'ordine è vincolante: verifiche, gate `DONE`, ricarica della spec, controllo che non resti nulla `TODO`, richiesta di review.

      ## Verify

      - Esegui: `npm run lint`
      - Attendi: verde, con i **soli** 9 avvisi preesistenti del guardrail e2e su `tests/e2e/support/date.ts` e `support/report-data.ts`. Qualunque errore o avviso nuovo va corretto nel task d'origine.
      - Esegui: `npx tsc --noEmit`
      - Attendi: exit 0, nessuna diagnostica — la baseline era pulita.
      - Esegui: `npm test`
      - Attendi: verde; almeno i 670 test della baseline più quelli aggiunti da TASK-02, senza alcun fallimento.
      - Esegui: `npx prisma validate`
      - Attendi: schema valido, nessuna migrazione mancante.
      - Esegui: `npm run build`
      - Attendi: build Next completata senza errori.
      - Esegui: `npx playwright test tests/e2e/duplica-riga-su-giorni.spec.ts --retries=0`
      - Attendi: tutti gli scenari della spec verdi.
      - Esegui: `npx playwright test --retries=0`
      - Attendi: intera suite verde, con `fullyParallel: true` invariato e senza `workers: 1`. Come da `tests/e2e/README.md`, il gate di stabilità è **tre esecuzioni consecutive** verdi di questo comando.
      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner validate --profile bootstrap`
      - Attendi: `data.ok: true`.
      - Esegui: `archetipo spec show US-057`
      - Attendi: nessun task con stato `TODO`, incluso questo gate già marcato `DONE`.

      ## Done

      - [ ] `npm run lint`, `npx tsc --noEmit`, `npm test`, `npx prisma validate`, `npm run build` e l'intera suite Playwright sono verdi, senza alcuna diagnostica nuova sui file toccati rispetto alla baseline.
      - [ ] Tre esecuzioni consecutive di `npx playwright test --retries=0` risultano verdi, senza riduzione del parallelismo né aumento dei retry.
      - [ ] `archetipo wiki validate --profile bootstrap` restituisce `data.ok: true` per tutte e tre le pagine aggiornate.
      - [ ] Gli oracoli di **AC-1**, **AC-2**, **AC-3**, **AC-4** e **AC-5** risultano verdi nelle esecuzioni sopra.
      - [ ] `archetipo spec show US-057`, eseguito **dopo** aver marcato questo gate `DONE`, non riporta alcun task `TODO`; solo allora viene invocato `archetipo spec review US-057`.

      ## Blockers

      None.
