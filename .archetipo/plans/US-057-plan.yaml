      ## Steps

      1. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner reset decisions/cache-client-calendario-collaboratore`.
      2. Nel frontmatter aggiungere `tests/e2e/duplica-riga-su-giorni.spec.ts` con ruolo `verification`; verificare che le fonti già dichiarate esistano ancora tutte.
      3. Sezione `decision`: nel paragrafo sull'invalidazione dopo una mutazione, sostituire l'assunto implicito «una mutazione tocca un giorno» con il contratto attuale: il dettaglio giornata invalida l'**insieme** dei giorni toccati e l'**insieme dei token di mese distinti** che li contengono, con una sola chiamata varargs per cache; la rilettura forzata resta sul solo giorno visualizzato, perché forzare la rilettura di giorni che l'utente non sta guardando produrrebbe N richieste inutili.
      4. Sezione `consequences`: annotare che i giorni e i mesi soltanto invalidati non vengono riletti subito ma al primo ingresso, ed è precisamente questo che rende valorizzate le celle di un mese diverso senza reload; e che, come già per il giorno singolo, l'invalidazione neutralizza anche le risposte già in volo.
      5. Sezione `verification`: registrare che le semantiche di `invalidate` con più chiavi sono già coperte da `tests/unit/cache-dati-scheda.test.ts` senza modifiche, e che l'estensione ha una verifica **browser** dedicata — lo scenario di `tests/e2e/duplica-riga-su-giorni.spec.ts` che raggiunge il mese di destinazione con i controlli dell'app, senza alcun `page.reload()`, e osserva la cella valorizzata. Dichiarare che non esiste un unit test del wiring nell'isola, e perché: l'oracolo di quel comportamento è la cella del calendario, osservabile solo nel browser.
      6. Eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner catalog`.

      ## Verify

      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner validate --profile bootstrap`
      - Attendi: `data.ok: true`.
      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner status`
      - Attendi: `decisions/cache-client-calendario-collaboratore` risulta `generated`, con `decision_status` ancora `accepted`.

      ## Done

      - [ ] Il contratto di invalidazione documentato copre l'insieme dei giorni e dei mesi toccati — conoscenza a supporto di **AC-5**.
      - [ ] La sezione `verification` dichiara dove vive l'evidenza e perché non esiste un unit test del wiring.
      - [ ] `decision_status` resta `accepted` e tutti i marcatori `archetipo:wiki` sono conservati.
      - [ ] `archetipo wiki validate --profile bootstrap` restituisce `data.ok: true`.

      ## Blockers

      None.
