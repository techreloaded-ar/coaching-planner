  - id: TASK-03
    title: Invalidazione dopo mutazione estesa a più giorni e più mesi nell'isola giornata
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Una mutazione che tocca più giorni invalida nella cache di scheda **tutti** quei giorni e **tutti** i token di mese distinti che li contengono, non solo il giorno visualizzato e il suo mese.

      ## Read

      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx` — `invalidaDopoMutazione` (attualmente `async (giorno: string) => ...`, che fa `cacheCalendario?.invalidate(giorno.slice(0, 7))`, `cacheGiornate.invalidate(giorno)` e `await cacheGiornate.revalida(giorno)`), e il commento che ne spiega la complementarietà con `revalidatePath`.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — la prop `onMutazioneCompletata: (giorno: string) => void | Promise<void>` e l'helper locale `invalidaDopoMutazione` che la avvolge in `startTransition`.
      - `src/app/(front-office)/attivita/attivita-cache-provider.tsx` — le firme `invalidate(...token: string[])` di `ApiCacheCalendario` e `invalidate(...data: string[])` di `ApiCacheGiornate`: accettano già più chiavi, non serve toccarle.

      ## Change

      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx` — allargare `invalidaDopoMutazione`.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — allargare il tipo della prop `onMutazioneCompletata` e l'helper locale che la invoca.

      Non-goal: nessuna modifica alle classi di cache o al provider; nessuna modifica al comportamento dei percorsi a giorno singolo (creazione, modifica, eliminazione, rimozione rimborso devono continuare a invalidare esattamente ciò che invalidavano prima); nessun `router.refresh()` aggiuntivo.

      ## Steps

      1. In `isola-giornata.tsx` cambiare la firma in `async (giorno: string, giorniAggiuntivi?: readonly string[]) => { ... }`. Il primo parametro resta il giorno **visualizzato**, per la ragione già documentata nel commento esistente.
      2. Dentro la callback calcolare `const giorniToccati = [...new Set([giorno, ...(giorniAggiuntivi ?? [])])];` e `const mesiToccati = [...new Set(giorniToccati.map((g) => g.slice(0, 7)))];`.
      3. Sostituire `cacheCalendario?.invalidate(giorno.slice(0, 7))` con `cacheCalendario?.invalidate(...mesiToccati)` e `cacheGiornate.invalidate(giorno)` con `cacheGiornate.invalidate(...giorniToccati)`.
      4. Lasciare invariata la rilettura forzata: `await cacheGiornate.revalida(giorno)` continua a riguardare il **solo** giorno visualizzato. I giorni di destinazione restano invalidati e verranno riletti al primo ingresso; forzarne la rilettura qui produrrebbe N richieste per dati che l'utente non sta guardando.
      5. Aggiornare il commento JSDoc sopra la callback spiegando che i giorni aggiuntivi sono quelli toccati da una mutazione multi-giorno (duplicazione) e che è da qui che discende la valorizzazione delle celle di un altro mese senza reload.
      6. Lasciare invariato il ramo senza provider (`if (!cacheGiornate) { router.refresh(); return; }`).
      7. In `dettaglio-giornata.tsx` allargare il tipo della prop a `(giorno: string, giorniAggiuntivi?: readonly string[]) => void | Promise<void>` e l'helper locale a `useCallback((giorniAggiuntivi?: readonly string[]) => { startTransition(async () => { await onMutazioneCompletata(data, giorniAggiuntivi); }); }, [data, onMutazioneCompletata])`. Le quattro chiamate esistenti (submit, elimina, rimuovi rimborso) restano invocazioni senza argomenti e mantengono il comportamento attuale.

      ## Verify

      - Esegui: `npx tsc --noEmit`
      - Attendi: exit 0. Il parametro opzionale non deve rendere necessario alcun cast nei chiamanti esistenti.
      - Esegui: `npm test`
      - Attendi: verde. `tests/unit/cache-dati-scheda.test.ts` e `tests/unit/calendario-cache-provider.test.ts` provano le semantiche di `invalidate` con più chiavi e devono restare verdi senza modifiche.
      - Esegui: `npm run lint`
      - Attendi: verde, con i soli 9 avvisi preesistenti.

      ## Done

      - [ ] `invalidaDopoMutazione` accetta giorni aggiuntivi e invalida l'insieme dei giorni e dei token di mese **distinti**, con un'unica chiamata varargs per cache — è la precondizione tecnica di **AC-5**.
      - [ ] I percorsi a giorno singolo invalidano esattamente ciò che invalidavano prima: nessun test unit preesistente cambia.
      - [ ] `npx tsc --noEmit`, `npm test` e `npm run lint` restano verdi.

      ## Blockers

      None.
    ref: TASK-03
  - id: TASK-04
    title: Componente client del selettore di duplicazione su più giorni
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Un pannello modale permette di comporre l'elenco dei giorni di destinazione, tiene la conferma non disponibile finché l'elenco è vuoto, rifiuta il giorno di origine e mostra l'errore del server senza perdere le date già scelte.

      ## Read

      - `docs/mockups/US-057/index.html`, `selettore-vuoto.html` ed `esito-errore.html` con `docs/mockups/US-057/shared.css` — layout, gerarchia, testi e stati del selettore. Il mockup è il riferimento visivo: pannello con scheda della riga di origine, campo data + «Aggiungi data», pista dei giorni raggruppati per mese, conteggio, «Annulla» e conferma.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — convenzioni Tailwind dell'area (raggi `rounded-[8px]`/`[11px]`, palette `rose`/`zinc`/`amber`/`red`, coppie `dark:`), l'uso di `PulsanteAttesa` e il blocco che rende la banda del rimborso fotografato.
      - `src/components/pulsante-attesa.tsx` — la prop `attesaEsterna` e `etichettaAttesa`.
      - `src/domain/calendario/index.ts` — `parseDataGiorno`, unica validazione ammessa per un token giorno lato client.
      - `src/lib/attivita-contract.ts` — `RigaAttivitaClient`.
      - `src/lib/actions/righe-attivita.ts` — firma e messaggi d'errore di `duplicaRigaSuGiorni` come lasciati da TASK-01.

      ## Change

      Nuovo file `src/app/(front-office)/attivita/[data]/selettore-duplicazione.tsx`, client component (`"use client"`).

      Non-goal: nessuna libreria di dialog o di date; nessun focus trap; nessuna modifica al form di inserimento/modifica riga; nessuna modifica a `dettaglio-giornata.tsx` in questo task (è TASK-05); nessuna persistenza dell'elenco fra aperture.

      ## Steps

      1. Dichiarare le props:
         ```ts
         interface SelettoreDuplicazioneProps {
           riga: RigaAttivitaClient;
           giornoOrigine: string;
           onChiudi: () => void;
           onDuplicata: (giorniDestinazione: string[], giorniCreati: number) => void;
         }
         ```
      2. Stato locale: `dataCandidata: string`, `giorniScelti: string[]`, `avviso: string | null`, `errore: string | null`, `inCorso: boolean`.
      3. Render dell'involucro: un overlay a tutto schermo con `role="dialog"`, `aria-modal="true"`, `aria-labelledby` sull'id del titolo e `data-testid="selettore-duplicazione"`. Il click sullo sfondo chiude (`onChiudi`) solo se il bersaglio dell'evento è l'overlay stesso; un `useEffect` registra un listener `keydown` che chiude su `Escape` e lo rimuove allo smontaggio.
      4. Scheda della riga di origine: giorno di origine in forma estesa, ragione sociale, `codice — descrizione` dell'offerta, ore, fatturabilità e, se `riga.rimborsoTrasfertaEtichetta != null`, l'etichetta con l'importo formattato `€ {parseFloat(importo).toFixed(2)}`. Serve a rendere visibile ciò che verrà copiato.
      5. Campo di aggiunta: `<label htmlFor>` con testo «Aggiungi un giorno di destinazione», `<input type="date" data-testid="data-duplicazione">` controllato da `dataCandidata`, e un `<button type="button">Aggiungi data</button>`. Un testo di aiuto dichiara esplicitamente che il giorno di origine non è selezionabile e che si possono aggiungere giorni non consecutivi e di mesi diversi.
      6. Handler `aggiungi()`:
         - `parseDataGiorno(dataCandidata)` falso → `avviso` «Scegli una data valida.» e ritorno;
         - `dataCandidata === giornoOrigine` → `avviso` «Il giorno di origine non è fra le destinazioni selezionabili.» e ritorno, **senza** modificare `giorniScelti`;
         - già presente in `giorniScelti` → `avviso` «Questo giorno è già fra le destinazioni scelte.» e ritorno;
         - altrimenti aggiunge, riordina crescente, azzera `dataCandidata` e `avviso`.
         Collegare lo stesso handler al tasto Invio sul campo data (`onKeyDown` con `preventDefault`).
      7. Pista dei giorni scelti: se `giorniScelti` è vuoto mostrare un blocco di stato vuoto con `data-testid="pista-duplicazione-vuota"`; altrimenti raggruppare per token di mese (`giorno.slice(0, 7)`), con l'etichetta estesa del mese e, per ogni giorno, un elemento `data-testid="giorno-scelto"` che porta il giorno e un pulsante di rimozione con `aria-label` contenente la data estesa. Un contatore `data-testid="conteggio-giorni-duplicazione"` mostra `1 giorno` / `N giorni`.
      8. Avviso inline con `data-testid="avviso-duplicazione"` e `role="status"`, reso solo quando `avviso` è valorizzato. Errore con `data-testid="errore-duplicazione"` e `role="alert"`, reso solo quando `errore` è valorizzato.
      9. Footer: «Annulla» (`onChiudi`, disabilitato mentre `inCorso`) e la conferma come `PulsanteAttesa` con `type="button"`, `data-testid="conferma-duplicazione"`, `attesaEsterna={inCorso}`, `etichettaAttesa="Duplicazione…"`, `disabled={giorniScelti.length === 0}` ed etichetta `Duplica` / `Duplica su N giorni`.
      10. Handler `conferma()`: esce subito se `giorniScelti` è vuoto; azzera `errore`, imposta `inCorso`, chiama `await duplicaRigaSuGiorni(riga.id, giorniScelti)` dentro `try/finally` che riazzera `inCorso`. Su `success: false` imposta `errore` con `result.error ?? "Duplicazione non riuscita"` e **lascia il pannello aperto con le date invariate** (AC-4: il lavoro fatto non va perso). Su successo invoca `onDuplicata(giorniScelti, result.giorniCreati ?? giorniScelti.length)` e non chiude da sé: la chiusura è del chiamante.

      ## Verify

      - Esegui: `npx tsc --noEmit`
      - Attendi: exit 0.
      - Esegui: `npm run lint`
      - Attendi: verde. Attenzione alla regola `react-hooks/set-state-in-effect` già rispettata altrove nell'area: nessun `setState` sincrono dentro un effetto.
      - Esegui: `npm run build`
      - Attendi: build completata senza errori — è la verifica che il nuovo client component non violi i confini server/client dell'App Router.

      ## Done

      - [ ] Il pannello espone `role="dialog"` e `aria-modal="true"` e si chiude con Esc, «Annulla» e click sullo sfondo.
      - [ ] Con zero date scelte il pulsante `conferma-duplicazione` è `disabled` — evidenza per **AC-3**.
      - [ ] Il tentativo di aggiungere `giornoOrigine` produce `avviso-duplicazione` e non incrementa il conteggio — evidenza per **AC-3**.
      - [ ] Un rifiuto del server è reso in `errore-duplicazione` con `role="alert"` mantenendo le date scelte — evidenza per **AC-4**.
      - [ ] Il componente accetta date non contigue e di mesi diversi e le raggruppa per mese — evidenza per **AC-1**.
      - [ ] L'aspetto segue `docs/mockups/US-057/`; `npx tsc --noEmit`, `npm run lint` e `npm run build` restano verdi.

      ## Blockers

      None.
    ref: TASK-04
  - id: TASK-05
    title: Azione "Duplica..." sulla riga e banner di esito nel dettaglio giornata
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective

      Ogni riga salvata espone «Duplica…», apre il selettore, e alla conferma la pagina mostra su quanti giorni la riga è stata replicata invalidando tutti i giorni e i mesi coinvolti.

      ## Read

      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — il blocco «Pulsanti azione» dentro `righe.map(...)` (i tre `PulsanteAttesa` Modifica / Rimuovi rimborso / Elimina con `attesaEsterna={rigaInAttesaId === riga.id}`), l'helper locale `invalidaDopoMutazione` come lasciato da TASK-03, e la sezione intestazione/riepilogo dove va inserito il banner.
      - `src/app/(front-office)/attivita/[data]/selettore-duplicazione.tsx` — props del componente creato in TASK-04.
      - `docs/mockups/US-057/index.html` — posizione di «Duplica…» nella barra azioni e forma del banner di esito.

      ## Change

      Solo `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx`.

      Non-goal: nessuna modifica al form di inserimento/modifica; nessuna modifica agli altri tre pulsanti di riga; nessuna modifica ai KPI di riepilogo; nessuna duplicazione di più righe in un colpo solo.

      ## Steps

      1. Importare `SelettoreDuplicazione`.
      2. Aggiungere due stati locali: `rigaDaDuplicare: RigaAttivitaClient | null` (inizialmente `null`) ed `esitoDuplicazione: { giorniCreati: number; giorni: string[] } | null`.
      3. Nella barra azioni di ogni riga, fra «Modifica» e «Rimuovi rimborso», aggiungere un `PulsanteAttesa` con `type="button"`, `data-testid="duplica-riga"`, `attesaEsterna={rigaInAttesaId === riga.id}`, etichetta `Duplica…` e `onClick={() => { setEsitoDuplicazione(null); setRigaDaDuplicare(riga); }}`. Stile coerente con il mockup: bordo e testo `rose`, non il neutro di «Modifica».
      4. Rendere il selettore in coda al componente, solo quando `rigaDaDuplicare` è valorizzato:
         ```tsx
         {rigaDaDuplicare && (
           <SelettoreDuplicazione
             riga={rigaDaDuplicare}
             giornoOrigine={data}
             onChiudi={() => setRigaDaDuplicare(null)}
             onDuplicata={gestisciDuplicazione}
           />
         )}
         ```
      5. Scrivere `gestisciDuplicazione` come `useCallback((giorniDestinazione: string[], giorniCreati: number) => { setRigaDaDuplicare(null); setEsitoDuplicazione({ giorniCreati, giorni: giorniDestinazione }); invalidaDopoMutazione(giorniDestinazione); }, [invalidaDopoMutazione])`. È qui che i giorni di destinazione raggiungono l'isola: l'helper allargato in TASK-03 li inoltra come `giorniAggiuntivi`, e da lì discende l'invalidazione dei mesi diversi da quello di partenza.
      6. Rendere il banner sopra l'elenco delle righe, subito dopo l'intestazione della giornata, quando `esitoDuplicazione` è valorizzato: contenitore con `data-testid="esito-duplicazione"` e `role="status"`, testo `Riga replicata su {n} giorno` / `giorni` (singolare per `n === 1`), l'elenco delle date in forma estesa riusando l'helper `dataEstesa` già presente nel file, e un pulsante di chiusura che azzera lo stato. Colori verdi coerenti con il mockup (`emerald`), con la coppia `dark:`.
      7. Verificare che il remount al cambio giorno continui a valere: `isola-giornata.tsx` passa `key={giornoVisualizzato}`, quindi banner e selettore si azzerano da soli cambiando giorno. Non aggiungere alcun effetto per farlo.

      ## Verify

      - Esegui: `npx tsc --noEmit`
      - Attendi: exit 0.
      - Esegui: `npm run lint`
      - Attendi: verde, con i soli 9 avvisi preesistenti.
      - Esegui: `npm test`
      - Attendi: verde, nessuna regressione.
      - Esegui: `npm run build`
      - Attendi: build completata senza errori.

      ## Done

      - [ ] Ogni riga salvata espone «Duplica…» (`data-testid="duplica-riga"`) che apre il selettore, e alla conferma compare `esito-duplicazione` con il numero di giorni replicati — evidenza per **AC-1**.
      - [ ] Il selettore riceve `giornoOrigine={data}`, cioè il giorno **visualizzato** — evidenza per **AC-3**.
      - [ ] `gestisciDuplicazione` inoltra i giorni di destinazione a `invalidaDopoMutazione`, che invalida anche i mesi diversi da quello di partenza — evidenza per **AC-5**.
      - [ ] Il form di inserimento/modifica riga e gli altri tre pulsanti di riga sono invariati.
      - [ ] `npx tsc --noEmit`, `npm run lint`, `npm test` e `npm run build` restano verdi.

