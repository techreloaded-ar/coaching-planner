schema: archetipo/plan/v2
spec_code: US-057
body: "# US-057: Duplicazione di una riga attività su più giorni scelti — Piano di implementazione\n\n**Generato da:** Team di Planning ARchetipo\n**Data:** 2026-08-06\n\n---\n\n## Spec\n\n**Epic:** EP-005 — Evoluzioni Post-MVP\n**Priorità:** HIGH | **Punti:** 3\n**Bloccata da:** -\n\n**Storia Utente**\nCome collaboratore, voglio duplicare una riga attività già salvata su più giorni che scelgo io, così da registrare in un solo passaggio lo stesso lavoro svolto su giorni diversi senza riaprire e ricompilare ogni giornata.\n\n**Criteri di Accettazione**\n\n- **AC-1** — Ogni riga già salvata nel dettaglio giornata espone un'azione di duplicazione che apre un selettore in cui il revisore aggiunge una o più date arbitrarie, anche non contigue e appartenenti a mesi diversi; alla conferma la pagina mostra un esito che indica su quanti giorni la riga è stata replicata.\n- **AC-2** — Ogni riga creata riporta gli stessi cliente, offerta, ore, nota e fatturabilità della riga di origine e la stessa coppia etichetta/importo di rimborso trasferta già congelata su di essa, senza rileggere il catalogo corrente delle voci di rimborso.\n- **AC-3** — Il giorno di origine non è fra le destinazioni selezionabili e la conferma resta non disponibile finché non è stata scelta almeno una data.\n- **AC-4** — Se l'offerta della riga di origine non è più attiva o non è più abilitata per il collaboratore corrente, la duplicazione è rifiutata con un messaggio di errore visibile e nessuna riga viene creata su nessuno dei giorni scelti.\n- **AC-5** — Dopo una duplicazione che ha coinvolto un giorno di un mese diverso da quello di provenienza, il calendario mostra le celle di quel mese valorizzate con le nuove righe senza che il revisore debba ricaricare la pagina.\n\n**Fuori Perimetro**\nNessuna modifica al form di inserimento e modifica riga, alle validazioni delle action esistenti o al riepilogo mensile. Nessuna multi-selezione di celle nel calendario e nessun blocco «ripeti su intervallo» con filtro dei giorni lavorativi. Nessun rilevamento di righe già presenti o duplicate sui giorni di destinazione: la duplicazione aggiunge righe, non le confronta. Nessuna duplicazione di più righe di origine in un unico passaggio.\n\n---\n\n## Soluzione Tecnica\n\nLa duplicazione è **un nuovo comando del dominio Attività**, non un ciclo di `creaRiga` guidato dal client. La differenza è sostanziale: un ciclo lato browser produrrebbe scritture parziali quando l'offerta non è più ammissibile (AC-4 chiede esplicitamente «nessuna riga su nessuno dei giorni scelti»), N round-trip e N invalidazioni. Una sola server action verifica una volta le condizioni di ammissibilità e scrive tutte le righe con una sola istruzione `createMany`, che è atomica per costruzione.\n\n- **Comando** — `duplicaRigaSuGiorni(rigaId, giorni: string[])` in `src/lib/actions/righe-attivita.ts`, con la stessa forma delle action esistenti a parametri espliciti (`eliminaRiga`, `rimuoviRimborsoTrasferta`), che restituisce `{ success, error?, giorniCreati? }`. La riga di origine viene caricata **una sola volta** estendendo la `select` dell'helper già esistente `caricaRigaDelCollaboratore`, che oggi legge `collaboratoreId, offertaId, clienteId` e passerà a leggere anche `data, ore, nota, fatturabile, rimborsoTrasfertaEtichetta, rimborsoTrasfertaImporto`. Gli altri tre chiamanti continuano a usarne solo due campi: la firma si allarga, il comportamento no.\n- **Ammissibilità** — la duplicazione **crea** righe, quindi vale la regola della creazione e non quella della modifica: `verificaOffertaCliente` e `verificaAbilitazioneOfferta` vengono rieseguite sempre, sulla coppia offerta/cliente della riga di origine. È la ragione per cui una riga storica resta modificabile ed eliminabile ma **non** duplicabile quando l'offerta è decaduta (AC-4).\n- **Fotografia del rimborso** — etichetta e importo vengono copiati dalla riga di origine, non rifotografati dal catalogo. `fotografaVoceRimborsoTrasferta` non viene invocata affatto: sulla riga sorgente il valore è già congelato, e rileggerlo dal catalogo corrente romperebbe proprio la garanzia di [Fotografia del rimborso trasferta sulla riga attività](/decisions/fotografia-rimborso-trasferta.md). Questo è l'oracolo osservabile di AC-2, e va verificato come tale (nessuna lettura di `voceRimborsoTrasferta`), non come semplice uguaglianza di due stringhe.\n- **Normalizzazione delle date** — la lista in ingresso viene ripulita lato server prima di scrivere: formato `YYYY-MM-DD` obbligatorio, deduplica, esclusione del giorno di origine, rifiuto della lista vuota. La UI applica le stesse regole per rendere l'errore impossibile da raggiungere (AC-3), ma il server non si fida della UI. Il giorno di origine è derivato con getter **UTC** da `RigaAttivita.data` (colonna `@db.Date`, che Prisma restituisce a mezzanotte UTC), coerentemente con la scrittura `Date.UTC(anno, mese-1, giorno, 12)` già usata da `creaRiga`.\n- **Selettore di date** — nuovo componente client `selettore-duplicazione.tsx` accanto al dettaglio giornata: un pannello modale (`role=\"dialog\"`, `aria-modal=\"true\"`) con un campo data, un pulsante «Aggiungi data», l'elenco rimovibile dei giorni scelti raggruppati per mese, il conteggio e la conferma. È il primo componente modale del codebase: resta deliberatamente minimale — nessuna libreria, nessun focus trap, chiusura con Esc, «Annulla» e click sullo sfondo.\n- **Invalidazione multi-giorno e multi-mese** — è il punto che rende vero AC-5. Oggi `invalidaDopoMutazione` in `isola-giornata.tsx` invalida esattamente **un** giorno e **un** mese, perché finora ogni mutazione toccava un giorno solo. Il contratto della callback si allarga a `(giornoVisualizzato, giorniAggiuntivi?)`: l'isola calcola l'insieme dei giorni toccati, ne deriva i token di mese distinti e invalida entrambe le cache in un colpo solo (`invalidate` accetta già varargs su tutte e tre le cache). La rilettura forzata resta sul solo giorno visualizzato; i mesi invalidati si ripopolano al primo ingresso, che è esattamente ciò che rende le celle valorizzate senza reload.\n- **Invalidazione server** — l'action fa `revalidatePath` su ciascun giorno di destinazione, oltre a `/attivita/riepilogo` e `/attivita`, mantenendo la simmetria con le quattro action esistenti. Le due mitigazioni (SSR/RSC e cache di scheda) restano complementari, come già documentato.\n\n### Decisioni Architetturali\n\n**Nessun nuovo ADR è richiesto.** La soluzione non introduce alternative che tocchino modello dati persistente, modello di sicurezza, confine di integrazione, topologia di deploy o una policy tecnica trasversale: aggiunge una quinta server action accanto alle quattro esistenti, riusando le stesse guardie (`richiediCollaboratoreOperativo`, `caricaRigaDelCollaboratore`, `verificaOffertaCliente`, `verificaAbilitazioneOfferta`) e la stessa forma di risultato. Lo schema Prisma non cambia e non serve alcuna migrazione.\n\nDue scelte locali sono comunque registrate qui perché il piano non deve lasciarle all'implementatore:\n\n1. **`createMany` invece di un ciclo di `create` in transazione esplicita.** Una sola istruzione è già atomica e non richiede `$transaction`; l'alternativa aggiungerebbe una transazione senza migliorare la garanzia. Conseguenza accettata: `createMany` non restituisce le righe create, ma al chiamante serve solo il conteggio.\n2. **Riverifica dell'abilitazione anche sulla riga storica.** L'alternativa — riusare la clemenza di `modificaRiga`, che a parità di offerta non ricontrolla — è scartata perché lì si aggiorna una riga già esistente, mentre qui se ne creano di nuove: è AC-4 a chiederlo, ed è coerente con `creaRiga`.\n\nDue decisioni già accettate vengono **estese**, non sostituite, e per questo compaiono in `wiki_impact.update`: la fotografia del rimborso guadagna il caso «propagazione di uno scatto già esistente», e la cache client dell'area attività guadagna il caso «una mutazione può toccare più giorni e più mesi».\n\n---\n\n## Baseline\n\nMisurata su `main` alla revisione `09dc45d`, dalla radice del progetto.\n\n| Verifica | Esito prima dell'implementazione | Conseguenza per il piano |\n|---|---|---|\n| `npm run lint` | **Verde.** ESLint pulito; il guardrail e2e passa emettendo 9 avvisi «chiave riservata non risolvibile staticamente» su `tests/e2e/support/date.ts` e `support/report-data.ts` — sono avvisi preesistenti sugli helper, non errori, e non fanno fallire il comando. | Ogni task che tocca e2e può promettere `Expect: verde`. Gli avvisi preesistenti non devono aumentare né essere «risolti»: sono strutturali agli helper. |\n| `npm test` (Vitest) | **Verde.** 40 file, 670 test. | I task unit possono promettere `Expect: verde`, con il conteggio atteso in crescita. |\n| `npx tsc --noEmit` | **Verde**, exit 0, nessuna diagnostica. | Nessun file toccato dal piano parte da uno stato degradato: qualunque nuova diagnostica introdotta è una regressione del task che l'ha prodotta. |\n| `npx playwright test` | **Non eseguita in planning.** Richiede prerequisiti d'ambiente, non è una verifica di codice. | Vedi i prerequisiti qui sotto: il task e2e li deve soddisfare prima di dichiarare un fallimento come difetto del codice. |\n\n### Prerequisiti d'ambiente (distinti dai fallimenti di codice)\n\nLa suite e2e non è eseguibile senza:\n\n- `E2E_DATABASE_URL` che punti a un database PostgreSQL **dedicato** (`global-setup.ts` rifiuta un database non e2e o non vuoto), oltre alle variabili già usate in CI (`SESSION_SECRET`, `AUTH_SECRET`, `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`, `NEXT_PUBLIC_APP_URL`, `E2E_TEST_MODE=true`);\n- il client Prisma generato (`npm run db:generate`, eseguito comunque da `postinstall`, `dev` e `build`);\n- il browser Chromium di Playwright (`npx playwright install --with-deps chromium`).\n\n`global-setup.ts` applica migrazioni e seed da sé. Se uno di questi prerequisiti manca, il fallimento è d'ambiente e va risolto, non aggirato riducendo le asserzioni.\n\n### Vincoli permanenti sul lavoro e2e\n\nDalle regole di progetto (`AGENTS.md`, `tests/e2e/README.md`), che il guardrail di lint verifica staticamente:\n\n- `fullyParallel: true` resta; non si stabilizza un test con `workers: 1`, serializzazioni o retry aggiuntivi;\n- i test mutanti usano `tests/e2e/support/fixtures.ts` e le factory, mai entità seed (Giulia Conti, TechSolutions, DataFlow);\n- clienti e offerte si selezionano per label o value derivati dalla factory, mai con `selectOption({ index })`;\n- niente hard wait, niente selettori su classi Tailwind, niente XPath;\n- i giorni e i mesi usati vengono da `tests/e2e/support/date.ts` (`meseRiservato` / `dataNelMeseRiservato`).\n\n---\n\n## Mappa delle Evidenze di Accettazione\n\n| Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che la produce |\n|---|---|---|---|---|\n| AC-1 | E2E: collaboratore, cliente, offerta attiva e abilitazione creati dalla factory; una riga sorgente nel giorno `dataNelMeseRiservato(\"US-057-DUPLICAZIONE\", 11)`. Unit: riga sorgente mockata. | E2E (browser) + unit | E2E: dopo aver aggiunto tre date non contigue di cui una in un altro mese e confermato, il banner `esito-duplicazione` contiene il testo «3 giorni»; aprendo ciascuno dei tre giorni compare una `activity-row` con la ragione sociale del cliente factory. Unit: `duplicaRigaSuGiorni` restituisce `{ success: true, giorniCreati: 3 }` e `createMany` riceve esattamente tre record con le tre date attese. | TASK-06 (E2E), TASK-02 (unit) |\n| AC-2 | Riga sorgente creata dalla factory con `rimborsoTrasfertaEtichetta: \"Trasferta US-057\"` e `rimborsoTrasfertaImporto: \"85.00\"`, nota e `fatturabile` espliciti. | E2E (browser) + unit | E2E: su ogni giorno di destinazione la card riga mostra ragione sociale, codice offerta, `6.0 h`, la nota, il badge `Fatt.` e la banda rimborso con `Trasferta US-057` e `€ 85.00`. Unit: il payload `createMany` riporta gli stessi `clienteId, offertaId, ore, nota, fatturabile, rimborsoTrasfertaEtichetta, rimborsoTrasfertaImporto` della sorgente **e** `mockVoceRimborsoTrasferta.findUnique` non è mai stato invocato — è l'assenza della lettura di catalogo, non l'uguaglianza dei valori, a provare la propagazione dello scatto. | TASK-06 (E2E), TASK-02 (unit) |\n| AC-3 | Selettore appena aperto sulla riga sorgente. | E2E (browser) + unit | E2E: con zero date scelte il pulsante `conferma-duplicazione` è `disabled`; scegliendo il giorno di origine compare `avviso-duplicazione` e il conteggio resta a zero con la conferma ancora `disabled`; aggiunta una data valida la conferma diventa abilitata. Unit: la action rifiuta lista vuota, lista contenente solo il giorno di origine e data malformata, in tutti e tre i casi senza invocare `createMany`. | TASK-06 (E2E), TASK-02 (unit) |\n| AC-4 | Seconda riga sorgente del medesimo collaboratore su un'offerta factory **senza** `AbilitazioneOfferta` (e caso gemello con `attiva: false` a livello unit), in un giorno riservato distinto. | E2E (browser) + unit | E2E: dopo la conferma compare `errore-duplicazione` con `role=\"alert\"`; aprendo il giorno di destinazione scelto il contatore «Righe registrate» resta `0` e non esiste alcuna `activity-row`. Unit: `createMany` non è mai invocato e `revalidatePath` non è mai invocato. | TASK-06 (E2E), TASK-02 (unit) |\n| AC-5 | Duplicazione già eseguita nello scenario AC-1, con un giorno in un secondo mese riservato. | E2E (browser) | Senza alcun `page.reload()`: dal dettaglio giornata si torna al calendario con «Torna al calendario», si raggiunge il mese di destinazione con il campo «Vai a un mese specifico» + «Vai», e la cella `cella-giorno` con `href` del giorno duplicato espone `data-con-attivita=\"true\"` e la `etichetta-cliente` con la ragione sociale del cliente factory. | TASK-06 |\n\nLa mappa è una mappa di accettazione, non un riepilogo dei task. Nessun doppio di test nasconde un oracolo: negli unit il solo confine mockato è Prisma/DAL, e l'oracolo di AC-2 è proprio una chiamata Prisma **assente**; negli e2e non è mockato nulla e le asserzioni sono sul DOM reale prodotto dal server.\n\n---\n\n## Strategia di Test\n\nDue livelli, con confini netti: gli unit provano il **contratto del comando** (cosa viene scritto, cosa non viene letto, cosa viene rifiutato), gli e2e provano il **percorso osservabile dell'utente** (cosa vede il revisore nel browser).\n\n- Gli unit vivono in `tests/unit/righe-attivita-actions.test.ts`, che già mocka `@/lib/db`, `@/lib/dal` e `next/cache` con `vi.hoisted`: il nuovo blocco `describe(\"duplicaRigaSuGiorni\")` riusa quelle strutture e aggiunge `createMany` al mock di `rigaAttivita`. Gli helper già presenti `aspettatiPercorsiInvalidati` e `aspettataNessunaInvalidazione` restano il contratto di invalidazione.\n- Non viene aggiunto alcun unit test sul wiring dell'invalidazione multi-mese in `isola-giornata.tsx`: le semantiche di `invalidate` con più chiavi sono già provate su `CacheDatiScheda` (`tests/unit/cache-dati-scheda.test.ts`), e ciò che questa spec aggiunge — che il **calendario del mese di destinazione** si valorizzi senza reload — è osservabile solo nel browser. È esattamente lo scenario AC-5.\n- Nessuna asserzione su totali globali del mese: i mesi riservati per hash bastano, e la chiave **non** va registrata in `SLOT_MESI_RISERVATI_ESCLUSIVI`. Ogni asserzione è ancorata a entità della factory (ragione sociale, codice offerta, nota), quindi righe estranee di altri worker nello stesso mese sono innocue.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright (`tests/e2e/`, `fullyParallel: true`)\n**Video demo:** atteso — la Dimostrazione della spec è filmabile end-to-end nel browser. La registrazione è compito di `archetipo-review`, non dell'implementazione.\n\n| Scenario | Flusso utente |\n|---|---|\n| Duplicazione su tre giorni, uno in un altro mese | Il collaboratore apre il giorno di origine, avvia «Duplica…» dalla riga con rimborso, aggiunge tre date non contigue (due nel mese riservato, una nel secondo mese riservato), conferma, legge l'esito con il numero di giorni e poi apre uno per uno i tre giorni verificando cliente, offerta, ore, nota, fatturabilità ed etichetta/importo del rimborso. |\n| Conferma non disponibile e giorno di origine escluso | Il collaboratore riapre il selettore, osserva la conferma non disponibile con la pista vuota, prova ad aggiungere il giorno di origine e legge l'avviso senza che il conteggio cambi, poi aggiunge una data valida e vede la conferma diventare disponibile. |\n| Offerta non più abilitata | Il collaboratore avvia la duplicazione da una riga storica su offerta non abilitata, sceglie un giorno, conferma, legge l'errore e poi apre quel giorno constatando che non è stata creata alcuna riga. |\n| Il mese di destinazione si accende senza reload | Dopo la duplicazione il collaboratore torna al calendario, salta al mese del giorno duplicato con il selettore di mese esistente e vede la cella valorizzata con la sua etichetta cliente, senza mai ricaricare la pagina. |\n\n---\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [domains/attivita, decisions/fotografia-rimborso-trasferta, decisions/abilitazioni-offerte-esplicite, decisions/cache-client-calendario-collaboratore]\n  update: [domains/attivita, decisions/fotografia-rimborso-trasferta, decisions/cache-client-calendario-collaboratore]\n  create: []\n```\n\n`wiki affected` sui percorsi attesi (`src/lib/actions/righe-attivita.ts`, `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx`, `src/app/(front-office)/attivita/[data]/isola-giornata.tsx`, `tests/unit/righe-attivita-actions.test.ts`) restituisce sette candidati. Tre entrano nel contratto perché la loro **conoscenza** cambia:\n\n- `domains/attivita` — nuovo comando in ingresso, nuova UI di duplicazione, nuova regola di ammissibilità sulla riga storica, invalidazione estesa a più giorni e più mesi;\n- `decisions/fotografia-rimborso-trasferta` — nasce un secondo modo in cui uno scatto arriva su una riga: la propagazione da un'altra riga, senza rileggere il catalogo;\n- `decisions/cache-client-calendario-collaboratore` — il contratto di invalidazione dopo una mutazione smette di riguardare un solo giorno e un solo mese.\n\nQuattro restano **candidati co-citati** e non entrano nel contratto, perché le loro affermazioni restano vere: `architecture/context-map` (nessun confine fra capability si sposta), `engineering/code-map` (nessun nuovo boundary o capability), `overview` (scopo, attori e stack invariati) e `decisions/feedback-attesa-uniforme` (il nuovo pulsante usa `PulsanteAttesa` come tutti gli altri, il che conferma la decisione invece di cambiarla). Potranno risultare `evidence-changed` per co-citazione dei file toccati: vanno riconciliate esplicitamente in accettazione confrontandole con il diff, non riconfermate d'ufficio.\n\nNessun ID sotto `decisions/` viene creato: si veda la sezione «Decisioni Architetturali» per il motivo.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-057/` — `index.html` (azione «Duplica…», selettore compilato, esito con il numero di giorni), `selettore-vuoto.html` (AC-3), `esito-errore.html` (AC-4) e `calendario-mese-diverso.html` (AC-5).\n\n_Piano generato con ARchetipo Planning — 2026-08-06_"
tasks:
  - id: TASK-01
    title: Server action duplicaRigaSuGiorni con fotografia propagata e ammissibilità riverificata
    type: Impl
    status: DONE
    body: |-
      ## Objective

      `duplicaRigaSuGiorni(rigaId, giorni)` crea in un'unica scrittura atomica una copia della riga di origine su ogni giorno di destinazione ammesso, oppure rifiuta senza scrivere nulla.

      ## Read

      - `src/lib/actions/righe-attivita.ts` — per intero. In particolare: `richiediCollaboratoreOperativo`, `caricaRigaDelCollaboratore` (oggi seleziona `collaboratoreId, offertaId, clienteId`), `verificaOffertaCliente`, `verificaAbilitazioneOfferta`, `fotografaVoceRimborsoTrasferta`, e il blocco finale di `creaRiga` che costruisce `data` con `Date.UTC(anno, mese - 1, giorno, 12)` e invalida i tre percorsi.
      - `prisma/schema.prisma` — modello `RigaAttivita`: `data` è `DateTime @db.Date`, `ore` è `Decimal(4,2)`, `rimborsoTrasfertaImporto` è `Decimal(10,2)?`.
      - `tests/unit/righe-attivita-actions.test.ts` — righe 1-140: i mock `vi.hoisted` di `@/lib/db`, `@/lib/dal` e `next/cache` e gli helper `aspettatiPercorsiInvalidati` / `aspettataNessunaInvalidazione`, che TASK-02 riuserà.

      ## Change

      Solo `src/lib/actions/righe-attivita.ts`.

      1. Allargare la `select` di `caricaRigaDelCollaboratore` e il tipo del suo `riga` restituito, aggiungendo `data, ore, nota, fatturabile, rimborsoTrasfertaEtichetta, rimborsoTrasfertaImporto`. Non cambiare né la logica di proprietà né i messaggi d'errore: i tre chiamanti esistenti continuano a usare solo `offertaId` e `clienteId`.
      2. Aggiungere la nuova server action esportata `duplicaRigaSuGiorni`.

      Non-goal espliciti: nessuna modifica a `creaRiga`, `modificaRiga`, `eliminaRiga`, `rimuoviRimborsoTrasferta`; nessuna modifica allo schema Prisma e quindi nessuna migrazione; nessuna nuova query di catalogo delle voci di rimborso; nessun file UI in questo task.

      ## Steps

      1. In `caricaRigaDelCollaboratore` estendere la `select` ai sette campi elencati sopra e aggiornare il tipo di ritorno da `{ offertaId: string; clienteId: string }` a un tipo che li includa tutti (`data: Date`, `ore` e `rimborsoTrasfertaImporto` con i tipi restituiti da Prisma, `nota: string | null`, `fatturabile: boolean`, `rimborsoTrasfertaEtichetta: string | null`). Restituire l'oggetto senza `collaboratoreId`, come oggi.
      2. Aggiungere un helper privato `giornoDellaRiga(data: Date): string` che formatta con getter **UTC** (`getUTCFullYear`, `getUTCMonth + 1`, `getUTCDate`, entrambi con `padStart(2, "0")`). Motivo: la colonna è `@db.Date` e Prisma la restituisce a mezzanotte UTC, mentre `creaRiga` scrive `Date.UTC(..., 12)`; i getter locali sposterebbero il giorno nei fusi a offset negativo. Non modificare i formattatori locali già presenti in `eliminaRiga` e `rimuoviRimborsoTrasferta`: sono fuori perimetro.
      3. Aggiungere un helper privato `normalizzaGiorniDestinazione(giorni: string[] | undefined, giornoOrigine: string)` che restituisce `{ errore: ActionResult | null; giorni?: string[] }`:
         - se l'input non è un array o è vuoto → errore `"Scegli almeno un giorno di destinazione"`;
         - `trim()` di ogni voce; se una qualsiasi non corrisponde a `/^\d{4}-\d{2}-\d{2}$/` → errore `"Data non valida"`;
         - deduplica con `Set`, poi rimuove `giornoOrigine`;
         - se dopo la rimozione la lista è vuota → errore `"Scegli almeno un giorno di destinazione diverso da quello di origine"`;
         - altrimenti restituisce la lista ordinata crescente.
      4. Scrivere `duplicaRigaSuGiorni(rigaId: string, giorni: string[]): Promise<ActionResult & { giorniCreati?: number }>` nell'ordine seguente, che i test di TASK-02 assumono:
         1. `richiediCollaboratoreOperativo()`; se restituisce un `ActionResult`, propagarlo.
         2. `if (!rigaId) return { success: false, error: "ID riga mancante" }`.
         3. `caricaRigaDelCollaboratore(rigaId, collaboratore.id)`; propagare l'errore; se `riga` è assente restituire `{ success: false, error: "Riga non trovata" }` (stesso restringimento di tipo già usato in `modificaRiga`).
         4. `normalizzaGiorniDestinazione(giorni, giornoDellaRiga(riga.data))`; propagare l'errore.
         5. `verificaOffertaCliente(riga.offertaId, riga.clienteId)`; propagare l'errore.
         6. `verificaAbilitazioneOfferta(collaboratore.id, riga.offertaId)`; propagare l'errore.
         7. `await db.rigaAttivita.createMany({ data: giorniNormalizzati.map((giorno) => ({ collaboratoreId: collaboratore.id, clienteId: riga.clienteId, offertaId: riga.offertaId, data: <Date.UTC dal token>, ore: riga.ore, nota: riga.nota, fatturabile: riga.fatturabile, rimborsoTrasfertaEtichetta: riga.rimborsoTrasfertaEtichetta, rimborsoTrasfertaImporto: riga.rimborsoTrasfertaImporto })) })`. La `Date` si costruisce come in `creaRiga`: `new Date(Date.UTC(anno, mese - 1, giorno, 12))`.
         8. `revalidatePath` su `/attivita/${giorno}` per **ogni** giorno di destinazione, poi su `/attivita/riepilogo` e `/attivita`.
         9. `return { success: true, giorniCreati: giorniNormalizzati.length }`.
      5. Documentare con un commento sopra la action che il rimborso viene **propagato** dalla riga sorgente e mai rifotografato dal catalogo, e che l'ammissibilità è quella della creazione (non quella clemente di `modificaRiga`) perché qui si creano righe nuove.

      ## Verify

      - Esegui: `npx tsc --noEmit`
      - Attendi: exit 0, nessuna diagnostica — la baseline era verde, quindi qualunque errore qui è introdotto da questo task.
      - Esegui: `npm test`
      - Attendi: verde, 670 test invariati. Questo task non aggiunge test: serve solo a provare che l'allargamento della `select` non ha rotto i test esistenti di `creaRiga`, `modificaRiga`, `eliminaRiga` e `rimuoviRimborsoTrasferta`.
      - Esegui: `npm run lint`
      - Attendi: verde, con i soli 9 avvisi preesistenti del guardrail e2e.

      ## Done

      - [ ] `duplicaRigaSuGiorni` è esportata da `src/lib/actions/righe-attivita.ts` e restituisce `giorniCreati` in caso di successo — evidenza per **AC-1**.
      - [ ] Il payload di `createMany` copia `clienteId, offertaId, ore, nota, fatturabile, rimborsoTrasfertaEtichetta, rimborsoTrasfertaImporto` dalla riga sorgente e il file non contiene alcuna chiamata a `fotografaVoceRimborsoTrasferta` o a `db.voceRimborsoTrasferta` dentro la nuova action — evidenza per **AC-2**.
      - [ ] Lista vuota, data malformata e lista composta dal solo giorno di origine escono prima di qualunque scrittura — evidenza server-side per **AC-3**.
      - [ ] Offerta non attiva, offerta di un altro cliente e abilitazione assente escono prima di `createMany` e prima di ogni `revalidatePath` — evidenza per **AC-4**.
      - [ ] `npx tsc --noEmit`, `npm test` e `npm run lint` restano verdi.

      ## Blockers

      None.
