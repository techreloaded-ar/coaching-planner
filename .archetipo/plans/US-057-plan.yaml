  - id: TASK-02
    title: Unit test del comando di duplicazione — copia, rifiuti e assenza di letture di catalogo
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      `tests/unit/righe-attivita-actions.test.ts` prova il contratto di `duplicaRigaSuGiorni`: cosa scrive, cosa **non** legge e in quali casi non scrive affatto.

      ## Read

      - `tests/unit/righe-attivita-actions.test.ts` — righe 1-140 per i mock `vi.hoisted` (`mockRigaAttivita`, `mockVoceRimborsoTrasferta`, `mockOfferta`, `mockAbilitazioneOfferta`, `mockRisolviProfiloCollaboratoreCorrente`, `mockRevalidatePath`), l'helper `creaFormData`, `collaboratoreMock()` e gli helper `aspettatiPercorsiInvalidati` / `aspettataNessunaInvalidazione`; poi i `describe` esistenti per lo stile delle asserzioni sui payload Prisma.
      - `src/lib/actions/righe-attivita.ts` — `duplicaRigaSuGiorni` e `caricaRigaDelCollaboratore` come lasciati da TASK-01.

      ## Change

      Solo `tests/unit/righe-attivita-actions.test.ts`.

      1. Aggiungere `createMany: vi.fn()` al `mockRigaAttivita` esistente in cima al file (non creare un secondo mock del db).
      2. Aggiungere in fondo un `describe("duplicaRigaSuGiorni", ...)` con il proprio `beforeEach`.

      Non-goal: nessun nuovo file di test, nessuna modifica ai `describe` esistenti oltre all'aggiunta di `createMany` al mock condiviso, nessun test sulla UI.

      ## Steps

      1. Aggiungere `createMany` al mock di `rigaAttivita`.
      2. Nel `beforeEach` del nuovo `describe`: `vi.clearAllMocks()`; `mockRisolviProfiloCollaboratoreCorrente` risolve `{ stato: "ATTIVO", collaboratore: collaboratoreMock() }`; `mockRigaAttivita.findUnique` risolve la riga sorgente completa — `{ collaboratoreId: "collab-giulia", offertaId: "offerta-1", clienteId: "cliente-1", data: new Date(Date.UTC(2026, 2, 11, 12)), ore: "6.00", nota: "Coaching del team", fatturabile: true, rimborsoTrasfertaEtichetta: "Trasferta fuori provincia", rimborsoTrasfertaImporto: "85.00" }`; `mockOfferta.findUnique` risolve `{ clienteId: "cliente-1", attiva: true }`; `mockAbilitazioneOfferta.findUnique` risolve un'abilitazione presente; `mockRigaAttivita.createMany` risolve `{ count: 3 }`.
      3. **Copia integrale (AC-2).** Duplicare su `["2026-03-17", "2026-03-24", "2026-04-07"]` e asserire che `mockRigaAttivita.createMany` è stato chiamato una sola volta con un array di tre record, ciascuno con `collaboratoreId: "collab-giulia"`, `clienteId: "cliente-1"`, `offertaId: "offerta-1"`, `ore: "6.00"`, `nota: "Coaching del team"`, `fatturabile: true`, `rimborsoTrasfertaEtichetta: "Trasferta fuori provincia"`, `rimborsoTrasfertaImporto: "85.00"` e `data` uguale a `new Date(Date.UTC(anno, mese - 1, giorno, 12))` del rispettivo token.
      4. **Nessuna rilettura del catalogo (AC-2).** Nello stesso scenario asserire `expect(mockVoceRimborsoTrasferta.findUnique).not.toHaveBeenCalled()`. È l'oracolo che distingue la propagazione dello scatto da una rifotografia: senza di esso il test passerebbe anche se l'importo venisse riletto dal catalogo e per caso coincidesse.
      5. **Conteggio ed esito (AC-1).** Asserire che il risultato è `{ success: true, giorniCreati: 3 }` e che `aspettatiPercorsiInvalidati` vale per **ciascuno** dei tre giorni, cioè che `mockRevalidatePath` è stato chiamato con `/attivita/2026-03-17`, `/attivita/2026-03-24`, `/attivita/2026-04-07`, `/attivita/riepilogo` e `/attivita`.
      6. **Deduplica ed esclusione dell'origine (AC-3).** Duplicare su `["2026-03-17", "2026-03-17", "2026-03-11"]` (dove `2026-03-11` è il giorno della riga sorgente) e asserire `giorniCreati: 1` con un solo record in `createMany`, sul giorno `2026-03-17`.
      7. **Rifiuti senza scrittura (AC-3).** Tre casi distinti — lista vuota `[]`, lista con la sola data di origine `["2026-03-11"]`, lista con una data malformata `["11/03/2026"]` — ciascuno con `success: false`, un `error` non vuoto, `expect(mockRigaAttivita.createMany).not.toHaveBeenCalled()` e `aspettataNessunaInvalidazione()`.
      8. **Offerta non più ammissibile (AC-4).** Due casi: `mockOfferta.findUnique` risolve `{ clienteId: "cliente-1", attiva: false }`, e `mockAbilitazioneOfferta.findUnique` risolve `null`. In entrambi: `success: false` con l'errore atteso (`"L'offerta non è più attiva"` e `"Non sei abilitato a registrare attività su questa offerta"`), `createMany` mai invocato e `aspettataNessunaInvalidazione()`.
      9. **Proprietà della riga.** `mockRigaAttivita.findUnique` risolve una riga con `collaboratoreId: "collab-altro"`: `success: false` con il messaggio esistente sulle attività di un altro collaboratore, `createMany` mai invocato.
      10. **Profilo non operativo.** `mockRisolviProfiloCollaboratoreCorrente` risolve `{ stato: "ASSENTE" }`: `success: false`, `createMany` mai invocato, e nessuna lettura della riga.

      ## Verify

      - Esegui: `npx vitest run tests/unit/righe-attivita-actions.test.ts`
      - Attendi: verde; il file passa dai 32 `it` attuali ad almeno 10 in più, tutti nel nuovo `describe`.
      - Esegui: `npm test`
      - Attendi: verde, 40 file, conteggio totale cresciuto dei soli test aggiunti — nessuna regressione sui 670 preesistenti.

      ## Done

      - [ ] Il payload di `createMany` è asserito campo per campo su tutti i record — evidenza per **AC-2**.
      - [ ] `mockVoceRimborsoTrasferta.findUnique` è asserito **non chiamato** nello scenario di copia — evidenza per **AC-2**.
      - [ ] Il risultato espone `giorniCreati` coerente con i giorni effettivamente scritti e ogni giorno di destinazione è invalidato — evidenza per **AC-1**.
      - [ ] Lista vuota, sola data di origine e data malformata rifiutano senza scrivere né invalidare — evidenza server-side per **AC-3**.
      - [ ] Offerta non attiva e abilitazione assente rifiutano senza scrivere né invalidare — evidenza per **AC-4**.
      - [ ] `npm test` verde.

      ## Blockers

      None.
