  - id: TASK-08
    title: Aggiornamento della decisione decisions/fotografia-rimborso-trasferta con la propagazione dello scatto
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective

      `docs/wiki/decisions/fotografia-rimborso-trasferta.md` (ID canonico `decisions/fotografia-rimborso-trasferta`) registra il secondo modo in cui uno scatto arriva su una riga — la copia da un'altra riga — e perché rileggere il catalogo lo violerebbe.

      ## Read

      - `docs/wiki/decisions/fotografia-rimborso-trasferta.md` — frontmatter `sources` e blocco `review`, e le sezioni marcate `context`, `decision`, `alternatives`, `consequences`, `verification`. Oggi la pagina descrive un solo percorso di scrittura: `fotografaVoceRimborsoTrasferta` invocata da `creaRiga` e `modificaRiga`.
      - `src/lib/actions/righe-attivita.ts` — `duplicaRigaSuGiorni` come lasciata da TASK-01: copia `rimborsoTrasfertaEtichetta` e `rimborsoTrasfertaImporto` dalla riga sorgente e non invoca `fotografaVoceRimborsoTrasferta`.
      - `tests/unit/righe-attivita-actions.test.ts` — l'asserzione «`voceRimborsoTrasferta.findUnique` non chiamato» aggiunta da TASK-02.

      ## Change

      - `docs/wiki/decisions/fotografia-rimborso-trasferta.md` — frontmatter `sources` e blocco `review`, sezioni `decision`, `consequences`, `verification`.
      - `docs/wiki/index.md` e `docs/wiki/log.md` solo come output dei comandi.

      Non-goal: la decisione **non** cambia stato (`decision_status` resta `accepted`, non è superseded da nulla); nessuna nuova alternativa inventata; nessuna modifica al codice; nessuna modifica ad altre pagine Wiki.

      ## Steps

      1. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner reset decisions/fotografia-rimborso-trasferta`.
      2. Nel frontmatter aggiungere alle `sources` la fonte `src/lib/actions/righe-attivita.ts` con ruolo `implementation` e `symbol: duplicaRigaSuGiorni`, e `tests/e2e/duplica-riga-su-giorni.spec.ts` con ruolo `verification`. Mantenere invariate le fonti esistenti.
      3. Sezione `decision`: aggiungere un paragrafo che dichiara i **due** percorsi con cui la coppia etichetta/importo finisce su una riga — la fotografia dal catalogo al salvataggio (`fotografaVoceRimborsoTrasferta`) e la **propagazione** da una riga già fotografata (`duplicaRigaSuGiorni`) — e che nel secondo caso il catalogo non viene interrogato affatto: lo scatto viaggia da riga a riga, non da voce a riga.
      4. Sezione `consequences`: annotare la conseguenza concreta — duplicare una riga il cui importo è stato configurato per errore propaga l'errore, e duplicare una riga la cui voce è stata nel frattempo eliminata o modificata continua a produrre l'importo storico. È il comportamento voluto: la fotografia è un dato contabile, e una copia della fotografia resta la stessa fotografia.
      5. Sezione `verification`: registrare che la propagazione è provata da un oracolo **negativo** — negli unit `voceRimborsoTrasferta.findUnique` è asserito non chiamato durante la duplicazione — e che l'e2e verifica etichetta e importo identici su tutti i giorni di destinazione. Spiegare perché l'oracolo negativo è necessario: la sola uguaglianza dei valori passerebbe anche con una rilettura di catalogo che per caso coincide.
      6. Eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner catalog`.

      ## Verify

      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner validate --profile bootstrap`
      - Attendi: `data.ok: true`.
      - Esegui: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner status`
      - Attendi: `decisions/fotografia-rimborso-trasferta` risulta `generated`, con `decision_status` ancora `accepted`.

      ## Done

      - [ ] La pagina distingue esplicitamente fotografia dal catalogo e propagazione da riga a riga — conoscenza a supporto di **AC-2**.
      - [ ] La sezione `verification` cita l'oracolo negativo e ne spiega la necessità.
      - [ ] `decision_status` resta `accepted` e tutti i marcatori `archetipo:wiki` sono conservati.
      - [ ] `archetipo wiki validate --profile bootstrap` restituisce `data.ok: true`.

      ## Blockers

      None.
