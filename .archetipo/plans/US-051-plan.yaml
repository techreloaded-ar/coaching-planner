  - id: TASK-10
    title: 'E2E feedback-attesa-azioni: cursore, attesa su submit, attesa su eliminazione, fine attesa su errore'
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
      - TASK-05
      - TASK-07
    body: |-
      ## Objective
      Le quattro AC hanno evidenza browser deterministica in un nuovo spec Playwright conforme al contratto anti-flakiness del repository.

      ## Read
      - tests/e2e/support/fixtures.ts, tests/e2e/support/factory.ts, tests/e2e/support/auth.ts, tests/e2e/support/reserved-resources.ts — fixture, factory e helper (isolamento per namespace, `createScaglioneKm`, `accediAlBackOfficeComeAdmin`, `accediComeCollaboratore`)
      - tests/e2e/anagrafica-scaglioni.spec.ts — locator del modale di eliminazione (dialog «Eliminare lo scaglione …?», pulsante «Elimina scaglione»)
      - tests/e2e/calendario-navigazione-reattiva.spec.ts — stile degli assert su `aria-busy`
      - tests/e2e/README.md e scripts/check-e2e-guardrails.ts — vincoli anti-flakiness

      ## Change
      - tests/e2e/feedback-attesa-azioni.spec.ts — nuovo file.
      - Non-goal: nessuna modifica agli spec esistenti né alle fixture condivise; nessuna mutazione di entità seed (usare solo entità di factory e km riservati).

      ## Steps
      1. Helper di trattenimento del POST della server action nella pagina target: `let rilascia: () => void; const trattenuta = new Promise<void>((r) => { rilascia = r; });` e `await page.route(patternPagina, async (route) => { if (route.request().method() === "POST") { await trattenuta; } await route.continue(); });` — nessun timeout fisso, rilascio esplicito dal test.
      2. Scenario AC-2: `accediAlBackOfficeComeAdmin`; cliente creato dalla factory; aprire la pagina di modifica; trattenere il POST; modificare un campo e inviare; assert web-first: submit `toBeDisabled()`, `toHaveAttribute("aria-busy", "true")`, etichetta «Salvataggio…» visibile; poi `rilascia()`; assert dell'esito e del ritorno del pulsante allo stato normale.
      3. Scenario AC-3: scaglione creato con `createScaglioneKm` usando gli helper dei km riservati; aprire la pagina scaglioni; click su «Elimina» di riga; trattenere il POST; click su «Elimina scaglione» nel dialog; assert: pulsante `toBeDisabled()` + `aria-busy="true"` e dialog ancora visibile; `rilascia()`; il dialog scompare e la riga dello scaglione non è più presente.
      4. Scenario AC-4: form cliente con partita IVA non valida lato server, senza trattenimento; submit; assert: messaggio d'errore visibile, submit `toBeEnabled()` con `aria-busy="false"`, `toHaveValue` sui campi compilati (valori conservati).
      5. Scenario AC-1: negli stessi schermi, assert sul computed style con `expect.poll(() => locator.evaluate((el) => getComputedStyle(el).cursor))`: `"pointer"` per il submit abilitato e per un pulsante ghost di riga (back office) e per «Aggiungi riga» nel dettaglio giornata (front office, fixture collaboratore con cliente/offerta abilitata); diverso da `"pointer"` per un pulsante disabilitato (es. il submit durante il trattenimento del POST).
      6. Selettori per ruolo e nome esatto; niente `selectOption` per indice, niente attese fisse, niente classi Tailwind come selettori.

      ## Verify
      - Run: `npx playwright test tests/e2e/feedback-attesa-azioni.spec.ts`
      - Expect: verde
      - Run: `npm run lint`
      - Expect: ✅ guardrail e2e anti-flakiness superato

      ## Done
      - [ ] AC-1 — evidenza del cursore pointer/standard su campioni di front office e back office
      - [ ] AC-2 — evidenza di attesa e blocco del doppio invio sul submit di un form
      - [ ] AC-3 — evidenza di attesa su un'eliminazione con dialog aperto fino all'esito
      - [ ] AC-4 — evidenza della fine attesa su errore con valori conservati e messaggio visibile

      ## Blockers
      None.
