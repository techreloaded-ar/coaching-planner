      2. Contenuto: contesto (Tailwind v4 senza cursor pointer di default, tre pattern di attesa divergenti), decisione (base layer CSS + PulsanteAttesa con useFormStatus + contratto `aria-busy` + modali senza chiusura ottimistica), alternative valutate e scartate (wiring ad hoc per pulsante; migrazione integrale a useActionState), tradeoff e intento di verifica (spec e2e feedback-attesa-azioni).
