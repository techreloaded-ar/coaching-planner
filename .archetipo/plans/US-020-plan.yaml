schema: archetipo/plan/v2
spec_code: US-020
body: "# US-020: Override della tariffa collaboratore per offerta — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-10-27\n\n---\n\n## Spec\n\n**Epic:** EP-005 — Evoluzioni Post-MVP\n**Priorità:** LOW | **Punti:** 3\n\n**Storia Utente**\nCome Stefano, amministratore, voglio poter definire, quando serve, una tariffa specifica per la coppia collaboratore-offerta che prevale sulla tariffa standard, così da gestire accordi particolari senza alterare la tariffa generale del collaboratore.\n\n**Criteri di Accettazione**\n- AC-1 — L'amministratore definisce una tariffa specifica per la combinazione collaboratore-offerta\n- AC-2 — I calcoli di riepilogo e report usano la tariffa in override quando presente, altrimenti la tariffa standard del collaboratore\n- AC-3 — La rimozione dell'override ripristina la tariffa standard nei calcoli correnti\n- AC-4 — L'override è tracciato e visibile nell'anagrafica dell'offerta\n\n---\n\n## Soluzione tecnica\n\nL'override diventa una nuova entità persistita `TariffaCollaboratoreOfferta` (coppia unica collaboratore-offerta + `tariffaGiornaliera` Decimal + `createdAt`/`updatedAt`), gestita dall'amministratore in una nuova sezione **\"Tariffe personalizzate\"** della pagina `/offerte/[offertaId]/collaboratori` (l'anagrafica operativa dell'offerta, dove già vivono gli ingaggi). I due soli calcoli che oggi usano la tariffa del collaboratore risolvono la tariffa applicabile come `override ?? tariffa standard`:\n\n- **Riepilogo mensile del collaboratore** (`riepilogoMese` in `src/lib/attivita.ts` → `calcolaRiepilogoMese` in `src/domain/consuntivi/index.ts`): la funzione pura riceve una mappa `offertaId → tariffa personalizzata`; l'imponibile manodopera è la somma, per tariffa distinta, di `ore fatturabili / 8 × tariffa`. Con una sola tariffa la formula e l'ordine delle somme restano identici a oggi (nessuna regressione al centesimo). Ogni voce per offerta espone `tariffaGiornaliera` e `tariffaPersonalizzata`; il breakdown espone `tariffeDifferenziate`.\n- **Report marginalità** (`reportMarginalitaPeriodo` in `src/lib/report.ts`): il loader carica gli override delle offerte coinvolte e valorizza `tariffaCollaboratoreGiornaliera` di ogni riga con l'override della coppia, se presente. `calcolaMarginalitaClienti` non cambia.\n- Report fatturazione clienti, avanzamento ed esportazione usano la tariffa dell'**offerta** e restano invariati (fuori perimetro).\n- La rimozione cancella la riga (`deleteMany` idempotente): tutti i calcoli successivi tornano alla tariffa standard. I calcoli sono \"correnti\" come oggi: nessuna storicizzazione per periodo (AC-3 chiede esplicitamente i calcoli correnti).\n- \"Tracciato\" (AC-4) = persistito con data di creazione e di ultimo aggiornamento, mostrati nella sezione (\"Aggiornata il … · creata il …\"). Assunzione: non serve registrare l'autore, perché l'unico attore che può scrivere è l'amministratore (guardia `richiediRuoloApi(\"AMMINISTRATORE\")`).\n- Nuovi override si impostano solo per collaboratori **attualmente ingaggiati** sull'offerta (sono gli unici che possono consuntivare); un override il cui ingaggio viene poi revocato resta valido per le righe già registrate e resta visibile con badge \"Non più ingaggiato\" e la sola azione \"Rimuovi\".\n- Validazione importo: riuso di `validaCampoTariffaGiornaliera` e `normalizzaTariffaGiornaliera` (stessi messaggi della tariffa del collaboratore).\n\n### Decisioni architetturali\n\nLa scelta del modello dati supera la soglia ADR (modello dati persistito, alternative valide, effetti su semantica di consistenza dei calcoli) e **sostituisce** la decisione esistente `decisions/tariffa-unica-collaboratore`, che documentava la tariffa unica e rimandava gli override alla crescita.\n\n- **Scelta:** tabella dedicata `TariffaCollaboratoreOfferta` con `@@unique([collaboratoreId, offertaId])`, indipendente da `AbilitazioneOfferta`.\n- **Alternativa scartata 1 — colonna nullable su `AbilitazioneOfferta`:** diff minimo, ma la revoca di un ingaggio (`revocaIngaggioCollaboratore` fa `deleteMany` della riga) cancellerebbe l'override e altererebbe in silenzio riepiloghi e marginalità dei mesi già consuntivati, tipicamente a fine progetto. Inaccettabile per importi economici.\n- **Alternativa scartata 2 — override storicizzato con validità da/a:** risolverebbe la retroattività, ma la spec chiede solo i calcoli correnti e la tariffa standard stessa non è storicizzata: complessità non richiesta.\n- **Compromessi:** come la tariffa standard, modificare o rimuovere un override ricalcola retroattivamente i mesi passati; documentato nelle conseguenze dell'ADR.\n- **Verifica prevista:** unit test sulla funzione pura e sui loader, unit test delle action, e2e del flusso completo.\n- Nuovo ADR: `decisions/tariffa-collaboratore-per-offerta` (accepted); `decisions/tariffa-unica-collaboratore` passa a `decision_status: superseded` con link al nuovo.\n\n---\n\n## Baseline\n\nEseguita il 2026-10-27 su `main` (`/Users/smarello/repo/coaching-planner`), database locale raggiungibile.\n\n| Check | Risultato prima dell'implementazione | Conseguenza per il piano |\n|---|---|---|\n| `npx vitest run tests/unit/riepilogo-mese.test.ts tests/unit/marginalita-clienti.test.ts tests/unit/ingaggi-offerta-dal-actions.test.ts` | Passa (3 file, 37 test) | I task devono lasciarli verdi, aggiornando le aspettative solo dove il contratto cambia intenzionalmente |\n| `npm test` | Passa (56 file, 838 test) | Regressione completa nel gate finale: atteso verde |\n| `npx tsc --noEmit` | Passa, nessuna diagnostica | Nessuna nuova diagnostica nei file toccati |\n| `npm run lint` | Passa; 3 avvisi `⚠️ chiave riservata non risolvibile staticamente` preesistenti (`tests/e2e/support/date.ts:179`, `tests/e2e/support/report-data.ts:80`, `:103`) e `✅ Guardrail e2e anti-flakiness passed` | Atteso verde con gli stessi 3 avvisi, nessuno nuovo |\n| `npx prisma validate` | Schema valido | Atteso valido dopo la nuova entità |\n| `npx prisma migrate status` | 9 migrazioni, \"Database schema is up to date!\" | La migrazione si genera con `npx prisma migrate dev` sul DB locale |\n\n**Prerequisiti di ambiente:** PostgreSQL locale attivo (`docker compose up -d` se spento) per `prisma migrate dev` e per gli e2e; `npm run db:generate` dopo ogni modifica allo schema per rigenerare `src/generated/prisma`; Chromium di Playwright installato (`npx playwright install chromium`). Non leggere né modificare `.env`.\n\n**Difetto preesistente fuori perimetro:** `prisma/seed.ts` cancella `offerta` senza cancellare prima `abilitazioneOfferta` (FK `RESTRICT`); in CI non emerge perché il DB è vuoto. Il piano aggiunge solo la cancellazione della nuova tabella, senza correggere quella esistente.\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task |\n|---|---|---|---|---|\n| AC-1 | Offerta e collaboratore da factory, collaboratore ingaggiato | Unit (action) + E2E | Action: `upsert` sulla chiave `collaboratoreId_offertaId` con tariffa normalizzata `\"520.00\"`, rifiuto di importi invalidi e di collaboratori non ingaggiati senza scritture. E2E: dopo \"Salva tariffa\" e reload, la riga del collaboratore nella sezione \"Tariffe personalizzate\" mostra `520,00 €` | TASK-07, TASK-10 |\n| AC-2 | Collaboratore tariffa 400,00, due offerte A/B, 8 h fatturabili per offerta nel mese riservato, override 520,00 su A | Unit (dominio + loader) + E2E | Dominio: imponibile `920.00`, voce A `tariffaGiornaliera \"520.00\"`/`tariffaPersonalizzata true`, voce B `\"400.00\"`/`false`, `tariffeDifferenziate true`. Loader marginalità: riga A con `tariffaCollaboratoreGiornaliera \"520.00\"`. E2E: riepilogo del collaboratore mostra importo fattura `€ 920,00` e badge \"Personalizzata\" solo su A; marginalità mostra costi `520,00 €` su A e `400,00 €` su B | TASK-03, TASK-05, TASK-10 |\n| AC-3 | Stesso dataset con override rimosso | Unit (action + dominio) + E2E | Action: `deleteMany` sulla sola coppia. Dominio: con mappa vuota l'imponibile torna `800.00` e il breakdown mostra la tariffa standard. E2E: dopo \"Rimuovi\" e conferma compare lo stato vuoto; il riepilogo mostra `€ 800,00` senza badge e la marginalità costi `400,00 €` su A | TASK-03, TASK-07, TASK-10 |\n| AC-4 | Override appena creato | Unit (DAL) + E2E | DAL: `elencaTariffePersonalizzateOfferta` restituisce tariffa standard, personalizzata, `creataIl`/`aggiornataIl` ISO e `ingaggiato`. E2E: la riga mostra \"Aggiornata il {data odierna gg/mm/aaaa}\" | TASK-07, TASK-10 |\n\n---\n\n## Strategia di test\n\nTest sul risultato specificato, a più livelli, senza mock che nascondano l'oracolo.\n\n- **Dominio puro** (`tests/unit/riepilogo-mese.test.ts`): imponibile con tariffe miste, assenza di override identica al comportamento attuale, override su offerta senza ore fatturabili che non attiva `tariffeDifferenziate`; coerenza costi marginalità = imponibile riepilogo anche con override (`tests/unit/marginalita-clienti.test.ts`).\n- **Loader** (nuovo `tests/unit/tariffe-personalizzate-calcoli.test.ts`): mock di `db` che restituisce righe e override; si asserisce sul risultato restituito da `riepilogoMese`/`reportMarginalitaPeriodo` (importi), non solo sulle chiamate.\n- **Action e DAL** (nuovo `tests/unit/tariffe-personalizzate-actions.test.ts`, stile di `ingaggi-offerta-dal-actions.test.ts`): payload esatti, guardia di ruolo, rifiuti senza scritture, revalidate.\n- **E2E browser obbligatorio:** il percorso attraversa autenticazione con due ruoli, persistenza, Server Action e più schermate (back office → front office → report).\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright (già presente: `playwright.config.ts`, `tests/e2e/support/fixtures.ts`)\n**Video demo:** atteso, filmabile (registrato in seguito da `archetipo-review`, non durante l'implementazione)\n\n| Scenario | Flusso utente |\n|---|---|\n| Override applicato e rimosso | L'amministratore apre `/offerte/{A}/collaboratori`, imposta 520,00 € per il collaboratore, vede tariffa e data di aggiornamento; il collaboratore (secondo browser context) apre il riepilogo del mese riservato e vede € 920,00 con badge \"Personalizzata\" solo su A; l'amministratore verifica i costi in marginalità; rimuove l'override e il collaboratore, ricaricando, vede € 800,00 |\n\nDati solo da factory (cliente, due offerte, collaboratore con tariffa 400,00, ingaggi, righe), mese da `meseRiservato(\"US-020-TARIFFA-PERSONALIZZATA\")`, nessuna entità del seed toccata.\n\n---\n\n## Impatto sulla Wiki\n\n```yaml\nwiki_impact:\n  read: [decisions/tariffa-unica-collaboratore, decisions/abilitazioni-offerte-esplicite, decisions/calcoli-puri, decisions/importi-decimali, domains/collaboratori, domains/attivita, domains/offerte]\n  update: [decisions/tariffa-unica-collaboratore, domains/collaboratori, domains/attivita]\n  create: [decisions/tariffa-collaboratore-per-offerta]\n```\n\n`domains/offerte` e `engineering/code-map` sono candidati di `wiki affected` per co-citazione di file, ma il loro contenuto resta accurato: da riconciliare in accettazione, non nel contratto.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-020/`\n\n_Piano generato con ARchetipo Planning — 2026-10-27_"
tasks:
  - id: TASK-01
    title: Modello TariffaCollaboratoreOfferta, migrazione e pulizia nel seed
    type: Impl
    status: TODO
    body: |-
      ## Objective
      Esiste a database la tabella `TariffaCollaboratoreOfferta` (coppia unica collaboratore-offerta con tariffa Decimal e timestamp) e il client Prisma generato la espone come `db.tariffaCollaboratoreOfferta`.

      ## Read
      - prisma/schema.prisma — modelli `Collaboratore`, `Offerta`, `AbilitazioneOfferta` (stile di commenti, naming e `@@unique`)
      - prisma/migrations/20260722133929_aggiungi_abilitazione_offerta/migration.sql — forma attesa dell'SQL generato (FK `RESTRICT`)
      - prisma/seed.ts — righe 13-23, ordine dei `deleteMany`

      ## Change
      - prisma/schema.prisma — aggiungere il modello `TariffaCollaboratoreOfferta` e le due relazioni inverse; nessun'altra modifica ai modelli esistenti
      - prisma/migrations/<timestamp>_tariffa_collaboratore_offerta/migration.sql — generata da Prisma, non scritta a mano
      - prisma/seed.ts — aggiungere solo `await prisma.tariffaCollaboratoreOfferta.deleteMany();` prima di `await prisma.rigaAttivita.deleteMany();`. Non correggere altri `deleteMany` (fuori perimetro)

      ## Steps
      1. In `prisma/schema.prisma`, dopo il blocco `AbilitazioneOfferta`, aggiungere la sezione:
         ```prisma
         // ── Tariffa personalizzata Collaboratore su Offerta ─────────────

         // Tariffa giornaliera concordata per la coppia collaboratore-offerta: prevale
         // sulla tariffa standard del collaboratore nei calcoli correnti. È
         // indipendente dall'ingaggio: la revoca dell'ingaggio non la cancella.
         model TariffaCollaboratoreOfferta {
           id                 String   @id @default(uuid())
           collaboratoreId    String
           offertaId          String
           tariffaGiornaliera Decimal  @db.Decimal(10, 2)
           createdAt          DateTime @default(now())
           updatedAt          DateTime @updatedAt

           collaboratore Collaboratore @relation(fields: [collaboratoreId], references: [id])
           offerta       Offerta       @relation(fields: [offertaId], references: [id])

           @@unique([collaboratoreId, offertaId])
         }
         ```
      2. In `Collaboratore` aggiungere `tariffePersonalizzateOfferte TariffaCollaboratoreOfferta[]`; in `Offerta` aggiungere `tariffePersonalizzateCollaboratori TariffaCollaboratoreOfferta[]`.
      3. Con il PostgreSQL locale attivo (`docker compose up -d` se serve) eseguire `npx prisma migrate dev --name tariffa_collaboratore_offerta`; verificare che l'SQL contenga `CREATE TABLE "TariffaCollaboratoreOfferta"`, l'indice unico `TariffaCollaboratoreOfferta_collaboratoreId_offertaId_key` e le due FK.
      4. Eseguire `npm run db:generate`.
      5. Aggiornare `prisma/seed.ts` come descritto in Change.

      ## Verify
      - Run: `npx prisma validate`
      - Expect: "The schema at prisma/schema.prisma is valid"
      - Run: `npx prisma migrate status`
      - Expect: 10 migrazioni, "Database schema is up to date!"
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica (baseline verde)

      ## Done
      - [ ] AC-1 — la coppia collaboratore-offerta può avere una sola tariffa personalizzata, garantita dal vincolo unico a database
      - [ ] AC-4 — la tariffa personalizzata ha `createdAt` e `updatedAt` persistiti
      - [ ] Migrazione generata e committabile, client rigenerato, seed aggiornato

      ## Blockers
      None.
  - id: TASK-02
    title: calcolaRiepilogoMese applica le tariffe personalizzate per offerta
    type: Impl
    status: TODO
    body: |-
      ## Objective
      La funzione pura `calcolaRiepilogoMese` calcola l'imponibile manodopera usando, per ogni offerta, la tariffa personalizzata se presente e altrimenti la tariffa standard, ed espone per offerta la tariffa applicata.

      ## Read
      - src/domain/consuntivi/index.ts — `RigaRiepilogo`, `VoceRiepilogoOfferta`, `BreakdownRiepilogoMese`, `calcolaRiepilogoMese` (righe 17-192)
      - tests/unit/riepilogo-mese.test.ts — aspettative esatte attuali (oggetti `toEqual` che dovranno includere i nuovi campi)
      - tests/unit/marginalita-clienti.test.ts — righe 215-240, coerenza costi = imponibile
      - src/lib/attivita.ts — `creaRiepilogoVuoto` (riga 489), che costruisce un `BreakdownRiepilogoMese`

      ## Change
      - src/domain/consuntivi/index.ts — firma, tipi e calcolo di `calcolaRiepilogoMese`; nessuna modifica a `calcolaMarginalitaClienti` né agli altri calcoli
      - src/lib/attivita.ts — solo `creaRiepilogoVuoto`: aggiungere `tariffeDifferenziate: false` al breakdown (necessario per la compilazione); il loader si cambia in TASK-04

      ## Steps
      1. Aggiungere a `VoceRiepilogoOfferta` i campi `tariffaGiornaliera: string` (tariffa applicata, `toFixed(2)`) e `tariffaPersonalizzata: boolean`.
      2. Aggiungere a `BreakdownRiepilogoMese` il campo `tariffeDifferenziate: boolean` con commento: vero quando almeno un'ora fatturabile è valorizzata con una tariffa personalizzata. `breakdown.tariffaGiornaliera` resta la tariffa **standard**.
      3. Cambiare la firma in `calcolaRiepilogoMese(righe, tariffaGiornaliera, tariffePersonalizzatePerOfferta: ReadonlyMap<string, string | number> = new Map())`, documentando nel JSDoc che la mappa è `offertaId → tariffa personalizzata`.
      4. Risolvere la tariffa di ogni offerta con un helper locale: valore della mappa convertito con `Number` se finito, altrimenti la tariffa standard numerica; `tariffaPersonalizzata` è vero solo se la mappa ha la chiave con un numero finito.
      5. Accumulare le ore fatturabili per tariffa applicata (`Map<number, number>`, chiave = tariffa numerica) nello stesso ciclo sulle righe, e calcolare `imponibileManodopera` come somma di `(ore / ORE_PER_GIORNATA) * tariffa` sulle chiavi. Con una sola tariffa il valore deve coincidere con la formula attuale `giornateFatturabili * tariffaNumerica` (stesse somme nello stesso ordine).
      6. `tariffeDifferenziate` = esiste una voce con `tariffaPersonalizzata` e `oreFatturabili > 0`.
      7. Aggiornare `creaRiepilogoVuoto` in `src/lib/attivita.ts`.
      8. Aggiornare le aspettative `toEqual` esistenti in `tests/unit/riepilogo-mese.test.ts` aggiungendo i nuovi campi (`tariffaGiornaliera` della tariffa standard, `tariffaPersonalizzata: false`, `tariffeDifferenziate: false`) senza cambiare gli importi attesi.

      ## Verify
      - Run: `npx vitest run tests/unit/riepilogo-mese.test.ts tests/unit/marginalita-clienti.test.ts`
      - Expect: tutti verdi con gli stessi importi della baseline
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica

      ## Done
      - [ ] AC-2 — l'imponibile usa la tariffa personalizzata per le offerte presenti nella mappa e la standard per le altre
      - [ ] Senza override il risultato è identico al comportamento precedente (test esistenti con importi invariati)

      ## Blockers
      None.
  - id: TASK-03
    title: Unit test del riepilogo con tariffe personalizzate e coerenza con la marginalità
    type: Test
    status: TODO
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Test unitari dimostrano che il riepilogo usa l'override quando presente, la standard altrimenti, e che senza override torna alla standard.

      ## Read
      - tests/unit/riepilogo-mese.test.ts — helper `riga(...)` e stile delle asserzioni
      - tests/unit/marginalita-clienti.test.ts — `describe` di coerenza (righe 180-240)
      - src/domain/consuntivi/index.ts — nuova firma di `calcolaRiepilogoMese` (TASK-02)

      ## Change
      - tests/unit/riepilogo-mese.test.ts — nuovo `describe("calcolaRiepilogoMese con tariffe personalizzate", ...)`
      - tests/unit/marginalita-clienti.test.ts — un nuovo `it` nel describe di coerenza

      ## Steps
      1. Caso misto: tariffa standard `"400.00"`, due righe fatturabili da 8 h su offerte `off-a` e `off-b`, mappa `new Map([["off-a", "520.00"]])`. Asserire `importoFattura === "920.00"`, `breakdown.imponibileManodopera === "920.00"`, `breakdown.tariffaGiornaliera === "400.00"`, `breakdown.tariffeDifferenziate === true`, voce `off-a` con `tariffaGiornaliera "520.00"` e `tariffaPersonalizzata true`, voce `off-b` con `"400.00"` e `false`.
      2. Caso rimozione (AC-3): stesse righe con mappa vuota → `importoFattura "800.00"`, `tariffeDifferenziate false`, entrambe le voci `"400.00"`.
      3. Override su offerta con sole ore non fatturabili: `tariffeDifferenziate false` e imponibile invariato.
      4. Override con rimborso trasferta: l'importo fattura somma imponibile con override e rimborsi.
      5. In `marginalita-clienti.test.ts`: righe di un collaboratore su due offerte, con `tariffaCollaboratoreGiornaliera` `"520.00"` su A e `"400.00"` su B; asserire che `calcolaMarginalitaClienti(righe).totali.costi` è uguale a `calcolaRiepilogoMese(..., "400.00", new Map([[A, "520.00"]])).breakdown.imponibileManodopera`.

      ## Verify
      - Run: `npx vitest run tests/unit/riepilogo-mese.test.ts tests/unit/marginalita-clienti.test.ts`
      - Expect: tutti verdi, inclusi i nuovi casi

      ## Done
      - [ ] AC-2 — oracolo: imponibile `920.00` con override 520 su A e standard 400 su B, con tariffa e badge per voce
      - [ ] AC-3 — oracolo: con mappa vuota l'imponibile torna `800.00`
      - [ ] Costi della marginalità e imponibile del riepilogo coincidono anche con override

      ## Blockers
      None.
  - id: TASK-04
    title: I loader di riepilogo mensile e marginalità risolvono la tariffa personalizzata
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Objective
      `riepilogoMese` e `reportMarginalitaPeriodo` leggono gli override da `TariffaCollaboratoreOfferta` e li passano ai calcoli puri.

      ## Read
      - src/lib/attivita.ts — `riepilogoMese` (righe 514-566)
      - src/lib/report.ts — `reportMarginalitaPeriodo` (righe 120-173)
      - src/domain/consuntivi/index.ts — `RigaMarginalita`, nuova firma di `calcolaRiepilogoMese`

      ## Change
      - src/lib/attivita.ts — solo `riepilogoMese`
      - src/lib/report.ts — solo `reportMarginalitaPeriodo`; `reportFatturazioneClienti*` e gli altri report non cambiano (usano la tariffa dell'offerta)

      ## Steps
      1. In `riepilogoMese`, dopo il caricamento delle righe, leggere `db.tariffaCollaboratoreOfferta.findMany({ where: { collaboratoreId: collaboratore.id }, select: { offertaId: true, tariffaGiornaliera: true } })` e costruire `new Map(override.map((o) => [o.offertaId, o.tariffaGiornaliera.toString()]))`; passarla come terzo argomento a `calcolaRiepilogoMese`. `tariffaGiornaliera` del risultato resta la tariffa standard.
      2. In `reportMarginalitaPeriodo`, dopo `righeDb`, leggere `db.tariffaCollaboratoreOfferta.findMany({ where: { offertaId: { in: [...new Set(righeDb.map((r) => r.offertaId))] } }, select: { collaboratoreId: true, offertaId: true, tariffaGiornaliera: true } })`, costruire una `Map` con chiave `` `${collaboratoreId}:${offertaId}` `` e valorizzare `tariffaCollaboratoreGiornaliera` con l'override della coppia della riga, altrimenti `riga.collaboratore.tariffaGiornaliera.toString()`. Saltare la query quando `righeDb` è vuoto.
      3. Aggiornare il JSDoc di `reportMarginalitaPeriodo`: i costi usano la tariffa personalizzata della coppia collaboratore-offerta se presente, altrimenti la tariffa del collaboratore.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica
      - Run: `npx vitest run tests/unit/attivita.test.ts tests/unit/marginalita-clienti.test.ts tests/unit/riepilogo-mese.test.ts`
      - Expect: verdi come in baseline

      ## Done
      - [ ] AC-2 — riepilogo mensile e report marginalità usano l'override della coppia quando presente, altrimenti la tariffa standard
      - [ ] AC-3 — senza riga di override i loader passano la sola tariffa standard

      ## Blockers
      None.
  - id: TASK-05
    title: Unit test dei loader riepilogoMese e reportMarginalitaPeriodo con override
    type: Test
    status: TODO
