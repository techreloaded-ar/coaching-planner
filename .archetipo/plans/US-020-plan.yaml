    body: |-
      ## Objective
      Un test Playwright dimostra l'intero flusso: l'amministratore imposta l'override, il collaboratore lo ritrova nel riepilogo, la marginalità lo usa nei costi, la rimozione ripristina la tariffa standard.

      ## Read
      - tests/e2e/README.md — contratto e2e
      - tests/e2e/support/fixtures.ts, tests/e2e/support/factory.ts — `createCliente`, `createOfferta`, `createCollaboratore` (`tariffaGiornaliera`), `createAbilitazioneOfferta`, `createRigaAttivita`
      - tests/e2e/support/date.ts — `meseRiservato`, `dataNelMese`
      - tests/e2e/support/auth.ts — `accediComeAdmin`, `accediCome`
      - tests/e2e/ingaggi-offerta.spec.ts — marcatore univoco e selezione per nome
      - tests/e2e/report-marginalita.spec.ts — formatter euro, lettura delle celle di riga offerta, URL `?da=&a=`
      - tests/e2e/demo__riepilogo-mensile-fattura.spec.ts — formato degli importi del front office e `data-testid` del riepilogo
      - tests/e2e/gestione-utenti.spec.ts — uso di `browser.newContext()` per un secondo utente

      ## Change
      - tests/e2e/tariffa-personalizzata-offerta.spec.ts — nuovo file; nessuna modifica ai helper condivisi né alle entità del seed

      ## Steps
      1. Dati da factory: un cliente con marcatore univoco, offerte A e B (tariffa offerta 600,00) dello stesso cliente con codici derivati dal marcatore, un collaboratore con `tariffaGiornaliera: "400.00"`, ingaggi su A e B, una riga fatturabile da 8 h su A e una su B in `meseRiservato("US-020-TARIFFA-PERSONALIZZATA")`.
      2. Amministratore (`page`, `accediComeAdmin`): `goto(/offerte/{A.id}/collaboratori)`, click su "Imposta tariffa", `selectOption({ label: ... })` con il testo derivato da cognome/nome del collaboratore, `fill("520,00")` sulla label "Tariffa giornaliera", click su "Salva tariffa". Nella sezione "Tariffe personalizzate" (`getByRole("region", { name: "Tariffe personalizzate" })`) la riga del collaboratore mostra `520,00 €` e "Aggiornata il" con la data odierna `gg/mm/aaaa` (Europe/Rome). Reload: valori ancora visibili (AC-1, AC-4).
      3. Collaboratore in un secondo context (`browser.newContext()` + `accediCome(pagina, collaboratore.utente.email)`): `goto(/attivita/riepilogo?mese={mese})`; `summary-importo-fattura-value` contiene l'importo di 920,00 nel formato del front office; la riga dell'offerta A contiene "Personalizzata" e quella di B no (AC-2).
      4. Amministratore: `goto(/report/marginalita?da={mese}&a={mese})`; la riga dell'offerta A ha costi `520,00 €` e la riga B `400,00 €` (AC-2).
      5. Amministratore: torna alla pagina dell'offerta A, "Rimuovi" sulla riga e conferma; compare "Nessuna tariffa personalizzata: tutti i collaboratori usano la propria tariffa standard." (AC-3).
      6. Collaboratore: reload del riepilogo → importo 800,00, nessun "Personalizzata"; amministratore: marginalità A costi `400,00 €` (AC-3).
      7. Chiudere il secondo context alla fine. Solo `expect` web-first, ruoli/label/nomi esatti, niente attese fisse, niente selettori di classi Tailwind, niente `selectOption({ index })`.

      ## Verify
      - Run: `npx playwright test tests/e2e/tariffa-personalizzata-offerta.spec.ts`
      - Expect: 1 test passato
      - Run: `npx playwright test tests/e2e/tariffa-personalizzata-offerta.spec.ts --repeat-each=3`
      - Expect: 3 passati (dati per tentativo isolati da factory)
      - Run: `npm run lint`
      - Expect: verde, guardrail e2e passato, nessun nuovo avviso oltre ai 3 preesistenti

      ## Done
      - [ ] AC-1 — oracolo: la riga del collaboratore mostra `520,00 €` dopo salvataggio e reload
      - [ ] AC-2 — oracolo: riepilogo con importo 920,00 e badge solo su A; marginalità con costi 520,00 su A e 400,00 su B
      - [ ] AC-3 — oracolo: dopo la rimozione lo stato vuoto è visibile, il riepilogo torna a 800,00 e i costi di A a 400,00
      - [ ] AC-4 — oracolo: "Aggiornata il" con la data odierna visibile nella pagina dell'offerta

