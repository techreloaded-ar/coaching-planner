  - id: TASK-06
    title: Query e Server Action per impostare e rimuovere la tariffa personalizzata
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      L'amministratore dispone di una query che elenca gli override dell'offerta e di due Server Action idempotenti per impostarli (upsert) e rimuoverli.

      ## Read
      - src/lib/abilitazioni.ts — `CollaboratoreIngaggiato`, `elencaCollaboratoriIngaggiati` (stile, guardia `richiediRuoloApi`, ordinamenti)
      - src/app/(back-office)/offerte/[offertaId]/collaboratori/ingaggi-actions.ts — forma di `StatoIngaggiAction`, guardie, `revalidatePath`
      - src/domain/anagrafiche/valida-collaboratore.ts — `validaCampoTariffaGiornaliera` (riga 81)
      - src/domain/anagrafiche/valida-offerta.ts — `normalizzaTariffaGiornaliera`
      - tests/unit/ingaggi-offerta-dal-actions.test.ts — aspettative esatte su `select` di `elencaCollaboratoriIngaggiati`

      ## Change
      - src/lib/abilitazioni.ts — aggiungere `tariffaStandard: string` a `CollaboratoreIngaggiato` (select di `tariffaGiornaliera`), nuova interfaccia `TariffaPersonalizzataOfferta` e nuova query `elencaTariffePersonalizzateOfferta`
      - src/app/(back-office)/offerte/[offertaId]/collaboratori/tariffe-actions.ts — nuovo file con `StatoTariffaPersonalizzataAction`, `impostaTariffaPersonalizzata`, `rimuoviTariffaPersonalizzata`
      - tests/unit/ingaggi-offerta-dal-actions.test.ts — aggiornare solo le aspettative di `select`/risultato di `elencaCollaboratoriIngaggiati` per il nuovo campo
      - Non modificare `ingaggi-actions.ts`: la revoca di un ingaggio non tocca gli override

      ## Steps
      1. In `abilitazioni.ts` definire:
         ```ts
         export interface TariffaPersonalizzataOfferta {
           collaboratoreId: string;
           nome: string;
           cognome: string;
           email: string;
           tariffaStandard: string;
           tariffaPersonalizzata: string;
           creataIl: string;     // ISO 8601
           aggiornataIl: string; // ISO 8601
           ingaggiato: boolean;
         }
         ```
      2. `elencaTariffePersonalizzateOfferta(offertaId)`: `await richiediRuoloApi("AMMINISTRATORE")`; `db.tariffaCollaboratoreOfferta.findMany({ where: { offertaId }, include: { collaboratore: { select: { id, nome, cognome, tariffaGiornaliera, utente: { select: { email } }, abilitazioniOfferte: { where: { offertaId }, select: { id: true } } } } }, orderBy: [{ collaboratore: { cognome: "asc" } }, { collaboratore: { nome: "asc" } }] })`; mappare `ingaggiato` come `abilitazioniOfferte.length > 0`, importi con `.toString()`, date con `.toISOString()`.
      3. In `tariffe-actions.ts` (`"use server"`), `impostaTariffaPersonalizzata(_prev, formData)`: `richiediRuoloApi("AMMINISTRATORE")`; leggere `offertaId`, `collaboratoreId`, `tariffaGiornaliera`; errori `_form` "ID offerta mancante" / "Seleziona un collaboratore"; `validaCampoTariffaGiornaliera` → errore sul campo `tariffaGiornaliera`; verificare con `db.abilitazioneOfferta.findUnique({ where: { collaboratoreId_offertaId: { collaboratoreId, offertaId } } })` che il collaboratore sia ingaggiato, altrimenti `_form` "Il collaboratore non è ingaggiato su questa offerta"; poi `db.tariffaCollaboratoreOfferta.upsert({ where: { collaboratoreId_offertaId: {...} }, create: { collaboratoreId, offertaId, tariffaGiornaliera: normalizzata.valore }, update: { tariffaGiornaliera: normalizzata.valore } })`.
      4. `rimuoviTariffaPersonalizzata(_prev, formData)`: guardia di ruolo, validazione degli id, `db.tariffaCollaboratoreOfferta.deleteMany({ where: { collaboratoreId, offertaId } })` (idempotente, nessun controllo di ingaggio).
      5. Entrambe: `revalidatePath(`/offerte/${offertaId}/collaboratori`)` e ritorno `{ errori: {}, successo: true }`; nessuna scrittura negli esiti di rifiuto.
      6. Aggiornare le aspettative di `ingaggi-offerta-dal-actions.test.ts` per `tariffaStandard`.

      ## Verify
      - Run: `npx vitest run tests/unit/ingaggi-offerta-dal-actions.test.ts`
      - Expect: verde
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica

      ## Done
      - [ ] AC-1 — l'amministratore può impostare o modificare la tariffa della coppia con validazione dell'importo e dell'ingaggio
      - [ ] AC-3 — la rimozione cancella la sola coppia bersaglio
      - [ ] AC-4 — la query espone tariffe standard e personalizzata, date di creazione e aggiornamento e stato di ingaggio

      ## Blockers
      None.
