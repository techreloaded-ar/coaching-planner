schema: archetipo/plan/v2
spec_code: US-013
body: |-
  # US-013: Registrazione della trasferta con rimborso automatico — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-01

  ---

  ## Spec

  **Epic:** EP-003 — Consuntivazione Attività
  **Priorità:** HIGH | **Punti:** 3

  **Storia Utente**
  Come Giulia, collaboratrice, voglio registrare una trasferta indicando solo la distanza in km e vedere il rimborso forfettario calcolato automaticamente, così da non dover ricordare gli scaglioni né fare conti a mano.

  **Criteri di Accettazione**
  - La collaboratrice registra una trasferta su una giornata indicando la distanza in km, associata al cliente di riferimento.
  - Il rimborso forfettario è calcolato automaticamente dagli scaglioni configurati e mostrato subito.
  - La modifica della distanza ricalcola il rimborso; l'eliminazione della trasferta lo rimuove dai totali.
  - Una distanza oltre la soglia massima configurata è gestita con un comportamento definito e comunicato chiaramente.

  ---

  ## Contesto Tecnico

  US-012 è DONE e ha già introdotto la route `/attivita/[data]`, il Client Component `dettaglio-giornata.tsx`, le Server Actions `creaRiga`, `modificaRiga`, `eliminaRiga`, e il DAL front-office in `src/lib/attivita.ts`. Lo schema Prisma contiene già `RigaAttivita.trasfertaKm Int?` e `ScaglioneKm(finoAKm, importo)`, quindi la spec non richiede una nuova tabella: la trasferta viene modellata come distanza chilometrica opzionale sulla riga attività associata a cliente e offerta.

  I mockup di riferimento sono stati generati in `docs/mockups/US-013/` e mostrano una sezione di trasferta visibile nella pagina dettaglio giornata, con anteprima immediata dello scaglione e del rimborso.

  ---

  ## Soluzione Tecnica

  ### Decisione di modello

  La distanza viene salvata nel campo esistente `RigaAttivita.trasfertaKm`. Il rimborso non viene persistito: viene ricalcolato dalla configurazione corrente degli scaglioni ogni volta che la riga viene caricata o salvata. Questa scelta è coerente con l'MVP attuale, evita migrazioni non necessarie e mantiene la logica di calcolo in `src/domain/consuntivi`. Se in futuro servirà congelare lo scaglione storico usato, sarà una spec separata di tracciabilità contabile.

  ### Calcolo rimborso

  Aggiungere funzioni pure in `src/domain/consuntivi/index.ts`:

  - `validaKmTrasferta(input: string)`: accetta solo interi positivi; normalizza gli spazi; rifiuta vuoto, zero, negativi, decimali e testo.
  - `calcolaRimborsoTrasferta(km: number, scaglioni: ScaglioneRimborso[])`: ordina gli scaglioni per `finoAKm`, seleziona il primo con `finoAKm >= km` e restituisce importo, soglia e label fascia; se non esiste uno scaglione applicabile restituisce stato `OLTRE_SOGLIA`.
  - `formattaEuro` o helper equivalente solo se non esiste già una convenzione riusabile; la UI può formattare con `Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' })`.

  Comportamento definito per distanza oltre soglia massima: il salvataggio viene rifiutato con un messaggio chiaro, ad esempio: `Distanza oltre la soglia massima configurata (250 km): chiedi all'amministrazione di aggiungere uno scaglione.` La preview client mostra lo stesso stato prima del submit.

  ### Accesso dati e sicurezza

  Il DAL front-office deve poter leggere gli scaglioni senza passare da `src/lib/scaglioni.ts`, che è admin-only. Aggiungere in `src/lib/attivita.ts` una funzione collaboratore-scoped, ad esempio `scaglioniRimborsoTrasferta()`, che richiede `richiediCollaboratoreCorrente()` e restituisce `{ id, finoAKm, importo }` ordinati. Le Server Actions devono ricaricare gli scaglioni lato server e validare il km prima di scrivere, così il client non può salvare distanze non coperte o dati manipolati.

  Le mutazioni continuano a verificare proprietà della riga prima di modifica/eliminazione. Per creazione/modifica, se `trasfertaKm` è presente, viene salvato come intero; se il campo è vuoto o assente, viene salvato `null`, rimuovendo la trasferta dalla riga.

  ### UI e UX

  La pagina `/attivita/[data]` resta la superficie principale. Il form riga attività viene esteso con una sezione “Trasferta” opzionale: input km, preview dello scaglione e importo, messaggio per nessuno scaglione configurato o distanza oltre soglia. Ogni card riga mostra, quando presente, un badge/box con km, fascia e importo rimborso. Il riepilogo giornata aggiunge `Totale rimborsi` e si aggiorna dopo creazione, modifica o cancellazione. L'eliminazione della trasferta può essere implementata come pulsante `Rimuovi trasferta` sulla riga, che imposta `trasfertaKm = null` mantenendo la riga attività.

  ### Integrazione con dati dimostrativi

  Aggiornare il seed affinché una riga del mese corrente abbia `trasfertaKm: 150`, così lo scenario demo può mostrare il rimborso automatico con gli scaglioni già configurati. Gli scaglioni seed attuali sono 50, 100 e 250 km; 150 km ricade nello scaglione fino a 250 km.

  ---

  ## Strategia di Test

  ### Unit test (Vitest)

  Testare le funzioni pure di dominio per validazione km e calcolo rimborso: input validi, vuoti, decimali, negativi, zero, soglia esatta, scaglione intermedio, scaglioni non ordinati, nessuno scaglione e distanza oltre soglia massima. Testare inoltre le Server Actions con database mockato: creazione con trasferta valida, modifica che cambia km e ricalcola, campo vuoto che rimuove la trasferta, rifiuto oltre soglia e rifiuto per riga di altro collaboratore.

  ### Test E2E — Simulazione Utente

  **Framework rilevato:** Playwright (`playwright.config.ts`, suite in `tests/e2e/`).
  **Demo video atteso:** sì, la spec ha un incremento filmabile descritto nel campo Dimostrazione; la registrazione resta a carico di `archetipo-review`.

  Scenario demo: Giulia accede come collaboratrice, apre `/attivita/{giorno}`, inserisce o modifica una riga associata a un cliente attivo, compila `150` km, vede immediatamente lo scaglione e il rimborso, salva, verifica che la card e il totale rimborsi mostrino lo stesso importo; poi modifica i km e verifica il ricalcolo; infine rimuove la trasferta e verifica che il totale rimborsi torni a zero o al valore residuo.

  Scenari non-demo: validazione km vuoto/zero/negativo/decimale/testo; distanza oltre soglia massima con messaggio chiaro e nessun salvataggio; autorizzazione/segregazione su righe di altri collaboratori dove già possibile con test unit; regressione su creazione/modifica riga senza trasferta.

  ---

  _Plan generato via ARchetipo Planning — 2026-07-01_
tasks:
  - id: TASK-01
    title: Calcolo dominio rimborso trasferta
    type: Impl
    status: DONE
    body: |-
      ## Descrizione

      **Objective:** aggiungere nel dominio consuntivi la validazione della distanza e il calcolo puro del rimborso da scaglioni configurati.

      **Read:** `src/domain/consuntivi/index.ts`, `src/domain/types.ts`, `prisma/schema.prisma`, `src/domain/anagrafiche/valida-scaglione.ts`.

      **Change:** in `src/domain/consuntivi/index.ts` introdurre tipi espliciti per gli scaglioni usati nel calcolo, `validaKmTrasferta(input: string)` e `calcolaRimborsoTrasferta(km: number, scaglioni: ScaglioneRimborso[])`. La validazione accetta solo interi positivi; il calcolo ordina gli scaglioni per soglia e seleziona il primo `finoAKm >= km`.

      **Steps:**
      1. Definire tipi di risultato con stati chiari, ad esempio `OK`, `NESSUNO_SCAGLIONE`, `OLTRE_SOGLIA`.
      2. Implementare messaggi utente in italiano per input mancante, non intero, non positivo e oltre soglia.
      3. Restituire nel risultato OK almeno `km`, `importo`, `finoAKm` e una label fascia usabile dalla UI.
      4. Non usare float per importi oltre alla conversione display; preservare l'importo come stringa/Decimal serializzabile quando arriva dal DB.

      **Verify:** `npx vitest run tests/unit/rimborso-trasferta.test.ts` dopo TASK-02.

      **Done:** le funzioni sono esportate dal modulo consuntivi e non dipendono da Next, Prisma o React.

      **Blockers:** se il tipo Decimal generato da Prisma non è importabile nel dominio senza dipendenze infrastrutturali, usare un tipo minimo `{ toString(): string } | string | number` per l'importo.

      ## File Coinvolti
      - `src/domain/consuntivi/index.ts` — aggiunta funzioni pure e tipi
      - `src/domain/types.ts` — eventuale tipo condiviso solo se serve davvero

      ## Criteri di Completamento
      - [ ] `validaKmTrasferta("150")` restituisce valore 150 valido
      - [ ] `validaKmTrasferta("0")`, `"-1"`, `"12,5"`, `"abc"` e vuoto sono rifiutati
      - [ ] `calcolaRimborsoTrasferta(150, [50,100,250])` sceglie lo scaglione fino a 250 km
      - [ ] Una distanza oltre la massima restituisce stato e messaggio chiaro, non un importo inventato
    ref: TASK-01
  - id: TASK-02
    title: Unit test dominio rimborso trasferta
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione

      **Objective:** coprire con Vitest la validazione km e la scelta dello scaglione.

      **Read:** `tests/unit/valida-ore.test.ts`, `tests/unit/valida-scaglione.test.ts`, `src/domain/consuntivi/index.ts`.

      **Change:** creare `tests/unit/rimborso-trasferta.test.ts` con casi puri, senza mock DB.

      **Steps:**
      1. Testare input validi con spazi e soglie esatte.
      2. Testare input non validi: vuoto, zero, negativo, decimale con virgola/punto, testo.
      3. Testare calcolo con scaglioni non ordinati per garantire ordinamento interno.
      4. Testare assenza scaglioni e superamento soglia massima.

      **Verify:** `npx vitest run tests/unit/rimborso-trasferta.test.ts` deve passare con 0 failure.

      **Done:** tutti i rami di risultato delle funzioni di TASK-01 sono esercitati.

      **Blockers:** se i nomi finali delle funzioni cambiano in TASK-01, aggiornare gli import nei test mantenendo gli stessi casi.

      ## File Coinvolti
      - `tests/unit/rimborso-trasferta.test.ts` — nuovo file di test

      ## Criteri di Completamento
      - [ ] Test validazione km copre casi validi e non validi
      - [ ] Test calcolo rimborso copre soglia esatta, fascia intermedia e oltre soglia
      - [ ] Il comando `npx vitest run tests/unit/rimborso-trasferta.test.ts` passa
    ref: TASK-02
  - id: TASK-03
    title: DAL front-office per scaglioni e righe con rimborso
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione

      **Objective:** rendere disponibili alla pagina collaboratore gli scaglioni e i dati trasferta delle righe, senza usare il DAL admin-only.

      **Read:** `src/lib/attivita.ts`, `src/lib/scaglioni.ts`, `src/app/(front-office)/attivita/[data]/page.tsx`, `prisma/schema.prisma`.

      **Change:** estendere `src/lib/attivita.ts` con una funzione collaboratore-scoped, ad esempio `scaglioniRimborsoTrasferta()`, che restituisce gli scaglioni ordinati per soglia. Aggiornare la serializzazione in `page.tsx` per includere `trasfertaKm` e una struttura di rimborso calcolata per ogni riga.

      **Steps:**
      1. Aggiungere `scaglioniRimborsoTrasferta()` con `richiediCollaboratoreCorrente()` e query `db.scaglioneKm.findMany({ orderBy: { finoAKm: 'asc' } })`.
      2. In `DettaglioGiornataPage`, caricare in parallelo righe, clienti e scaglioni.
      3. Serializzare `trasfertaKm` in `RigaAttivitaClient`.
      4. Calcolare per ogni riga il risultato rimborso usando le funzioni di dominio; passare anche la lista scaglioni serializzata al Client Component per la preview live.
      5. Mantenere il pattern Next 16 già presente: `params` e `searchParams` sono Promise.

      **Verify:** `npm run lint` deve almeno non introdurre errori TypeScript/ESLint nei file modificati; i test completi arrivano nelle task successive.

      **Done:** la pagina riceve righe con `trasfertaKm`, rimborso calcolato e scaglioni disponibili per preview.

      **Blockers:** se una riga ha una distanza salvata ma gli scaglioni sono stati rimossi o abbassati, mostrare stato non calcolabile invece di crashare.

      ## File Coinvolti
      - `src/lib/attivita.ts` — funzione scaglioni front-office
      - `src/app/(front-office)/attivita/[data]/page.tsx` — caricamento, serializzazione e calcolo rimborso

      ## Criteri di Completamento
      - [ ] Gli scaglioni sono leggibili da un collaboratore autenticato
      - [ ] `RigaAttivitaClient` include `trasfertaKm` e dati rimborso serializzabili
      - [ ] La pagina non usa `src/lib/scaglioni.ts` admin-only
      - [ ] La pagina gestisce righe senza trasferta e righe oltre soglia senza errore runtime
    ref: TASK-03
  - id: TASK-04
    title: Server Actions per salvare e rimuovere trasferta
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Descrizione

      **Objective:** permettere a creazione, modifica e rimozione di una riga di gestire `trasfertaKm` in modo sicuro e validato.

      **Read:** `src/lib/actions/righe-attivita.ts`, `src/lib/attivita.ts`, `src/domain/consuntivi/index.ts`, `tests/unit/righe-attivita-actions.test.ts`.

      **Change:** estendere `creaRiga` e `modificaRiga` per leggere il campo opzionale `trasfertaKm`. Aggiungere una action dedicata, ad esempio `rimuoviTrasferta(rigaId: string)`, che verifica proprietà e imposta `trasfertaKm: null`.

      **Steps:**
      1. Estrarre helper server-side per validare `trasfertaKm`: vuoto => `null`, valore valido e coperto da scaglione => intero, oltre soglia => errore.
      2. In creazione salvare `trasfertaKm` solo se presente; altrimenti lasciare `null`.
      3. In modifica, se il form contiene `trasfertaKm`, aggiornare il campo; se contiene stringa vuota, rimuovere la trasferta.
      4. Implementare `rimuoviTrasferta` con verifica proprietario e `revalidatePath` della giornata.
      5. Prima di salvare, verificare anche che l'offerta selezionata appartenga al cliente selezionato e sia attiva quando si interviene su una riga nuova o modificata.

      **Verify:** `npx vitest run tests/unit/righe-attivita-actions.test.ts` dopo TASK-07; manualmente, una distanza oltre soglia deve restituire `{ success: false, error }`.

      **Done:** nessuna mutazione può salvare una distanza non valida o oltre soglia massima.

      **Blockers:** se la suite esistente mocka `db.rigaAttivita` senza `trasfertaKm`, aggiornare i mock in modo retrocompatibile senza indebolire i test già presenti.

      ## File Coinvolti
      - `src/lib/actions/righe-attivita.ts` — estendere action esistenti e aggiungere rimozione trasferta
      - `src/lib/attivita.ts` — eventuale helper condiviso per scaglioni, se già non esposto da TASK-03

      ## Criteri di Completamento
      - [ ] `creaRiga` salva `trasfertaKm` valido e rifiuta oltre soglia
      - [ ] `modificaRiga` aggiorna o rimuove `trasfertaKm`
      - [ ] `rimuoviTrasferta` imposta `trasfertaKm` a `null` solo per righe proprie
      - [ ] Ogni mutazione rivalida `/attivita/{data}`
    ref: TASK-04
  - id: TASK-05
    title: UI dettaglio giornata con preview rimborso
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Descrizione

      **Objective:** esporre nella pagina dettaglio giornata l'inserimento km, la preview immediata del rimborso e i totali aggiornati.

      **Read:** `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx`, `src/app/(front-office)/attivita/[data]/page.tsx`, `docs/mockups/US-013/index.html`, `docs/mockups/US-012/index.html`.

      **Change:** aggiornare il Client Component per gestire `trasfertaKm` come campo opzionale della riga attività e mostrare rimborso calcolato dagli scaglioni passati dal server.

      **Steps:**
      1. Aggiungere stato form per `trasfertaKm`, validazione locale e preview con `calcolaRimborsoTrasferta`.
      2. Aggiungere una sezione compatta “Trasferta” nel form con input `Distanza km`, hint e stato rimborso.
      3. In modalità modifica, popolare il km esistente; in reset form svuotarlo.
      4. In submit, aggiungere `trasfertaKm` al `FormData` quando valorizzato, o stringa vuota quando si vuole rimuovere.
      5. Nelle card riga, mostrare km, fascia e importo; se presente, aggiungere pulsante `Rimuovi trasferta`.
      6. Nel riepilogo alto aggiungere `Totale rimborsi` calcolato dalle righe correnti.
      7. Mostrare messaggio chiaro quando il km supera la soglia massima configurata; in quel caso il submit deve essere bloccato lato client e comunque rifiutato lato server.

      **Verify:** avviare l'app con `npm run dev` e verificare manualmente `/attivita/{YYYY-MM-DD}`; poi copertura E2E in TASK-08.

      **Done:** una collaboratrice vede subito l'importo stimato prima del salvataggio e lo stesso importo nella card dopo il refresh.

      **Blockers:** mantenere accessibilità base: label associata all'input km, messaggi errore leggibili, pulsanti con testo/aria-label.

      ## File Coinvolti
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — UI form, card e riepilogo
      - `src/app/(front-office)/attivita/[data]/page.tsx` — props verso il client se non completate in TASK-03
      - `docs/mockups/US-013/` — riferimento visuale, non importare codice del mockup nella app

      ## Criteri di Completamento
      - [ ] Il form accetta una distanza km opzionale e mostra preview rimborso
      - [ ] Le card con trasferta mostrano km, scaglione e importo
      - [ ] Il riepilogo giornata include totale rimborsi
      - [ ] Modifica e rimozione trasferta aggiornano UI e totali dopo refresh
      - [ ] Oltre soglia massima mostra un errore chiaro e blocca il salvataggio
    ref: TASK-05
  - id: TASK-06
    title: Seed demo con trasferta da 150 km
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione

      **Objective:** rendere disponibile nei dati demo una trasferta coerente con la dimostrazione della spec.

      **Read:** `prisma/seed.ts`, `tests/e2e/demo__inserimento-righe-attivita.helpers.ts`.

      **Change:** aggiornare o confermare una riga attività del mese corrente con `trasfertaKm: 150`. Gli scaglioni seed devono coprire 150 km.

      **Steps:**
      1. Individuare una riga del mese corrente usata dagli e2e, preferibilmente giorno 3 o 4.
      2. Impostare `trasfertaKm: 150` su una riga fatturabile associata a cliente/offerta attivi.
      3. Non rimuovere varietà esistente di righe fatturabili/non fatturabili.
      4. Se gli scaglioni seed restano 50, 100, 250, documentare implicitamente che 150 ricade in `fino a 250 km`.

      **Verify:** `npm run db:seed` in ambiente locale/e2e configurato deve completare senza errori.

      **Done:** una pagina giorno del mese corrente mostra almeno una trasferta già valorizzata.

      **Blockers:** non leggere o modificare `.env`; se il database locale non è configurato, limitarsi a verificare staticamente il seed e lasciare il comando come gate per l'implementatore.

      ## File Coinvolti
      - `prisma/seed.ts` — dati demo trasferta

      ## Criteri di Completamento
      - [ ] Esiste almeno una riga seed con `trasfertaKm: 150`
      - [ ] La riga usa cliente e offerta attivi
      - [ ] `npm run db:seed` non introduce errori di schema
    ref: TASK-06
  - id: TASK-07
    title: Unit test actions trasferta
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione

      **Objective:** estendere la suite delle Server Actions per coprire salvataggio, modifica e rimozione della trasferta.

      **Read:** `tests/unit/righe-attivita-actions.test.ts`, `src/lib/actions/righe-attivita.ts`, `tests/unit/scaglioni-dal-actions.test.ts`.

      **Change:** aggiornare `tests/unit/righe-attivita-actions.test.ts` o creare un file vicino se la dimensione cresce troppo. Mockare `db.scaglioneKm.findMany` e le query necessarie per verificare offerta/cliente.

      **Steps:**
      1. Testare `creaRiga` con `trasfertaKm=150` e scaglione fino a 250.
      2. Testare `creaRiga` oltre soglia e aspettarsi `success: false` senza chiamata create.
      3. Testare `modificaRiga` che cambia km e `modificaRiga` con km vuoto che salva `null`.
      4. Testare `rimuoviTrasferta` con riga propria, riga altrui e riga inesistente.
      5. Assicurare che i test esistenti senza trasferta continuino a passare.

      **Verify:** `npx vitest run tests/unit/righe-attivita-actions.test.ts` deve passare con 0 failure.

      **Done:** le mutazioni server-side hanno copertura per casi positivi, oltre soglia e autorizzazione.

      **Blockers:** se i mock globali del file diventano fragili, separare in `tests/unit/trasferte-actions.test.ts` ma mantenere lo stesso comando di verifica o documentare il comando aggiornato.

      ## File Coinvolti
      - `tests/unit/righe-attivita-actions.test.ts` — estensione test esistenti
      - `tests/unit/trasferte-actions.test.ts` — opzionale se serve separare

      ## Criteri di Completamento
      - [ ] Test copre salvataggio trasferta valida
      - [ ] Test copre rifiuto oltre soglia massima
      - [ ] Test copre modifica e rimozione trasferta
      - [ ] Test copre rifiuto su riga di altro collaboratore
      - [ ] La regressione delle righe senza trasferta resta verde
    ref: TASK-07
  - id: TASK-08
    title: E2E Playwright flusso trasferta
    type: Test
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
      - TASK-07
    body: |-
      ## Descrizione

      **Objective:** verificare il flusso filmabile della spec e i casi di validazione principali in Playwright.

      **Read:** `tests/e2e/demo__inserimento-righe-attivita-flusso.spec.ts`, `tests/e2e/demo__inserimento-righe-attivita.helpers.ts`, `playwright.config.ts`, `docs/mockups/US-013/index.html`.

      **Change:** creare test Playwright per US-013, preferibilmente `tests/e2e/demo__trasferta-rimborso-automatico.spec.ts` per lo scenario demo con video e `tests/e2e/trasferta-rimborso-validazione.spec.ts` per casi non-demo.

      **Steps:**
      1. Login come Giulia tramite helper esistente.
      2. Navigare a una data del mese corrente con dati seed oppure creare una nuova riga via UI.
      3. Inserire `150` km, verificare che la preview mostri un importo e una fascia/scaglione.
      4. Salvare e verificare card riga e `Totale rimborsi`.
      5. Modificare i km con un valore in un altro scaglione e verificare ricalcolo.
      6. Rimuovere la trasferta e verificare rimozione dalla card e dai totali.
      7. In test separato, provare valore oltre soglia, zero, negativo, decimale e testo.

      **Verify:** `npx playwright test tests/e2e/demo__trasferta-rimborso-automatico.spec.ts` deve passare; se aggiunto il file non-demo, eseguire anche `npx playwright test tests/e2e/trasferta-rimborso-validazione.spec.ts`.

      **Done:** lo scenario demo è filmabile e copre registrazione, ricalcolo e rimozione.

