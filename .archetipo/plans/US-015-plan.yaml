schema: archetipo/plan/v2
spec_code: US-015
body: "# US-015: Report mensile degli importi da fatturare per cliente — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-03\n\n---\n\n## Spec\n\n**Epic:** EP-004 — Reportistica\n**Priorità:** HIGH | **Punti:** 3\n\n**Storia Utente**\nCome Stefano, amministratore, voglio un report mensile per cliente con l'importo da fatturare calcolato dalle attività dei collaboratori, così da sapere a fine mese quanto fatturare a ogni cliente senza elaborazioni manuali.\n\n**Criteri di Accettazione**\n- L'amministratore seleziona il mese e ottiene per ogni cliente l'importo totale da fatturare con dettaglio per offerta\n- L'importo per offerta è calcolato come giornate fatturabili erogate (1 giornata = 8 ore) moltiplicate per la tariffa giornaliera dell'offerta\n- I rimborsi trasferta del mese sono ribaltati al cliente di riferimento con lo stesso importo forfettario riconosciuto al collaboratore\n- Il report ricalcola sempre i dati correnti: riaprendolo dopo una modifica retroattiva, i valori riflettono lo stato attuale\n\n---\n\n## Soluzione Tecnica\n\nIl report è una nuova pagina del **Back Office** (area amministratore) che aggrega **tutte** le righe attività del mese — di ogni collaboratore — sulle offerte di ciascun cliente. È il duale lato-cliente del riepilogo del collaboratore (US-014): la differenza sostanziale è che l'importo si calcola con la **tariffa giornaliera dell'offerta** (non del collaboratore) e che l'aggregazione avviene **per cliente** senza segregazione dati (l'amministratore vede tutti i collaboratori). La logica di calcolo è isolata in una funzione pura del modulo dominio `consuntivi` (ADR-006), mentre l'accesso dati è admin-only in un nuovo modulo `src/lib/report.ts`.\n\n### Regole di calcolo (dominio)\n\nPer ogni **cliente** con attività nel mese:\n- **Dettaglio per offerta**: `giornateFatturabiliErogate` = (somma delle ore delle righe **fatturabili** di quell'offerta) / `ORE_PER_GIORNATA` (8); `imponibile` = `giornateFatturabiliErogate × tariffaGiornaliera dell'offerta`.\n- **Rimborsi trasferta ribaltati al cliente**: per ogni riga con `trasfertaKm != null` si calcola il rimborso con `calcolaRimborsoTrasferta(trasfertaKm, scaglioni)`; si somma `parseFloat(importo)` solo per gli stati `OK`. Il rimborso è attribuito al cliente della riga con lo **stesso importo forfettario** riconosciuto al collaboratore (nessun ricarico — assunzione confermata dal committente, PRD §Assunzioni da Validare, RF-14).\n- **Totale da fatturare del cliente** = somma degli imponibili delle offerte + rimborsi trasferta ribaltati.\n\n**Totali di report** = somma su tutti i clienti di imponibile manodopera, rimborsi e importo totale.\n\n### Decisioni chiave\n- **Tariffa dell'offerta, non del collaboratore**: l'importo lato cliente usa `Offerta.tariffaGiornaliera`. Questa è la distinzione chiave rispetto a US-014 (che usa `Collaboratore.tariffaGiornaliera`).\n- **Solo righe fatturabili nell'imponibile manodopera**: le righe non fatturabili non concorrono all'importo da fatturare al cliente (il report è un documento di fatturazione attiva). Non vengono mostrate come voce separata: il report espone giornate/imponibile fatturabili.\n- **Ribaltamento rimborsi coerente con US-014**: si ribaltano tutte le trasferte con rimborso `OK`, coerentemente con RF-14 (\"ogni trasferta registrata concorre... all'importo da fatturare al cliente\") e con il calcolo lato collaboratore. *Assunzione*: le trasferte concorrono a prescindere dal flag `fatturabile` della riga (il flag riguarda la manodopera, non il rimborso spese). Da confermare in review se il comportamento atteso è diverso.\n- **Conversione 1g = 8h**: usa la costante `ORE_PER_GIORNATA`; le giornate sono frazionarie e concorrono al calcolo senza arrotondamento intermedio, solo il valore esposto è formattato a 2 decimali.\n- **Decimal e denaro (ADR-005)**: tariffe e rimborsi entrano nel calcolo come stringhe/numeri Decimal derivati da Prisma; la funzione di dominio resta pura (riceve valori già serializzati) e restituisce importi come stringhe `toFixed(2)`.\n- **Nessun blocco del mese (RF-15)**: il report ricalcola sempre sui dati correnti a ogni rendering server-side; una modifica retroattiva alle righe si riflette semplicemente riaprendo/ricaricando il report.\n\n### Componenti\n\n- **Funzione di dominio `calcolaReportFatturazioneClienti`** (`src/domain/consuntivi/index.ts`): funzione pura, dipendenza-zero, che riceve le righe del mese arricchite, e gli scaglioni km, e restituisce la struttura aggregata per cliente/offerta con i totali. Riusa `ORE_PER_GIORNATA` e `calcolaRimborsoTrasferta` già presenti nel modulo.\n- **Accesso dati `reportFatturazioneClientiMese(token)`** (`src/lib/report.ts`, nuovo modulo server-only admin-only): risolve il ruolo AMMINISTRATORE (`richiediRuoloApi`), recupera **tutte** le righe del mese (nessun filtro collaboratore) con `include: { offerta: true, cliente: true }`, gli scaglioni, mappa in input di dominio (Decimal→string, ore→number) e invoca la funzione pura. Riusa la logica di intervallo mese di `attivitaDelMese`.\n- **Route** `src/app/(back-office)/report/fatturazione-clienti/page.tsx`: Server Component asincrono. `richiediRuolo(\"AMMINISTRATORE\")`, legge `searchParams.mese` (default `tokenMeseCorrente()`), valida con `parseTokenMese` (fallback al mese corrente), calcola mese precedente/successivo/etichetta, invoca l'accesso dati e passa i dati serializzati al Client Component.\n- **Client Component** `src/app/(back-office)/report/fatturazione-clienti/report-fatturazione-clienti.tsx`: barra navigazione mese, sezione per cliente con importo totale in evidenza e tabella dettaglio per offerta, riga rimborsi ribaltati e totale cliente, scheda totale complessivo del mese, stato vuoto. Segue i mockup in `docs/mockups/US-015/`, estetica back office (accent indigo, dark mode).\n- **Abilitazione voce sidebar \"Report\"** (`src/app/(back-office)/console-sidebar.tsx`): la voce \"Report\", oggi `disabled` con badge \"In arrivo\", diventa un link attivo verso `/report/fatturazione-clienti`.\n- **Seed** (`prisma/seed.ts`): arricchimento dei dati dimostrativi per rendere il report significativo nel mese corrente (più clienti/offerte con righe fatturabili, almeno una trasferta con rimborso, attività di più di un collaboratore se già presenti).\n\n---\n\n## Strategia di Test\n\nLa logica contabile critica (aggregazione per cliente/offerta, uso della tariffa dell'offerta, conversione ore→giornate, esclusione delle righe non fatturabili dall'imponibile, ribaltamento dei rimborsi) è coperta da **unit test** sulla funzione pura di dominio, senza dipendenze dal database. Il flusso amministratore e l'aggiornamento sui dati correnti sono coperti da **test e2e**.\n\n### Unit test (Vitest)\n- `calcolaReportFatturazioneClienti`: mese vuoto (perCliente vuoto, totali \"0.00\"); un cliente con una offerta e righe fatturabili (giornate × tariffa offerta); più offerte dello stesso cliente aggregate; più clienti; righe di **collaboratori diversi** sulla stessa offerta sommate insieme; esclusione delle righe non fatturabili dall'imponibile; ribaltamento rimborso trasferta con stato `OK` e attribuzione al cliente corretto; trasferta oltre soglia (`stato !== \"OK\"`) esclusa dai rimborsi; importi formattati a 2 decimali; totale cliente = imponibile + rimborsi; totali di report = somma per cliente.\n- Riferimento di stile: `tests/unit/rimborso-trasferta.test.ts`.\n\n### E2E Tests — Simulazione Utente\n\n**Framework:** Playwright (già configurato nel progetto)\n**Video demo:** atteso — la spec ha un campo `Dimostrazione` filmabile (il video viene registrato in fase di review da `archetipo-review`, non durante l'implementazione)\n\n| Scenario | Flusso utente |\n|---|---|\n| Report visibile e corretto (demo) | Stefano (amministratore) accede, apre dalla sidebar la voce \"Report\", visualizza per il mese corrente l'elenco per cliente con dettaglio per offerta (giornate × tariffa offerta), i rimborsi trasferta ribaltati e l'importo totale da fatturare; verifica che un importo sia coerente con i dati seed |\n| Navigazione mese | Stefano naviga al mese precedente/successivo e torna al mese corrente: il report mostra i dati del mese selezionato |\n| Ricalcolo su dato corrente | Un mese senza attività mostra lo stato vuoto; (opzionale) dopo una modifica retroattiva alle righe, riaprendo il report i valori riflettono lo stato attuale |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono generati in `docs/mockups/US-015/`\n\n_Piano generato tramite ARchetipo Planning — 2026-07-03_"
tasks:
  - id: TASK-01
    title: Funzione di dominio calcolaReportFatturazioneClienti
    type: Impl
    status: DONE
    body: |-
      ## Descrizione

      Aggiungere la funzione pura `calcolaReportFatturazioneClienti` a `src/domain/consuntivi/index.ts`. Aggrega le righe attività del mese (di tutti i collaboratori) per cliente e, dentro ogni cliente, per offerta, calcolando l'importo da fatturare con la **tariffa dell'offerta** e ribaltando i rimborsi trasferta al cliente.

      **Firma:** `calcolaReportFatturazioneClienti(righe: RigaReportFatturazione[], scaglioni: ScaglioneRimborso[]): ReportFatturazioneClienti`

      **Tipo input `RigaReportFatturazione`** (definirlo nello stesso file, dipendenza-zero): `{ clienteId: string, clienteRagioneSociale: string, offertaId: string, offertaCodice: string, offertaDescrizione: string, tariffaOffertaGiornaliera: string | number, ore: number, fatturabile: boolean, trasfertaKm: number | null }`

      **Tipo output `ReportFatturazioneClienti`**: `{ perCliente: VoceClienteReport[], totali: { imponibileManodopera: string, totaleRimborsi: string, importoTotale: string } }`

      **Tipo `VoceClienteReport`**: `{ clienteId, clienteRagioneSociale, perOfferta: VoceOffertaReport[], rimborsiTrasferta: string, imponibileManodopera: string, importoTotale: string }`

      **Tipo `VoceOffertaReport`**: `{ offertaId, offertaCodice, offertaDescrizione, tariffaGiornaliera: string, giornateFatturabili: number, imponibile: string }`

      **Logica:**
      - Raggruppa le righe per `clienteId`, poi per `offertaId` dentro ogni cliente.
      - Per ogni offerta: `giornateFatturabili` = (somma delle `ore` delle righe con `fatturabile === true`) / `ORE_PER_GIORNATA`; `imponibile` = `giornateFatturabili × Number(tariffaOffertaGiornaliera)`, formattato `toFixed(2)`.
      - Per ogni riga con `trasfertaKm != null`: calcola `calcolaRimborsoTrasferta(trasfertaKm, scaglioni)`; se `stato === "OK"` somma `parseFloat(importo)` ai `rimborsiTrasferta` del **cliente della riga** (a prescindere dal flag `fatturabile`).
      - `imponibileManodopera` del cliente = somma degli `imponibile` delle sue offerte.
      - `importoTotale` del cliente = `imponibileManodopera` + `rimborsiTrasferta`.
      - Includi nel report solo i clienti con almeno un'offerta con `giornateFatturabili > 0` **oppure** con `rimborsiTrasferta > 0`.
      - `totali` di report = somma su tutti i clienti di imponibile manodopera, rimborsi e importo totale.
      - Ordina i clienti per `clienteRagioneSociale` e le offerte per `offertaCodice`.
      - Tutti gli importi esposti come stringhe con 2 decimali; i valori numerici interni restano `number` senza arrotondamento intermedio.
      - Caso mese vuoto: `perCliente: []`, tutti i totali `"0.00"`.

      **Pattern:** funzione pura, nessuna dipendenza dal framework o da Prisma; usa `ORE_PER_GIORNATA` e `calcolaRimborsoTrasferta` già esportati dal modulo. Esporta funzione e tipi dal barrel.

      ## File Coinvolti
      - `src/domain/consuntivi/index.ts` — aggiungere `calcolaReportFatturazioneClienti` + tipi `RigaReportFatturazione`, `ReportFatturazioneClienti`, `VoceClienteReport`, `VoceOffertaReport` ed esportarli

      ## Criteri di Completamento
      - [ ] `calcolaReportFatturazioneClienti([], scaglioni)` restituisce `perCliente: []` e totali `"0.00"`
      - [ ] Un cliente con una offerta (tariffa 500) e righe fatturabili 8h + 4h: `giornateFatturabili = 1.5`, `imponibile = "750.00"`, `importoTotale = "750.00"`
      - [ ] L'importo usa la tariffa dell'**offerta**, non del collaboratore
      - [ ] Righe di collaboratori diversi sulla stessa offerta vengono sommate nella stessa `VoceOffertaReport`
      - [ ] Una riga non fatturabile NON concorre a `giornateFatturabili`/`imponibile`
      - [ ] Una riga con `trasfertaKm` coperto da scaglione aggiunge il rimborso a `rimborsiTrasferta` del cliente corretto e all'`importoTotale`
      - [ ] Una riga con `trasfertaKm` oltre soglia (`stato !== "OK"`) NON aggiunge rimborso
      - [ ] Clienti con solo attività non fatturabili e senza rimborsi sono esclusi dal report
      - [ ] Tutti gli importi esposti sono stringhe con 2 decimali; clienti ordinati per ragione sociale, offerte per codice
    ref: TASK-01
  - id: TASK-02
    title: Unit test calcolaReportFatturazioneClienti
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione

      Scrivere test Vitest per la funzione `calcolaReportFatturazioneClienti` (TASK-01). Coprire aggregazione per cliente/offerta, uso della tariffa dell'offerta, conversione ore→giornate, esclusione delle righe non fatturabili, ribaltamento dei rimborsi trasferta e formattazione degli importi. Seguire le convenzioni dei test esistenti in `tests/unit/` (vedi `tests/unit/rimborso-trasferta.test.ts` come riferimento di stile e struttura).

      ## File Coinvolti
      - `tests/unit/report-fatturazione-clienti.test.ts` — nuovo file di test

      ## Criteri di Completamento
      - [ ] Test caso mese vuoto: `perCliente` vuoto, totali `"0.00"`
      - [ ] Test aggregazione per offerta e per cliente (più offerte, più clienti)
      - [ ] Test che l'imponibile usa la tariffa dell'offerta e la conversione 8h = 1g (es. 8h+4h con tariffa 500 → "750.00")
      - [ ] Test somma righe di collaboratori diversi sulla stessa offerta
      - [ ] Test esclusione righe non fatturabili dall'imponibile
      - [ ] Test ribaltamento rimborso trasferta (stato OK) al cliente corretto e esclusione oltre soglia
      - [ ] Test totale cliente = imponibile + rimborsi e totali di report = somma per cliente
      - [ ] Test formattazione importi a 2 decimali come stringhe
      - [ ] `npx vitest run tests/unit/report-fatturazione-clienti.test.ts` passa con 0 failure
    ref: TASK-02
  - id: TASK-03
    title: Accesso dati admin reportFatturazioneClientiMese in src/lib/report.ts
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione

      Creare il nuovo modulo server-only admin-only `src/lib/report.ts` con la funzione `reportFatturazioneClientiMese(token: string)`. Recupera **tutte** le righe del mese (di ogni collaboratore), calcola i rimborsi e invoca `calcolaReportFatturazioneClienti`.

      **Logica:**
      - `import "server-only";` in testa, come negli altri moduli `src/lib/*`.
      - `richiediRuoloApi("AMMINISTRATORE")` per l'accesso (pattern di `src/lib/scaglioni.ts`).
      - `parseTokenMese(token)`: se non valido restituisce risultato vuoto (`perCliente: []`, totali "0.00").
      - Recupera le righe del mese con `db.rigaAttivita.findMany` — **nessun filtro `collaboratoreId`** (l'amministratore vede tutti) — con intervallo mese (riusa la logica `inizio`/`fine` di `attivitaDelMese`), `include: { offerta: true, cliente: true }`, `orderBy: { data: "asc" }`.
      - Recupera gli scaglioni con `db.scaglioneKm.findMany({ orderBy: { finoAKm: "asc" } })` mappati in `ScaglioneRimborso` (`finoAKm`, `importo: s.importo.toString()`).
      - Mappa ogni riga in `RigaReportFatturazione`: `clienteId`, `clienteRagioneSociale: riga.cliente.ragioneSociale`, `offertaId`, `offertaCodice: riga.offerta.codice`, `offertaDescrizione: riga.offerta.descrizione`, `tariffaOffertaGiornaliera: riga.offerta.tariffaGiornaliera.toString()`, `ore: Number(riga.ore)`, `fatturabile`, `trasfertaKm`.
      - Invoca `calcolaReportFatturazioneClienti(righeMappate, scaglioni)` e restituisce un tipo `RisultatoReportFatturazione` serializzabile: `{ token, ...report }` pronto per il Client Component (nessun Date o Decimal grezzo).

      ## File Coinvolti
      - `src/lib/report.ts` — nuovo file con `reportFatturazioneClientiMese` + tipo `RisultatoReportFatturazione`

      ## Criteri di Completamento
      - [ ] `reportFatturazioneClientiMese(token)` richiede il ruolo AMMINISTRATORE (`richiediRuoloApi`)
      - [ ] Token mese non valido restituisce risultato vuoto senza errori
      - [ ] La query recupera le righe di **tutti** i collaboratori nel mese indicato (nessun filtro collaboratore)
      - [ ] La tariffa passata al dominio è quella dell'**offerta**
      - [ ] Il risultato è serializzabile (nessun Date o Decimal grezzo) e pronto per un Client Component
      - [ ] `npx tsc --noEmit` non riporta errori di tipo
    ref: TASK-03
  - id: TASK-04
    title: Pagina route /report/fatturazione-clienti — Server Component
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione

      Creare `src/app/(back-office)/report/fatturazione-clienti/page.tsx` come Server Component asincrono.

      **Comportamento:**
      - `await richiediRuolo("AMMINISTRATORE")` per il controllo accessi (reindirizza se non admin).
      - Legge `searchParams.mese` (default `tokenMeseCorrente()`); valida con `parseTokenMese`; se non valido ricade sul mese corrente.
      - Calcola `mesePrecedente`, `meseSuccessivo`, `etichettaMese` (da `src/domain/calendario`).
      - Invoca `reportFatturazioneClientiMese(token)` e ottiene i dati serializzati.
      - Passa al Client Component `ReportFatturazioneClienti` (TASK-05): `token`, `tokenPrecedente`, `tokenSuccessivo`, `etichetta`, `report`.
      - Usa il layout back-office esistente (`(back-office)/layout.tsx`), con intestazione view coerente alle pagine anagrafiche (occhiello "Reportistica", titolo "Importi da fatturare per cliente", sottotitolo descrittivo).

      **Nota:** `searchParams` è una Promise in questa versione di Next.js (vedi le pagine anagrafiche esistenti che fanno `await searchParams`).

      ## File Coinvolti
      - `src/app/(back-office)/report/fatturazione-clienti/page.tsx` — nuovo file

      ## Criteri di Completamento
      - [ ] La pagina richiede autenticazione come AMMINISTRATORE
      - [ ] Un token mese non valido ricade sul mese corrente senza errori
      - [ ] La pagina carica `reportFatturazioneClientiMese(token)` e passa dati serializzati al Client Component
      - [ ] Sono calcolati i token per la navigazione mese precedente/successivo e l'etichetta del mese
      - [ ] La pagina usa il layout back-office esistente e un'intestazione coerente con le pagine anagrafiche
    ref: TASK-04
  - id: TASK-05
    title: Client Component ReportFatturazioneClienti — vista report
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione

      Creare `src/app/(back-office)/report/fatturazione-clienti/report-fatturazione-clienti.tsx` come Client Component che renderizza il report mensile seguendo i mockup in `docs/mockups/US-015/`.

      **Struttura:**
      1. **Barra navigazione mese**: pulsanti mese precedente/successivo (Link a `/report/fatturazione-clienti?mese={token}`), etichetta mese, link "Mese corrente" (Link a `/report/fatturazione-clienti`). Coerente con la navigazione mese del front office ma con estetica back office (accent indigo).
      2. **Scheda totale complessivo del mese**: importo totale da fatturare in evidenza, con breakdown imponibile manodopera + totale rimborsi.
      3. **Sezione per cliente**: per ogni cliente ragione sociale, importo totale da fatturare del cliente in evidenza, e tabella dettaglio per offerta (colonne: offerta = codice + descrizione, tariffa giornaliera, giornate fatturabili erogate, imponibile). Sotto la tabella: riga "Rimborsi trasferta ribaltati" e "Totale da fatturare" del cliente.
      4. **Stato vuoto**: se `perCliente` è vuoto, messaggio "Nessuna attività da fatturare per questo mese".

      **Stile:** seguire i mockup in `docs/mockups/US-015/` (index.html + shared.css) per layout, palette (indigo back office), dark mode, bordi arrotondati, ombre e tipografia. Coerenza visiva con le pagine anagrafiche del back office. Importi mostrati in euro con 2 decimali.

      **Nessuna mutazione** avviene in questo componente: è read-only; l'aggiornamento sui dati correnti deriva dal rendering server-side a ogni navigazione/ricaricamento.

      ## File Coinvolti
      - `src/app/(back-office)/report/fatturazione-clienti/report-fatturazione-clienti.tsx` — nuovo file

      ## Criteri di Completamento
      - [ ] La barra di navigazione mese mostra etichetta, precedente/successivo e "Mese corrente" funzionanti
      - [ ] La scheda totale complessivo mostra importo totale, imponibile manodopera e totale rimborsi
      - [ ] Ogni cliente mostra il suo importo totale e la tabella dettaglio per offerta (codice+descrizione, tariffa, giornate fatturabili, imponibile)
      - [ ] Per ogni cliente sono visibili i rimborsi trasferta ribaltati e il totale da fatturare
      - [ ] Lo stato vuoto mostra il messaggio appropriato
      - [ ] Il componente è coerente con i mockup in `docs/mockups/US-015/`, responsive e con dark mode
    ref: TASK-05
  - id: TASK-06
    title: Abilitare la voce sidebar "Report" verso il report clienti
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione

      Modificare `src/app/(back-office)/console-sidebar.tsx` per trasformare la voce "Report" (oggi `disabled` con badge "In arrivo") in un link attivo verso `/report/fatturazione-clienti`.

      **Modifiche:**
      - Nell'array `NAV_ITEMS`, sostituire `{ label: "Report", icon: IconReport, disabled: true }` con `{ href: "/report/fatturazione-clienti", label: "Report", icon: IconReport }`.
      - Verificare che l'evidenziazione della voce attiva (`pathname.startsWith(item.href)`) funzioni per il nuovo percorso.
      - Mantenere invariata l'icona `IconReport` già presente.

      ## File Coinvolti
      - `src/app/(back-office)/console-sidebar.tsx` — abilitare la voce "Report"

      ## Criteri di Completamento
      - [ ] La voce "Report" nella sidebar è un link attivo (nessun badge "In arrivo")
      - [ ] Il link punta a `/report/fatturazione-clienti`
      - [ ] La voce risulta evidenziata quando si è sul report
      - [ ] La navigazione tra le altre voci resta invariata
    ref: TASK-06
  - id: TASK-07
    title: Arricchire il seed per un report cliente significativo
    type: Impl
    status: DONE
    body: |-
      ## Descrizione

      Aggiornare `prisma/seed.ts` in modo che il report per cliente del mese corrente sia significativo per la demo: più clienti con righe fatturabili su offerte diverse, almeno una trasferta con rimborso coperto da scaglione, e — se il seed prevede più collaboratori — attività di almeno due collaboratori sullo stesso cliente/offerta per dimostrare l'aggregazione.

      **Modifiche:**
      - Assicurare che nel mese corrente ci siano attività fatturabili su almeno 2 clienti diversi.
