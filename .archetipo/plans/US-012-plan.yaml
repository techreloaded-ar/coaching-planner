schema: archetipo/plan/v2
spec_code: US-012
body: "# US-012: Inserimento delle righe di attività giornaliere — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-06-29\n\n---\n\n## Spec\n\n**Epic:** EP-003 — Consuntivazione Attività\n**Priorità:** HIGH | **Punti:** 5\n\n**Storia Utente**\nCome Giulia, collaboratrice,\nvoglio inserire per ogni giornata una o più righe di attività, ognuna con cliente, offerta, ore lavorate, nota e flag fatturabile,\ncosì da registrare il lavoro in pochi secondi al giorno senza ricopiature a fine mese.\n\n**Criteri di Accettazione**\n- La collaboratrice inserisce più righe nella stessa giornata, ciascuna associata a un cliente e a una sua offerta, con ore lavorate\n- Ogni riga può avere una nota descrittiva opzionale e un flag fatturabile, attivo per impostazione predefinita\n- Le ore sono validate: valori non positivi o non numerici vengono rifiutati con messaggio chiaro\n- La collaboratrice modifica ed elimina le proprie righe in qualsiasi momento, anche su mesi conclusi, senza alcun blocco\n- Solo clienti e offerte attivi sono selezionabili per le nuove righe\n\n---\n\n## Soluzione Tecnica\n\nLa spec estende il calendario mensile (US-011) con una pagina di dettaglio giornata raggiungibile dal calendario stesso. L'architettura segue lo stesso pattern del progetto: Server Component per il caricamento dati, Client Component per l'interattività, Server Actions per le mutazioni, e funzioni pure di dominio per la validazione.\n\n### Flusso utente\n\n1. Dal calendario mensile, la collaboratrice clicca su un giorno con attività (o ne seleziona uno senza) e accede alla pagina `/attivita/{data}` (YYYY-MM-DD).\n2. La pagina mostra: intestazione con data e riepilogo ore, elenco delle righe già registrate (se presenti), e un form per aggiungere/modificare righe.\n3. Nel form, il campo cliente è una select popolata con i soli clienti attivi. Alla selezione del cliente, il campo offerta si abilita e mostra solo le offerte attive di quel cliente (cascade select).\n4. Le ore accettano input in formato italiano (virgola come separatore decimale, es. \"3,5\") e vengono validate: valori non numerici o ≤ 0 mostrano un errore inline.\n5. Il flag fatturabile è attivo di default. La nota è opzionale.\n6. Ogni riga esistente mostra pulsanti Modifica (che popola il form con i valori correnti) ed Elimina (con rimozione immediata).\n7. Non esiste alcun blocco temporale: la collaboratrice può operare su qualsiasi data passata o futura.\n\n### Decisioni architetturali\n\n- **Nuova route dinamica:** `src/app/(front-office)/attivita/[data]/page.tsx` — Server Component asincrono che riceve `params.data` (YYYY-MM-DD), carica i dati e li passa serializzati al Client Component.\n- **Accesso dati front-office:** nuovo modulo `src/lib/attivita.ts` (estensione di quello introdotto in US-011) con funzioni `righeDelGiorno()`, `clientiAttiviPerSelezione()`, `offerteAttivePerCliente()` — tutte con scope collaboratore (non admin-only come gli esistenti `src/lib/clienti.ts` e `src/lib/offerte.ts`).\n- **Server Actions per CRUD:** `src/lib/actions/righe-attivita.ts` con `creaRiga()`, `modificaRiga()`, `eliminaRiga()` — ognuna verifica l'autenticazione e l'appartenenza della riga al collaboratore corrente tramite `richiediCollaboratoreCorrente()`.\n- **Validazione dominio:** funzione pura `validaOre(raw: string)` in `src/domain/consuntivi/index.ts` che restituisce `{ valido: boolean, valore?: number, errore?: string }`, gestendo la virgola italiana.\n- **Client Component interattivo:** `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — gestisce stato form (aggiunta/modifica), cascade select cliente→offerta, validazione inline, ottimismo per eliminazione.\n- **Integrazione col calendario:** il `CalendarioMensile` (US-011) va aggiornato per trasformare i giorni con attività in link verso `/attivita/{data}` invece di aprire la sidebar di sola lettura.\n\n### Pattern di sicurezza\n\n- Ogni Server Action risolve il collaboratore corrente via `richiediCollaboratoreCorrente()`: se l'utente non è un collaboratore, l'operazione è rifiutata.\n- Le operazioni di modifica ed eliminazione verificano che la riga appartenga effettivamente al collaboratore (`riga.collaboratoreId === collaboratore.id`).\n- I clienti e le offerte sono filtrati lato server per `attivo: true`, garantendo che anche un client malintenzionato non possa selezionare entità disattivate.\n\n---\n\n## Strategia di Test\n\n### Unit test (Vitest)\n\n- **Validazione ore (`validaOre`):** test puri su input validi (\"8\", \"3,5\", \"0.5\"), non validi (\"abc\", \"-1\", \"0\", \"\"), e casi limite (virgola vs punto, spazi bianchi, valori molto grandi).\n- **Server Actions:** test con database mockato per verificare:\n  - `creaRiga`: il record viene creato con i campi corretti e associato al collaboratore in sessione.\n  - `modificaRiga`: aggiorna solo i campi modificati; rifiuta se la riga appartiene a un altro collaboratore.\n  - `eliminaRiga`: cancella il record; rifiuta se la riga non appartiene al collaboratore corrente.\n  - Gestione errori: riga inesistente, collaboratore non autenticato, dati non validi.\n\n### Test E2E — Simulazione Utente\n\n**Framework:** Playwright\n**Registrazione video:** Solo lo scenario demo; gli altri scenari girano senza registrazione\n\n| Scenario | Flusso utente simulato |\n|---|---|\n| Demo: inserimento, modifica ed eliminazione righe | Giulia apre il mese corrente dal calendario, clicca su un giorno, aggiunge una riga su TechSolutions/TS-2025-01 con 4 ore fatturabili e nota, aggiunge una seconda riga su DataFlow/DF-2025-02 con 2 ore non fatturabili, modifica la prima riga cambiando le ore a 5, elimina la seconda riga, verifica che il riepilogo giornata si aggiorni correttamente. |\n| Giorno senza attività | Giulia naviga a un giorno senza righe registrate: il form è in modalità aggiunta, nessuna riga esistente, messaggio \"Nessuna riga registrata\". |\n| Validazione ore | Giulia tenta di inserire una riga con ore \"0\", ore negative, e testo non numerico: il sistema mostra un errore inline chiaro e non permette il submit. |\n| Mese concluso senza blocchi | Giulia naviga a una data passata (es. giugno 2025), aggiunge una riga e la elimina: il sistema permette entrambe le operazioni senza alcun messaggio di blocco. |\n\n---\n\n> \U0001F3A8 I mockup per questa spec sono disponibili in `docs/mockups/US-012/`\n\n_Plan generato via ARchetipo Planning — 2026-06-29_\n"
tasks:
  - id: TASK-01
    title: 'Validazione dominio: funzione pura validaOre'
    type: Impl
    status: DONE
    body: |
      ## Descrizione

      Aggiungere la funzione `validaOre` a `src/domain/consuntivi/index.ts`. La funzione riceve una stringa (input utente), la normalizza (virgola → punto, trim), e restituisce `{ valido: boolean, valore?: number, errore?: string }`.

      **Regole di validazione:**
      - La stringa non deve essere vuota
      - Deve rappresentare un numero valido (dopo normalizzazione)
      - Il valore deve essere > 0
      - Il valore non deve superare 24 ore
      - Messaggi di errore in italiano (es. "Inserisci un numero maggiore di zero", "Valore non valido")

      **Pattern:** funzione pura, nessuna dipendenza dal framework, esportata dal barrel `src/domain/consuntivi/index.ts`.

      ## File Coinvolti
      - `src/domain/consuntivi/index.ts` — aggiungere `validaOre` e riesportare
      - `src/domain/types.ts` — nessuna modifica (usa il tipo esistente)

      ## Criteri di Completamento
      - [ ] `validaOre("8")` restituisce `{ valido: true, valore: 8 }`
      - [ ] `validaOre("3,5")` restituisce `{ valido: true, valore: 3.5 }`
      - [ ] `validaOre("0.5")` restituisce `{ valido: true, valore: 0.5 }`
      - [ ] `validaOre("0")` restituisce `{ valido: false, errore: "..." }`
      - [ ] `validaOre("-1")` restituisce `{ valido: false, errore: "..." }`
      - [ ] `validaOre("abc")` restituisce `{ valido: false, errore: "..." }`
      - [ ] `validaOre("")` restituisce `{ valido: false, errore: "..." }`
      - [ ] `validaOre("25")` restituisce `{ valido: false, errore: "..." }` (max 24h)
      - [ ] `validaOre("  4  ")` restituisce `{ valido: true, valore: 4 }` (trim)
    ref: TASK-01
  - id: TASK-02
    title: Unit test validazione ore
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |
      ## Descrizione

      Scrivere test Vitest per la funzione `validaOre` aggiunta in TASK-01. Coprire tutti i casi di validità e i messaggi di errore. Seguire le convenzioni di test esistenti in `tests/unit/`.

      ## File Coinvolti
      - `tests/unit/valida-ore.test.ts` — nuovo file di test

      ## Criteri di Completamento
      - [ ] Test copre input validi: interi, decimali con virgola, decimali con punto, con spazi
      - [ ] Test copre input non validi: zero, negativi, testo, vuoto, > 24
      - [ ] Ogni caso verifica il campo `errore` per i casi non validi
      - [ ] `npx vitest run tests/unit/valida-ore.test.ts` passa con 0 failure
    ref: TASK-02
  - id: TASK-03
    title: 'Accesso dati: righe del giorno, clienti e offerte attivi per il collaboratore'
    type: Impl
    status: DONE
    body: |
      ## Descrizione

      Estendere `src/lib/attivita.ts` (creato in US-011) con tre nuove funzioni server-only:

      1. **`righeDelGiorno(data: string)`** — recupera le righe attività del collaboratore corrente per una data specifica (YYYY-MM-DD), includendo offerta e cliente. Parsa la data, calcola inizio e fine giornata, interroga con `gte/lte`.

      2. **`clientiAttiviPerSelezione()`** — restituisce `{ id, ragioneSociale }` di tutti i clienti attivi, ordinati per ragione sociale. A differenza di `src/lib/clienti.ts` (admin-only), questa funzione è accessibile al collaboratore autenticato.

      3. **`offerteAttivePerCliente(clienteId: string)`** — restituisce `{ id, codice, descrizione }` delle offerte attive per il cliente specificato, ordinate per codice.

      Tutte le funzioni usano `richiediCollaboratoreCorrente()` per l'autenticazione (lanciano ErroreAutorizzazione se non autenticato o se non è un collaboratore).

      **Nota:** se `src/lib/attivita.ts` non esiste ancora nella root del progetto (perché US-011 non è ancora stata mergiata), crearlo ex-novo seguendo lo stesso pattern del worktree US-011.

      ## File Coinvolti
      - `src/lib/attivita.ts` — aggiungere le tre funzioni (o creare il file se non esiste)

      ## Criteri di Completamento
      - [ ] `righeDelGiorno()` restituisce solo le righe del collaboratore corrente per la data specificata
      - [ ] `righeDelGiorno()` include `offerta` e `cliente` nelle righe
      - [ ] `clientiAttiviPerSelezione()` restituisce solo clienti con `attivo: true`, ordinati
      - [ ] `offerteAttivePerCliente()` restituisce solo offerte con `attiva: true` per quel cliente
      - [ ] Tutte le funzioni richiedono autenticazione come collaboratore
    ref: TASK-03
  - id: TASK-04
    title: 'Server Actions: crea, modifica, elimina riga attività'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |
      ## Descrizione

      Creare `src/lib/actions/righe-attivita.ts` con tre Server Actions:

      1. **`creaRiga(formData: FormData)`** — estrae i campi dal form (clienteId, offertaId, ore, nota, fatturabile, data), valida con `validaOre`, risolve il collaboratore corrente, crea il record RigaAttivita.

      2. **`modificaRiga(formData: FormData)`** — estrae rigaId e i campi modificati, verifica che la riga appartenga al collaboratore corrente, aggiorna solo i campi presenti nel form.

      3. **`eliminaRiga(rigaId: string)`** — verifica appartenenza della riga al collaboratore, elimina il record.

      **Controllo accessi:** ogni azione chiama `richiediCollaboratoreCorrente()` e, per modifica/elimina, verifica `riga.collaboratoreId === collaboratore.id`.

      **Gestione errori:** le azioni restituiscono `{ success: true }` oppure `{ success: false, error: string }` per permettere al client di mostrare feedback.

      **Revalidate:** dopo ogni mutazione riuscita, chiamare `revalidatePath()` sul percorso `/attivita/{data}` per aggiornare la UI.

      ## File Coinvolti
      - `src/lib/actions/righe-attivita.ts` — nuovo file

      ## Criteri di Completamento
      - [ ] `creaRiga` crea un record con tutti i campi corretti e associato al collaboratore
      - [ ] `creaRiga` rifiuta ore non valide con messaggio di errore
      - [ ] `modificaRiga` aggiorna i campi e rifiuta righe di altri collaboratori
      - [ ] `eliminaRiga` cancella il record e rifiuta righe di altri collaboratori
      - [ ] Ogni mutazione riuscita fa revalidate del percorso
      - [ ] Le azioni sono marcate `"use server"` e esportate come funzioni async
    ref: TASK-04
  - id: TASK-05
    title: Unit test Server Actions (con db mockato)
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |
      ## Descrizione

      Scrivere test Vitest per le tre Server Actions di TASK-04. Usare un database Prisma mockato (seguendo il pattern `tests/unit/__mocks__/` già esistente) per verificare:

      - `creaRiga`: record creato con campi corretti, rifiuto ore non valide
      - `modificaRiga`: aggiornamento corretto, rifiuto riga di altro collaboratore, rifiuto riga inesistente
      - `eliminaRiga`: cancellazione corretta, rifiuto riga di altro collaboratore, rifiuto riga inesistente
      - Comportamento senza sessione (ErroreAutorizzazione)

      ## File Coinvolti
      - `tests/unit/righe-attivita-actions.test.ts` — nuovo file

      ## Criteri di Completamento
      - [ ] Test copre creazione con dati validi e rifiuto con ore non valide
      - [ ] Test copre modifica: successo e rifiuto per riga altrui
      - [ ] Test copre eliminazione: successo e rifiuto per riga altrui
      - [ ] Test copre caso senza autenticazione (errore atteso)
      - [ ] `npx vitest run tests/unit/righe-attivita-actions.test.ts` passa con 0 failure
    ref: TASK-05
  - id: TASK-06
    title: Pagina dettaglio giornata — Server Component /attivita/[data]
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |
      ## Descrizione

      Creare `src/app/(front-office)/attivita/[data]/page.tsx` come Server Component asincrono.

      **Comportamento:**
      - Riceve `params.data` (YYYY-MM-DD) e `searchParams` (mese corrente per il link "torna al calendario")
      - Verifica il ruolo `COLLABORATORE` via `richiediRuolo()`
      - Parsa e valida il parametro data: se non è una data valida, reindirizza a `/attivita`
      - Carica in parallelo: `righeDelGiorno()`, `clientiAttiviPerSelezione()`
      - Serializza i dati (Date → string) per il passaggio al Client Component
      - Renderizza il Client Component `DettaglioGiornata` (TASK-07) con i dati caricati
      - Passa il token mese corrente per il link di ritorno al calendario

      **Layout:** la pagina usa il layout front-office esistente (`(front-office)/layout.tsx`).

      ## File Coinvolti
      - `src/app/(front-office)/attivita/[data]/page.tsx` — nuovo file

      ## Criteri di Completamento
      - [ ] La pagina richiede autenticazione come COLLABORATORE
      - [ ] Un parametro data non valido (es. "abc") reindirizza a `/attivita`
      - [ ] La pagina carica le righe del giorno per il collaboratore corrente
      - [ ] La pagina carica i clienti attivi per la select
      - [ ] I dati vengono serializzati correttamente per il Client Component
      - [ ] È presente un link "Torna al calendario" che preserva il contesto del mese
    ref: TASK-06
  - id: TASK-07
    title: Client Component DettaglioGiornata — form interattivo e lista righe
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |
      ## Descrizione

      Creare `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` come Client Component.

      **Struttura del componente:**

      1. **Intestazione:** giorno della settimana, data estesa in italiano, riepilogo dinamico (n. righe, ore totali, ore fatturabili).

      2. **Lista righe registrate:** ogni riga mostra cliente, offerta (codice + descrizione), ore, badge fatturabile/non fatturabile, nota (se presente), pulsanti Modifica ed Elimina. Se nessuna riga, mostra messaggio vuoto.

      3. **Form aggiunta/modifica:**
         - Select cliente (popolata da `clientiAttivi` passati come prop)
         - Select offerta (inizialmente disabilitata; popolata dinamicamente quando si seleziona il cliente)
         - Input ore (accetta virgola, validazione inline con messaggio di errore)
         - Checkbox fatturabile (attivo di default)
         - Textarea nota (opzionale)
         - Pulsante submit ("Aggiungi riga" / "Salva modifiche") e pulsante Annulla (in modifica)

      4. **Cascade select cliente → offerta:** quando l'utente seleziona un cliente, il componente chiama una Server Action o API per ottenere le offerte attive di quel cliente e popola la select offerta.

      5. **Modifica:** cliccando Modifica su una riga, i valori vengono caricati nel form, il pulsante submit cambia in "Salva modifiche", appare il pulsante Annulla.

      6. **Eliminazione:** cliccando Elimina, la riga viene rimossa immediatamente (con conferma o undo).

      **Stile:** seguire i mockup in `docs/mockups/US-012/` per layout, spaziatura, colori e tipografia. Coerenza visiva con il calendario mensile (US-011).

      ## File Coinvolti
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — nuovo file

      ## Criteri di Completamento
      - [ ] La lista mostra correttamente le righe esistenti con tutti i campi
      - [ ] La select cliente mostra solo clienti attivi
      - [ ] La select offerta si popola in base al cliente selezionato (solo offerte attive)
      - [ ] L'input ore valida inline e mostra errore per valori non validi
      - [ ] Il form in modalità "nuova riga" crea la riga e aggiorna la lista
      - [ ] La modifica carica i valori della riga nel form e li salva correttamente
      - [ ] L'eliminazione rimuove la riga dalla lista
      - [ ] Il riepilogo giornata (righe, ore, fatturabili) si aggiorna dopo ogni operazione
      - [ ] Il componente è responsive e accessibile
    ref: TASK-07
  - id: TASK-08
    title: 'Aggiornare il calendario: link ai giorni con attività'
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |
      ## Descrizione

      Modificare il componente `CalendarioMensile` (US-011, `src/app/(front-office)/attivita/calendario-mensile.tsx`) per sostituire la sidebar di sola lettura con link diretti alla pagina di dettaglio giornata.

      **Modifiche:**
      - I giorni con attività, invece di essere `<button>` che aprono la sidebar, diventano `<Link href={/attivita/${key}}>` (o usano `router.push`).
      - Rimuovere la sidebar di sola lettura (pannello laterale + overlay) e la nota "In arrivo (US-012)".
      - Mantenere il badge di riepilogo rapido (n. righe, ore totali) visibile nella cella del calendario.
      - Il link "Mese corrente" deve continuare a funzionare.

      **Nota:** se `calendario-mensile.tsx` non esiste ancora nella root del progetto (perché US-011 non è stata mergiata), copiarlo dal worktree US-011 e applicare le modifiche sopra.

      ## File Coinvolti
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — modifica o creazione
      - `src/app/(front-office)/attivita/page.tsx` — potrebbe richiedere modifiche se il worktree non è mergiato

      ## Criteri di Completamento
      - [ ] Cliccando un giorno con attività nel calendario si naviga a `/attivita/{YYYY-MM-DD}`
      - [ ] La sidebar di sola lettura è rimossa
      - [ ] La nota "In arrivo (US-012)" è rimossa
      - [ ] Il badge con numero righe e ore totali per giorno rimane visibile
      - [ ] La navigazione tra mesi funziona invariata
    ref: TASK-08
  - id: TASK-09
    title: Aggiornare il seed con attività nel mese corrente
    type: Impl
    status: DONE
    body: |
      ## Descrizione

      Aggiornare `prisma/seed.ts` per rendere le attività dimostrative relative al mese corrente (o a mesi recenti) invece che a date fisse del 2025. Questo garantisce che la demo mostri sempre giorni con attività.

      **Modifiche:**
      - Sostituire le date hardcoded (`new Date("2025-06-02")`, ecc.) con date calcolate dinamicamente a partire dal mese corrente (es. primi giorni del mese corrente o mese precedente).
      - Mantenere la varietà: più clienti, più offerte, righe fatturabili e non, con e senza nota.
      - Aggiungere almeno 2-3 righe su giorni diversi del mese corrente per una demo efficace.

      ## File Coinvolti
      - `prisma/seed.ts` — modificare la sezione "Attività dimostrative"

      ## Criteri di Completamento
      - [ ] Le attività dimostrative usano date relative al mese corrente
      - [ ] Almeno 2 giorni del mese corrente hanno attività
      - [ ] Almeno un giorno ha 2+ righe su clienti/offerte diversi
      - [ ] Sono presenti righe fatturabili e non fatturabili
      - [ ] `npx prisma db seed` esegue senza errori
    ref: TASK-09
  - id: TASK-10
    title: 'Test E2E: flusso inserimento, modifica ed eliminazione righe'
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-09
    body: |
      ## Descrizione

      Scrivere test Playwright per il flusso completo di US-012. Creare `tests/e2e/demo__inserimento-righe-attivita.spec.ts`.

      **Scenario demo (con video):**
      1. Autenticarsi come Giulia Conti (usare l'helper di autenticazione e2e esistente)
      2. Navigare al calendario (`/attivita`)
      3. Cliccare su un giorno con attività (o navigare direttamente a `/attivita/{data}`)
      4. Verificare che la pagina di dettaglio mostri le righe esistenti e il form
      5. Aggiungere una nuova riga: selezionare cliente → offerta, inserire ore, aggiungere nota, verificare fatturabile attivo, submit
      6. Verificare che la riga appaia nella lista e il riepilogo si aggiorni
      7. Aggiungere una seconda riga su un cliente/offerta diverso con ore diverse
      8. Modificare la prima riga: cambiare le ore, salvare, verificare l'aggiornamento
      9. Eliminare la seconda riga: verificare che scompaia dalla lista
      10. Il riepilogo (righe, ore totali) deve riflettere le modifiche

      **Scenario validazione (senza video):**
      - Tentare submit con ore vuote, zero, negative, testo: verificare messaggi di errore

      **Scenario mese concluso (senza video):**
      - Navigare a una data passata, verificare che aggiunta/modifica/eliminazione funzioni senza blocchi

      ## File Coinvolti
      - `tests/e2e/demo__inserimento-righe-attivita.spec.ts` — nuovo file

      ## Criteri di Completamento
      - [ ] Lo scenario demo passa (aggiunta 2 righe, modifica 1, eliminazione 1)
      - [ ] Lo scenario validazione verifica i messaggi di errore per ore non valide
