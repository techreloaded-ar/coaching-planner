  - id: TASK-08
    title: 'Test E2E: flusso riepilogo mensile con importo fattura'
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
    body: |
      ## Descrizione

      Scrivere test Playwright per il flusso completo di US-014. Creare `tests/e2e/demo__riepilogo-mensile-fattura.spec.ts`.

      **Scenario demo (con video):**
      1. Autenticarsi come Giulia Conti (usare l'helper `loginComeGiulia` da `tests/e2e/demo__inserimento-righe-attivita.helpers.ts`)
      2. Navigare al calendario (`/attivita`), cliccare il link "Riepilogo mese" (o navigare direttamente a `/attivita/riepilogo?mese={tokenMeseCorrente}`)
      3. Verificare che la pagina di riepilogo mostri le schede (ore totali, giornate, rimborsi) e la tabella per-offerta con i dati delle attività registrate nel mese
      4. Verificare che la scheda "Importo fattura" mostri un importo coerente con i dati (giornate fatturabili × tariffa + rimborsi)
      5. Tornare al calendario, aprire una giornata del mese e aggiungere una nuova riga fatturabile (cliente, offerta, ore)
      6. Tornare al riepilogo mese e verificare che ore, giornate e importo fattura siano aggiornati

      **Scenario esclusione non fatturabili (senza video):**
      - Aggiungere una riga non fatturabile da una giornata del mese, tornare al riepilogo: le ore totali crescono ma l'importo fattura resta invariato (la riga non fatturabile è conteggiata nelle ore totali ma non nelle fatturabili)

      **Scenario mese vuoto (senza video):**
      - Navigare a un mese senza attività: verificare il messaggio di stato vuoto e `importoFattura` a 0

      ## File Coinvolti
      - `tests/e2e/demo__riepilogo-mensile-fattura.spec.ts` — nuovo file

      ## Criteri di Completamento
      - [ ] Lo scenario demo passa (apertura riepilogo, verifica dati, inserimento riga, verifica aggiornamento)
      - [ ] Lo scenario esclusione non fatturabili verifica che l'importo non cambi ma le ore totali crescano
      - [ ] Lo scenario mese vuoto verifica lo stato vuoto e importo a 0
      - [ ] `npx playwright test tests/e2e/demo__riepilogo-mensile-fattura.spec.ts` passa
      - [ ] Il video del demo scenario viene generato in `docs/test-results/US-014/`
    ref: TASK-08
