spec_code: US-003
body: |-
  # US-003: Suite di test e pipeline di integrazione continua — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-06-11

  ---

  ## Spec

  **Epic:** EP-000 — Fondazione del Progetto
  **Priorità:** HIGH | **Punti:** 2
  **Dipendenze:** US-001 completata

  **Storia Utente**
  Come sviluppatore del progetto Coaching Planner, voglio una suite di test unitari (Vitest) ed end-to-end (Playwright) eseguita automaticamente a ogni push, così da intercettare le regressioni prima che raggiungano la produzione.

  **Criteri di Accettazione**
  - Vitest è configurato e almeno un test unitario di esempio passa
  - Playwright è configurato e un test e2e di smoke sulla pagina iniziale passa
  - La pipeline CI esegue install, lint, test unitari, build e test e2e a ogni push e fallisce se uno step fallisce

  ---

  ## Soluzione Tecnica

  La base introdotta da US-001 contiene già script npm, configurazioni Vitest e Playwright e test di smoke iniziali; questa spec deve consolidarli come contratto di qualità del progetto e aggiungere l’automazione CI mancante.

  - Mantenere Vitest come runner unitario con ambiente node, alias @ verso src e discovery limitata a tests/unit/**/*.test.ts, verificando che il test di esempio sia stabile e rappresentativo della toolchain TypeScript.
  - Mantenere Playwright come runner e2e in Chromium con webServer Next.js locale e smoke test sulla homepage; eventuali artefatti demo della spec vanno salvati sotto docs/test-results/US-003/.
  - Aggiungere un workflow GitHub Actions in .github/workflows/ci.yml attivo su push, preferibilmente anche pull_request, con Node 22, npm ci, installazione browser Playwright, npm run lint, npm test, npm run build e npm run test:e2e.
  - Evitare duplicazioni tra locale e CI: la pipeline deve chiamare gli script npm già documentati, così ogni sviluppatore può riprodurre gli stessi controlli sul proprio ambiente.

  ---

  ## Strategia di Test

  La verifica della spec coincide con la qualità della toolchain: i test devono passare localmente e gli stessi comandi devono essere cablati nella pipeline.

  - Test unitari: eseguire npm test e mantenere almeno un test di esempio su un modulo TypeScript reale, ad esempio src/domain/types.ts, per validare alias e compilazione.
  - Test e2e: eseguire npm run test:e2e con Playwright su Chromium e validare che la homepage mostri il contenuto atteso e il link di accesso.
  - CI: verificare staticamente il workflow e, quando disponibile il repository remoto, osservare che una run fallisca se uno step fallisce e passi con lint, unit, build ed e2e verdi.

  ### Test E2E — Simulazione utente

  **Framework:** Playwright rilevato da playwright.config.ts e package.json
  **Registrazione video:** solo scenario demo, quando utile alla review, con output in docs/test-results/US-003/; gli altri scenari restano senza video

  | Scenario | Flusso utente simulato |
  |---|---|
  | Smoke homepage | Lo sviluppatore avvia la suite e2e, Playwright apre la homepage, verifica il titolo Coaching Planner, il sottotitolo e il link Accedi verso /login. |
  | Demo qualità locale | Lo sviluppatore esegue i comandi npm test e npm run test:e2e e ottiene esito positivo, dimostrando che la base di test è riproducibile in locale. |

  ---

  _Piano generato tramite ARchetipo Planning — 2026-06-11_
