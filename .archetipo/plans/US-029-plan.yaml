schema: archetipo/plan/v2
spec_code: US-029
body: |-
  # US-029: Attivazione del proxy di autenticazione con rinnovo sliding della sessione — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-15

  ---

  ## Spec

  **Epic:** EP-001 — Autenticazione e Ruoli
  **Priorità:** HIGH | **Punti:** 3
  **Bloccata da:** US-027 (`DONE`)

  **Storia utente**
  Come utente autenticato di Coaching Planner (titolare o collaboratore), voglio che la mia sessione si rinnovi automaticamente finché uso l'applicazione e che le rotte protette mi reindirizzino subito alla pagina di accesso quando non sono autenticato, così da non essere disconnesso a metà lavoro dopo un tempo fisso dalla creazione della sessione e da non vedere mai un caricamento parziale prima del rinvio all'accesso.

  **Criteri di accettazione**
  - Il proxy è attivo e intercetta le rotte protette prima del rendering; `/`, il flusso Google, il supporto e2e e la tombstone `/login` restano pubblici.
  - La sessione usa una scadenza sliding: JWT e cookie avanzano di otto ore a ogni richiesta attiva coperta, inclusi i redirect ottimistici.
  - Il ruolo viene controllato dal cookie senza query al database; i controlli autorevoli restano nel DAL.
  - Un cookie presente ma non valido viene rimosso senza impedire l'accesso alle risorse pubbliche.
  - `SESSION_SECRET` assente, vuoto o al placeholder predefinito causa un errore esplicito anche in sviluppo; locale, CI ed e2e devono fornire un valore valido.
  - La suite e2e continua a rispettare il comportamento consegnato da US-027.

  ---

  ## Soluzione tecnica

  L'implementazione attiverà il confine di autenticazione già abbozzato, adeguandolo alle convenzioni effettive di Next.js 16 e separando nettamente il controllo ottimistico del proxy dalla verifica autorevole del DAL.

  - Spostare `proxy.ts` dalla radice a `src/proxy.ts`, allo stesso livello di `src/app`, mantenendo un matcher che esclude asset statici e ottimizzati. Il proxy non importerà Prisma, il DAL o moduli con `server-only`.
  - Centralizzare nome del cookie, durata, validazione del secret e primitive JOSE in moduli puri riutilizzabili dal proxy e dall'adattatore cookie `src/lib/session.ts`. La validazione deve rifiutare valori assenti, vuoti o composti da spazi, il placeholder noto e valori troppo corti; gli errori di configurazione non devono essere catturati come semplici token invalidi.
  - Aggiungere `src/instrumentation.ts`: `register()` invocherà la stessa validazione e interromperà esplicitamente l'avvio prima che il server accetti richieste. Le funzioni runtime continueranno comunque a validare il secret, così il fail-fast non dipende esclusivamente dall'hook di startup.
  - Validare a runtime anche la forma del payload firmato: identificativo utente, ruolo ammesso, dati testuali richiesti, `expiresAt` ed `exp` coerenti e non scaduti. Una firma valida con claim mancanti o ruolo sconosciuto è un cookie invalido.
  - Definire rami di risposta espliciti. Senza cookie, le rotte pubbliche proseguono e le altre reindirizzano a `/`. `/login` è una tombstone pubblica esatta e deve continuare a rendere 404. Con cookie invalido, le rotte pubbliche proseguono eliminando il cookie, mentre le rotte protette eliminano il cookie e reindirizzano a `/`.
  - Con cookie valido, `/` prosegue verso `src/app/page.tsx`, che conserva il controllo DB-backed e il redirect autorevole evitando loop per collaboratori disattivati; il proxy può allegare il rinnovo ma non decide la destinazione della radice. Sulle rotte protette, il ruolo viene confrontato con `src/lib/policy-rotte.ts`: un mismatch produce un redirect verso `homePerRuolo` senza accesso al database.
  - Una sola verifica JOSE produrrà payload validato e token rinnovato con `iat`, `exp` ed `expiresAt` pari a `now + DURATA_SESSIONE_ORE`. Un helper applicherà il nuovo cookie sia a `NextResponse.next()` sia ai redirect generati dal proxy, preservando `HttpOnly`, `SameSite=Lax`, `Path=/`, `Secure` in produzione e la durata massima.
  - I route handler che creano una sessione (`/api/auth/google/**`, `/api/e2e-test/**`) resteranno pubblici e non riceveranno un rinnovo preventivo concorrente. Il flusso di logout sarà verificato end-to-end per garantire che l'eliminazione downstream prevalga su qualsiasi rinnovo del proxy.
  - Nessuna modifica a schema dati o interfaccia è necessaria. La documentazione locale verrà aggiornata per spiegare il secret obbligatorio, la scadenza sliding e la posizione attiva del proxy, senza leggere o modificare file `.env` reali.

  ---

  ## Strategia di test

  La verifica combina test unitari sulle primitive reali, test diretti delle risposte del proxy e flussi Playwright osservabili dal browser, evitando copie della logica crittografica nei test e attese temporali rigide.

  - Vitest: validazione di secret assente, vuoto, whitespace, placeholder, corto e valido; fail-fast di `register()`; firma/verifica/rinnovo con tempo controllato; rifiuto di token scaduti, manomessi e firmati ma con claim malformati. Ogni test ripristina `process.env`.
  - Vitest sul proxy con `NextRequest`: matcher/pass-through pubblico, tombstone `/login`, redirect non autenticato, rimozione del cookie invalido, redirect per entrambi i mismatch di ruolo e rinnovo su risposta normale e redirect. I test importano il proxy di produzione e non coinvolgono il database.
  - Verifica di integrazione Next.js: avvio/build con secret valido; avvio con secret assente o placeholder che termina con messaggio esplicito; redirect HTTP prima del rendering su rotta protetta.
  - Playwright: usare helper di autenticazione esistenti e risorse seed in sola lettura; nessun `waitForTimeout`, nessuna mutazione di entità seed e nessuna serializzazione della suite. Per il rinnovo, confrontare l'expiry del cookie prima e dopo richieste protette tramite polling web-first, senza assumere che il testo JWT cambi nello stesso secondo.
  - Regressione obbligatoria: correggere soltanto le aspettative residue verso `/login`; mantenere il test che esige 404 su `/login`, i flussi Google/logout e `fullyParallel: true`. Eseguire il gate anti-flakiness e tre suite complete con retry disabilitati.

  ### Test e2e — Simulazione utente

  **Framework:** Playwright 1.60, secondo `tests/e2e/README.md` e `playwright.config.ts`
  **Video demo:** atteso; `archetipo-review` registrerà o motiverà lo skip al gate di accettazione. Lo scenario filmabile mostra redirect immediato da area protetta e correzione automatica dell'area per ruolo; il rinnovo del cookie resta una verifica tecnica automatizzata.

  | Scenario | Flusso utente |
  |---|---|
  | Accesso non autenticato | L'utente apre direttamente un'area protetta, riceve il redirect HTTP alla radice prima di vedere contenuto dell'area e trova la pagina di accesso; `/login` continua invece a restituire 404. |
  | Sessione attiva | L'utente si autentica, usa più volte una rotta protetta e il test osserva l'avanzamento della scadenza del cookie verso otto ore dall'ultima richiesta. |
  | Ruolo errato | Un collaboratore apre una rotta back office e un amministratore apre una rotta front office; entrambi tornano alla home della propria area tramite controllo cookie-only. |
  | Cookie invalido | Il browser presenta un cookie manomesso: la rotta protetta reindirizza alla radice e il cookie scompare; una risorsa pubblica resta raggiungibile mentre elimina il cookie. |
  | Creazione e cancellazione sessione | Login e2e e logout continuano a impostare o eliminare il cookie correttamente, senza conflitti con il rinnovo del proxy. |

  ---

  _Piano generato tramite ARchetipo Planning — 2026-07-15_
tasks:
  - id: TASK-01
    title: Centralizzare configurazione e primitive della sessione
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo (Objective):** creare un'unica implementazione rigorosa per configurazione, firma, verifica e rinnovo dei token di sessione, riusabile dal proxy senza dipendenze da Next headers, database o `server-only`.

      **Da leggere (Read):** `src/lib/session.ts`, `src/lib/rinnova-token.ts`, `src/domain/types.ts`, `tests/unit/session.test.ts`, `tests/unit/rinnova-token.test.ts`, `vitest.config.ts` e la guida Next.js installata `node_modules/next/dist/docs/01-app/02-guides/authentication.md`.

      **Modifiche (Change):**
      - Introdurre un modulo puro in `src/lib/` per nome cookie, durata e validazione di `SESSION_SECRET`; rifiutare assenza, stringa vuota/whitespace, placeholder `changeme-change-me-change-me-change-me` e valori non conformi alla lunghezza minima scelta.
      - Introdurre un modulo puro in `src/lib/` per firma, verifica runtime dei claim e rinnovo JOSE HS256. Restituire insieme payload validato e token rinnovato per evitare doppie verifiche.
      - Adeguare `src/lib/session.ts` affinché resti l'adattatore `cookies()` e deleghi la crittografia ai nuovi moduli, preservando gli export pubblici ancora usati.
      - Eliminare `src/lib/rinnova-token.ts` se non restano caller, oppure trasformarlo in una delega senza controlli duplicati.
      - Creare `src/instrumentation.ts` con `register()` che valida il secret prima che il server accetti richieste.

      **Passi (Steps):**
      1. Definire un errore esplicito e stabile per configurazione non valida; la lettura del secret deve avvenire fuori dai `catch` dedicati a firma/token invalidi.
      2. Validare a runtime tutti i claim richiesti, incluso il ruolo ammesso e la coerenza temporale di `exp`/`expiresAt`.
      3. Usare un tempo corrente iniettabile o controllabile nei test per calcolare esattamente `now + 8h`.
      4. Migrare `createSession`, `getSessionCookie` e gli altri caller senza cambiare il contratto del cookie.
      5. Verificare che i moduli importabili dal proxy non contengano accessi a DB, `next/headers` o `server-only`.

      **Verifica (Verify):** `npm test -- tests/unit/session.test.ts tests/unit/rinnova-token.test.ts` termina con exit code 0 dopo l'adeguamento dei test nel task dedicato; prima di quel task eseguire almeno `npx tsc --noEmit`.

      **Fatto quando (Done):** esiste una sola policy per il secret e una sola implementazione JOSE; startup e runtime propagano gli errori di configurazione; token malformati non producono una sessione.

      **Bloccanti (Blockers):** nessuno. Fermarsi se la migrazione richiede cambiare formato del cookie o durata oltre quanto previsto dalla spec.

      ## File Coinvolti
      - `src/lib/session.ts` — adattatore cookie
      - `src/lib/rinnova-token.ts` — rimozione o delega compatibile
      - `src/lib/<modulo-config-sessione>.ts` — configurazione pura
      - `src/lib/<modulo-token-sessione>.ts` — primitive JOSE pure
      - `src/instrumentation.ts` — validazione all'avvio

      ## Criteri di Completamento
      - [ ] Secret assente, whitespace, placeholder o troppo corto genera un errore esplicito
      - [ ] Il controllo non viene inghiottito dai `catch` dei token invalidi
      - [ ] Claim firmati ma incompleti o con ruolo ignoto vengono rifiutati
      - [ ] `src/lib/session.ts` conserva le opzioni di sicurezza del cookie
      - [ ] Nessuna dipendenza DB/`next/headers` nei moduli usati dal proxy
    ref: TASK-01
  - id: TASK-02
    title: Attivare e rendere deterministico il proxy Next.js
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo (Objective):** attivare il proxy nella posizione riconosciuta dal progetto `src/` e implementare tutti i rami di accesso, ruolo, pulizia e rinnovo senza query al database.

      **Da leggere (Read):** `proxy.ts`, `src/app/page.tsx`, `src/app/not-found.tsx`, `src/lib/dal.ts`, `src/lib/policy-rotte.ts`, `src/app/api/auth/google/route.ts`, `src/app/api/auth/google/callback/route.ts`, `src/app/api/e2e-test/sessione/route.ts`, `node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/proxy.md`.

      **Modifiche (Change):** spostare il file in `src/proxy.ts` ed eliminare la copia alla radice; usare le primitive di TASK-01; mantenere pubblici `/`, `/api/auth/google/**`, `/api/e2e-test/**` e la tombstone esatta `/login`; applicare redirect/pulizia/rinnovo secondo la soluzione tecnica.

      **Passi (Steps):**
      1. Conservare il matcher staticamente analizzabile ed escludere asset Next, favicon e immagini pubbliche.
      2. Classificare la richiesta prima di decidere redirect e rinnovo; le API che creano sessioni non devono ricevere un cookie rinnovato concorrente.
      3. Senza cookie, lasciare passare le rotte pubbliche e reindirizzare le protette a `/`.
      4. Con cookie invalido, cancellarlo: pass-through per pubblico e `/login`, redirect a `/` per protetto.
      5. Con cookie valido su `/`, non scegliere il ruolo nel proxy: lasciare a `src/app/page.tsx` il controllo DB-backed, allegando il rinnovo se sicuro.
      6. Con cookie valido e ruolo errato su rotta protetta, reindirizzare a `homePerRuolo` e allegare il token rinnovato. Per una rotta consentita, restituire `NextResponse.next()` con lo stesso rinnovo.
      7. Mantenere il DAL come seconda linea di difesa e verificare che il proxy non importi Prisma/DB.

      **Verifica (Verify):** con un secret valido, `npm run build` termina con exit code 0; una richiesta HTTP non autenticata a `/anagrafiche` riceve un redirect verso `/`, mentre `/login` continua a restituire 404.

      **Fatto quando (Done):** Next.js carica `src/proxy.ts`, nessun contenuto protetto viene renderizzato prima del redirect e tutte le risposte proxy con sessione valida applicabili rinnovano il cookie.

      **Bloccanti (Blockers):** dipende da TASK-01. Fermarsi se l'attivazione trasforma `/login` in redirect o crea un loop tra `/` e l'area di un collaboratore disattivato.

      ## File Coinvolti
      - `proxy.ts` — eliminazione dopo lo spostamento
      - `src/proxy.ts` — proxy attivo
      - `src/lib/policy-rotte.ts` — sola eventuale correzione della policy, senza accessi DB

      ## Criteri di Completamento
      - [ ] Il proxy risiede accanto a `src/app` ed è rilevato da Next.js 16
      - [ ] `/login` resta una 404 pubblica intenzionale
      - [ ] La radice non usa un redirect cookie-only che possa creare loop
      - [ ] Redirect di ruolo e pass-through protetti rinnovano la sessione
      - [ ] Cookie invalidi vengono eliminati senza bloccare rotte pubbliche
      - [ ] Il proxy non importa né interroga il database
    ref: TASK-02
  - id: TASK-03
    title: Coprire secret, token e proxy con test unitari reali
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo (Objective):** sostituire i test che replicano la crittografia con verifiche sulle primitive di produzione e coprire ogni ramo del proxy in modo rapido e deterministico.

      **Da leggere (Read):** implementazione di TASK-01/TASK-02, `tests/unit/session.test.ts`, `tests/unit/rinnova-token.test.ts`, `tests/unit/policy-rotte.test.ts`, `vitest.config.ts` e i tipi di `next/server`.

      **Modifiche (Change):** adeguare i test sessione/rinnovo e aggiungere test dedicati per configurazione, instrumentation e `src/proxy.ts`; usare `NextRequest` reale e ispezionare status, `Location` e `Set-Cookie`.

      **Passi (Steps):**
      1. Salvare e ripristinare `SESSION_SECRET` dopo ogni test; usare tempo finto o timestamp JWT già scaduti, mai sleep reali.
      2. Coprire secret assente, vuoto, whitespace, placeholder, corto e valido, inclusa la chiamata a `register()`.
      3. Coprire roundtrip e rinnovo con `iat`, `exp` ed `expiresAt` attesi, oltre a token manomessi/scaduti e claim firmati malformati.
      4. Coprire proxy pubblico senza cookie, `/login`, protetto senza cookie, invalido pubblico/protetto, mismatch ruolo in entrambe le direzioni, rinnovo su `next()` e su redirect.
      5. Verificare il matcher o almeno le esclusioni tramite il contratto esportato, senza dipendere da API sperimentali non presenti nella versione installata.

      **Verifica (Verify):** `npm test -- tests/unit/session.test.ts tests/unit/rinnova-token.test.ts tests/unit/proxy.test.ts` termina con exit code 0 e senza timer pendenti.

      **Fatto quando (Done):** i test invocano codice di produzione, non duplicano JOSE, coprono tutti i rami critici e non dipendono dall'orologio reale.

      **Bloccanti (Blockers):** dipende da TASK-01 e TASK-02. Fermarsi se un test richiede Prisma/DB: indica una dipendenza vietata nel proxy.

      ## File Coinvolti
      - `tests/unit/session.test.ts` — test delle primitive di produzione
      - `tests/unit/rinnova-token.test.ts` — rinnovo deterministico o sostituzione coerente col nuovo modulo
      - `tests/unit/proxy.test.ts` — nuovi test del proxy
      - `tests/unit/<config-sessione>.test.ts` — validazione secret/instrumentation, se separata

      ## Criteri di Completamento
      - [ ] Nessun test sessione ricopia una funzione JOSE di produzione
      - [ ] Nessuna attesa temporale reale
      - [ ] Ambiente ripristinato tra i casi
      - [ ] Coperti claim malformati e tutti i rami redirect/pulizia/rinnovo
      - [ ] Suite unit mirata verde
    ref: TASK-03
  - id: TASK-04
    title: Allineare ambiente e documentazione al fail-fast
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Descrizione
      **Obiettivo (Objective):** rendere esplicito come configurare un secret valido in locale, CI ed e2e e aggiornare la documentazione ormai incoerente con proxy e radice di accesso.

      **Da leggere (Read):** `.env.example`, `README.md`, `playwright.config.ts`, `.github/workflows/ci.yml`, `src/lib/dal.ts`, `tests/e2e/README.md`. Non leggere né modificare `.env` o `.env.local`.

      **Modifiche (Change):** documentare generazione e obbligatorietà di `SESSION_SECRET`, posizione/ruolo del proxy e scadenza sliding; correggere riferimenti residui a `/login`; assicurare che Playwright passi sempre al web server un secret e2e valido secondo la policy centralizzata senza esporre secret reali.

      **Passi (Steps):**
      1. Correggere il quick start: la copia di `.env.example` non è pronta finché il placeholder non viene sostituito con un valore generato.
      2. Descrivere il fallimento atteso per secret assente/default e la durata sliding di otto ore di inattività.
      3. Aggiornare l'albero del progetto rimuovendo la vecchia directory login e indicando `src/proxy.ts`.
      4. Mantenere un fallback e2e esplicitamente non produttivo ma conforme alla policy, passato tramite `webServer.env`; non presumere che tale fallback sia disponibile nei processi worker dei test.
      5. Correggere il commento obsoleto in `src/lib/dal.ts` che cita `/login`.

      **Verifica (Verify):** `npm run lint` termina con exit code 0; `rg -n '/login|proxy\.ts|SESSION_SECRET' README.md src/lib/dal.ts .env.example playwright.config.ts` mostra solo riferimenti intenzionali e coerenti.

      **Fatto quando (Done):** un nuovo sviluppatore sa generare il secret prima dell'avvio e documentazione, CI ed e2e concordano con il comportamento reale.

      **Bloccanti (Blockers):** dipende da TASK-01 per riusare la stessa definizione di validità. Non modificare file `.env` reali e non committare credenziali.

      ## File Coinvolti
      - `.env.example` — istruzioni e placeholder esplicito
      - `README.md` — setup, struttura e sessione sliding
      - `playwright.config.ts` — ambiente e2e valido
      - `src/lib/dal.ts` — commenti aggiornati
      - `.github/workflows/ci.yml` — solo se il valore CI corrente non supera la policy

      ## Criteri di Completamento
      - [ ] Setup locale non dichiara valido il placeholder
      - [ ] Secret reale non viene letto né committato
      - [ ] CI ed e2e forniscono valori conformi
      - [ ] README descrive proxy attivo e rinnovo sliding
      - [ ] Nessun riferimento funzionale obsoleto a `/login`
    ref: TASK-04
  - id: TASK-05
    title: Verificare i flussi proxy e sliding con Playwright
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo (Objective):** aggiungere una copertura e2e osservabile per attivazione del proxy, rinnovo sliding, pulizia dei cookie e ruolo, preservando integralmente il contratto deterministico della suite.

      **Da leggere (Read):** `tests/e2e/README.md`, `playwright.config.ts`, `tests/e2e/support/auth.ts`, `tests/e2e/auth-flows.spec.ts`, `tests/e2e/accesso-radice.spec.ts`, `tests/e2e/autorizzazione-ruoli.spec.ts`, `tests/e2e/anagrafica-collaboratori.spec.ts`, `tests/e2e/demo__autorizzazione-ruoli.spec.ts` e l'implementazione del proxy.

      **Modifiche (Change):** creare una suite e2e dedicata a US-029; correggere esclusivamente le aspettative pre-US-027 residue verso `/login`; predisporre uno scenario demo filmabile senza registrare il video durante l'implementazione.

      **Passi (Steps):**
      1. Testare una rotta protetta senza sessione osservando redirect alla radice e assenza del contenuto protetto; mantenere invariato `accesso-radice.spec.ts` che richiede 404 su `/login`.
      2. Autenticare tramite `tests/e2e/support/auth.ts`, acquisire l'expiry del cookie, effettuare richieste protette e usare `expect.poll` sul cookie del browser finché la scadenza risulta avanzata verso otto ore; niente `waitForTimeout` e nessuna assunzione sul cambio del testo JWT nello stesso secondo.
      3. Inserire un cookie manomesso e verificare eliminazione + redirect su protetto; ripetere su pubblico verificando pass-through e pulizia.
      4. Verificare entrambi i redirect di ruolo e che login/logout continuino rispettivamente a creare ed eliminare il cookie.
      5. Aggiornare i casi obsoleti in `autorizzazione-ruoli.spec.ts`, `anagrafica-collaboratori.spec.ts` e `demo__autorizzazione-ruoli.spec.ts` dalla vecchia `/login` alla radice.
      6. Aggiungere o adeguare lo spec `demo__` per mostrare apertura non autenticata di una rotta protetta e correzione dell'area per un ruolo, usando pause solo se ammesse dal contratto demo.

      **Verifica (Verify):** `npm run lint && npx playwright test sessione-proxy auth-flows accesso-radice autorizzazione-ruoli anagrafica-collaboratori demo__autorizzazione-ruoli --retries=0` termina con exit code 0 e `fullyParallel: true`. Adeguare i nomi file effettivi senza usare selezioni ambigue.

      **Fatto quando (Done):** ogni criterio di US-029 è osservato a livello browser/HTTP e le regressioni US-027, inclusi 404 `/login` e logout, restano verdi.

      **Bloccanti (Blockers):** dipende da TASK-02, TASK-03 e TASK-04. Non serializzare la suite, non aumentare retry, non mutare entità seed e non introdurre hard wait.

      ## File Coinvolti
      - `tests/e2e/sessione-proxy.spec.ts` — nuova suite US-029
      - `tests/e2e/demo__sessione-proxy.spec.ts` — scenario filmabile, se separato
      - `tests/e2e/autorizzazione-ruoli.spec.ts` — aspettative radice
      - `tests/e2e/anagrafica-collaboratori.spec.ts` — sessione revocata verso radice
      - `tests/e2e/demo__autorizzazione-ruoli.spec.ts` — riferimenti radice/demo
      - `tests/e2e/auth-flows.spec.ts` — regressione logout, solo se serve rafforzarla

      ## Criteri di Completamento
      - [ ] Redirect non autenticato avviene prima del contenuto protetto
      - [ ] Expiry del cookie avanza senza hard wait
      - [ ] Cookie invalido viene eliminato su pubblico e protetto
      - [ ] Entrambi i ruoli tornano alla propria area senza dipendenze DB nel proxy
      - [ ] `/login` resta 404 e login/logout restano funzionanti
      - [ ] Lint e suite e2e mirata passano con parallelismo invariato
    ref: TASK-05
  - id: TASK-06
    title: Eseguire fail-fast e regressione completa stabile
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Descrizione
      **Obiettivo (Objective):** dimostrare che Next.js scopre davvero instrumentation e proxy, che la configurazione invalida blocca l'avvio e che l'intera applicazione resta stabile.

      **Da leggere (Read):** output dei comandi, `tests/e2e/README.md`, `.github/workflows/ci.yml` e tutti i file modificati dai task precedenti.

      **Modifiche (Change):** nessun file previsto; correggere soltanto regressioni direttamente causate da US-029 nei file pertinenti.

      **Passi (Steps):**
