    body: |-
      ## Descrizione
      **Obiettivo:** fornire lo scenario dimostrativo filmabile che `archetipo-review` userà per registrare la demo al gate di accettazione, ripercorrendo la Dimostrazione della spec.

      **Leggere prima:** i demo spec esistenti (`tests/e2e/demo__*.spec.ts`) per lo stile, `tests/e2e/support/fixtures.ts` e `factory.ts`. Nota: a differenza dei demo spec di sola lettura, questo flusso muta dati, quindi per il contratto e2e deve usare un cliente e offerte creati dalla factory, NON i seed.

      **Modificare:** creare un nuovo file di test; nessuna modifica al codice di produzione.

      **Passi:**
      1. Creare `tests/e2e/demo__gestione-offerte.spec.ts`: login amministratore, apertura di Offerte dalla sidebar, poi in un unico flusso narrativo: creazione di una nuova offerta scegliendo il cliente factory; modifica della stessa offerta; disattivazione e riattivazione; eliminazione di una seconda offerta factory senza attività; tentativo di eliminazione di un'offerta factory con riga attività → messaggio di blocco con invito a disattivare.
      2. Documentare nel commento di testa il flusso e i dati factory usati, seguendo lo stile dei demo spec esistenti.
      3. Il video NON va registrato qui: la registrazione è a cura di `archetipo-review` via `archetipo e2e demo`.

      **Verifica:** `npx playwright test tests/e2e/demo__gestione-offerte.spec.ts` e `npm run lint`.

      **Blocchi:** richiede TASK-05 completato.

      ## File Coinvolti
      - tests/e2e/demo__gestione-offerte.spec.ts — nuovo demo spec

      ## Criteri di Completamento
      - [ ] Il demo spec attraversa l'intera Dimostrazione della spec in un flusso utente continuo
      - [ ] Solo dati factory, nessuna entità seed mutata
      - [ ] Spec verde anche nell'esecuzione parallela dell'intera suite
      - [ ] `npm run lint` passa
