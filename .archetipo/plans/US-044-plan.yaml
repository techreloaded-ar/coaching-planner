  - id: TASK-07
    title: Test e2e del flusso di ingaggio e revoca dalla pagina offerta
    type: Test
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
    body: |-
      ## Objective
      Un test e2e Playwright prova l'intero flusso AC-1→AC-4 con dati di factory, deterministico e conforme al contratto anti-flakiness di US-023.

      ## Read
      - tests/e2e/abilitazioni-collaboratore.spec.ts — pattern di riferimento: marcatore univoco dal namespace, retry idempotente post-idratazione con `expect(...).toPass()`, attese web-first
      - tests/e2e/support/fixtures.ts e tests/e2e/support/factory.ts — fixture `factory`, `createClienteConOfferta`, `createCollaboratore` (opzioni `nome`/`cognome`), `createAbilitazioneOfferta`
      - tests/e2e/support/auth.ts — `accediComeAdmin`
      - tests/e2e/README.md — contratto e2e completo

      ## Change
      - tests/e2e/ingaggi-offerta.spec.ts — nuovo file di test

      ## Steps
      1. Derivare un marcatore univoco dal `factory.namespace` (come in abilitazioni-collaboratore.spec.ts). Creare: `clienteConOfferta` con `codice` marcato; collaboratore A e collaboratore B con `cognome` marcati e distinti (es. `${marcatore}A`, `${marcatore}B`); `createAbilitazioneOfferta` per A sull'offerta.
