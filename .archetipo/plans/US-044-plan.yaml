schema: archetipo/plan/v2
spec_code: US-044
body: |-
  # US-044: Gestione dei collaboratori ingaggiati dalla pagina offerte — Piano di Implementazione

  **Generato da:** Team di Planning ARchetipo
  **Data:** 2026-07-28

  ---

  ## Spec

  **Epic:** EP-005 — Evoluzioni Post-MVP
  **Priorità:** MEDIUM | **Punti:** 2
  **Bloccata da:** US-042 (DONE — nessun rischio di dipendenza)

  **Storia Utente**
  Come amministratore, voglio gestire dalla pagina di un'offerta l'elenco dei collaboratori ingaggiati su di essa, così da comporre la squadra di un'offerta senza passare dal dettaglio di ogni singolo collaboratore.

  **Criteri di Accettazione**
  - AC-1 — Dalla pagina Offerte l'amministratore raggiunge, per ciascuna offerta, l'elenco dei collaboratori ingaggiati con nome e cognome
  - AC-2 — L'amministratore ingaggia un collaboratore attivo sull'offerta e l'abilitazione risulta persistita: il collaboratore compare nell'elenco dopo il ricaricamento
  - AC-3 — L'amministratore revoca un ingaggio e il collaboratore non compare più nell'elenco dopo il ricaricamento; gli altri ingaggi dell'offerta restano invariati
  - AC-4 — Un'abilitazione creata o revocata dalla pagina offerta è la stessa mostrata nel dettaglio del collaboratore: dopo la modifica, il dettaglio del collaboratore riflette lo stato aggiornato

  ---

  ## Soluzione Tecnica

  La spec è la vista speculare di US-042 sulla stessa tabella `AbilitazioneOfferta` (nessuna modifica allo schema, nessuna migrazione): dove US-042 gestisce le offerte di un collaboratore, US-044 gestisce i collaboratori di un'offerta. Si riusa integralmente il pattern esistente — query server-only in `src/lib/abilitazioni.ts`, server action con `useActionState`, sezione con tabella + dialog di ricerca e selezione multipla.

  - **Rotta dedicata** `/offerte/{offertaId}/collaboratori` (nuova pagina server sotto la rotta esistente `/offerte/[offertaId]`), raggiunta da un nuovo link "Collaboratori" nella colonna Azioni di ogni riga di `offerte-tabella.tsx`. Il pannello espanso della tabella offerte resta una proiezione read-only dell'avanzamento: mescolarvi comandi di gestione lo appesantirebbe e complicherebbe i test; una rotta dedicata è simmetrica al dettaglio collaboratore, linkabile e testabile in isolamento.
  - **Query**: `elencaCollaboratoriIngaggiati(offertaId)` (ingaggi correnti, con nome, cognome e stato attivo del profilo; un ingaggio verso un profilo poi disattivato resta elencato, speculare a `offertaAttiva` di US-042) ed `elencaCollaboratoriIngaggiabili(offertaId)` (collaboratori `attivo: true` senza abilitazione sull'offerta), entrambe riservate all'amministratore via `richiediRuoloApi("AMMINISTRATORE")` e ordinate per cognome e nome.
  - **Action**: `ingaggiaCollaboratoriSuOfferta` (bulk, `createMany` + `skipDuplicates` sul vincolo unico `(collaboratoreId, offertaId)`, con verifica preventiva che ogni collaboratore selezionato sia attivo) e `revocaIngaggioCollaboratore` (`deleteMany` sulla singola coppia, idempotente). Entrambe rivalidano la pagina offerta e il dettaglio di ogni collaboratore toccato, così AC-4 è garantito per costruzione: unica tabella, unica fonte di verità.
  - **UI**: componente client `ingaggi-collaboratori.tsx` ricalcato su `abilitazioni-offerte.tsx` (tabella, stato vuoto, dialog con ricerca, input nascosti per le selezioni fuori filtro), fedele ai mockup `docs/mockups/US-044/`.

  ### Decisioni Architetturali

  Nessuna nuova ADR: la soluzione applica la decisione esistente [Abilitazioni esplicite collaboratore-offerta](/decisions/abilitazioni-offerte-esplicite.md) senza alternative strutturali (stessa tabella, stesso modello di autorizzazione, nessun nuovo confine di integrazione). La scelta rotta-dedicata vs pannello-espanso è un dettaglio di UI reversibile sotto la soglia ADR.

  ---

  ## Baseline

  Eseguita il 2026-07-28 su `main` (project root = workdir, nessun worktree attivo).

  | Verifica | Esito prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run lint` | Verde (ESLint + guardrail e2e anti-flakiness) | Ogni task che tocca codice deve lasciarlo verde |
  | `npx tsc --noEmit` | Verde, nessun errore | Nessun task può introdurre diagnostici TypeScript |
  | `npm test` | Verde — 36 file, 567 test | La suite completa deve restare verde nel gate finale |
  | `npx vitest run tests/unit/abilitazioni-dal-actions.test.ts` | Verde — 10 test | Riferimento di stile per i nuovi unit test speculari |

  Prerequisiti d'ambiente: database locale già migrato e seedato (`npm run db:migrate`, `npm run db:seed`) per gli e2e; `prisma generate` è incluso negli script npm (`postinstall`, `dev`, `build`).

  ---

  ## Mappa delle Evidenze di Accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task |
  |---|---|---|---|---|
  | AC-1 | Offerta di factory con un collaboratore già abilitato (`createAbilitazioneOfferta`) | e2e | Da `/offerte`, click sul link "Collaboratori" della riga: la tabella "Collaboratori ingaggiati" mostra la riga con nome e cognome del collaboratore pre-abilitato | TASK-07 |
  | AC-2 | Secondo collaboratore attivo di factory, non ingaggiato | e2e | Dopo dialog di ingaggio, conferma e `page.reload()`, la riga del secondo collaboratore è visibile nella tabella | TASK-07 |
  | AC-3 | Entrambi gli ingaggi presenti | e2e | Dopo revoca del primo e `page.reload()`, la sua riga è assente mentre quella del secondo resta visibile | TASK-07 |
  | AC-4 | Ingaggio e revoca appena eseguiti dalla pagina offerta | e2e | Nel dettaglio del secondo collaboratore la tabella "Offerte abilitate" contiene il codice offerta; nel dettaglio del primo non lo contiene più | TASK-07 |

  A supporto (non sostitutivo): gli unit test di TASK-02 e TASK-04 provano i contratti esatti di query e action sulla stessa tabella `AbilitazioneOfferta` (payload Prisma reali, non proxy: i mock si fermano al client Prisma e lasciano osservabili filtri, ordinamenti e scritture).

  ---

  ## Strategia di Test

  Strategia speculare a US-042: unit test con mock del solo client Prisma per contratti di query e action, e2e Playwright per il flusso utente completo attraverso rotta, autorizzazione e persistenza.

  - Unit (`tests/unit/ingaggi-offerta-dal-actions.test.ts`): filtri e ordinamenti delle due query, esclusione di collaboratori non attivi o già ingaggiati, payload esatti di `createMany`/`deleteMany`, esiti di rifiuto senza scritture, guardia di ruolo, revalidate attese.
  - E2E (`tests/e2e/ingaggi-offerta.spec.ts`): flusso completo AC-1→AC-4 con dati di factory (mai entità di seed), selettori per ruolo/label esatte, attese web-first, retry idempotente post-idratazione con `expect(...).toPass()` come in `abilitazioni-collaboratore.spec.ts`; `fullyParallel` invariato.
  - Il browser e2e è obbligatorio: il percorso di accettazione attraversa rotta server, autorizzazione, persistenza e navigazione tra due pagine (offerta ↔ dettaglio collaboratore).

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (già configurato, `npm run test:e2e`)
  **Demo video:** attesa — la dimostrazione è filmabile (registrata poi da `archetipo-review`, non durante l'implementazione)

  | Scenario | Flusso utente |
  |---|---|
  | Elenco, ingaggio persistito e revoca selettiva (AC-1/AC-2/AC-3) | L'admin apre `/offerte`, filtra per il codice dell'offerta di factory, apre "Collaboratori", vede il collaboratore pre-abilitato; ingaggia il secondo via dialog di ricerca, ricarica e li vede entrambi; revoca il primo, ricarica e vede solo il secondo |
  | Coerenza col dettaglio collaboratore (AC-4) | Dopo ingaggio e revoca, l'admin apre i dettagli dei due collaboratori: le "Offerte abilitate" del secondo contengono l'offerta, quelle del primo non più |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [domains/offerte, domains/collaboratori, decisions/abilitazioni-offerte-esplicite]
    update_after_acceptance: [domains/offerte, domains/collaboratori]
    create: []
  ```

  `domains/collaboratori` resta owner di `AbilitazioneOfferta` e delle nuove query/action; `domains/offerte` acquisisce il punto di ingresso UI dalla pagina Offerte. Nessuna nuova pagina di dominio o decisione.

  ---

  > 🎨 I mockup di questa spec sono disponibili in `docs/mockups/US-044/`

  _Piano generato via ARchetipo Planning — 2026-07-28_
tasks:
  - id: TASK-01
    title: Query di elenco dei collaboratori ingaggiati e ingaggiabili per offerta
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Le query server-only espongono, per un'offerta, l'elenco dei collaboratori ingaggiati (con nome, cognome e stato del profilo) e quello dei collaboratori attivi ancora ingaggiabili.

      ## Read
      - src/lib/abilitazioni.ts — pattern di `elencaOfferteAbilitate`/`elencaOfferteAbilitabili`: guardia `richiediRuoloApi("AMMINISTRATORE")`, mapping su interfacce dedicate, ordinamento, JSDoc in italiano
      - prisma/schema.prisma — modello `AbilitazioneOfferta` (righe 165-175, coppia unica `collaboratoreId`/`offertaId`), relazione `abilitazioniOfferte` su `Collaboratore` (riga 89)

      ## Change
      - src/lib/abilitazioni.ts — aggiungere le interfacce `CollaboratoreIngaggiato` (`collaboratoreId`, `nome`, `cognome`, `collaboratoreAttivo`) e `CollaboratoreIngaggiabile` (`collaboratoreId`, `nome`, `cognome`) e le funzioni `elencaCollaboratoriIngaggiati(offertaId: string)` ed `elencaCollaboratoriIngaggiabili(offertaId: string)`. Non modificare le funzioni esistenti né altri file.

      ## Steps
      1. `elencaCollaboratoriIngaggiati`: guardia `richiediRuoloApi("AMMINISTRATORE")`; `db.abilitazioneOfferta.findMany({ where: { offertaId }, include: { collaboratore: true }, orderBy: [{ collaboratore: { cognome: "asc" } }, { collaboratore: { nome: "asc" } }] })`; mappare su `CollaboratoreIngaggiato` con `collaboratoreAttivo` dal booleano `attivo` del profilo (un ingaggio verso un profilo poi disattivato resta elencato, speculare a `offertaAttiva` di `elencaOfferteAbilitate`).
      2. `elencaCollaboratoriIngaggiabili`: guardia identica; `db.collaboratore.findMany({ where: { attivo: true, abilitazioniOfferte: { none: { offertaId } } }, orderBy: [{ cognome: "asc" }, { nome: "asc" }] })`; mappare su `CollaboratoreIngaggiabile`.
      3. Documentare entrambe con JSDoc in italiano nello stile delle funzioni esistenti (accesso riservato all'amministratore, semantica dell'ordinamento e del profilo disattivato).

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessun errore (baseline verde, nessun nuovo diagnostico)

      ## Done
      - [ ] AC-1 — le query forniscono nome e cognome dei collaboratori ingaggiati, ordinati per cognome e poi nome
      - [ ] AC-2 — `elencaCollaboratoriIngaggiabili` restituisce solo collaboratori `attivo: true` privi di abilitazione sull'offerta

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Unit test delle query di ingaggio per offerta
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Unit test che provano filtri, ordinamenti e mapping esatti delle due nuove query, con il client Prisma mockato e gli oracoli osservabili sui payload reali.

      ## Read
      - tests/unit/abilitazioni-dal-actions.test.ts — stile di mock del client Prisma (`db`) e della guardia `richiediRuoloApi`, struttura dei describe
      - src/lib/abilitazioni.ts — le funzioni aggiunte in TASK-01

      ## Change
      - tests/unit/ingaggi-offerta-dal-actions.test.ts — nuovo file con la sezione dedicata alle query (le action arriveranno in questo stesso file con TASK-04)

      ## Steps
      1. Replicare il setup di mock del file di riferimento (mock di `@/lib/db` e `@/lib/dal`).
      2. `elencaCollaboratoriIngaggiati`: asserire il payload esatto di `findMany` (where per `offertaId`, orderBy cognome poi nome sulla relazione) e il mapping, incluso `collaboratoreAttivo: false` per un profilo disattivato che resta elencato.
      3. `elencaCollaboratoriIngaggiabili`: asserire where `{ attivo: true, abilitazioniOfferte: { none: { offertaId } } }`, orderBy e mapping.
      4. Asserire che entrambe invocano `richiediRuoloApi("AMMINISTRATORE")` prima della lettura.

      ## Verify
      - Run: `npx vitest run tests/unit/ingaggi-offerta-dal-actions.test.ts`
      - Expect: tutti i nuovi test passano
      - Run: `npm test`
      - Expect: verde — i 567 test preesistenti restano invariati

      ## Done
      - [ ] AC-1 — oracolo: l'elenco restituito espone nome e cognome nell'ordinamento richiesto
      - [ ] AC-2 — oracolo: collaboratori non attivi o già ingaggiati sono esclusi dagli ingaggiabili

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Server action di ingaggio multiplo e revoca dal lato offerta
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Due server action persistono su `AbilitazioneOfferta` l'ingaggio in blocco di collaboratori attivi su un'offerta e la revoca di un singolo ingaggio, rivalidando anche il dettaglio collaboratore.

      ## Read
      - src/app/(back-office)/anagrafiche/collaboratori/[id]/abilitazioni-actions.ts — struttura speculare da ricalcare (guardia, letture FormData, verifica disponibilità, `createMany`+`skipDuplicates`, `deleteMany`, revalidate)
      - src/app/(back-office)/anagrafiche/collaboratori/actions.ts — forma dell'interfaccia `StatoAction` (riga 17)

      ## Change
      - src/app/(back-office)/offerte/[offertaId]/collaboratori/ingaggi-actions.ts — nuovo file `"use server"` con `ingaggiaCollaboratoriSuOfferta` e `revocaIngaggioCollaboratore`, entrambe compatibili con `useActionState`. Non modificare le action esistenti di altre aree.

      ## Steps
      1. Definire ed esportare `interface StatoIngaggiAction` con la stessa forma di `StatoAction` (`errori: Record<string, string>` più `successo?: boolean`), locale a questo file per evitare import incrociati tra aree del back office.
      2. `ingaggiaCollaboratoriSuOfferta(_prevState, formData)`: guardia `richiediRuoloApi("AMMINISTRATORE")`; leggere `offertaId` (errore `_form` se mancante) e i `collaboratoreId` multipli con `formData.getAll` filtrando le stringhe non vuote (errore "Seleziona almeno un collaboratore da ingaggiare" se vuoto); verificare con `db.collaboratore.findMany({ where: { id: { in: ids }, attivo: true }, select: { id: true } })` che il conteggio coincida con i selezionati (errore "Alcuni collaboratori selezionati non sono disponibili" altrimenti); `db.abilitazioneOfferta.createMany({ data: ids.map(...), skipDuplicates: true })`.
      3. `revocaIngaggioCollaboratore(_prevState, formData)`: guardia identica; `offertaId` e `collaboratoreId` obbligatori con errori `_form` distinti; `db.abilitazioneOfferta.deleteMany({ where: { collaboratoreId, offertaId } })` (idempotente sulla coppia bersaglio).
      4. In entrambe, dopo la scrittura: `revalidatePath(`/offerte/${offertaId}/collaboratori`)` e, per ogni collaboratore toccato, `revalidatePath(`/anagrafiche/collaboratori/${collaboratoreId}`)`, così il dettaglio collaboratore riflette subito lo stato aggiornato (AC-4). Restituire `{ errori: {}, successo: true }`.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessun errore

      ## Done
      - [ ] AC-2 — l'ingaggio crea le sole coppie mancanti (`skipDuplicates`) e rifiuta senza scritture collaboratori non attivi o inesistenti
      - [ ] AC-3 — la revoca elimina esclusivamente la coppia bersaglio
      - [ ] AC-4 — entrambe le action scrivono sulla stessa tabella `AbilitazioneOfferta` del dettaglio collaboratore e ne rivalidano la pagina

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Unit test delle action di ingaggio e revoca
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Objective
      Unit test che provano scritture, esiti di rifiuto e revalidate delle due action con payload Prisma esatti come oracolo.

      ## Read
      - tests/unit/abilitazioni-dal-actions.test.ts — sezione action: mock di `next/cache` (`revalidatePath`), costruzione di `FormData`, asserzioni sui payload
      - src/app/(back-office)/offerte/[offertaId]/collaboratori/ingaggi-actions.ts — le action di TASK-03

      ## Change
      - tests/unit/ingaggi-offerta-dal-actions.test.ts — estendere il file creato in TASK-02 con la sezione action

      ## Steps
      1. `ingaggiaCollaboratoriSuOfferta`: caso felice con payload esatto di `createMany` (coppie `collaboratoreId`/`offertaId`, `skipDuplicates: true`) e revalidate della pagina offerta e di ogni dettaglio collaboratore toccato; rifiuto senza scritture per `offertaId` mancante, nessun collaboratore selezionato, collaboratore non attivo o inesistente (conteggio `findMany` diverso dai selezionati).
      2. `revocaIngaggioCollaboratore`: caso felice con `deleteMany` sulla sola coppia bersaglio e revalidate di entrambe le pagine; rifiuto senza scritture per id mancanti.
      3. Asserire la guardia `richiediRuoloApi("AMMINISTRATORE")` su entrambe.

      ## Verify
      - Run: `npx vitest run tests/unit/ingaggi-offerta-dal-actions.test.ts`
      - Expect: tutti i test del file passano
      - Run: `npm test`
      - Expect: verde, nessuna regressione

      ## Done
      - [ ] AC-2 — oracolo: payload esatto di `createMany` e assenza di scritture negli esiti di rifiuto
      - [ ] AC-3 — oracolo: `deleteMany` riceve esattamente la coppia bersaglio
      - [ ] AC-4 — oracolo: `revalidatePath` invocata sia sulla pagina offerta sia sul dettaglio di ogni collaboratore toccato

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Pagina di gestione dei collaboratori ingaggiati dell'offerta
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      La pagina `/offerte/{offertaId}/collaboratori` mostra i collaboratori ingaggiati dell'offerta e consente ingaggio multiplo via dialog e revoca per riga, fedele ai mockup.

      ## Read
      - docs/mockups/US-044/ — index.html, dialog-aperto.html, stato-vuoto.html: layout, copy e stati da riprodurre
      - src/app/(back-office)/anagrafiche/collaboratori/[id]/abilitazioni-offerte.tsx — componente speculare da ricalcare (sezione, tabella, stato vuoto, dialog con ricerca, input nascosti per le selezioni fuori filtro, `useActionState`)
      - src/app/(back-office)/offerte/[offertaId]/page.tsx — pattern `params` Promise, `richiediRuolo("AMMINISTRATORE")`, `offertaPerId` + `notFound()`
      - src/lib/offerte.ts — firma di `offertaPerId` (include il cliente)

      ## Change
      - src/app/(back-office)/offerte/[offertaId]/collaboratori/page.tsx — nuovo server component
      - src/app/(back-office)/offerte/[offertaId]/collaboratori/ingaggi-collaboratori.tsx — nuovo client component

      ## Steps
      1. `page.tsx`: `richiediRuolo("AMMINISTRATORE")`; risolvere `offertaId` dai `params`; `offertaPerId` con `notFound()` se assente; caricare `elencaCollaboratoriIngaggiati` ed `elencaCollaboratoriIngaggiabili`; render dell'intestazione con codice offerta, descrizione e ragione sociale del cliente, link di ritorno a `/offerte` e componente client con i dati.
      2. `ingaggi-collaboratori.tsx`: ricalcare `abilitazioni-offerte.tsx` adattando i contenuti — sezione con contatore ingaggiati, tabella con `aria-label` "Collaboratori ingaggiati" (colonne: Collaboratore con nome e cognome, Stato con pill Attivo/Disattivato da `collaboratoreAttivo`, Azioni con pulsante Revoca per riga), stato vuoto con invito all'azione, pulsante "Ingaggia collaboratori" che apre il dialog con campo di ricerca per nome/cognome, checkbox multipli, input nascosti per le selezioni non più visibili col filtro corrente, submit "Ingaggia selezionati" disabilitato a zero selezioni, `useActionState` sulle action di TASK-03 con chiusura del dialog al successo.
      3. Seguire i mockup `docs/mockups/US-044/` per layout, copy e varianti chiaro/scuro, restando coerenti con la palette e i raggi del back office.

      ## Verify
      - Run: `npx tsc --noEmit && npm run lint`
      - Expect: nessun errore; guardrail e2e incluso nel lint verde

      ## Done
      - [ ] AC-1 — la pagina espone la tabella "Collaboratori ingaggiati" con nome e cognome
      - [ ] AC-2 — il dialog di ricerca e selezione multipla invoca `ingaggiaCollaboratoriSuOfferta`
      - [ ] AC-3 — il pulsante Revoca di ogni riga invoca `revocaIngaggioCollaboratore`

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Link Collaboratori nella colonna Azioni della tabella offerte
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Ogni riga della pagina Offerte raggiunge la gestione dei collaboratori ingaggiati della propria offerta con un link dedicato.

      ## Read
      - src/app/(back-office)/offerte/offerte-tabella.tsx — colonna Azioni di `RigaOfferta` (righe ~344-371: Link Modifica e pulsante Elimina, `stopPropagation` sulla cella)

      ## Change
      - src/app/(back-office)/offerte/offerte-tabella.tsx — solo la colonna Azioni: aggiungere un `Link` "Collaboratori" verso `/offerte/${offerta.offertaId}/collaboratori` prima di Modifica, con lo stesso stile dei pulsanti esistenti e un'icona coerente (es. gruppo di persone). Adeguare se necessario la larghezza della colonna Azioni (`w-[220px]` nell'header) perché i tre controlli non vadano a capo. Nessun'altra modifica alla tabella.

