    body: |-
      ## Descrizione

      **Obiettivo:** impedire che nuovi test reintroducano pattern di contesa, selezione fragile o uso scorretto di risorse globali.

      **Leggere:** `eslint.config.mjs`, `package.json`, `tests/e2e/support/reserved-resources.ts`, pattern rimasti in `tests/e2e/`.

      **Cambiare:** aggiungere uno script di guardrail, ad esempio `scripts/check-e2e-guardrails.ts`, e integrarlo negli script npm o in CI.

      **Passi:**
      1. Fallire su `selectOption({ index`, email seed hardcoded in file non allowlist, date helper legacy fuori dagli helper, nav con match parziali, classi Tailwind come selettori e `waitForTimeout` non allowlist.
      2. Fallire su creazione/modifica di scaglioni km fuori dagli intervalli registrati o su uso di `Date.now() % 900` nei test scaglioni.
      3. Definire allowlist esplicita per test read-only sul seed e pause finali dei video demo.
      4. Integrare il comando in `package.json`, preferibilmente dentro `npm run lint` o nella CI esistente.

      **Verifica:** introdurre temporaneamente un pattern vietato o coprire lo script con fixture interna, confermare fallimento, poi ripristinare e confermare `npm run lint` verde.

      **Fatto:** la CI intercetta automaticamente i pattern ad alto rischio.

      **Bloccanti:** non bloccare test read-only legittimi; usare allowlist tracciabile invece di regole troppo ampie.

