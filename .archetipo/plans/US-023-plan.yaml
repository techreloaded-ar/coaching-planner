  - id: TASK-13
    title: Validare suite completa tre volte senza retry
    type: Test
    status: TODO
    dependencies:
      - TASK-11
      - TASK-12
    body: |-
      ## Descrizione

      **Obiettivo:** chiudere la spec con una prova ripetibile che dimostri assenza di flakiness nota mantenendo parallelismo attivo.

      **Leggere:** `playwright.config.ts`, output dei task precedenti, eventuali report Playwright falliti.

      **Cambiare:** `playwright.config.ts` solo se si decide di portare il default `retries` a 0; non cambiare `fullyParallel: true` e non limitare i worker a uno.

      **Passi:**
      1. Verificare che `fullyParallel: true` sia rimasto attivo.
      2. Eseguire `npm run lint` e correggere eventuali guardrail falliti.
      3. Eseguire tre volte consecutive `npx playwright test --retries=0`, senza `--workers=1` e senza serializzare l’intera suite.
      4. Se una run fallisce, correggere isolamento dati, risorsa globale o selettore; non aumentare retry e non serializzare come fix.
      5. Riportare nel risultato finale il riepilogo delle tre run.

      **Verifica:** `npx playwright test --retries=0` deve passare tre volte consecutive con exit code 0.

      **Fatto:** i criteri di accettazione sono dimostrati dal gate finale.

      **Bloccanti:** bloccare se la soluzione richiede `workers: 1`, `fullyParallel: false`, serializzazione globale o aumento retry.

      ## File Coinvolti
      - `playwright.config.ts`
      - `package.json`
      - `docs/test-results/` — eventuale output riepilogativo se usato

      ## Criteri di Completamento
      - [ ] `npm run lint` passa.
      - [ ] `fullyParallel: true` è mantenuto.
      - [ ] Tre run consecutive di `npx playwright test --retries=0` passano con exit code 0.
      - [ ] Non sono introdotti retry maggiori, `workers: 1` o serializzazione globale.
