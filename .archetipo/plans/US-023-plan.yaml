      - TASK-02
    body: |-
      ## Descrizione

      **Obiettivo:** impedire che i test di anagrafica spostino indici, disattivino DataFlow o creino offerte su clienti condivisi. Gli scaglioni km sono gestiti separatamente da `TASK-04`.

      **Leggere:** `tests/e2e/anagrafica-clienti.spec.ts`, `tests/e2e/demo__anagrafica-clienti.spec.ts`, `tests/e2e/anagrafica-offerte.spec.ts`, `tests/e2e/demo__anagrafica-offerte.spec.ts`, `tests/e2e/anagrafica-collaboratori.spec.ts`, `tests/e2e/demo__anagrafica-collaboratori.spec.ts`.

      **Cambiare:** gli spec di anagrafica mutanti e factory admin/back-office.

      **Passi:**
      1. Nei test clienti, creare un cliente proprio prima di modificarlo/disattivarlo/riattivarlo.
      2. Nei test offerte, creare o usare un cliente proprio e creare offerte su quel cliente.
      3. Nei test collaboratori, mantenere il controllo duplicato su Giulia solo se è read-only/validazione duplicato; per mutazioni usare collaboratori generati.
      4. Nei demo con nomi che precedono alfabeticamente i seed, usare nomi non interferenti o disattivazione immediata dopo verifica.

      **Verifica:** eseguire `npx playwright test tests/e2e/anagrafica-clienti.spec.ts tests/e2e/demo__anagrafica-clienti.spec.ts tests/e2e/anagrafica-offerte.spec.ts tests/e2e/demo__anagrafica-offerte.spec.ts --retries=0`.

      **Fatto:** le anagrafiche non mutano più entità seed condivise salvo validazioni intenzionali.

      **Bloccanti:** non ridurre la copertura CRUD per evitare la migrazione.

      ## File Coinvolti
