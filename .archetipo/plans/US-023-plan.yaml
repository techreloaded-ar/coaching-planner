      ## Descrizione

      **Obiettivo:** ridurre falsi negativi dovuti a selettori non semantici e a sincronizzazioni temporali arbitrarie.

      **Leggere:** output di `rg` su `hasText`, classi Tailwind come selettori, XPath su fratelli, navigazione sidebar e `waitForTimeout` in `tests/e2e/`.

      **Cambiare:** spec e2e interessati; componenti UI solo per `data-testid` o label accessibili minimi.

      **Passi:**
      1. Sostituire link di navigazione con `getByRole('link', { name, exact: true })` quando possibile.
      2. Sostituire selettori CSS di classi Tailwind con ruoli, label, heading, test id o testo accessibile stabile.
      3. Ridurre XPath su fratelli usando contenitori scoped individuati da heading, card o righe con testo univoco.
      4. Sostituire `waitForTimeout(300/500/1000)` usati come sincronizzazione con `expect`, `waitForURL`, locator web-first o polling su stato osservabile.
      5. Lasciare allowlist solo per pause finali di video demo esplicitamente commentate come ritmo di registrazione, non sincronizzazione.

      **Verifica:** eseguire `npm run lint` e gli spec toccati con `--retries=0`.

      **Fatto:** i test critici non dipendono più da classi, match parziali ambigui o attese temporali arbitrarie.

      **Bloccanti:** non introdurre test id generici o duplicati; preferire ruoli accessibili.

