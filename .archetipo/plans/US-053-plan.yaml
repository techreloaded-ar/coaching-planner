    body: |-
      ## Objective
      Una nuova suite Playwright prova, su browser reale con dati factory isolati, che il selettore data cambia giorno (anche di mese diverso) aggiornando URL e contenuto (AC-1), che i pulsanti prec/succ spostano di un giorno alla volta attraversando i confini di mese (AC-2), che una riga aggiunta dopo il cambio giorno si registra sul giorno visualizzato e risulta visibile anche nel calendario mensile (AC-3), e che l'URL del giorno sopravvive a un reload (AC-4).

      ## Read
      - tests/e2e/support/fixtures.ts — fixture `test`/`expect`/`factory`/`collaboratore`/`clienteConOfferta` da importare al posto di `@playwright/test`.
      - tests/e2e/support/date.ts — `meseRiservato`, `dataNelMeseRiservato`.
      - tests/e2e/support/auth.ts — `accediComeCollaboratore(page, email)`.
      - tests/e2e/calendario-navigazione-reattiva.spec.ts (righe 1-60) — pattern `dataDb(dataIso)` (`new Date(\`${dataIso}T00:00:00.000Z\`)`) per creare righe con `factory.createRigaAttivita({ ..., data: dataDb(...) })`.
      - tests/e2e/demo__inserimento-righe-attivita-flusso.spec.ts (righe 1-140) — pattern di selezione cliente/offerta (`page.locator("#cliente").selectOption(...)`, attesa che `#offerta` sia popolato) e pattern di localizzazione riga per nota univoca (`page.getByTestId("activity-row").filter({ has: page.getByText(nota, { exact: true }) })`).
      - src/app/(front-office)/attivita/calendario-mensile.tsx (righe 579-594) — markup della cella calendario: `<Link href="/attivita/{key}?mese={tokenCella}" data-testid="cella-giorno" data-con-attivita="true|false">` e, dentro, `data-testid="etichetta-cliente"` con `{ragioneSociale} {ore} h`.
      - src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx — dopo TASK-04: `data-testid="controllo-cambio-giorno"`, `data-testid="selettore-giorno"`, `aria-label="Giorno precedente"`/`"Giorno successivo"`.

      ## Change
      - tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts — nuovo file. Nessun altro file va toccato (i fixture/support esistenti bastano; non introdurre nuovi helper condivisi salvo una funzione locale `dataDb` identica al pattern citato).

      ## Steps
      1. Crea `tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts` importando `test, expect` da `./support/fixtures`, `accediComeCollaboratore` da `./support/auth`, `dataNelMeseRiservato, meseRiservato` da `./support/date`.
      2. Definisci una funzione locale `dataDb(dataIso: string): Date { return new Date(\`${dataIso}T00:00:00.000Z\`); }`.
      3. Definisci una funzione locale `etichettaGiornoAttesa(dataIso: string): string` che usa `new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", year: "numeric" })` su una `Date` costruita con componenti locali (`new Date(anno, mese-1, giorno)` a partire dallo split di `dataIso`) — calcolo indipendente dall'implementazione, da confrontare (case-insensitive o con normalizzazione minima) col testo dell'`h1` della pagina.
      4. **Test A** — `test("il selettore data cambia giorno anche su un mese diverso e la nuova riga si registra sul giorno visualizzato, visibile anche nel calendario", async ({ page, factory, collaboratore, clienteConOfferta }) => { ... })`:
         - `await factory.createAbilitazioneOfferta({ collaboratore, offerta: clienteConOfferta.offerta });`
         - `const dataPartenza = dataNelMeseRiservato("US-053", 5);`
         - crea una riga esistente sul giorno di partenza con `factory.createRigaAttivita({ collaboratore, cliente: clienteConOfferta.cliente, offerta: clienteConOfferta.offerta, data: dataDb(dataPartenza), nota: "Riga di partenza US-053" })` (soddisfa "almeno una riga attività" della Dimostrazione);
         - `const dataArrivo = dataNelMeseRiservato("US-053-arrivo", 12);` (usa un codice spec diverso per garantire un mese riservato distinto da quello di partenza, così il cambio attraversa sempre un mese diverso indipendentemente dal mese corrente reale);
         - `await accediComeCollaboratore(page, collaboratore.utente.email); await page.goto(\`/attivita/${dataPartenza}\`); await page.waitForURL(\`**/attivita/${dataPartenza}\`);`
         - AC-1: `await page.getByTestId("selettore-giorno").fill(dataArrivo);` (per `<input type="date">` Playwright accetta `fill` con stringa `YYYY-MM-DD`) poi `await page.waitForURL(\`**/attivita/${dataArrivo}**\`);` e `await expect(page.getByRole("heading", { level: 1 })).toHaveText(etichettaGiornoAttesa(dataArrivo), { ignoreCase: true });` e `await expect(page.getByText("Nessuna attività registrata per questa giornata.")).toBeVisible();` (il nuovo giorno è vuoto, prova che non mostra la riga del giorno di partenza).
         - AC-3 (prima parte): compila il form (`page.locator("#cliente").selectOption(clienteConOfferta.cliente.id)`, attendi che `#offerta` sia abilitato e abbia più di un'opzione, `selectOption(clienteConOfferta.offerta.id)`, `page.locator("#ore").fill("4")`, nota univoca via `randomUUID()`), invia con `page.getByRole("button", { name: "Aggiungi riga" }).click()`; verifica che la riga (localizzata per nota) sia visibile nella lista.
         - AC-3 (seconda parte, calendario): `const tokenArrivo = dataArrivo.slice(0, 7); await page.goto(\`/attivita?mese=${tokenArrivo}\`);` poi `const cella = page.locator(\`a[href="/attivita/${dataArrivo}?mese=${tokenArrivo}"]\`); await expect(cella).toHaveAttribute("data-con-attivita", "true"); await expect(cella.getByTestId("etichetta-cliente")).toContainText(clienteConOfferta.cliente.ragioneSociale);`
         - AC-4: `await page.goto(\`/attivita/${dataArrivo}\`); await page.waitForURL(\`**/attivita/${dataArrivo}\`); await page.reload(); await expect(page).toHaveURL(new RegExp(\`/attivita/${dataArrivo}$\`)); await expect(page.getByRole("heading", { level: 1 })).toHaveText(etichettaGiornoAttesa(dataArrivo), { ignoreCase: true });` e verifica che la riga creata sia ancora visibile dopo il reload.
      5. **Test B** — `test("i pulsanti giorno precedente e successivo spostano di un giorno alla volta attraversando i confini di mese", async ({ page, collaboratore }) => { ... })`:
         - `const tokenRiservato = meseRiservato("US-053-confine"); const primoGiorno = \`${tokenRiservato}-01\`;`
         - calcola `ultimoGiornoMesePrecedente` con una funzione locale che usa `new Date(anno, mese - 1, 0)` (giorno 0 = ultimo del mese precedente) a partire dallo split di `tokenRiservato`, formattato `YYYY-MM-DD`;
         - `await accediComeCollaboratore(page, collaboratore.utente.email); await page.goto(\`/attivita/${primoGiorno}\`); await page.waitForURL(\`**/attivita/${primoGiorno}\`);`
         - click su `page.getByRole("button", { name: "Giorno precedente" })`; `await page.waitForURL(\`**/attivita/${ultimoGiornoMesePrecedente}\`);` e verifica l'intestazione con `etichettaGiornoAttesa`.
         - click su `page.getByRole("button", { name: "Giorno successivo" })`; `await page.waitForURL(\`**/attivita/${primoGiorno}\`);` (torna esattamente al giorno di partenza, provando lo spostamento di un solo giorno e non un mese).
      6. Nessun `waitForTimeout` per sincronizzazione funzionale; usa solo `waitForURL`/`expect` web-first, come richiesto dalle regole e2e del progetto.

      ## Verify
      - Run: `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts --retries=0` — Expect: entrambi i test passano in modo deterministico (nessun retry necessario).
      - Run: `npm run lint` — Expect: passa, incluso il guardrail e2e anti-flakiness (`lint:e2e-guardrails`), perché il nuovo file non introduce `workers: 1`, selettori Tailwind come contratto primario, o `waitForTimeout` funzionali.

      ## Done
      - [ ] AC-1 — Test A prova che il selettore data porta a un giorno di un mese diverso, con URL e intestazione aggiornati e lista righe del nuovo giorno (non del giorno di partenza).
      - [ ] AC-2 — Test B prova che «Giorno precedente»/«Giorno successivo» spostano di un giorno alla volta, attraversando un confine di mese in entrambe le direzioni.
      - [ ] AC-3 — Test A prova che la riga aggiunta dopo il cambio giorno appare sul giorno visualizzato e nella cella calendario corrispondente (non su quella di partenza).
      - [ ] AC-4 — Test A prova che un reload dopo il cambio giorno riapre lo stesso giorno (URL e contenuto invariati).
      - [ ] `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts --retries=0` passa.

      ## Blockers
      TASK-03 e TASK-04 devono essere completati (i `data-testid`/`aria-label` usati dai test devono esistere nell'app).
