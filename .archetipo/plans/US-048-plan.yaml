  - id: TASK-09
    title: Seed, bootstrap amministratore e factory e2e con cognome distinto
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |
      ## Objective
      Seed, bootstrap di deploy e factory e2e creano `Utente` con `cognome` valorizzato; il type-check torna pulito su tutto il progetto.

      ## Read
      - prisma/seed.ts — creazione dei quattro utenti
      - scripts/bootstrap-amministratore-iniziale.ts — `NOME_PREDEFINITO_AMMINISTRATORE` e payload di creazione
      - tests/unit/bootstrap-amministratore-iniziale.test.ts — asserzioni sul payload
      - tests/e2e/support/factory.ts — `createUtente` (INSERT SQL) e `createCollaboratore` (default `utenteOptions`)
      - Chiamanti di `createUtente`/`createCollaboratore` negli spec e2e che passano `nome` esplicito — verifica che il nominativo composto a display resti quello atteso

      ## Change
      - prisma/seed.ts, scripts/bootstrap-amministratore-iniziale.ts, tests/unit/bootstrap-amministratore-iniziale.test.ts, tests/e2e/support/factory.ts.

      ## Steps
      1. Seed: crea gli utenti con nome/cognome distinti — Tech/Reloaded, Stefano/Marello, Giulia/Conti, Marco/Bianchi (i profili `Collaboratore` restano invariati e già allineati).
      2. Bootstrap: sostituisci `NOME_PREDEFINITO_AMMINISTRATORE = "Amministratore Iniziale"` con `NOME_PREDEFINITO_AMMINISTRATORE = "Amministratore"` e nuova costante esportata `COGNOME_PREDEFINITO_AMMINISTRATORE = "Iniziale"`; il payload di `utente.create` include entrambe. Aggiorna il commento di testata. Aggiorna il test unitario sul payload esatto (creazione, idempotenza invariata).
      3. Factory: aggiungi `cognome?: string` a `CreateUtenteOptions`; l'INSERT su `Utente` include la colonna `cognome`. Default coerenti col display attuale: `nome = options.nome ?? "E2E"`, `cognome = options.cognome ?? readableName(token)` così il nominativo composto resta `E2E <token>`. In `createCollaboratore` allinea i default di `utenteOptions` a `nome`/`cognome` del profilo (stessi valori passati all'INSERT di `Collaboratore`).
      4. Controlla i chiamanti negli spec che passano `utenteOptions.nome` con stringa piena e adeguali a nome+cognome, mantenendo invariato il nominativo composto che gli spec cercano a schermo.
      5. Riesegui il seed per lasciare l'ambiente coerente: `npm run db:seed`.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0 su tutto il progetto (boundary temporaneo di TASK-01 chiuso).
      - Run: `npx vitest run tests/unit/bootstrap-amministratore-iniziale.test.ts`
      - Expect: verde.
      - Run: `npm run db:seed`
      - Expect: seed completato; log dei collaboratori invariati.

      ## Done
      - [ ] AC-4 — Seed e bootstrap producono utenti con cognome distinto; la factory e2e inserisce `cognome` e i nominativi composti restano stabili per gli spec.

      ## Blockers
      PostgreSQL locale attivo per il passo di seed.
    ref: TASK-09
  - id: TASK-10
    title: 'E2E gestione utenti: scenari US-048 e allineamento flussi esistenti'
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-06
      - TASK-07
      - TASK-09
    body: |
      ## Objective
      `tests/e2e/gestione-utenti.spec.ts` prova a browser i quattro criteri di accettazione e i flussi esistenti restano verdi con il nuovo form.

      ## Read
      - tests/e2e/gestione-utenti.spec.ts — flussi esistenti che compilano il form utenti
      - tests/e2e/support/fixtures.ts e tests/e2e/support/factory.ts — contratto factory dopo TASK-09
      - tests/e2e/README.md — contratto anti-flakiness (ruoli/label, expect web-first, niente hard wait)

      ## Change
      - tests/e2e/gestione-utenti.spec.ts — aggiorna i flussi esistenti (il cognome si compila nella sezione Anagrafica per ogni ruolo; la sezione profilo non ha più il campo Cognome) e aggiungi gli scenari US-048. Nessuna mutazione di entità seed: utenti dedicati da factory; sull'utente seed Giulia Conti solo asserzioni di lettura.

      ## Steps
      1. Allinea i flussi esistenti di censimento/modifica al nuovo form (campo `Cognome` sempre presente in Anagrafica; profilo con soli Partita IVA e tariffa).
      2. Scenario AC-1: da `/anagrafiche/utenti/nuovo`, con solo Amministratore selezionato, i campi con label esatta «Nome» e «Cognome» sono visibili; submit senza cognome → errore «Il cognome è obbligatorio» e nessuna riga creata; compilato il cognome → l'utente compare in elenco con nominativo completo.
      3. Scenario AC-2: selezionando anche Collaboratore, la sezione profilo espone solo «Partita IVA» e «Tariffa giornaliera»; `getByLabel('Cognome', { exact: true })` conta 1 nella pagina.
      4. Scenario AC-3: crea un utente via factory, apri la modifica, verifica Nome e Cognome separati e popolati, cambia il cognome, salva, riapri e verifica la persistenza distinta e il nominativo aggiornato in elenco.
      5. Scenario AC-4: in elenco, la riga dell'utente seed «Giulia Conti» (sola lettura) e quella dell'utente factory mostrano il nominativo completo, senza duplicazioni (es. mai «Conti Conti») né troncamenti.

      ## Verify
      - Run: `npx playwright test tests/e2e/gestione-utenti.spec.ts`
      - Expect: verde (prerequisiti: DB attivo, `npm run db:migrate`, `npm run db:seed`, browser installati).
      - Run: `npm run lint`
      - Expect: verde, incluso il guardrail anti-flakiness e2e.

      ## Done
      - [ ] AC-1 — Oracolo: errore visibile «Il cognome è obbligatorio» sul solo-amministratore e censimento riuscito col cognome.
      - [ ] AC-2 — Oracolo: sezione profilo con soli Partita IVA e tariffa; un solo campo Cognome nella pagina.
      - [ ] AC-3 — Oracolo: round-trip dei campi separati riaprendo il form.
      - [ ] AC-4 — Oracolo: nominativo completo in elenco per utente seed (lettura) e factory.

      ## Blockers
      Ambiente e2e attivo (PostgreSQL, migrazioni, seed, browser Playwright).
    ref: TASK-10
