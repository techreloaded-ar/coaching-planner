      ## Steps
      1. Crea la pagina con frontmatter `type: decision`, `title`, `description`, `status: generated`, `decision_status: accepted` e `sources` (implementation: prisma/schema.prisma [Utente, Collaboratore], la migrazione aggiungi_cognome_utente, src/app/(back-office)/anagrafiche/utenti/actions.ts [creaUtente, aggiornaUtente], src/app/(back-office)/anagrafiche/collaboratori/actions.ts [aggiornaCollaboratore], src/domain/anagrafiche/valida-utente.ts; verification: tests/unit/utenti-actions.test.ts, tests/unit/collaboratori-dal-actions.test.ts, tests/e2e/gestione-utenti.spec.ts).
      2. Scrivi le sezioni con i marker `<!-- archetipo:wiki section=... -->` nell'ordine: context (US-048, campo unico composto insufficiente), decision (Utente autorevole per nome+cognome; Collaboratore.nome/cognome copie coordinate mantenute allineate dai writer transazionali; migrazione con backfill), alternatives (campo unico composto con parsing; drop delle colonne di Collaboratore con motivo dello scarto e rinvio), consequences (duplicazione controllata, consolidamento futuro possibile), verification (suite citate in sources).
      3. Collega la pagina a `domains/identita-accesso`, `domains/collaboratori` e `decisions/ruoli-combinabili-profilo-derivato` nei concetti correlati.
      4. Aggiorna la navigazione: `archetipo wiki catalog` da /Users/smarello/repo/coaching-planner.

      ## Verify
      - Run: `archetipo wiki validate --profile bootstrap`
      - Expect: `data.ok: true` con 24 pagine e nessun finding nuovo (baseline: 23 pagine, ok).

      ## Done
