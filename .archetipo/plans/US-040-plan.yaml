  - id: TASK-08
    title: Server Action di invalidazione/riattivazione con cascata sul profilo collaboratore
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esiste una form action che invalida o riattiva un utente in transazione, propaga lo stato al profilo collaboratore collegato, rifiuta l'operazione sull'ultimo amministratore attivo e comunica l'esito via query param (AC-1, AC-4, AC-5, AC-8).

      ## Read
      - src/app/(back-office)/anagrafiche/collaboratori/cambia-stato-action.ts — pattern di riferimento (form action "use server", guardia, redirect)
      - src/app/(back-office)/anagrafiche/utenti/actions.ts — stile del file actions utenti
      - src/domain/anagrafiche/protezione-amministratore.ts — funzione pura e messaggio (TASK-01)
      - src/app/(back-office)/anagrafiche/collaboratori/actions.ts — uso di `db.$transaction` con esito discriminato (pattern `"EMAIL_DUPLICATA" as const`)

      ## Change
      - src/app/(back-office)/anagrafiche/utenti/cambia-stato-utente-action.ts — nuovo file. Non modificare actions.ts in questo task.

      ## Steps
      1. Crea la form action `cambiaStatoUtenteAction(formData: FormData)` con `"use server"`.
      2. Guardia: `richiediRuoloApi("AMMINISTRATORE")`.
      3. Leggi `id` (se assente: `redirect("/anagrafiche/utenti")`) e `attivo` (`formData.get("attivo") === "true"`).
      4. In `db.$transaction(async (tx) => { ... })` restituisci un esito discriminato:
         - carica il target con `tx.utente.findUnique({ where: { id }, select: { ruolo: true, attivo: true, collaboratore: { select: { id: true } } } })`; se assente → `"NON_TROVATO"`;
         - se si sta invalidando (`attivo === false`): conta gli altri amministratori attivi con `tx.utente.count({ where: { ruolo: "AMMINISTRATORE", attivo: true, id: { not: id } } })` e se `violaProtezioneUltimoAmministratore({ ruolo, attivo }, { tipo: "INVALIDAZIONE" }, conteggio)` → `"ULTIMO_AMMINISTRATORE"` senza alcuna scrittura;
         - aggiorna `tx.utente.update({ where: { id }, data: { attivo } })`;
         - se il target ha un profilo collaboratore: `tx.collaboratore.update({ where: { id: profilo.id }, data: { attivo } })` — stesso valore in entrambe le direzioni (invalidazione disattiva, riattivazione riattiva);
         - esito `"INVALIDATO"` o `"RIATTIVATO"` in base ad `attivo`.
      5. Fuori dalla transazione: per `"ULTIMO_AMMINISTRATORE"` → `redirect("/anagrafiche/utenti?errore=ultimo-amministratore")`; per `"NON_TROVATO"` → `redirect("/anagrafiche/utenti")`; altrimenti `revalidatePath("/anagrafiche/utenti")` e `revalidatePath("/anagrafiche/collaboratori")`, poi `redirect("/anagrafiche/utenti?esito=invalidato")` o `?esito=riattivato`.

      ## Verify
      - Run: `npm run lint`
      - Expect: passa, nessun nuovo diagnostico
      - Run: `npx vitest run tests/unit/utenti-actions.test.ts`
      - Expect: verde come in baseline (file non toccato)

      ## Done
      - [ ] AC-1 — L'invalidazione aggiorna `Utente.attivo` senza mai cancellare il record
      - [ ] AC-4 — L'invalidazione disattiva il profilo collaboratore collegato nella stessa transazione
      - [ ] AC-5 — La riattivazione riporta utente e profilo collegato ad attivi nella stessa transazione
      - [ ] AC-8 — L'invalidazione dell'ultimo amministratore attivo termina con esito di errore e nessuna scrittura

      ## Blockers
      None.
