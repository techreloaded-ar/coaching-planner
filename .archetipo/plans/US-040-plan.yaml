  - id: TASK-13
    title: 'Test e2e: invalidazione/riattivazione, cambio ruolo su sessione aperta, banner di errore'
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
      - TASK-07
      - TASK-11
      - TASK-12
    body: |-
      ## Objective
      I flussi di accettazione end-to-end sono provati nel browser nel rispetto del contratto anti-flakiness: invalidazione con effetti su elenco, anagrafica collaboratori e sessione aperta; riattivazione completa; cambio ruolo efficace al primo accesso protetto successivo su una sessione aperta PRIMA della modifica; messaggio di errore dell'ultimo amministratore.

      ## Read
      - tests/e2e/gestione-utenti.spec.ts — helper esistenti (`tabellaUtenti`, `rigaUtente`, `apriElencoUtenti`, `filtraUtenti`) e test "salva nome ed email modificati" (contiene `await expect(page.locator('input[name="ruolo"]')).toHaveCount(0)`, da aggiornare)
      - tests/e2e/anagrafica-collaboratori.spec.ts righe 200-242 — pattern consolidato: sessione via seam in un secondo context, navigazione protetta respinta, riattivazione
      - tests/e2e/support/auth.ts — `accediCome` (seam) e `accediAlBackOfficeComeAdmin`
      - tests/e2e/support/factory.ts — `createUtente` (nome, email, ruolo) e `createCollaboratore` (con `utenteOptions`)
      - tests/e2e/README.md — contratto e2e completo

      ## Change
      - tests/e2e/gestione-utenti.spec.ts — nuovi test + aggiornamento del test di modifica esistente. Nessuna mutazione di entità seed (l'admin `info@techreloaded.it` non va MAI invalidato o retrocesso); solo dati di factory namespaced; selettori per ruolo/label/testo esatto; web-first expect; nessun hard wait.

      ## Steps
      1. Test "invalida un collaboratore: elenco, profilo operativo e sessione aperta" (AC-1, AC-3, AC-4): crea `factory.createCollaboratore({ utenteOptions: { ... } })`; in un secondo browser context apri una sessione con `accediCome(paginaUtente, email)` e verifica `/attivita` raggiungibile; nel context admin apri l'elenco utenti, filtra per email, clicca "Invalida", conferma nella modale (`getByRole("dialog")`), attendi `**/anagrafiche/utenti?esito=invalidato`; asserisci banner `role="status"`, riga ancora presente (`toHaveCount(1)`) con badge "Invalidato" (exact); naviga su `/anagrafiche/collaboratori`, filtra e asserisci badge "Disattivato" sulla riga del profilo (AC-4); nel secondo context `goto("/attivita")` e attendi il rientro alla radice con il bottone "Accedi con Google" visibile (AC-3, pattern collaboratori). Chiudi il context in `finally`.
      2. Test "riattiva un utente invalidato: accesso e profilo ripristinati" (AC-5): partendo da un collaboratore di factory invalidato via UI nello stesso test, clicca "Riattiva", attendi `?esito=riattivato`, asserisci badge "Attivo" in utenti e "Attivo" sulla riga del profilo in collaboratori; in un nuovo context `accediCome(email)` deve raggiungere `/attivita`.
      3. Test "promuove un collaboratore: la sessione aperta raggiunge il back office" (AC-6, AC-7): `factory.createUtente({ ruolo: "COLLABORATORE" })`; apri sessione nel secondo context PRIMA della modifica (JWT con ruolo stantio) e verifica `/attivita`; nel context admin apri Modifica, seleziona il radio "Amministratore", salva, attendi `?esito=salvato`; filtra e asserisci badge "Amministratore" in elenco (AC-6); nel secondo context `goto("/anagrafiche")` e asserisci l'arrivo nel back office (URL `/anagrafiche` e heading della console) (AC-7).
      4. Test "retrocede un amministratore: la sessione aperta perde il back office" (AC-7): `factory.createUtente({ ruolo: "AMMINISTRATORE" })`; sessione nel secondo context e verifica che `/anagrafiche` sia raggiungibile; retrocedi a Collaboratore dal form; nel secondo context `goto("/anagrafiche")` e attendi il redirect a `/attivita`.
      5. Test "mostra l'errore di protezione dell'ultimo amministratore" (AC-8, percorso UI): naviga direttamente `/anagrafiche/utenti?errore=ultimo-amministratore` da admin e asserisci il banner `role="alert"` con il messaggio. Aggiungi un commento nel test che rimanda alla copertura unitaria della logica di rifiuto (tests/unit/cambia-stato-utente.test.ts, tests/unit/utenti-actions.test.ts) e spiega perché il percorso negativo reale non è riproducibile in e2e (richiederebbe di invalidare l'admin del seed, vietato dal contratto).
      6. Nel test esistente "salva nome ed email modificati e li mostra nell'elenco": sostituisci `toHaveCount(0)` su `input[name="ruolo"]` con l'asserzione che il radio "Collaboratore" è presente e `toBeChecked()`.

      ## Verify
      - Run: `npx playwright test tests/e2e/gestione-utenti.spec.ts`
      - Expect: tutti i test del file verdi (nuovi e aggiornati)
      - Run: `npm run lint`
      - Expect: passa, incluso il guardrail anti-flakiness (obbligatorio dopo ogni modifica e2e)

      ## Done
      - [ ] AC-1 — Badge "Invalidato" e permanenza in elenco asseriti nel browser
      - [ ] AC-3 — Sessione aperta bloccata alla prima navigazione protetta con rientro alla pagina di accesso
      - [ ] AC-4 — Profilo "Disattivato" visibile nell'anagrafica collaboratori dopo l'invalidazione
      - [ ] AC-5 — Riattivazione: badge, profilo e login ripristinati
      - [ ] AC-6 — Nuovo ruolo mostrato in elenco dopo il salvataggio
