      3. Casi da coprire (per ciascuno costruisci il FormData con `id` e `attivo`):
         - invalidazione di un collaboratore con profilo: `utente.update` chiamata con `{ attivo: false }` E `collaboratore.update` con `{ attivo: false }`; redirect a `?esito=invalidato`; entrambi i `revalidatePath` (utenti e collaboratori) invocati (AC-1, AC-4);
         - riattivazione dello stesso: entrambi gli update con `{ attivo: true }`, redirect `?esito=riattivato` (AC-5);
