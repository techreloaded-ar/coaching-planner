      - tests/unit/proxy.test.ts — aggiorna i casi cementati sul vecchio comportamento.

      ## Steps
      1. In `src/proxy.ts` elimina il blocco `if (classificazione.politicaAccesso === "AMMINISTRATORE" && ...) { return applicaRinnovo(NextResponse.redirect(...)) }`: una sessione valida su rotta protetta prosegue sempre con `applicaRinnovo(NextResponse.next(), sessione)`.
      2. Aggiorna il commento di modulo/funzione: il proxy garantisce autenticazione e rinnovo sliding; l'autorizzazione per ruolo è del DAL (`src/lib/dal.ts`), che rilegge il database a ogni accesso protetto.
      3. In `tests/unit/proxy.test.ts` trova i casi "collaboratore su rotta amministrativa → redirect" e riscrivili: la richiesta prosegue (`NextResponse.next`) con cookie rinnovato; aggiungi/aggiorna il commento che rimanda alla guardia DAL come punto autorevole.
      4. Se `classificazione.politicaAccesso` resta inutilizzato nel ramo protetto, lascialo nella struttura (documenta la classificazione) senza introdurre warning di lint.

      ## Verify
