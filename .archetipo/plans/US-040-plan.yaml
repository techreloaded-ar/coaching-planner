schema: archetipo/plan/v2
spec_code: US-040
body: |-
  # US-040: Invalidazione, riattivazione e cambio ruolo degli utenti con auto-protezione — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-21

  ---

  ## Spec

  **Epic:** EP-001 — Autenticazione e Ruoli
  **Priorità:** HIGH | **Punti:** 3 | **Bloccata da:** US-039 (DONE)

  Come amministratore, voglio invalidare o riattivare un utente e cambiarne il ruolo dalla pagina Utenti, così da revocare o adeguare gli accessi in modo tracciabile, senza mai eliminare definitivamente un utente.

  ---

  ## Soluzione Tecnica

  US-039 ha già persistito `Utente.attivo` e mostrato il badge di stato: questa spec introduce le mutazioni (invalidazione, riattivazione, cambio ruolo) e rende `Utente.attivo` finalmente autorevole nelle guardie di accesso. Nessuna migrazione di schema.

  ### 1. Applicazione dello stato `Utente.attivo` alle guardie (AC-2, AC-3)

  - **Callback Google** (`src/app/api/auth/google/callback/route.ts`): dopo la risoluzione dell'utente per email, un utente con `attivo === false` viene respinto con `redirectWithError()` → `/?error=1`, lo **stesso esito generico** delle email non censite (AC-2). Il campo `attivo` entra nella `select`.
  - **DAL** (`src/lib/dal.ts`, `_risolviSessione`): un utente con `attivo === false` rende la sessione non risolvibile (`return null`), esattamente come oggi accade per il collaboratore con profilo disattivato. Effetto: RSC → redirect alla radice; API/action → 401. È il "blocco al primo accesso successivo a dati protetti" di AC-3, coerente con le guardie esistenti (nessuna revoca push, come da Fuori Perimetro). Il confronto usa `attivo === false` esplicito, coerente con lo stile esistente.
  - **Seam e2e** (`src/app/api/e2e-test/sessione/route.ts`): invariato. Come già documentato nel test di revoca collaboratori (`tests/e2e/anagrafica-collaboratori.spec.ts:200-228`), il seam crea la sessione e il DAL la invalida alla prima navigazione protetta: è il comportamento reale che i test osservano.

  ### 2. Server Action di cambio stato con cascata sul profilo collaboratore (AC-1, AC-4, AC-5, AC-8)

  Nuova action `cambiaStatoUtenteAction` in `src/app/(back-office)/anagrafiche/utenti/cambia-stato-utente-action.ts`, sul modello di `cambia-stato-action.ts` dei collaboratori (form action con redirect, esiti via query param):

  - guardia `richiediRuoloApi("AMMINISTRATORE")`;
  - in **transazione**: lettura del target (ruolo, attivo, profilo collaboratore), conteggio degli **altri** amministratori attivi, decisione di auto-protezione tramite funzione pura, aggiornamento di `Utente.attivo` e — se esiste il profilo — di `Collaboratore.attivo` allo stesso valore (AC-4 in invalidazione, AC-5 in riattivazione);
  - esiti: redirect a `/anagrafiche/utenti?esito=invalidato|riattivato`, oppure `?errore=ultimo-amministratore` senza alcuna scrittura (AC-8);
  - `revalidatePath` sia su `/anagrafiche/utenti` sia su `/anagrafiche/collaboratori` (la cascata tocca entrambe le viste).

  ### 3. Auto-protezione come funzione pura di dominio (AC-8)

  `src/domain/anagrafiche/protezione-amministratore.ts`, coerente con l'ADR `decisions/calcoli-puri`: `violaProtezioneUltimoAmministratore(target, operazione, altriAmministratoriAttivi)` restituisce `true` quando il target è un AMMINISTRATORE attivo, non esistono altri amministratori attivi, e l'operazione è un'invalidazione oppure una retrocessione a COLLABORATORE. Il conteggio avviene dentro la transazione dell'action (`db.utente.count({ where: { ruolo: "AMMINISTRATORE", attivo: true, id: { not: id } } })`). Limite noto e accettato per l'MVP: con isolamento READ COMMITTED due invalidazioni reciproche simultanee potrebbero in teoria incrociarsi; scenario remoto per una console amministrativa interna, documentato qui per trasparenza.

  ### 4. Cambio ruolo dal form di modifica (AC-6, AC-7)

  - `aggiornaUtente` (`src/app/(back-office)/anagrafiche/utenti/actions.ts`) accetta ora anche il ruolo inviato dal form: validazione con `validaUtente` sul ruolo inviato (non più su quello persistito), protezione ultimo-amministratore sulla retrocessione (errore visibile via `useActionState`, stato invariato), aggiornamento transazionale di nome, email e ruolo.
  - `utente-form.tsx`: in modifica il riquadro sola-lettura del ruolo è sostituito dallo stesso radiogroup del censimento, precompilato sul ruolo corrente.

  ### 5. UI elenco utenti (AC-1, AC-8)

  `utenti-tabella.tsx` guadagna le azioni di riga "Invalida" (con modale di conferma, pattern di `collaboratori-tabella.tsx`, copy che esplicita revoca dell'accesso e disattivazione del profilo collaboratore se presente, reversibilità) e "Riattiva" (form diretto). `page.tsx` estende il banner di esito (`invalidato`, `riattivato`) e aggiunge un banner `role="alert"` per `errore=ultimo-amministratore`.

  ### Decisione architetturale — `decisions/autorita-ruolo-dal` (nuova, AC-7)

  **Contesto.** Il proxy (`src/proxy.ts:62-70`) oggi reindirizza fuori dalle rotte amministrative chi ha `ruolo !== "AMMINISTRATORE"` nel **JWT firmato**. Il rinnovo sliding ri-firma lo stesso payload senza consultare il database: dopo una promozione il JWT resta `COLLABORATORE` per l'intera vita della sessione e l'utente promosso non raggiungerebbe mai il back office senza ri-login, violando AC-7. La retrocessione invece funziona già: il DAL rilegge il ruolo dal DB e respinge.

  **Scelta.** Il proxy diventa responsabile della sola **autenticazione** (validità della sessione) su tutte le rotte protette; l'autorità sul **ruolo** vive esclusivamente nel DAL, che rilegge `Utente` dal database a ogni accesso protetto. La rimozione del blocco per ruolo nel proxy è sicura perché ogni superficie amministrativa è già guardata a valle: `src/app/(back-office)/layout.tsx` chiama `richiediRuolo("AMMINISTRATORE")`, ogni pagina back-office ripete la guardia, e query/action usano `richiediRuoloApi`. Il comportamento osservabile per un collaboratore che tenta `/anagrafiche` resta identico (redirect a `/attivita`), spostato dal proxy al DAL.

  **Alternative valutate.**
  1. *Mantenere il blocco nel proxy e richiedere ri-login dopo la promozione* — respinta: viola la lettera di AC-7 ("al primo accesso protetto successivo"), che usa la stessa semantica in-sessione di AC-3.
  2. *Consultare il database dal proxy* — respinta: il proxy è volutamente privo di accesso al DB (invariante documentata nel Wiki) e aggiungerlo introdurrebbe una query per ogni richiesta.
  3. *Route di risincronizzazione del JWT su mismatch di ruolo* — respinta per l'MVP: preserva la difesa in profondità ma aggiunge una route, logica di ri-emissione cookie e nuovi percorsi di errore per un beneficio marginale rispetto alle guardie DAL già pervasive.

  **Tradeoff accettato.** Si rinuncia al filtro anticipato per ruolo nel proxy (difesa in profondità): una futura rotta back-office che dimenticasse la guardia DAL non avrebbe più la rete di sicurezza del proxy. Mitigazione: la guardia vive nel layout di gruppo `(back-office)`, che copre strutturalmente ogni rotta figlia. Il JWT conserva un claim `ruolo` potenzialmente stantio: nessun consumer decide più sul claim, solo sul DB.

  **Verifica.** `tests/unit/proxy.test.ts` aggiornato (pass-through con rinnovo su rotta admin con JWT collaboratore), e2e `autorizzazione-ruoli.spec.ts` invariato e verde (il respingimento osservabile resta), nuovo e2e di promozione/retrocessione con sessione aperta prima del cambio ruolo.

  ### Mockup

  Non necessari: nessuna nuova pagina né ristrutturazione di layout. Le azioni di riga con modale replicano il pattern esistente dei collaboratori; il radiogroup del ruolo esiste già nel form di censimento.

  ---

  ## Baseline

  Rilevata il 2026-07-21 su `main` pulito (workdir = project root, nessun worktree):

  | Comando | Esito |
  |---|---|
  | `npx vitest run tests/unit/utenti-actions.test.ts tests/unit/dal-guards.test.ts tests/unit/auth-helpers.test.ts tests/unit/proxy.test.ts` | ✅ 4 file, 56 test passati |
  | `npm run lint` | ✅ eslint + guardrail anti-flakiness e2e passati |

  Nessun fallimento pre-esistente: ogni task deve lasciare questi comandi verdi. Prerequisiti d'ambiente (non ridiscoprire): `npm install` esegue `prisma generate` in postinstall; database locale con migrazioni e seed (`npm run db:migrate:deploy` + `npm run db:seed`) necessario per gli e2e; la suite Playwright avvia l'app con `E2E_TEST_MODE=true` tramite la configurazione esistente (`npm run test:e2e`).

  ---

  ## Assunzioni

  1. **Riattivazione e profilo collaboratore**: la riattivazione dell'utente riattiva sempre il profilo collaboratore collegato, anche se questo era stato disattivato manualmente prima dell'invalidazione. Tracciare la provenienza della disattivazione richiederebbe un flag dedicato non previsto dalla spec; la simmetria invalida↔disattiva / riattiva↔attiva è il comportamento più prevedibile e la modale lo esplicita.
  2. **"Primo accesso protetto successivo"** (AC-7) è inteso in-sessione (navigazione verso dati/rotte protette), con la stessa semantica di AC-3 — non come nuovo login.
  3. L'invalidazione di se stessi da parte di un amministratore è consentita se esiste un altro amministratore attivo: la sua sessione decade al primo accesso protetto successivo per effetto del DAL.

  ---

  ## Mappa delle evidenze di accettazione

  | AC | Livello | Oracolo osservabile | Fixture / stato di partenza | Task |
  |---|---|---|---|---|
  | AC-1 | e2e browser | Dopo conferma nella modale, la riga dell'utente mostra il badge "Invalidato" e resta presente in elenco; banner di esito visibile | Collaboratore di factory (utente+profilo namespaced) | TASK-13 (produce), TASK-11 (UI) |
  | AC-2 | unit (route reale) | `GET` del callback con utente `attivo:false` → redirect `/?error=1`, `createSession` mai chiamata; stesso esito dell'utente non censito (caso a confronto nello stesso test) | Mock di `scambiaCodice`, `db.utente.findUnique`, cookie OAuth validi | TASK-06 (produce), TASK-05 (impl). *Non dimostrabile in e2e: il flusso OAuth Google reale non è eseguibile nella suite* |
  | AC-3 | e2e browser | Sessione aperta via seam per l'utente poi invalidato: `goto /attivita` → redirect alla radice con pagina di accesso visibile (pattern `anagrafica-collaboratori.spec.ts:200-228`) | Sessione creata in un secondo browser context prima del blocco | TASK-13 (produce), TASK-03 (impl), TASK-04 (unit: `richiediSessioneApi` → 401 con `attivo:false`) |
  | AC-4 | e2e browser + unit | Dopo l'invalidazione, `/anagrafiche/collaboratori` mostra "Disattivato" sulla riga del profilo; unit: `collaboratore.update({attivo:false})` chiamata nella stessa transazione | Collaboratore di factory | TASK-13, TASK-09 |
  | AC-5 | e2e browser + unit | Dopo "Riattiva": badge "Attivo" in utenti e collaboratori, `accediCome(email)` raggiunge `/attivita`; unit: entrambi gli update a `true` | Stesso utente del flusso AC-1/AC-4 | TASK-13, TASK-09 |
  | AC-6 | e2e browser | Salvataggio dal form modifica con nuovo ruolo → elenco mostra il badge del nuovo ruolo sulla riga | Utente COLLABORATORE di factory | TASK-13, TASK-10, TASK-12 |
  | AC-7 | e2e browser | Sessione aperta **prima** del cambio ruolo (JWT stantio): promosso → `goto /anagrafiche` raggiunge il back office; retrocesso → `goto /anagrafiche` reindirizzato a `/attivita` | Due utenti di factory (uno per direzione), sessione nel secondo context creata prima della modifica | TASK-13, TASK-07, TASK-10 |
  | AC-8 | unit + e2e banner | Unit sul comportamento reale: invalidazione/retrocessione dell'ultimo admin attivo → nessuna scrittura, esito errore (funzione pura + entrambe le action con `count` mockato a 0); e2e: banner `role="alert"` visibile su `?errore=ultimo-amministratore` e, nel form, errore inline su retrocessione rifiutata | Mock db per il caso "ultimo"; vedi waiver sotto | TASK-02, TASK-09, TASK-10, TASK-13 |

  **Waiver e2e per il percorso negativo di AC-8**: rendere "ultimo amministratore attivo" un utente di test richiederebbe che nel database condiviso esista un solo admin attivo, cioè invalidare l'admin del seed (`info@techreloaded.it`) — vietato dal contratto e2e (nessuna mutazione di entità seed, `fullyParallel` preservato). L'evidenza della logica di rifiuto è quindi unitaria sulle action reali; l'e2e prova il rendering del messaggio di errore visibile navigando l'URL con `?errore=ultimo-amministratore`. Copertura combinata completa dell'AC senza compromettere il determinismo della suite.

  ---

  ## Strategia di test

  - **Unit (vitest)**: funzione pura di protezione (tutte le combinazioni ruolo/stato/operazione/conteggio); guardie DAL con `attivo:false` (401/sessione nulla); route callback Google **reale** con mock dei collaboratori esterni (google-oauth, db, session, cookies) — colma anche il gap di confidenza "media sul callback reale" segnalato dal Wiki; action `cambiaStatoUtenteAction` e `aggiornaUtente` reali con db mockato (transazione, cascata, protezione, esiti redirect/errori). I mock non nascondono mai l'oracolo: le asserzioni sono sulle scritture Prisma effettive e sugli esiti restituiti, non sul semplice avvenuto invoco dei mock.
  - **E2E browser (Playwright), richiesto**: i percorsi di accettazione attraversano autenticazione, autorizzazione, persistenza e navigazione tra schermate — nessun livello inferiore può provare l'effetto sulla sessione aperta. Si estende `tests/e2e/gestione-utenti.spec.ts` nel rispetto del contratto US-023: factory namespaced, nessuna mutazione di seed, selettori per ruolo/label, web-first expect, `fullyParallel` invariato, `npm run lint` (guardrail) dopo ogni modifica e2e.
  - **Regressioni**: `tests/unit/utenti-actions.test.ts` (due test cementano il vecchio "ruolo ignorato") e `tests/unit/proxy.test.ts` (redirect per ruolo) vengono aggiornati **nello stesso task** che cambia il comportamento, mai lasciati rossi; l'e2e esistente `autorizzazione-ruoli.spec.ts` deve restare verde senza modifiche (il respingimento del collaboratore resta osservabile, spostato al DAL).
  - **Dimostrazione**: filmabile — l'intero flusso della sezione Dimostrazione è riproducibile in un ambiente demo con due utenti; la decisione finale su registrazione/skip spetta ad archetipo-review.

  ## Impatto Wiki

  - **Creare**: `decisions/autorita-ruolo-dal` (ADR della scelta proxy=autenticazione / DAL=autorità sul ruolo) — TASK-14.
  - **Aggiornare dopo l'accettazione**: `domains/identita-accesso` (lo stato `Utente.attivo` diventa applicato dalle guardie; nuove mutazioni di stato e ruolo; nuova invariante sull'ultimo amministratore; il proxy non decide più sul ruolo), `domains/collaboratori` (la disattivazione del profilo può ora derivare in cascata dall'invalidazione dell'utente).
tasks:
  - id: TASK-01
    title: Funzione pura di auto-protezione dell'ultimo amministratore attivo
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Esiste un modulo di dominio puro che decide se un'operazione su un utente violerebbe la protezione dell'ultimo amministratore attivo (AC-8), riusabile da entrambe le Server Action.

      ## Read
      - src/domain/anagrafiche/valida-utente.ts — stile del modulo (header, tipi esportati, nessuna dipendenza da framework)
      - src/domain/types.ts — tipo `Ruolo`
      - docs/wiki/decisions/calcoli-puri.md — decisione che motiva l'isolamento in funzione pura

      ## Change
      - src/domain/anagrafiche/protezione-amministratore.ts — nuovo file. Non toccare altri file; nessun accesso a database o framework.

      ## Steps
      1. Crea il file con header di commento analogo a valida-utente.ts (modulo puro, nessuna dipendenza da framework).
      2. Esporta il tipo `OperazioneSuUtente = { tipo: "INVALIDAZIONE" } | { tipo: "CAMBIO_RUOLO"; nuovoRuolo: Ruolo }` (importa `Ruolo` da `@/domain/types`).
      3. Esporta la costante `MESSAGGIO_ULTIMO_AMMINISTRATORE = "Operazione non consentita: è l'ultimo amministratore attivo del sistema"`.
      4. Esporta `violaProtezioneUltimoAmministratore(utente: { ruolo: Ruolo; attivo: boolean }, operazione: OperazioneSuUtente, altriAmministratoriAttivi: number): boolean` che restituisce `true` se e solo se: `utente.ruolo === "AMMINISTRATORE"` E `utente.attivo === true` E `altriAmministratoriAttivi === 0` E (l'operazione è `INVALIDAZIONE`, oppure è `CAMBIO_RUOLO` con `nuovoRuolo !== "AMMINISTRATORE"`). In ogni altro caso `false` (in particolare: target collaboratore, target admin già invalidato, promozione, presenza di altri admin attivi).

      ## Verify
      - Run: `npm run lint`
      - Expect: passa (baseline verde, nessun nuovo diagnostico)
      - Run: `npx vitest run tests/unit`
      - Expect: tutti i test passano come in baseline (il nuovo modulo non è ancora consumato)

      ## Done
      - [ ] AC-8 — La regola "ultimo amministratore attivo non invalidabile né retrocedibile" è codificata in una funzione pura con messaggio d'errore esportato

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Test unitari della funzione pura di protezione
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      La matrice decisionale di `violaProtezioneUltimoAmministratore` è provata da test unitari: l'oracolo è il valore booleano restituito per ogni combinazione significativa.

      ## Read
      - src/domain/anagrafiche/protezione-amministratore.ts — API da testare
      - tests/unit/valida-utente.test.ts — stile dei test di dominio puri (describe/it in italiano, expect diretti)

      ## Change
      - tests/unit/protezione-amministratore.test.ts — nuovo file. Nessun mock: il modulo è puro.

      ## Steps
      1. Crea il file con questi casi, asserendo il booleano esatto:
         - admin attivo, 0 altri admin attivi, INVALIDAZIONE → `true`;
         - admin attivo, 0 altri admin attivi, CAMBIO_RUOLO verso COLLABORATORE → `true`;
         - admin attivo, 0 altri admin attivi, CAMBIO_RUOLO verso AMMINISTRATORE → `false` (conferma ruolo non è retrocessione);
         - admin attivo, 1 altro admin attivo, INVALIDAZIONE → `false`;
         - admin attivo, 1 altro admin attivo, CAMBIO_RUOLO verso COLLABORATORE → `false`;
         - collaboratore attivo, 0 altri admin attivi, INVALIDAZIONE → `false`;
         - collaboratore, CAMBIO_RUOLO verso AMMINISTRATORE (promozione), 0 altri admin → `false`;
         - admin con `attivo: false`, 0 altri admin attivi, INVALIDAZIONE → `false` (già invalidato: non è l'ultimo attivo).
      2. Aggiungi un test che verifica il contenuto non vuoto di `MESSAGGIO_ULTIMO_AMMINISTRATORE`.

      ## Verify
      - Run: `npx vitest run tests/unit/protezione-amministratore.test.ts`
      - Expect: tutti i casi passano

      ## Done
      - [ ] AC-8 — Ogni ramo della regola di protezione è coperto con oracolo sul valore restituito, promozioni e utenti già invalidati inclusi

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Il DAL invalida la sessione di un utente con attivo=false
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Una sessione già aperta di un utente invalidato viene bloccata al primo accesso successivo a dati protetti: `_risolviSessione` restituisce `null` quando `Utente.attivo === false` (AC-3).

      ## Read
      - src/lib/dal.ts — `_risolviSessione` (righe 26-59): select corrente e gestione del collaboratore disattivato, da imitare
      - tests/unit/dal-guards.test.ts — come i mock costruiscono l'utente restituito da `findUnique`

      ## Change
      - src/lib/dal.ts — solo `_risolviSessione`: select + un nuovo controllo. Non toccare le altre guardie (derivano tutte da `_risolviSessione`).

      ## Steps
      1. Aggiungi `attivo: true` alla `select` di `db.utente.findUnique` in `_risolviSessione`.
      2. Subito dopo `if (!utente) return null;` aggiungi il blocco: se `utente.attivo === false` restituisci `null`, con un commento che spiega "Utente invalidato → sessione non valida". Usa il confronto esplicito `=== false` (stile del controllo collaboratore esistente): i mock dei test esistenti non forniscono `attivo` e non devono rompersi.
      3. Nessuna modifica a `richiediRuolo`, `richiediSessioneApi`, ecc.: ereditano il blocco.

      ## Verify
      - Run: `npx vitest run tests/unit/dal-guards.test.ts`
      - Expect: i test esistenti restano verdi (baseline: passavano tutti)
      - Run: `npm run lint`
      - Expect: passa

      ## Done
      - [ ] AC-3 — Con `Utente.attivo === false` la sessione non è risolvibile: RSC reindirizzati alla radice, API/action ricevono 401 tramite le guardie esistenti

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Test unitari delle guardie DAL per l'utente invalidato
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il blocco di sessione per utente invalidato è provato sulle guardie reali del DAL: l'oracolo è l'`ErroreAutorizzazione(401)` lanciato (o la sessione restituita nel caso positivo), non l'invocazione dei mock.

      ## Read
      - tests/unit/dal-guards.test.ts — setup dei mock (`getSessionCookie`, `db.utente.findUnique`) e casi esistenti su `richiediSessioneApi`, in particolare "lancia 401 se il collaboratore è stato disattivato"
      - src/lib/dal.ts — comportamento appena introdotto

      ## Change
      - tests/unit/dal-guards.test.ts — aggiungi casi nel describe di `richiediSessioneApi`; non riscrivere i casi esistenti.

      ## Steps
      1. Nuovo caso: utente trovato con `attivo: false` (ruolo COLLABORATORE, `collaboratore: null`) → `richiediSessioneApi` lancia `ErroreAutorizzazione` con `statusCode` 401.
      2. Nuovo caso: utente AMMINISTRATORE con `attivo: false` → 401 (l'invalidazione vale anche per gli amministratori, a differenza del profilo collaboratore disattivato che per gli admin non revoca la sessione).
      3. Nuovo caso positivo: utente con `attivo: true` → sessione restituita con i dati attesi.
      4. Nei nuovi mock includi sempre il campo `attivo` nell'oggetto restituito da `findUnique`.

      ## Verify
      - Run: `npx vitest run tests/unit/dal-guards.test.ts`
      - Expect: casi nuovi e preesistenti tutti verdi

      ## Done
      - [ ] AC-3 — Il 401 per utente invalidato è asserito sulla guardia reale, incluso il caso amministratore invalidato

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Il callback Google respinge l'utente invalidato con l'esito generico
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Un utente invalidato che tenta l'accesso Google viene respinto con lo stesso esito generico delle email non censite: redirect a `/?error=1` (AC-2).

      ## Read
      - src/app/api/auth/google/callback/route.ts — passi 5-7 del flusso: risoluzione utente per email, rifiuto del collaboratore disattivato, `redirectWithError()`

      ## Change
      - src/app/api/auth/google/callback/route.ts — solo la select dell'utente e un nuovo controllo. Non cambiare l'ordine degli altri passi né il formato dell'esito d'errore.

      ## Steps
      1. Aggiungi `attivo: true` alla `select` di `db.utente.findUnique`.
      2. Subito dopo il blocco `if (!utente) { ... redirectWithError(); }` aggiungi: se `utente.attivo === false` restituisci `redirectWithError()`, con commento "Utente invalidato → accesso negato, stesso messaggio generico". Il controllo precede quello sul profilo collaboratore disattivato.

      ## Verify
      - Run: `npx vitest run tests/unit/auth-helpers.test.ts`
      - Expect: verde come in baseline
      - Run: `npm run lint`
      - Expect: passa

      ## Done
      - [ ] AC-2 — L'utente invalidato riceve nel callback lo stesso identico esito (`/?error=1`) riservato alle email non censite, senza creazione di sessione né upsert account

      ## Blockers
      None.
