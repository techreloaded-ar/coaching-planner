    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il proxy non decide più sul ruolo firmato nel JWT (che dopo un cambio ruolo è stantio): lascia passare ogni sessione valida e l'autorità sul ruolo resta al DAL, che rilegge il database. Sblocca AC-7 per la promozione in sessione aperta. Decisione registrata nell'ADR `decisions/autorita-ruolo-dal` (TASK-14).

      ## Read
      - src/proxy.ts — blocco righe 62-70 (`politicaAccesso === "AMMINISTRATORE" && sessione.payload.ruolo !== "AMMINISTRATORE"` → redirect a HOME_AUTENTICATA)
      - src/app/(back-office)/layout.tsx — conferma che il layout chiama `richiediRuolo("AMMINISTRATORE")`: è la guardia che rende sicura la rimozione
