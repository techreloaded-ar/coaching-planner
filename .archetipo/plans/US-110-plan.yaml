    body: |-
      ## Objective
      Consultare o modificare il foglio di un altro collaboratore e vedere il selettore del foglio dipendono dal permesso `CONSULTARE_FOGLI_ATTIVITA_ALTRUI`, non più dal ruolo. Il collegamento «Apri Persone» dello stato profilo dipende da `GESTIRE_UTENTI`.

      ## Read
      - src/lib/foglio-attivita.ts — `risolviCollaboratoreConsultato`, `collaboratoreConsultatoDellaPagina`, `collaboratoriDelSelettore` (tre controlli `sessione.ruolo !== "AMMINISTRATORE"`) e commenti di modulo
      - src/lib/dal.ts — `verificaAccessoDatiCollaboratore` (controllo `sessione.ruolo === "AMMINISTRATORE"`)
      - src/app/(front-office)/layout.tsx — `const amministratore = sessione.ruolo === "AMMINISTRATORE"`
      - src/app/(front-office)/attivita/stato-profilo-collaboratore.tsx — prop `amministratore` e link «Apri Persone»
      - src/app/(front-office)/attivita/page.tsx, src/app/(front-office)/attivita/[data]/page.tsx, src/app/(front-office)/attivita/riepilogo/page.tsx — `amministratore={sessione.ruolo === "AMMINISTRATORE"}`
      - src/lib/actions/righe-attivita.ts e src/app/api/attivita/*/route.ts — passano già da `risolviCollaboratoreConsultato`/`risolviCollaboratoreDelFoglio`: da leggere, non da modificare

      ## Change
      - src/lib/foglio-attivita.ts — tre condizioni e relativi JSDoc/commenti. Messaggi d'errore, status, redirect e `notFound` invariati, tranne il testo del 403 di `collaboratoriDelSelettore` (vedi Steps).
      - src/lib/dal.ts — solo `verificaAccessoDatiCollaboratore` (condizione e JSDoc «Regole»).
      - src/app/(front-office)/layout.tsx — variabile e commento.
      - src/app/(front-office)/attivita/stato-profilo-collaboratore.tsx — prop `amministratore` rinominata `gestisceUtenti`.
      - Le tre pagine del front office — solo il valore passato a `StatoProfiloCollaboratore`.
      - Non toccare route API, Server Action, componenti client del foglio, `policy-rotte.ts`, `proxy.ts`.

      ## Steps
      1. In `src/lib/foglio-attivita.ts` definire una costante locale `const PERMESSO_FOGLI_ALTRUI = "CONSULTARE_FOGLI_ATTIVITA_ALTRUI" satisfies Permesso;` (con `import type { Permesso } from "@/domain/permessi";`) e sostituire:
         - in `risolviCollaboratoreConsultato`: `if (!sessione.permessi.includes(PERMESSO_FOGLI_ALTRUI))`, con messaggio `"Serve il permesso di consultare i fogli attività altrui"`, status 403;
         - in `collaboratoreConsultatoDellaPagina`: `if (!sessione.permessi.includes(PERMESSO_FOGLI_ALTRUI)) { redirect(HOME_AUTENTICATA); }`;
         - in `collaboratoriDelSelettore`: `if (!sessione.permessi.includes(PERMESSO_FOGLI_ALTRUI))`, con messaggio `"Serve il permesso di consultare i fogli attività altrui"`, status 403;
         - nei JSDoc e nel commento di sezione sostituire «amministratore» con «chi ha il permesso di consultare i fogli altrui». La sezione diventa `// ── Foglio attività consultato da un altro utente ─────`.
      2. Verificare con `grep -rn "Solo un amministratore\|Accesso riservato all'amministratore" src tests` che nessun test asserisca i vecchi messaggi. Se un test li asserisce, aggiornarne l'atteso al nuovo testo nello stesso task.
      3. In `src/lib/dal.ts`, `verificaAccessoDatiCollaboratore`: sostituire `if (sessione.ruolo === "AMMINISTRATORE")` con `if (sessione.permessi.includes("CONSULTARE_FOGLI_ATTIVITA_ALTRUI"))` e aggiornare il JSDoc: «- chi ha CONSULTARE_FOGLI_ATTIVITA_ALTRUI: accesso ai dati di tutti i collaboratori» e «- gli altri: solo ai propri dati».
      4. In `src/app/(front-office)/layout.tsx`: `const consultaFogliAltrui = sessione.permessi.includes("CONSULTARE_FOGLI_ATTIVITA_ALTRUI");`, usarla al posto di `amministratore` nelle due condizioni e aggiornare il commento: «Solo per chi può consultare i fogli altrui il titolo diventa il selettore del foglio: l'elenco dei collaboratori non viene mai letto per gli altri utenti.».
      5. In `stato-profilo-collaboratore.tsx` rinominare la prop `amministratore` in `gestisceUtenti`, con JSDoc «Il collegamento a Persone porta a una pagina che richiede GESTIRE_UTENTI.», e usarla nella condizione del `Link`.
      6. Nelle tre pagine del front office sostituire `amministratore={sessione.ruolo === "AMMINISTRATORE"}` con `gestisceUtenti={sessione.permessi.includes("GESTIRE_UTENTI")}`. Aggiornare i commenti «Foglio di un altro collaboratore, aperto da un amministratore.» in «Foglio di un altro collaboratore, aperto da chi può consultare i fogli altrui.».
      7. Controllo finale: `grep -rn '"AMMINISTRATORE"' src/lib/foglio-attivita.ts "src/app/(front-office)" src/app/struttura-applicazione.tsx src/app/sidebar-applicazione.tsx` restituisce al massimo il confronto per l'etichetta del `MenuAccount` in `sidebar-applicazione.tsx`.

      ## Verify
      - Run: `npx tsc --noEmit -p . 2>&1 | grep -v '^.next/' | grep -c 'error TS'`
      - Expect: `0`.
      - Run: `npx vitest run tests/unit/dal-guards.test.ts tests/unit/attivita-calendario-route.test.ts tests/unit/attivita-giornata-routes.test.ts tests/unit/righe-attivita-actions.test.ts`
      - Expect: tutti superati (le sessioni reali da DB derivano i permessi dal ruolo, quindi l'amministratore conserva l'accesso).
      - Run: `npx vitest run tests/unit/foglio-attivita.test.ts`
      - Expect: può fallire **solo** perché le fixture `AMMINISTRATORE`/`COLLABORATORE` del file non hanno `permessi` (TypeError su `includes` di undefined). La correzione è in TASK-06; qualsiasi altro errore va risolto qui.

      ## Done
      - [ ] AC-5 — le tre funzioni di `foglio-attivita.ts` e `verificaAccessoDatiCollaboratore` decidono su `CONSULTARE_FOGLI_ATTIVITA_ALTRUI`; route e Server Action le ereditano senza modifiche; la pagina reindirizza a `/attivita` senza il permesso
      - [ ] AC-6 — il layout del front office legge l'elenco dei collaboratori e mostra il selettore solo con il permesso
      - [ ] AC-7 — per amministratore (tutti i permessi) e collaboratore (nessuno) il comportamento è invariato

      ## Blockers
      None.
