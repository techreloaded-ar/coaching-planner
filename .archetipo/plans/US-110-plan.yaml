  - id: TASK-04
    title: Test della navigazione di amministrazione con insiemi di permessi fittizi
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Un test unitario dimostra che, con il solo permesso del report di fatturazione clienti, la sidebar elenca soltanto quella voce, nel solo gruppo «Reportistica». Dimostra anche che amministratore e collaboratore vedono le stesse voci di prima.

      ## Read
      - src/app/navigazione-amministrazione.ts — `GRUPPI_AMMINISTRAZIONE`, `gruppiAmministrazioneVisibili` (TASK-03)
      - src/domain/permessi.ts — `PERMESSI`, `permessiDelRuolo`, `haAccessoBackOffice`
      - tests/unit/permessi-pagine-back-office.test.ts — mappa area → permesso di riferimento
      - tests/e2e/sidebar.spec.ts — ordine atteso delle voci per l'amministratore

      ## Change
      - tests/unit/navigazione-amministrazione.test.ts — nuovo file. Nessuna modifica al codice di produzione.

      ## Steps
      1. Creare `tests/unit/navigazione-amministrazione.test.ts` (import da `vitest`, `@/app/navigazione-amministrazione`, `@/domain/permessi`). Helper locale: `const etichette = (gruppi) => gruppi.flatMap((g) => g.voci.map((v) => v.etichetta));`.
      2. Caso «solo il report di fatturazione clienti» (Demonstrates 1, AC-2, AC-3):
         `gruppiAmministrazioneVisibili(["CONSULTARE_REPORT_FATTURAZIONE_CLIENTI"])` è uguale (`toEqual` su titolo, href ed etichetta) a un solo gruppo `{ titolo: "Reportistica" }` con la sola voce `{ href: "/report/fatturazione-clienti", etichetta: "Fatturazione clienti" }`. Asserire inoltre che nessun gruppo ha titolo «Anagrafica».
      3. Caso amministratore (AC-7): con `permessiDelRuolo("AMMINISTRATORE")` i titoli sono `["Anagrafica", "Reportistica"]` e `etichette(...)` è esattamente `["Clienti", "Offerte", "Persone", "Voci di rimborso", "Importazione", "Fatturazione clienti", "Fatturazione collaboratori", "Marginalità"]`.
      4. Caso collaboratore (AC-3, AC-7): `gruppiAmministrazioneVisibili(permessiDelRuolo("COLLABORATORE"))` e `gruppiAmministrazioneVisibili(["CONSULTARE_FOGLI_ATTIVITA_ALTRUI"])` sono `[]`.
      5. Caso «ogni voce richiede il permesso della sua pagina» (AC-2): `it.each` sulla tabella attesa `[href, permesso]` (Clienti → `GESTIRE_CLIENTI`, Offerte → `GESTIRE_OFFERTE`, Persone → `GESTIRE_UTENTI`, Voci di rimborso → `GESTIRE_VOCI_RIMBORSO`, Importazione → `GESTIRE_IMPORTAZIONE`, i tre report → il proprio `CONSULTARE_REPORT_*`). Per ogni voce: `gruppiAmministrazioneVisibili([permesso])` contiene solo quella voce, e `gruppiAmministrazioneVisibili(PERMESSI.filter((p) => p !== permesso))` non la contiene.
      6. Caso etichetta «Amministrazione» (AC-4), legato ai permessi del caso 2: `haAccessoBackOffice(["CONSULTARE_REPORT_FATTURAZIONE_CLIENTI"])` → true, `haAccessoBackOffice(permessiDelRuolo("COLLABORATORE"))` → false.
      7. Caso statico (AC-4): leggere `src/app/sidebar-applicazione.tsx` con `fs.readFileSync(path.join(process.cwd(), ...))` e asserire che contiene `haAccessoBackOffice(permessi) &&` e `gruppiAmministrazioneVisibili(permessi)`, e non contiene `GRUPPI_AMMINISTRAZIONE.map` né `amministratore &&`.

      ## Verify
      - Run: `npx vitest run tests/unit/navigazione-amministrazione.test.ts`
      - Expect: tutti i casi superati.
      - Run: `npm run test`
      - Expect: suite completa verde.

      ## Done
      - [ ] AC-2 — con il solo `CONSULTARE_REPORT_FATTURAZIONE_CLIENTI` la funzione restituisce la sola voce «Fatturazione clienti»; ogni voce compare solo con il proprio permesso
      - [ ] AC-3 — nessun gruppo «Anagrafica» con il solo permesso del report; `[]` per collaboratore e per il solo permesso del foglio altrui
      - [ ] AC-4 — etichetta condizionata da `haAccessoBackOffice(permessi)` nella sidebar e predicato verificato sugli stessi insiemi
      - [ ] AC-7 — l'amministratore ottiene gli 8 link di amministrazione nell'ordine attuale

      ## Blockers
      None.
