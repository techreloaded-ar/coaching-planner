  - id: TASK-06
    title: Test del foglio altrui e del selettore con insiemi di permessi fittizi
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      I test dimostrano che, senza `CONSULTARE_FOGLI_ATTIVITA_ALTRUI`, la richiesta del foglio di un altro collaboratore riceve 403, la pagina riporta al proprio foglio e il selettore non viene caricato, anche se il ruolo è AMMINISTRATORE. Con il solo permesso, invece, la consultazione è ammessa.

      ## Read
      - tests/unit/foglio-attivita.test.ts — fixture `AMMINISTRATORE`/`COLLABORATORE`, mock `mocks.richiediSessioneApi`, `mocks.collaboratore.findUnique`, uso di `getGiornata` e `creaRiga`
      - tests/unit/pagine-e2e-test.test.ts — esempio di import ed esecuzione diretta di un componente RSC in vitest
      - src/lib/foglio-attivita.ts e src/app/(front-office)/layout.tsx — comportamento introdotto da TASK-05

      ## Change
      - tests/unit/foglio-attivita.test.ts — aggiungere `permessi` alle fixture e i nuovi casi. Nessun caso esistente rimosso o indebolito.
      - tests/unit/layout-front-office.test.ts — nuovo file.
      - Nessuna modifica al codice di produzione.

      ## Steps
      1. In `tests/unit/foglio-attivita.test.ts`:
         - importare `PERMESSI` da `@/domain/permessi`; aggiungere `permessi: PERMESSI` alla fixture `AMMINISTRATORE` e `permessi: []` a `COLLABORATORE`;
         - aggiungere le fixture `AMMINISTRATORE_SENZA_FOGLI_ALTRUI = { ...AMMINISTRATORE, permessi: PERMESSI.filter((p) => p !== "CONSULTARE_FOGLI_ATTIVITA_ALTRUI") }` e `COLLABORATORE_CON_FOGLI_ALTRUI = { ...COLLABORATORE, permessi: ["CONSULTARE_FOGLI_ATTIVITA_ALTRUI"] }`;
         - aggiungere `vi.mock("next/navigation", async (importOriginal) => ({ ...(await importOriginal<typeof import("next/navigation")>()), redirect: vi.fn((url: string) => { throw new Error(`REDIRECT:${url}`); }), notFound: vi.fn(() => { throw new Error("NOT_FOUND"); }) }))`. Se il mock rompe un caso esistente, limitarlo ai soli `redirect`/`notFound` senza `importOriginal`;
         - nuovo `describe("permesso di consultare i fogli altrui", ...)`:
           a. `risolviCollaboratoreConsultato("collab-mario")` con `AMMINISTRATORE_SENZA_FOGLI_ALTRUI` → `rejects.toMatchObject({ statusCode: 403 })`, `findUnique` non chiamato;
           b. `getGiornata(richiestaGiornata("?data=2026-10-12&collaboratore=collab-mario"))` con la stessa sessione → `response.status === 403`, `findUnique` non chiamato;
           c. `creaRiga` sul foglio `collab-mario` (stesso `formRiga` dei casi esistenti) con la stessa sessione → risultato `success: false`, `mocks.rigaAttivita.create` non chiamato;
           d. `collaboratoreConsultatoDellaPagina(AMMINISTRATORE_SENZA_FOGLI_ALTRUI, "collab-mario")` → `rejects.toThrow("REDIRECT:/attivita")`;
           e. `collaboratoriDelSelettore(AMMINISTRATORE_SENZA_FOGLI_ALTRUI)` → `rejects.toMatchObject({ statusCode: 403 })` (aggiungere `findMany: vi.fn()` a `mocks.collaboratore`) e `findMany` non chiamato;
           f. con `COLLABORATORE_CON_FOGLI_ALTRUI` e `findUnique` → `collaboratore("collab-mario")`: `risolviCollaboratoreConsultato` risolve `{ id: "collab-mario" }`; `collaboratoriDelSelettore` restituisce il valore di `findMany`.
      2. Creare `tests/unit/layout-front-office.test.ts`:
         - mock hoisted: `verificaSessione` e `risolviProfiloCollaboratoreCorrente` da `@/lib/dal` (sostituire solo queste due esportazioni con `importOriginal`), `@/lib/db` con `collaboratore: { findMany: vi.fn() }`, `@/app/struttura-applicazione` → `default: function StrutturaFinta() { return null; }`, `@/app/(front-office)/selettore-foglio-attivita` → `default: function SelettoreFinto() { return null; }`;
         - importare `FrontOfficeLayout from "@/app/(front-office)/layout"` e `SelettoreFinto` dal modulo mockato;
         - caso «senza il permesso il titolo è “Le mie attività” e l'elenco non viene letto» (Demonstrates 2, AC-6): sessione `{ ruolo: "AMMINISTRATORE", permessi: PERMESSI senza CONSULTARE_FOGLI_ATTIVITA_ALTRUI, ... }`; `const elemento = await FrontOfficeLayout({ children: null })`; asserire `elemento.props.intestazione.type === "h1"`, `elemento.props.intestazione.props.children === "Le mie attività"`, `findMany` e `risolviProfiloCollaboratoreCorrente` non chiamati;
         - caso «con il solo permesso compare il selettore con l'elenco» (AC-6): sessione `{ ruolo: "COLLABORATORE", permessi: ["CONSULTARE_FOGLI_ATTIVITA_ALTRUI"] }`, `findMany` → due collaboratori, profilo `{ stato: "ASSENTE" }`; asserire `elemento.props.intestazione.type === SelettoreFinto`, `props.collaboratori` uguale all'elenco, `props.proprioCollaboratoreId === null`;
         - caso collaboratore reale (`permessi: []`, AC-7): come il primo caso.
      3. Non usare `selectOption`, attese a tempo o snapshot: solo asserzioni puntuali.

      ## Verify
      - Run: `npx vitest run tests/unit/foglio-attivita.test.ts tests/unit/layout-front-office.test.ts`
      - Expect: tutti superati, compresi i casi esistenti con le fixture aggiornate.
      - Run: `npm run test`
      - Expect: suite completa verde.
      - Run: `npx tsc --noEmit -p . 2>&1 | grep -v '^.next/' | grep -c 'error TS'`
      - Expect: `0`.

      ## Done
      - [ ] AC-5 — senza il permesso, con ruolo AMMINISTRATORE: la route `GET /api/attivita/giornata?collaboratore=…` risponde 403, `creaRiga` restituisce `success: false` senza scrivere e la pagina reindirizza a `/attivita`; con il solo permesso il foglio altrui viene risolto
      - [ ] AC-6 — senza il permesso il layout rende l'`h1` «Le mie attività» senza chiamare `findMany`, e `collaboratoriDelSelettore` lancia 403; con il permesso rende il selettore con l'elenco
      - [ ] AC-7 — i casi esistenti di `foglio-attivita.test.ts` restano tutti presenti e verdi

      ## Blockers
      None.
