    body: |-
      ## Objective
      Dimostrare con i check registrati del progetto che la spec non introduce regressioni (AC-7) e che tutte le evidenze di AC-1…AC-6 sono verdi. Solo dopo, verificare che ogni task sia `DONE` prima di chiedere la review.

      ## Read
      - .archetipo/environment.json — check registrati `unit`, `lint`, `build`, `e2e`
      - tests/e2e/sidebar.spec.ts, tests/e2e/foglio-attivita-amministratore.spec.ts, tests/e2e/autorizzazione-ruoli.spec.ts, tests/e2e/logo-intestazione.spec.ts — scenari e2e che provano AC-7
      - Sezione «Baseline» del piano — confini preesistenti (`.next/dev/types`, avvisi del guardrail e2e)

      ## Change
      - Nessuna modifica al codice. Le evidenze vanno nella cartella dei risultati della spec tramite `--spec US-110`.

      ## Steps
      1. Dalla radice del progetto (`/Users/smarello/repo/coaching-planner`): `archetipo execution environment prepare`, se l'ambiente non è già pronto.
      2. `archetipo execution environment check unit --spec US-110` → controllare `passed: true`.
      3. `archetipo execution environment check lint --spec US-110` → `passed: true`, guardrail e2e superato.
      4. `npx tsc --noEmit -p . 2>&1 | grep -v '^.next/' | grep -c 'error TS'` → `0`.
      5. `archetipo execution environment check build --spec US-110` → `passed: true`.
      6. `archetipo execution environment check e2e --spec US-110` → `passed: true`. Se fallisce uno scenario elencato come instabile preesistente nella memoria di progetto, rieseguire la sola spec con `--repeat-each` sulla base `167569a` per distinguere un'instabilità preesistente da una regressione. Non modificare `workers`, `retries` o `fullyParallel`. Un fallimento in `sidebar.spec.ts`, `foglio-attivita-amministratore.spec.ts`, `autorizzazione-ruoli.spec.ts` o `logo-intestazione.spec.ts` è una regressione di questa spec e va corretto nel task che l'ha introdotto.
      7. Leggere `passed`, `stable` e `report_path` di ogni check: l'exit code da solo non basta.
      8. Marcare questo task `DONE` (`archetipo task done US-110 TASK-07` dalla radice del progetto).
      9. Ricaricare la spec con `archetipo spec show US-110` dalla radice del progetto e verificare che **nessun** task sia `TODO`. Solo allora è ammesso `archetipo spec review US-110`.

      ## Verify
      - Run: `archetipo execution environment check unit --spec US-110`
      - Expect: `passed: true`; almeno 85 + 2 file di test (aggiunti `navigazione-amministrazione.test.ts` e `layout-front-office.test.ts`), tutti verdi.
      - Run: `archetipo execution environment check lint --spec US-110`
      - Expect: `passed: true`; solo gli avvisi `⚠️ chiave riservata non risolvibile staticamente` di baseline.
      - Run: `archetipo execution environment check build --spec US-110`
      - Expect: `passed: true`.
      - Run: `archetipo execution environment check e2e --spec US-110`
      - Expect: `passed: true`.
      - Run: `archetipo spec show US-110`
      - Expect: tutti i task da TASK-01 a TASK-07 in stato `DONE`.

      ## Done
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — i test unitari introdotti in TASK-02, TASK-04 e TASK-06 sono verdi nel check `unit`
      - [ ] AC-7 — check `unit`, `lint`, `build` ed `e2e` superati con evidenza in `docs/test-results/` per US-110; nessun errore TypeScript fuori da `.next/`
      - [ ] Spec ricaricata dopo il `DONE` del gate: nessun task `TODO` prima di `archetipo spec review US-110`

      ## Blockers
      None.
    ref: TASK-07
