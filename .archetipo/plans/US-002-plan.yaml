schema: archetipo/plan/v2
spec_code: US-002
body: "# US-002: Database PostgreSQL con Prisma, migrazioni e seed — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team  \n**Data:** 2026-06-11\n\n---\n\n## Spec\n\n**Epic:** EP-000 — Fondazione del Progetto  \n**Priorità:** HIGH | **Punti:** 2\n\n**Storia Utente**  \nCome sviluppatore del progetto Coaching Planner, voglio un database PostgreSQL locale collegato all'applicazione tramite Prisma, con migrazioni versionate e dati di esempio, così da poter evolvere lo schema dati in modo controllato e sviluppare senza dipendere dal database di produzione.\n\n**Criteri di Accettazione**\n- [ ] Lo schema Prisma iniziale è versionato e le migrazioni si applicano con successo su un database locale vuoto\n- [ ] Il comando di seed popola dati di esempio utilizzabili in sviluppo\n- [ ] La connessione usa una DATABASE_URL configurata via variabili d'ambiente, distinta tra locale e produzione\n- [ ] I tipi monetari nello schema usano Decimal, mai float\n\n---\n\n## Soluzione Tecnica\n\nLa spec introduce il livello dati PostgreSQL/Prisma sopra lo scaffold prodotto da US-001, mantenendo l'ambiente locale indipendente dalla produzione e versionando ogni evoluzione tramite migrazioni Prisma. La soluzione deve essere applicata dopo l'integrazione dello scaffold Next.js, perché riusa `package.json`, `.env.example`, `src/lib/` e la struttura di test predisposta dalla spec precedente.\n\n- Configurare Prisma 6.x con provider `postgresql`, client generato e script npm dedicati (`db:migrate`, `db:deploy`, `db:seed`, `db:studio`), più un `docker-compose.yml` per un Postgres locale ripetibile.\n- Definire uno schema iniziale coerente con il PRD: utenti con ruolo, collaboratori, clienti, offerte, attività, trasferte/scaglioni km e relazioni necessarie ai futuri consuntivi. Tutti i campi monetari e tariffari devono usare `Decimal`/`@db.Decimal`, mai `Float`.\n- Versionare la prima migrazione Prisma e garantire che `prisma migrate dev` parta da database vuoto senza passaggi manuali.\n- Implementare `prisma/seed.ts` con dati realistici di sviluppo: un amministratore, almeno un collaboratore, clienti, offerte con tariffe, scaglioni chilometrici e alcune attività dimostrative.\n- Aggiornare la gestione ambiente: `.env.example` con `DATABASE_URL` locale, indicazioni per `.env.local` non committato e note README per distinguere locale, test e produzione.\n- Aggiungere `src/lib/db.ts` come singleton Prisma Client riusabile da route/server action future, evitando istanze multiple in sviluppo con hot reload.\n\n**Assunzioni operative**\n- US-001 è già pianificata ed è attualmente in lavorazione: l'implementazione di US-002 deve partire solo quando lo scaffold è disponibile nel ramo principale o nel worktree di sviluppo previsto.\n- La connettività al database SiteGround di produzione resta fuori scope di questa spec; qui si predispone solo la variabile `DATABASE_URL` e il flusso `prisma migrate deploy`.\n\n---\n\n## Strategia di Test\n\nLa verifica combina controlli automatici sulla modellazione Prisma, test di integrazione sul database locale e una prova applicativa minima della connessione tramite il client condiviso.\n\n- Eseguire `prisma validate` e `prisma migrate dev` su un database locale vuoto per provare schema e migrazioni versionate.\n- Eseguire `npm run db:seed` e verificare che i record di esempio coprano collaboratore, cliente, offerta, tariffa Decimal, attività e scaglione km.\n- Aggiungere test Vitest/integration per importare `src/lib/db.ts`, interrogare un dato seedato e confermare che i campi monetari siano modellati come Decimal lato Prisma.\n- Mantenere `npm run lint` e `npm run build` verdi dopo l'aggiunta di Prisma, seed e configurazioni.\n\n### Test E2E — Simulazione Utente\n\nQuesta spec non introduce pagine o flussi utente nuovi, quindi non richiede nuovi scenari Playwright. La dimostrazione è da sviluppatore: avviare Postgres locale, applicare migrazioni, lanciare il seed e verificare dall'applicazione/Prisma Client che la connessione funzioni. Se US-001 ha già introdotto uno scenario e2e di fumo, mantenerlo verde ma non registrare un nuovo video per US-002.\n\n---\n\n_Piano generato via ARchetipo Planning — 2026-06-11_"
tasks:
  - id: TASK-01
    title: Aggiungere dipendenze Prisma e script database
    description: Installare Prisma CLI, @prisma/client e il supporto TypeScript necessario per il seed. Aggiungere gli script npm per validazione schema, migrazioni locali/deploy, seed e Prisma Studio, mantenendo compatibilità con gli script di US-001.
    type: Impl
    status: DONE
    ref: TASK-01
  - id: TASK-02
    title: Configurare PostgreSQL locale e variabili ambiente
    description: Aggiungere docker-compose.yml per un Postgres locale di sviluppo e aggiornare .env.example/README con DATABASE_URL locale, indicazioni per .env.local non versionato e separazione dalla DATABASE_URL di produzione.
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    ref: TASK-02
  - id: TASK-03
    title: Definire lo schema Prisma iniziale del dominio
    description: Creare prisma/schema.prisma con datasource PostgreSQL, generator Prisma Client e modelli iniziali per utenti/ruoli, collaboratori, clienti, offerte, attività, trasferte e scaglioni chilometrici. Usare Decimal/@db.Decimal per ogni tariffa, importo o valore monetario e non introdurre campi Float per denaro.
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    ref: TASK-03
  - id: TASK-04
    title: Versionare la prima migrazione Prisma
    description: Generare e committare la migrazione iniziale partendo da database locale vuoto. Verificare che prisma validate e prisma migrate dev completino con successo senza passaggi manuali.
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    ref: TASK-04
  - id: TASK-05
    title: Implementare il seed di sviluppo
    description: 'Creare prisma/seed.ts con dati realistici: amministratore, collaboratore, clienti, offerte con tariffe Decimal, scaglioni km e attività dimostrative collegate. Collegare il seed allo script npm db:seed o alla configurazione Prisma prevista.'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    ref: TASK-05
  - id: TASK-06
    title: Creare il client Prisma condiviso dell'applicazione
    description: Implementare src/lib/db.ts come singleton Prisma Client adatto a Next.js in sviluppo e produzione, così le future route/server action possano riusare la connessione senza duplicare istanze.
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    ref: TASK-06
  - id: TASK-07
    title: Testare seed e connessione applicativa
    description: Aggiungere test Vitest/integration o script verificabile che usa src/lib/db.ts per interrogare i dati seedati e confermare che la connessione DATABASE_URL funzioni dall'applicazione. Includere un controllo esplicito sui campi monetari Decimal.
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-05
      - TASK-06
    ref: TASK-07
  - id: TASK-08
    title: Validare regressione toolchain e documentazione finale
    description: Eseguire lint, build, validazione Prisma, migrazione su database vuoto e seed. Aggiornare README con i comandi operativi per avviare Postgres locale, migrare, seedare e verificare la connessione.
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    ref: TASK-08
