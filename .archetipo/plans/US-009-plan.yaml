    title: Unit test di DAL e Server Actions collaboratori
    description: 'Vitest con mock di Prisma e sessione: guardia di ruolo su ogni funzione e action; dati invalidi non scrivono a DB e restituiscono la mappa errori; creazione transazionale di utente e profilo con ruolo COLLABORATORE; P2002 → errore sul campo email; aggiornaCollaboratore tiene in sync Utente.nome ed email; cambiaStatoCollaboratore aggiorna solo il flag attivo; elencaCollaboratoriSelezionabili esclude i disattivati.'
