    description: 'Creare src/domain/anagrafiche/valida-collaboratore.ts: nome, cognome, email (formato valido), partita IVA (11 cifre, regola coerente con valida-cliente) e tariffa giornaliera obbligatori; tariffa decimale strettamente positiva, max 2 decimali, parsing con virgola italiana; mappa errori per campo, nessuna dipendenza dal framework (ADR-006), importi Decimal in tutta la catena (ADR-005). Normalizzare nel seed la partitaIva del collaboratore demo (IT12345678901 → 11 cifre).'
    type: Impl
    status: DONE
