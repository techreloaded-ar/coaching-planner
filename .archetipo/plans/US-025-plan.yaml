schema: archetipo/plan/v2
spec_code: US-025
body: "# US-025: Pagina offerte trasversale con stato e avanzamento — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-12\n\n---\n\n## Spec\n\n**Epic:** EP-002 — Anagrafiche e Configurazione\n**Priorità:** HIGH | **Punti:** 3\n\n**Storia Utente**\nCome Stefano, amministratore, voglio una pagina Offerte nel back office che elenchi in un unico posto tutte le offerte di tutti i clienti con il loro stato e l'avanzamento delle giornate, così da avere una visione d'insieme senza dover entrare cliente per cliente.\n\n**Criteri di Accettazione**\n- Una voce Offerte nella navigazione del back office apre una pagina che elenca tutte le offerte di tutti i clienti\n- Per ogni offerta sono mostrati cliente, codice, descrizione, tariffa giornaliera, giorni previsti e stato attiva/non attiva\n- Per ogni offerta sono mostrate giornate erogate e residuo, coerenti con la vista di avanzamento esistente a parità di dati\n- Le offerte non attive e quelle con residuo esaurito o negativo sono evidenziate visivamente\n- Se non esistono offerte la pagina mostra uno stato vuoto chiaro\n\n---\n\n## Soluzione Tecnica\n\nLa pagina riusa il calcolo di avanzamento esistente (`calcolaAvanzamentoOfferte` in `src/domain/consuntivi/index.ts`) così che giornate erogate e residuo siano coerenti con il report \"Avanzamento offerte\" per costruzione, senza duplicare logica di dominio.\n\n- **DAL** — nuova funzione `elencaOfferteConAvanzamento()` in `src/lib/offerte.ts` (accesso `richiediRuoloApi(\"AMMINISTRATORE\")`): carica tutte le offerte con `include: { cliente: true }` e tutte le righe attività con `include: { collaboratore: true }`, invoca `calcolaAvanzamentoOfferte` con lo stesso mapping usato da `reportAvanzamentoOfferte` (`src/lib/report.ts`) e unisce per `offertaId` i campi anagrafici mancanti. Restituisce un tipo serializzabile `VoceElencoOfferta` con: `offertaId`, `codice`, `descrizione`, `clienteId`, `clienteRagioneSociale`, `tariffaGiornaliera` (stringa da `Decimal.toString()`), `giorniPrevisti`, `attiva`, `giornateErogate`, `residuo`, `stato` (`StatoAvanzamentoOfferta`). Nessun `Decimal` o `Date` grezzo in uscita.\n- **Ordinamento deterministico** (come da mockup): prima le offerte attive critiche (`OLTRE_BUDGET`, `ESAURITA`), poi le altre attive, in coda le non attive; a parità di gruppo, ragione sociale del cliente e poi codice offerta.\n- **Rotta** — nuova pagina `src/app/(back-office)/offerte/page.tsx` (Server Component): `richiediRuolo(\"AMMINISTRATORE\")`, carica i dati e li passa al Client Component. Il prefisso `/offerte` è già incluso in `ROTTE_BACK_OFFICE` (`src/lib/policy-rotte.ts`): nessuna modifica a policy o proxy.\n- **UI** — `src/app/(back-office)/offerte/offerte-tabella.tsx` (Client Component) sul modello di `clienti-tabella.tsx` e dei mockup `docs/mockups/US-025/`: toolbar con ricerca live (cliente, codice, descrizione) e contatore \"N offerte · attive · non attive\", tabella con colonne Offerta (badge codice + descrizione), Cliente, Tariffa giornaliera, Giorni previsti, Erogate, Residuo, Stato; badge \"Attiva\"/\"Non attiva\", residuo esaurito o negativo evidenziato in rosso con flag \"Esaurita\"/\"Oltre budget\" coerenti col report avanzamento; righe non attive attenuate; stato vuoto con card centrata, icona e testo esplicativo.\n- **Navigazione** — in `src/app/(back-office)/console-sidebar.tsx` la voce \"Offerte\" esiste già come disabilitata (\"In arrivo\"): va attivata con `href: \"/offerte\"` rimuovendo il ramo `disabled`.\n\n**Assunzioni**\n- La pagina è in sola lettura: creazione e modifica delle offerte restano nel dettaglio cliente (fuori scope).\n- Lo stato vuoto non è verificabile via e2e perché il database condiviso della suite contiene sempre le offerte seed; è un rendering condizionale banale, coperto dalla revisione del codice.\n\n---\n\n## Strategia di Test\n\nLa coerenza dei numeri è garantita dal riuso della funzione pura di dominio, già coperta da `tests/unit/avanzamento-offerte.test.ts`; i test nuovi si concentrano su join/serializzazione del DAL e sul flusso utente.\n\n- **Unit (Vitest)** — nuova suite per `elencaOfferteConAvanzamento()` con mock di `@/lib/db` e `@/lib/dal` (pattern `tests/unit/offerte-dal-actions.test.ts`): guardia di ruolo, join corretto offerta↔avanzamento, offerta senza attività (erogate 0, residuo = previsti), tariffa serializzata come stringa, flag `attiva` propagato, ordinamento deterministico.\n- **E2E (Playwright)** — nuovi spec con le fixtures di `tests/e2e/support/fixtures.ts` e dati creati via factory (namespaced, nessuna mutazione dei seed), selettori per ruolo/label, `expect` web-first, nessun hard wait, `fullyParallel: true` preservato, contratto di `tests/e2e/README.md` rispettato.\n- Dopo le modifiche e2e eseguire `npm run lint` (include il guardrail anti-flakiness).\n\n### Test E2E — Simulazione Utente\n\n**Framework:** Playwright\n**Demo video:** Sì — la spec descrive un incremento filmabile; la registrazione avviene al gate di accettazione (`archetipo-review` via `archetipo e2e demo`), non durante l'implementazione.\n\n| Scenario | Flusso utente |\n|---|---|\n| Elenco trasversale con avanzamento | L'amministratore accede, apre \"Offerte\" dalla sidebar e vede la riga dell'offerta creata dalla factory con cliente, codice, descrizione, tariffa, giorni previsti, erogate e residuo coerenti con le righe attività registrate |\n| Evidenziazione offerte critiche e non attive | Con un'offerta non attiva e una con giornate esaurite create dalla factory, la pagina mostra la prima attenuata con badge \"Non attiva\" e la seconda con residuo evidenziato e flag \"Esaurita\" |\n| Demo su dati seed | Percorso dimostrativo: login amministratore, click sulla voce Offerte in sidebar, verifica delle offerte seed con coerenza interna residuo = previste − erogate |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-025/`\n\n_Piano generato via ARchetipo Planning — 2026-07-12_"
tasks:
  - id: TASK-01
    title: 'DAL: funzione elencaOfferteConAvanzamento in src/lib/offerte.ts'
    type: Impl
    status: DONE
    body: |-
      ## Descrizione
      **Obiettivo:** esporre al Server Component l'elenco trasversale di tutte le offerte con avanzamento, riusando il dominio esistente.

      **Leggere prima:** `src/lib/offerte.ts`, `src/lib/report.ts` (funzione `reportAvanzamentoOfferte`: mapping offerte/righe da replicare), `src/domain/consuntivi/index.ts` (`calcolaAvanzamentoOfferte`, tipi `OffertaAvanzamento`, `RigaAvanzamento`, `VoceAvanzamentoOfferta`, `StatoAvanzamentoOfferta`).

      **Modificare:** solo `src/lib/offerte.ts` — nessuna modifica al dominio o alle funzioni di report esistenti.

      **Passi:**
      1. Definire ed esportare l'interfaccia `VoceElencoOfferta`: `offertaId`, `codice`, `descrizione`, `clienteId`, `clienteRagioneSociale`, `tariffaGiornaliera: string`, `giorniPrevisti: number`, `attiva: boolean`, `giornateErogate: number`, `residuo: number`, `stato: StatoAvanzamentoOfferta`.
      2. Implementare `elencaOfferteConAvanzamento(): Promise<VoceElencoOfferta[]>`: `await richiediRuoloApi("AMMINISTRATORE")`; `db.offerta.findMany({ include: { cliente: true } })`; `db.rigaAttivita.findMany({ include: { collaboratore: true } })`; mappare gli input come fa `reportAvanzamentoOfferte` e invocare `calcolaAvanzamentoOfferte`; indicizzare `perOfferta` per `offertaId` e comporre ogni voce aggiungendo `attiva` e `tariffaGiornaliera.toString()` dall'offerta Prisma.
      3. Ordinare l'output: gruppo 1 = offerte attive con stato `OLTRE_BUDGET` o `ESAURITA`, gruppo 2 = altre offerte attive, gruppo 3 = offerte non attive; dentro ogni gruppo `localeCompare` su ragione sociale cliente, poi su codice.

      **Blocchi:** nessuno.

      ## File Coinvolti
      - src/lib/offerte.ts — aggiungere tipo `VoceElencoOfferta` e funzione `elencaOfferteConAvanzamento`

      ## Criteri di Completamento
      - [ ] La funzione restituisce una voce per OGNI offerta, anche senza attività (erogate 0, residuo = giorni previsti)
      - [ ] Erogate, residuo e stato provengono da `calcolaAvanzamentoOfferte` (nessun ricalcolo duplicato)
      - [ ] Output interamente serializzabile: tariffa come stringa, nessun `Decimal`/`Date` grezzo
      - [ ] Ordinamento deterministico come specificato (critiche → attive → non attive, poi cliente e codice)
      - [ ] `npm run lint` e `npm run test` passano
    ref: TASK-01
  - id: TASK-02
    title: Test unit della funzione elencaOfferteConAvanzamento
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** coprire con test unitari il join, la serializzazione e l'ordinamento della nuova funzione DAL.

      **Leggere prima:** `tests/unit/offerte-dal-actions.test.ts` (pattern di mock con `vi.hoisted` per `@/lib/db` e `@/lib/dal`), `tests/unit/avanzamento-offerte.test.ts` (già copre la funzione pura: NON duplicarne i casi), la funzione implementata in TASK-01.

      **Modificare:** creare un nuovo file di test; nessuna modifica al codice di produzione.

      **Passi:**
      1. Creare `tests/unit/elenca-offerte-con-avanzamento.test.ts` mockando `db.offerta.findMany`, `db.rigaAttivita.findMany` e `richiediRuoloApi` secondo il pattern esistente.
      2. Casi da coprire: (a) invoca `richiediRuoloApi("AMMINISTRATORE")`; (b) offerta con righe attività fatturabili → erogate/residuo/stato coerenti con `calcolaAvanzamentoOfferte`; (c) offerta senza attività → erogate 0, residuo = giorni previsti, stato `IN_CORSO`; (d) `tariffaGiornaliera` restituita come stringa e `attiva` propagato; (e) ordinamento: offerta esaurita/oltre budget prima delle attive regolari, non attive in coda, tie-break per cliente e codice.
      3. Per il mock della tariffa usare un oggetto con metodo `toString()` (come i `Decimal` Prisma).

      **Verifica:** `npm run test`.

      **Blocchi:** richiede TASK-01 completato.

      ## File Coinvolti
      - tests/unit/elenca-offerte-con-avanzamento.test.ts — nuova suite

      ## Criteri di Completamento
      - [ ] Tutti i casi (a)–(e) presenti e verdi
      - [ ] Nessun accesso a database reale: `@/lib/db` e `@/lib/dal` mockati
      - [ ] `npm run test` passa per l'intera suite
    ref: TASK-02
  - id: TASK-03
    title: 'Pagina /offerte: Server Component e tabella client'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Descrizione
      **Obiettivo:** realizzare la pagina back office `/offerte` che elenca tutte le offerte con stato e avanzamento, fedele ai mockup.

      **Leggere prima:** i mockup in `docs/mockups/US-025/` (index.html, stato-vuoto.html, app.js — ordinamento e varianti visive), `src/app/(back-office)/anagrafiche/clienti/page.tsx` e `clienti-tabella.tsx` (pattern pagina+tabella), `src/app/(back-office)/report/avanzamento-offerte/report-avanzamento-offerte.tsx` (stile badge di stato, formattatore giornate `Intl.NumberFormat it-IT`), `node_modules/next/dist/docs/` per le convenzioni App Router di questa versione di Next.js.

      **Modificare:** creare i due file nuovi; nessuna modifica ad altre pagine.

      **Passi:**
      1. Creare `src/app/(back-office)/offerte/page.tsx` (Server Component): `await richiediRuolo("AMMINISTRATORE")`, chiamare `elencaOfferteConAvanzamento()`, intestazione view con kicker "Anagrafiche", titolo `Offerte` (h1), sottotitolo descrittivo; passare i dati a `OfferteTabella`.
      2. Creare `src/app/(back-office)/offerte/offerte-tabella.tsx` (Client Component, `"use client"`): filtro live su ragione sociale cliente, codice e descrizione; contatore "N offerte · N attive · N non attive"; tabella (`aria-label="Elenco offerte"`) con colonne Offerta (badge codice + descrizione), Cliente, Tariffa giornaliera (€ it-IT, `tabular-nums`), Giorni previsti, Erogate, Residuo, Stato.
      3. Evidenziazioni: badge "Attiva" (emerald) / "Non attiva" (grigio) con riga attenuata per le non attive; residuo ≤ 0 in rosso con flag "Esaurita" (residuo 0 e previsti > 0) o "Oltre budget" (residuo < 0), riusando la palette del report avanzamento.
      4. Stato vuoto quando non esistono offerte: card centrata con icona, titolo e testo esplicativo come nel mockup `stato-vuoto.html`.
      5. Formattare le giornate con al massimo un decimale (stile `formattaGiornate` del report avanzamento).

      **Verifica:** `npm run lint`; avvio locale e controllo visivo di `/offerte` con dati seed.

      **Blocchi:** richiede TASK-01 completato.

      ## File Coinvolti
      - src/app/(back-office)/offerte/page.tsx — nuova pagina Server Component
      - src/app/(back-office)/offerte/offerte-tabella.tsx — nuovo Client Component tabella

      ## Criteri di Completamento
      - [ ] `/offerte` accessibile solo all'amministratore e renderizzata dentro la console back office
      - [ ] Ogni riga mostra cliente, codice, descrizione, tariffa giornaliera, giorni previsti, erogate, residuo e stato attiva/non attiva
      - [ ] Offerte non attive attenuate con badge dedicato; residuo esaurito o negativo evidenziato in rosso con flag
      - [ ] Stato vuoto presente quando l'elenco è vuoto
      - [ ] `npm run lint` passa
    ref: TASK-03
  - id: TASK-04
    title: 'Sidebar: attivare la voce Offerte verso /offerte'
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Descrizione
      **Obiettivo:** rendere raggiungibile la nuova pagina dalla navigazione del back office.

      **Leggere prima:** `src/app/(back-office)/console-sidebar.tsx` (array `NAV_ITEMS`: la voce "Offerte" esiste già come `{ label: "Offerte", icon: IconOfferte, disabled: true }`).

      **Modificare:** solo `src/app/(back-office)/console-sidebar.tsx`.

      **Passi:**
      1. Sostituire la voce disabilitata con `{ href: "/offerte", label: "Offerte", icon: IconOfferte }`, mantenendo la posizione tra Clienti e Collaboratori.
      2. Se dopo la modifica nessuna voce usa più il ramo `disabled`, rimuovere il ramo di rendering dei bottoni disabilitati e il badge "In arrivo" per non lasciare codice morto (verificare prima che nessun'altra voce sia `disabled`).
      3. Verificare che l'evidenziazione della voce attiva (`pathname.startsWith`) funzioni su `/offerte` senza collidere con altre rotte.

      **Verifica:** `npm run lint`; controllo visivo che la voce apra `/offerte` e risulti evidenziata.

      **Blocchi:** richiede TASK-03 completato (la pagina deve esistere).

      ## File Coinvolti
      - src/app/(back-office)/console-sidebar.tsx — attivazione voce Offerte

      ## Criteri di Completamento
      - [ ] La voce "Offerte" è un link attivo a `/offerte` nella stessa posizione attuale
      - [ ] Lo stato attivo della voce si accende quando si è su `/offerte`
      - [ ] Nessun ramo `disabled` morto residuo se non più usato
      - [ ] `npm run lint` passa
    ref: TASK-04
  - id: TASK-05
    title: Test e2e Playwright della pagina Offerte con dati factory
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** verificare end-to-end elenco, valori di avanzamento ed evidenziazioni usando dati isolati creati dalla factory.

      **Leggere prima:** `tests/e2e/README.md` (contratto completo), `tests/e2e/support/fixtures.ts` e `tests/e2e/support/factory.ts` (`createClienteConOfferta`, `createOfferta`, `createRigaAttivita`), `tests/e2e/support/auth.ts` (login amministratore), `tests/e2e/anagrafica-offerte.spec.ts` come esempio di spec che usa le fixtures.

      **Modificare:** creare un nuovo file di test; nessuna modifica al codice di produzione.

      **Passi:**
      1. Creare `tests/e2e/offerte-trasversali.spec.ts` usando `test` da `support/fixtures.ts` (mai i seed: niente Giulia Conti, TechSolutions, DataFlow).
      2. Scenario 1 — elenco con avanzamento: factory crea cliente+offerta (es. 10 giorni previsti) e righe attività fatturabili (es. 16h = 2 gg); login amministratore, click sulla voce di navigazione "Offerte" (ruolo link, nome esatto), attesa web-first della pagina; individuare la riga per codice offerta (derivato dalla factory) e verificare cliente, descrizione, tariffa, giorni previsti, erogate "2", residuo "8".
      3. Scenario 2 — evidenziazioni: factory crea un'offerta con `attiva: false` e un'offerta con righe attività pari ai giorni previsti (residuo 0); verificare che la prima esponga il badge "Non attiva" e la seconda il flag "Esaurita", usando selettori per ruolo/testo esatto o `data-testid` minimi aggiunti in TASK-03 se necessario.
      4. Rispettare le regole anti-flakiness: nessun hard wait, nessun selettore su classi Tailwind, nessun `selectOption({ index })`, `fullyParallel` invariato.

      **Verifica:** `npx playwright test tests/e2e/offerte-trasversali.spec.ts` e poi `npm run lint` (guardrail anti-flakiness).

      **Blocchi:** richiede TASK-03 e TASK-04 completati.

      ## File Coinvolti
      - tests/e2e/offerte-trasversali.spec.ts — nuovo spec e2e
      - src/app/(back-office)/offerte/offerte-tabella.tsx — solo se servono `data-testid` minimi per residuo/badge

      ## Criteri di Completamento
      - [ ] Entrambi gli scenari verdi con dati esclusivamente creati dalla factory (namespaced)
      - [ ] Navigazione via click sulla voce sidebar, non solo via URL diretto
      - [ ] Nessuna violazione del guardrail: `npm run lint` passa
      - [ ] La suite e2e completa resta verde in parallelo
    ref: TASK-05
  - id: TASK-06
    title: Demo spec e2e su dati seed per la review
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Descrizione
      **Obiettivo:** fornire lo scenario dimostrativo filmabile che `archetipo-review` userà per registrare la demo al gate di accettazione.

      **Leggere prima:** `tests/e2e/demo__avanzamento-offerte.spec.ts` (pattern demo: navigazione da sidebar, valori derivati dal seed, verifiche di coerenza interna per le entità toccate da altri scenari), `prisma/seed.ts` (offerte e attività seed disponibili).

      **Modificare:** creare un nuovo file di test; nessuna modifica al codice di produzione.

      **Passi:**
      1. Creare `tests/e2e/demo__offerte-trasversali.spec.ts`: login amministratore, click sulla voce "Offerte" in sidebar, verifica del titolo pagina.
      2. Verificare la presenza delle offerte seed nell'elenco con i loro cliente/codice; per le offerte che ricevono attività da altri scenari e2e (es. DataFlow) usare verifiche di coerenza interna (residuo = previste − erogate) invece di cifre fisse, come già fa `demo__avanzamento-offerte.spec.ts`; cifre fisse solo per offerte non toccate da altri scenari.
      3. Documentare nel commento di testa i valori attesi derivati dal seed e il motivo delle verifiche di coerenza, seguendo lo stile dei demo spec esistenti.
      4. Il video NON va registrato qui: la registrazione è a cura di `archetipo-review` via `archetipo e2e demo`.

      **Verifica:** `npx playwright test tests/e2e/demo__offerte-trasversali.spec.ts` e `npm run lint`.

      **Blocchi:** richiede TASK-04 completato.

      ## File Coinvolti
      - tests/e2e/demo__offerte-trasversali.spec.ts — nuovo demo spec

      ## Criteri di Completamento
      - [ ] Il demo spec attraversa il flusso utente completo dalla sidebar all'elenco offerte
      - [ ] Nessuna asserzione fragile su entità seed mutate da altri scenari (coerenza interna al posto di cifre fisse)
      - [ ] Spec verde anche nell'esecuzione parallela dell'intera suite
      - [ ] `npm run lint` passa
    ref: TASK-06
