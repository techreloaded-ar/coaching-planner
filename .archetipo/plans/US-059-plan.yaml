    body: |-
      ## Objective
      I quattro comportamenti osservabili della storia sono provati su Docker e PostgreSQL reali: recupero da database e2e sporco, database di sviluppo invariato dopo un run completo, rifiuto quando i due database coincidono, rifiuto immediato quando l'istanza non risponde.

      ## Read
      - `docker-compose.yml` — nome container (`coaching-planner-db`), utente `user`, database `coaching_planner`.
      - `.env.example` — valori di esempio `postgresql://user:password@localhost:5432/coaching_planner` e `.../coaching_planner_e2e`, da usare **come valori inline** negli scenari (non leggere né modificare `.env`, `.env.local` o altri file `.env*` reali).
      - `tests/e2e/global-setup.ts` — sequenza prodotta da TASK-04, per riconoscere nei log il punto in cui ogni scenario si ferma o prosegue.

      ## Change
      - Nessuna modifica al codice. Il task produce **evidenza eseguita**: i comandi vanno lanciati e i loro esiti riportati testualmente nella nota di completamento del task (trascrizione dei messaggi chiave).

      Non-goal: non creare file di test nuovi; non usare `docker compose down -v` (cancellerebbe il volume di sviluppo); non modificare il workflow CI; non lasciare la riga sentinella nel database di sviluppo a fine task.

      ## Steps
      1. **Preparazione comune.** Assicurarsi che il container sia su: `docker compose up -d` e attendere `healthy`. Salvare lo snapshot dei conteggi del database di sviluppo:
         ```bash
         docker exec coaching-planner-db psql -U user -d coaching_planner -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname;" > /tmp/us059-dev-prima.txt
         docker exec coaching-planner-db psql -U user -d coaching_planner -c "INSERT INTO \"Cliente\" (id, \"ragioneSociale\", attivo, \"createdAt\", \"updatedAt\") VALUES ('us059-sentinella', 'US-059 Sentinella Dev', true, now(), now());"
         ```
      2. **Scenario AC-2 (database e2e sporco).** Sporcare il database e2e simulando un run interrotto e lanciare la suite **completa**:
         ```bash
         docker exec coaching-planner-db psql -U user -d coaching_planner_e2e -c "INSERT INTO \"Cliente\" (id, \"ragioneSociale\", attivo, \"createdAt\", \"updatedAt\") VALUES ('us059-residuo', 'Residuo Run Interrotto', true, now(), now());"
         npx playwright test --retries=0 --reporter=line
         ```
         Attendere l'esito senza alcun intervento manuale. Annotare: la suite è verde e il log di `globalSetup` mostra ripristino → migrazioni → seed.
      3. **Scenario AC-3 (database di sviluppo invariato).** Subito dopo il run del punto 2:
         ```bash
         docker exec coaching-planner-db psql -U user -d coaching_planner -c "SELECT id, \"ragioneSociale\" FROM \"Cliente\" WHERE id = 'us059-sentinella';"
         docker exec coaching-planner-db psql -U user -d coaching_planner -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname;" > /tmp/us059-dev-dopo.txt
         diff /tmp/us059-dev-prima.txt /tmp/us059-dev-dopo.txt
         ```
         La sentinella deve essere ancora presente; il `diff` deve mostrare solo la riga `Cliente` incrementata di uno rispetto allo snapshot iniziale (la sentinella inserita al punto 1), e nessun'altra differenza.
      4. **Scenario AC-4 (database coincidente).** Con la sentinella ancora presente:
         ```bash
         E2E_DATABASE_URL="postgresql://user:password@localhost:5432/coaching_planner" \
           npx playwright test tests/e2e/home-page.spec.ts --retries=0 --reporter=line; echo "EXIT=$?"
         ```
         Verificare: uscita diversa da 0; messaggio che nomina `coaching_planner` e il rimedio; **nessun** avvio del web server (nel log non compare l'output di `npm run dev`); rieseguire le query del punto 3 e verificare che sentinella e conteggi del database di sviluppo siano ancora invariati.
      5. **Scenario AC-1 su volume già inizializzato.** Cancellare il database e2e e verificare che la suite lo ricrei da sola:
         ```bash
         docker exec coaching-planner-db psql -U user -d postgres -c "DROP DATABASE IF EXISTS coaching_planner_e2e;"
         npx playwright test tests/e2e/home-page.spec.ts --retries=0 --reporter=line
         docker exec coaching-planner-db psql -U user -d postgres -lqt | cut -d '|' -f1
         ```
         Il run deve essere verde e l'elenco deve contenere di nuovo `coaching_planner_e2e`.
      6. **Scenario AC-5 (istanza non raggiungibile).**
         ```bash
         docker stop coaching-planner-db
         npx playwright test tests/e2e/home-page.spec.ts --retries=0 --reporter=line; echo "EXIT=$?"
         docker start coaching-planner-db
         ```
         Verificare che il fallimento sia immediato (prima dei test) e che il messaggio contenga `localhost`, `5432` e la stringa esatta `docker compose up -d`. **Non** usare `docker compose down -v`: il volume deve restare.
      7. **Pulizia.** Rimuovere la sentinella dal database di sviluppo e i file temporanei:
         ```bash
         docker exec coaching-planner-db psql -U user -d coaching_planner -c "DELETE FROM \"Cliente\" WHERE id = 'us059-sentinella';"
         rm -f /tmp/us059-dev-prima.txt /tmp/us059-dev-dopo.txt
         ```

      ## Verify
      - Run: i comandi degli Steps 1-7, nell'ordine indicato, dalla radice del repository con il container `coaching-planner-db` avviato.
      - Expect: scenario 2 verde senza intervento manuale (suite completa); scenario 3 con sentinella presente e `diff` limitato alla sola riga della sentinella; scenari 4 e 6 con uscita diversa da 0, messaggio atteso e database di sviluppo intatto; scenario 5 verde con database e2e ricreato.
      - Run (controllo di chiusura): `docker ps --filter name=coaching-planner-db --format '{{.Status}}'`
      - Expect: container di nuovo `Up ... (healthy)` dopo lo scenario 6.

      ## Done
      - [ ] AC-2 — trascritto l'esito del run completo su database e2e sporco: suite verde, nessun intervento manuale, ripristino visibile nel log.
      - [ ] AC-3 — trascritti sentinella presente e `diff` dei conteggi del database di sviluppo limitato alla sentinella inserita nel passo 1.
      - [ ] AC-1 — trascritto il run che ricrea da solo `coaching_planner_e2e` dopo il `DROP DATABASE`.
      - [ ] AC-4 — trascritti messaggio di rifiuto, exit code diverso da 0, assenza di avvio del web server e database di sviluppo invariato dopo il tentativo.
      - [ ] AC-5 — trascritti fallimento immediato a container fermo e messaggio contenente `docker compose up -d`.
      - [ ] Sentinella rimossa e container di sviluppo di nuovo `healthy`.

      ## Blockers
      None.
