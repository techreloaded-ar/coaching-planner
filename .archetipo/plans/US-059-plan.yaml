  - id: TASK-02
    title: Seam di sicurezza e preparazione del database e2e in e2e-database-safety.ts
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `tests/e2e/e2e-database-safety.ts` espone le funzioni che identificano il database, rifiutano la coincidenza con il database applicativo, traducono l'irraggiungibilità in un messaggio azionabile, garantiscono l'esistenza del database e2e, ne ripristinano lo schema pulito e costruiscono l'ambiente dei processi figli.

      ## Read
      - `tests/e2e/e2e-database-safety.ts` — intero file: `withDatabaseClient`, `listApplicationTables`, `requireE2eDatabaseUrl`, `assertE2eDatabaseHasNoApplicationData`, `clearE2eApplicationData`, convenzioni di quoting e stile.
      - `tests/e2e/global-setup.ts` — come sono costruiti oggi `e2eEnvironment` e le chiamate `execSync` (l'ambiente va estratto qui, il cablaggio avviene in TASK-04).
      - `tests/e2e/support/prisma.ts` — regola «il layer e2e legge solo `E2E_DATABASE_URL`», da non violare.

      ## Change
      - `tests/e2e/e2e-database-safety.ts`: aggiungere i tipi e le funzioni esportate elencate negli Steps; rimuovere `assertE2eDatabaseHasNoApplicationData`; mantenere invariate `requireE2eDatabaseUrl` e `clearE2eApplicationData`.

      Non-goal: non modificare `global-setup.ts`, `global-teardown.ts` o `playwright.config.ts` (è TASK-04); non introdurre nuove dipendenze npm (`pg` è già in `devDependencies`); non aggiungere fallback su `DATABASE_URL` per la connessione dati e2e.

      ## Steps
      1. Aggiungere il tipo e la normalizzazione dell'identità:
         ```ts
         export type IdentitaDatabase = {
           host: string;
           porta: number;
           nomeDatabase: string;
         };

         const HOST_LOCALI_EQUIVALENTI = new Set(["localhost", "127.0.0.1", "::1", "[::1]"]);

         export function descriviIdentitaDatabase(stringaConnessione: string): IdentitaDatabase {
           let url: URL;
           try {
             url = new URL(stringaConnessione);
           } catch {
             throw new Error(
               `Stringa di connessione PostgreSQL non valida: impossibile interpretare "${stringaConnessione}".`,
             );
           }
           const hostGrezzo = url.hostname.toLowerCase();
           return {
             host: HOST_LOCALI_EQUIVALENTI.has(hostGrezzo) ? "localhost" : hostGrezzo,
             porta: url.port ? Number(url.port) : 5432,
             nomeDatabase: decodeURIComponent(url.pathname.replace(/^\//, "")),
           };
         }
         ```
      2. Aggiungere il confronto e la guardia (funzioni **sintattiche**, nessuna connessione):
         ```ts
         export function sonoLoStessoDatabase(prima: string, seconda: string): boolean { ... }

         export function assertDatabaseE2eDistintoDaDatabaseApplicativo(
           urlDatabaseE2e: string,
           urlDatabaseApplicativo: string | undefined,
         ): void
         ```
         `sonoLoStessoDatabase` confronta host, porta e `nomeDatabase` delle due identità. La guardia non fa nulla se `urlDatabaseApplicativo` è assente o vuoto; altrimenti, se coincidono, lancia un `Error` il cui messaggio contiene: la frase «coincide con il database di sviluppo», `host:porta/nomeDatabase`, i nomi delle due variabili `E2E_DATABASE_URL` e `DATABASE_URL`, e il rimedio «configura un database dedicato, per esempio `coaching_planner_e2e`». Nessuna password deve comparire nel messaggio (usare solo i campi dell'identità, mai la stringa completa).
      3. Aggiungere la mappatura degli errori di rete:
         ```ts
         const CODICI_ERRORE_CONNESSIONE = new Set([
           "ECONNREFUSED", "ENOTFOUND", "EHOSTUNREACH", "ETIMEDOUT", "EAI_AGAIN",
         ]);

         export function messaggioDatabaseNonRaggiungibile(
           errore: unknown,
           stringaConnessione: string,
         ): string | null
         ```
         Restituisce `null` quando l'errore non ha un `code` fra quelli elencati. Altrimenti restituisce un messaggio che contiene `host:porta`, la constatazione che il database locale non risponde e la stringa esatta `docker compose up -d`.
      4. Aggiungere `garantisciDatabaseE2eEsistente(stringaConnessione: string): Promise<void>`:
         - prova `new pg.Client({ connectionString }).connect()` e chiude subito;
         - se l'errore ha `code === "3D000"` (database inesistente), calcola l'URL di manutenzione (`new URL(stringaConnessione)` con `pathname = "/postgres"`), si connette lì ed esegue `CREATE DATABASE "<nomeDatabase>"` usando `quoteIdentifier`; se il `CREATE` fallisce con `42P04` (già esistente, corsa fra processi) prosegue senza errore;
         - se `messaggioDatabaseNonRaggiungibile(...)` restituisce un messaggio, lancia `new Error(messaggio, { cause: errore })`;
         - qualunque altro errore viene rilanciato invariato.
      5. Aggiungere `ripristinaSchemaPulitoDatabaseE2e(stringaConnessione: string): Promise<void>` che, dentro `withDatabaseClient`, esegue nell'ordine `DROP SCHEMA IF EXISTS public CASCADE` e `CREATE SCHEMA public`. Documentare con un commento che è l'operazione distruttiva della preparazione e che deve essere sempre preceduta dalla guardia d'identità. Se la connessione fallisce, tradurre l'errore con `messaggioDatabaseNonRaggiungibile` come al punto 4.
      6. Aggiungere `costruisciAmbienteE2e(ambiente: NodeJS.ProcessEnv, urlDatabaseE2e: string): NodeJS.ProcessEnv` che restituisce `{ ...ambiente, DATABASE_URL: urlDatabaseE2e, E2E_DATABASE_URL: urlDatabaseE2e, E2E_TEST_MODE: "true" }`, con commento sul perché `DATABASE_URL` va **sovrascritto** e non ereditato.
      7. Rimuovere `assertE2eDatabaseHasNoApplicationData` e, se `listApplicationTables` resta usata solo da `clearE2eApplicationData`, lasciarla dov'è senza modifiche. Verificare con `grep -rn "assertE2eDatabaseHasNoApplicationData" .` che non restino riferimenti fuori da `global-setup.ts` (che sarà aggiornato in TASK-04) e dalla documentazione (TASK-06).

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0, nessuna diagnostica (baseline: zero).
      - Run: `npx eslint tests/e2e/e2e-database-safety.ts`
      - Expect: nessun errore e nessun warning su questo file (nessun import o simbolo non usato dopo la rimozione).
      - Run: `grep -rn "assertE2eDatabaseHasNoApplicationData" tests src scripts`
      - Expect: unico riferimento residuo in `tests/e2e/global-setup.ts`, che TASK-04 sostituisce.

      ## Done
      - [ ] AC-4 — `assertDatabaseE2eDistintoDaDatabaseApplicativo` esiste, non apre connessioni e lancia un errore che nomina il database coincidente e il rimedio.
      - [ ] AC-5 — `messaggioDatabaseNonRaggiungibile` produce un messaggio contenente `docker compose up -d` per i codici di rete e `null` per gli altri errori.
      - [ ] AC-2 — `ripristinaSchemaPulitoDatabaseE2e` esegue `DROP SCHEMA IF EXISTS public CASCADE` seguito da `CREATE SCHEMA public`.
      - [ ] AC-1 — `garantisciDatabaseE2eEsistente` crea il database quando Postgres risponde `3D000`.
      - [ ] AC-3 — `costruisciAmbienteE2e` restituisce sempre `DATABASE_URL` pari all'URL e2e.
      - [ ] Nessuna password compare nei messaggi d'errore; type-check e lint del file puliti.

      ## Blockers
      None.
    ref: TASK-02
