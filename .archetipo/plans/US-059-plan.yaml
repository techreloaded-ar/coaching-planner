  - id: TASK-08
    title: Nuova decisione Wiki decisions/reset-database-e2e-dedicato
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      La Wiki registra come decisione architetturale il reset distruttivo per costruzione del database e2e dedicato, subordinato alla guardia d'identità verso il database applicativo, con alternative scartate e verifica.

      ## Read
      - `docs/wiki/decisions/postgres-siteground.md` — struttura di riferimento di una pagina `type: decision`: frontmatter (`type`, `title`, `description`, `status`, `decision_status`, `sources`) e i marcatori di sezione `<!-- archetipo:wiki section=context|decision|alternatives|consequences|verification -->`.
      - Il piano di questa spec, sezione «Decisioni Architetturali», da cui derivano contesto, opzione scelta, alternative e conseguenze.
      - Il codice consegnato: `tests/e2e/e2e-database-safety.ts`, `tests/e2e/global-setup.ts`, `playwright.config.ts`, `docker/postgres/initdb/01-crea-database-e2e.sh`, `tests/unit/e2e-database-safety.test.ts`.

      ## Change
      - Nuovo file `docs/wiki/decisions/reset-database-e2e-dedicato.md` (ID canonico della pagina: `decisions/reset-database-e2e-dedicato`).
      - `docs/wiki/index.md` rigenerato dal comando di catalogo.

      Non-goal: non impostare `status: reviewed` né compilare il blocco `review` (l'approvazione avviene in accettazione); non marcare altre decisioni come `superseded` — nessuna decisione esistente riguarda il ciclo di vita del database e2e (verificato in planning con `archetipo wiki search --type decision`, 14 pagine, nessuna in tema).

      ## Steps
      1. Creare la pagina con frontmatter: `type: decision`, `title: Reset per costruzione del database e2e dedicato`, `description` di una riga, `status: generated`, `decision_status: accepted`, e `sources` con: `tests/e2e/e2e-database-safety.ts` (`role: implementation`, symbol `assertDatabaseE2eDistintoDaDatabaseApplicativo, ripristinaSchemaPulitoDatabaseE2e, garantisciDatabaseE2eEsistente`), `tests/e2e/global-setup.ts` (`role: implementation`), `playwright.config.ts` (`role: implementation`), `docker/postgres/initdb/01-crea-database-e2e.sh` (`role: local-infrastructure`), `tests/unit/e2e-database-safety.test.ts` (`role: verification`).
      2. Sezione `context`: la preparazione e2e assertiva richiedeva un database vuoto e la sua creazione manuale; un run interrotto lasciava residui che bloccavano i run successivi; il vero rischio da presidiare non è il database sporco ma il database **sbagliato**, perché la preparazione esegue seed distruttivi.
      3. Sezione `decision`: a ogni run la suite azzera per costruzione il database indicato da `E2E_DATABASE_URL` (`DROP SCHEMA public CASCADE` + `CREATE SCHEMA public`, poi migrazioni e seed), creandolo se assente; l'operazione è ammessa **solo** dopo una guardia sintattica che rifiuta host/porta/nome coincidenti con `DATABASE_URL`, valutata sia nella configurazione Playwright sia nel global setup.
      4. Sezione `alternatives`: (a) mantenere il controllo di database vuoto; (b) `TRUNCATE` delle sole tabelle applicative; (c) database effimero per run; (d) secondo container Postgres dedicato. Per ciascuna, il motivo dello scarto come nel piano — inclusa l'esclusione esplicita di (d) dal perimetro della spec.
      5. Sezione `consequences`: ogni run paga le migrazioni da zero; nessun test può dipendere da dati residui del run precedente; l'utente di connessione deve poter fare `DROP SCHEMA public` (vero in locale e in CI); una connessione esterna aperta sul database e2e può mettere il reset in attesa di lock; la CI resta invariata e il suo passo di creazione diventa ridondante ma innocuo.
      6. Sezione `verification`: unit test del seam (`tests/unit/e2e-database-safety.test.ts`), scenari di integrazione su PostgreSQL reale (database sporco, database di sviluppo invariato, rifiuto su coincidenza, rifiuto su istanza spenta) e suite Playwright completa verde con `fullyParallel: true`.
      7. Aggiungere la sezione «Concetti correlati» con il collegamento a `/operations/development.md`, e da `operations/development` verificare che il rimando alla decisione (aggiunto in TASK-07) risolva.
      8. Eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner catalog`.

      ## Verify
      - Run: `archetipo wiki validate --profile bootstrap`
      - Expect: `data.ok: true`, nessun finding, numero di pagine 28 (baseline: 27).
      - Run: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner search reset-database-e2e-dedicato`
      - Expect: la pagina è trovata con `type: decision`, `decision_status: accepted`, `status: generated`.
      - Run: `grep -n "archetipo:wiki section=" docs/wiki/decisions/reset-database-e2e-dedicato.md`
      - Expect: i cinque marcatori `context`, `decision`, `alternatives`, `consequences`, `verification`.

      ## Done
      - [ ] AC-2 e AC-4 — la decisione documenta il reset per costruzione e la guardia che lo rende sicuro, con le alternative scartate.
      - [ ] La pagina esiste con ID `decisions/reset-database-e2e-dedicato`, tutti i marcatori di sezione e le `sources` elencate.
      - [ ] `docs/wiki/index.md` elenca la nuova decisione dopo il catalogo.
      - [ ] `archetipo wiki validate --profile bootstrap` a `ok: true` con 28 pagine.

      ## Blockers
      None.
