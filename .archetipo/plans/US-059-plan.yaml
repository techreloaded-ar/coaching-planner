  - id: TASK-06
    title: Documentazione operativa del nuovo contratto di preparazione e2e
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      `README.md`, `.env.example` e `tests/e2e/README.md` descrivono il contratto reale: il database e2e nasce con il container, la suite lo riporta allo stato pulito da sola e rifiuta esplicitamente il database applicativo e l'istanza spenta.

      ## Read
      - `README.md` — sezioni «Avvio Rapido», «Variabili d'Ambiente», «Test end-to-end e database dedicato», «Database → Avvio locale».
      - `.env.example` — blocco di commento sopra `E2E_DATABASE_URL` («richiede un database separato, vuoto nelle tabelle applicative»).
      - `tests/e2e/README.md` — sezione «Setup, seed e teardown», che cita `global-setup.ts` e la verifica di database vuoto.

      ## Change
      - `README.md`, `.env.example`, `tests/e2e/README.md`: solo prosa di documentazione.

      Non-goal: non toccare i file `.env`, `.env.local` o altri `.env*` reali; non modificare le altre sezioni di `tests/e2e/README.md` (mesi riservati, scaglioni km, selettori, gate locale); non documentare comportamenti non implementati.

      ## Steps
      1. `README.md`, sezione «Test end-to-end e database dedicato»: sostituire il requisito «database dedicato e **vuoto** nelle tabelle applicative» con la sequenza reale — la suite verifica che `E2E_DATABASE_URL` non coincida con `DATABASE_URL`, crea il database se manca, ne ripristina lo stato pulito, applica migrazioni e seed, e ripulisce al teardown. Aggiungere i due messaggi di rifiuto attesi (database coincidente; istanza non raggiungibile con il rimedio `docker compose up -d`).
      2. `README.md`, sezione «Database → Avvio locale»: spiegare che il container crea automaticamente sia `coaching_planner` sia `coaching_planner_e2e` alla **prima** inizializzazione del volume, e che su un volume già esistente il database e2e viene comunque creato al primo `npm run test:e2e`; `docker compose down -v` resta il reset totale, con l'avvertenza che cancella anche i dati di sviluppo.
      3. `README.md`, «Avvio Rapido»: nessun passo manuale di creazione del database e2e va aggiunto; se il testo lasciasse intendere una preparazione manuale, correggerlo.
      4. `.env.example`: riscrivere il commento sopra `E2E_DATABASE_URL` — deve puntare a un database **dedicato e diverso** da `DATABASE_URL`; non serve che sia vuoto, perché la suite lo azzera; se il database non esiste viene creato. Lasciare invariato il valore di esempio.
      5. `tests/e2e/README.md`, sezione «Setup, seed e teardown»: aggiornare il primo punto elenco (oggi «verifica che `E2E_DATABASE_URL` punti a un database e2e dedicato e vuoto, applica le migrazioni e carica il seed») con la nuova sequenza, e aggiungere una riga sul fatto che ogni run parte da uno schema ricreato, quindi nessun test può contare su dati residui del run precedente. Mantenere invariati i punti su seed read-only, teardown e assenza di cleanup concorrente.
      6. Rileggere i tre file per coerenza: non deve restare alcuna frase che chieda allo sviluppatore di svuotare o creare a mano il database e2e.

      ## Verify
      - Run: `grep -rn "vuoto" README.md .env.example tests/e2e/README.md`
      - Expect: nessuna occorrenza che presenti un database e2e vuoto come **precondizione** a carico dello sviluppatore.
      - Run: `grep -rn "docker compose up -d" README.md tests/e2e/README.md`
      - Expect: il comando compare come rimedio documentato all'istanza non raggiungibile.
      - Run: `npm run lint`
      - Expect: exit 0, solo il warning pre-esistente (i file toccati sono markdown, il lint non cambia esito).

      ## Done
      - [ ] AC-1 — la documentazione afferma che il container crea automaticamente il database e2e e descrive il caso del volume già esistente.
      - [ ] AC-2 — la documentazione afferma che la suite riporta da sola il database e2e allo stato pulito, senza intervento manuale.
      - [ ] AC-4 e AC-5 — i due messaggi di rifiuto e il rimedio `docker compose up -d` sono documentati.
      - [ ] Nessun file `.env*` reale è stato letto o modificato.

      ## Blockers
      None.
