schema: archetipo/plan/v2
spec_code: US-059
body: |-
  # US-059: Suite e2e locale autonoma con database dedicato e database dev protetto — Piano di Implementazione

  **Generato da:** Team di Planning ARchetipo
  **Data:** 2026-08-06

  ---

  ## Spec

  **Epic:** EP-000 — Fondazione del Progetto
  **Priorità:** MEDIUM | **Punti:** 3

  **Storia Utente**
  Come sviluppatore del progetto Coaching Planner, voglio che la suite e2e locale prepari da sola il proprio database dedicato partendo sempre da uno stato pulito, mentre il mio database di sviluppo persistente resta fuori dalla sua portata, così da poter lanciare `npm run test:e2e` in qualunque momento senza preparazioni manuali e senza timore di perdere i dati delle mie prove locali.

  **Criteri di Accettazione**
  - AC-1 — Avviando il container Docker locale da zero, sono disponibili automaticamente sia il database di sviluppo persistente sia il database dedicato agli e2e, senza creazione manuale di database.
  - AC-2 — Lanciando la suite e2e con dati residui nel database e2e, la suite riporta da sola quel database a uno stato pulito e completa il run senza intervento manuale.
  - AC-3 — Dopo un run e2e completo, i dati presenti nel database di sviluppo risultano invariati.
  - AC-4 — Se il database e2e configurato coincide con il database di sviluppo, la suite rifiuta di partire con un messaggio esplicito prima di modificare qualsiasi dato.
  - AC-5 — Se il database locale non è raggiungibile, la suite fallisce subito con un messaggio che indica il comando per avviarlo.
  - AC-6 — La suite e2e esistente passa invariata, mantenendo l'esecuzione parallela attuale.

  **Fuori Perimetro**
  Avvio automatico del container Docker da parte della suite; un secondo container Postgres dedicato agli e2e; modifiche al comportamento del database in CI, che continua a creare il proprio database e2e nella pipeline; strumenti di reset per il database di sviluppo stesso.

  ---

  ## Soluzione Tecnica

  Oggi la preparazione e2e è **assertiva**: `tests/e2e/global-setup.ts` chiama `assertE2eDatabaseHasNoApplicationData` e, se trova anche una sola riga applicativa, interrompe la suite chiedendo implicitamente allo sviluppatore di ripulire a mano. Il database `coaching_planner_e2e` inoltre non esiste finché qualcuno non lo crea (`docker-compose.yml` crea solo `coaching_planner`; in CI lo crea uno step dedicato del workflow). Questa spec ribalta il contratto: la preparazione diventa **imperativa e idempotente** — la suite porta il proprio database allo stato voluto — e la protezione si sposta dal «database vuoto» al **confine giusto**, cioè «il database e2e non deve essere il database applicativo».

  - **Creazione automatica del database e2e all'avvio del container (AC-1).** Nuovo `docker/postgres/initdb/01-crea-database-e2e.sh`, montato in sola lettura su `/docker-entrypoint-initdb.d/` dal servizio `postgres` di `docker-compose.yml`. L'entrypoint dell'immagine `postgres:17-alpine` esegue gli script di quella cartella alla **prima inizializzazione del volume**, dopo aver creato `POSTGRES_DB`. Lo script crea il database indicato dalla nuova variabile di servizio `POSTGRES_E2E_DB` (default `coaching_planner_e2e`), con lo stesso owner di `POSTGRES_USER`.
  - **Rete di sicurezza per i volumi già esistenti.** Gli script di init non vengono rieseguiti su un volume `pgdata` già inizializzato (è il caso di ogni sviluppatore che ha già lavorato sul progetto: nel checkout di planning il database `coaching_planner_e2e` esiste solo perché creato a mano). Per questo la preparazione runtime, se la connessione al database e2e fallisce con `3D000` (`invalid_catalog_name`), si ricollega al database di manutenzione `postgres` sulla stessa istanza e lo crea. È lo stesso fatto osservabile di AC-1 — «senza creazione manuale di database» — garantito anche senza distruggere il volume di sviluppo.
  - **Un solo seam per la sicurezza e la preparazione: `tests/e2e/e2e-database-safety.ts`.** Il modulo esistente (già l'unico punto che parla con il database e2e fuori dai test) guadagna:
    - `descriviIdentitaDatabase(stringaConnessione)` → `{ host, porta, nomeDatabase }` normalizzati (host in minuscolo con `localhost`/`127.0.0.1`/`::1`/`[::1]` ricondotti a un unico valore, porta assente = `5432`, nome database dal path). Errore esplicito su stringa non parsabile.
    - `sonoLoStessoDatabase(a, b)` e `assertDatabaseE2eDistintoDaDatabaseApplicativo(urlE2e, urlApplicativo)`: quest'ultima lancia un errore che nomina host, porta e database coincidenti e indica il rimedio (`coaching_planner_e2e`). È **puramente sintattica**: non apre connessioni, quindi rifiuta il run prima di qualunque accesso ai dati (AC-4).
    - `messaggioDatabaseNonRaggiungibile(errore, stringaConnessione)`: mappa `ECONNREFUSED`, `ENOTFOUND`, `EHOSTUNREACH`, `ETIMEDOUT`, `EAI_AGAIN` su un messaggio che contiene host, porta e il comando `docker compose up -d`; restituisce `null` per ogni altro errore, che resta quindi visibile così com'è (AC-5).
    - `garantisciDatabaseE2eEsistente(stringaConnessione)`: prova la connessione; su `3D000` crea il database dal database di manutenzione; su errore di rete rilancia con il messaggio di AC-5.
    - `ripristinaSchemaPulitoDatabaseE2e(stringaConnessione)`: `DROP SCHEMA IF EXISTS public CASCADE` + `CREATE SCHEMA public`, cioè lo stato pulito **indipendente da qualsiasi residuo** (AC-2).
    - `costruisciAmbienteE2e(ambiente, urlE2e)`: l'oggetto env passato ai processi figli, con `DATABASE_URL` **sempre** riscritto sull'URL e2e, `E2E_DATABASE_URL` e `E2E_TEST_MODE: "true"`. Estrarre questa costruzione dal `globalSetup` la rende verificabile a livello unit (AC-3).
    - `assertE2eDatabaseHasNoApplicationData` viene **rimossa**: il suo compito (impedire di scrivere sul database sbagliato) passa alla guardia d'identità, mentre il suo effetto collaterale (bloccare un run per dati residui) è esattamente ciò che AC-2 elimina. `clearE2eApplicationData` resta e continua a servire il `globalTeardown`.
  - **Sequenza di `tests/e2e/global-setup.ts`:** guardia d'identità → `garantisciDatabaseE2eEsistente` → `ripristinaSchemaPulitoDatabaseE2e` → `npm run db:migrate:deploy` → `npm run db:seed`, gli ultimi due con l'ambiente di `costruisciAmbienteE2e`. Dopo il reset dello schema le migrazioni ripartono da zero (8 migrazioni, frazioni di secondo), quindi anche uno stato di migrazione fallito o disallineato lasciato da un run interrotto viene sanato.
  - **Guardia anche in `playwright.config.ts` (AC-4).** Il file di configurazione è il primo codice valutato da Playwright, prima di `globalSetup` e del `webServer`: subito dopo la lettura di `E2E_DATABASE_URL` chiama `assertDatabaseE2eDistintoDaDatabaseApplicativo(e2eDatabaseUrl, process.env.DATABASE_URL)`. Il controllo resta anche in `globalSetup`, che è il punto in cui avviene la distruzione: le due chiamate non si sostituiscono a vicenda.
  - **Perché `DATABASE_URL` di sviluppo non viene mai raggiunto (AC-3).** Verificato in planning leggendo `node_modules/@next/env/dist/index.js`: `processEnv` copia dai file `.env*` **solo** le chiavi assenti dallo snapshot iniziale del processo (`if (typeof u[t] === "undefined" && typeof l[t] === "undefined")`). Poiché `execSync` avvia `prisma migrate deploy` e `prisma db seed` con `DATABASE_URL` già valorizzato sull'URL e2e, il `loadEnvConfig` di `prisma.config.ts` non può sovrascriverlo con il valore di `.env.local`. La guardia d'identità è la seconda linea di difesa: se le due stringhe puntassero allo stesso database, il run non partirebbe affatto.
  - **CI invariata (fuori perimetro).** `.github/workflows/ci.yml` non viene toccato: continua a creare `coaching_planner_e2e` con il proprio step. Le due variabili CI puntano a database con nomi diversi (`coaching_planner_ci` e `coaching_planner_e2e`), quindi la guardia passa; il reset dello schema agisce su un database appena creato ed è un no-op semantico; `garantisciDatabaseE2eEsistente` trova il database già presente.

  ### Decisioni Architetturali

  La scelta di **azzerare per costruzione il database e2e a ogni run** supera la soglia ADR: cambia la semantica di fallimento dello strumento di verifica del progetto (da «fallisci se sporco» a «distruggi e ricostruisci»), introduce un'operazione distruttiva eseguita automaticamente su un database identificato da configurazione, ed è una politica trasversale che ogni futura spec con e2e deve rispettare. Alternative valutate: (a) mantenere il controllo di vuoto e lasciare la pulizia allo sviluppatore — scartata, è esattamente il problema della storia; (b) `TRUNCATE` di tutte le tabelle applicative — scartata perché non sana lo schema né una migrazione fallita a metà, cioè il residuo tipico di un run interrotto; (c) creare un database effimero per run (`coaching_planner_e2e_<pid>`) — scartata perché moltiplica i database orfani e rende opaco l'URL configurato; (d) un secondo container Postgres dedicato — esplicitamente fuori perimetro nella spec. Il compromesso accettato è il costo di 8 migrazioni per run e la dipendenza dalla proprietà dello schema `public` da parte dell'utente di connessione (vera sia in locale sia in CI). La mitigazione obbligatoria è la guardia d'identità, che rende impossibile puntare l'operazione distruttiva al database applicativo. La decisione viene registrata nella nuova pagina `decisions/reset-database-e2e-dedicato`.

  ---

  ## Baseline

  Comandi eseguiti in fase di planning da `/Users/smarello/repo/coaching-planner`, prima di qualunque modifica.

  | Controllo | Esito prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `npm run lint` | Passa (exit 0). Un solo **warning pre-esistente**: `tests/e2e/demo__duplicazione-riga-su-piu-giorni.spec.ts:41 'MESE_ALTRO' is assigned a value but never used`. Il guardrail e2e stampa nove avvisi `chiave riservata non risolvibile staticamente` (helper generici di `support/date.ts` e `support/report-data.ts`) e chiude con `✅ Guardrail e2e anti-flakiness passed`. | I file toccati non devono aggiungere nuove diagnostiche. Attenzione al codice morto: rimuovendo `assertE2eDatabaseHasNoApplicationData` non devono restare import o funzioni non usate, che diventerebbero warning nuovi. |
  | `npx tsc --noEmit` | Passa, exit 0, nessuna diagnostica. `tsconfig.json` include `**/*.ts`, quindi copre anche `tests/**` e `playwright.config.ts`. | È il controllo di tipo focalizzato per ogni task che tocca `.ts`; deve restare a zero errori. |
  | `npm test` (vitest) | Passa: 40 file, 685 test, ~0,8 s. | Il nuovo file `tests/unit/e2e-database-safety.test.ts` si aggiunge senza toccare i 685 esistenti. |
  | `npx playwright test tests/e2e/home-page.spec.ts --retries=0 --reporter=line` | Passa: 2 test in 4,3 s. Il log mostra la sequenza attuale: verifica di database vuoto → migrazioni → seed → test → pulizia finale. | È il ciclo completo di `globalSetup`/`globalTeardown` a costo basso: resta il controllo rapido dopo ogni modifica alla preparazione. |
  | `archetipo wiki validate --profile bootstrap` | `data.ok: true`, 27 pagine, nessun finding. | La nuova pagina `decisions/reset-database-e2e-dedicato` e l'aggiornamento di `operations/development` devono lasciare la validazione a zero finding. |
  | Suite e2e completa (`npx playwright test --retries=0`) | **Non eseguita in fase di planning** (durata elevata, ~60 file di spec). Nota: la README e2e fissa come gate di stabilità tre esecuzioni consecutive. | Nessun task può dichiarare «passa come da baseline» sulla suite completa senza averla eseguita: il gate finale (TASK-09) la esegue e stabilisce il confine. Un fallimento va classificato — regressione introdotta oppure flake pre-esistente — riproducendolo sul file singolo. |

  **Prerequisiti d'ambiente (non sono fallimenti di codice).**

  - PostgreSQL locale in ascolto su `localhost:5432`: container `coaching-planner-db` da `docker-compose.yml`, verificato `healthy` durante il planning. Comando: `docker compose up -d`.
  - `E2E_DATABASE_URL` e `DATABASE_URL` valorizzate in `.env.local`; **non leggere né modificare i file `.env*` reali** (vincolo di progetto). Per gli scenari che richiedono valori diversi si passano variabili inline al comando (`E2E_DATABASE_URL=... npx playwright test ...`), che vincono sul file grazie alla semantica di `@next/env` descritta nella soluzione tecnica.
  - Client Prisma generato: coperto da `postinstall`/`dev`/`build`, altrimenti `npm run db:generate`.
  - Stato osservato durante il planning: il database `coaching_planner_e2e` **esiste già** (creato manualmente in passato, il volume `pgdata` è inizializzato da tempo) e il database di sviluppo `coaching_planner` ha lo schema applicato ma **zero righe** in `"Utente"`. Conseguenza pratica: la verifica di AC-3 non può limitarsi a «i conteggi non sono cambiati» — 0 → 0 è indistinguibile da una cancellazione. Serve una riga sentinella creata prima del run (vedi TASK-05).

  ---

  ## Mappa delle Evidenze di Accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Container Postgres usa-e-getta (`postgres:17-alpine`, porta 55432, volume anonimo) avviato con la cartella `docker/postgres/initdb` montata su `/docker-entrypoint-initdb.d`, quindi con volume **non inizializzato** | integrazione a riga di comando su Docker reale | `docker exec <container> psql -U user -d postgres -lqt` elenca **sia** `coaching_planner` **sia** `coaching_planner_e2e`, senza che sia stato eseguito alcun `CREATE DATABASE` manuale | TASK-01 |
  | AC-1 (volume già inizializzato) | Database e2e cancellato a mano (`DROP DATABASE coaching_planner_e2e`) sul container di sviluppo esistente | integrazione a riga di comando + suite Playwright | `npx playwright test tests/e2e/home-page.spec.ts --retries=0` completa verde e `psql -lqt` mostra di nuovo `coaching_planner_e2e`: la preparazione lo ha ricreato da sola | TASK-05 |
  | AC-2 | Database e2e sporcato prima del run: riga `Cliente` estranea inserita via `psql` nel database e2e (simulazione di run interrotto) | integrazione a riga di comando + suite Playwright completa | `npx playwright test --retries=0` completa **verde** senza alcun intervento; il log di `globalSetup` riporta il ripristino dello stato pulito seguito da migrazioni e seed; la riga estranea non esiste più a fine setup | TASK-05 |
  | AC-2 (contratto della funzione) | Client `pg` finto iniettato | unit (vitest) | `ripristinaSchemaPulitoDatabaseE2e` emette `DROP SCHEMA IF EXISTS public CASCADE` e `CREATE SCHEMA public`, in quest'ordine, e chiude la connessione anche in caso di errore | TASK-03 |
  | AC-3 | Riga sentinella `US-059 Sentinella Dev` inserita nel database di **sviluppo** prima del run; snapshot dei conteggi di tutte le tabelle applicative | integrazione a riga di comando + suite Playwright completa | Dopo il run completo la sentinella è ancora presente con gli stessi valori e i conteggi per tabella del database di sviluppo sono identici allo snapshot iniziale | TASK-05 |
  | AC-3 (contratto dell'ambiente figlio) | `costruisciAmbienteE2e({ DATABASE_URL: "<url sviluppo>", ... }, "<url e2e>")` | unit (vitest) | Il risultato ha `DATABASE_URL === "<url e2e>"` (il valore di sviluppo è sostituito, non conservato), `E2E_DATABASE_URL === "<url e2e>"` e `E2E_TEST_MODE === "true"` | TASK-03 |
  | AC-4 | `E2E_DATABASE_URL` impostata **inline** allo stesso valore di `DATABASE_URL`; database di sviluppo con la riga sentinella e conteggi noti | integrazione a riga di comando | Il comando esce con codice diverso da 0 e stampa un messaggio che nomina il database coincidente e il rimedio; **nessun processo `webServer` viene avviato**; conteggi e sentinella del database di sviluppo invariati dopo il tentativo | TASK-05 |
  | AC-4 (contratto della guardia) | Coppie di stringhe di connessione: identiche; equivalenti (`localhost` vs `127.0.0.1`, porta implicita vs `:5432`); realmente diverse (solo il nome database cambia) | unit (vitest) | `assertDatabaseE2eDistintoDaDatabaseApplicativo` lancia con messaggio contenente il nome del database per i primi due casi e **non** lancia per il terzo; nessuna connessione viene aperta (nessun mock di `pg` è necessario perché la funzione è sintattica) | TASK-03 |
  | AC-5 | Container di sviluppo fermato con `docker stop coaching-planner-db` (volume intatto) | integrazione a riga di comando | `npx playwright test tests/e2e/home-page.spec.ts --retries=0` fallisce **subito** (prima dei test) con un messaggio che contiene host, porta e la stringa esatta `docker compose up -d` | TASK-05 |
  | AC-5 (contratto della mappatura) | Errori sintetici con `code` `ECONNREFUSED`, `ENOTFOUND`, `ETIMEDOUT`, `EAI_AGAIN`, più un errore applicativo qualsiasi | unit (vitest) | `messaggioDatabaseNonRaggiungibile` restituisce un messaggio contenente `docker compose up -d`, host e porta per i codici di rete, e `null` per l'errore non di rete (che quindi non viene mascherato) | TASK-03 |
  | AC-6 | Suite e2e invariata, `playwright.config.ts` con `fullyParallel: true` e nessun `workers` forzato | e2e browser (suite completa) | Due esecuzioni consecutive di `npx playwright test --retries=0` completano verdi; `git diff` non mostra modifiche ai file `*.spec.ts` né a `fullyParallel`/`workers`/`retries` | TASK-09 |

  La mappa non usa proxy: gli oracoli di AC-1..AC-5 sono osservati su un PostgreSQL reale e sulla suite reale, e i casi unit verificano il **contratto delle funzioni responsabili**, non che siano state chiamate. Nessun test double copre il percorso di accettazione end-to-end.

  ---

  ## Strategia di Test

  L'oggetto della spec **è** l'infrastruttura di test: il comportamento da provare non vive in una pagina, ma nella preparazione che gira prima dei test. La strategia usa quindi due livelli complementari, nessuno dei quali è un proxy dell'altro.

  - **Unit (vitest, `tests/unit/e2e-database-safety.test.ts`).** Copre le funzioni deterministiche del seam: normalizzazione dell'identità del database, guardia di non-coincidenza, mappatura degli errori di rete, costruzione dell'ambiente dei processi figli e sequenza SQL del ripristino (con un client `pg` finto iniettato). Sono i punti dove un errore sarebbe silenzioso e dove un test è rapido e stabile. Il file segue il precedente già in repo per il codice non-applicativo (`tests/unit/siteground-connectivity-check.test.ts`, che testa uno script importandolo direttamente).
  - **Integrazione a riga di comando su PostgreSQL reale (TASK-05).** Prova i quattro comportamenti che nessun mock può dimostrare: la creazione automatica del database all'inizializzazione del volume, il recupero da un database sporco, l'invarianza del database di sviluppo dopo un run completo e i due rifiuti espliciti (database coincidente, database irraggiungibile). Gli scenari sono eseguiti dall'implementatore con comandi esatti e con esiti verificabili; il loro esito va riportato nel task, perché coincide con lo script di dimostrazione della spec.
  - **Regressione della suite esistente (TASK-09).** L'unica prova valida di AC-6 è la suite completa che passa senza modifiche ai file di spec né alla configurazione di parallelismo. Due esecuzioni consecutive con `--retries=0`, più l'esecuzione su database sporco di TASK-05, danno le tre esecuzioni consecutive richieste dal contratto e2e del progetto.
  - **Vincoli di non-regressione da rispettare in ogni task:** `fullyParallel: true` invariato, nessun `workers: 1`, `retries` invariato, nessuna modifica ai file `tests/e2e/*.spec.ts`, nessun uso di `DATABASE_URL` nel layer di supporto e2e (`tests/e2e/support/prisma.ts` continua a leggere solo `E2E_DATABASE_URL`).
  - **Non si tocca `globalTeardown`.** La pulizia finale con `clearE2eApplicationData` resta: rende gradevole lo stato del database fra un run e l'altro. La sua eventuale interruzione non è più un problema, perché il run successivo ripristina comunque lo stato pulito.

  ### Deroga agli e2e browser

  **Motivo:** nessun criterio di accettazione descrive un comportamento dell'applicazione nel browser. AC-1..AC-5 riguardano la preparazione dell'ambiente prima che i test partano — creazione del database, ripristino, rifiuti espliciti — e non sono osservabili da una pagina; aprire un browser per provarli sarebbe la definizione di prova per proxy. AC-6 è invece provato **eseguendo davvero** l'intera suite browser esistente, che resta il livello più alto di verifica di questa spec.
  **Livello di evidenza usato al suo posto:** unit vitest deterministici sul seam di sicurezza (AC-2..AC-5, lato contratto) + scenari di integrazione a riga di comando su PostgreSQL e Docker reali (AC-1..AC-5, lato comportamento) + esecuzione completa della suite Playwright esistente (AC-2 e AC-6).

  ### Video di dimostrazione

  **Atteso:** no. La sezione «Dimostrazione» della spec si svolge interamente a riga di comando (`docker compose`, `npm run test:e2e`, ispezione del database): non esiste un percorso utente nel browser che Playwright possa filmare, quindi non va creato alcun file `demo__*.spec.ts`. La decisione finale su registrazione o rinuncia resta di `archetipo-review`; l'evidenza da presentare in accettazione è la trascrizione dei comandi e degli esiti di TASK-05.

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [operations/development, decisions/postgres-siteground, engineering/code-map]
    update: [operations/development]
    create: [decisions/reset-database-e2e-dedicato]
  ```

  `archetipo wiki --project-root /Users/smarello/repo/coaching-planner affected --file docker-compose.yml --file tests/e2e/global-setup.ts --file tests/e2e/e2e-database-safety.ts --file README.md --file .env.example --file tests/e2e/README.md --file .github/workflows/ci.yml` restituisce tre candidati. Decisione pagina per pagina:

  - **`operations/development` → `update`.** La sua conoscenza cambia in più punti verificabili: «Docker Compose fornisce PostgreSQL 17 Alpine in locale con volume persistente» diventa «con volume persistente e creazione automatica del database e2e»; la riga di configurazione runtime su `E2E_DATABASE_URL` deve dire che il database viene creato e riportato allo stato pulito dalla suite e non deve più essere vuoto in partenza; la sezione «Test» afferma oggi che «il database E2E viene migrato, popolato e ripulito» e va estesa con il ripristino iniziale e con i due rifiuti espliciti; la sezione «Vincoli e cautele» guadagna il fatto che la coincidenza fra database e2e e database applicativo è ora impedita dal codice. Vanno aggiunte alle `sources` la cartella `docker/postgres/initdb/` e `tests/e2e/e2e-database-safety.ts`.
  - **`decisions/reset-database-e2e-dedicato` → `create`.** Registra la decisione descritta in «Decisioni Architetturali»: reset distruttivo per costruzione del database e2e dedicato, subordinato a una guardia d'identità, con le alternative scartate e la verifica.
  - **`decisions/postgres-siteground` → solo candidato.** Traccia `docker-compose.yml` e risulterà `evidence-changed`, ma le sue affermazioni restano vere: PostgreSQL come database, istanza locale equivalente, target SiteGround, «sviluppo ed E2E usano database separati» — che questa spec rafforza invece di contraddire. Riconciliazione esplicita in accettazione, senza task di documentazione.
  - **`engineering/code-map` → solo candidato.** Compare per il boundary `tests`. La matrice capability → codice → dati → test non cambia: non nascono capability, modelli o rotte; cambia solo l'impianto di preparazione della verifica, già rappresentato dal boundary esistente.

  ---

  ## Assunzioni e Note

  - Il nome `coaching_planner_e2e` resta il default in `docker-compose.yml`, `.env.example` e CI; la variabile di servizio `POSTGRES_E2E_DB` permette di cambiarlo senza modificare lo script di init.
  - Il reset distruttivo richiede che l'utente di connessione possa fare `DROP SCHEMA public`. È vero in locale (`POSTGRES_USER=user` è superuser dell'istanza) e in CI (l'utente `ci` è owner del database creato dal workflow). Non è un requisito nuovo per ambienti gestiti, perché il database e2e è per definizione dedicato e locale alla pipeline.
  - Se una sessione esterna tiene aperta una connessione sul database e2e (per esempio `npm run db:studio` puntato lì), il `DROP SCHEMA` può restare in attesa di lock. È un caso volutamente non gestito: l'errore di Postgres è già parlante e la spec non chiede timeouts né terminazione forzata delle sessioni.
  - La preparazione **non avvia** il container Docker (fuori perimetro): quando l'istanza non risponde la suite si limita a fallire indicando `docker compose up -d`.

  _Piano generato con ARchetipo Planning — 2026-08-06_
tasks:
  - id: TASK-01
    title: Creazione automatica del database e2e all'inizializzazione del container Postgres
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Un container PostgreSQL avviato da `docker-compose.yml` su volume nuovo espone sia `coaching_planner` sia `coaching_planner_e2e`, senza alcun `CREATE DATABASE` manuale.

      ## Read
      - `docker-compose.yml` — servizio `postgres`: variabili `POSTGRES_USER`/`POSTGRES_PASSWORD`/`POSTGRES_DB`, volume `pgdata`, healthcheck, commenti iniziali sull'uso.
      - `.env.example` — riga `E2E_DATABASE_URL`, da cui deriva il nome atteso `coaching_planner_e2e`.

      ## Change
      - Nuovo file `docker/postgres/initdb/01-crea-database-e2e.sh`.
      - `docker-compose.yml`: aggiungere la variabile d'ambiente `POSTGRES_E2E_DB` al servizio `postgres` e montare `./docker/postgres/initdb` su `/docker-entrypoint-initdb.d` in sola lettura.

      Non-goal: non aggiungere un secondo servizio Postgres; non toccare il volume `pgdata` né il healthcheck; non modificare `.github/workflows/ci.yml`; non introdurre script di avvio del container nella suite.

      ## Steps
      1. Creare `docker/postgres/initdb/01-crea-database-e2e.sh` con contenuto:
         ```sh
         #!/bin/sh
         # Eseguito dall'entrypoint di postgres SOLO alla prima inizializzazione del volume,
         # dopo la creazione di POSTGRES_DB. Crea il database dedicato ai test end-to-end.
         set -e

         NOME_DATABASE_E2E="${POSTGRES_E2E_DB:-coaching_planner_e2e}"

         psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" <<-EOSQL
             CREATE DATABASE "$NOME_DATABASE_E2E" OWNER "$POSTGRES_USER";
         EOSQL

         echo "Database e2e '$NOME_DATABASE_E2E' creato."
         ```
      2. In `docker-compose.yml`, sotto `environment` del servizio `postgres`, aggiungere `POSTGRES_E2E_DB: coaching_planner_e2e`.
      3. Sempre nel servizio `postgres`, aggiungere alla lista `volumes` la riga `- ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro` (il volume nominato `pgdata` resta invariato).
      4. Aggiornare il commento in testa a `docker-compose.yml` segnalando che gli script di init girano solo su volume nuovo e che per ottenerli su un volume esistente serve `docker compose down -v && docker compose up -d`.
      5. Rendere eseguibile lo script (`chmod +x docker/postgres/initdb/01-crea-database-e2e.sh`) e verificare che git registri il bit (`git ls-files -s docker/postgres/initdb/01-crea-database-e2e.sh` deve mostrare `100755`). Nota: l'entrypoint esegue comunque i `.sh` non eseguibili tramite `source`, ma il bit esplicito evita ambiguità.

      ## Verify
      - Run: `docker compose config --quiet`
      - Expect: exit 0, nessun output (compose valido).
      - Run (verifica reale su volume nuovo, senza toccare il container di sviluppo né il suo volume):
        ```bash
        docker run --rm -d --name coaching-planner-verifica-us059 \
          -e POSTGRES_USER=user -e POSTGRES_PASSWORD=password \
          -e POSTGRES_DB=coaching_planner -e POSTGRES_E2E_DB=coaching_planner_e2e \
          -v "$PWD/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
          -p 55432:5432 postgres:17-alpine
        until docker exec coaching-planner-verifica-us059 pg_isready -U user -d coaching_planner >/dev/null 2>&1; do sleep 1; done
        docker exec coaching-planner-verifica-us059 psql -U user -d postgres -lqt | cut -d '|' -f1
        docker rm -f coaching-planner-verifica-us059
        ```
      - Expect: l'elenco contiene sia `coaching_planner` sia `coaching_planner_e2e` (AC-1). Il container di verifica viene rimosso; il container `coaching-planner-db` e il volume `pgdata` non sono mai toccati.

      ## Done
      - [ ] AC-1 — su un volume Postgres nuovo il database `coaching_planner_e2e` esiste subito dopo l'avvio, senza creazione manuale, come mostrato dall'elenco `psql -lqt` del comando di verifica.
      - [ ] `docker compose config --quiet` esce a 0 e il montaggio è in sola lettura (`:ro`).
      - [ ] Nessun secondo servizio Postgres e nessuna modifica al volume `pgdata` o al workflow CI.

      ## Blockers
      None.
