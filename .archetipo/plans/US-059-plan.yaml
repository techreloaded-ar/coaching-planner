  - id: TASK-04
    title: Preparazione autonoma in global-setup e rifiuto immediato in playwright.config
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      La suite e2e prepara da sola il proprio database — guardia, esistenza, ripristino, migrazioni, seed — e rifiuta di partire quando il database e2e coincide con quello applicativo o quando PostgreSQL non risponde.

      ## Read
      - `tests/e2e/global-setup.ts` — sequenza attuale: `requireE2eDatabaseUrl`, `assertE2eDatabaseHasNoApplicationData`, `execSync("npm run db:migrate:deploy")`, `execSync("npm run db:seed")`, blocco `try/catch` con log.
      - `playwright.config.ts` — lettura di `E2E_DATABASE_URL`, costruzione di `e2eEnvironment`, `globalSetup`/`globalTeardown`, `fullyParallel`, `webServer`.
      - `tests/e2e/e2e-database-safety.ts` — firme introdotte da TASK-02.

      ## Change
      - `tests/e2e/global-setup.ts`: nuova sequenza di preparazione.
      - `playwright.config.ts`: chiamata della sola guardia d'identità e riuso di `costruisciAmbienteE2e` per l'ambiente del `webServer`.

      Non-goal: non toccare `tests/e2e/global-teardown.ts`; non modificare `fullyParallel`, `retries`, `workers`, `projects`, `webServer.command` o `reuseExistingServer`; non modificare alcun file `tests/e2e/*.spec.ts`; non aggiungere avvio automatico del container Docker.

      ## Steps
      1. In `playwright.config.ts`, subito dopo il controllo di presenza di `e2eDatabaseUrl`, aggiungere `assertDatabaseE2eDistintoDaDatabaseApplicativo(e2eDatabaseUrl, process.env.DATABASE_URL)` importata da `./tests/e2e/e2e-database-safety`. È il punto più precoce dell'esecuzione (la configurazione è valutata prima di `globalSetup` e prima dell'avvio del `webServer`), quindi il rifiuto avviene senza che nessun processo tocchi dati.
      2. Sempre in `playwright.config.ts`, sostituire la costruzione manuale di `e2eEnvironment` con `costruisciAmbienteE2e(process.env, e2eDatabaseUrl)`, aggiungendo poi `SESSION_SECRET: e2eSessionSecret` allo stesso oggetto. Il fallback della session secret e il resto della configurazione restano invariati.
      3. In `tests/e2e/global-setup.ts` sostituire il corpo con questa sequenza, mantenendo lo stile dei log esistenti (una riga di annuncio e una di conferma per passo) e il `try/catch` finale:
         1. `const e2eDatabaseUrl = requireE2eDatabaseUrl();`
         2. `assertDatabaseE2eDistintoDaDatabaseApplicativo(e2eDatabaseUrl, process.env.DATABASE_URL);` — **prima** di qualsiasi connessione o comando.
         3. `await garantisciDatabaseE2eEsistente(e2eDatabaseUrl);`
         4. `await ripristinaSchemaPulitoDatabaseE2e(e2eDatabaseUrl);`
         5. `execSync("npm run db:migrate:deploy", { cwd: process.cwd(), stdio: "inherit", env: ambienteE2e });`
         6. `execSync("npm run db:seed", { ...stessa forma... });`
         dove `ambienteE2e = costruisciAmbienteE2e(process.env, e2eDatabaseUrl)`.
      4. Rimuovere l'import e l'uso di `assertE2eDatabaseHasNoApplicationData` e aggiornare il commento di intestazione del file: la preparazione non richiede più un database vuoto, lo rende vuoto; il seed resta baseline read-only/smoke e i test mutanti continuano a usare factory e risorse riservate.
      5. Nel `catch`, ri-lanciare l'errore invariato dopo il log (comportamento attuale): i messaggi di AC-4 e AC-5 sono già formulati nelle funzioni del seam e non vanno riscritti né arricchiti qui.
      6. Verificare con `git diff -- playwright.config.ts` che `fullyParallel: true`, `retries`, `projects` e `webServer` non risultino modificati.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0.
      - Run: `npm run lint`
      - Expect: exit 0, con il solo warning pre-esistente su `demo__duplicazione-riga-su-piu-giorni.spec.ts:41` e il guardrail e2e che chiude con `✅ Guardrail e2e anti-flakiness passed`.
      - Run: `npx playwright test tests/e2e/home-page.spec.ts --retries=0 --reporter=line`
      - Expect: 2 test passati (baseline: 2 passati); nel log di `globalSetup` compaiono il ripristino dello stato pulito, le migrazioni e il seed, e **non** compare più la verifica di database vuoto.

      ## Done
      - [ ] AC-2 — il `globalSetup` ripristina lo stato pulito prima di migrazioni e seed, senza alcun controllo che interrompa il run per dati residui.
      - [ ] AC-4 — la guardia d'identità è chiamata sia in `playwright.config.ts` (prima di tutto) sia in `global-setup.ts` (prima dell'operazione distruttiva).
      - [ ] AC-3 — migrazioni e seed ricevono l'ambiente di `costruisciAmbienteE2e`, con `DATABASE_URL` riscritto sull'URL e2e.
      - [ ] AC-6 — `git diff` non mostra modifiche a `fullyParallel`, `retries`, `workers`, `projects`, `webServer` né ad alcun file `*.spec.ts`.
