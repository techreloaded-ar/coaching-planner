schema: archetipo/plan/v2
spec_code: US-010
body: "# US-010: Configurazione degli scaglioni chilometrici per i rimborsi — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-06-13\n\n---\n\n## Spec\n\n**Epic:** EP-002 — Anagrafiche e Configurazione\n**Priorità:** HIGH | **Punti:** 2 | **Bloccata da:** -\n\n**Storia Utente**\nCome Stefano, amministratore, voglio configurare gli scaglioni chilometrici dei rimborsi trasferta, definendo per ogni soglia di distanza l'importo forfettario, così che i rimborsi vengano calcolati automaticamente senza che nessuno debba ricordare le regole.\n\n**Criteri di Accettazione**\n- [ ] L'amministratore crea, modifica ed elimina scaglioni definiti da soglia massima in km e importo forfettario\n- [ ] Le soglie devono essere strettamente crescenti e non sovrapposte; configurazioni non valide sono rifiutate con messaggio chiaro\n- [ ] Gli importi sono decimali positivi\n- [ ] La configurazione corrente degli scaglioni è consultabile in un'unica vista ordinata per soglia\n\n---\n\n## Soluzione Tecnica\n\nQuarto CRUD del back office sul pattern consolidato da US-007/US-008 (dominio puro → DAL con guardie di ruolo → Server Actions → view nella console), con due specificità: è un'**entità di configurazione globale** (nessun genitore come il cliente, supporta la **cancellazione** oltre a creazione e modifica) e la validazione ha una **componente d'insieme** — le soglie devono essere strettamente crescenti e non sovrapposte. Le convenzioni Next.js 16 seguono le guide locali in `node_modules/next/dist/docs/` (mutating-data, forms, data-security, revalidating), come richiesto da AGENTS.md.\n\n- **Modello dati: già presente, una sola migrazione di vincolo.** `ScaglioneKm` esiste in `prisma/schema.prisma:132` (`finoAKm` Int, `importo` Decimal(10,2)): nessun nuovo campo. Si aggiunge però un vincolo **`@unique` su `finoAKm`**: poiché ogni scaglione definisce la soglia *superiore* di una fascia contigua (la fascia va dalla soglia precedente +1 fino a `finoAKm`), avere soglie **distinte** garantisce di per sé fasce strettamente crescenti e non sovrapposte. Il vincolo a DB è la rete di sicurezza definitiva contro le sovrapposizioni in caso di scritture concorrenti, intercettabile come errore Prisma `P2002` esattamente come il codice offerta in US-008. Niente campo `attivo`: la spec richiede l'**eliminazione** vera e propria, non la disattivazione (lo scaglione è un parametro di configurazione, non un'anagrafica con storico da preservare).\n- **Validazione nel dominio** (`src/domain/anagrafiche/valida-scaglione.ts`): funzioni pure senza dipendenze dal framework (ADR-006), simmetriche a `valida-cliente.ts`/`valida-offerta.ts`. Due livelli: (a) `validaScaglione` sul singolo record — `finoAKm` obbligatorio, intero strettamente positivo; `importo` obbligatorio, decimale strettamente positivo con max 2 decimali, parsing che accetta sia la virgola italiana sia il punto, riusando il normalizzatore di importi `normalizzaTariffaGiornaliera` già esistente in `valida-offerta.ts` (unica implementazione della normalizzazione monetaria, importi sempre `Decimal` — ADR-005, mai float); (b) `verificaSogliaUnica(finoAKm, soglieEsistenti, idEscluso?)` — funzione pura che, data la lista delle soglie già configurate, segnala con messaggio chiaro la sovrapposizione (\"esiste già uno scaglione con questa soglia\"), escludendo lo scaglione in modifica. Mantenere la regola pura e testabile la rende indipendente dal DB.\n- **DAL scaglioni** (`src/lib/scaglioni.ts`, `server-only`, guardia di ruolo AMMINISTRATORE da `src/lib/dal.ts`): `elencaScaglioni()` ordinati per `finoAKm` crescente (unica fonte sia per la vista sia per il calcolo delle fasce nelle spec future di consuntivazione, RF-10/RF-13/RF-14) e `scaglionePerId(id)`. Nessuna logica di calcolo del rimborso qui: il modulo di dominio \"Consuntivi\" (`src/domain/consuntivi`) la userà quando arriveranno le spec di trasferta.\n- **Server Actions** (`src/app/(back-office)/anagrafiche/scaglioni/actions.ts`, direttiva `use server`): `creaScaglione`, `aggiornaScaglione`, `eliminaScaglione`. Ogni action verifica il ruolo lato server con `richiediRuoloApi(\"AMMINISTRATORE\")` (guida data-security: le action sono raggiungibili via POST diretta), valida i campi nel dominio, controlla l'unicità della soglia rispetto agli scaglioni esistenti (escludendo sé stessa in modifica) traducendo sia l'esito della verifica pura sia l'eventuale `P2002` del vincolo DB in un errore sul campo `finoAKm`, normalizza l'importo, scrive, fa `revalidatePath` dell'elenco e restituisce la mappa errori per `useActionState`. `eliminaScaglione` rimuove il record (la spec richiede l'eliminazione; non essendoci `RigaAttivita` collegate allo scaglione nello schema, nessun vincolo referenziale lo impedisce).\n- **UI nella console** (mockup in `docs/mockups/US-010/`): la voce **Scaglioni km** della sidebar (`console-sidebar.tsx`) si attiva e punta a `/anagrafiche/scaglioni` (già coperta da `policy-rotte.ts` via prefisso `/anagrafiche`). Elenco (mockup `index.html`): tabella **sempre ordinata per soglia crescente** con l'etichetta di fascia calcolata («Fino a 100 km», «Da 101 a 200 km»…), soglia massima e importo formattato in € all'italiana, azioni Modifica ed Elimina (con modale di conferma), pulsante \"Nuovo scaglione\" e stato vuoto esplicito quando non c'è alcuno scaglione configurato. Form (mockup `scaglione-form.html`): creazione su `/anagrafiche/scaglioni/nuovo`, modifica su `/anagrafiche/scaglioni/[id]`, con i due campi (soglia in km, importo in €), errori per campo e un'anteprima della fascia coperta ricalcolata mentre si digita.\n\n**Assunzioni registrate:**\n- \"Strettamente crescenti e non sovrapposte\" si modella con soglie `finoAKm` **univoche**: poiché ogni scaglione è la soglia superiore di una fascia contigua che parte dalla soglia precedente, soglie distinte e ordinate producono automaticamente fasce crescenti e non sovrapposte. Non serve memorizzare la soglia inferiore.\n- L'eliminazione è una cancellazione effettiva (non una disattivazione): lo scaglione è un parametro di configurazione e non ha storico proprio da conservare; lo schema non lega `RigaAttivita` allo `ScaglioneKm`, quindi non si creano riferimenti orfani.\n- Il calcolo vero e proprio del rimborso a partire dai km resta fuori scope: appartiene al modulo \"Consuntivi\" e alle spec di consuntivazione trasferte (RF-10/RF-13/RF-14). Questa spec configura solo i parametri.\n\n---\n\n## Strategia di Test\n\nLa validazione (campi + unicità della soglia) è in funzioni pure con copertura unitaria piena; DAL e action si testano con mock di Prisma e sessione; gli e2e provano il ciclo completo di configurazione attraverso la UI reale, con lo scenario demo che riproduce la \"Dimostrazione\" della spec.\n\n- **Unit (Vitest)** su `valida-scaglione.ts`: obbligatorietà di soglia e importo; soglia non intera/zero/negativa; importo zero/negativo/testo/troppe cifre decimali, virgola e punto come separatore; `verificaSogliaUnica` che rileva la sovrapposizione e ammette il caso di modifica dello stesso scaglione; record valido → mappa errori vuota.\n- **Unit (Vitest)** su DAL e action con mock di Prisma e sessione: guardia di ruolo AMMINISTRATORE su ogni funzione e action; dati invalidi non scrivono a DB e restituiscono la mappa errori; soglia duplicata rifiutata con errore sul campo `finoAKm` sia per verifica pura sia per `P2002`; `elencaScaglioni` ordina per soglia crescente; `creaScaglione`/`aggiornaScaglione`/`eliminaScaglione` eseguono la mutazione attesa.\n- **Regressione**: tutte le suite esistenti (unit ed e2e di US-005/US-006/US-007/US-008) restano verdi; in particolare il riuso di `normalizzaTariffaGiornaliera` non deve alterarne il comportamento per le offerte.\n\n### Test E2E — Simulazione Utente\n\n**Framework:** Playwright (config esistente `playwright.config.ts`; sessione amministratore creata via endpoint di test `/api/e2e-test/sessione`, seed dal global-setup)\n**Registrazione video:** solo lo scenario demo (campo Dimostrazione); gli altri scenari girano senza video\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Demo (con video): configurazione degli scaglioni | L'amministratore entra nella console, apre Scaglioni km dalla sidebar, crea uno scaglione \"fino a 100 km\" con il suo importo e un secondo \"fino a 200 km\" con un altro importo, e rivede la configurazione salvata nell'unica vista ordinata per soglia crescente. Video in `docs/test-results/US-010/` (`demo__anagrafica-scaglioni.spec.ts`) |\n| Validazione dei campi | Submit del form senza campi obbligatori, con soglia non intera/non positiva e importo non positivo → errori per campo visibili, nessuno scaglione creato |\n| Soglia duplicata / sovrapposta | Creazione di un secondo scaglione con una soglia già esistente → rifiutata con messaggio chiaro sul campo soglia; l'elenco non cambia |\n| Modifica persistita | L'amministratore modifica soglia e importo di uno scaglione esistente, torna all'elenco e ricarica: i dati aggiornati sono persistiti e l'ordinamento per soglia è rispettato |\n| Eliminazione con conferma | L'amministratore elimina uno scaglione previa conferma nella modale; l'elenco si aggiorna e le fasce delle righe rimaste si ricalcolano correttamente |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-010/`\n\n_Piano generato via ARchetipo Planning — 2026-06-13_"
