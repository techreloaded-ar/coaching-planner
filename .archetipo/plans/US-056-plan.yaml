    body: |-
      ## Objective
      La pagina di decisione non generalizza più a "tutte e tre le nuove route" un comportamento (400, id passato alla lettura) che in realtà differisce da route a route: distingue `giornata`/`contesto-inserimento` (a cui viene passato l'id del profilo risolto dal DAL) da `offerte-cliente` (a cui viene passato il solo id cliente della query, mentre il collaboratore è risolto internamente dalla lettura), e limita il `400` alle sole due route con un parametro.

      ## Read
      - `docs/wiki/decisions/cache-client-calendario-collaboratore.md:191` — frase corrente: "`tests/unit/attivita-giornata-routes.test.ts` copre con DAL mockato tutte e tre le nuove route — `giornata`, `contesto-inserimento` e `offerte-cliente` — sugli esiti 400 su parametro assente o malformato senza interrogare il read model, 401 su sessione assente, 403 su profilo assente o disattivato, 200 sul percorso felice, intestazioni `private, no-store` e `Vary: Cookie`, e il fatto che l'unico id passato alla lettura sia quello del profilo risolto dal DAL."
      - `src/app/api/attivita/offerte-cliente/route.ts` — passa a `offerteAbilitatePerCliente(clienteId)` il solo id cliente della query; il collaboratore non è un parametro della funzione.
      - `src/lib/attivita.ts:419-428` — `offerteAbilitatePerCliente` risolve internamente `richiediCollaboratoreCorrente()`: nessuna identità di collaboratore arriva dal chiamante HTTP.
      - `tests/unit/attivita-giornata-routes.test.ts:217` (`"legge la giornata esclusivamente con l'id del profilo risolto dal DAL"`), `:350` (`"legge il contesto esclusivamente con l'id del profilo risolto dal DAL"`), `:579` (`"legge le offerte con il solo id cliente della query, senza alcuna identità proveniente dal browser"`) — i tre titoli reali, che già distinguono correttamente il caso `offerte-cliente` dagli altri due.

      ## Change
      - `docs/wiki/decisions/cache-client-calendario-collaboratore.md`: solo la frase alla riga 191.

      ## Steps
      1. Sostituire la frase con: "`tests/unit/attivita-giornata-routes.test.ts` copre con DAL mockato tutte e tre le nuove route — `giornata`, `contesto-inserimento` e `offerte-cliente` — su 401 su sessione assente, 403 su profilo assente o disattivato, 200 sul percorso felice e le intestazioni `private, no-store` e `Vary: Cookie`. `giornata` e `offerte-cliente` rispondono inoltre 400 sul proprio parametro (`data`, `cliente`) assente o malformato, rilevato prima di interrogare il read model; `contesto-inserimento` non dichiara alcun parametro e non ha quindi un caso 400. La sicurezza è provata in modo specifico per ciascuna route: `giornata` e `contesto-inserimento` passano alla propria lettura esclusivamente l'id del profilo risolto dal DAL, mentre `offerte-cliente` passa alla lettura il solo id cliente ricevuto dalla query — il collaboratore non viaggia mai dal browser, perché la lettura lo risolve internamente dalla sessione."
      2. Non modificare il resto della sezione "Confini dati delle nuove route" né le sezioni circostanti.

      ## Verify
