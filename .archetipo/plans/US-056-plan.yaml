  - id: TASK-09
    title: Freschezza, invalidazione dopo mutazione e sessione non più valida nella giornata
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Giornata e contesto di inserimento ottengono le stesse mitigazioni di staleness del mese, e una mutazione non può lasciare visibile il dato precedente né spostare la vista sul giorno sbagliato.

      ## Read
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — effetti di scadenza, `focus` e `visibilitychange`, sottoscrizione agli aggiornamenti in background e sottoscrizione alla sessione scaduta (righe 252-300).
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — `invalidaMeseERicarica` (righe 130-143) e i tre handler che la usano: `handleSubmit`, `handleElimina`, `handleRimuoviRimborso`.
      - `src/lib/actions/righe-attivita.ts` — le `revalidatePath` già presenti alle righe 247-249, 372-374, 416-419 e 463-466.

      ## Change
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx`: sottoscrizioni agli aggiornamenti in background, timer di scadenza e rivalidazione forzata al ritorno sulla scheda per giornata **e** contesto; sottoscrizione alla sessione non più valida; funzione `invalidaDopoMutazione` passata al componente di dettaglio.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx`: `invalidaMeseERicarica` sostituita dalla callback ricevuta; rimozione di `useCacheCalendario`, `useRouter` e della chiamata a `router.refresh()`.

      Non-goal: nessuna modifica alle server action né alle loro `revalidatePath`, che restano la protezione del rendering server.

      ## Steps
      1. Sottoscrivere la cache delle giornate: quando cambia la chiave uguale al giorno dell'intento corrente, aggiornare la giornata mostrata. Stesso schema per il contesto, che ha una chiave sola.
      2. Armare un timer sulla scadenza della voce attiva e registrare `focus` e `visibilitychange`: al ritorno sulla scheda la rivalidazione della giornata mostrata **e** del contesto è forzata, cioè usa `revalida` e non `prefetch`, perché un prefetch condizionato uscirebbe subito su una voce ancora fresca e il ritorno sulla scheda non delimiterebbe alcuna staleness. È anche il momento in cui la risposta rivela un cambio di sessione avvenuto altrove.
      3. Implementare `invalidaDopoMutazione(giorno)`: invalida quel giorno nella cache delle giornate e il token mese corrispondente nella cache dei mesi, poi forza la rivalidazione della giornata. L'aggiornamento raggiunge la vista attraverso la sottoscrizione del punto 1, senza alcuna navigazione RSC.
      4. Rimuovere `router.refresh()` dal percorso di mutazione, documentando la scelta con un commento nel codice: le server action continuano a invalidare i percorsi lato server e la risposta della server action invalida già la Router Cache client, quindi un rientro successivo sulla giornata rilegge dal server. Il refresh sarebbe inoltre dannoso, perché rigenererebbe l'albero del giorno di partenza.
      5. Sottoscrivere nell'isola la notifica di sessione non più valida e reagire con una navigazione completa, come fa il calendario.
      6. Verificare che i tre handler chiamino la callback con il giorno **visualizzato** e non con quello del payload server: dopo un cambio giorno client i due possono differire.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica.
      - Run: `npm run lint`
      - Expect: eslint senza errori, incluse le regole sui hook, e guardrail e2e passato.
      - Run: `npm test`
      - Expect: verde come baseline.
      - Run: `npm run build`
      - Expect: build completata.
      - Run: `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts tests/e2e/calendario-cache-mesi.spec.ts tests/e2e/rimborso-trasferta-selezione.spec.ts --retries=0`
      - Expect: tutti verdi. `calendario-cache-mesi.spec.ts` contiene lo scenario «dopo una modifica il ritorno al calendario mostra la sintesi aggiornata», che è la prova diretta dell'invalidazione del mese fatta dalla giornata; `rimborso-trasferta-selezione.spec.ts` esercita salvataggio e rimozione del rimborso dalla stessa pagina.

      ## Done
      - [ ] AC-3 — clienti abilitati e voci di rimborso sono rivalidati alla scadenza e al ritorno sulla scheda, non ad ogni cambio giorno.
      - [ ] AC-4 — dopo salvataggio, modifica ed eliminazione la giornata e il mese corrispondente sono invalidati prima di essere riletti, quindi nessuna versione precedente alla mutazione può restare visibile.
      - [ ] AC-7 — una sessione decaduta o sostituita porta a una navigazione completa anche dal dettaglio giornata.

      ## Blockers
      None.
    ref: TASK-09
  - id: TASK-10
    title: Suite e2e del cambio giorno servito dalla cache
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      Provare sul browser, con oracolo di rete che conta **e** aborta, che il ritorno su un giorno già visitato non produce alcuna richiesta dati e che valgono tutte le altre condizioni di accettazione osservabili.

      ## Read
      - `tests/e2e/calendario-cache-mesi.spec.ts` — intero file: gate di rete che conta e aborta, helper `cancelloRilasciabile`, attesa dell'idratazione, scenario di cambio account tramite l'endpoint di sessione e2e.
      - `tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts` — helper di etichetta del giorno e uso delle date riservate.
      - `tests/e2e/support/fixtures.ts`, `tests/e2e/support/date.ts`, `tests/e2e/support/auth.ts`, `tests/e2e/support/factory.ts` — factory, mesi e giorni riservati, accesso come collaboratore.
      - `tests/e2e/README.md` — contratto e2e del progetto.

      ## Change
      - Nuovo `tests/e2e/giornata-cache-cambio-giorno.spec.ts`.

      Non-goal: non modificare `tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts`, che è la prova di non regressione di AC-8, né `playwright.config.ts`. Nessuna entità seed: solo factory e giorni riservati con codice spec `US-056`.

      ## Steps
      1. **Prima di ogni altro scenario**, scrivere ed eseguire il test di AC-1. Il gate è una `page.route` che conta e aborta le richieste il cui pathname è `/attivita/` seguito da una data in formato `YYYY-MM-DD`, oppure è `/api/attivita/giornata` o `/api/attivita/contesto-inserimento`. Partendo da un giorno riservato con righe create dalla factory, passare al giorno successivo con la freccia, attivare il gate e tornare indietro: asserire righe e totali del giorno di ritorno, URL corretto, indicatore mai visibile e contatore a zero. Se questo test non passa perché `pushState` verso un pathname diverso genera una richiesta o una navigazione documentale, **fermarsi e riportare l'esito**: non introdurre un meccanismo di navigazione alternativo e non cambiare il contratto URL.
      2. AC-6: visitare due giorni, poi usare `goBack` e `goForward` con lo stesso gate attivo; asserire il giorno mostrato in entrambi i casi e che `history.length` è identico prima e dopo la coppia Back e Forward.
      3. AC-2: trattenere la risposta di `/api/attivita/giornata` per un giorno mai visitato con una `page.route` registrata prima della navigazione e sbloccata da una Promise risolta dal test dopo le asserzioni; asserire `aria-busy` a `true` su `contenuto-giornata`, indicatore visibile, righe del giorno precedente ancora presenti e URL ancora sul giorno di partenza; dopo il rilascio, URL e righe passano al nuovo giorno e l'indicatore scompare.
      4. AC-3: contare, **senza abortire**, le richieste verso `/api/attivita/contesto-inserimento`; eseguire tre cambi giorno consecutivi e asserire che il contatore resta a zero mentre le richieste verso `/api/attivita/giornata` avvengono, e che la select `#cliente` continua a contenere la ragione sociale del cliente creato dalla factory su ciascun giorno.
      5. AC-5: compilare `#ore` e `#nota` sul giorno di partenza, cambiare giorno e asserire che entrambi sono vuoti e che `#cliente` è tornato al valore vuoto.
      6. AC-4: dopo un cambio giorno, salvare una riga sul giorno visualizzato selezionando cliente e offerta per valore derivato dalla factory; asserire che la vista **resta** su quel giorno e mostra la riga appena salvata; cambiare giorno e tornare: la riga è ancora presente; aprire poi il calendario del mese corrispondente e asserire le ore aggiornate nella cella di quel giorno.
      7. AC-7: due collaboratori creati dalla factory con righe sullo stesso giorno; dopo l'accesso con il secondo account nella stessa finestra tramite l'endpoint di sessione e2e già usato dalla spec del calendario, attendere la navigazione documentale e asserire che la ragione sociale del cliente del primo non compare; poi verificare che il secondo veda le proprie righe su quel giorno.
      8. AC-8: reload sull'URL del giorno raggiunto e apertura diretta di un URL con il parametro `mese`: righe servite dal server, intestazione corretta e breadcrumb che punta al mese atteso.
      9. In tutti gli scenari attendere l'idratazione osservando l'attributo `data-idratata` a `true` su `contenuto-giornata` prima di cliccare i controlli: prima dell'idratazione il click è un no-op e il test resterebbe appeso.
      10. Nessun hard wait, nessuna email seed, nessun selettore di classi Tailwind, nessuna selezione per indice: le attese nascono solo da eventi e da `page.route` sbloccate dal test.

      ## Verify
      - Run: `npx playwright test tests/e2e/giornata-cache-cambio-giorno.spec.ts --retries=0`
      - Expect: tutti gli scenari verdi al primo tentativo, senza retry, con la configurazione `fullyParallel` invariata.
      - Run: `npm run lint`
      - Expect: eslint senza errori e messaggio «✅ Guardrail e2e anti-flakiness passed».
      - Run: `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts --retries=0`
      - Expect: 2 test verdi, con il file non modificato.

      ## Done
      - [ ] AC-1 — contatore delle richieste dati a zero sul ritorno a un giorno già visitato, con le richieste contate **e** abortite, righe, totali e URL corretti.
      - [ ] AC-2 — attesa osservabile con contenuto precedente ancora visibile e URL che cambia solo a dati pronti.
      - [ ] AC-3 — nessuna richiesta di contesto durante i cambi giorno successivi al primo, con la select cliente ancora popolata.
      - [ ] AC-4 — la vista resta sul giorno salvato, il dato aggiornato sopravvive al cambio giorno e compare nella cella del calendario.
      - [ ] AC-5 — form azzerato ad ogni cambio giorno.
