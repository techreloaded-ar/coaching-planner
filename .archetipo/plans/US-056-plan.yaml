  | Confini dati (AC-1, AC-3, AC-7) | DAL mockato | unit | le due nuove route rispondono 400/401/403/200, portano `Cache-Control: private, no-store` e `Vary: Cookie`, e passano alla lettura soltanto l'id risolto dal DAL | TASK-06 |

  Ogni oracolo resta osservabile attraverso i test double scelti: i mock coprono soltanto il DAL e il caricatore di rete, mai il componente o il confine responsabile dell'esito. L'assenza di richieste è provata abortendo le richieste, non contandole soltanto: un dato che comparisse grazie a una richiesta farebbe fallire l'asserzione invece di passare.

  ---

  ## Strategia di test

  Quattro livelli, ciascuno sul confine che applica davvero la regola.

  - **Unit puri con orologio e caricatore iniettati** per la macchina di cache generalizzata, la guardia condivisa e le cache di giornata e contesto: bordo esatto della finestra fresca, singola rivalidazione, deduplica, LRU, invalidazione di risposte in volo, svuotamento condiviso. Nessun timer reale.
  - **Unit sui confini HTTP** con DAL mockato, sullo stesso modello di `tests/unit/attivita-calendario-route.test.ts`: la sicurezza è provata verificando che l'unico id passato alla lettura sia quello risolto dal DAL, non provando a iniettarne uno altrui.
  - **Unit sulle letture autorizzate** con payload Prisma asserito, come già fatto per `clientiAttiviPerSelezione`.
  - **E2E su browser** per ogni criterio osservabile, con oracolo di rete che conta **e** aborta.

  ### Test E2E — simulazione utente

  **Framework:** Playwright (già presente, `playwright.config.ts` con `fullyParallel: true`).
  **Demo video:** atteso — la Dimostrazione della spec è filmabile. La registrazione è competenza di `archetipo-review`, non dell'implementazione.

  | Scenario | Flusso utente |
  |---|---|
  | Ritorno a giorno già visitato | Il collaboratore apre il dettaglio del primo giorno, passa al successivo con la freccia e torna indietro: il giorno riappare immediatamente e il contatore di rete resta a zero |
  | Indietro/Avanti del browser | Dopo aver visitato due giorni, usa Back e poi Forward: entrambi mostrano il giorno corretto dalla cache, senza nuove voci di cronologia |
  | Primo accesso a un giorno mai visitato | Salta a un giorno lontano: resta visibile il contenuto precedente con l'indicatore di attesa e l'URL cambia solo a dati pronti |
  | Clienti e voci non richiesti ad ogni giorno | Tre cambi giorno consecutivi: nessuna richiesta al contesto di inserimento e select cliente ancora popolata |
  | Salvataggio e ritorno | Salva una riga sul giorno raggiunto, cambia giorno e torna: la riga è presente; il calendario del mese mostra le ore aggiornate |
  | Form azzerato al cambio giorno | Compila ore e nota, cambia giorno: i campi del giorno di arrivo sono vuoti |
  | Cambio account nella stessa finestra | Dopo l'accesso con un altro account: navigazione completa e nessuna riga o cliente del collaboratore precedente |
  | Ricarica sull'URL del giorno | Reload e link profondo con `?mese=`: righe servite dal server, contratto URL invariato |

  **Regole e2e obbligatorie** (`tests/e2e/README.md` e guardrail in `npm run lint`): `fullyParallel` invariato, nessun `workers: 1`, nessun aumento dei retry; dati creati dalle factory di `tests/e2e/support/fixtures.ts`, mai entità seed; mesi e giorni dalle helper riservate di `tests/e2e/support/date.ts` con codice spec `US-056`; selezione per label o valore derivato dalla factory, mai per indice; nessun selettore di classi Tailwind; nessun hard wait. Le finestre di attesa nascono da una `page.route` registrata prima del `goto` e sbloccata da una Promise dopo le asserzioni, come in `calendario-navigazione-reattiva.spec.ts` e `calendario-salto-mese.spec.ts`.

  ---

  ## Wiki Impact

  ```yaml
  wiki_impact:
    read:
      - decisions/cache-client-calendario-collaboratore
      - decisions/feedback-attesa-uniforme
      - domains/attivita
      - engineering/code-map
    update:
      - decisions/cache-client-calendario-collaboratore
      - domains/attivita
      - engineering/code-map
    create: []
  ```

  **Nota di rilevanza.** `archetipo wiki affected` sui percorsi attesi ha restituito cinque candidati. Tre entrano nel contratto perché la loro conoscenza cambia davvero: la decisione, che estende il proprio perimetro dal mese al giorno con guardia condivisa e contesto separato; il dominio, i cui flussi 10 e 11, la tabella «Codice» e la sezione «Verifica» descrivono un cambio giorno che dopo questa spec non è più una navigazione RSC; e la mappa del codice, che oggi dichiara `src/app/api/attivita/calendario/route.ts` come unico confine dati dell'area attività. Restano fuori `decisions/feedback-attesa-uniforme`, perché la convenzione osservabile `aria-busy` viene riusata senza modificarla, e `decisions/tariffa-unica-collaboratore`, perché nulla della tariffa cambia: sono co-citazioni tracciate che potranno risultare `evidence-changed`, e la loro riconferma è competenza esplicita dell'accettazione, non un lavoro di documentazione di questo piano.

  ---

  _Piano generato da ARchetipo Planning — 4 agosto 2026_


  ---

  ## Rework

  Il reviewer ha rimandato la spec da REVIEW con otto osservazioni puntuali (una BLOCCANTE). Tutti i 14 task originali restano `DONE` e invariati: il piano tecnico, la baseline e la mappa delle evidenze sopra non cambiano. Questa sezione riassume solo il lavoro di correzione aggiunto.

  1. **Collisione di mese riservato (BLOCCANTE, AC-8/CI).** `meseRiservato("US-056-identita")` e il mese vuoto del report fatturazione (`US-023-TASK-08-...-VUOTO`) risolvono allo stesso mese calendariale (`2017-10`), verificato riproducendo il fallimento sulla suite completa (`report-fatturazione-clienti.spec.ts`: 1 failed) e ricalcolando l'hash `djb2`-like di `offsetMeseRiservato` in isolamento. TASK-15 sceglie una chiave verificata non collidente e aggiunge al guardrail e2e un controllo statico che risolve ogni chiamata `meseRiservato`/`mesePassatoRiservato` dell'intera suite e fallisce su qualunque collisione non allowlistata — comprese nove collisioni pre-esistenti e indipendenti da questa spec, scoperte dallo stesso controllo e allowlistate esplicitamente perché fuori perimetro.
  2. **Voci di cronologia duplicate su una corsa Indietro/Avanti (AC-6).** TASK-16 sposta la guardia anti-duplicazione dentro `commit`, confrontando l'URL di destinazione con `window.location.pathname + search` prima di ogni `pushState`, così la protezione copre anche corse future oltre a quella segnalata. TASK-17 aggiunge lo scenario e2e che riproduce esattamente la corsa (miss verso il giorno successivo, click immediato su «Giorno precedente») e prova `history.length` invariato.
  3. **Percorso di sessione scaduta mai verificato (AC-7).** TASK-18 aggiunge due unit test sul contenitore reale del provider (`creaContenitoreCacheAttivita`, già esportato come cucitura di verifica) che provano 401 e 403 come sessione scaduta: svuotamento delle tre cache e notifica singola agli ascoltatori.
  4. **`revalida` fail-open sulla guardia d'identità.** TASK-19 introduce `ErroreIdentitaSchedaCambiata` e fa rigettare `revalida` quando la guardia rifiuta la scrittura, invece di risolvere con un dato già dichiarato illeggibile; aggiorna i due punti che consumavano il fail-open (`isola-giornata.tsx`, `calendario-mensile.tsx`) e le tre asserzioni di test che oggi assumono il comportamento vecchio.
  5-7. **Tre imprecisioni nella pagina Wiki `domains/attivita.md`** (conteggio scenari 8 invece di 11 con tre scenari omessi; contratto 400 sovrageneralizzato a `contesto-inserimento`, che non ha parametri; descrizione superata della copertura di `tests/unit/attivita.test.ts`). TASK-20, TASK-21, TASK-22 correggono ciascuna affermazione contro il codice e i test reali.
  8. **Stessa imprecisione sul 400/id-passato nella pagina di decisione.** TASK-23 corregge `decisions/cache-client-calendario-collaboratore.md` distinguendo le tre route.

  TASK-24 è il nuovo gate finale di rework: verifica i task aggiunti, la non regressione rispetto alla baseline, l'assenza di nuove diagnostiche sui file toccati e conferma via `archetipo spec show` che tutti i 24 task sono `DONE` prima di richiedere una nuova review.


  ---

  ## Rework (secondo giro)

  Il reviewer ha rimandato la spec da REVIEW una seconda volta con una sola osservazione, BLOCCANTE: lo scenario e2e "dopo un accesso con un altro account il dettaglio giorno non mostra i dati del collaboratore precedente" (AC-7) fallisce in modo non deterministico (5/5 nell'ambiente del reviewer). Tutti i 24 task del giro precedente restano `DONE` e invariati; il piano tecnico, la baseline e la mappa delle evidenze sopra non cambiano.

  **Diagnosi riprodotta in planning.** Il mount dell'isola giornata avvia, subito dopo il commit del giorno mostrato, il prefetch dei due giorni adiacenti (`isola-giornata.tsx:358-362`). Queste due GET verso `/api/attivita/giornata` attraversano `src/proxy.ts`, che su ogni richiesta protetta rinnova incondizionatamente il cookie di sessione **in base al cookie con cui la richiesta è partita** (`verificaERinnovaTokenSessione` + `applicaRinnovo`), non a quello attualmente nel browser. Nello scenario, lo switch di sessione avviene tramite una `fetch` diretta a `/api/e2e-test/sessione` mentre i due prefetch del primo collaboratore sono ancora in volo: se la loro risposta arriva dopo lo switch, il suo `Set-Cookie` tardivo resuscita la sessione del primo collaboratore, la guardia d'identità non rileva alcun mismatch (la risposta successiva dichiara ancora il primo collaboratore) e l'oracolo di navigazione documentale va in timeout. Riprodotto in planning su questo worktree (`a6b722a`): `npx playwright test tests/e2e/giornata-cache-cambio-giorno.spec.ts -g "dopo un accesso con un altro account" --repeat-each=3 --retries=0` → 1 fallimento su 3, sempre con lo stesso timeout sull'oracolo.

  **Scelta del fix.** Fra le due alternative proposte dal reviewer, questo piano adotta la prima: rendere il test deterministico attendendo esplicitamente le risposte dei due prefetch prima dello switch di sessione, con l'helper `rispostaGiornata` già usato altrove nella stessa suite per lo stesso scopo (`giornata-cache-cambio-giorno.spec.ts:201-206`). La seconda alternativa — impedire che il rinnovo sliding di una richiesta più vecchia sovrascriva un cookie più recente — richiederebbe una modifica a `src/proxy.ts`, politica trasversale a ogni rotta protetta dell'applicazione: un cambiamento del genere eccede il perimetro di un fix e2e mirato a questa spec e meriterebbe una propria analisi indipendente, non innescata da un singolo scenario di test. TASK-25 applica quindi il fix minimale e locale; l'esito è stato verificato in planning applicando il fix in via sperimentale sul worktree e poi ripristinando il file al commit `a6b722a`: 15 esecuzioni consecutive dello scenario (5 + 10, `--repeat-each`) tutte verdi, più l'intero file (12/12 scenari) verde nello stesso run.

  TASK-25 applica il fix al solo file di test. TASK-26 è il nuovo gate finale di questo giro di rework: verifica il fix, la non regressione rispetto alla baseline del giro precedente, l'assenza di nuove diagnostiche, e conferma via `archetipo spec show` che tutti i 26 task sono `DONE` prima di richiedere una nuova review.
tasks:
  - id: TASK-01
    title: Contratti dati della giornata e letture autorizzate in src/lib
    type: Impl
    status: DONE
    body: |-
      ## Objective
      La giornata e il contesto di inserimento diventano due DTO serializzabili dichiarati nel contratto condiviso e prodotti da letture che ricevono un collaboratore già autorizzato, così rendering server ed endpoint non potranno divergere.

      ## Read
      - `src/lib/attivita-contract.ts` — stile e commenti di `DatiCalendarioMese`, in particolare il razionale del campo `collaboratoreId` come identità dichiarata dalla risposta e mai accettata dal client.
      - `src/lib/attivita.ts` — `datiCalendarioMesePerCollaboratoreAutorizzato` (modello di lettura autorizzata, righe 205-243), `righeDelGiorno` (254-290), `clientiAttiviPerSelezione` (302-331), `vociRimborsoTrasfertaPerSelezione` (378-398).
      - `src/app/(front-office)/attivita/[data]/page.tsx` — tipi locali `RigaAttivitaClient`, `ClienteSelect`, `VoceRimborsoTrasfertaSelezionabile`, helper `formattaDataISO` e serializzazione delle righe (righe 16-120).
      - `src/app/(front-office)/attivita/page.tsx` — come la pagina calendario riusa la sessione già verificata passandola a `risolviProfiloCollaboratoreCorrente`.
      - `tests/unit/attivita.test.ts` — dalla riga 828, come sono asseriti payload Prisma e guardia `ErroreAutorizzazione`.

      ## Change
      - `src/lib/attivita-contract.ts`: aggiungere `RigaAttivitaClient`, `ClienteSelect`, `VoceRimborsoTrasfertaSelezionabile`, `DatiGiornataAttivita`, `ContestoInserimentoGiornata`.
      - `src/lib/attivita.ts`: aggiungere `righeDelGiornoPerCollaboratoreAutorizzato(dataStr, collaboratoreId)` e `contestoInserimentoPerCollaboratoreAutorizzato(collaboratoreId)`; estrarre due funzioni private riusate dalle esportate esistenti; rimuovere `righeDelGiorno`, che dopo questo task non ha più chiamanti.
      - `src/app/(front-office)/attivita/[data]/page.tsx`: usare le nuove letture, importare i tipi dal contratto, eliminare tipi locali, helper di formattazione e serializzazione inline.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx`: importare i tipi da `@/lib/attivita-contract` invece che da `./page`.

      Non-goal: nessuna nuova route, nessuna modifica a cache, navigazione o markup. `clientiAttiviPerSelezione` e `vociRimborsoTrasfertaPerSelezione` restano esportate con guardia e payload Prisma **invariati**, perché i loro test unit li asseriscono.

      ## Steps
      1. Nel contratto dichiarare `DatiGiornataAttivita` con `data: string`, `collaboratoreId: string`, `righe: RigaAttivitaClient[]`, e `ContestoInserimentoGiornata` con `collaboratoreId: string`, `clienti: ClienteSelect[]`, `vociRimborso: VoceRimborsoTrasfertaSelezionabile[]`. Documentare `collaboratoreId` con lo stesso razionale di `DatiCalendarioMese`.
      2. Spostare nel contratto i tre tipi oggi dichiarati in `page.tsx`, senza cambiarne un solo campo: `ore` resta `number`, `rimborsoTrasfertaImporto` resta `string | null`, `data` resta `YYYY-MM-DD`.
      3. In `attivita.ts` estrarre da `clientiAttiviPerSelezione` e `vociRimborsoTrasfertaPerSelezione` il corpo Prisma in due funzioni private non esportate; le funzioni esportate mantengono guardia, payload ed esito identici.
      4. Implementare `righeDelGiornoPerCollaboratoreAutorizzato`: stessa query di `righeDelGiorno` ma con il `collaboratoreId` ricevuto dal chiamante, più la serializzazione oggi in `page.tsx`. Su data non nel formato `YYYY-MM-DD` restituire il DTO con `righe` vuoto senza interrogare il database, come la lettura mensile fa con un token non valido. Documentare che non è una guardia: l'autorizzazione è responsabilità del chiamante.
      5. Implementare `contestoInserimentoPerCollaboratoreAutorizzato` eseguendo le due letture private in `Promise.all` e restituendo il DTO con il `collaboratoreId` ricevuto.
      6. Rimuovere `righeDelGiorno` e il suo import in `page.tsx`.
      7. In `page.tsx` risolvere il profilo con la sessione già verificata e chiamare in `Promise.all` le due nuove letture con `profilo.collaboratore.id`; passare i DTO a `<DettaglioGiornata>` mantenendo per ora props, `key={dataStr}` e breadcrumb invariati.
      8. Aggiornare l'import dei tipi in `dettaglio-giornata.tsx`.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica, come in baseline.
      - Run: `npm test`
      - Expect: 38 file e 607 test verdi come in baseline; nessun test rimosso, perché `righeDelGiorno` non ne aveva.
      - Run: `npm run lint`
      - Expect: eslint senza errori e messaggio «✅ Guardrail e2e anti-flakiness passed».
      - Run: `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts --retries=0`
      - Expect: 2 test passati, come in baseline, con il file di test non modificato.

      ## Done
      - [ ] AC-8 — il caricamento diretto di `/attivita/[data]` continua a essere servito dal server con lo stesso contenuto osservabile: intestazione, righe e breadcrumb invariati nella suite e2e esistente.
      - [ ] `DatiGiornataAttivita` e `ContestoInserimentoGiornata` sono dichiarati nel contratto condiviso e prodotti in un unico punto del codice.
      - [ ] Nessuna nuova diagnostica TypeScript o eslint sui file toccati.

      ## Blockers
      None.
