  - id: TASK-07
    title: Provider di cache dell'area attività con mesi, giornate e contesto
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Objective
      Il provider dell'area attività monta le tre cache sulla stessa guardia d'identità e le espone ai consumer, con un solo canale di notifica per la sessione non più valida.

      ## Read
      - `src/app/(front-office)/attivita/calendario-cache-provider.tsx` — intero file: contenitore, `leggiMeseDaEndpoint`, trattamento di 401, 403 e risposta reindirizzata, `ErroreSessioneCalendario`, API esposta, effetto di smontaggio.
      - `src/app/(front-office)/attivita/layout.tsx` — montaggio con `key` uguale all'id utente.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — uso di `useCacheCalendario` e `ErroreSessioneCalendario`.

      ## Change
      - Rinominare `calendario-cache-provider.tsx` in `attivita-cache-provider.tsx`; il componente diventa `AttivitaCacheProvider` e l'errore `ErroreSessioneCalendario` diventa `ErroreSessioneAttivita`.
      - Aggiornare gli import in `layout.tsx`, `calendario-mensile.tsx` e `[data]/dettaglio-giornata.tsx`.
      - Il provider crea una `GuardiaIdentitaScheda` per contenitore, vi registra le tre cache ed espone `useCacheCalendario` con forma invariata, più `useCacheGiornate` e `useCacheContestoInserimento`.

      Non-goal: nessuna modifica al comportamento del calendario; la chiave di sessione e lo svuotamento all'uscita dall'area restano quelli attuali; nessuna modifica ai test esistenti.

      ## Steps
      1. Rinominare il file con `git mv` e rinominare i due simboli; aggiornare ogni import segnalato da `npx tsc --noEmit`. Il file `tests/unit/calendario-cache-provider.test.ts` importa da `calendario-cache` e non va toccato.
      2. Nel contenitore creare la guardia e passarla alle tre cache; l'unica callback di cambio identità della guardia notifica gli ascoltatori di sessione già esistenti.
      3. Aggiungere due caricatori accanto a quello del mese: uno verso `/api/attivita/giornata` con il parametro `data` codificato, uno verso `/api/attivita/contesto-inserimento`. Entrambi replicano il trattamento già usato per il mese: su 401, 403 o risposta reindirizzata svuotano **tutte** le cache del contenitore, notificano gli ascoltatori e lanciano `ErroreSessioneAttivita`; su altro esito non ok lanciano un errore ordinario, recuperabile con un nuovo tentativo.
      4. L'effetto di smontaggio deve svuotare tutte e tre le cache.
      5. Esporre le tre API con la stessa forma odierna (`seed`, `read`, `load`, `revalida`, `prefetch`, `invalidate`, `clear`, `subscribe`), con `subscribeSessioneScaduta` una sola volta a livello di contenitore, condivisa dai consumer.
      6. I metodi esposti devono restare stabili fra un render e l'altro, come oggi, per non ridisegnare le route figlie.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica e nessun import residuo del vecchio nome di file o di simbolo.
      - Run: `npm run lint`
      - Expect: eslint senza errori e guardrail e2e passato.
      - Run: `npm test`
      - Expect: verde come baseline, con `tests/unit/calendario-cache-provider.test.ts` non modificato.
      - Run: `npx playwright test tests/e2e/calendario-cache-mesi.spec.ts --retries=0`
      - Expect: tutti i test verdi: il calendario continua a non produrre alcuna richiesta sul ritorno a un mese già visitato e continua a gestire il cambio account con navigazione documentale.

      ## Done
      - [ ] AC-7 — le tre cache condividono una sola identità di scheda e un solo canale di notifica di sessione non più valida.
      - [ ] AC-1, AC-3 — i consumer possono leggere giornate e contesto dalla cache della scheda.
      - [ ] Il comportamento del calendario è invariato, provato dalla sua suite e2e senza modifiche.

      ## Blockers
      None.
