  - id: TASK-08
    title: 'Isola client della giornata: navigazione dalla cache, attesa e History API'
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Il cambio giorno diventa un commit client dalla cache delle giornate, con l'URL scritto solo a dati pronti, il contenuto precedente visibile durante l'attesa e il form azzerato ad ogni giorno.

      ## Read
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — modello da riusare: interfaccia `IntentoNavigazione`, `commit`, `vaiA`, sincronizzazione con il payload server durante il render, gestione di `popstate`, prefetch dei mesi adiacenti, overlay con `aria-busy`, attributo `data-idratata` e hook `useIdratata`.
      - `src/app/(front-office)/attivita/[data]/page.tsx` — breadcrumb, `key={dataStr}`, props passate al client component.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — barra `controllo-cambio-giorno` (righe 528-580), `vaiAlGiorno`, `vaiAGiornoPrecedente`, `vaiAGiornoSuccessivo`, e il commento alle righe 445-455 sul reset del form affidato al remount.
      - `src/domain/calendario/index.ts` — `giornoSpostatoDi` e `parseDataGiorno`.
      - `node_modules/next/dist/docs/01-app/01-getting-started/04-linking-and-navigating.md`, sezione «Native History API» — conferma che `pushState` è integrato nel router e sincronizzato con `usePathname`.

      ## Change
      - Nuovo `src/app/(front-office)/attivita/[data]/isola-giornata.tsx`, client component.
      - `src/app/(front-office)/attivita/[data]/page.tsx`: rende l'isola passando i due DTO iniziali e il token mese; il breadcrumb si sposta nell'isola; il `key` sul componente di dettaglio non è più responsabilità della pagina.
      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx`: perde la barra di navigazione, `useRouter` e la `useTransition` usata per la navigazione; riceve `data`, `righe`, `clienti`, `vociRimborso` e una callback `onMutazioneCompletata` che in questo task può essere ancora quella attuale, e viene ricablata in TASK-09.

      Non-goal: nessuna modifica al form, alle sue validazioni, ai suoi messaggi o al contratto URL. Nessun prefetch di giorni non adiacenti: il salto lontano dal selettore data resta un miss.

      ## Steps
      1. L'isola possiede: giornata visualizzata, contesto, flag di caricamento, errore, ultimo payload server ricevuto e l'intento corrente in un `useRef`, esattamente come il calendario.
      2. `commit(intento, dati)` aggiorna la giornata mostrata, spegne attesa ed errore e, se l'intento chiede di registrare la cronologia, scrive l'URL con `window.history.pushState`. L'URL è `/attivita/` seguito dalla data e, quando la pagina è stata aperta con un token mese, dal parametro `mese` calcolato sul giorno di **destinazione**: è la regola già presente oggi in `vaiAlGiorno` e va conservata, altrimenti attraversando un confine di mese il breadcrumb punterebbe al mese sbagliato.
      3. `vaiA(intento)`: senza provider resta `router.push`. Con provider si legge la cache: su hit commit sincrono e, se la voce è scaduta, una sola rivalidazione in background; su miss si accende l'attesa e si invoca il caricamento, con commit soltanto se l'intento corrente punta ancora a quella destinazione, così una risposta tardiva non ruba la scena. Su `ErroreSessioneAttivita` non mostrare alcun errore recuperabile: la navigazione completa è gestita dalla sottoscrizione di sessione.
      4. La barra `controllo-cambio-giorno` si sposta nell'isola conservando identici `data-testid` e nomi accessibili: `controllo-cambio-giorno`, `selettore-giorno`, label «Vai al giorno», pulsanti «Giorno precedente» e «Giorno successivo». Va rimosso l'attributo disabilitante legato alla transizione: i click rapidi incatenano gli intenti a partire dall'intento corrente, come le frecce del calendario. Il valore del selettore si riallinea **durante il render** al giorno mostrato, con lo stesso schema del campo mese del calendario, mai in un effetto.
      5. Il contenuto della giornata è avvolto in un contenitore con `data-testid` uguale a `contenuto-giornata`, attributo `aria-busy` legato al flag di caricamento e attributo `data-idratata` valorizzato da `useIdratata`, indispensabile perché i test possano attendere l'idratazione prima di cliccare i controlli.
      6. Durante il miss compare un indicatore con `data-testid` uguale a `indicatore-caricamento-giornata`, ruolo `status`, testo per screen reader e il keyframe `comparsa-caricamento` già usato dal calendario, sovrapposto al contenuto precedente, che resta visibile.
      7. Su errore di lettura mostrare un banner con ruolo `alert` e `data-testid` uguale a `errore-caricamento-giornata`, con un pulsante «Riprova» che richiama `vaiA` sull'intento corrente, lasciando visibile la giornata precedente.
      8. Rendere il componente di dettaglio con `key` uguale alla data della giornata mostrata: il remount resta il meccanismo che azzera il form ad ogni cambio giorno. Il breadcrumb «Torna al calendario» resta un `Link` con lo stesso nome accessibile e con href calcolato sul giorno mostrato.
      9. Sincronizzazione con il payload server: quando il DTO iniziale cambia identità, adottarlo **solo se coerente con l'URL corrente**, cioè solo se `usePathname()` corrisponde a `/attivita/` seguito dalla data di quel DTO; altrimenti limitarsi a seminarlo in cache senza spostare la vista. Senza questa condizione una `revalidatePath` di server action, che rigenera l'albero RSC del giorno da cui l'utente è partito, riporterebbe la vista su quel giorno mentre l'utente ne sta guardando un altro. L'allineamento avviene durante il render, non in un effetto.
      10. Seminare in un effetto la giornata iniziale e il contesto iniziale nelle rispettive cache e allineare l'intento corrente.
      11. Gestire `popstate`: leggere il pathname corrente e, solo se corrisponde a `/attivita/` seguito da una data in formato `YYYY-MM-DD`, richiamare `vaiA` senza registrare cronologia; altrimenti non fare nulla e lasciare che sia il router di Next a gestire quella voce.
      12. Dopo ogni commit, prefetch dei soli giorni adiacenti calcolati con `giornoSpostatoDi`, con errori silenziosi.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica.
      - Run: `npm run lint`
      - Expect: eslint senza errori, incluse le regole sui hook, e guardrail e2e passato.
      - Run: `npm test`
      - Expect: verde come baseline.
      - Run: `npm run build`
      - Expect: build completata, con `/attivita/[data]` ancora dinamica.
      - Run: `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts tests/e2e/calendario-cache-mesi.spec.ts --retries=0`
      - Expect: tutti verdi. La prima è la suite di AC-8 e non va modificata; la seconda prova che il calendario non ha regredito e che il percorso dalla cella del calendario al dettaglio giornata e ritorno continua a funzionare.

      ## Done
      - [ ] AC-2 — sul giorno non ancora in cache resta visibile il contenuto precedente con `aria-busy` a `true` e l'indicatore, e l'URL cambia soltanto dentro `commit`.
      - [ ] AC-5 — il componente di dettaglio è montato con `key` sul giorno mostrato, quindi lo stato del form riparte azzerato ad ogni cambio giorno.
      - [ ] AC-6 — `popstate` gestisce soltanto gli URL di giornata e non registra nuove voci di cronologia.
      - [ ] AC-8 — contratto URL invariato e suite `cambio-rapido-giorno-dettaglio.spec.ts` verde senza modifiche al file.

      ## Blockers
      None.
