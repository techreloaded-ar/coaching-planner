    body: |-
      ## Objective
      Il percorso di sessione scaduta (401/403 tradotti in `ErroreSessioneAttivita`, svuotamento delle tre cache, notifica agli ascoltatori) è provato a livello unit sul contenitore reale del provider, colmando l'unica parte di AC-7 rimasta implementata ma mai verificata da alcun test.

      ## Read
      - `src/app/(front-office)/attivita/attivita-cache-provider.tsx:212-268` — `creaContenitoreCacheAttivita` (esportata come "cucitura di verifica"), `abbandonaSessione`, `svuotaTutteLeCache`.
      - `src/app/(front-office)/attivita/attivita-cache-provider.tsx:279-303` — `leggiDaEndpoint`: mappa 401/403/`redirected` su `ErroreSessioneAttivita` e chiama `abbandonaSessione` **prima** di lanciare l'errore.
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:385-394` — il consumer che, alla notifica di sessione scaduta, esegue `window.location.reload()`: non va replicato nel test, la reviewer indica esplicitamente che la verifica sul provider è sufficiente e più stabile di una verifica e2e su questo ramo.
      - `tests/unit/cache-dati-scheda.test.ts:329-362` — `describe("Contenitore delle cache dell'area attività", ...)`, in particolare il test esistente che usa `vi.stubGlobal("fetch", ...)` e `creaContenitoreCacheAttivita("sessione-di-prova")`: stesso seam, stesso stile di mock, da riusare invariato.

      ## Change
      - `tests/unit/cache-dati-scheda.test.ts`: due nuovi `it(...)` dentro `describe("Contenitore delle cache dell'area attività", ...)`, dopo il test esistente. Aggiungere `ErroreSessioneAttivita` all'import già presente da `@/app/(front-office)/attivita/attivita-cache-provider`.

      Non-goal: non testare `window.location.reload()` né montare `isola-giornata.tsx`: il confine da provare è il provider, non il consumer React.

      ## Steps
      1. `it("una sessione scaduta (401) svuota le tre cache e notifica una sola volta gli ascoltatori di sessione", async () => { ... })`: `vi.stubGlobal("fetch", vi.fn(async () => new Response(null, { status: 401 })));`. Creare `const contenitore = creaContenitoreCacheAttivita("sessione-401");`, registrare `const sessioneNonPiuValida = vi.fn(); contenitore.ascoltatoriSessione.add(sessioneNonPiuValida);`. Seminare le tre cache con dati fittizi del collaboratore proprietario (`giornataFittizia`, `contestoFittizio`, `meseFittizio`, già definite nel file). Asserire `await expect(contenitore.cacheGiornate.load("2026-06-11")).rejects.toBeInstanceOf(ErroreSessioneAttivita);` e, sull'errore catturato con un secondo `try/catch` o `.catch`, che `statusCode` sia `401`. Dopo il rigetto, asserire `contenitore.cacheGiornate.read(...)`, `contenitore.cacheContesto.read()`, `contenitore.cacheMesi.read(...)` tutti `null`, e `sessioneNonPiuValida` chiamato esattamente una volta.
      2. `it("una sessione con profilo non operativo (403) produce lo stesso abbandono", async () => { ... })`: stessa struttura con `new Response(null, { status: 403 })`, asserendo `statusCode` uguale a `403` e lo stesso svuotamento e la stessa singola notifica.
      3. In entrambi i test usare `afterEach(() => vi.unstubAllGlobals())`, già presente nel blocco `describe`, quindi non serve ripeterlo.
      4. Non usare timer reali né `waitFor`: la promise si stabilizza nel prossimo microtask, `await expect(...).rejects...` è sufficiente.

      ## Verify
