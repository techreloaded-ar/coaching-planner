  - id: TASK-19
    title: Fix rework — revalida non risolve più con un dato che la guardia d'identità ha rifiutato
    type: Fix
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-08
    body: |-
      ## Objective
      `CacheDatiScheda.revalida` rigetta con un errore esplicito quando la guardia d'identità rifiuta la scrittura della risposta appena arrivata, invece di risolvere comunque con quel dato: il contratto della cache smette di essere fail-open proprio nel punto che esiste per essere fail-closed, per la cache delle giornate come per quella dei mesi, che eredita lo stesso metodo.

      ## Read
      - `src/app/(front-office)/attivita/cache-dati-scheda.ts:302-329` — `revalida`, in particolare `.then((dati) => { if (epoca invariata) { this.scrivi(chiave, dati); } return dati; })`: `scrivi` può rifiutare silenziosamente (riga 356-374, `if (!this.guardia.verifica(...)) return;`) mentre `revalida` risolve comunque.
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:213-237` — `vaiA`, ramo miss: `cacheGiornate.load(destinazione)` propaga direttamente la promise di `revalida` quando la voce non è in cache; il `.catch` a riga 223-236 ignora oggi solo `ErroreSessioneAttivita`.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx:184-211` — lo stesso pattern `vaiA`/`commit`/`.catch` per il calendario mensile, che eredita lo stesso `CacheDatiScheda.revalida` tramite `CacheCalendarioMesi`: la stessa lacuna esiste già lì, segnalato dal reviewer come nota a margine di AC-7.
      - `tests/unit/cache-dati-scheda.test.ts:184-226` (`cacheGiornate.load("2026-06-11")).resolves.toEqual(giornataDiAltri)`), `:228-272` (`cacheMesi.load("2026-07")).resolves.toEqual(meseDiAltri)`), `:334-361` (`contenitore.cacheMesi.load("2026-07")).resolves.toEqual(meseDiAltri)`): le tre asserzioni che oggi provano — e quindi fissano come contratto — il comportamento fail-open che questo task corregge.

      ## Change
      - `src/app/(front-office)/attivita/cache-dati-scheda.ts`: `scrivi` (righe 356-374) e `revalida` (righe 302-329); nuova classe esportata `ErroreIdentitaSchedaCambiata`.
      - `src/app/(front-office)/attivita/attivita-cache-provider.tsx`: re-esportare `ErroreIdentitaSchedaCambiata` accanto a `ErroreSessioneAttivita`.
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx`: import e catch di `vaiA` (riga ~226).
      - `src/app/(front-office)/attivita/calendario-mensile.tsx`: import e catch di `vaiA` (riga ~202).
      - `tests/unit/cache-dati-scheda.test.ts`: le tre asserzioni elencate sopra, più l'import di `ErroreIdentitaSchedaCambiata`.

      Non-goal: non toccare `load` né `prefetch`, che già ignorano gli errori di `revalida` con un `.catch(() => undefined)` e restano corretti così; non toccare `seed`, che ignora il valore di ritorno di `scrivi` per costruzione (la semina iniziale non ha un chiamante da far fallire).

      ## Steps
      1. In `cache-dati-scheda.ts`, dopo la classe `GuardiaIdentitaScheda`, aggiungere:
         ```ts
         /**
          * Il caricatore ha risposto con dati di un'altra identità: la guardia ha già
          * svuotato tutte le cache della scheda e notificato il cambio. La scrittura è
          * stata rifiutata — nessun chiamante di `revalida` deve ricevere quel dato
          * come se fosse stato scritto.
          */
         export class ErroreIdentitaSchedaCambiata extends Error {
           constructor() {
             super(
               "La risposta appartiene a un'altra identità: scrittura rifiutata dalla guardia della scheda."
             );
             this.name = "ErroreIdentitaSchedaCambiata";
           }
         }
         ```
      2. Cambiare la firma di `scrivi` da `private scrivi(chiave: string, dati: T): void` a `private scrivi(chiave: string, dati: T): boolean`; nel ramo di rifiuto della guardia, `return false;` al posto di `return;`; alla fine del metodo (dopo `this.notifica(chiave);`), `return true;`.
      3. In `revalida`, nel `.then`, sostituire
         ```ts
         if ((this.epoche.get(chiave) ?? 0) === epocaAllAvvio) {
           this.scrivi(chiave, dati);
         }
         return dati;
         ```
         con
         ```ts
         if ((this.epoche.get(chiave) ?? 0) === epocaAllAvvio) {
           if (!this.scrivi(chiave, dati)) {
             throw new ErroreIdentitaSchedaCambiata();
           }
         }
         return dati;
         ```
         Il ramo "epoca cambiata" (invalidazione in volo) resta invariato: non chiama `scrivi`, quindi non lancia mai questo errore.
      4. In `attivita-cache-provider.tsx`, cambiare `import { GuardiaIdentitaScheda } from "./cache-dati-scheda";` in `import { ErroreIdentitaSchedaCambiata, GuardiaIdentitaScheda } from "./cache-dati-scheda";` e aggiungere `export { ErroreIdentitaSchedaCambiata };` accanto alla dichiarazione/esportazione esistente di `ErroreSessioneAttivita`.
      5. In `isola-giornata.tsx`, aggiungere `ErroreIdentitaSchedaCambiata` all'import da `"../attivita-cache-provider"` e, nel `.catch` di `vaiA` (riga ~226), aggiungere subito dopo `if (causa instanceof ErroreSessioneAttivita) return;` la riga `if (causa instanceof ErroreIdentitaSchedaCambiata) return;` con un commento che spiega: la guardia ha già svuotato le cache e sta per far ricaricare la pagina tramite il canale di sessione, qui non c'è nulla di recuperabile da mostrare.
      6. Applicare la stessa modifica a `calendario-mensile.tsx` (import + riga equivalente nel proprio `.catch`, riga ~202).
      7. In `tests/unit/cache-dati-scheda.test.ts`, aggiungere `ErroreIdentitaSchedaCambiata` all'import da `@/app/(front-office)/attivita/cache-dati-scheda`.
      8. Sostituire `await expect(cacheGiornate.load("2026-06-11")).resolves.toEqual(giornataDiAltri);` (riga ~205) con `await expect(cacheGiornate.load("2026-06-11")).rejects.toBeInstanceOf(ErroreIdentitaSchedaCambiata);` — le asserzioni successive dello stesso test (cache vuote, guardia azzerata, notifica singola) restano invariate, perché lo svuotamento avviene sincronamente dentro `scrivi` prima del rigetto.
