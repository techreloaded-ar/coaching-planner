  - id: TASK-17
    title: 'Test rework — e2e: click su Giorno precedente durante un miss verso il giorno successivo non duplica la cronologia'
    type: Test
    status: DONE
    dependencies:
      - TASK-16
    body: |-
      ## Objective
      Uno scenario e2e riproduce esattamente la corsa segnalata dal reviewer (click su "Giorno successivo" verso un giorno mai visitato, poi subito click su "Giorno precedente" mentre la risposta è ancora in volo) e prova che `window.history.length` non cresce, verificando così il fix di TASK-16 sul caso reale che lo ha motivato.

      ## Read
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts:76-83` — `cancelloRilasciabile()`, il pattern di attesa controllata dal test.
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts:319-390` — lo scenario "sul giorno mai visitato...", stesso pattern `page.route` + `cancelloRilasciabile` su un endpoint specifico da riusare.
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts:248-317` — lo scenario Indietro/Avanti, per lo stile di asserzione su `window.history.length`.
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:344-350` — l'effetto di prefetch dei giorni adiacenti dopo ogni commit: il giorno successivo a quello raggiunto da `page.goto` viene prefetchato automaticamente, quindi la richiesta da trattenere è quella del prefetch, non una richiesta scatenata direttamente dal click.

      ## Change
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts`: un nuovo `test(...)` dentro `test.describe("US-056 Cambio giorno servito dalla cache delle giornate", ...)`, dopo lo scenario Indietro/Avanti esistente.

      Non-goal: non modificare gli scenari esistenti né gli helper condivisi (`rispostaGiornata`, `cancelloRilasciabile`, `attendiGiornataIdratata`, `attendiGiornataPopolata`).

      ## Steps
      1. Riservare `const mese = meseRiservato(\`${CODICE_SPEC}-cronologia-corsa\`);` (verificato in planning: non collide con nessuna chiave nota né con quelle allowlistate da TASK-15).
      2. `const giornoPartenza = dataNelMese(mese, 15);` e `const giornoSuccessivo = dataNelMese(mese, 16);`.
      3. Creare un cliente con offerta e popolare `giornoPartenza` con `creaGiornataConDueRighe`; lasciare `giornoSuccessivo` e il giorno precedente a `giornoPartenza` vuoti, come da convenzione del file.
      4. **Prima** di `accediComeCollaboratore`/`page.goto`, registrare `const cancelloSuccessivo = cancelloRilasciabile();` e `await page.route((url) => url.pathname === "/api/attivita/giornata" && url.searchParams.get("data") === giornoSuccessivo, async (route) => { await cancelloSuccessivo.attesa; await route.continue(); });` — così anche il prefetch automatico verso `giornoSuccessivo` resta trattenuto, non solo un'eventuale richiesta scatenata dal click.
      5. `await page.goto(\`/attivita/${giornoPartenza}\`)`, `attendiGiornataIdratata`, `attendiGiornataPopolata(page, giornoPartenza, clienteConOfferta)`.
      6. `const vociCronologiaPrima = await page.evaluate(() => window.history.length);`.
      7. Click su `page.getByRole("button", { name: "Giorno successivo" })`. Asserire `await expect(page.getByTestId("indicatore-caricamento-giornata")).toBeVisible();` (prova, senza hard wait, che il miss è in corso: la richiesta trattenuta dal prefetch è quella deduplicata dal click, per il single-flight della cache).
      8. Subito dopo, click su `page.getByRole("button", { name: "Giorno precedente" })`, **senza rilasciare il cancello**.
      9. Asserire `await expect(intestazioneGiornata(page)).toHaveText(etichettaGiornoAttesa(giornoPartenza), { ignoreCase: true });` e `await expect(page).toHaveURL(\`/attivita/${giornoPartenza}\`);` — il ritorno a `giornoPartenza` è un hit sincrono di cache.
      10. Asserire `expect(await page.evaluate(() => window.history.length)).toBe(vociCronologiaPrima);` — con il fix di TASK-16 nessuna voce viene aggiunta, perché l'URL di destinazione coincide già con quello corrente.
      11. Rilasciare il cancello: `cancelloSuccessivo.rilascia();`.
      12. Asserire che nulla cambia dopo il rilascio: `await expect(page).toHaveURL(\`/attivita/${giornoPartenza}\`);`, `expect(await page.evaluate(() => window.history.length)).toBe(vociCronologiaPrima);`, e che le righe mostrate restino quelle di `giornoPartenza` (`attendiGiornataPopolata`) — la risposta tardiva del giorno abbandonato non deve toccare né vista né cronologia.
      13. `await page.unroute(...)` sul predicato usato al passo 4.

      ## Verify
      - Run: `npx playwright test tests/e2e/giornata-cache-cambio-giorno.spec.ts --retries=0`
      - Expect: tutti gli scenari del file verdi, incluso quello nuovo. Senza il fix di TASK-16 il nuovo scenario fallisce sull'asserzione del passo 10 (`history.length` cresciuto di 1); con il fix passa.
      - Run: `npm run lint`
      - Expect: verde, guardrail e2e compreso (nessun hard wait, nessuna classe Tailwind, dati da factory su mese riservato).

      ## Done
      - [ ] AC-6 — la corsa reale segnalata dal reviewer (click "successivo" in miss, click immediato "precedente") è riprodotta e provata a `history.length` invariato, non solo asserita a parole.
      - [ ] Lo scenario fallisce in modo deterministico se il fix di TASK-16 viene rimosso (verificato eseguendolo su una copia locale di `isola-giornata.tsx` senza la guardia, se necessario per la propria fiducia nel test; non è un passo bloccante per il completamento del task).

      ## Blockers
      None.
