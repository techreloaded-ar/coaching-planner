  - id: TASK-25
    title: Fix rework — race di rinnovo sessione fra prefetch giorni adiacenti e switch account rende AC-7 non deterministico
    type: Fix
    status: DONE
    dependencies:
      - TASK-24
    body: |-
      ## Objective
      Lo scenario e2e "dopo un accesso con un altro account il dettaglio giorno non mostra i dati del collaboratore precedente" (AC-7) diventa deterministico: attendendo le risposte dei due prefetch dei giorni adiacenti prima dello switch di sessione si elimina la race per cui il rinnovo sliding del cookie, innescato da quelle risposte tardive, può resuscitare la sessione del primo collaboratore dopo lo switch.

      ## Read
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts:673-737` — lo scenario, con lo switch di sessione via `fetch("/api/e2e-test/sessione")` alle righe 715-722 e l'oracolo di navigazione completa alle righe 726-737.
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts:98-106` — helper `rispostaGiornata(page, data)`, già usato altrove nella stessa suite (righe 201-206) per attendere la risposta di un prefetch prima di procedere.
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:358-362` — l'effetto che avvia, subito dopo il commit del giorno mostrato, il prefetch dei due giorni adiacenti (`giornoSpostatoDi(giornoVisualizzato, -1)` e `(+1)`) tramite `cacheGiornate.prefetch`.
      - `src/proxy.ts:44-52` — `verificaERinnovaTokenSessione` + `applicaRinnovo`: ogni richiesta protetta (comprese le GET di prefetch) rinnova e re-imposta il cookie di sessione in base al cookie con cui la richiesta è partita, non a quello attualmente nel browser.
      - Diagnosi riprodotta in planning: `npx playwright test tests/e2e/giornata-cache-cambio-giorno.spec.ts -g "dopo un accesso con un altro account" --repeat-each=3 --retries=0` fallisce in modo intermittente (1 fallimento su 3 osservato in planning) con `page.waitForResponse: Test timeout of 30000ms exceeded` sull'oracolo di navigazione documentale, perché i due prefetch avviati al mount con il cookie del primo collaboratore sono ancora in volo quando lo switch avviene.

      ## Change
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts`: solo lo scenario alle righe 673-737 ("dopo un accesso con un altro account..."). Nessun'altra riga del file, nessun file di produzione.

      Non-goal: non modificare `src/proxy.ts` né la politica di rinnovo sliding della sessione — è trasversale a ogni rotta protetta dell'app e cambiarla eccede il perimetro di un fix mirato a questo scenario e2e; la correzione qui applicata è quella esplicitamente proposta come alternativa dal reviewer (rendere il test deterministico attendendo i prefetch) e ricalca un pattern già presente nella stessa suite.

      ## Steps
      1. Subito dopo `await accediComeCollaboratore(page, primoCollaboratore.utente.email);` (riga 705) e prima di `page.goto`, registrare due promise con l'helper esistente `rispostaGiornata`: una per `dataNelMese(mese, 10)` (il giorno precedente a `giornoCondiviso`) e una per `dataNelMese(mese, 12)` (il giorno successivo) — `giornoCondiviso` è `dataNelMese(mese, 11)`, quindi 10 e 12 sono esattamente i due giorni che l'effetto di prefetch dell'isola richiede al mount.
      2. Dopo `page.goto`, `attendiGiornataIdratata` e l'asserzione sul contenuto del primo collaboratore (righe 706-710, invariate), attendere `Promise.all` delle due promise registrate al passo 1, prima del blocco che esegue lo switch di sessione (riga 715).
      3. Non toccare il blocco dello switch di sessione (715-722) né l'oracolo di navigazione documentale (726-737): la correzione riguarda solo il momento in cui lo switch viene eseguito, non il suo meccanismo.
      4. Aggiungere un breve commento che spiega perché si attendono questi due prefetch (rinnovo sliding del cookie che potrebbe resuscitare la sessione precedente se le loro risposte arrivassero dopo lo switch), così un lettore futuro non li rimuova come codice morto.

