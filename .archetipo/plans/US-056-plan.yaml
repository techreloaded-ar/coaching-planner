  - id: TASK-03
    title: Macchina di cache di scheda generalizzata, guardia d'identità condivisa e cache di giornata e contesto
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Estrarre da `CacheCalendarioMesi` una macchina di cache riusabile e una guardia d'identità condivisibile fra più cache della stessa scheda, e specializzarla per giornate e contesto di inserimento, senza cambiare il comportamento del calendario.

      ## Read
      - `src/app/(front-office)/attivita/calendario-cache.ts` — intera classe: `seed`, `read`, `load`, `revalida`, `prefetch`, `invalidate`, `clear`, `scrivi`, epoche, espulsione LRU, guardia d'identità.
      - `tests/unit/calendario-cache-provider.test.ts` — righe 1-80: la firma di costruttore usata dai test (`caricatore`, `orologio`, `durataFreshMs`, `massimoMesi`, `onIdentitaCambiata`) e i comportamenti che devono restare identici.
      - `src/lib/attivita-contract.ts` — i DTO introdotti da TASK-01.

      ## Change
      - Nuovo `src/app/(front-office)/attivita/cache-dati-scheda.ts`: `CacheDatiScheda<T>` generica su un DTO che dichiara `collaboratoreId`, più `GuardiaIdentitaScheda` e la costante `DURATA_FRESH_MS`.
      - `src/app/(front-office)/attivita/calendario-cache.ts`: ridotto alla specializzazione `CacheCalendarioMesi` e a `MASSIMO_MESI_IN_CACHE`, con re-export di `DURATA_FRESH_MS` per non rompere gli import esistenti.
      - Nuovo `src/app/(front-office)/attivita/giornata-cache.ts`: `CacheGiornateAttivita`, `CacheContestoInserimento`, `MASSIMO_GIORNATE_IN_CACHE` uguale a 31 e `CHIAVE_CONTESTO_INSERIMENTO`.

      Non-goal: nessuna modifica ai test esistenti, al provider, al calendario o alle route. La firma pubblica di `CacheCalendarioMesi` non cambia.

      ## Steps
      1. Spostare la classe in `cache-dati-scheda.ts` rendendola generica su `T` e aggiungendo due opzioni: `chiaveDi`, funzione che ricava la chiave dal DTO ed è usata da `seed`, e `massimoVoci`.
      2. Estrarre l'identità in `GuardiaIdentitaScheda`, che espone `registra`, `verifica` e `reset`. `verifica(collaboratoreId)` restituisce falso quando l'identità già registrata è diversa: in quel caso svuota **tutte** le cache registrate, azzera la propria identità e invoca una sola volta la callback di cambio identità.
      3. In `CacheDatiScheda` accettare una `guardia` opzionale. Se assente, crearne una privata inizializzata con `onIdentitaCambiata`: così comportamento e firma odierni di `CacheCalendarioMesi` restano identici. In `scrivi`, prima di scrivere, interrogare la guardia e uscire senza scrivere quando risponde negativamente.
      4. `clear` deve continuare a incrementare le epoche dei token presenti e di quelli in volo e ad azzerare l'identità nella guardia, così una risposta già partita non può ripopolare la cache.
      5. In `calendario-cache.ts` lasciare `CacheCalendarioMesi` come sottoclasse di `CacheDatiScheda` con chiave ricavata da `token` e massimo ricavato dall'opzione `massimoMesi`, mantenendo il nome di quell'opzione per i test esistenti.
      6. In `giornata-cache.ts` definire `CacheGiornateAttivita` con chiave ricavata da `data` e massimo `MASSIMO_GIORNATE_IN_CACHE`, e `CacheContestoInserimento` con chiave costante `CHIAVE_CONTESTO_INSERIMENTO` e massimo 1. Entrambe accettano la guardia condivisa.

      ## Verify
      - Run: `npx vitest run tests/unit/calendario-cache-provider.test.ts`
      - Expect: tutti i test del file verdi **senza alcuna modifica al file**. È la prova che la generalizzazione non ha cambiato semantica: bordo esatto dei 300 000 ms, singola rivalidazione, deduplica, espulsione LRU, invalidazione di risposte in volo, svuotamento e guardia d'identità.
      - Run: `npm test`
      - Expect: 38 file e 607 test verdi, come in baseline.
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica.
      - Run: `npm run lint`
      - Expect: eslint senza errori e guardrail e2e passato.

      ## Done
      - [ ] La cache dei mesi conserva ogni comportamento provato dai test esistenti, che non vengono toccati.
      - [ ] AC-7 — `GuardiaIdentitaScheda` può essere condivisa da più cache e le svuota tutte quando l'identità cambia.
      - [ ] AC-1, AC-3 — esistono le cache specializzate di giornata (LRU 31) e di contesto (voce singola) sulla stessa finestra fresca di 300 secondi.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Unit sulla guardia condivisa e sulle cache di giornata e contesto
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Provare con orologio e caricatore iniettati che la guardia condivisa svuota tutte le cache registrate e che le cache di giornata e contesto hanno chiave, finestra fresca ed espulsione attese.

      ## Read
      - `tests/unit/calendario-cache-provider.test.ts` — righe 1-140: orologio controllabile, caricatore iniettato, asserzioni sui dati restituiti e non solo sulle chiamate.
      - `src/app/(front-office)/attivita/cache-dati-scheda.ts` e `src/app/(front-office)/attivita/giornata-cache.ts`.

      ## Change
      - Nuovo `tests/unit/cache-dati-scheda.test.ts`.

      Non-goal: non duplicare i casi già coperti per i mesi. Qui si prova ciò che è nuovo: guardia condivisa, chiave della giornata, cache a voce singola del contesto.

      ## Steps
      1. Guardia condivisa: registrare una `CacheGiornateAttivita` e una `CacheContestoInserimento` sulla stessa `GuardiaIdentitaScheda`; seminarle entrambe con un primo collaboratore; far arrivare al caricatore della giornata una risposta che dichiara un secondo collaboratore. Asserire che la lettura di **entrambe** restituisce `null`, che il dato del secondo collaboratore non diventa leggibile e che la callback di cambio identità è invocata una sola volta con il nuovo id.
      2. Asserire il caso simmetrico: una risposta dello stesso collaboratore non svuota nulla e le due cache restano leggibili con i dati attesi.
      3. Asserire che dopo lo svuotamento entrambe accettano la nuova identità e tornano leggibili.
      4. Giornata: `seed` indicizza per `data`; a un millisecondo prima della scadenza la lettura non invoca il caricatore; al bordo esatto di `DURATA_FRESH_MS` la voce è scaduta e tre letture consecutive producono **una sola** rivalidazione; superato `MASSIMO_GIORNATE_IN_CACHE` viene espulsa la voce meno recentemente usata e non quella appena scritta.
      5. Contesto: `seed` usa sempre la chiave costante, quindi due semine consecutive non fanno crescere la cache oltre una voce; `revalida` forza la lettura anche su una voce ancora fresca; una invalidazione neutralizza una risposta già in volo, che non ripopola la voce.
      6. Nessun timer reale e nessuna attesa: il tempo è iniettato.

      ## Verify
      - Run: `npx vitest run tests/unit/cache-dati-scheda.test.ts`
      - Expect: tutti i nuovi test verdi, in meno di un secondo, senza timer reali.
      - Run: `npm test`
      - Expect: nessuna regressione; totale maggiore o uguale a 607 test, tutti verdi.

      ## Done
      - [ ] AC-7 — una risposta che dichiara un altro collaboratore rende illeggibili giornate **e** contesto, non solo la cache che l'ha ricevuta, provato leggendo i dati e non contando le chiamate.
      - [ ] AC-3 — il bordo della finestra fresca del contesto e la sua singola rivalidazione sono provati sul dato restituito con orologio iniettato.
      - [ ] AC-1 — la cache di giornata restituisce una voce fresca senza invocare il caricatore.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Confini dati HTTP della giornata e del contesto di inserimento
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esporre due GET autenticate che restituiscono i DTO della giornata e del contesto di inserimento derivando sempre il collaboratore dalla sessione server, con le stesse intestazioni private già usate dal calendario.

      ## Read
      - `src/app/api/attivita/calendario/route.ts` — intero file: intestazioni `private, no-store` e `Vary: Cookie`, esiti 400/401/403/500, uso di `ErroreAutorizzazione`, assenza di qualunque parametro di identità.
      - `src/lib/attivita.ts` — le letture autorizzate introdotte da TASK-01.
      - `src/domain/calendario/index.ts` — `parseDataGiorno`, per validare la data ricevuta.

      ## Change
      - Nuovo `src/lib/risposta-dati-privati.ts` con le intestazioni condivise e l'helper che costruisce la risposta JSON.
      - Nuovo `src/app/api/attivita/giornata/route.ts`.
      - Nuovo `src/app/api/attivita/contesto-inserimento/route.ts`.
      - `src/app/api/attivita/calendario/route.ts`: usa l'helper condiviso, con comportamento ed esiti invariati.

      Non-goal: nessun parametro di identità accettato dal browser, nessuna modifica alle server action, nessun cambiamento agli esiti della route calendario.

      ## Steps
      1. Nell'helper esportare le intestazioni (`Cache-Control` uguale a `private, no-store` e `Vary` uguale a `Cookie`) e una funzione che costruisce la risposta JSON con quelle intestazioni, replicando il comportamento oggi locale alla route calendario.
      2. `GET /api/attivita/giornata` accetta il solo parametro `data`: risponde 400 se assente o se non supera `parseDataGiorno`, **senza** interrogare il read model; poi risolve il profilo con `risolviProfiloCollaboratoreCorrente`, risponde 403 se lo stato non è ATTIVO, propaga lo status di `ErroreAutorizzazione` (401 senza sessione) e risponde 200 con `righeDelGiornoPerCollaboratoreAutorizzato` invocata con l'id del profilo risolto. Nessun dettaglio dell'errore interno esce sul 500.
      3. `GET /api/attivita/contesto-inserimento` non accetta alcun parametro: stessi esiti 401, 403 e 500, e 200 con `contestoInserimentoPerCollaboratoreAutorizzato` invocata con l'id del profilo risolto.
      4. Rifattorizzare la route calendario perché usi l'helper, senza cambiare né gli esiti né le intestazioni né i messaggi.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica.
      - Run: `npm run lint`
      - Expect: eslint senza errori e guardrail e2e passato.
      - Run: `npm test`
      - Expect: `tests/unit/attivita-calendario-route.test.ts` resta verde **senza modifiche**, prova che il refactor non ha alterato il contratto esistente; totale verde come in baseline.
      - Run: `npm run build`
      - Expect: build completata e, nell'elenco delle rotte, `/api/attivita/giornata` e `/api/attivita/contesto-inserimento` marcate come dinamiche, accanto a `/api/attivita/calendario` già presente in baseline.

      ## Done
      - [ ] AC-1, AC-3 — esistono due confini dati distinti e nessuno dei due accetta un identificativo di collaboratore dal browser.
      - [ ] AC-7 — l'unico id usato nelle letture è quello del profilo risolto dal DAL.
      - [ ] Le risposte portano `Cache-Control` `private, no-store` e `Vary: Cookie`, così la staleness resta governata soltanto dalla cache client.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Unit sui confini HTTP di giornata e contesto di inserimento
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Provare il contratto osservabile delle due nuove route: validazione, esiti di autorizzazione, intestazioni private e id usato nella lettura.

      ## Read
      - `tests/unit/attivita-calendario-route.test.ts` — intero file: come sono montati i mock di `@/lib/dal` e `@/lib/attivita` con `vi.hoisted`, e come è asserito che l'unico id passato alla lettura è quello del profilo risolto.
      - `src/app/api/attivita/giornata/route.ts` e `src/app/api/attivita/contesto-inserimento/route.ts`.

      ## Change
      - Nuovo `tests/unit/attivita-giornata-routes.test.ts`, con due blocchi `describe`, uno per route.

      Non-goal: non modificare `tests/unit/attivita-calendario-route.test.ts`, che resta la prova di non regressione del refactor delle intestazioni.

      ## Steps
      1. Route giornata: asserire 400 su parametro `data` assente e su formato non valido, verificando che la lettura mockata **non** venga invocata; 401 quando il DAL lancia `ErroreAutorizzazione` senza sessione; 403 con profilo assente o disattivato; 200 con il DTO restituito dalla lettura.
      2. Asserire che l'unico argomento identificativo passato alla lettura è l'id del profilo risolto dal DAL, e che nessun valore proveniente dalla query string vi arriva.
      3. Asserire le intestazioni `Cache-Control` uguale a `private, no-store` e `Vary` uguale a `Cookie` su tutti gli esiti, incluso il 400.
      4. Route contesto: asserire 401, 403 e 200 con il DTO atteso, l'assenza di parametri accettati e le stesse intestazioni.
      5. Asserire che un errore inatteso produce 500 senza far uscire il messaggio interno nel corpo.

      ## Verify
      - Run: `npx vitest run tests/unit/attivita-giornata-routes.test.ts`
      - Expect: tutti i nuovi test verdi.
      - Run: `npm test`
      - Expect: nessuna regressione; totale maggiore o uguale a 607 test, tutti verdi.

      ## Done
      - [ ] AC-7 — le route non espongono alcun parametro di identità e usano solo l'id risolto dal DAL, provato sull'argomento effettivamente passato alla lettura.
      - [ ] AC-1, AC-3 — 400 su data assente o malformata senza interrogare il read model, 401 senza sessione, 403 con profilo non operativo, 200 con il DTO atteso e le intestazioni private su ogni esito.

      ## Blockers
      None.
