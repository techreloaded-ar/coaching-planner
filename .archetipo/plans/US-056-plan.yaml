  - id: TASK-16
    title: Fix rework — voci di cronologia duplicate su una corsa Giorno successivo/precedente (AC-6)
    type: Fix
    status: DONE
    dependencies:
      - TASK-08
      - TASK-09
    body: |-
      ## Objective
      `commit` non scrive più una voce di cronologia quando l'URL di destinazione coincide già con quello corrente, così qualunque corsa fra intenti di navigazione — non solo quella segnalata — non produce mai una voce duplicata.

      ## Read
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:163-182` — `commit`, in particolare il blocco `if (intento.registraHistory) { window.history.pushState(...) }`.
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:465-478` — `navigaVersoGiorno` e `navigaDiGiorni`: la guardia esistente confronta solo `nuovaData === intentoCorrente.current.data`, insufficiente sulla corsa descritta dal reviewer (click su "successivo" verso B, miss in volo, click immediato su "precedente" che ricalcola B-1 = A, diverso dall'intento corrente B, quindi procede anche se l'URL è già A).
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx:184-240` — `vaiA`, per capire quando `commit` viene invocato in hit sincrono vs. dopo un `load` asincrono.

      ## Change
      - `src/app/(front-office)/attivita/[data]/isola-giornata.tsx`: solo la funzione `commit` (righe 163-182).

      Non-goal: non toccare `navigaVersoGiorno`/`navigaDiGiorni` — la guardia in `commit` è deliberatamente il punto unico dove si scrive la history, quindi copre anche le corse non ancora osservate, senza bisogno di guardie sparse sui singoli chiamanti.

      ## Steps
      1. In `commit`, prima del blocco `if (intento.registraHistory) { ... }`, calcolare `const urlDestinazione = urlDelGiorno(intento.data);` e `const urlCorrente = window.location.pathname + window.location.search;`.
      2. Sostituire la condizione con `if (intento.registraHistory && urlDestinazione !== urlCorrente) { window.history.pushState(null, "", urlDestinazione); }`.
      3. Aggiungere un commento breve che spiega la ragione: un intento che chiede di registrare la cronologia ma la cui destinazione coincide già con l'URL corrente non deve produrre una voce duplicata — caso tipico di una corsa fra intenti opposti dove il secondo intento ricade su un giorno già mostrato.
      4. Non modificare `navigazioneInVolo.current`, `setGiornataVisualizzata`, `setInCaricamento`, `setErrore`: restano invariati, perché la vista deve comunque riflettere il nuovo intento anche quando la history non viene toccata.

      ## Verify
      - Run: `npx vitest run tests/unit/cache-dati-scheda.test.ts tests/unit/calendario-cache-provider.test.ts`
      - Expect: verdi, invariati (nessuna cache toccata da questo task).
      - Run: `npx tsc --noEmit`
      - Expect: nessuna diagnostica.
      - Run: `npm run lint`
      - Expect: verde.
      - Run: `npx playwright test tests/e2e/giornata-cache-cambio-giorno.spec.ts tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts --retries=0`
      - Expect: tutti verdi, incluso lo scenario Indietro/Avanti esistente (`history.length` invariato, comportamento preesistente non toccato dalla guardia aggiuntiva perché quello scenario non coinvolge mai un `pushState` con URL già corrente).

      ## Done
      - [ ] AC-6 — nessuna voce di cronologia duplicata quando l'URL calcolato dal `commit` coincide già con `window.location.pathname + search`, qualunque sia la sequenza di click che ci arriva.
      - [ ] Il comportamento esistente di AC-1, AC-2, AC-6 (hit sincrono, miss con indicatore, Back/Forward) resta identico: la guardia interviene solo quando l'URL non cambierebbe.

      ## Blockers
      None.
