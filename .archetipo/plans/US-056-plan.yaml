  - id: TASK-15
    title: Fix rework — collisione di mese riservato in giornata-cache-cambio-giorno.spec.ts (BLOCCANTE)
    type: Fix
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      La chiave di riservazione dello scenario "cambio account" smette di collidere con il mese vuoto del report fatturazione, e un nuovo controllo statico nel guardrail e2e trasforma qualunque futura collisione fra chiavi riservate in un errore esplicito di `npm run lint`, invece che in un test rosso a distanza.

      ## Read
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts:599` — `const mese = meseRiservato(\`${CODICE_SPEC}-identita\`);` nello scenario "dopo un accesso con un altro account...".
      - `tests/e2e/support/date.ts` — `hashStabile`, `offsetMeseRiservato` (non esportata), `meseRiservato`, `mesePassatoRiservato`, `MESI_RISERVATI_BASE_OFFSET`, `MESI_RISERVATI_FINESTRA`.
      - `tests/e2e/support/report-data.ts:59-61` — `meseVuotoReportFatturazioneClienti()` risolve `mesePassatoRiservato("US-023-TASK-08-REPORT-FATTURAZIONE-CLIENTI-VUOTO")` (mesiIndietro di default = 1): è la chiave che collide.
      - `scripts/check-e2e-guardrails.ts` — struttura esistente: `FORBIDDEN_PATTERNS`, `walk`, `checkSource`, `runSelfTest`, `main`; stile degli allowlist già presenti (`SEED_EMAIL_ALLOWLIST`, `XPATH_ALLOWLIST`).
      - Riproduzione verificata in planning: `npx playwright test tests/e2e/giornata-cache-cambio-giorno.spec.ts tests/e2e/report-fatturazione-clienti.spec.ts --retries=0` fallisce su `report-fatturazione-clienti.spec.ts:182` ("un mese riservato senza righe del test mostra lo stato vuoto") perché lo scenario US-056 scrive due righe l'11 del mese 2017-10, lo stesso mese vuoto atteso dal report.

      ## Change
      - `tests/e2e/giornata-cache-cambio-giorno.spec.ts`: la sola riga 599, cambiando la chiave.
      - `tests/e2e/support/date.ts`: aggiungere `export` a `offsetMeseRiservato` (nessun'altra modifica), così il guardrail può calcolare l'offset senza duplicare l'algoritmo dell'hash.
      - `scripts/check-e2e-guardrails.ts`: aggiungere un secondo controllo, indipendente dai `FORBIDDEN_PATTERNS` esistenti, che analizza tutte le chiamate a `meseRiservato`/`mesePassatoRiservato`/`dataNelMeseRiservato`/`dataNelMesePassatoRiservato` in `tests/e2e/**/*.ts` e fallisce su collisioni non allowlistate.

      Non-goal: non toccare `MESI_RISERVATI_FINESTRA` né alcun'altra chiave riservata usata da altre spec — le nove collisioni pre-esistenti scoperte dal nuovo controllo restano allowlistate, non corrette, perché sono fuori perimetro di questa spec.

      ## Steps
      1. In `date.ts` aggiungere `export` davanti a `function offsetMeseRiservato`, lasciando corpo e firma invariati.
      2. In `check-e2e-guardrails.ts` importare `offsetMeseRiservato` da `../tests/e2e/support/date` (percorso relativo da `scripts/`).
      3. Implementare `estraiCostantiStringa(source: string): Map<string,string>` che risolve, per ogni file, le dichiarazioni locali `const NOME = "letterale";` (anche con `let`) con una regex tipo `/\b(?:const|let)\s+(\w+)\s*(?::\s*string)?\s*=\s*"([^"]*)"/g`.
      4. Implementare `estraiRiservazioni(relativePath: string, source: string): Array<{ chiave: string; mesiIndietro: number; line: number }>` con una regex che cattura le quattro funzioni: `/\b(meseRiservato|mesePassatoRiservato|dataNelMeseRiservato|dataNelMesePassatoRiservato)\s*\(([^)]*)\)/g`. Per ogni match, dividere gli argomenti sulle virgole di primo livello (non dentro apici) e risolvere il primo argomento: se è un letterale fra apici doppi o singoli, usarlo direttamente; se è un template letterale nella forma `` `${IDENT}suffisso` `` con un solo placeholder a inizio stringa, risolvere `IDENT` con la mappa di `estraiCostantiStringa` e concatenare il suffisso restante; se è un identificatore semplice, risolverlo con la stessa mappa. Se non risolvibile staticamente, scartare la chiamata e stampare una riga informativa su stdout (`⚠️ chiave riservata non risolvibile staticamente: file:line`), senza fallire la build per questo. Calcolare `mesiIndietro`: `meseRiservato`/`dataNelMeseRiservato` ⇒ 0; `mesePassatoRiservato` ⇒ secondo argomento se letterale numerico, altrimenti 1 (default della funzione reale); `dataNelMesePassatoRiservato` ⇒ terzo argomento se letterale numerico, altrimenti 1.
      5. Calcolare per ogni riservazione risolta `offset = offsetMeseRiservato(chiave) - mesiIndietro` e raggruppare per `offset` in una `Map<number, Array<{chiave, file, line}>>`.
      6. Definire `COLLISIONI_PREESISTENTI_ALLOWLIST: ReadonlyArray<readonly [string, string]>` con le nove coppie scoperte in planning (non ordinate, confrontare come insieme non ordinato di due chiavi): `["US-036", "US-052-segregazione"]`, `["US-036", "US-031"]`, `["US-051-DEMO-cursore-e-feedback-attesa", "US-056-rientro"]`, `["US-055-DEMO-SALTO-MESE", "US-053-confine"]`, `["US-034", "US-023-TASK-07-REPORT-FATTURAZIONE-CLIENTI-SPEC"]`, `["US-052-cache-identita", "US-056-cronologia"]`, `["US-054-SELEZIONE-RIMBORSO-TRASFERTA", "US-043-DEMO"]`, `["US-049", "US-056-contesto"]`, `["US-056-server", "US-037-ESPANSIONE-SINGOLA"]`. Commentare la lista come le allowlist esistenti: una riga per coppia con la spiegazione "collisione pre-esistente, fuori perimetro di questa spec".
      7. Per ogni gruppo con più di una chiave **distinta**, verificare se l'insieme delle chiavi coincide con una coppia allowlistata (confronto per coppia non ordinata; un gruppo con più di due chiavi distinte non è mai allowlistabile da una singola coppia e va sempre segnalato). Se non allowlistato, produrre un errore con tutte le chiavi, i file e le righe coinvolte e l'offset condiviso.
