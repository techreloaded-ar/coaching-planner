      - `docs/wiki/domains/attivita.md`.
      - `docs/wiki/index.md` e `docs/wiki/log.md`: solo come output dei comandi.

      Non-goal: non riscrivere i flussi 1-6 e 12-14, che restano validi. Non toccare le pagine di dominio collegate.

      ## Steps
      1. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner reset domains/attivita`.
      2. In `sources` aggiornare il simbolo di `src/lib/attivita.ts` (rimozione di `righeDelGiorno`, aggiunta di `righeDelGiornoPerCollaboratoreAutorizzato` e `contestoInserimentoPerCollaboratoreAutorizzato`), il simbolo di `src/lib/attivita-contract.ts` con i nuovi DTO, sostituire `calendario-cache-provider.tsx` con `attivita-cache-provider.tsx`, aggiungere `cache-dati-scheda.ts`, `giornata-cache.ts`, `[data]/isola-giornata.tsx`, le due nuove route con ruolo `inbound-query`, e in coda alle verifiche `tests/unit/cache-dati-scheda.test.ts`, `tests/unit/attivita-giornata-routes.test.ts` e `tests/e2e/giornata-cache-cambio-giorno.spec.ts`.
