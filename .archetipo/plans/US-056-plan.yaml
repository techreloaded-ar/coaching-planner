schema: archetipo/plan/v2
spec_code: US-056
body: |-
  # US-056: Cambio giorno servito dalla cache client nel dettaglio attività — Piano di implementazione

  **Generato da:** Team di Planning ARchetipo
  **Data:** 4 agosto 2026

  ---

  ## Spec

  **Epic:** EP-005 — Evoluzioni Post-MVP
  **Priorità:** HIGH | **Punti:** 5 | **Bloccata da:** -

  **Storia utente**
  Come collaboratore, voglio che spostarmi tra i giorni dalla pagina di dettaglio attività mostri le righe della giornata senza attendere il server, così da consultare e registrare le attività di più giorni consecutivi con la stessa immediatezza del calendario mensile.

  ---

  ## Soluzione tecnica

  ### Stato di partenza accertato (ricognizione del 4 agosto 2026)

  Verifiche eseguite su `data.workdir` = `/Users/smarello/repo/coaching-planner` (nessun worktree dedicato), a `HEAD` = `55820dc`:

  - `/attivita` è già un'isola SPA completa: `calendario-cache.ts` (macchina di cache pura, testata con orologio iniettato), `calendario-cache-provider.tsx` (montato da `layout.tsx` con `key` uguale a `sessione.utenteId`), `GET /api/attivita/calendario`, `calendario-mensile.tsx` con intento di navigazione `vaiA`, `commit`, History API, prefetch dei mesi adiacenti, timer di scadenza e rivalidazione su focus.
  - `/attivita/[data]` è invece interamente RSC. `page.tsx` risolve sessione e profilo, esegue in parallelo `righeDelGiorno`, `clientiAttiviPerSelezione` e `vociRimborsoTrasfertaPerSelezione`, serializza e passa i dati a `<DettaglioGiornata key={dataStr}>`. Il cambio giorno è un `router.push` dentro `startTransition`: un round-trip completo che ricarica anche i due dati invarianti rispetto al giorno.
  - Il reset del form al cambio giorno oggi **non** è codice: è il remount forzato da `key={dataStr}` in `page.tsx` (commento esplicito alle righe 445-455 di `dettaglio-giornata.tsx`).
  - Le mutazioni chiamano `invalidaMeseERicarica`, che invalida il token mese nella cache client e poi esegue `router.refresh()`; le quattro server action fanno già `revalidatePath` su `/attivita/{data}`, `/attivita/riepilogo` e `/attivita`.
  - `RigaAttivitaClient`, `ClienteSelect` e `VoceRimborsoTrasfertaSelezionabile` sono dichiarati dentro `page.tsx` e importati come tipi dal client component: contratto fragile fra server e client.
  - `righeDelGiorno` e `vociRimborsoTrasfertaPerSelezione` hanno un solo chiamante (`[data]/page.tsx`); `clientiAttiviPerSelezione` ha anche test unit propri che ne asseriscono payload Prisma e guardia.
  - Verifica documentale sulla versione in uso (Next 16.2.9): `node_modules/next/dist/docs/01-app/01-getting-started/04-linking-and-navigating.md`, sezione «Native History API», dichiara `window.history.pushState` e `replaceState` integrati nel router e sincronizzati con `usePathname`/`useSearchParams`; l'esempio di `replaceState` cambia il **pathname**, non solo la query. Nel runtime, `node_modules/next/dist/client/components/app-router.js` patcha `pushState` copiando `__PRIVATE_NEXTJS_INTERNALS_TREE` nella nuova entry e su `popstate` esegue `dispatchTraverseAction` con quell'albero, che `restore-reducer.js` ripristina senza richieste quando l'albero non cambia. È lo stesso meccanismo già provato a zero richieste dal calendario.

  ### Approccio

  Il dettaglio giornata diventa la **seconda isola SPA della stessa area**, montata sull'infrastruttura già consegnata invece che su una copia parallela.

  1. **Una sola macchina di cache, tre risorse.** `CacheCalendarioMesi` viene generalizzata in `CacheDatiScheda<T>` (`cache-dati-scheda.ts`): stessa semantica già provata — finestra fresca di 300 000 ms, espulsione LRU, single-flight, epoche di invalidazione che neutralizzano le risposte in volo, `subscribe` — parametrizzata dal tipo del DTO e da una funzione `chiaveDi`. `CacheCalendarioMesi` resta una specializzazione con la **stessa firma di costruttore**, così `tests/unit/calendario-cache-provider.test.ts` continua a passare senza una riga di modifica: è la prova che la generalizzazione non ha cambiato comportamento. Il provider monta tre istanze: mesi (LRU 12), giornate (LRU 31), contesto di inserimento (una voce sola).
  2. **Guardia d'identità condivisa.** L'identità del collaboratore esce dalla singola cache e diventa `GuardiaIdentitaScheda`, a cui tutte e tre le istanze si registrano: una risposta che dichiara un altro collaboratore svuota **tutte** le cache della scheda e notifica una sola volta il consumer, che esegue una navigazione completa. Senza questa condivisione un cambio account rilevato dal calendario lascerebbe leggibili le giornate del collaboratore precedente, e un *fresh hit* non emette per costruzione alcuna richiesta che possa accorgersene (AC-7).
  3. **Due confini dati distinti, perché la loro invalidazione è distinta.** `GET /api/attivita/giornata?data=YYYY-MM-DD` restituisce `DatiGiornataAttivita` (`{ data, collaboratoreId, righe }`); `GET /api/attivita/contesto-inserimento` restituisce `ContestoInserimentoGiornata` (`{ collaboratoreId, clienti, vociRimborso }`). Il contesto è invariante rispetto al giorno: seminato dal rendering server, non viene più richiesto ad ogni cambio giorno, e la sua freschezza è delimitata dalle stesse mitigazioni del mese — scadenza a 300 secondi e rivalidazione forzata al ritorno sulla scheda. È esattamente ciò che AC-3 chiede.
  4. **Un'isola per la giornata.** `isola-giornata.tsx` possiede intento di navigazione, letture dalla cache, indicatore di attesa, History API, breadcrumb e barra dei controlli; rende `<DettaglioGiornata key={giornoVisualizzato}>`, quindi il remount che oggi azzera il form resta il meccanismo di AC-5, spostato dal server al client senza cambiarne la natura. L'URL viene scritto dentro `commit`, cioè solo a dati pronti (AC-2).
  5. **Un solo DTO prodotto in un solo punto.** La serializzazione delle righe vive in `righeDelGiornoPerCollaboratoreAutorizzato`, usata sia dalla pagina sia dalla route: rendering server ed endpoint non possono divergere.
  6. **Invalidazione dopo mutazione senza round-trip RSC.** `invalidaMeseERicarica` diventa `invalidaDopoMutazione`: invalida il giorno e il mese nelle rispettive cache e forza una `revalida` del giorno; l'aggiornamento raggiunge la vista tramite `subscribe`. `router.refresh()` viene rimosso perché ridondante e dannoso: le server action continuano a fare `revalidatePath` e la loro risposta invalida già la Router Cache client per quei percorsi.
  7. **Prefetch dei soli giorni adiacenti** (`giornoSpostatoDi` di più o meno uno) dopo ogni commit, con errori silenziosi. Un salto lontano dal selettore data resta un miss, coerentemente con il Fuori Perimetro.

  ### Decisioni architetturali

  **Nessun nuovo ADR.** La scelta portante — isola SPA sull'area attività, GET autenticato che deriva sempre il collaboratore dalla sessione, cache nella sola memoria della scheda, finestra di 300 secondi, nessuno storage persistente — è già registrata in `decisions/cache-client-calendario-collaboratore`, e questa spec la **estende** al giorno anziché sceglierne un'altra. Le tre scelte materiali dell'estensione appartengono per contenuto a quella stessa pagina e vanno registrate lì (`wiki_impact.update`), non su una pagina nuova che frammenterebbe il razionale:

  - *Guardia d'identità condivisa fra le cache della scheda*, invece di una identità per cache. Alternativa scartata: tenere l'identità dentro ogni istanza, che lascerebbe leggibili le giornate del collaboratore precedente quando il cambio account è rilevato solo dal calendario. Costo accettato: la guardia diventa stato condiviso della scheda e va provata a parte.
  - *Contesto di inserimento come risorsa separata*, invece che incluso nel payload della giornata. Alternativa scartata: un solo endpoint che restituisce righe più contesto — più economico su un miss freddo, ma riporterebbe clienti e voci di rimborso nel percorso di **ogni** cambio giorno, cioè esattamente ciò che AC-3 vieta.
  - *Generalizzazione della macchina di cache*, invece di una seconda copia per le giornate. Alternativa scartata: duplicare la classe, duplicando una macchina a stati sottile (epoche, single-flight, LRU, guardia) e la sua manutenzione.

  L'ID della pagina di decisione non cambia — è referenziato da `domains/attivita`, `decisions/feedback-attesa-uniforme` e `engineering/code-map` — mentre titolo e descrizione vengono ampliati in loco perché la decisione non riguarda più i soli mesi. Nessuna dipendenza nuova, nessun flag di rendering, nessuno storage persistente: il perimetro tecnico resta quello già deciso.

  ### Rischio principale e sua verifica anticipata

  `window.history.pushState` verso un **pathname diverso** (`/attivita/A` verso `/attivita/B`, stesso segmento dinamico) non è il caso già provato dal calendario, che cambiava solo la query string della stessa rotta. La lettura del runtime e la guida bundled indicano che l'albero memorizzato viene ripristinato senza rifetch e che il cambio di pathname è un uso legittimo, ma la verifica non resta documentale: TASK-10 impone di scrivere ed eseguire **per primo** il test a oracolo di rete di AC-1. Se quella prova mostrasse una richiesta o una navigazione documentale, il piano si ferma e l'esito va riportato: non va inventato un meccanismo di navigazione parallelo né toccato il contratto URL, che AC-8 dichiara invariante.

  Secondo rischio, meno evidente: una `revalidatePath` eseguita da una server action rigenera l'albero RSC del giorno **da cui l'utente è partito**, non di quello che sta guardando. Adottare senza condizioni un nuovo payload server riporterebbe la vista al giorno sbagliato subito dopo un salvataggio. Il piano lo previene adottando il payload server solo quando è coerente con `usePathname()`, e lo prova nello scenario di AC-4.

  ---

  ## Baseline

  Tutti i comandi eseguiti il 4 agosto 2026 da `/Users/smarello/repo/coaching-planner` su `HEAD` = `55820dc`.

  | Check | Esito prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run lint` | verde — eslint senza errori e messaggio «✅ Guardrail e2e anti-flakiness passed» | ogni task che tocca `src` o `tests/e2e` rilancia lint; nessun `Expect` può ammettere nuove violazioni del guardrail |
  | `npx tsc --noEmit` | verde — nessuna diagnostica | i file toccati devono restare senza diagnostiche; nessun file già degradato da bonificare |
  | `npm test` (vitest) | verde — 38 file, 607 test | il gate confronta con questi numeri: sono ammessi solo test **in più**, mai in meno |
  | `npm run build` | verde — build production completata; `/attivita`, `/attivita/[data]` e `/api/attivita/calendario` elencate come dinamiche (`ƒ`) | le due nuove route devono comparire come dinamiche nello stesso elenco |
  | `npx playwright test tests/e2e/cambio-rapido-giorno-dettaglio.spec.ts` | verde — 2 test passati in 5,6 s | è la suite di non regressione di AC-8: deve restare verde **senza modifiche al file** |

  Prerequisiti d'ambiente, distinti dai fallimenti di codice: `E2E_DATABASE_URL` deve essere valorizzata e viene letta da `.env` tramite `loadEnvConfig` in `playwright.config.ts`; Playwright avvia da sé il web server (`PLAYWRIGHT_WEB_SERVER_COMMAND`, default `npm run dev`) e `tests/e2e/global-setup.ts` esegue il seed del database e2e; `prisma generate` è già dentro `npm run build`. La suite e2e **completa** non è stata eseguita in planning: la baseline e2e registrata è quella del solo file indicato, e il gate finale esegue le suite adiacenti elencate in TASK-14.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | collaboratore factory con righe su tre giorni consecutivi di un mese riservato | e2e | gate `page.route` che **conta e aborta** le richieste verso `/attivita/` seguito da una data, `/api/attivita/giornata` e `/api/attivita/contesto-inserimento`: contatore a 0, righe, totali e URL del giorno di ritorno corretti, indicatore mai visibile | TASK-10 |
  | AC-2 | giorno mai visitato, risposta trattenuta da una `page.route` sbloccata da una Promise del test | e2e | `aria-busy` uguale a `true` sul contenitore `contenuto-giornata` e `indicatore-caricamento-giornata` visibile, righe del giorno precedente ancora presenti, URL ancora sul giorno di partenza; al rilascio URL e righe passano al nuovo giorno e l'indicatore scompare | TASK-10 |
  | AC-3 | tre cambi giorno consecutivi entro la finestra fresca | e2e | contatore delle richieste a `/api/attivita/contesto-inserimento` fermo a 0 dopo il rendering iniziale, mentre le richieste a `/api/attivita/giornata` avvengono; la select `#cliente` contiene ancora la ragione sociale del cliente factory su ogni giorno | TASK-10 |
  | AC-3 (bordo) | orologio iniettato, nessun timer reale | unit | al bordo esatto di `DURATA_FRESH_MS` la voce del contesto è scaduta e tre letture consecutive producono **una sola** rivalidazione; `revalida` forza la lettura anche su voce fresca | TASK-04 |
  | AC-4 | riga salvata sul giorno raggiunto dopo un cambio giorno | e2e | dopo il salvataggio la vista **resta** sul giorno salvato e mostra la riga; cambio giorno e ritorno la mostrano ancora; la cella del calendario del mese corrispondente riporta le ore aggiornate, mai quelle precedenti | TASK-10 |
  | AC-5 | valori digitati in `#ore` e `#nota` sul giorno di partenza | e2e | dopo il cambio giorno `#ore` e `#nota` sono vuoti e `#cliente` è tornato al valore vuoto | TASK-10 |
  | AC-6 | due giorni già visitati nella stessa scheda | e2e | `goBack` e `goForward` mostrano il giorno corretto con il gate di rete a 0; `history.length` invariato prima e dopo Back+Forward | TASK-10 |
  | AC-7 | due collaboratori factory con righe sullo stesso giorno | e2e | dopo l'accesso con il secondo account nella stessa finestra: navigazione documentale osservata e zero occorrenze della ragione sociale del cliente del primo collaboratore; il secondo vede le proprie righe | TASK-10 |
  | AC-7 (unità) | due cache registrate sulla stessa guardia | unit | una risposta con `collaboratoreId` diverso rende illeggibili le voci di **entrambe** e notifica una sola volta | TASK-04 |
