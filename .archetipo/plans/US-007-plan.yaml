schema: archetipo/plan/v2
spec_code: US-007
body: "# US-007: Anagrafica clienti con dati di fatturazione — Piano di Implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-06-12 (rev. 2 — back office a console con sidebar, su indicazione del committente)\n\n---\n\n## Spec\n\n**Epic:** EP-002 — Anagrafiche e Configurazione\n**Priorità:** HIGH | **Punti:** 3\n\n**Storia Utente**\nCome Stefano, amministratore, voglio censire i clienti con i loro dati di fatturazione e poterli modificare o disattivare, così da avere un'unica fonte di verità per le anagrafiche su cui costruire offerte e consuntivi.\n\n**Criteri di Accettazione**\n- [ ] L'amministratore crea un cliente con ragione sociale e dati di fatturazione; i campi obbligatori sono validati\n- [ ] L'amministratore modifica i dati di un cliente esistente e le modifiche sono persistite\n- [ ] La disattivazione di un cliente lo esclude dalle selezioni per nuove attività e offerte, preservando lo storico\n- [ ] L'elenco clienti mostra stato attivo/disattivo e consente di distinguere i clienti disattivati\n\n---\n\n## Soluzione Tecnica\n\nPrimo CRUD del back office: stabilisce il pattern (dominio puro → DAL con guardie → Server Actions → pagine server-rendered) che US-008 e US-009 riuseranno, e introduce il layout a console gestionale del back office deciso dal committente. Le convenzioni Next.js 16 seguono le guide locali in `node_modules/next/dist/docs/` (mutating-data, forms, data-security, revalidating), come richiesto da AGENTS.md.\n\n- **Modello dati**: `Cliente` esiste già in `prisma/schema.prisma:92` (ragioneSociale, partitaIva?, indirizzo?, citta?, cap?, provincia?, attivo). Migrazione additiva con i campi di fatturazione mancanti per il contesto italiano: `codiceFiscale String?`, `codiceDestinatario String?` (codice SDI), `pec String?`. I vincoli di obbligatorietà vivono a livello applicativo (il DB resta permissivo): obbligatori ragione sociale e partita IVA. **Assunzione registrata:** la spec non elenca i \"dati di fatturazione\"; si assume il set standard italiano sopra, con ragione sociale e P.IVA obbligatorie e gli altri campi facoltativi.\n- **Validazione nel dominio** (`src/domain/anagrafiche/valida-cliente.ts`): funzioni pure senza dipendenze dal framework (ADR-006) che validano campi obbligatori e formati (P.IVA 11 cifre, CAP 5 cifre, provincia 2 lettere, PEC con formato email, codice SDI 7 alfanumerici) e restituiscono una mappa errori per campo, riusata dalle Server Actions e testabile in isolamento.\n- **DAL clienti** (`src/lib/clienti.ts`, `server-only`, guardia di ruolo AMMINISTRATORE): `elencaClienti()` per il back office (tutti, con stato, ordinati per ragione sociale), `clientePerId(id)`, e `elencaClientiSelezionabili()` che filtra `attivo: true` — unica fonte per le selezioni operative delle spec future (offerte US-008, attività front office): è così che la disattivazione \"esclude dalle scelte operative\" preservando lo storico, perché il cliente non viene mai cancellato, solo marcato.\n- **Server Actions** (`src/app/(back-office)/anagrafiche/clienti/actions.ts`, direttiva `use server`): `creaCliente`, `aggiornaCliente`, `cambiaStatoCliente` (disattiva/riattiva, reversibile). Ogni action verifica il ruolo lato server come impone la guida data-security (le action sono raggiungibili via POST diretta): oggi con `richiediRuolo(\"AMMINISTRATORE\")` di `src/lib/dal.ts`; quando US-006 (oggi solo PLANNED) consegnerà `richiediRuoloApi`, le action passeranno a quella guardia — nota di allineamento, non un blocco. Dopo ogni mutazione `revalidatePath(\"/anagrafiche/clienti\")`; gli errori di validazione tornano al form via `useActionState`.\n- **Layout back office a console** (decisione del committente, mockup in `docs/mockups/US-007/`): `src/app/(back-office)/layout.tsx` diventa una console gestionale con **sidebar fissa a sinistra** — brand \"Coaching Planner\" in alto; voci di navigazione Clienti (attiva), Offerte, Collaboratori, Scaglioni km, Report con le voci future marcate \"In arrivo\" e disabilitate; voce attiva evidenziata in base alla route corrente; in fondo info utente (nome, ruolo, avatar con iniziali) e pulsante \"Esci\" — e area contenuto a destra in cui le view vengono renderizzate. Il titolo hardcoded \"Report per cliente\" dell'header attuale viene rimosso: ogni view porta il proprio titolo. Le spec successive aggiungono voci alla sidebar, non nuove pagine snodo.\n- **View clienti** (mockup `index.html` e `cliente-form.html`): elenco su `/anagrafiche/clienti` con badge Attivo/Disattivato, righe disattivate attenuate, azioni Modifica e Disattiva (con conferma)/Riattiva, pulsante \"Nuovo cliente\"; form di creazione su `/anagrafiche/clienti/nuovo` e di modifica su `/anagrafiche/clienti/[id]`, server components con form e progressive enhancement. La route `/anagrafiche` reindirizza a `/anagrafiche/clienti` (nessuna pagina snodo), mantenendo validi i riferimenti esistenti a `/anagrafiche` (redirect post-login, piano US-006, test e2e di US-005).\n\n**Nota di dipendenza:** US-007 non ha blocchi formali, ma US-006 (autorizzazione) è solo PLANNED: si usano le guardie già esistenti (`richiediRuolo`) e la convenzione del piano US-006 (nessun accesso a `db` dalle route senza guardia), così l'adeguamento futuro sarà locale alle action.\n\n---\n\n## Strategia di Test\n\nLa validazione è in funzioni pure: copertura principale unitaria; il DAL e le action si testano con mock di Prisma; gli e2e provano il ciclo di vita completo del cliente attraverso la UI reale, inclusa la navigazione dalla sidebar.\n\n- **Unit (Vitest)** su `valida-cliente.ts`: obbligatorietà di ragione sociale e P.IVA, formati (P.IVA non numerica o di lunghezza errata, CAP, provincia, PEC, SDI), record valido senza campi facoltativi → nessun errore.\n- **Unit (Vitest)** su DAL e action con mock di Prisma e sessione: `elencaClientiSelezionabili` filtra i disattivati; `creaCliente`/`aggiornaCliente` con dati invalidi non scrivono a DB e restituiscono la mappa errori; `cambiaStatoCliente` aggiorna solo il flag `attivo`; guardia di ruolo applicata su ogni action.\n- **E2E (Playwright)**: ciclo crea → modifica → disattiva attraverso la UI a console, validazione campi obbligatori, distinzione visiva dei disattivati, redirect `/anagrafiche` → `/anagrafiche/clienti`.\n- **Regressione**: le suite esistenti (unit + `tests/e2e/auth-flows.spec.ts`) devono restare verdi; in particolare i flussi che attendono `**/anagrafiche**` dopo il login devono continuare a funzionare con il redirect.\n\n### Test E2E — Simulazione Utente\n\n**Framework:** Playwright (config esistente `playwright.config.ts`; sessione amministratore creata via endpoint di test `/api/e2e-test/sessione`, seed dal global-setup)\n**Registrazione video:** solo lo scenario demo (campo Dimostrazione); gli altri scenari girano senza video\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Demo (con video): ciclo di vita del cliente nella console | L'amministratore entra nella console del back office, dalla sidebar apre Clienti, crea un nuovo cliente con i dati di fatturazione, lo modifica, lo disattiva e lo vede comparire come Disattivato nell'elenco. Video in `docs/test-results/US-007/` (`demo__anagrafica-clienti.spec.ts`) |\n| Validazione campi obbligatori | Submit del form senza ragione sociale e con P.IVA non valida → errori per campo visibili, nessun cliente creato nell'elenco |\n| Modifica persistita | L'amministratore modifica indirizzo e PEC di un cliente esistente, torna all'elenco e ricarica la pagina: i dati aggiornati sono persistiti |\n| Cliente disattivato distinguibile | L'elenco mostra il badge di stato e la riga del cliente disattivato è visivamente distinta da quelle attive; la riattivazione lo riporta attivo |\n| Navigazione console | La sidebar mostra Clienti come voce attiva, le voci future sono disabilitate con \"In arrivo\"; `/anagrafiche` reindirizza all'elenco clienti |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-007/`\n\n_Piano generato via ARchetipo Planning — 2026-06-12 (rev. 2)_"
