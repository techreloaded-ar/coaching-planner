schema: archetipo/plan/v2
spec_code: US-037
body: |-
  # US-037: Dettaglio ore erogate per collaboratore nel report Fatturazione Clienti — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-21

  ---

  ## Spec

  **Epic:** EP-004 — Reportistica
  **Priorità:** MEDIUM | **Punti:** 3

  **Storia Utente**
  Come amministratore, voglio espandere la riga di un cliente nel report Fatturazione Clienti e vedere le ore erogate dai singoli collaboratori suddivise per offerta, così da verificare come si compone l'importo da fatturare prima di emettere la fattura.

  **Criteri di Accettazione**
  - AC-1 — L'espansione della riga cliente elenca, per ciascuna offerta del mese, i collaboratori con ore fatturabili, giornate equivalenti e imponibile corrispondente
  - AC-2 — La somma degli imponibili del dettaglio coincide con l'imponibile manodopera del cliente nel report, a due decimali
  - AC-3 — Una sola riga cliente espansa alla volta; riselezionare la riga espansa la richiude
  - AC-4 — Cliente presente solo per rimborsi trasferta: il dettaglio mostra un messaggio esplicito di assenza di ore fatturabili nel mese

  ---

  ## Soluzione Tecnica

  Il dettaglio per collaboratore è calcolato nella funzione pura `calcolaReportFatturazioneClienti` (pattern `decisions/calcoli-puri`), esposto attraverso la proiezione serializzabile esistente e reso nella scheda cliente del report — già Client Component — come sezione espandibile con stato locale, senza alcuna persistenza (la proiezione resta ricalcolata a ogni richiesta, come da fuori perimetro).

  - **Dominio** (`src/domain/consuntivi/index.ts`): `RigaReportFatturazione` acquisisce i campi obbligatori `collaboratoreId: string` e `collaboratoreNome: string`. Nuovo tipo esportato `VoceCollaboratoreOffertaReport { collaboratoreId, collaboratoreNome, oreFatturabili: number, giornateFatturabili: number, imponibile: string }`; `VoceOffertaReport` acquisisce `perCollaboratore: VoceCollaboratoreOffertaReport[]`, ordinato per ore fatturabili decrescenti con pareggio per nome (stesso criterio della ripartizione nel dettaglio avanzamento offerta). Solo le righe `fatturabile: true` alimentano il dettaglio (le ore non fatturabili sono fuori perimetro).
  - **Quadratura AC-2 per costruzione — allocazione a resto massimo in centesimi**: l'imponibile grezzo di ogni voce collaboratore è `giornateFatturabili × tariffaOfferta`, ma la somma degli arrotondamenti ingenui per riga può divergere di un centesimo dal valore visualizzato dell'imponibile manodopera del cliente (le ore hanno due decimali, `/8` produce giornate con granularità 0,00125: es. tariffa 100,00 e due righe da 0,01h danno 0,125 → 0,13 + 0,13 = 0,26 contro un totale cliente di 0,25). L'allocazione lavora in centesimi interi sull'elenco di tutte le voci collaboratore del cliente (nell'ordine deterministico: offerte per codice, collaboratori per ore decrescenti poi nome): obiettivo `targetCents = Math.round(Number(rawTotaleCliente.toFixed(2)) * 100)` (ancorato alla stringa visualizzata), pavimento per riga con guardia epsilon `Math.floor(raw*100 + 1e-6)`, centesimi residui distribuiti uno ciascuno alle righe con parte frazionaria maggiore (pareggio stabile sull'ordine dell'elenco). La somma delle stringhe `imponibile` del dettaglio coincide così esattamente con `imponibileManodopera` del cliente. È una politica di calcolo locale a questa proiezione: nessun ADR (non tocca modello dati persistente, sicurezza, confini di integrazione né politiche trasversali); resta coerente con `decisions/importi-decimali` (storage Decimal, output a due decimali, calcoli intermedi in `number` come nello stato documentato della catena applicativa).
  - **Query** (`src/lib/report.ts`): il `findMany` include anche `collaboratore: true`; il mapping aggiunge `collaboratoreId` e `collaboratoreNome` (`nome + " " + cognome`, come in `src/lib/offerte.ts`). Nessun'altra modifica: contratto `RisultatoReportFatturazione` invariato a parte il nuovo campo annidato, interamente serializzabile.
  - **UI** (`src/app/(back-office)/report/fatturazione-clienti/report-fatturazione-clienti.tsx`): l'intestazione della scheda cliente diventa un `<button type="button">` a larghezza piena (nessun elemento interattivo annidato oggi) con `aria-expanded`, `aria-controls="dettaglio-collaboratori-{clienteId}"`, `aria-label="Dettaglio collaboratori {ragioneSociale}"` e un chevron decorativo che ruota con l'espansione. Stato locale `clienteEspansoId: string | null` nel componente: espandere un cliente richiude il precedente, riselezionare richiude (AC-3 per costruzione). Il dettaglio è un `<section role="region" aria-label="Dettaglio collaboratori {ragioneSociale}">` reso tra la tabella per offerta e la riga rimborsi: per ogni offerta di `perOfferta`, un sottotitolo con codice+descrizione e una tabella (Collaboratore / Ore fatturabili / Giornate / Imponibile) con i formattatori esistenti (`formattatoreGiornate` per ore e giornate, `formattaEuro` per l'imponibile). Se `perOfferta` è vuoto (cliente presente solo per rimborsi) il dettaglio mostra il paragrafo con testo esatto "Nessuna ora fatturabile nel mese: il cliente compare solo per rimborsi trasferta" (AC-4).

  ### Decisioni Architetturali

  Nessun ADR: l'unica scelta con alternative (arrotondamento ingenuo per riga vs allocazione a resto massimo) è una politica di calcolo locale alla proiezione di fatturazione, motivata e verificata nel piano, senza impatto su modello dati persistente, sicurezza, confini di integrazione o politiche trasversali.

  ---

  ## Baseline

  | Verifica | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npx vitest run tests/unit/report-fatturazione-clienti.test.ts` | 16 test superati | I task su dominio/query rilanciano questo file con attesa di verde pieno |
  | `npx tsc --noEmit` | Superato, exit 0 | Nessun file modificato può introdurre diagnostici; atteso verde a ogni task |
  | `npm run lint` | Superato (ESLint + guardrail e2e anti-flakiness) | Obbligatorio dopo le modifiche e2e; atteso verde |

  Prerequisiti d'ambiente (separati dai fallimenti di codice): dipendenze con `npm install` (il `postinstall` genera il client Prisma); la suite Playwright usa global-setup, database locale, factory e risorse riservate come da `tests/e2e/README.md` — nessun setup aggiuntivo da inventare.

  ---

  ## Mappa delle Evidenze di Accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Dominio: righe di due collaboratori su due offerte. E2E: cliente factory in mese riservato con Ada 8h su OFF-1, Grace 4h su OFF-1 e 8h su OFF-2 (tariffe 640 e 400), senza trasferte | Unit + E2E | Unit: `perCollaboratore` per offerta con ore/giornate/imponibile attesi e ordinamento decrescente. E2E: nella region espansa, gruppo OFF-1 con righe Ada ("8 h", "1 gg", "640,00 €") e Grace ("4 h", "0,5 gg", "320,00 €"), gruppo OFF-2 con Grace ("8 h", "1 gg", "400,00 €") | TASK-02, TASK-04 |
  | AC-2 | Dominio: caso di arrotondamento costruito (tariffa 100,00, due righe da 0,01h). E2E: stessa fixture di AC-1 (nessun rimborso ⇒ "Da fatturare" = imponibile manodopera) | Unit + E2E | Unit: somma delle stringhe `imponibile` di `perCollaboratore` strettamente uguale a `imponibileManodopera` ("0.25" = "0.13"+"0.12"). E2E: somma degli imponibili del dettaglio (1.360,00 €) uguale al testo di `report-client-{id}-totale` | TASK-02, TASK-04 |
  | AC-3 | Due clienti factory nello stesso mese riservato, un'attività ciascuno | E2E | Espandi A → region A visibile; espandi B → region B visibile e region A `toHaveCount(0)`; riseleziona B → region B `toHaveCount(0)`; `aria-expanded` coerente sul bottone | TASK-04 |
  | AC-4 | Cliente factory con una sola riga non fatturabile con trasferta coperta da scaglione riservato (compare nel report solo per rimborsi) | E2E | Espansione → testo esatto "Nessuna ora fatturabile nel mese: il cliente compare solo per rimborsi trasferta" visibile nella region; nessuna tabella collaboratori | TASK-04 |

  ---

  ## Strategia di Test

  Il dominio prova aggregazione, ordinamento e quadratura dell'allocazione (il livello dove l'errore di un centesimo può nascere); Playwright prova i quattro criteri come li vede il revisore, con dati factory in mesi riservati distinti per scenario così gli scenari non si contaminano. Il mapping sottile di `src/lib/report.ts` (include e due campi) non ha una suite unit dedicata oggi: è coperto end-to-end dagli scenari Playwright, che attraversano query reale, serializzazione e UI.

  - Unit dominio (`tests/unit/report-fatturazione-clienti.test.ts`): raggruppamento `perCollaboratore` per offerta su più offerte e collaboratori; somma di righe multiple dello stesso collaboratore sulla stessa offerta; esclusione delle righe non fatturabili dal dettaglio; ordinamento (ore decrescenti, pareggio per nome); quadratura esatta della somma degli imponibili col valore visualizzato `imponibileManodopera`, incluso il caso di arrotondamento 0,125+0,125; cliente solo-rimborsi con `perOfferta` vuoto (comportamento esistente confermato).
  - E2E: tre scenari con codici spec riservati distinti (`US-037-DETTAGLIO-COLLABORATORI`, `US-037-ESPANSIONE-SINGOLA`, `US-037-SOLO-RIMBORSI`) per riservare mesi diversi; oracoli sui testi visibili (ore, giornate, euro it-IT), mai su stato interno; nessun hard wait, selettori per ruolo/etichetta, `data-testid` esistenti delle schede cliente.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (suite esistente, `fullyParallel`, factory e risorse riservate)
  **Demo video:** attesa filmabile (registrazione a carico di `archetipo-review`, non dell'implementazione)

  | Scenario | Flusso utente |
  |---|---|
  | Dettaglio collaboratori con quadratura | L'admin apre il report sul mese riservato, seleziona la riga del cliente e osserva per ciascuna offerta i collaboratori con ore, giornate e imponibile; la somma degli imponibili coincide con l'importo del cliente (nessun rimborso nella fixture) |
  | Espansione esclusiva | Con due clienti nel mese, l'admin espande il primo, poi il secondo (il primo si richiude), poi riseleziona il secondo che si richiude |
  | Cliente solo rimborsi | L'admin espande un cliente presente solo per rimborsi trasferta e osserva il messaggio esplicito di assenza di ore fatturabili |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [backlog/specs/US-037, domains/fatturazione-clienti, decisions/giornata-otto-ore, decisions/importi-decimali]
    update_after_acceptance: [domains/fatturazione-clienti]
    create: []
  ```

  ---

  _Nessun mockup generato: la spec rende espandibile la scheda cliente esistente aggiungendo una sezione che ne ricalca lo stile tabellare — chiamata registrata nel Team Brief e sovrascrivibile dall'utente._

  _Piano generato via ARchetipo Planning — 2026-07-21_
tasks:
  - id: TASK-01
    title: Estendi dominio e query con il dettaglio collaboratori per offerta
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `calcolaReportFatturazioneClienti` produce per ogni offerta il dettaglio `perCollaboratore` (ore fatturabili, giornate, imponibile allocato a resto massimo) e `src/lib/report.ts` fornisce i dati del collaboratore, con progetto compilante e test esistenti verdi.

      ## Read
      - src/domain/consuntivi/index.ts — sezione "Report fatturazione clienti" (righe 318-498): `RigaReportFatturazione`, `VoceOffertaReport`, accumulatori e ciclo di `calcolaReportFatturazioneClienti`
      - src/domain/consuntivi/index.ts — ordinamento `perCollaboratore` in `calcolaAvanzamentoOfferte` (righe 649-663) come riferimento per il criterio di ordinamento
      - src/lib/report.ts — `findMany` e mapping `righeMappate`
      - tests/unit/report-fatturazione-clienti.test.ts — helper `riga()` (righe 11-26)

      ## Change
      - src/domain/consuntivi/index.ts — aggiungi `collaboratoreId: string` e `collaboratoreNome: string` (obbligatori) a `RigaReportFatturazione`; definisci ed esporta `VoceCollaboratoreOffertaReport`; aggiungi `perCollaboratore: VoceCollaboratoreOffertaReport[]` a `VoceOffertaReport`; implementa accumulo per collaboratore e allocazione a resto massimo dentro `calcolaReportFatturazioneClienti`
      - src/lib/report.ts — aggiungi `collaboratore: true` all'`include` del `findMany`, estendi `RigaAttivitaConContesto` con `collaboratore: Collaboratore` (import dal client Prisma) e mappa `collaboratoreId` e `collaboratoreNome` in `righeMappate`
      - tests/unit/report-fatturazione-clienti.test.ts — SOLO adeguamento di compilazione: default `collaboratoreId: "collaboratore-1"` e `collaboratoreNome: "Mario Rossi"` nell'helper `riga()`
      - Non-goal: nessuna modifica UI, nessun nuovo caso di test (TASK-02), nessuna modifica a `VoceClienteReport`, ai totali o allo schema Prisma; imponibile manodopera cliente e imponibile per offerta restano calcolati come oggi

      ## Steps
      1. Estendi `RigaReportFatturazione` con `collaboratoreId` e `collaboratoreNome` (JSDoc breve).
      2. Definisci ed esporta `VoceCollaboratoreOffertaReport { collaboratoreId: string; collaboratoreNome: string; oreFatturabili: number; giornateFatturabili: number; imponibile: string }` e aggiungi `perCollaboratore` a `VoceOffertaReport`.
      3. In `AccumulatoreOfferta` aggiungi `collaboratori: Map<string, { collaboratoreId; collaboratoreNome; oreFatturabili: number }>`; nel ciclo esistente, per le sole righe `fatturabile`, accumula le ore anche per collaboratore.
      4. Nella costruzione di `perOfferta` (solo offerte con `giornateFatturabili > 0`, invariato), materializza per ogni offerta le voci collaboratore con `giornateFatturabili = oreFatturabili / ORE_PER_GIORNATA` e imponibile grezzo `giornateFatturabili * tariffaGiornaliera`, ordinate per `oreFatturabili` decrescenti con pareggio `collaboratoreNome.localeCompare` (stesso criterio del dettaglio avanzamento offerte).
      5. Applica l'allocazione a resto massimo per cliente, sull'elenco piatto di tutte le voci collaboratore del cliente nell'ordine deterministico (offerte per codice — già ordinate — poi collaboratori nell'ordine del punto 4): `targetCents = Math.round(Number(imponibileManodoperaCliente.toFixed(2)) * 100)` (ancorato alla stringa visualizzata); per ogni voce `rawCents = imponibileGrezzo * 100`, `floorCents = Math.floor(rawCents + 1e-6)`, frazione `rawCents - floorCents`; distribuisci i `targetCents - sommaFloor` centesimi residui uno ciascuno alle voci con frazione maggiore (ordinamento stabile: frazione decrescente, pareggio per posizione nell'elenco); assegna `imponibile = (centesimi / 100).toFixed(2)`.
      6. In `src/lib/report.ts` aggiungi `collaboratore: true` all'`include`, estendi il tipo locale e mappa `collaboratoreId: riga.collaboratoreId` e `collaboratoreNome: `${riga.collaboratore.nome} ${riga.collaboratore.cognome}`` come già fatto in `src/lib/offerte.ts`.
      7. Adegua l'helper `riga()` del test come da Change (solo default, nessun nuovo `it`).

      ## Verify
      - Run: `npx vitest run tests/unit/report-fatturazione-clienti.test.ts` (da /Users/smarello/repo/coaching-planner)
      - Expect: 16 test superati, nessun fallimento (baseline verde invariata)
      - Run: `npx tsc --noEmit`
      - Expect: exit 0, nessun diagnostico (baseline verde invariata)

      ## Done
      - [ ] AC-1 — `perOfferta[].perCollaboratore` espone ore fatturabili, giornate equivalenti e imponibile per collaboratore (contratto dati pronto per la UI)
      - [ ] AC-2 — la somma degli `imponibile` di tutte le voci collaboratore di un cliente coincide per costruzione con `imponibileManodopera` (allocazione a resto massimo ancorata al valore visualizzato)
      - [ ] Il risultato resta interamente serializzabile e i valori esistenti (per offerta, cliente, totali) sono invariati

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Unit test di dominio sul dettaglio collaboratori e sulla quadratura
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Raggruppamento, ordinamento, esclusione delle ore non fatturabili e quadratura esatta degli imponibili del dettaglio collaboratori sono provati da unit test con valori attesi concreti.

      ## Read
      - tests/unit/report-fatturazione-clienti.test.ts — helper `riga()`, `scaglioni`, stile dei describe/it esistenti
      - src/domain/consuntivi/index.ts — `VoceCollaboratoreOffertaReport` e allocazione introdotte da TASK-01

      ## Change
      - tests/unit/report-fatturazione-clienti.test.ts — nuova sezione di test "Dettaglio per collaboratore" coerente con lo stile del file; nessuna modifica ai test esistenti

      ## Steps
      1. Caso raggruppamento (AC-1): due collaboratori su due offerte (Ada 8h su OFF-001 tariffa 500, Bruno 4h su OFF-001 e 8h su OFF-002 tariffa 400) → OFF-001 ha `perCollaboratore` `[Ada (8h, 1gg, "500.00"), Bruno (4h, 0.5gg, "250.00")]`, OFF-002 ha `[Bruno (8h, 1gg, "400.00")]`.
      2. Caso somma righe multiple: due righe dello stesso collaboratore sulla stessa offerta (8h + 4h) → una sola voce con 12 ore e 1,5 giornate.
      3. Caso esclusione (fuori perimetro): righe non fatturabili di un secondo collaboratore non producono voce in `perCollaboratore` e non alterano gli imponibili.
      4. Caso ordinamento: a parità di offerta, voci ordinate per ore decrescenti; con ore uguali, per nome crescente.
      5. Caso quadratura con arrotondamento (AC-2): tariffa 100, due collaboratori con 0,01h ciascuno sulla stessa offerta → `imponibileManodopera` "0.25" e `perCollaboratore` con imponibili "0.13" (prima voce nell'ordine deterministico) e "0.12": somma delle stringhe uguale al totale, mai "0.26".
      6. Caso quadratura generale: nella fixture del punto 1, somma numerica degli `imponibile` di tutte le voci del cliente strettamente uguale a `Number(imponibileManodopera)`.
      7. Caso cliente solo-rimborsi: riga non fatturabile con `trasfertaKm` coperto dagli scaglioni → cliente presente con `perOfferta` vuoto (conferma del comportamento su cui si appoggia AC-4).

      ## Verify
      - Run: `npx vitest run tests/unit/report-fatturazione-clienti.test.ts` (da /Users/smarello/repo/coaching-planner)
      - Expect: tutti i test superati, inclusi i nuovi casi

      ## Done
      - [ ] AC-1 — raggruppamento per offerta e valori ore/giornate/imponibile asseriti su valori concreti
      - [ ] AC-2 — quadratura esatta asserita sia nel caso generale sia nel caso di arrotondamento 0,125+0,125
      - [ ] Esclusione delle ore non fatturabili e caso solo-rimborsi coperti

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Espansione della scheda cliente con dettaglio collaboratori nella UI del report
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Nel report Fatturazione Clienti la selezione dell'intestazione di una scheda cliente espande (esclusivamente, una alla volta) il dettaglio collaboratori per offerta, o il messaggio di assenza ore fatturabili per i clienti solo-rimborsi.

      ## Read
      - src/app/(back-office)/report/fatturazione-clienti/report-fatturazione-clienti.tsx — struttura della scheda cliente (intestazione righe 197-220, tabella per offerta 222-272), formattatori `formattaEuro` e `formattatoreGiornate`
      - src/app/(back-office)/offerte/dettaglio-avanzamento-offerta.tsx — riferimento di stile per tabella collaboratori e messaggio di vuoto
      - src/lib/report.ts — campo `perCollaboratore` esposto da TASK-01

      ## Change
      - src/app/(back-office)/report/fatturazione-clienti/report-fatturazione-clienti.tsx — trasforma l'intestazione della scheda in toggle accessibile, aggiungi lo stato di espansione esclusiva e la sezione di dettaglio; nessuna modifica a barra mese, pill riepilogo, stato vuoto pagina, tabella per offerta, righe rimborsi/totale e scheda totale complessivo
      - Non-goal: nessun parametro URL, nessuna server action, nessun nuovo file

      ## Steps
      1. Aggiungi `const [clienteEspansoId, setClienteEspansoId] = useState<string | null>(null)` (import `useState`); il click su un cliente imposta `clienteEspansoId === cliente.clienteId ? null : cliente.clienteId` (AC-3 per costruzione: espandere un altro cliente richiude il precedente, riselezionare richiude).
      2. Trasforma il contenitore dell'intestazione della scheda (il div con ragione sociale e "Da fatturare") in `<button type="button">` a larghezza piena che conserva layout e classi attuali, con `aria-expanded={espanso}`, `aria-controls={`dettaglio-collaboratori-${cliente.clienteId}`}` e `aria-label={`Dettaglio collaboratori ${cliente.clienteRagioneSociale}`}`; aggiungi `cursor-pointer` e un chevron svg decorativo (`aria-hidden`) che ruota quando espanso. L'intestazione attuale non contiene elementi interattivi, quindi la trasformazione è sicura.
      3. Quando espanso, renderizza tra la tabella per offerta e la riga "Rimborsi trasferta ribaltati" un `<section role="region" id={`dettaglio-collaboratori-${cliente.clienteId}`} aria-label={`Dettaglio collaboratori ${cliente.clienteRagioneSociale}`}>` con un'intestazione di sezione in stile con le etichette uppercase esistenti (es. "Ore erogate per collaboratore").
      4. Nel dettaglio, se `cliente.perOfferta.length === 0` (cliente presente solo per rimborsi) mostra un paragrafo con testo esatto "Nessuna ora fatturabile nel mese: il cliente compare solo per rimborsi trasferta" nello stile del messaggio di vuoto del dettaglio avanzamento offerta (AC-4).
      5. Altrimenti, per ogni offerta di `cliente.perOfferta`: sottotitolo con badge `offertaCodice` (riusa lo stile del badge esistente) e descrizione, seguito da una tabella (dentro `overflow-x-auto`) con colonne "Collaboratore", "Ore fatturabili", "Giornate", "Imponibile": per ogni voce di `perCollaboratore` renderizza `formattatoreGiornate.format(oreFatturabili)` + " h", `formattatoreGiornate.format(giornateFatturabili)` + " gg" e `formattaEuro(imponibile)`, con classi coerenti con la tabella per offerta esistente (bordi zinc, `tabular-nums`, varianti dark).
      6. Verifica visivamente la coerenza chiaro/scuro riusando esclusivamente classi già presenti nel file o nel dettaglio avanzamento offerta.

      ## Verify
      - Run: `npx tsc --noEmit` (da /Users/smarello/repo/coaching-planner)
      - Expect: exit 0, nessun diagnostico
      - Run: `npm run lint`
      - Expect: superato senza nuovi errori o warning (baseline verde)

      ## Done
      - [ ] AC-1 — dettaglio espanso con collaboratori per offerta (ore, giornate, imponibile) reso dai dati di dominio
      - [ ] AC-3 — stato di espansione esclusiva con toggle accessibile (`aria-expanded`, region con nome)
      - [ ] AC-4 — testo esatto "Nessuna ora fatturabile nel mese: il cliente compare solo per rimborsi trasferta" per i clienti senza offerte nel dettaglio
      - [ ] Nessuna regressione visiva/strutturale alle parti non toccate della pagina

      ## Blockers
