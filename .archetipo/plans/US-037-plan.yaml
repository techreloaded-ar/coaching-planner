  - id: TASK-04
    title: Test e2e Playwright del dettaglio collaboratori nel report
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Objective
      I quattro criteri di accettazione sono provati nel browser reale sul report Fatturazione Clienti con dati factory in mesi riservati distinti, senza mock e nel rispetto del contratto anti-flakiness.

