      La pagina `domains/fatturazione-clienti` smette di descrivere il report come dipendente da scaglioni/fasce chilometriche ricalcolate a lettura e riflette il comportamento reale introdotto da US-054: il report somma l'importo di rimborso già fotografato su ogni riga, senza consultare alcuna configurazione esterna al momento dell'aggregazione. Corregge il commento di rework su `docs/wiki/domains/fatturazione-clienti.md:72` (e le righe collegate 40, 51, 54, 66) che affermava l'esatto contrario del comportamento attuale.

      ## Read
      - docs/wiki/domains/fatturazione-clienti.md — intera pagina, in particolare frontmatter (righe 1-24), sezione Ownership (riga 40), Flussi osservati punti 2 e 5 (righe 51, 54), tabella Codice riga «Dati letti» (riga 66), sezione Invarianti e limiti (riga 72)
      - src/lib/report.ts — conferma che `reportFatturazioneClientiMese` non carica più alcuna voce/scaglione e mappa `rimborsoTrasfertaImporto` dalla riga (riga 103)
      - src/domain/consuntivi/index.ts — conferma che `calcolaReportFatturazioneClienti` non riceve più un parametro di configurazione esterna

      ## Change
      - docs/wiki/domains/fatturazione-clienti.md, frontmatter: cambia `status: reviewed` in `status: generated` e rimuovi interamente il blocco `review:` (le quattro righe `content_hash`, `evidence_revision`, `reviewed_at` prima del delimitatore `---` di chiusura).
      - Riga 40 (Ownership), testo attuale: "Possiede il contratto e le regole della proiezione, ma nessun aggregate persistito. Consuma righe attività, metadati cliente/offerta e scaglioni correnti. Non possiede la tariffa commerciale o la distanza registrata." — sostituiscilo con: "Possiede il contratto e le regole della proiezione, ma nessun aggregate persistito. Consuma righe attività — incluso il rimborso trasferta già fotografato su ciascuna riga — e metadati cliente/offerta. Non possiede la tariffa commerciale né alcuna configurazione delle voci di rimborso: quella configurazione non viene più letta al momento dell'aggregazione."
      - Riga 51 (Flussi osservati, punto 2), testo attuale: "Mappa Decimal e relazioni in input serializzabili, carica gli scaglioni e invoca `calcolaReportFatturazioneClienti`." — sostituiscilo con: "Mappa Decimal e relazioni in input serializzabili e invoca `calcolaReportFatturazioneClienti`, che non riceve più alcun parametro di configurazione esterna: somma direttamente il `rimborsoTrasfertaImporto` già presente su ogni riga."
      - Riga 54 (Flussi osservati, punto 5), testo attuale: "Una trasferta con rimborso `OK` viene ribaltata al cliente anche su riga non fatturabile; questi clienti \"solo rimborsi\" hanno `perOfferta` vuoto, e la UI lo segnala esplicitamente nel dettaglio." — sostituiscilo con: "Una riga con `rimborsoTrasfertaImporto` fotografato viene ribaltata al cliente anche su riga non fatturabile; questi clienti \"solo rimborsi\" hanno `perOfferta` vuoto, e la UI lo segnala esplicitamente nel dettaglio."
      - Riga 66 (tabella Codice, riga «Dati letti»), testo attuale: "| Dati letti | `prisma/schema.prisma` (`RigaAttivita`, `Offerta`, `Cliente`, `ScaglioneKm`) |" — sostituiscilo con: "| Dati letti | `prisma/schema.prisma` (`RigaAttivita`, `Offerta`, `Cliente`) |"
      - Riga 72 (Invarianti e limiti), testo attuale: "Accesso solo amministratore. La tariffa è quella corrente dell'offerta e gli scaglioni sono quelli correnti; modifiche successive ricalcolano mesi storici, quindi il risultato non è una fattura immutabile. Lo schema non garantisce coerenza fra cliente diretto della riga e cliente dell'offerta: la proiezione usa il cliente della riga per il raggruppamento e la tariffa dell'offerta per il calcolo. Le distanze oltre soglia o senza fascia non producono rimborso nel report." — sostituiscilo con: "Accesso solo amministratore. La tariffa è quella corrente dell'offerta; modifiche successive alla tariffa ricalcolano mesi storici, quindi il risultato non è una fattura immutabile su quel fronte. Il rimborso trasferta, invece, è uno snapshot: il report somma `rimborsoTrasfertaImporto` già fotografato su ogni riga al momento del salvataggio, quindi una modifica o eliminazione successiva di una voce di rimborso non altera i mesi storici già riportati. Lo schema non garantisce coerenza fra cliente diretto della riga e cliente dell'offerta: la proiezione usa il cliente della riga per il raggruppamento e la tariffa dell'offerta per il calcolo. Una riga senza rimborso fotografato non contribuisce alcun importo di rimborso al report."

      ## Steps
      1. Applica la modifica al frontmatter come da Change.
      2. Applica in ordine le cinque sostituzioni di testo elencate in Change, senza alterare il resto della pagina (titoli di sezione, commenti `<!-- archetipo:wiki section=... -->`, link in "Concetti correlati").
      3. Rileggi l'intera pagina per verificare che nessun riferimento a `scaglioni`, `ScaglioneKm`, `fascia`/`fasce` o `soglia` sia rimasto, salvo dove esplicitamente richiesto da un'altra pagina (non applicabile qui).

      ## Verify
      - Run: `grep -niE "scaglion|fascia|soglia" docs/wiki/domains/fatturazione-clienti.md` (da `/Users/smarello/repo/coaching-planner/.archetipo/worktrees/US-054`) — Expect: nessun risultato.
      - Run: `archetipo wiki --project-root "$(pwd)" validate --profile bootstrap` — Expect: `data.ok: true` (i warning `WIKI_EVIDENCE_CHANGED` preesistenti restano ammessi, non sono un blocco).

      ## Done
      - [ ] Rework — `docs/wiki/domains/fatturazione-clienti.md` non descrive più un ricalcolo a lettura dei rimborsi né cita `ScaglioneKm`/fasce/soglie; afferma esplicitamente che il rimborso è uno snapshot fotografato e la tariffa resta ricalcolata.
      - [ ] Frontmatter aggiornato a `status: generated` senza blocco `review:` residuo.

      ## Blockers
      None.
