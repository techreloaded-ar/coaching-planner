schema: archetipo/plan/v2
spec_code: US-054
body: |-
  # US-054: Scaglioni di rimborso a voci libere con selezione a tendina — Piano di Implementazione

  **Generato da:** Team di Planning ARchetipo
  **Data:** 2026-07-31

  ---

  ## Spec

  **Epic:** EP-005 — Evoluzioni Post-MVP
  **Priorità:** HIGH | **Punti:** 5

  **Storia Utente**
  Come amministratore, voglio definire le voci di rimborso trasferta come etichette libere con un importo configurato, che il collaboratore seleziona da una tendina al posto dei chilometri percorsi, così da semplificare la gestione dei rimborsi e coprire anche casi non legati alla distanza (es. "rimborso speciale per eventi").

  **Criteri di Accettazione**
  - AC-1 — L'amministratore crea, modifica ed elimina voci di rimborso composte da etichetta libera obbligatoria e importo; il limite chilometrico non esiste più né nel form né nell'elenco.
  - AC-2 — Un importo assente, non positivo o con più di due decimali viene rifiutato con un messaggio di errore visibile e la voce non viene salvata.
  - AC-3 — Nel form della riga attività il campo chilometri è sostituito da una tendina opzionale con le voci configurate, mostrate per etichetta; senza selezione la riga non ha rimborso trasferta.
  - AC-4 — Al salvataggio la riga fotografa etichetta e importo correnti della voce selezionata; una successiva modifica della voce da parte dell'amministratore non cambia etichetta e importo mostrati sulla riga già salvata.
  - AC-5 — L'eliminazione di una voce è sempre consentita: la voce sparisce dalla tendina per le nuove righe, mentre le righe già salvate continuano a mostrare etichetta e importo fotografati.
  - AC-6 — Il riepilogo mensile del collaboratore e i report amministrativi sommano i rimborsi usando gli importi fotografati sulle righe.
  - AC-7 — I dati chilometrici delle righe esistenti vengono rimossi in modo definitivo: nessuna riga preesistente mostra chilometri o rimborso trasferta dopo la migrazione.

  **Fuori Perimetro:** ordinamento manuale delle voci (si usa l'ordine di creazione); storicizzazione/versioning delle voci; retrocompatibilità con i km percorsi (il dato scompare del tutto); report aggregati per voce di rimborso.

  ---

  ## Soluzione Tecnica

  Oggi il rimborso trasferta è **calcolato al momento della lettura**: la riga attività conserva solo `trasfertaKm` e `calcolaRimborsoTrasferta(km, scaglioni)` in `src/domain/consuntivi/index.ts` seleziona la fascia chilometrica corrente ogni volta che una pagina, un riepilogo o un report vengono renderizzati (per questo la Wiki registra che riepiloghi storici cambiano se cambia la configurazione). US-054 sostituisce questo modello con una **fotografia al salvataggio**: la riga attività smette di riferirsi a un chilometraggio e conserva direttamente `rimborsoTrasfertaEtichetta` ed `rimborsoTrasfertaImporto`, copiati dalla voce selezionata nell'istante del salvataggio. Da quel momento la riga non dipende più in alcun modo dalla configurazione delle voci: una modifica o un'eliminazione successiva della voce non altera nulla di già salvato (AC-4/AC-5), e riepilogo mensile e report smettono di aver bisogno di un calcolo — diventano una semplice somma dei valori già presenti sulle righe (AC-6), il che semplifica anche `src/domain/consuntivi/index.ts` rimuovendo `calcolaRimborsoTrasferta`/`validaKmTrasferta`.

  Punti chiave:

  - **Modello dati**: il modello `ScaglioneKm` (soglia chilometrica + importo) è sostituito da `VoceRimborsoTrasferta` (etichetta libera + importo), senza vincolo di unicità sull'etichetta — non serve, perché le voci non individuano più fasce contigue da non sovrapporre. `RigaAttivita.trasfertaKm` è sostituito dalla coppia `rimborsoTrasfertaEtichetta`/`rimborsoTrasfertaImporto`, entrambi nulli insieme (nessun rimborso) o valorizzati insieme (rimborso fotografato). Nessuna FK tra `RigaAttivita` e `VoceRimborsoTrasferta`: è la continuazione dello stesso pattern già in uso (la Wiki registra che l'eliminazione di uno scaglione non aveva FK verso le attività), ma ora la fotografia riguarda anche l'importo, non solo l'identificativo della fascia.
  - **UX di modifica riga (punto delicato)**: nel form giornata la tendina non può "precompilarsi" con la voce originale della riga in modifica, perché la riga non conserva alcun id di voce (solo etichetta/importo testuali fotografati). Se il form inviasse sempre il campo tendina (comportamento attuale per `trasfertaKm`), un salvataggio che lascia la tendina intonsa in modifica ri-fotograferebbe silenziosamente il rimborso dalla voce corrente, violando AC-4. La tendina in modalità modifica espone quindi tre stati: **"Non modificare il rimborso attuale"** (default all'apertura della modifica — il campo non viene inviato nel FormData, la riga resta esattamente come fotografata), **"Nessun rimborso"** (invia stringa vuota, azzera esplicitamente etichetta/importo), oppure una voce specifica (invia il suo id, la riga viene rifotografata dalla voce corrente). In creazione la tendina non ha lo stato "non modificare": il default è "Nessun rimborso". Il rimborso attualmente fotografato sulla riga in modifica resta visibile come testo informativo separato dalla tendina.
  - **Riepilogo e report**: `calcolaRiepilogoMese` e `calcolaReportFatturazioneClienti` in `src/domain/consuntivi/index.ts` perdono il parametro `scaglioni` e sommano direttamente `rimborsoTrasfertaImporto` dalle righe: non c'è più alcuna dipendenza da una configurazione esterna al momento dell'aggregazione.
  - **Denominazione**: in coerenza con l'istruzione di preferire nomi parlanti, l'intera area amministrativa cambia da `anagrafiche/scaglioni` a `anagrafiche/voci-rimborso` (route, file, componenti, copy UI), perché mantenere il nome "scaglioni" per un'etichetta libera senza fasce sarebbe fuorviante.

  ### Decisioni Architetturali

  La scelta "fotografia diretta su `RigaAttivita`, senza FK e senza tabella di versioning" attraversa la soglia ADR: incide sul modello dati persistente e sulla semantica di consistenza (i valori storici restano stabili anche quando la configurazione cambia), e sceglie tra alternative reali — (a) mantenere una FK verso `VoceRimborsoTrasferta` e ricalcolare a lettura (scartata: riprodurrebbe il bug di ricalcolo retroattivo che l'US corregge, viola AC-4); (b) FK più tabella di versioning delle voci (esplicitamente fuori perimetro nella user story); (c) copiare etichetta e importo direttamente sulla riga al salvataggio, senza alcun riferimento all'id della voce (scelta). Questa decisione è registrata nella nuova pagina Wiki `decisions/fotografia-rimborso-trasferta` (TASK-18). Non esiste una decisione `type: decision` preesistente su questo tema da aggiornare o superare.

  ---

  ## Baseline

  | Check | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm test` (vitest run, da `/Users/smarello/repo/coaching-planner`) | 39 file di test, 634 test, tutti superati | Ogni task che tocca un file di test deve mantenere l'intera suite verde; i task che rimuovono funzioni (`calcolaRimborsoTrasferta`, `validaKmTrasferta`) devono anche rimuovere/riscrivere i test che le esercitano nello stesso task o nel task Test immediatamente successivo, mai lasciarli rossi tra un task e l'altro più del necessario |
  | `npm run lint` (eslint + guardrail e2e anti-flakiness) | Superato, nessun warning | I task che toccano `tests/e2e/**` devono continuare a rispettare il guardrail (niente `workers:1`, niente attese fisse, selezione per label/valore, mai per indice) |
  | `npx tsc --noEmit -p .` | Superato, nessun errore | Il modello `ScaglioneKm`/campo `trasfertaKm` sarà rimosso da `prisma/schema.prisma` in TASK-01: da quel momento e finché i task successivi non aggiornano tutti i consumatori, `tsc` mostrerà errori attesi e temporanei nei file non ancora toccati — non è una regressione da correggere task per task, ma deve tornare pulito prima del gate finale (TASK-21) |
  | `npm run build` / `npm run test:e2e` | Non eseguiti in fase di pianificazione (richiedono rispettivamente una build completa e Postgres + Playwright locali) | Il task Test finale (TASK-21) li esegue per primo con dati reali; qualunque fallimento a quel punto è una regressione di questa spec da correggere, non un'eccezione di baseline |

  ---

  ## Mappa di Evidenza dell'Accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Nessuna voce di rimborso configurata | unit + e2e | Form `/anagrafiche/voci-rimborso/nuovo` senza alcun campo chilometrico; dopo creazione la voce appare nell'elenco con etichetta e importo; modifica e eliminazione riflesse nell'elenco | TASK-07, TASK-08, TASK-16 |
  | AC-2 | Form voce di rimborso aperto | unit + e2e | Importo vuoto, `0`, negativo o con >2 decimali produce messaggio di errore visibile e nessuna scrittura (`db.voceRimborsoTrasferta.create/update` non chiamato) | TASK-02, TASK-03, TASK-08, TASK-16 |
  | AC-3 | Voci di rimborso esistenti, form riga attività aperto | unit + e2e | Tendina con le voci per etichetta al posto del campo km; riga salvata senza selezione non mostra alcun rimborso | TASK-10, TASK-11, TASK-13, TASK-17 |
  | AC-4 | Riga salvata con una voce selezionata, poi l'amministratore ne cambia l'importo | unit + e2e | La riga già salvata continua a mostrare l'etichetta/importo originali fotografati (assert diretto sui campi persistiti, non un ricalcolo) | TASK-10, TASK-11, TASK-13, TASK-17 |
  | AC-5 | Voce usata da una riga salvata, poi eliminata dall'amministratore | e2e | L'eliminazione riesce senza blocco; la voce sparisce dalla tendina per nuove righe; la riga storica mantiene etichetta/importo fotografati | TASK-07, TASK-17 |
  | AC-6 | Più righe del mese con rimborsi fotografati diversi | unit + e2e | `calcolaRiepilogoMese`/`calcolaReportFatturazioneClienti` sommano `rimborsoTrasfertaImporto` senza alcun parametro scaglioni; riepilogo collaboratore e report amministrativo mostrano il totale coerente | TASK-04, TASK-05, TASK-09, TASK-12, TASK-17 |
  | AC-7 | Righe attività preesistenti con `trasfertaKm` valorizzato | migrazione + unit + tsc | La colonna `trasfertaKm` non esiste più nello schema dopo la migrazione; nessun riferimento residuo nel codice applicativo (grep e `tsc --noEmit` puliti) | TASK-01, TASK-04, TASK-09, TASK-10, TASK-12, TASK-13, TASK-21 |

  Questa è una mappa di evidenza, non un riepilogo dei task: l'elenco completo dei task vive nell'array strutturato `tasks`.

  ---

  ## Strategia di Test

  La maggior parte della logica resta in funzioni pure (`src/domain/**`) e in query/azioni server con Prisma mockato: la copertura unit è quindi il livello primario, come già per la capability sostituita. Gli scenari che attraversano un confine di persistenza reale, di route e di più pagine (creazione voce → selezione in tendina → salvataggio → modifica voce → verifica del congelamento → riepilogo mensile) richiedono e2e Playwright, perché solo lì è osservabile che il dato è davvero persistito e non ricalcolato a runtime.

  - Unit: validazione voce (`validaVoceRimborso`), DAL/azioni amministrative, azioni riga attività (fotografia al salvataggio, stato "non modificare"), riepilogo mensile e report fatturazione con importi già fotografati.
  - Integrazione: nessuna aggiunta specifica oltre ai mock Prisma già in uso nel repo.
  - E2E: obbligatorio per AC-1/2 (CRUD amministrativo con redirect e persistenza dopo reload), AC-3/4/5 (selezione in tendina, fotografia al salvataggio, sopravvivenza a modifica/eliminazione della voce — nessun livello inferiore può provare che una riga già a database non cambi quando l'amministratore altrove modifica una voce) e AC-6 (riepilogo mensile e report letti dal browser).

  ### E2E — Simulazione Utente

  **Framework:** Playwright (`tests/e2e`)
  **Video demo:** Sì, la sezione "Dimostrazione" della spec è filmabile end-to-end (crea voce → seleziona in tendina → salva → modifica importo voce → verifica congelamento → riepilogo); la registrazione è a cura di `archetipo-review`, non di questa fase.

  | Scenario | Descrizione del flusso utente |
  |---|---|
  | CRUD voci di rimborso (AC-1, AC-2) | Amministratore crea una voce con etichetta e importo, la vede nell'elenco, la modifica, verifica la persistenza dopo reload, la elimina con conferma |
  | Selezione e fotografia (AC-3, AC-4, AC-5, AC-6) | Collaboratore apre il dettaglio giornata, seleziona una voce dalla tendina, salva la riga e vede il rimborso nel riepilogo del giorno e nel riepilogo mensile; l'amministratore modifica l'importo della voce usata; la riga e il riepilogo mensile restano invariati; l'amministratore elimina la voce e la riga storica resta invariata mentre la tendina per nuove righe non la propone più |

  Nessuna waiver e2e: il congelamento (AC-4/AC-5) è per definizione un comportamento cross-confine (persistenza + configurazione amministrativa successiva) che nessun test a livello inferiore può dimostrare da solo.

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [domains/politiche-rimborso, domains/attivita, decisions/importi-decimali, decisions/calcoli-puri, architecture/context-map, domains/fatturazione-clienti, overview, operations/development, decisions/feedback-attesa-uniforme]
    update: [domains/politiche-rimborso, domains/attivita, domains/fatturazione-clienti, architecture/context-map, overview, operations/development, decisions/importi-decimali, decisions/feedback-attesa-uniforme]
    create: [decisions/fotografia-rimborso-trasferta]
  ```

  `domains/politiche-rimborso` cambia ownership e linguaggio (non più fasce/soglie ma voci a etichetta libera, nessun calcolo a lettura). `domains/attivita` cambia il contratto del form riga (tendina invece di km) e il comportamento di `modificaRiga`/`rimuoviTrasferta` (fotografia invece di ricalcolo). `domains/fatturazione-clienti` cambia perché il report non consuma più scaglioni al momento dell'aggregazione ma somma direttamente l'importo già fotografato sulla riga: ownership, flussi, dati letti e invarianti vanno riscritti (feedback di rework). `architecture/context-map` cambia perché il candidato "Politiche di rimborso" e le relazioni che lo citano descrivono ancora fasce chilometriche invece di voci a etichetta libera, e l'invariante sullo snapshot deve distinguere tariffa (ricalcolata) da rimborso (fotografato). `overview` e `operations/development` usano ancora il termine "scaglioni" per un'area amministrativa e un modello dati che non esistono più. `decisions/importi-decimali` e `decisions/feedback-attesa-uniforme` restano semanticamente corrette nella sostanza della decisione ma citano nomi di campo/azione ("importo scaglione", "eliminazione di uno scaglione") superati dal rinominamento di questa spec: vanno aggiornate per coerenza terminologica, non per la decisione in sé. `decisions/calcoli-puri` resta semanticamente corretta e viene solo letta per coerenza, senza necessità di aggiornamento di contenuto.

  ## Rework (giro 2)

  La review ha respinto l'incremento non per difetti di codice (AC-1..AC-7 verificati indipendentemente, suite completa verde) ma perché il piano originale non aveva individuato l'intero perimetro di impatto Wiki: `domains/fatturazione-clienti`, `architecture/context-map`, `overview`, `operations/development`, `decisions/importi-decimali` e `decisions/feedback-attesa-uniforme` citano ancora scaglioni/fasce chilometriche o affermano che i rimborsi vengono ricalcolati sui mesi storici, il contrario esatto del comportamento introdotto da questa spec (fotografia al salvataggio, AC-4/AC-6). I 21 task originali restano tutti `DONE` e non vengono ritoccati. TASK-22..TASK-28 correggono puntualmente le sei pagine indicate nel feedback di rework (una pagina, `architecture/context-map`, ha due correzioni indipendenti in sezioni diverse, quindi due task). TASK-29 sostituisce il gate finale con una verifica mirata alla correttezza documentale più una riconferma di non-regressione sul codice, che in questo giro non viene toccato.

  ---

  _Piano generato via ARchetipo Planning — 2026-07-31 (rework)_
tasks:
  - id: TASK-01
    title: Sostituire ScaglioneKm con VoceRimborsoTrasferta e fotografare il rimborso su RigaAttivita
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Lo schema Prisma sostituisce `ScaglioneKm` con `VoceRimborsoTrasferta` (etichetta libera + importo) e `RigaAttivita.trasfertaKm` con i due campi fotografati `rimborsoTrasfertaEtichetta`/`rimborsoTrasfertaImporto`, con una migrazione che elimina in modo definitivo i dati chilometrici esistenti (AC-7).

      ## Read
      - prisma/schema.prisma — modelli `ScaglioneKm` (righe 136-142) e `RigaAttivita` (righe 146-166, in particolare il campo `trasfertaKm Int?`)
      - src/domain/types.ts — interfacce `ScaglioneKm` e `RigaAttivita` (mirror manuale non consumato da import reali, verificato con grep su `@/domain/types`)
      - prisma/migrations/ — convenzione di naming delle migrazioni esistenti (es. `20260728201452_indice_calendario_collaboratore`)

      ## Change
      - prisma/schema.prisma: rimuovi il modello `ScaglioneKm`; aggiungi `model VoceRimborsoTrasferta { id String @id @default(uuid()); etichetta String; importo Decimal @db.Decimal(10,2); createdAt DateTime @default(now()); updatedAt DateTime @updatedAt }` (nessun vincolo di unicità sull'etichetta). Nel modello `RigaAttivita` rimuovi `trasfertaKm Int?` e aggiungi `rimborsoTrasfertaEtichetta String?` e `rimborsoTrasfertaImporto Decimal? @db.Decimal(10,2)` (nessuna relazione/FK verso `VoceRimborsoTrasferta`: i due campi sono un valore congelato, non un riferimento).
      - prisma/migrations/<timestamp>_voci_rimborso_trasferta_libere/: nuova migrazione generata dallo strumento.
      - src/domain/types.ts: rinomina l'interfaccia `ScaglioneKm` in `VoceRimborsoTrasferta` con i campi `id`, `etichetta: string`, `importo: number`, `createdAt`, `updatedAt`; nell'interfaccia `RigaAttivita` sostituisci `trasfertaKm?: number` con `rimborsoTrasfertaEtichetta?: string` e `rimborsoTrasfertaImporto?: number`.

      ## Steps
      1. Applica le modifiche a `prisma/schema.prisma` come descritto in Change.
      2. Da `/Users/smarello/repo/coaching-planner` esegui `npx prisma migrate dev --name voci_rimborso_trasferta_libere` con un Postgres locale raggiungibile (usa `DATABASE_URL` già configurato nell'ambiente di sviluppo): genera la migrazione SQL (che include `DROP TABLE "ScaglioneKm"`, `CREATE TABLE "VoceRimborsoTrasferta"`, `ALTER TABLE "RigaAttivita" DROP COLUMN "trasfertaKm"`, `ADD COLUMN "rimborsoTrasfertaEtichetta" TEXT`, `ADD COLUMN "rimborsoTrasfertaImporto" DECIMAL(10,2)`) e applica il client generato.
      3. Se nessun Postgres locale è raggiungibile, scrivi manualmente il file SQL della migrazione seguendo lo schema del punto 2 nella cartella `prisma/migrations/<timestamp>_voci_rimborso_trasferta_libere/migration.sql`, poi esegui comunque `npx prisma generate` per rigenerare `src/generated/prisma/**`.
      4. Aggiorna `src/domain/types.ts` come da Change.

      ## Verify
      - Run: `npx prisma validate` — Expect: schema valido, nessun errore.
      - Run: `npx prisma generate` — Expect: generazione riuscita, `src/generated/prisma/models/VoceRimborsoTrasferta.ts` presente e `ScaglioneKm.ts` assente.
      - Nota: `npx tsc --noEmit -p .` mostrerà a questo punto errori attesi e temporanei nei file non ancora aggiornati dai task successivi (TASK-02..TASK-17); non è una regressione da correggere in questo task, ma deve sparire entro il gate finale (TASK-21).

      ## Done
      - [ ] AC-7 — `prisma/schema.prisma` non contiene più `ScaglioneKm` né `trasfertaKm`; la migrazione applicata rimuove fisicamente la colonna e la tabella precedenti.
      - [ ] `npx prisma validate` e `npx prisma generate` completano senza errori.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Creare la validazione pura per la voce di rimborso (etichetta + importo)
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Un nuovo modulo di dominio puro valida i dati di una voce di rimborso (etichetta obbligatoria, importo valido e positivo con al massimo due decimali), sostituendo la validazione a soglia chilometrica.

      ## Read
      - src/domain/anagrafiche/valida-scaglione.ts — struttura da sostituire: `validaScaglione`, `verificaSogliaUnica`, uso di `normalizzaTariffaGiornaliera`
      - src/domain/anagrafiche/valida-offerta.ts — `normalizzaTariffaGiornaliera` (righe 30-48), da riusare invariata per il campo importo

      ## Change
      - Crea src/domain/anagrafiche/valida-voce-rimborso.ts con: `export interface DatiVoceRimborsoInput { etichetta: string; importo: string }`; `export type ErroriValidazioneVoceRimborso = Record<string, string>`; `export function validaVoceRimborso(dati: DatiVoceRimborsoInput): ErroriValidazioneVoceRimborso` che: se `etichetta.trim() === ""` imposta `errori.etichetta = "L'etichetta è obbligatoria"`; valida `importo` con `normalizzaTariffaGiornaliera` esattamente come faceva `validaScaglione` per il campo importo (vuoto → `"L'importo forfettario è obbligatorio"`; non normalizzabile → `"Importo non valido: usa massimo 2 decimali"`; `centesimi <= 0` → `"L'importo deve essere maggiore di zero"`).
      - Elimina src/domain/anagrafiche/valida-scaglione.ts (nessuna funzione equivalente a `verificaSogliaUnica` è necessaria: le etichette non hanno vincolo di unicità).

      ## Steps
      1. Crea il nuovo file con l'interfaccia, il tipo e la funzione come descritto in Change.
      2. Elimina `src/domain/anagrafiche/valida-scaglione.ts`.
      3. Verifica con grep che nessun file sotto `src/` importi ancora `@/domain/anagrafiche/valida-scaglione` (i consumatori vengono aggiornati in TASK-07).

      ## Verify
      - Run: `npx tsc --noEmit -p .` sul solo file nuovo non è isolabile; verifica manuale che `src/domain/anagrafiche/valida-voce-rimborso.ts` non abbia errori di sintassi leggendolo dopo la scrittura.

      ## Done
      - [ ] AC-2 — `validaVoceRimborso` rifiuta importo assente, `"0"`, negativo o con più di due decimali con un messaggio in `errori.importo`; accetta un importo valido con virgola o punto.
      - [ ] `validaVoceRimborso` rifiuta etichetta vuota o solo spazi con un messaggio in `errori.etichetta`.
      - [ ] `src/domain/anagrafiche/valida-scaglione.ts` non esiste più.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Test unitari per validaVoceRimborso
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      La suite unitaria copre tutti i rami di `validaVoceRimborso` definiti in TASK-02, sostituendo la copertura di `validaScaglione`.

      ## Read
      - tests/unit/valida-scaglione.test.ts — struttura di riferimento per lo stile dei casi di test (input/output, `describe` per campo)
