  - id: TASK-13
    title: Sostituire il campo km con una tendina di voci nel form riga attività
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
      - TASK-10
    body: |-
      ## Objective
      Nel dettaglio giornata il collaboratore seleziona la voce di rimborso da una tendina invece di digitare i chilometri (AC-3); il form in modalità modifica distingue esplicitamente "non modificare il rimborso attuale" da una nuova selezione o dalla rimozione esplicita, così un salvataggio che non tocca la tendina non rifotografa nulla (AC-4).

      ## Read
      - src/app/(front-office)/attivita/[data]/page.tsx — intero file, in particolare `ScaglioneRimborsoSerializzato` (righe 42-45), `RigaAttivitaClient` (righe 16-33), la chiamata a `scaglioniRimborsoTrasferta()` (riga 92) e la mappatura `rimborso`/`trasfertaKm` (righe 102-126)
      - src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx — intero file, in particolare lo stato `trasfertaKmRaw`/`erroreKm` (righe 156-157), `previewRimborso` (righe 229-234), `handleCambioKm` (righe 278-300), il campo `trasfertaKm` nel submit (riga 335), `handleModifica` (righe 383-439, in particolare riga 394 `setTrasfertaKmRaw`), `handleAnnulla` (righe 443-457), il blocco JSX "Trasferta km" (righe 924-984), la visualizzazione della trasferta sulla riga salvata (righe 711-743) e il pulsante "Rimuovi trasferta" (righe 764-783)

      ## Change
      - page.tsx: rinomina il tipo `ScaglioneRimborsoSerializzato` in `VoceRimborsoTrasfertaSelezionabile` (`{ id: string; etichetta: string; importo: string }`); sostituisci la chiamata `scaglioniRimborsoTrasferta()` con `vociRimborsoTrasfertaPerSelezione()`; in `RigaAttivitaClient` sostituisci `trasfertaKm: number | null` e `rimborso: RisultatoCalcoloRimborso | null` con `rimborsoTrasfertaEtichetta: string | null` e `rimborsoTrasfertaImporto: string | null`; rimuovi l'import di `calcolaRimborsoTrasferta`/`RisultatoCalcoloRimborso` (non più necessari: il valore è già fotografato sulla riga, non va ricalcolato); nella mappatura di `righeClient` copia direttamente `r.rimborsoTrasfertaEtichetta`/`r.rimborsoTrasfertaImporto?.toString() ?? null`; passa la prop `vociRimborso` (rinominata da `scaglioni`) al componente.
      - dettaglio-giornata.tsx: sostituisci lo stato `trasfertaKmRaw`/`erroreKm` con `selezioneRimborso: string` (valori possibili: `"invariato"`, `""` per nessun rimborso, oppure l'id di una voce), inizializzato a `""` per una nuova riga; sostituisci `previewRimborso` con una `useMemo` che, se `selezioneRimborso` è un id di voce, cerca la voce nella prop `vociRimborso` e ne mostra etichetta/importo (nessuna chiamata a funzioni di dominio: è una semplice ricerca in un array); sostituisci il blocco JSX "Trasferta km" con un `<select>` che, in modalità creazione, ha come prima opzione "Nessun rimborso" (`value=""`) seguita da un'opzione per voce (`value={voce.id}`, testo `voce.etichetta`), e in modalità modifica ha in più, come prima opzione selezionata di default, "Non modificare il rimborso attuale" (`value="invariato"`); mostra separatamente, solo in modifica e solo se la riga ha un rimborso fotografato, un testo informativo "Rimborso attuale: {etichetta} — €{importo}" non collegato al `<select>`; nel submit, appendi `voceRimborsoTrasfertaId` al FormData **solo se** `selezioneRimborso !== "invariato"` (se `"invariato"`, non appendere affatto il campo — coerente con `modificaRiga` di TASK-10); `handleModifica` imposta `selezioneRimborso` a `"invariato"`; `handleSubmit` (ramo creazione) e `handleAnnulla` lo azzerano a `""`; nella visualizzazione della riga salvata sostituisci il blocco che leggeva `riga.trasfertaKm`/`riga.rimborso` con la lettura diretta di `riga.rimborsoTrasfertaEtichetta`/`riga.rimborsoTrasfertaImporto` (nessun ramo `OLTRE_SOGLIA`: con la fotografia una riga ha o non ha un rimborso, senza stati intermedi); rinomina il pulsante/handler "Rimuovi trasferta"/`handleRimuoviTrasferta` in "Rimuovi rimborso"/`handleRimuoviRimborso`, che chiama l'azione rinominata `rimuoviRimborsoTrasferta` di TASK-10; rimuovi l'import di `calcolaRimborsoTrasferta`/`validaKmTrasferta` da `@/domain/consuntivi` (non più usati in questo file).

      ## Steps
      1. Aggiorna `page.tsx` come da Change (tipi, fetch, mappatura, nome prop).
      2. Aggiorna `dettaglio-giornata.tsx`: sostituisci lo stato e la UI del campo trasferta con la tendina a tre stati descritta in Change.
      3. Aggiorna il submit del form per inviare (o omettere) `voceRimborsoTrasfertaId` secondo `selezioneRimborso`.
      4. Aggiorna la visualizzazione della riga salvata e il pulsante di rimozione come da Change.
      5. Rimuovi ogni import di funzioni di dominio relative al calcolo km→rimborso non più usate nel file.

      ## Verify
      - Run: `npx tsc --noEmit -p .` (da `/Users/smarello/repo/coaching-planner`) — Expect: nessun errore relativo a `src/app/(front-office)/attivita/[data]/**`.

      ## Done
      - [ ] AC-3 — il form mostra una tendina opzionale con le voci per etichetta al posto del campo chilometri; senza selezione (creazione, `selezioneRimborso === ""`) la riga salvata non ha rimborso.
      - [ ] AC-4 — in modifica, se l'utente non tocca la tendina (`selezioneRimborso === "invariato"`), il campo non viene inviato e la riga mantiene il rimborso già fotografato; se l'utente seleziona una voce diversa, la riga viene rifotografata dalla voce corrente.
      - [ ] La riga salvata mostra etichetta e importo fotografati letti direttamente dai campi della riga, senza alcun ricalcolo lato client.

      ## Blockers
      None.
