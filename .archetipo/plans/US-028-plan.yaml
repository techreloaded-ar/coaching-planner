  - id: TASK-04
    title: Test e2e del logo nelle intestazioni (aree, temi, schermi piccoli, origine)
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Objective
      Un e2e in sola lettura prova che il logo è presente e proporzionato in entrambe le intestazioni, leggibile in chiaro e scuro, compatto a 375 px e servito dall'app.

      ## Read
      - `tests/e2e/accesso-radice.spec.ts` — test "logo servito localmente" (pattern per `src` e risposta 200)
      - `tests/e2e/support/auth.ts` — `accediComeCollaboratore()` (Giulia Conti, seed), `accediAlBackOfficeComeAdmin()`
      - `tests/e2e/support/tema.ts` — `SFONDO_SCURO`, `attendiAspetto`
      - `tests/e2e/temi.spec.ts` — come impostare il cookie `tema` con `context.addCookies`
      - `tests/e2e/README.md` — regole anti-flakiness

      ## Change
      - `tests/e2e/logo-intestazione.spec.ts` — nuovo file. Usa `test, expect` da `@playwright/test` (test in sola lettura: nessuna scrittura di dati, gli utenti seed servono solo ad accedere).
      - Non-goal: nessuna modifica ad altri test.

      ## Steps
      1. Helper locali:
         - `logo(page)` = `page.getByRole("banner").getByRole("img", { name: "Agile Reloaded" })`;
         - `targa(page)` = `page.getByRole("banner").getByTestId("logo-agile-reloaded")`;
         - `misuraIntestazione(page)` = `evaluate` che restituisce `{ overflow: header.scrollWidth - header.clientWidth, altezza: Math.round(header.getBoundingClientRect().height) }` dell'elemento `header`;
         - `immagineCaricata(page)` = `logo.evaluate((img: HTMLImageElement) => img.complete && img.naturalWidth > 0)`.
      2. Test "front office" (AC-1), viewport 1280×800: `accediComeCollaboratore(page)`; `logo` visibile; altezza della bounding box tra 23 e 25; `immagineCaricata` vero; visibili `getByRole("heading", { name: "Le mie attività" })`, `getByRole("button", { name: "Tema", exact: true })` ed "Esci"; `misuraIntestazione` → `overflow === 0` e `altezza <= 84`. Ripetere le misure a 768×800 (`page.setViewportSize`): `overflow === 0`, `altezza <= 84`.
      3. Test "back office" (AC-2), viewport 1280×800: `accediAlBackOfficeComeAdmin(page)`; `logo` visibile, altezza 23-25, `overflow === 0`, `altezza <= 58`; salvare `src` del logo; click su `getByRole("link", { name: "Offerte", exact: true })`, `waitForURL("**/offerte")`, logo ancora visibile con lo stesso `src`. A 768×800: `overflow === 0`, `altezza <= 58`.
      4. Test "tema scuro e chiaro" (AC-3): per `["scuro", "chiaro"]` impostare il cookie `tema` con `context.addCookies([{ name: "tema", value, url: baseURL! }])` prima di accedere come collaboratore; verificare `html[data-tema]` uguale al valore; `targa` con `toHaveCSS("background-color", "rgb(255, 255, 255)")`; logo visibile e caricato. Con "scuro" verificare anche che il `body` abbia lo sfondo `SFONDO_SCURO`, per provare che il contesto è davvero scuro.
      5. Test "schermi piccoli" (AC-3), viewport 375×800: front office e back office (due contesti/page o due accessi in sequenza): logo visibile, larghezza della bounding box ≤ 32, `immagineCaricata` vero, e la bounding box del logo non interseca quella del pulsante "Esci" (calcolo su `boundingBox()`). Back office: `misuraIntestazione().overflow === 0`. Front office: nessuna asserzione sull'overflow, con un commento che rimanda al limite preesistente documentato nel piano (110 px già prima della spec).
      6. Test "servito dall'app" (AC-4): registrare `page.on("request")` prima dell'accesso come collaboratore e raccogliere gli URL con `resourceType() === "image"`; dopo il caricamento: `src` del logo non contiene `http` né `agilereloaded`; `page.request.get(new URL(src, page.url()).href)` → 200; ogni URL immagine raccolto ha lo stesso `host` di `page.url()`.
      7. Nessun `waitForTimeout`, nessun selettore di classi Tailwind (solo ruoli, alt e `data-testid`).

      ## Verify
      - Run (variabili `ARCHETIPO_*` della Baseline): `sh scripts/archetipo/ambiente.sh e2e tests/e2e/logo-intestazione.spec.ts --retries=0`
      - Expect: tutti i test passati.
      - Run: `sh scripts/archetipo/ambiente.sh e2e tests/e2e/logo-intestazione.spec.ts --repeat-each=3`
      - Expect: tutti passati.
      - Run: `npm run lint`
      - Expect: exit 0, nessun nuovo warning.

      ## Done
      - [ ] AC-1 — oracolo: logo 24 px nel banner del front office, elementi esistenti visibili, intestazione senza overflow e non più alta della baseline a 1280 e 768 px
      - [ ] AC-2 — oracolo: stesso logo (stesso `src` e stessa altezza) nel banner del back office, persistente dopo la navigazione
      - [ ] AC-3 — oracolo: targa bianca in tema scuro e chiaro; a 375 px logo compatto ≤ 32 px, caricato e non sovrapposto a "Esci"
      - [ ] AC-4 — oracolo: `src` locale con risposta 200 e nessuna richiesta immagine verso host esterni

      ## Blockers
      None.
    ref: TASK-04
