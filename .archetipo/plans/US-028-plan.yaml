      ## Change
      - Nessuna modifica al codice. Se un controllo fallisce, correggere nel task che ha introdotto il problema e rieseguire questo gate.

      ## Steps
      1. `npx tsc --noEmit`
      2. `npm run lint`
      3. `npm test`
      4. `sh scripts/archetipo/ambiente.sh build` (variabili `ARCHETIPO_*` della Baseline)
      5. `sh scripts/archetipo/ambiente.sh e2e tests/e2e/logo-intestazione.spec.ts tests/e2e/accesso-radice.spec.ts tests/e2e/temi.spec.ts`
