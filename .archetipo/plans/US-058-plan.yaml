      ## Change
      - `src/app/(front-office)/attivita/calendario-mensile.tsx`.

      Non-goal: non toccare `vaiA`, `commit`, `IntentoNavigazione`, la semina della cache, il prefetch dei mesi adiacenti, la rivalidazione su focus/visibilità, il gestore `popstate`, il blocco d'errore con «Riprova», la griglia, la legenda o il link «Riepilogo mese». Nessuna modifica ai file di cache o al provider.

      ## Steps
