      2. Rimuovere lo stato `valoreSelettoreMese`, `tokenSelettoreSincronizzato` e la costante `idSelettoreMese`, insieme al blocco `if (tokenSelettoreSincronizzato !== tokenVisualizzato) { … }` che li risincronizzava durante il render: la risincronizzazione non serve più, perché il pannello legge `tokenVisualizzato` a ogni apertura.
