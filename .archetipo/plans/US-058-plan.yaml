      4. Rimuovere il memo `etichetta`: l'etichetta lunga è ora calcolata dentro il selettore.
      5. Sostituire il div `data-testid="calendar-month-label"` con:
         ```tsx
         <SelettoreMese
           tokenVisualizzato={tokenVisualizzato}
           onScegliMese={(token) => vaiA({ token, registraHistory: true })}
         />
         ```
         posizionato fra la freccia «Mese precedente» e la freccia «Mese successivo», invariate.
      6. Ripulire gli import rimasti inutilizzati: `useId` da `react` e il type import `FormEvent`. Verificare che `useMemo` resti usato (griglia, totali), che `etichettaMese` resti importato perché usato nel messaggio d'errore di `vaiA`, e che `parseTokenMese` resti importato perché usato dal gestore `popstate`.

