schema: archetipo/plan/v2
spec_code: US-058
body: "# US-058: Selettore di mese compatto sull'etichetta con navigazione immediata — Piano di Implementazione\n\n**Generato da:** Team di Planning ARchetipo\n**Data:** 2026-08-06\n\n---\n\n## Spec\n\n**Epic:** EP-005 — Evoluzioni Post-MVP\n**Priorità:** HIGH | **Punti:** 2\n\n**Storia Utente**\nCome collaboratore, voglio aprire il selettore di mese direttamente dall'etichetta del mese corrente e vedere il calendario cambiare appena scelgo un mese, così da raggiungere un mese lontano con un solo gesto, senza controlli duplicati né conferme aggiuntive.\n\n**Criteri di Accettazione**\n- AC-1 — L'etichetta del mese nella barra del calendario è un controllo interattivo riconoscibile (indicatore visivo di apertura); attivandola si apre un selettore con anno navigabile e i dodici mesi, con il mese in griglia evidenziato.\n- AC-2 — La scelta di un mese nel selettore chiude il selettore e la griglia mostra subito il mese scelto, senza alcun passaggio di conferma aggiuntivo.\n- AC-3 — Il precedente controllo di salto separato (campo mese e pulsante «Vai») non è più presente nella barra di navigazione.\n- AC-4 — Il mese raggiunto dal selettore è rappresentato dal token `YYYY-MM` nell'URL, condivisibile e riapribile direttamente.\n- AC-5 — La chiusura del selettore senza scelta (clic fuori o `Esc`) lascia invariato il mese mostrato in griglia.\n- AC-6 — Il selettore è utilizzabile da tastiera: apertura dall'etichetta, spostamento fra anni e mesi, scelta e chiusura senza mouse.\n\n**Fuori Perimetro**\nNessuna modifica alla cache client dei mesi, al prefetch dei mesi adiacenti, ai controlli freccia, al pulsante «Mese corrente» o al feedback di attesa. Nessuna estensione della selezione rapida ad altre pagine né selezione del giorno.\n\n---\n\n## Soluzione Tecnica\n\nL'etichetta del mese smette di essere una didascalia e diventa il **solo** ingresso al salto diretto: un nuovo componente client `selettore-mese.tsx` incapsula trigger e pannello, mentre `calendario-mensile.tsx` perde il form `<input type=\"month\">` + «Vai» introdotto da US-055 e guadagna una sola callback. Il salto non è un nuovo percorso di navigazione: chiama lo stesso intento `vaiA({ token, registraHistory: true })` già usato da frecce, «Mese corrente» e Back/Forward, quindi cache, prefetch, indicatore di attesa e scrittura dell'URL dentro `commit` restano quelli esistenti, senza una riga di codice in più.\n\n- **Nuovo componente `src/app/(front-office)/attivita/selettore-mese.tsx`** (client). Props: `tokenVisualizzato: string` e `onScegliMese: (token: string) => void`. Il trigger è un `<button>` che conserva `data-testid=\"calendar-month-label\"` e il cui **testo è esattamente** `etichettaMese(tokenVisualizzato)` (il chevron è un `<svg>` senza testo): le asserzioni `toHaveText` già presenti in `calendario-cache-mesi.spec.ts` e `demo__calendario-mensile.spec.ts` restano valide senza modifiche. Espone `aria-haspopup=\"dialog\"` e `aria-expanded`.\n- **Pannello ancorato, non modale.** `role=\"dialog\"`, `aria-label=\"Scelta del mese\"`, `data-testid=\"selettore-mese-pannello\"`, posizionato in `absolute` sotto il trigger dentro un wrapper `relative`. Contiene la riga anno («Anno precedente» ← `data-testid=\"selettore-mese-anno\"` → «Anno successivo») e una griglia 3×4 di dodici celle mese. Ogni cella è un `<button>` con `data-testid=\"selettore-mese-cella\"`, `data-token={token}`, `aria-label={etichettaMese(token)}` (es. `marzo 2025`) e testo abbreviato (`gen`…`dic`); la cella il cui token coincide con `tokenVisualizzato` porta `aria-current=\"true\"`.\n- **Stato locale del pannello:** `aperto`, `annoMostrato`, `indiceMeseAttivo`. L'apertura riparte **sempre** da `tokenVisualizzato`, quindi il pannello non conserva un anno stantio fra due aperture; cambiare anno non cambia il mese in griglia finché non si sceglie una cella.\n- **Chiusura:** scelta di un mese, `Escape` (con ritorno del focus al trigger) e `mousedown` fuori dal wrapper. Nessun overlay a tutto schermo e nessun focus trap: il pannello è un popover, non una finestra modale come `selettore-duplicazione.tsx`.\n- **Tastiera (AC-6):** il trigger è raggiungibile con Tab e si apre con Invio/Spazio (comportamento nativo del `<button>`); all'apertura il focus va sulla cella del mese in griglia; le frecce Sinistra/Destra spostano il focus di un mese e, superando il bordo di gennaio o dicembre, **cambiano anno** portando il focus su dicembre dell'anno precedente o gennaio del successivo; Su/Giù spostano di tre celle restando dentro l'anno; Invio/Spazio scelgono; `Escape` chiude. I due pulsanti anno restano nell'ordine di tabulazione naturale.\n- **Funzione pura di dominio.** `src/domain/calendario/index.ts` guadagna `NOMI_MESI_ABBREVIATI` e `etichettaMeseBreve(mese)`. Sono dodici etichette dichiarate esplicitamente e non derivate da `Intl`: la griglia ha bisogno di stringhe corte, stabili e verificabili in un unit test che non dipenda dalla versione di ICU del runtime. `etichettaMese` (Intl) resta la fonte dell'etichetta lunga di trigger e `aria-label`.\n- **`calendario-mensile.tsx`** rimuove `idSelettoreMese`, `valoreSelettoreMese`, `tokenSelettoreSincronizzato`, il blocco di risincronizzazione durante il render, `submitSaltoMese`, il `<form>` con `<input type=\"month\">` e «Vai», e gli import `useId`/`FormEvent` rimasti inutilizzati. Il memo `etichetta` sparisce perché l'etichetta viene calcolata dentro il selettore; `parseTokenMese` resta usato dal gestore `popstate`, `etichettaMese` dal messaggio d'errore.\n\n### Decisioni Architetturali\n\nNessuna scelta di questa spec supera la soglia ADR. L'alternativa considerata — continuare a delegare al popup nativo di `<input type=\"month\">` spostandone il trigger sull'etichetta — è stata scartata perché l'apertura programmatica del picker nativo non è governabile in modo uniforme fra browser e non consente né l'evidenziazione del mese in griglia né il contratto da tastiera di AC-6; la terza opzione (una libreria di date-picker) introdurrebbe una dipendenza per un pannello di dodici pulsanti. È una scelta di presentazione locale a una barra di navigazione, reversibile, che non tocca modello dati persistente, modello di sicurezza, confini di integrazione, topologia di deploy né semantica di consistenza: resta quindi nel piano e non genera una pagina `decisions/`.\n\n---\n\n## Baseline\n\nComandi eseguiti in fase di planning da `/Users/smarello/repo/coaching-planner`, prima di qualunque modifica.\n\n| Controllo | Esito prima dell'implementazione | Conseguenza sul piano |\n|---|---|---|\n| `npm run lint` | Passa. Un solo **warning pre-esistente**: `tests/e2e/demo__duplicazione-riga-su-piu-giorni.spec.ts:41 'MESE_ALTRO' is assigned a value but never used`. Il guardrail e2e stampa nove avvisi `chiave riservata non risolvibile staticamente` (helper generici in `support/date.ts` e `support/report-data.ts`) e termina con `✅ Guardrail e2e anti-flakiness passed`. | I task non devono azzerare quel warning (file fuori perimetro) ma **non devono aggiungerne altri**: nessun import o stato residuo dopo la rimozione del vecchio form. Il guardrail deve continuare a passare: le nuove chiavi di mese riservato sono già state verificate libere da collisioni (vedi TASK-06 e TASK-07). |\n| `npx tsc --noEmit -p tsconfig.json` | Passa, exit 0, nessuna diagnostica. | Ogni task che tocca `.ts`/`.tsx` deve lasciare il type-check a zero errori. |\n| `npm test` (vitest) | Passa: 40 file, 681 test. | Il nuovo unit test si aggiunge senza rompere i 681 esistenti. |\n| `npx vitest run tests/unit/calendario.test.ts` | Passa: 39 test. | Il file esistente è il posto dove aggiungere i casi della funzione pura. |\n| `npx playwright test tests/e2e/calendario-salto-mese.spec.ts --reporter=line` | Passa: 2 test in 5.0 s (scenari US-055 sul vecchio campo mese + «Vai»). | Questi due scenari asseriscono il controllo che AC-3 rimuove: il file viene **riscritto**, non semplicemente esteso. Dopo la riscrittura lo stesso comando deve tornare verde sui nuovi scenari. |\n\n**Prerequisiti d'ambiente (non sono fallimenti di codice).** Gli e2e richiedono `E2E_DATABASE_URL` valorizzato (`playwright.config.ts` lancia un'eccezione se manca) e un PostgreSQL raggiungibile: in locale è il servizio di `docker-compose.yml` (container `coaching-planner-db`, porta 5432, verificato `healthy` durante il planning). `globalSetup` esegue migrazioni e seed e `webServer` avvia `npm run dev` con `reuseExistingServer: false`, quindi non serve alcun server già in ascolto. `prisma generate` è coperto dagli script `dev`/`build`/`postinstall`. Il client Prisma deve essere generato prima di `npm test` in un checkout fresco (`npm run db:generate`).\n\n---\n\n## Mappa delle Evidenze di Accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |\n|---|---|---|---|---|\n| AC-1 | Collaboratore, cliente, offerta e riga da factory in `meseRiservato(\"US-058\")`; `/attivita` sul mese corrente con `data-idratata=\"true\"` | e2e browser | `calendar-month-label` ha `aria-expanded=\"false\"`; dopo il clic ha `aria-expanded=\"true\"`, `selettore-mese-pannello` è visibile, `selettore-mese-anno` mostra l'anno del mese in griglia e la cella con `data-token` pari al mese in griglia ha `aria-current=\"true\"` | TASK-06 |\n| AC-2 | Pannello aperto, anno portato su quello del mese riservato | e2e browser | Il clic sulla cella chiude il pannello (`toBeHidden()`) e la cella giorno `a[href=\"/attivita/{data}?mese={meseArrivo}\"]` espone `data-con-attivita=\"true\"` con l'etichetta cliente attesa; nessun pulsante di conferma è presente nel pannello | TASK-06 |\n| AC-3 | Barra di navigazione del calendario | e2e browser | `page.getByLabel(\"Vai a un mese specifico\")` ha `toHaveCount(0)` **e** `page.getByRole(\"button\", { name: \"Vai al mese selezionato\" })` ha `toHaveCount(0)` | TASK-06 |\n| AC-4 | Subito dopo la scelta del mese | e2e browser | L'URL contiene `mese={meseArrivo}`; dopo `page.reload()` l'URL è invariato e la cella giorno è ancora valorizzata (mese servito dal server) | TASK-06 |\n| AC-5 | Pannello aperto e anno spostato di uno | e2e browser | Dopo `Escape`: pannello nascosto, `calendar-month-label` ancora sull'etichetta del mese di partenza, URL invariato. Stesso oracolo ripetuto chiudendo con un clic fuori dal pannello su un elemento non navigante della legenda | TASK-06 |\n| AC-6 | Nessun uso del mouse dopo il `focus()` iniziale sul trigger | e2e browser | `Enter` apre il pannello e la cella del mese in griglia è `toBeFocused()`; N pressioni di `ArrowLeft` (N = numero del mese corrente) portano `selettore-mese-anno` all'anno precedente con la cella `dicembre {anno-1}` `toBeFocused()`; `Enter` sceglie e l'URL porta `mese={anno-1}-12` con `calendar-month-label` aggiornata; riaperto con `Enter`, `Escape` chiude e il trigger è `toBeFocused()` | TASK-06 |\n| AC-1..AC-6 (script di dimostrazione) | Come sopra, su mese riservato dedicato alla demo | e2e browser con video | Percorso completo della sezione «Dimostrazione» in un solo test filmabile | TASK-07 |\n| Funzione pura di supporto | Nessuna | unit (vitest, ambiente node) | `etichettaMeseBreve(1..12)` restituisce le dodici abbreviazioni attese, tutte distinte, e stringa vuota fuori intervallo; `NOMI_MESI_ABBREVIATI` ha lunghezza 12 | TASK-02 |\n| Nessuna regressione sul salto usato da altre suite | Riga sorgente e mesi riservati di US-057 | e2e browser | `tests/e2e/duplica-riga-su-giorni.spec.ts` continua a raggiungere il mese di destinazione e a osservare la cella accesa, ora passando dal selettore | TASK-05 |\n\nOgni criterio ha un oracolo osservabile nel browser reale: nessun test double nasconde il componente responsabile, perché non ci sono mock nel percorso e2e.\n\n---\n\n## Strategia di Test\n\nL'evidenza principale è nel browser. Il percorso di accettazione attraversa il confine di rotta e l'URL condivisibile (`?mese=YYYY-MM`), la persistenza (le celle valorizzate arrivano dal database), l'idratazione dell'isola client e il comportamento da tastiera: sono tutti fatti che nessun livello più basso può provare.\n\n- **Browser e2e obbligatorio.** AC-2, AC-4 e AC-6 dipendono da URL, `history` e focus reali; AC-1, AC-3 e AC-5 dipendono dal DOM effettivamente montato dopo l'idratazione. Il framework è già in repo (`@playwright/test` con `playwright.config.ts`, `fullyParallel: true`, un progetto `chromium`): non serve alcun task di bootstrap né `archetipo e2e ensure`.\n- **Nessun test di componente.** Il setup vitest è `environment: \"node\"` con `include: [\"tests/unit/**/*.test.ts\"]` e non esiste alcuna infrastruttura DOM (nessun jsdom, nessuna testing-library, nessun file `.tsx` di test). Introdurne una per questa spec sarebbe un bootstrap di framework fuori perimetro; il livello unit copre quindi solo la funzione pura di dominio, dove è realmente il posto giusto.\n- **Determinismo secondo il contratto e2e del progetto.** Mesi riservati dagli helper di `tests/e2e/support/date.ts`, entità create dalle factory di `tests/e2e/support/fixtures.ts`, nessuna mutazione di entità seed, nessun hard wait (l'unica `waitForTimeout` ammessa è la pausa finale del video demo con il commento richiesto dal guardrail), nessun selettore su classi Tailwind, attesa esplicita di `data-idratata=\"true\"` prima di interagire con l'isola.\n- **Disambiguazione dei locator.** Il trigger e la cella del mese in griglia hanno lo **stesso nome accessibile** (es. `agosto 2026`). Ogni locator di cella deve essere quindi ancorato dentro il pannello (`page.getByTestId(\"selettore-mese-pannello\").getByRole(\"button\", { name, exact: true })`), mai su `page` direttamente.\n- **Chiavi di mese riservato già verificate.** `US-058` (offset −87, e −129 con `mesePassatoRiservato(\"US-058\", 42)`) e `US-058-DEMO-SELETTORE-MESE` (offset −128) non collidono con nessuna delle 39 chiavi oggi in uso né fra loro: la verifica è stata eseguita in fase di planning riproducendo la logica di `scripts/check-e2e-guardrails.ts` sull'intera cartella `tests/e2e`, considerando i file riscritti come rimossi. Le voci di `COLLISIONI_PREESISTENTI_ALLOWLIST` relative alle chiavi `US-055` che spariscono restano inerti e non vanno toccate.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright (`@playwright/test`)\n**Video di dimostrazione:** atteso — la spec è filmabile (registrato più avanti da `archetipo-review`, non durante l'implementazione)\n\n| Scenario | Flusso utente |\n|---|---|\n| Selettore compatto e salto immediato | Dal calendario sul mese corrente il collaboratore verifica che il vecchio campo mese con «Vai» non esiste più, apre il selettore dall'etichetta, osserva anno e mese in griglia evidenziato, sposta l'anno indietro fino all'anno del mese riservato, clicca il mese e vede pannello chiuso, cella del giorno valorizzata e token nell'URL, che sopravvive al reload |\n| Chiusura senza scelta | Il collaboratore apre il selettore, sposta l'anno e preme `Esc`: il mese in griglia e l'URL non cambiano; ripete chiudendo con un clic fuori dal pannello |\n| Uso da tastiera | Il collaboratore raggiunge l'etichetta, apre con `Invio`, si sposta con le frecce oltre il bordo di gennaio arrivando a dicembre dell'anno precedente, sceglie con `Invio`, riapre e chiude con `Esc` riprendendo il focus sul trigger |\n| Feedback di attesa invariato | Con la lettura del mese di arrivo trattenuta da una `page.route` sbloccata da una promessa, il salto verso un mese lontano mostra lo stesso `indicatore-caricamento-mese` e `aria-busy=\"true\"` già esistenti, che spariscono a dati pronti |\n| Dimostrazione (video) | Lo script completo della sezione «Dimostrazione» della spec, in un unico test con `video: \"on\"` e `slowMo` |\n\n---\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [domains/attivita, decisions/cache-client-calendario-collaboratore, decisions/feedback-attesa-uniforme, decisions/calcoli-puri, engineering/code-map]\n  update: [domains/attivita]\n  create: []\n```\n\n`archetipo wiki affected` sui percorsi attesi restituisce cinque candidati; la decisione pagina per pagina è la seguente.\n\n- **`domains/attivita` → `update`.** È l'unica pagina la cui conoscenza cambia davvero: il punto 8 dei flussi descrive testualmente «un campo mese («Vai a un mese specifico») con il pulsante di conferma «Vai»», che AC-3 elimina, e la sezione di verifica descrive gli scenari di `tests/e2e/calendario-salto-mese.spec.ts` che vengono riscritti. Vanno inoltre aggiunti il nuovo `selettore-mese.tsx` fra le sorgenti `inbound-ui` e il nuovo simbolo di `src/domain/calendario/index.ts`.\n- **`decisions/cache-client-calendario-collaboratore` → solo candidato.** Traccia `calendario-mensile.tsx`, quindi risulterà `evidence-changed`, ma le sue affermazioni restano vere: TTL, LRU, prefetch dei mesi adiacenti, commit sincrono, History API e contratto URL sono esplicitamente fuori perimetro e non cambiano. Riconciliazione esplicita in accettazione, senza task di documentazione.\n- **`decisions/calcoli-puri` → solo candidato.** Traccia `src/domain/calendario/index.ts`: aggiungere un'altra funzione pura è esattamente ciò che la decisione già afferma, quindi la conoscenza non cambia.\n- **`decisions/fotografia-rimborso-trasferta` → solo candidato.** Compare per co-citazione di `tests/e2e/duplica-riga-su-giorni.spec.ts`, di cui cambia un solo helper di navigazione; nessuna affermazione sulla fotografia del rimborso è toccata.\n- **`engineering/code-map` → solo candidato.** La riga «Attività» mappa il glob `src/app/(front-office)/attivita/**`: un nuovo file dentro quel glob non altera la matrice capability→codice→dati→test.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-058/`\n\n_Piano generato con ARchetipo Planning — 2026-08-06_"
tasks:
  - id: TASK-01
    title: Etichette abbreviate dei dodici mesi come funzione pura di dominio
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `src/domain/calendario/index.ts` espone le dodici etichette abbreviate dei mesi in italiano, stabili e indipendenti dalla versione di ICU, pronte per le celle del selettore.

      ## Read
      - `src/domain/calendario/index.ts` — sezione «Costanti» con `formattatoreMese`, e le funzioni `parseTokenMese`, `formattaTokenMese`, `etichettaMese`: stile dei commenti, convenzioni di export e di validazione del token.

      ## Change
      - `src/domain/calendario/index.ts`: aggiungere la costante esportata `NOMI_MESI_ABBREVIATI` e la funzione esportata `etichettaMeseBreve`.

      Non-goal: non modificare `etichettaMese`, `formattaTokenMese`, `parseTokenMese` né alcuna funzione esistente; non introdurre dipendenze; non toccare altri file.

      ## Steps
      1. Nella sezione «Costanti», subito dopo `formattatoreMese`, dichiarare:
         `export const NOMI_MESI_ABBREVIATI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"] as const;`
      2. Documentare con un commento perché le etichette sono dichiarate e non derivate da `Intl`: la griglia del selettore ha bisogno di stringhe corte stabili fra runtime e versioni di ICU, mentre `etichettaMese` resta la fonte dell'etichetta lunga.
      3. Aggiungere sotto la costante:
         ```ts
         /**
          * Etichetta abbreviata del mese (1 = gennaio … 12 = dicembre).
          * Restituisce stringa vuota per un mese fuori intervallo.
          */
         export function etichettaMeseBreve(mese: number): string {
           if (!Number.isInteger(mese) || mese < 1 || mese > 12) return "";
           return NOMI_MESI_ABBREVIATI[mese - 1];
         }
         ```

      ## Verify
      - Run: `npx tsc --noEmit -p tsconfig.json`
      - Expect: exit 0, nessuna diagnostica (baseline: già a zero).
      - Run: `npx vitest run tests/unit/calendario.test.ts`
      - Expect: 39 test passati, come da baseline (nessun test nuovo ancora).

      ## Done
      - [ ] `NOMI_MESI_ABBREVIATI` ed `etichettaMeseBreve` sono esportate da `src/domain/calendario/index.ts` e tipizzate senza errori.
      - [ ] Nessuna funzione preesistente del modulo è stata modificata.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Unit test delle etichette abbreviate dei mesi
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `tests/unit/calendario.test.ts` prova che le etichette abbreviate sono dodici, distinte, nell'ordine dei mesi civili, e che un mese fuori intervallo non produce un'etichetta.

      ## Read
      - `tests/unit/calendario.test.ts` — stile dei `describe`/`it`, import da `@/domain/calendario`, convenzioni di asserzione.
      - `src/domain/calendario/index.ts` — firma di `etichettaMeseBreve` e valori di `NOMI_MESI_ABBREVIATI` prodotti da TASK-01.

      ## Change
      - `tests/unit/calendario.test.ts`: aggiungere un blocco `describe("etichettaMeseBreve", ...)` in coda ai blocchi esistenti.

      Non-goal: non modificare i 39 test esistenti; non introdurre ambiente DOM né nuove dipendenze di test.

      ## Steps
      1. Importare `etichettaMeseBreve` e `NOMI_MESI_ABBREVIATI` da `@/domain/calendario`.
      2. Asserire che `NOMI_MESI_ABBREVIATI` ha lunghezza 12 e che tutte le etichette sono distinte (`new Set(NOMI_MESI_ABBREVIATI).size === 12`).
      3. Asserire l'ordine civile con i valori attesi espliciti: `etichettaMeseBreve(1) === "gen"`, `etichettaMeseBreve(8) === "ago"`, `etichettaMeseBreve(12) === "dic"`.
      4. Asserire la coerenza con l'etichetta lunga: per ogni mese `m` da 1 a 12, `etichettaMese(\`2026-${String(m).padStart(2, "0")}\`)` inizia con `etichettaMeseBreve(m)` (le abbreviazioni italiane sono prefissi dei nomi estesi). Questo lega la costante dichiarata alla formattazione `Intl` senza dipendere dai suoi valori esatti.
      5. Asserire i casi fuori intervallo: `etichettaMeseBreve(0)`, `etichettaMeseBreve(13)` e `etichettaMeseBreve(1.5)` restituiscono `""`.

      ## Verify
      - Run: `npx vitest run tests/unit/calendario.test.ts`
      - Expect: tutti i test passano, con un numero di test superiore ai 39 di baseline.
      - Run: `npm test`
      - Expect: 40 file passati, nessun fallimento (baseline: 681 test verdi, ora superiori).

      ## Done
      - [ ] Il blocco `etichettaMeseBreve` asserisce ordine, distinzione, coerenza con `etichettaMese` e casi fuori intervallo, non la sola esistenza della funzione.
      - [ ] La suite unit completa resta verde.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Componente client SelettoreMese — trigger sull'etichetta e pannello anno/mesi
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esiste un componente client riutilizzabile che rende l'etichetta del mese un controllo interattivo e apre un pannello con anno navigabile e dodici mesi, con evidenziazione del mese in griglia, chiusura senza scelta e uso completo da tastiera.

      ## Read
      - `docs/mockups/US-058/` — `index.html` (barra con selettore chiuso), `selettore-aperto.html`, `selettore-altro-anno.html`, `focus-tastiera.html`, `README.md` e `shared.css`: sono il riferimento visivo vincolante per chevron, pannello ancorato, evidenziazione e anello di focus.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` righe 370-500 — classi Tailwind effettive della barra (`rounded-[10px]`, `border-zinc-200`, `bg-white`, `shadow-sm`, varianti `dark:`), e il div `data-testid="calendar-month-label"` con `min-w-[188px] text-center text-[19px] font-bold capitalize` che il trigger deve sostituire senza far saltare la barra.
      - `src/app/(front-office)/attivita/[data]/selettore-duplicazione.tsx` righe 120-140 — pattern già usato nel progetto per la chiusura con `Escape` tramite listener registrato in `useEffect` senza `setState` nell'effetto.
      - `src/domain/calendario/index.ts` — `etichettaMese`, `parseTokenMese`, `formattaTokenMese`, `NOMI_MESI_ABBREVIATI`.

      ## Change
      - Nuovo file `src/app/(front-office)/attivita/selettore-mese.tsx`.

      Non-goal: non toccare `calendario-mensile.tsx` (è TASK-04); nessuna chiamata di rete, nessun accesso alla cache, nessun `router`; nessun overlay a tutto schermo e nessun focus trap — è un popover, non una modale.

      ## Steps
      1. Creare il file con la direttiva `"use client"` e l'interfaccia:
         ```ts
         interface SelettoreMeseProps {
           /** Token YYYY-MM del mese effettivamente in griglia. */
           tokenVisualizzato: string;
           /** Notifica la scelta di un mese; la navigazione è del chiamante. */
           onScegliMese: (token: string) => void;
         }
         ```
         Esportare `export function SelettoreMese({ tokenVisualizzato, onScegliMese }: SelettoreMeseProps)`.
      2. Stato locale: `aperto` (boolean), `annoMostrato` (number), `indiceMeseAttivo` (number 0-11). Riferimenti: `riferimentoContenitore` (div wrapper), `riferimentoTrigger` (button), `riferimentiCelleMese` (array di 12 `HTMLButtonElement | null`).
      3. `function apri()`: leggere `parseTokenMese(tokenVisualizzato)`; con token valido impostare `annoMostrato` all'anno e `indiceMeseAttivo` a `mese - 1`, altrimenti lasciare l'anno corrente e indice 0; poi `aperto = true`. Il pannello riparte **sempre** dal mese in griglia, così due aperture consecutive non conservano un anno stantio.
      4. `function chiudi(riportaFocus: boolean)`: `aperto = false` e, se richiesto, `riferimentoTrigger.current?.focus()`.
      5. Wrapper: `<div className="relative" ref={riferimentoContenitore}>`.
      6. Trigger: `<button type="button" ref={riferimentoTrigger} data-testid="calendar-month-label" aria-haspopup="dialog" aria-expanded={aperto} onClick={() => (aperto ? chiudi(false) : apri())}>`. Il contenuto testuale deve essere **esattamente** `etichettaMese(tokenVisualizzato)` seguito dal solo `<svg>` del chevron (nessun altro testo, nessuno spazio significativo aggiuntivo), perché altre suite asseriscono `toHaveText` su questo test id. Conservare `min-w-[188px] text-center text-[19px] font-bold capitalize -tracking-[0.02em]` e i colori zinc del div originale, aggiungendo `cursor-pointer`, hover e anello di focus come nei mockup; il chevron ruota quando `aperto`.
      7. Pannello, renderizzato solo quando `aperto`: `<div role="dialog" aria-label="Scelta del mese" data-testid="selettore-mese-pannello" className="absolute left-1/2 top-full z-30 mt-2 -translate-x-1/2 …">` con bordo, sfondo, ombra e varianti dark dei mockup.
      8. Riga anno dentro il pannello, in quest'ordine nel DOM: `<button type="button" aria-label="Anno precedente" onClick={() => setAnnoMostrato(a => a - 1)}>`, `<span data-testid="selettore-mese-anno">{annoMostrato}</span>`, `<button type="button" aria-label="Anno successivo" onClick={() => setAnnoMostrato(a => a + 1)}>`. Cambiare anno **non** cambia il mese in griglia.
      9. Griglia `grid grid-cols-3` con dodici celle. Per l'indice `i` (0-11): `const token = formattaTokenMese(annoMostrato, i + 1);` e
         ```tsx
         <button
           type="button"
           ref={(elemento) => { riferimentiCelleMese.current[i] = elemento; }}
           data-testid="selettore-mese-cella"
           data-token={token}
           aria-label={etichettaMese(token)}
           aria-current={token === tokenVisualizzato ? "true" : undefined}
           onClick={() => scegliMese(i)}
         >
           {NOMI_MESI_ABBREVIATI[i]}
         </button>
         ```
         La cella con `aria-current="true"` è resa in pieno rosa come nei mockup; le altre restano neutre.
      10. `function scegliMese(indice: number)`: calcolare il token con `formattaTokenMese(annoMostrato, indice + 1)`, chiamare `chiudi(false)` e poi `onScegliMese(token)`. Nessun passaggio di conferma (AC-2).
      11. Navigazione da tastiera: `onKeyDown` sul contenitore della griglia. `ArrowRight`: se `indiceMeseAttivo < 11` incrementa l'indice, altrimenti `annoMostrato + 1` e indice `0`. `ArrowLeft`: se `indiceMeseAttivo > 0` decrementa, altrimenti `annoMostrato - 1` e indice `11`. `ArrowDown`: `indice + 3` se `<= 11`. `ArrowUp`: `indice - 3` se `>= 0`. Su questi quattro tasti chiamare `evento.preventDefault()`; ogni altro tasto passa (Invio e Spazio sono gestiti nativamente dal `<button>`).
      12. Effetto di focus: quando `aperto`, focalizzare `riferimentiCelleMese.current[indiceMeseAttivo]`, con dipendenze `[aperto, indiceMeseAttivo, annoMostrato]`. È così che all'apertura il focus va sul mese in griglia e che le frecce lo spostano davvero.
      13. Effetto `keydown` su `document`, attivo solo quando `aperto`: su `Escape` chiamare `chiudi(true)`. Registrare e rimuovere il listener come in `selettore-duplicazione.tsx`.
      14. Effetto `mousedown` su `document`, attivo solo quando `aperto`: se il bersaglio non è contenuto in `riferimentoContenitore.current`, chiamare `chiudi(false)`.

      ## Verify
      - Run: `npx tsc --noEmit -p tsconfig.json`
      - Expect: exit 0, nessuna diagnostica sul nuovo file.
      - Run: `npm run lint`
      - Expect: nessun errore e nessun warning nuovo; resta il solo warning pre-esistente su `tests/e2e/demo__duplicazione-riga-su-piu-giorni.spec.ts:41`.

      ## Done
      - [ ] AC-1 — il trigger espone `aria-expanded` e il pannello contiene riga anno (`selettore-mese-anno`) e dodici celle, con `aria-current="true"` sulla cella pari a `tokenVisualizzato`.
      - [ ] AC-2 — la scelta di una cella chiude il pannello e invoca `onScegliMese` con il token `YYYY-MM`, senza alcun pulsante di conferma nel pannello.
      - [ ] AC-5 — `Escape` e il `mousedown` fuori dal wrapper chiudono il pannello senza invocare `onScegliMese`.
      - [ ] AC-6 — all'apertura il focus è sulla cella del mese in griglia, le frecce orizzontali attraversano il confine d'anno e `Escape` riporta il focus al trigger.
      - [ ] Il testo del trigger è esattamente l'etichetta lunga del mese, senza testo aggiuntivo.

      ## Blockers
      None.
