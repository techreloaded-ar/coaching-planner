  - id: TASK-05
    title: Adeguare l'helper di salto mese di duplica-riga-su-giorni al nuovo selettore
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      La suite di US-057 continua a raggiungere il mese di destinazione dal calendario, passando dal selettore compatto invece che dal campo mese rimosso.

      ## Read
      - `tests/e2e/duplica-riga-su-giorni.spec.ts` righe 140-175 — `cellaDelGiorno` e l'helper `vaiAlMese`, che oggi usa `getByLabel("Vai a un mese specifico")` e il pulsante «Vai al mese selezionato».
      - `src/app/(front-office)/attivita/selettore-mese.tsx` — test id e nomi accessibili consegnati da TASK-03.
      - `tests/e2e/README.md` — contratto e2e del progetto (niente hard wait, niente classi Tailwind, locator per ruolo/label/test id).

      ## Change
      - `tests/e2e/duplica-riga-su-giorni.spec.ts`: solo l'helper `vaiAlMese` e, se serve, un piccolo helper locale per l'etichetta lunga del mese.

      Non-goal: non modificare gli scenari, le factory, i mesi riservati `US-057`, le asserzioni di duplicazione o il preambolo che scalda le cache. L'obiettivo è la sola aderenza al nuovo controllo.

      ## Steps
      1. Aggiungere un helper locale che produce l'etichetta lunga del mese dal token, con la stessa convenzione dell'app:
         ```ts
         function etichettaMeseLunga(mese: string): string {
           const [anno, numeroMese] = mese.split("-").map(Number);
           return new Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" })
             .format(new Date(anno, numeroMese - 1, 1));
         }
         ```
      2. Riscrivere `vaiAlMese` così:
         - `await page.getByTestId("calendar-month-label").click();`
         - `const pannello = page.getByTestId("selettore-mese-pannello");` e `await expect(pannello).toBeVisible();`
         - leggere **una sola volta** l'anno mostrato: `const annoMostrato = Number(await pannello.getByTestId("selettore-mese-anno").innerText());`
         - calcolare `const passi = Number(mese.slice(0, 4)) - annoMostrato;` e cliccare `Math.abs(passi)` volte il pulsante `passi < 0 ? "Anno precedente" : "Anno successivo"` (nessun ciclo di polling: il numero di clic è determinato prima di iniziare);
         - `await expect(pannello.getByTestId("selettore-mese-anno")).toHaveText(mese.slice(0, 4));`
         - cliccare la cella: `await pannello.getByRole("button", { name: etichettaMeseLunga(mese), exact: true }).click();` — il locator **deve** essere ancorato al pannello, perché il trigger ha lo stesso nome accessibile della cella quando l'anno mostrato è quello in griglia;
         - conservare le due asserzioni finali già presenti: `await expect(page).toHaveURL(\`/attivita?mese=${mese}\`);` e `await expect(cellaDelGiorno(page, giornoAtteso, mese)).toBeVisible();`, che restano la barriera sull'arrivo dei dati.

      ## Verify
      - Run: `npx playwright test tests/e2e/duplica-riga-su-giorni.spec.ts --reporter=line`
      - Expect: tutti gli scenari passano, incluso quello che osserva la cella accesa nel mese di destinazione senza reload.
      - Run: `npm run lint`
      - Expect: guardrail e2e verde, nessun nuovo warning.

      ## Done
      - [ ] AC-3 — il file non contiene più alcun riferimento a «Vai a un mese specifico» o «Vai al mese selezionato».
      - [ ] Gli scenari di US-057 restano verdi con le stesse asserzioni di dominio, senza hard wait e senza cicli di attesa a polling.

      ## Blockers
      None.
