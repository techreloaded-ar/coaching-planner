      - Run: `npx playwright test tests/e2e/calendario-cache-mesi.spec.ts --reporter=line`
      - Expect: tutti gli scenari verdi — è la prova che il trigger conserva `data-testid="calendar-month-label"` con il testo dell'etichetta e che cache, Back/Forward e invalidazione non sono stati toccati.

      ## Done
