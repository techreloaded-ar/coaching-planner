    body: |-
      ## Objective
      La barra del calendario mensile usa il nuovo selettore come unico ingresso al salto diretto e non contiene più il campo mese con il pulsante «Vai».

      ## Read
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — per intero, in particolare: gli import (righe 1-29), lo stato del selettore di salto (righe 122-130), il memo `etichetta` (righe 142-145), la callback `vaiA` (righe 165-217), il blocco di risincronizzazione del selettore durante il render (righe 236-239), il gestore `popstate` (righe 308-320), `submitSaltoMese` (righe 343-352), il div `calendar-month-label` (righe 393-398) e il `<form>` di salto (righe 436-459).
      - `src/app/(front-office)/attivita/selettore-mese.tsx` — firma delle props prodotte da TASK-03.
