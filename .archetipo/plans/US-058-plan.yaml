  - id: TASK-07
    title: Riscrivere la demo e2e filmabile sullo script di dimostrazione di US-058
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Esiste un unico test filmabile che riproduce passo per passo la sezione «Dimostrazione» della spec, pronto per la registrazione video in accettazione.

      ## Read
      - `tests/e2e/demo__salto-diretto-mese-calendario.spec.ts` — demo US-055 da sostituire: `test.use({ video: "on", viewport, launchOptions: { slowMo: 300 } })`, `test.setTimeout(120_000)`, commento della pausa finale.
      - La sezione «Dimostrazione» di US-058 (nel corpo della spec).
      - `tests/e2e/calendario-salto-mese.spec.ts` riscritto da TASK-06 — helper e locator da riusare con le stesse convenzioni.

      ## Change
      - `tests/e2e/demo__salto-diretto-mese-calendario.spec.ts`: contenuto interamente riscritto, percorso invariato.

      Non-goal: non aggiungere altri file demo; non registrare video in questa fase (lo fa `archetipo-review`); non estendere la demo a scenari fuori dallo script della spec.

      ## Steps
      1. Impostare `const CODICE_SPEC = "US-058-DEMO-SELETTORE-MESE";` — chiave verificata libera da collisioni in fase di planning. Il mese di arrivo è `meseRiservato(CODICE_SPEC)`; se servisse un secondo mese, `mesePassatoRiservato(CODICE_SPEC, 40)` è pure libero.
      2. Conservare `test.use({ video: "on", viewport: { width: 1280, height: 720 }, launchOptions: { slowMo: 300 } })` e `test.setTimeout(120_000)`.
      3. Fixture: cliente con offerta e una riga attività su `dataNelMese(meseArrivo, 12)` con 4 ore, tutto da factory.
      4. Passi del test, nell'ordine della dimostrazione:
         - accesso come collaboratore, `goto("/attivita")`, calendario visibile, `calendar-month-label` con l'etichetta del mese odierno, `data-idratata="true"`;
         - il vecchio controllo non esiste più: `toHaveCount(0)` su `getByLabel("Vai a un mese specifico")` e sul pulsante «Vai al mese selezionato»;
         - clic sull'etichetta: pannello visibile, anno corrente mostrato, cella del mese odierno con `aria-current="true"`;
         - spostamento dell'anno fino all'anno del mese riservato con il numero di clic calcolato una sola volta, e clic sulla cella del mese, ancorata al pannello;
         - il pannello si chiude, la cella `a[href="/attivita/${data}?mese=${meseArrivo}"]` espone `data-con-attivita="true"` con l'etichetta cliente `${ragioneSociale} 4.0 h` e l'URL porta `mese=${meseArrivo}`;
         - riapertura del selettore e chiusura con `Escape`: `calendar-month-label` resta sull'etichetta del mese raggiunto e l'URL non cambia;
         - clic su «Mese corrente»: URL `/attivita` senza query ed etichetta del mese odierno.
      5. Chiudere con la pausa di ritmo video preceduta dal commento **esatto** richiesto dal guardrail: `// Pausa finale solo per ritmo video demo, non per sincronizzazione funzionale.` seguito da `await page.waitForTimeout(1500);`. Senza quel commento il guardrail fallisce.

      ## Verify
      - Run: `npx playwright test tests/e2e/demo__salto-diretto-mese-calendario.spec.ts --reporter=line`
      - Expect: un test passato, con il video prodotto sotto `test-results/`.
      - Run: `npm run lint`
      - Expect: guardrail e2e verde (hard wait allowlistato dal commento, nessuna collisione di mese riservato).

      ## Done
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5 — lo script eseguibile percorre apertura dall'etichetta, spostamento d'anno, scelta immediata, token nell'URL, assenza del vecchio controllo, chiusura con `Esc` a mese invariato e ritorno con «Mese corrente».
      - [ ] Il test è filmabile: `video: "on"` e ritmo `slowMo` conservati, unica pausa finale correttamente commentata.

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Aggiornare la pagina Wiki domains/attivita sul selettore compatto
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      La pagina `domains/attivita` descrive il salto diretto come è stato consegnato — un selettore compatto sull'etichetta — e non più come il campo mese con pulsante «Vai» rimosso da AC-3.

      ## Read
      - `docs/wiki/domains/attivita.md` — frontmatter `sources` e blocco `review`, punto 8 di «Flussi osservati» (che descrive testualmente «un campo mese («Vai a un mese specifico») con il pulsante di conferma «Vai»»), tabella della sezione «Codice» (riga «Isola giornata» e riga «Test») e la frase della sezione «Verifica» che descrive gli scenari di `tests/e2e/calendario-salto-mese.spec.ts`.
      - Il codice consegnato da TASK-03, TASK-04, TASK-06 e TASK-07.

      ## Change
      - `docs/wiki/domains/attivita.md`.
      - `docs/wiki/index.md` e `docs/wiki/log.md`: solo come output dei comandi `archetipo wiki`.

      Non-goal: non modificare `decisions/cache-client-calendario-collaboratore`, `decisions/calcoli-puri`, `decisions/fotografia-rimborso-trasferta` ed `engineering/code-map` — sono candidati `affected` le cui affermazioni restano vere e vanno riconciliati in accettazione, non riscritti qui. Non riscrivere i flussi diversi dall'8 né la parte del punto 8 su cache, prefetch, History API e contratto URL, che restano invariati.

      ## Steps
      1. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner reset domains/attivita`, che riporta la pagina a `status: generated` rimuovendo il blocco `review`.
      2. In `sources` aggiungere `src/app/(front-office)/attivita/selettore-mese.tsx` con `role: inbound-ui`, accanto a `calendario-mensile.tsx`.
      3. In `sources`, alla voce `src/domain/calendario/index.ts` (`role: supporting-domain`), aggiungere `etichettaMeseBreve` all'elenco dei simboli.
      4. Riscrivere la parte finale del punto 8: il salto diretto non è più un campo mese affiancato da un pulsante «Vai», ma il selettore aperto **dall'etichetta stessa** del mese — un pannello ancorato con anno navigabile e dodici mesi, mese in griglia evidenziato, scelta senza conferma, chiusura con `Esc` o clic fuori a mese invariato e uso completo da tastiera con attraversamento del confine d'anno con le frecce. Conservare l'affermazione strutturale che resta vera: non è un percorso di navigazione parallelo ma un ulteriore ingresso allo stesso intento `vaiA`, da cui discendono senza codice aggiuntivo lo stesso indicatore di attesa, la stessa scrittura dell'URL dentro `commit` e la coerenza dei controlli esistenti. Eliminare la frase sulla risincronizzazione del campo durante il render, non più applicabile: il pannello rilegge il mese in griglia a ogni apertura.
      5. Nella tabella «Codice» aggiungere `selettore-mese.tsx` alla riga che elenca i componenti dell'area attività del front office.
      6. Nella sezione «Verifica» sostituire la frase sugli scenari di `tests/e2e/calendario-salto-mese.spec.ts` con la descrizione dei quattro scenari consegnati (salto su anno diverso con URL riapribile al reload; chiusura senza scelta con `Esc` e con clic fuori; uso da tastiera con attraversamento del confine d'anno e ritorno del focus al trigger; feedback di attesa invariato con lettura trattenuta), mantenendo lo stesso livello di specificità delle frasi vicine e la nota sul perché l'attesa non nasce da un hard wait.
      7. Aggiungere una riga sulla copertura unit della nuova funzione pura in `tests/unit/calendario.test.ts`.
      8. Eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner catalog`.

      ## Verify
      - Run: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner validate --profile bootstrap`
      - Expect: envelope `kind: validation_result` con `data.ok: true`, nessun finding di severità `error`, nessun link rotto.
      - Run: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner status`
      - Expect: `domains/attivita` risulta `generated`, in attesa dell'approvazione in accettazione, non `reviewed`.

      ## Done
      - [ ] AC-1, AC-2, AC-5, AC-6 — il punto 8 descrive il selettore effettivamente consegnato, con evidenziazione, chiusura senza scelta e contratto da tastiera.
      - [ ] AC-3 — nella pagina non resta alcuna descrizione del campo mese con pulsante «Vai» come controllo presente.
      - [ ] Ogni percorso citato in `sources` esiste su disco e tutti i marcatori di sezione della pagina sono conservati.

      ## Blockers
      None.
