  - id: TASK-06
    title: Riscrivere calendario-salto-mese.spec.ts sui sei criteri del selettore compatto
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      `tests/e2e/calendario-salto-mese.spec.ts` prova nel browser tutti e sei i criteri di US-058 e conserva la copertura di regressione sul feedback di attesa del salto.

      ## Read
      - `tests/e2e/calendario-salto-mese.spec.ts` — versione US-055 da sostituire: struttura delle fixture, `dataDb`, `meseSuccessivoToken`, `etichettaMeseCorrente`, gate deterministico con `page.route` sbloccato da una promessa.
      - `tests/e2e/support/date.ts` — `meseRiservato`, `mesePassatoRiservato`, `meseCorrenteToken`, `dataNelMese`.
      - `tests/e2e/support/fixtures.ts` e `tests/e2e/support/auth.ts` — factory e `accediComeCollaboratore`.
      - `tests/e2e/README.md` — contratto e2e.
      - `src/app/(front-office)/attivita/selettore-mese.tsx` — test id, nomi accessibili e contratto tastiera consegnati da TASK-03.

      ## Change
      - `tests/e2e/calendario-salto-mese.spec.ts`: contenuto interamente riscritto, percorso del file invariato (è citato fra le `sources` di `domains/attivita`).

      Non-goal: non toccare altri file di test; non modificare `tests/e2e/support/date.ts` (le chiavi usate qui non sono esclusive e non vanno registrate in `SLOT_MESI_RISERVATI_ESCLUSIVI`, perché nessuno scenario asserisce totali o vuoto dell'intero mese).

      ## Steps
      1. Intestare il file con un commento che spiega quali criteri copre e perché l'attesa è resa deterministica con `page.route`, nello stile del commento esistente.
      2. Chiavi di mese riservato — già verificate libere da collisioni in fase di planning: `meseRiservato("US-058")` per il mese di arrivo e `mesePassatoRiservato("US-058", 42)` per il mese lontano dello scenario di attesa. **Non** usare offset diversi da 42 senza rieseguire `npm run lint`, che contiene il controllo delle collisioni.
      3. Helper locali: `dataDb`, `etichettaMeseCorrente` (come nella versione attuale), `etichettaMeseLunga(token)` con `Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" })`, e `apriSelettore(page)` che clicca `calendar-month-label`, attende `selettore-mese-pannello` visibile e restituisce il locator del pannello.
      4. Helper `portaAnno(pannello, annoTarget)`: legge **una sola volta** `Number(await pannello.getByTestId("selettore-mese-anno").innerText())`, calcola i passi e clicca il pulsante «Anno precedente»/«Anno successivo» esattamente `Math.abs(passi)` volte, poi asserisce `toHaveText(String(annoTarget))`. Nessun ciclo di polling.
      5. **Scenario 1 — «il selettore sull'etichetta raggiunge un mese di un anno diverso» (AC-1, AC-2, AC-3, AC-4).**
         - Fixture: `factory.createClienteConOfferta()` e `factory.createRigaAttivita` su `dataNelMese(meseArrivo, 14)` con 4 ore.
         - `accediComeCollaboratore`, `page.goto("/attivita")`, attendere `getByLabel("Calendario mensile delle attività")` visibile e `data-idratata="true"`.
         - AC-3: `await expect(page.getByLabel("Vai a un mese specifico")).toHaveCount(0);` e `await expect(page.getByRole("button", { name: "Vai al mese selezionato" })).toHaveCount(0);`
         - AC-1: il trigger ha `aria-expanded="false"`; dopo `apriSelettore` ha `aria-expanded="true"`, `selettore-mese-anno` mostra l'anno corrente e la cella con `[data-token="${meseCorrenteToken()}"]` dentro il pannello ha `aria-current="true"`.
         - `portaAnno(pannello, Number(meseArrivo.slice(0, 4)))`; a quel punto nessuna cella deve avere `aria-current="true"` (`await expect(pannello.locator('[aria-current="true"]')).toHaveCount(0)`), perché il mese in griglia è di un altro anno.
         - AC-2: cliccare `pannello.getByRole("button", { name: etichettaMeseLunga(meseArrivo), exact: true })`; asserire `await expect(pannello).toBeHidden();` e che la cella `a[href="/attivita/${data}?mese=${meseArrivo}"]` ha `data-con-attivita="true"` con `etichetta-cliente` uguale a `${ragioneSociale} 4.0 h`. Il locator della cella mese **deve** essere ancorato al pannello: il trigger ha lo stesso nome accessibile.
         - AC-4: `await expect(page).toHaveURL(new RegExp(\`mese=${meseArrivo}\`));`, poi `page.reload()` e nuovamente URL e cella valorizzata.
      6. **Scenario 2 — «la chiusura senza scelta lascia invariato il mese in griglia» (AC-5).**
         - Ingresso su `/attivita` (mese corrente), idratazione attesa.
         - Aprire il selettore, cliccare una volta «Anno precedente», premere `Escape`: pannello `toBeHidden()`, `calendar-month-label` ancora `toHaveText(etichettaMeseCorrente())`, `await expect(page).toHaveURL(/\/attivita$/)`.
         - Riaprire, cliccare «Anno successivo», poi chiudere con un clic fuori su un elemento non navigante della legenda (`page.getByText("Giorno con attività registrate")`): stesse tre asserzioni.
      7. **Scenario 3 — «il selettore è utilizzabile da tastiera» (AC-6).**
         - Ingresso su `/attivita`, idratazione attesa. Calcolare `const [annoCorrente, meseCorrente] = meseCorrenteToken().split("-").map(Number);`.
         - `await page.getByTestId("calendar-month-label").focus(); await page.keyboard.press("Enter");` — il pannello è visibile e la cella `[data-token="${meseCorrenteToken()}"]` è `toBeFocused()`.
         - Premere `ArrowLeft` esattamente `meseCorrente` volte: dopo l'ultima pressione `selettore-mese-anno` mostra `annoCorrente - 1` e la cella `[data-token="${annoCorrente - 1}-12"]` è `toBeFocused()` — è la prova che lo spostamento attraversa il confine d'anno senza mouse.
         - `await page.keyboard.press("Enter");` — pannello nascosto, `await expect(page).toHaveURL(new RegExp(\`mese=${annoCorrente - 1}-12\`));` e `calendar-month-label` con l'etichetta lunga di quel mese. Questo scenario asserisce solo URL ed etichetta, mai totali o assenza di righe, quindi non richiede un mese riservato ed è sicuro in parallelo.
         - Riaprire con `focus()` + `Enter`, premere `Escape`: pannello `toBeHidden()` e `calendar-month-label` `toBeFocused()`.
      8. **Scenario 4 — «il salto verso un mese non ancora in cache mostra il feedback di attesa esistente».**
         - Riusare la struttura dell'attuale secondo test: `mesePartenza = meseRiservato("US-058")`, `meseArrivo = mesePassatoRiservato("US-058", 42)`, riga da factory su `dataNelMese(meseArrivo, 9)` con 2 ore, `page.route` registrata **prima** del `goto` su `/attivita` e `/api/attivita/calendario` con `mese=meseArrivo`, sbloccata da una promessa dopo le asserzioni.
         - `goto(\`/attivita?mese=${mesePartenza}\`)`, idratazione attesa, apertura del selettore, `portaAnno` all'anno di `meseArrivo`, clic sulla cella.
         - Con la lettura trattenuta: `indicatore-caricamento-mese` visibile e calendario con `aria-busy="true"`; dopo lo sblocco, cella valorizzata con `${ragioneSociale} 2.0 h`, indicatore nascosto, `aria-busy="false"`, URL con il token. Chiudere con `page.unroute`.

      ## Verify
      - Run: `npx playwright test tests/e2e/calendario-salto-mese.spec.ts --reporter=line`
      - Expect: quattro scenari passati (baseline: due scenari US-055 passati in 5.0 s), nessun retry necessario.
      - Run: `npm run lint`
      - Expect: guardrail e2e verde, in particolare nessuna «collisione di mese riservato»; nessun nuovo warning ESLint.

      ## Done
      - [ ] AC-1 — provato con `aria-expanded`, pannello visibile, anno mostrato e `aria-current="true"` sulla cella del mese in griglia.
      - [ ] AC-2 — provato con pannello nascosto e cella giorno valorizzata subito dopo il clic, senza alcuna conferma.
      - [ ] AC-3 — provato con `toHaveCount(0)` su label e pulsante del vecchio controllo.
      - [ ] AC-4 — provato con il token nell'URL e la sua riapertura al reload.
      - [ ] AC-5 — provato due volte (Esc e clic fuori) su etichetta e URL invariati.
      - [ ] AC-6 — provato con apertura da `Enter`, focus sulla cella del mese in griglia, attraversamento del confine d'anno con le frecce, scelta con `Enter` e chiusura con `Escape` che riporta il focus al trigger.
      - [ ] Il feedback di attesa preesistente resta coperto sul percorso di salto.

