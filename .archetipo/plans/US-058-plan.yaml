      ## Change
      - Nessuna modifica di codice. Se un controllo fallisce, la correzione appartiene al task che possiede quel file, non a questo gate.

      Non-goal: non allargare il perimetro, non silenziare warning con direttive `eslint-disable`, non introdurre `retries` o `workers: 1` per stabilizzare un e2e.

      ## Steps
      1. Eseguire i controlli sotto, nell'ordine indicato, da `/Users/smarello/repo/coaching-planner`. Non dedurre la batteria dalle convenzioni del progetto: è esattamente questa.
      2. A tutti i controlli verdi, marcare questo task `DONE` con `archetipo task done US-058 TASK-09` da `/Users/smarello/repo/coaching-planner`.
      3. Ricaricare la spec con `archetipo spec show US-058` da `/Users/smarello/repo/coaching-planner` e verificare che **nessun** task risulti ancora `TODO`.
      4. Solo allora richiedere la revisione con `archetipo spec review US-058`. L'ordine è vincolante: controlli → gate `DONE` → rilettura della spec → richiesta di revisione.

      ## Verify
      - Run: `npx tsc --noEmit -p tsconfig.json`
      - Expect: exit 0, nessuna diagnostica (baseline: già a zero; nessun file toccato deve introdurne).
      - Run: `npm run lint`
      - Expect: 0 errori; l'unico warning ammesso è quello pre-esistente `tests/e2e/demo__duplicazione-riga-su-piu-giorni.spec.ts:41 'MESE_ALTRO' is assigned a value but never used`; il guardrail e2e termina con `✅ Guardrail e2e anti-flakiness passed` e nessuna «collisione di mese riservato».
      - Run: `npm test`
      - Expect: tutti i file vitest verdi, con un numero di test superiore ai 681 di baseline grazie a TASK-02.
      - Run: `npm run build`
      - Expect: build Next completata senza errori (nessun errore di tipo o di compilazione introdotto dal nuovo componente client).
      - Run: `npx playwright test tests/e2e/calendario-salto-mese.spec.ts tests/e2e/demo__salto-diretto-mese-calendario.spec.ts tests/e2e/duplica-riga-su-giorni.spec.ts tests/e2e/calendario-cache-mesi.spec.ts tests/e2e/calendario-navigazione-reattiva.spec.ts tests/e2e/demo__calendario-mensile.spec.ts --reporter=line`
      - Expect: tutti gli scenari passati senza retry — i primi tre sono l'accettazione e l'adeguamento, gli ultimi tre sono la regressione sui consumatori di `calendar-month-label` e sulla navigazione mensile.
      - Run: `archetipo wiki --project-root /Users/smarello/repo/coaching-planner validate --profile bootstrap`
      - Expect: `data.ok: true`, nessun finding `error`.

      ## Done
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — tutti provati dagli scenari verdi di `tests/e2e/calendario-salto-mese.spec.ts`, con la demo filmabile pure verde.
