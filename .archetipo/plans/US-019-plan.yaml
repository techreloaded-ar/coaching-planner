         5. `expect(page.getByRole("status").filter({ hasText: "Promemoria inviati" })).toHaveText(/^Promemoria inviati: \d+\. Non riusciti: 0\.$/)`.
         Nessun dato da creare: l'invio manuale non scrive sul DB e in e2e è simulato.

