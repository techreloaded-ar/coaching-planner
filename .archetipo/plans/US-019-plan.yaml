  - id: TASK-08
    title: Pulsante "Invia promemoria di fine mese" nel report di fatturazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      L'amministratore invia subito il promemoria dalla pagina `/report/fatturazione-clienti` e vede quante email sono partite.

      ## Read
      - src/app/(back-office)/report/fatturazione-clienti/page.tsx — intestazione con `justify-between`
      - src/app/(back-office)/anagrafiche/voci-rimborso/actions.ts e page.tsx — `richiediRuoloApi`, `redirect` con esito, markup del banner
      - src/components/index.ts — `PulsanteAttesa`
      - node_modules/next/dist/docs/01-app/01-getting-started/07-mutating-data.md

      ## Change
      - src/app/(back-office)/report/fatturazione-clienti/actions.ts — nuovo file `"use server"` con `inviaPromemoriaFineMeseOra()`.
      - src/app/(back-office)/report/fatturazione-clienti/page.tsx:
        - `searchParams` esteso con `promemoriaInviati?` e `promemoriaFalliti?`;
        - form con il pulsante nell'intestazione;
        - banner di esito sopra il report.
      - Non toccare: `report-fatturazione-clienti.tsx` e le route `dati` ed `esporta`.

      ## Steps
      1. Action:
         1. `await richiediRuoloApi("AMMINISTRATORE")`;
         2. `const esito = await inviaPromemoriaFineMese({ modalita: "MANUALE" })`;
         3. `redirect(\`/report/fatturazione-clienti?promemoriaInviati=${esito.inviati}&promemoriaFalliti=${esito.falliti}\`)`.
      2. Pagina:
         - un blocco a destra del titolo con `<form action={inviaPromemoriaFineMeseOra}>`, `<PulsanteAttesa etichettaAttesa="Invio…">Invia promemoria di fine mese</PulsanteAttesa>` e una riga piccola "Invia subito l'email a tutti i collaboratori attivi";
         - se i due parametri sono interi validi, un `<div role="status">` con "Promemoria inviati: N. Non riusciti: M.", verde se M = 0 e ambra altrimenti, con lo stile del banner di voci-rimborso.

      ## Verify
      - Run: `npx tsc --noEmit && npx eslint "src/app/(back-office)/report/fatturazione-clienti" && npm run build`
      - Expect: exit 0.

      ## Done
      - [ ] AC-6 — pulsante riservato all'amministratore, invio immediato e conteggi visibili

      ## Blockers
      None.
    ref: TASK-08
