      ## Steps
      1. Unit:
         - `richiediRuoloApi` che lancia ⇒ errore propagato e `inviaPromemoriaFineMese` non chiamato;
         - con il ruolo ⇒ chiamato con `modalita: "MANUALE"` e `redirect` a `?promemoriaInviati=3&promemoriaFalliti=1` per l'esito mockato.
      2. E2E:
         1. `accediComeAdmin(page)`;
         2. `page.goto("/report/fatturazione-clienti")`;
         3. click su `getByRole("button", { name: "Invia promemoria di fine mese", exact: true })`;
