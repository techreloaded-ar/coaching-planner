  - id: TASK-06
    title: Riscrivi la suite e2e dell'anagrafica collaboratori sui nuovi criteri
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      `tests/e2e/anagrafica-collaboratori.spec.ts` prova AC-1, AC-2, AC-3, AC-4 e AC-5 nel browser con dati creati da factory.

      ## Read
      - tests/e2e/anagrafica-collaboratori.spec.ts — suite attuale interamente basata su censimento e Disattiva/Riattiva, da sostituire
      - tests/e2e/support/fixtures.ts — fixture `factory` e `collaboratore`; `factory.createCollaboratore()` accetta opzioni (es. `{ attivo: false }`, vedi uso in attivita-amministratore.spec.ts riga ~157)
      - tests/e2e/README.md — contratto anti-flakiness
      - tests/e2e/gestione-utenti.spec.ts — pattern di selezione righe per email/nome factory

      ## Change
      - tests/e2e/anagrafica-collaboratori.spec.ts — riscrivi la suite (aggiorna l'intestazione del file a US-047) con questi scenari, usando `test` da `./support/fixtures` e admin via `accediComeAdmin`:
        1. **Censimento non disponibile (AC-1):** sull'elenco `getByRole("link", { name: "Nuovo collaboratore" })` → `toHaveCount(0)`; `page.goto("/anagrafiche/collaboratori/nuovo")` → `waitForURL("**/anagrafiche/utenti")` e heading della schermata utenti visibile
        2. **Stato sola lettura (AC-2, AC-3):** crea con factory un collaboratore attivo e uno `{ attivo: false }`; sulla riga del primo badge "Attivo" (exact) visibile, su quella del secondo "Disattivato" visibile; in entrambe `getByRole("button", { name: "Disattiva" })` e `{ name: "Riattiva" }` → `toHaveCount(0)`; apri la modifica del collaboratore attivo e verifica count 0 anche lì
        3. **Modifica persistita (AC-4):** dalla riga del collaboratore factory clicca "Modifica", cambia nome e tariffa (valore univoco es. "777,50"), salva → `waitForURL("**/anagrafiche/collaboratori?esito=salvato")` → nuovi valori visibili nella riga; `page.reload()` → ancora visibili
        4. **Email sola lettura (AC-5):** nella modifica, input email → `toHaveJSProperty("readOnly", true)`; salva senza toccarla → email invariata nella riga dell'elenco
      - Rispetta il guardrail: nessun `selectOption` per indice, nessun hard wait, nessuna classe Tailwind come selettore, nessuna mutazione di entità seed

      ## Steps
      1. Riscrivi la suite con i quattro scenari sopra, righe individuate con `.filter({ hasText: nomeCompletoFactory })`.
      2. Esegui il guardrail lint e la suite in locale (prerequisiti d'ambiente in Baseline: Postgres, migrate, seed, chromium).

      ## Verify
      - Run: `npm run lint`
      - Expect: verde, incluso il guardrail anti-flakiness
      - Run: `npm run test:e2e -- tests/e2e/anagrafica-collaboratori.spec.ts`
      - Expect: tutti gli scenari verdi (richiede l'ambiente e2e descritto nella Baseline del piano)

      ## Done
      - [ ] AC-1 — Scenario 1 verde con entrambi gli oracoli (assenza link + redirect)
      - [ ] AC-2 — Scenario 2 verde: nessun controllo Disattiva/Riattiva in elenco né in modifica
      - [ ] AC-3 — Scenario 2 verde: badge di stato visibili per attivo e disattivato
      - [ ] AC-4 — Scenario 3 verde: valori modificati persistiti dopo reload
      - [ ] AC-5 — Scenario 4 verde: email readOnly e invariata dopo salvataggio

      ## Blockers
      None.
