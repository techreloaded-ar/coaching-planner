schema: archetipo/plan/v2
spec_code: US-047
body: |-
  # US-047: Anagrafica collaboratori dedicata alla sola modifica del profilo — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-28

  ---

  ## Spec

  **Epic:** EP-005 — Evoluzioni Post-MVP
  **Priorità:** MEDIUM | **Punti:** 2
  **Bloccata da:** US-045 (DONE), US-046 (DONE) — nessun rischio di dipendenza

  **Storia Utente**
  Come amministratore, voglio che l'anagrafica collaboratori non permetta più censimento, eliminazione o cambio di stato dei collaboratori, così che il ciclo di vita di utenze e ruoli sia governato solo dalla schermata utenti, mentre lì restano modificabili i dati anagrafici e di costo.

  **Criteri di Accettazione**
  - AC-1 — Il pulsante "Nuovo collaboratore" non è più presente e l'accesso diretto alla pagina di censimento reindirizza alla schermata utenti
  - AC-2 — Le azioni Disattiva e Riattiva non sono più presenti nell'elenco né nella modifica
  - AC-3 — Lo stato attivo/disattivato resta visibile in sola lettura nell'elenco
  - AC-4 — La modifica di nome, cognome, partita IVA e tariffa giornaliera resta possibile e persistita
  - AC-5 — Il campo email è in sola lettura nella modifica ed è modificabile solo dalla schermata utenti

  ---

  ## Soluzione Tecnica

  La spec è una rimozione controllata di percorsi duplicati resi obsoleti da US-045/US-046: il ciclo di vita di utenze, ruoli e stato è già interamente governabile da `/anagrafiche/utenti`. L'anagrafica collaboratori resta la sede dei soli dati anagrafici e di costo.

  - **Censimento (AC-1):** `page.tsx` dell'elenco perde il pulsante "Nuovo collaboratore" (e il ramo morto del banner `esito=creato`, che nessun flusso produce più); `nuovo/page.tsx` smette di renderizzare il form e diventa `redirect("/anagrafiche/utenti")` dopo la guardia `richiediRuolo("AMMINISTRATORE")`.
  - **Cambio di stato (AC-2, AC-3):** `collaboratori-tabella.tsx` perde il bottone Disattiva, il form Riattiva, la modale di conferma e l'import di `cambiaStatoAction`; il file `cambia-stato-action.ts` dei collaboratori viene eliminato (quello dei clienti è una copia indipendente e resta). Il badge Attivo/Disattivato e il contatore in toolbar restano invariati in sola lettura. La pagina di dettaglio `[id]/page.tsx` non ha azioni di stato (verificato) e resta fuori perimetro.
  - **Form solo modifica (AC-4, AC-5):** `collaboratore-form.tsx` diventa edit-only (prop `collaboratore` obbligatoria, niente ramo creazione né import di `creaCollaboratore`); il campo email diventa un input `readOnly` senza attributo `name` (non viene inviato), con hint che rimanda alla schermata utenti.
  - **Server action e validazione (AC-4, AC-5 lato server):** in `actions.ts` si eliminano `creaCollaboratore` e `cambiaStatoCollaboratore` con i loro helper (`isPrismaUniqueConstraintError`, `erroreEmailDuplicata`, import `Prisma`); `aggiornaCollaboratore` smette di leggere e scrivere l'email — `utente.update` sincronizza solo `nome` (il sync del nome resta come oggi, da perimetro) — e il try/catch P2002 decade perché nessun campo unico viene più scritto. In `valida-collaboratore.ts` il campo `email` esce da `DatiCollaboratoreInput` e da `validaCollaboratore` (la regex `RE_EMAIL` diventa inutilizzata e si rimuove); `valida-utente.ts` ha la propria copia di `RE_EMAIL` e i propri controlli email, nessun impatto. `creaUtente`/`aggiornaUtente` importano solo `normalizzaTariffaGiornaliera`, `validaCampoPartitaIva`, `validaCampoTariffaGiornaliera`: invariati.
  - **Test esistenti impattati (da riscrivere, non da aggirare):** `tests/e2e/anagrafica-collaboratori.spec.ts` (tutti gli scenari usano censimento e Disattiva/Riattiva), `tests/e2e/demo__anagrafica-collaboratori.spec.ts` (demo US-009 basata sul censimento, gira in CI), `tests/e2e/attivita-amministratore.spec.ts` (auto-censimento del profilo via `/collaboratori/nuovo`, da migrare al flusso US-046 via modifica utente), `tests/unit/collaboratori-dal-actions.test.ts` e `tests/unit/valida-collaboratore.test.ts`.

  ### Decisioni Architetturali

  Nessuna nuova ADR: la spec applica la decisione esistente [Ruoli combinabili derivati dal profilo collaboratore](decisions/ruoli-combinabili-profilo-derivato) consolidando la schermata utenti come unico punto di governo del ciclo di vita. Non esistono alternative progettuali sopra soglia: è la rimozione dell'ultimo percorso ridondante.

  ---

  ## Baseline

  Eseguita il 2026-07-28 su `main` pulito (workdir = project root, nessun worktree).

  | Verifica | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run lint` | ✅ passa (ESLint + guardrail anti-flakiness e2e) | I task devono lasciarlo verde; il guardrail vincola lo stile dei nuovi e2e |
  | `npx tsc --noEmit` | ✅ passa (exit 0) | Nessun file toccato può introdurre nuovi diagnostici |
  | `npx vitest run tests/unit/collaboratori-dal-actions.test.ts tests/unit/valida-collaboratore.test.ts tests/unit/utenti-actions.test.ts` | ✅ 79 test passano | Le suite riscritte devono ripassare; `utenti-actions.test.ts` non va toccata e deve restare verde |

  **Prerequisiti d'ambiente per gli e2e (separati dai fallimenti di codice):** gli e2e non sono stati eseguiti in baseline perché richiedono infrastruttura, non perché falliscano. Servono: PostgreSQL locale con `DATABASE_URL` e `E2E_DATABASE_URL`, `npx prisma migrate deploy`, `npx prisma db seed`, `npx playwright install chromium`, `E2E_TEST_MODE=true`. La CI esegue l'intera suite (`npm run test:e2e`) su questa stessa sequenza; il contratto completo è in `tests/e2e/README.md`.

  ---

  ## Mappa delle Evidenze di Accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task produttore |
  |---|---|---|---|---|
  | AC-1 | Admin autenticato; nessuna fixture aggiuntiva | e2e browser | Sull'elenco, `getByRole("link", { name: "Nuovo collaboratore" })` ha count 0; `page.goto("/anagrafiche/collaboratori/nuovo")` termina con `waitForURL("**/anagrafiche/utenti")` | TASK-06 |
  | AC-2 | Collaboratore attivo + collaboratore disattivato creati da factory | e2e browser | Nella riga elenco e nella pagina di modifica, `getByRole("button", { name: "Disattiva" })` e `{ name: "Riattiva" }` hanno count 0 | TASK-06 |
  | AC-3 | Stesse fixture di AC-2 | e2e browser | Badge testuale "Attivo" (exact) visibile sulla riga del collaboratore attivo e "Disattivato" su quella del disattivato, senza controlli interattivi associati | TASK-06 |
  | AC-4 | Collaboratore attivo da factory | e2e browser + unit | e2e: modifica di nome e tariffa → redirect `**/anagrafiche/collaboratori?esito=salvato` → nuovi valori visibili in elenco anche dopo `page.reload()`; unit: `collaboratore.update` riceve esattamente nome/cognome/partitaIva/tariffa normalizzata | TASK-05, TASK-06 |
  | AC-5 | Collaboratore attivo da factory | e2e browser + unit | e2e: input email con `toHaveJSProperty("readOnly", true)` e, dopo un salvataggio, email invariata in elenco; unit: `utente.update` riceve solo `{ nome }`, senza campo `email`, anche se il FormData contiene una email diversa | TASK-05, TASK-06 |

  ---

  ## Strategia di Test

  Due livelli complementari: unit sui contratti esatti delle action (payload Prisma, guardie, assenza di scritture indebite) ed e2e browser sull'esperienza dell'amministratore, obbligatori perché i criteri attraversano rotte, redirect server-side, autorizzazione e persistenza.

  - Gli e2e usano esclusivamente collaboratori creati da factory (`tests/e2e/support/fixtures.ts`), mai le entità seed (Giulia Conti), selezione per label/nome esatto, web-first `expect`, nessun hard wait — come da guardrail.
  - Le suite unit riscritte verificano anche il negativo: una email presente nel FormData non deve produrre alcuna scrittura su `utente.email`.
  - `attivita-amministratore.spec.ts` migra il journey di auto-censimento al flusso sancito da US-046 (modifica utente + checkbox Collaboratore), riusando i pattern di interazione già collaudati in `gestione-utenti.spec.ts`.
  - La demo US-009 viene riscritta sul nuovo comportamento della pagina, che è esattamente la Dimostrazione di US-047.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (già configurato; nessun setup aggiuntivo necessario)
  **Video demo:** atteso e filmabile (flusso back-office interamente osservabile; registrazione a carico di `archetipo-review`)

  | Scenario | Flusso utente |
  |---|---|
  | Censimento non disponibile | Admin apre l'elenco collaboratori: nessun pulsante "Nuovo collaboratore"; naviga direttamente a `/anagrafiche/collaboratori/nuovo` e atterra su `/anagrafiche/utenti` |
  | Stato in sola lettura | Admin osserva i badge Attivo/Disattivato su collaboratori factory senza azioni Disattiva/Riattiva né in elenco né in modifica |
  | Modifica profilo persistita | Admin apre la modifica, cambia nome e tariffa, salva, rivede i nuovi valori in elenco dopo reload |
  | Email non modificabile | Admin osserva il campo email in sola lettura; il salvataggio non altera l'email mostrata in elenco |
  | Auto-provisioning profilo admin (migrato) | Admin senza profilo vede lo stato vuoto nel front office, aggiunge a sé stesso il ruolo Collaboratore dalla schermata utenti e torna a vedere "Le mie attività" |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [domains/collaboratori, decisions/ruoli-combinabili-profilo-derivato]
    update_after_acceptance: [domains/collaboratori]
    create: []
  ```

  `wiki affected` sui path del piano restituisce `domains/collaboratori` ed `engineering/code-map`. La prima entra nel contratto: contratti e flussi osservati (`creaCollaboratore`, `cambiaStatoCollaboratore`, flussi 1, 2 e 5) cambiano semanticamente. `engineering/code-map` resta fuori: è già in stato `stale` e la sua natura di matrice fisica la rende co-citazione da rinfrescare con i normali cicli wiki, non conoscenza alterata da questa spec. `domains/identita-accesso` (citata nel contesto della spec) non cambia: la schermata utenti non viene toccata.

  ---

  _Piano generato via ARchetipo Planning — 2026-07-28_
tasks:
  - id: TASK-01
    title: 'Rimuovi il censimento: pulsante "Nuovo collaboratore" e redirect della pagina nuovo'
    type: Impl
    status: DONE
    body: |-
      ## Objective
      L'elenco collaboratori non offre più il censimento e l'accesso diretto a `/anagrafiche/collaboratori/nuovo` reindirizza alla schermata utenti.

      ## Read
      - src/app/(back-office)/anagrafiche/collaboratori/page.tsx — pulsante "Nuovo collaboratore" (righe ~48-58), ramo `esito === "creato"` del banner, import di `Link`
      - src/app/(back-office)/anagrafiche/collaboratori/nuovo/page.tsx — attuale rendering di `CollaboratoreForm`

      ## Change
      - src/app/(back-office)/anagrafiche/collaboratori/page.tsx — rimuovi il blocco `<Link href="/anagrafiche/collaboratori/nuovo">…Nuovo collaboratore…</Link>` con il suo contenitore `div`; rimuovi il ramo `esito === "creato"` dal calcolo di `messaggioEsito` (resta solo `salvato`); rimuovi l'import di `Link` se non più usato; aggiorna il sottotitolo descrittivo per riflettere che il ciclo di vita si governa dalla schermata utenti (es. "Il censimento e lo stato dei collaboratori si governano dalla schermata Utenti; qui restano modificabili i dati anagrafici e di costo.")
      - src/app/(back-office)/anagrafiche/collaboratori/nuovo/page.tsx — sostituisci il rendering del form con `redirect("/anagrafiche/utenti")` da `next/navigation`, mantenendo `await richiediRuolo("AMMINISTRATORE")` come prima istruzione; rimuovi l'import di `CollaboratoreForm`
      - Non toccare: `collaboratori-tabella.tsx` (TASK-02), `collaboratore-form.tsx` (TASK-03), la pagina di dettaglio `[id]/page.tsx`

      ## Steps
      1. In `nuovo/page.tsx` sostituisci il body con guardia + `redirect("/anagrafiche/utenti")` e sistema gli import.
      2. In `page.tsx` rimuovi pulsante, ramo `creato` e import inutilizzati; aggiorna il sottotitolo.
      3. Compila il progetto per verificare l'assenza di import pendenti.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0 (baseline verde, nessun nuovo diagnostico)
      - Run: `npx eslint "src/app/(back-office)/anagrafiche/collaboratori/page.tsx" "src/app/(back-office)/anagrafiche/collaboratori/nuovo/page.tsx"`
      - Expect: nessun errore

      ## Done
      - [ ] AC-1 — Il pulsante "Nuovo collaboratore" non è più renderizzato nell'elenco e `/anagrafiche/collaboratori/nuovo` esegue un redirect server-side a `/anagrafiche/utenti` per l'amministratore autenticato
      - [ ] Il banner `esito=creato` (ramo morto) è rimosso; `esito=salvato` funziona come prima

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Rimuovi le azioni Disattiva/Riattiva dall'elenco e l'action di cambio stato
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      L'elenco collaboratori mostra lo stato attivo/disattivato in sola lettura, senza azioni di cambio stato, e l'action server dedicata non esiste più.

      ## Read
      - src/app/(back-office)/anagrafiche/collaboratori/collaboratori-tabella.tsx — import `cambiaStatoAction`, stati `collaboratoreDaDisattivare`/`modaleAperta`, callback `chiudiModale`/`apriModaleDisattiva`, bottone Disattiva (righe ~183-193), form Riattiva (~195-208), modale di conferma (~218-276)
      - src/app/(back-office)/anagrafiche/collaboratori/cambia-stato-action.ts — file da eliminare (attenzione: `clienti/cambia-stato-action.ts` è una copia indipendente della capability Clienti e NON va toccata)

      ## Change
      - src/app/(back-office)/anagrafiche/collaboratori/collaboratori-tabella.tsx — rimuovi bottone Disattiva, form Riattiva, l'intera modale di conferma, gli stati e i callback correlati, gli import di `cambiaStatoAction` e `useCallback` (se non più usato); conserva: filtro di ricerca, contatore "N attivi · N disattivati", badge di stato Attivo/Disattivato, link Modifica, navigazione al dettaglio; la colonna azioni resta con il solo link Modifica
      - src/app/(back-office)/anagrafiche/collaboratori/cambia-stato-action.ts — elimina il file
      - Non toccare: `actions.ts` (`cambiaStatoCollaboratore` viene rimossa in TASK-04)

      ## Steps
      1. Elimina dalla tabella la modale, i due controlli di stato e tutto lo stato React che li serviva.
      2. Sistema gli import residui del componente.
      3. Elimina `cambia-stato-action.ts` dei collaboratori.
      4. Verifica con grep che non restino riferimenti: `grep -rn "cambia-stato-action" "src/app/(back-office)/anagrafiche/collaboratori"` deve restituire vuoto.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0
      - Run: `npx eslint "src/app/(back-office)/anagrafiche/collaboratori/collaboratori-tabella.tsx"`
      - Expect: nessun errore

      ## Done
      - [ ] AC-2 — Nessun bottone Disattiva/Riattiva né modale di conferma nell'elenco collaboratori
      - [ ] AC-3 — Il badge di stato Attivo/Disattivato e il contatore restano visibili invariati, in sola lettura
      - [ ] Il file `cambia-stato-action.ts` dei collaboratori non esiste più; quello dei clienti è intatto

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Riduci il form collaboratore alla sola modifica con email in sola lettura
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `CollaboratoreForm` funziona solo in modifica: email visibile ma in sola lettura e non inviata al server; nome, cognome, partita IVA e tariffa restano modificabili.

      ## Read
      - src/app/(back-office)/anagrafiche/collaboratori/collaboratore-form.tsx — prop opzionale `collaboratore`, flag `inModifica`, scelta tra `creaCollaboratore`/`aggiornaCollaboratore` in `useActionState` (riga ~36), campo email (righe ~131-141), componente interno `Campo`
      - src/app/(back-office)/anagrafiche/collaboratori/[id]/modifica/page.tsx — unico chiamante rimasto dopo TASK-01 (non richiede modifiche)

      ## Change
      - src/app/(back-office)/anagrafiche/collaboratori/collaboratore-form.tsx — rendi la prop `collaboratore` obbligatoria; elimina il flag `inModifica` e tutti i suoi rami (titolo fisso "Modifica collaboratore", bottone fisso "Salva modifiche", hidden input `id` sempre presente); usa solo `aggiornaCollaboratore` in `useActionState` e rimuovi l'import di `creaCollaboratore`; trasforma il campo email in input in sola lettura: `readOnly`, SENZA attributo `name` (così non entra nel FormData), stile visivamente distinto (es. sfondo `bg-zinc-50 dark:bg-zinc-800/50` e `cursor-default`) e hint "L'email di accesso si modifica dalla schermata Utenti"; per farlo estendi `Campo` con una prop `soloLettura?: boolean` che applica `readOnly`, omette `name` e cambia lo stile, oppure renderizza l'email con un blocco dedicato — scegli l'estensione di `Campo` per coerenza col resto del form; aggiorna il box informativo "Accesso con Google" se il testo presuppone la creazione; rimuovi il ramo `?? ""` sui default ora che la prop è certa
      - Non toccare: `actions.ts` (TASK-04), il footer con badge "Stato attuale" che resta com'è (sola lettura, coerente con AC-3)

      ## Steps
      1. Rendi obbligatoria la prop e rimuovi i rami di creazione (titolo, bottone, action, hidden id condizionale).
      2. Estendi `Campo` con `soloLettura` e applicala al campo email con il nuovo hint.
      3. Verifica che il FormData inviato non contenga `email` (l'input non ha `name`).

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0 (in questo momento `aggiornaCollaboratore` valida ancora l'email lato server: il flusso end-to-end torna coerente con TASK-04, immediatamente successivo)
      - Run: `npx eslint "src/app/(back-office)/anagrafiche/collaboratori/collaboratore-form.tsx"`
      - Expect: nessun errore

      ## Done
      - [ ] AC-5 (lato client) — Il campo email è renderizzato `readOnly`, senza `name`, con hint che rimanda alla schermata utenti
      - [ ] AC-4 (lato client) — Nome, cognome, partita IVA e tariffa restano input modificabili e inviati
      - [ ] Il form non referenzia più `creaCollaboratore` né alcun ramo di creazione

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Elimina le action di censimento e cambio stato; l'aggiornamento non tocca più l'email
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
    body: |-
      ## Objective
      `actions.ts` espone solo `aggiornaCollaboratore`, che aggiorna profilo e nome utente senza mai scrivere `utente.email`; la validazione di dominio non contempla più l'email.

      ## Read
      - src/app/(back-office)/anagrafiche/collaboratori/actions.ts — `creaCollaboratore` (righe ~72-148), `cambiaStatoCollaboratore` (~229-252), helper `isPrismaUniqueConstraintError`/`erroreEmailDuplicata`, `datiDaForm`, corpo di `aggiornaCollaboratore` (`utente.update` con `email` a riga ~204-210, try/catch P2002)
      - src/domain/anagrafiche/valida-collaboratore.ts — `DatiCollaboratoreInput.email`, blocco email in `validaCollaboratore` (righe ~123-127), costante `RE_EMAIL`
      - src/domain/anagrafiche/valida-utente.ts — conferma che ha una propria `RE_EMAIL` e importa solo `validaCampoPartitaIva`/`validaCampoTariffaGiornaliera`: nessun impatto

      ## Change
      - src/app/(back-office)/anagrafiche/collaboratori/actions.ts — elimina `creaCollaboratore`, `cambiaStatoCollaboratore`, `isPrismaUniqueConstraintError`, `erroreEmailDuplicata` e l'import di `Prisma`; in `datiDaForm` rimuovi l'estrazione di `email`; in `aggiornaCollaboratore` il `tx.utente.update` scrive solo `{ nome: `${dati.nome} ${dati.cognome}` }` e il try/catch P2002 viene rimosso (nessun campo unico viene più scritto); aggiorna il commento JSDoc dell'action
      - src/domain/anagrafiche/valida-collaboratore.ts — rimuovi `email` da `DatiCollaboratoreInput`, il blocco di validazione email da `validaCollaboratore` e la costante `RE_EMAIL` ormai inutilizzata; non toccare `validaCampoPartitaIva`, `validaCampoTariffaGiornaliera`, `normalizzaTariffaGiornaliera` (riusati da `valida-utente.ts` e `utenti/actions.ts`)
      - Non toccare: `src/app/(back-office)/anagrafiche/utenti/**`, `src/lib/collaboratori.ts`

      ## Steps
      1. Rimuovi le due action e gli helper dedicati, sistemando gli import.
      2. Aggiorna `datiDaForm` e `aggiornaCollaboratore` (niente email, niente try/catch).
      3. Snellisci `valida-collaboratore.ts` come sopra.
      4. Verifica con grep l'assenza di riferimenti residui: `grep -rn "creaCollaboratore\|cambiaStatoCollaboratore" src/` deve restituire vuoto.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0
      - Run: `npx vitest run tests/unit/utenti-actions.test.ts tests/unit/valida-utente.test.ts`
      - Expect: tutti verdi (nessuna regressione sui riusi condivisi). Nota: `tests/unit/collaboratori-dal-actions.test.ts` e `tests/unit/valida-collaboratore.test.ts` a questo punto NON compilano più — è atteso e viene sanato da TASK-05, immediatamente successivo

      ## Done
      - [ ] AC-5 (lato server) — `aggiornaCollaboratore` non legge né scrive `utente.email` in alcun percorso
      - [ ] AC-4 (lato server) — L'aggiornamento di nome, cognome, partita IVA e tariffa resta transazionale e sincronizza `utente.nome`
      - [ ] `creaCollaboratore` e `cambiaStatoCollaboratore` non esistono più nel codebase

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Riscrivi i test unit di action e validazione collaboratore
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Le suite unit riflettono il nuovo contratto: niente censimento né cambio stato, aggiornamento senza email, validazione senza campo email.

      ## Read
      - tests/unit/collaboratori-dal-actions.test.ts — import (righe ~96-98), describe `creaCollaboratore` (~352-476), describe `aggiornaCollaboratore` (~478-541, incluso l'expect su `utente.update` con `email`), describe `cambiaStatoCollaboratore` (~543 ss.), guardie di ruolo (~584-616)
      - tests/unit/valida-collaboratore.test.ts — casi sul campo email
      - src/app/(back-office)/anagrafiche/collaboratori/actions.ts — contratto post TASK-04

