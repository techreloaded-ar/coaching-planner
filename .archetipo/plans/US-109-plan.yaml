  - id: TASK-08
    title: Gate finale — unit, tipi, lint, build ed e2e come in CI
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-03
      - TASK-04
      - TASK-05
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      Dimostrare che US-109 passa ogni step della CI (`.github/workflows/ci.yml`: lint, unit, build, e2e) e che tutti i task sono `DONE` prima di chiedere la review.

      ## Read
      - .github/workflows/ci.yml — ordine degli step
      - Piano, sezioni «Baseline» e «Mappa delle evidenze di accettazione»
      - tests/e2e/README.md — prerequisiti e regole e2e

      ## Change
      - Nessuna modifica al codice. Se un check fallisce, correggere nel task che ha introdotto il problema e ripetere il gate.

      ## Steps
      1. `grep -rnE 'richiediRuolo(Api)?\(' src --exclude-dir=generated` → vuoto (Demonstrates 1, AC-1).
      2. `npx tsc --noEmit -p tsconfig.json 2>&1 | grep "error TS" | grep -v "^\.next/"` → vuoto.
      3. `npm run lint` → exit 0 (include il guardrail e2e; nessuno spec e2e è stato toccato).
      4. `npm test` → tutti verdi, test ≥ 1193 + i nuovi.
      5. Prerequisiti: Postgres raggiungibile, `npx prisma migrate deploy && npx prisma db seed`, porta 3000 libera (altrimenti porta dedicata con `NEXT_PUBLIC_APP_URL` coerente).
      6. `npm run build` → exit 0.
      7. `npm run test:e2e` → verde. In particolare: `abilitazioni-collaboratore.spec.ts` (collaboratore riportato a `/attivita`), `esportazione-fatturazione.spec.ts` e `report-fatturazione-navigazione-mese.spec.ts` (403 per il collaboratore), e gli spec di back office per l'amministratore. Se un test fallisce, confrontarlo con la base usando `--repeat-each` prima di attribuirlo a US-109 (instabilità note preesistenti).
      8. Segnare questo task `DONE`, poi da `/Users/smarello/repo/coaching-planner` eseguire `archetipo spec show US-109` e verificare che nessun task sia `TODO`. Solo allora chiedere la review.

      ## Verify
      - Run: i comandi degli step 1-7 nell'ordine indicato, dalla radice del progetto.
      - Expect: grep e tsc vuoti; lint, unit, build ed e2e con exit 0.
      - Run: `archetipo spec show US-109`
      - Expect: tutti i task in `data.tasks` hanno `status: DONE`.

      ## Done
      - [ ] AC-1 — grep vuoto e tsc pulito
      - [ ] AC-2 — unit verdi, compreso il guardrail delle pagine
      - [ ] AC-3 — test della route dati e e2e di export/dati (403 per il collaboratore) verdi
      - [ ] AC-4 — e2e di back office per l'amministratore verdi senza modifiche
      - [ ] AC-5 — e2e su redirect a `/attivita` e 403 per il collaboratore verdi
      - [ ] AC-6 — nessuna guardia per ruolo nel DAL
      - [ ] AC-7 — `npm test` e `npm run test:e2e` verdi
      - [ ] Tutti i task risultano `DONE` in `archetipo spec show US-109` prima di `archetipo spec review`

      ## Blockers
      Per build ed e2e serve un Postgres migrato e seminato. Se manca, è un prerequisito d'ambiente da sistemare, non un guasto del codice.
    ref: TASK-08
