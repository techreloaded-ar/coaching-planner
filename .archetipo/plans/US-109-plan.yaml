schema: archetipo/plan/v2
spec_code: US-109
body: |-
  # US-109: Guardie del back office espresse per permesso anziché per ruolo — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-11-11

  ---

  ## Spec

  **Epic:** EP-001 — Autenticazione e Ruoli
  **Priorità:** HIGH | **Punti:** 5 | **Blocked by:** US-108 (DONE: catalogo `src/domain/permessi.ts`, `richiediPermesso`, `richiediPermessoApi`, `SessioneUtente.permessi`)

  **User Story**
  **Come** sviluppatore che mantiene l'autorizzazione **voglio** che ogni pagina, query e Server Action del back office dichiari il permesso specifico che richiede **così che** l'accesso a ciascuna funzionalità si possa concedere separatamente, senza più dipendere dal controllo «è amministratore».

  **Criteri di accettazione**
  - AC-1 — Nessuna pagina, query o Server Action applicativa richiama più le guardie per ruolo con `AMMINISTRATORE`: ognuna richiede un permesso del catalogo.
  - AC-2 — Ogni funzionalità richiede il permesso della propria area (offerte, abilitazioni e ingaggi, clienti, collaboratori e tariffe, utenti, voci di rimborso, righe sospese, importazione, un permesso per ciascuno dei tre report).
  - AC-3 — Esportazione Excel ed endpoint dati del report di fatturazione clienti richiedono lo stesso permesso della pagina del report.
  - AC-4 — Un amministratore accede a tutto il back office esattamente come prima.
  - AC-5 — Un collaboratore su una pagina del back office viene reindirizzato a `/attivita`; su un'API/action del back office riceve 403.
  - AC-6 — Le guardie per ruolo non più utilizzate vengono rimosse dal DAL.
  - AC-7 — Le suite unitarie ed e2e passano; i test sulle guardie per ruolo sono adattati alle guardie per permesso senza ridurre i casi coperti.

  ---

  ## Soluzione tecnica

  Sostituzione meccanica, area per area, di `richiediRuolo("AMMINISTRATORE")` → `richiediPermesso(<permesso>)` (pagine RSC) e di `richiediRuoloApi("AMMINISTRATORE")` → `richiediPermessoApi(<permesso>)` (query del DAL in `src/lib`, Server Action, route handler). Alla fine `richiediRuolo` e `richiediRuoloApi` vengono cancellati da `src/lib/dal.ts`: da quel momento è il compilatore a garantire AC-1.

  **Mappa area → permesso** (vale per pagine, action e query dell'area):

  | Area / percorso sotto `src/app/(back-office)/` | Permesso |
  |---|---|
  | `anagrafiche/page.tsx` (redirect a clienti), `anagrafiche/clienti/**` esclusa la sotto-area offerte | `GESTIRE_CLIENTI` |
  | `anagrafiche/clienti/[id]/offerte/**`, `offerte/**` esclusa la sotto-area collaboratori, `report/avanzamento-offerte/page.tsx` | `GESTIRE_OFFERTE` |
  | `offerte/[offertaId]/collaboratori/**`, `anagrafiche/collaboratori/[id]/abilitazioni-actions.ts`, `src/lib/abilitazioni.ts`, `src/lib/actions/abilitazioni-offerte.ts` | `GESTIRE_ABILITAZIONI` |
  | `anagrafiche/collaboratori/**` (tranne abilitazioni-actions), `src/lib/collaboratori.ts` | `GESTIRE_COLLABORATORI` |
  | `anagrafiche/persone/**`, `anagrafiche/utenti/**`, `src/lib/utenti.ts` | `GESTIRE_UTENTI` |
  | `anagrafiche/voci-rimborso/**`, `src/lib/voci-rimborso.ts` | `GESTIRE_VOCI_RIMBORSO` |
  | `righe-sospese/**`, `src/lib/righe-sospese.ts` | `GESTIRE_RIGHE_SOSPESE` |
  | `importazione/**` | `GESTIRE_IMPORTAZIONE` |
  | `report/fatturazione-clienti/**` (pagina, `dati/route.ts`; `esporta/route.ts` tramite la query), `reportFatturazioneClientiMese` | `CONSULTARE_REPORT_FATTURAZIONE_CLIENTI` |
  | `report/fatturazione-collaboratori/**` (pagina e action promemoria), `reportFatturazioneCollaboratoriMese` | `CONSULTARE_REPORT_FATTURAZIONE_COLLABORATORI` |
  | `report/marginalita/**`, `reportMarginalitaPeriodo` | `CONSULTARE_REPORT_MARGINALITA` |

  **Query condivise tra aree.** Tre query del DAL servono pagine di aree diverse; per non legare un'area al permesso di un'altra, dichiarano l'elenco delle aree che le consumano tramite una nuova guardia `richiediAlmenoUnPermessoApi(permessiAmmessi)` (401 senza sessione, 403 se l'utente non ne ha nessuno):
  - `clientePerId` → `["GESTIRE_CLIENTI", "GESTIRE_OFFERTE", "CONSULTARE_REPORT_MARGINALITA"]` (dettaglio cliente, offerte del cliente, dettaglio marginalità);
  - `elencaClientiSelezionabili` e `elencaOffertePerClienteConAvanzamento` → `["GESTIRE_CLIENTI", "GESTIRE_OFFERTE"]`;
  - `offertaPerId` → `["GESTIRE_OFFERTE", "GESTIRE_ABILITAZIONI"]` (dettaglio offerta e pagina ingaggi).

  Le altre query hanno un solo consumatore o appartengono alla sola area che le usa e richiedono il permesso singolo.

  **Layout del back office (decisione dell'utente, 2026-11-11).** `src/app/(back-office)/layout.tsx` passa a `verificaSessione()`: solo autenticazione. L'autorizzazione è responsabilità della guardia per permesso di ciascuna pagina, e un test-guardrail (TASK-06) fa fallire la suite se una `page.tsx` del back office non chiama `richiediPermesso` con il permesso della propria area. Il proxy continua a respingere in modo ottimistico i non amministratori in base al cookie (`src/lib/policy-rotte.ts`, invariato). La guardia d'ingresso «almeno un permesso di back office» arriverà con US-110. Per questo `report/avanzamento-offerte/page.tsx`, oggi un semplice redirect senza guardia, riceve `richiediPermesso("GESTIRE_OFFERTE")`.

  **Fuori perimetro (da non toccare):** i controlli `ruolo === "AMMINISTRATORE"` in `src/lib/foglio-attivita.ts`, in `verificaAccessoDatiCollaboratore` (`src/lib/dal.ts`), in `src/app/struttura-applicazione.tsx` e nei layout/pagine del front office (US-110); la protezione dell'ultimo amministratore e il form persone/utenti (restano basati sul ruolo); `policy-rotte.ts`/proxy; l'importer legacy.

  **Limite noto, accettato:** `anagrafiche/persone/[id]/page.tsx` (`GESTIRE_UTENTI`) legge anche tariffe (`GESTIRE_COLLABORATORI`) e abilitazioni (`GESTIRE_ABILITAZIONI`). Per l'amministratore il comportamento non cambia; un futuro ruolo parziale con il solo `GESTIRE_UTENTI` riceverebbe 403 sulle sezioni del collaboratore. Oggi non esistono ruoli parziali (fuori scope), quindi niente rendering condizionale per ora.

  ### Decisioni architetturali

  Nessuna ADR. La guardia «almeno uno dei permessi» estende in modo additivo le guardie di US-108 seguendo lo stesso pattern (`ErroreAutorizzazione`), e la scelta del layout è stata presa dall'utente come transizione verso US-110. La Wiki è disattivata (`wiki.enabled: false`).

  ---

  ## Baseline

  Misurata il 2026-11-11 dalla radice del progetto, con le modifiche di US-108 nel working tree.

  | Check | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm test` | 84 file, 1193 test passati | Dopo ogni task: tutti passati (più i nuovi test) |
  | `npx tsc --noEmit -p tsconfig.json 2>&1 \| grep "error TS" \| grep -v "^\.next/"` | output vuoto (zero errori in `src/` e `tests/`; eventuali errori stale in `.next/types` sono esclusi) | Deve restare vuoto |
  | `npx eslint src/lib "src/app/(back-office)" tests/unit` | exit 0 | Deve restare exit 0 |
  | `npm run lint` | da eseguire nel gate (include il guardrail e2e) | Nessun file e2e viene toccato: deve passare |
  | `npm run build` / `npm run test:e2e` | non eseguiti in planning (servono Postgres migrato e seminato e la porta 3000 libera) | Eseguiti nel gate finale come in CI |

  **Prerequisiti d'ambiente (non sono guasti del codice):** `npm ci` (il `postinstall` genera il client Prisma). Per build ed e2e serve un Postgres raggiungibile con `npx prisma migrate deploy && npx prisma db seed`. Per l'e2e serve la porta 3000 libera: se è occupata dal `next dev` del checkout principale, usare una porta dedicata con `NEXT_PUBLIC_APP_URL` coerente.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task |
  |---|---|---|---|---|
  | AC-1 | Sorgente dopo la rimozione delle guardie per ruolo | Compilatore + ricerca + unit guardrail | `tsc` senza errori in `src/`/`tests/` con `richiediRuolo`/`richiediRuoloApi` non più esportati; `grep -rnE 'richiediRuolo(Api)?\(' src --exclude-dir=generated` vuoto; il guardrail delle pagine passa | TASK-06, TASK-07, TASK-08 |
  | AC-2 | `@/lib/dal` mockato nei test unitari esistenti delle query/action; file `page.tsx` reali | Unit | Ogni test di query/action verifica `toHaveBeenCalledWith("<permesso dell'area>")` (o l'elenco per le query condivise); il guardrail verifica che ogni `page.tsx` contenga `richiediPermesso("<permesso atteso>")` secondo la mappa area → permesso | TASK-02, TASK-03, TASK-04, TASK-05, TASK-06 |
  | AC-3 | Route `dati` ed `esporta` con `@/lib/dal` mockato; query reale del report | Unit + e2e esistente | `report-fatturazione-dati-route.test.ts` verifica la chiamata con `CONSULTARE_REPORT_FATTURAZIONE_CLIENTI`; `reportFatturazioneClientiMese` (usata da `esporta`) la richiede; e2e esistenti: status 403 per il collaboratore su entrambe le rotte | TASK-05, TASK-08 |
  | AC-4 | Seed: amministratore con tutti i permessi | E2E esistente | La suite e2e di back office (anagrafiche, offerte, report, righe sospese, importazione, esportazione) passa invariata | TASK-08 |
  | AC-5 | Seed: collaboratore senza permessi | Unit + e2e esistente | `richiediPermesso` → redirect a `/attivita` e `richiediPermessoApi`/`richiediAlmenoUnPermessoApi` → `ErroreAutorizzazione(403)` (unit DAL); e2e `abilitazioni-collaboratore.spec.ts` (`toHaveURL(/\/attivita$/)`), `esportazione-fatturazione.spec.ts` e `report-fatturazione-navigazione-mese.spec.ts` (403) | TASK-01, TASK-07, TASK-08 |
  | AC-6 | `src/lib/dal.ts` | Compilatore + ricerca | `grep -nE "export (const\|async function) richiediRuolo" src/lib/dal.ts` vuoto | TASK-07 |
  | AC-7 | Suite esistenti | Unit + e2e | `npm test` verde con lo stesso numero di casi o più; i casi su `richiediRuoloApi` in `dal-guards.test.ts` sono convertiti uno a uno in casi su `richiediPermessoApi`; `npm run test:e2e` verde | TASK-07, TASK-08 |

  ---

  ## Strategia di test

  Il comportamento per i due ruoli esistenti non cambia. La strategia quindi: (1) adatta i test unitari che mockano `@/lib/dal`, così che ognuno affermi il permesso **specifico** dell'area, con il massimo dettaglio per AC-2; (2) aggiunge un guardrail statico che collega ogni pagina del back office al suo permesso, indispensabile ora che il layout verifica solo la sessione; (3) usa la suite e2e esistente come regressione per amministratore e collaboratore.

  - I mock di `@/lib/dal` cambiano solo la chiave (`richiediRuoloApi` → `richiediPermessoApi` / `richiediAlmenoUnPermessoApi`) e l'argomento atteso. I casi «propaga l'errore della guardia senza toccare il database» restano tutti.
  - Nei test di utenti e persone (`utenti-actions`, `cambia-stato-utente`) le stringhe `"AMMINISTRATORE"` che descrivono il **ruolo dei dati** (protezione dell'ultimo amministratore) non si toccano: si aggiornano solo le asserzioni sulla guardia.
  - La nuova guardia `richiediAlmenoUnPermessoApi` ha test unitari dedicati sul DAL reale (solo db e cookie mockati).

  ### Test E2E — simulazione utente

  **Framework:** Playwright (esistente, `tests/e2e`). Nessuno scenario nuovo: le guardie cambiano forma, non comportamento, e i flussi di AC-4/AC-5 sono già coperti dagli spec esistenti, che vanno eseguiti invariati.
  **Video demo:** filmabile solo il punto 4 di Demonstrates (navigazione dell'amministratore e redirect del collaboratore da `/anagrafiche/clienti`); i punti 1-3 si dimostrano da codice e terminale. La decisione spetta a `archetipo-review`.

  | Scenario | Flusso utente |
  |---|---|
  | Amministratore nel back office | Spec e2e esistenti su anagrafiche, offerte, report, righe sospese, importazione: tutte le pagine si aprono come prima |
  | Collaboratore respinto | `abilitazioni-collaboratore.spec.ts` (redirect a `/attivita`), `esportazione-fatturazione.spec.ts` e `report-fatturazione-navigazione-mese.spec.ts` (403) |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: []
    update: []
    create: []
  ```

  Wiki disattivata nel config (`wiki.enabled: false`).

  _Piano generato con ARchetipo Planning — 2026-11-11_
tasks:
  - id: TASK-01
    title: Guardia richiediAlmenoUnPermessoApi nel DAL per le query condivise tra aree
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il DAL espone `richiediAlmenoUnPermessoApi(permessiAmmessi)`: 401 senza sessione, 403 se l'utente non possiede nessuno dei permessi indicati, altrimenti restituisce la sessione.

      ## Read
      - src/lib/dal.ts — `richiediSessioneApi`, `richiediPermessoApi`, `ErroreAutorizzazione` (aggiunti da US-108)
      - tests/unit/dal-permessi.test.ts — setup dei mock (db, cookie, next/navigation) e `describe("richiediPermessoApi")`
      - src/domain/permessi.ts — tipo `Permesso`

      ## Change
      - src/lib/dal.ts — aggiungere subito dopo `richiediPermessoApi` la funzione esportata `richiediAlmenoUnPermessoApi(permessiAmmessi: readonly Permesso[]): Promise<SessioneUtente>`, con JSDoc di una riga o due nello stile esistente. Non toccare le altre guardie.
      - tests/unit/dal-permessi.test.ts — nuovo `describe("richiediAlmenoUnPermessoApi")`.
      - Non-goal: nessuna variante RSC «almeno uno» (arriverà con US-110 se servirà); nessuna modifica a `richiediRuolo`/`richiediRuoloApi` in questo task.

      ## Steps
      1. Implementare: `const sessione = await richiediSessioneApi(); if (!permessiAmmessi.some((p) => sessione.permessi.includes(p))) throw new ErroreAutorizzazione(403, \`Permesso richiesto: uno tra ${permessiAmmessi.join(", ")}\`); return sessione;`.
      2. Aggiungere i test riusando gli helper/mock già presenti nel file: (a) senza sessione → rejects `{ statusCode: 401 }`; (b) utente COLLABORATORE a DB (permessi vuoti) con `["GESTIRE_CLIENTI", "GESTIRE_OFFERTE"]` → rejects `{ statusCode: 403 }`; (c) AMMINISTRATORE a DB → resolves con la sessione che contiene `permessi` e `utenteId` attesi.

      ## Verify
      - Run: `npx vitest run tests/unit/dal-permessi.test.ts tests/unit/dal-guards.test.ts`
      - Expect: tutti verdi, compresi i 3 nuovi casi.
      - Run: `npx eslint src/lib/dal.ts tests/unit/dal-permessi.test.ts`
      - Expect: exit 0.

      ## Done
      - [ ] AC-5 — `richiediAlmenoUnPermessoApi` lancia 403 a un collaboratore e 401 senza sessione (test b e a)
      - [ ] AC-4 — l'amministratore ottiene la sessione (test c)

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Aree clienti e offerte — guardie per permesso su pagine, action e query
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Pagine, Server Action e query delle aree clienti e offerte richiedono `GESTIRE_CLIENTI` / `GESTIRE_OFFERTE` (o l'elenco condiviso), e i loro test unitari affermano il permesso specifico.

      ## Read
      - src/lib/clienti.ts — `elencaClientiPaginati`, `clientePerId`, `elencaClientiSelezionabili`
      - src/lib/offerte.ts — `offertaPerId`, `elencaOfferteConAvanzamentoPaginate`, `elencaOffertePerClienteConAvanzamento`, più il commento JSDoc alla riga ~297 che cita `richiediRuoloApi("AMMINISTRATORE")`
      - Piano, sezione «Mappa area → permesso» e «Query condivise tra aree»
      - tests/unit/clienti-dal-actions.test.ts, tests/unit/offerte-dal-actions.test.ts, tests/unit/elenca-offerte-con-avanzamento.test.ts, tests/unit/gestione-offerte-actions.test.ts — mock di `@/lib/dal` e asserzioni sulla guardia

      ## Change
      - src/lib/clienti.ts — `elencaClientiPaginati` → `richiediPermessoApi("GESTIRE_CLIENTI")`; `clientePerId` → `richiediAlmenoUnPermessoApi(["GESTIRE_CLIENTI", "GESTIRE_OFFERTE", "CONSULTARE_REPORT_MARGINALITA"])`; `elencaClientiSelezionabili` → `richiediAlmenoUnPermessoApi(["GESTIRE_CLIENTI", "GESTIRE_OFFERTE"])`. Aggiornare l'import e i commenti «Accesso riservato all'amministratore» indicando il permesso.
      - src/lib/offerte.ts — `offertaPerId` → `richiediAlmenoUnPermessoApi(["GESTIRE_OFFERTE", "GESTIRE_ABILITAZIONI"])`; `elencaOfferteConAvanzamentoPaginate` → `richiediPermessoApi("GESTIRE_OFFERTE")`; `elencaOffertePerClienteConAvanzamento` → `richiediAlmenoUnPermessoApi(["GESTIRE_CLIENTI", "GESTIRE_OFFERTE"])`; aggiornare i commenti JSDoc che citano la guardia per ruolo.
      - `src/app/(back-office)/anagrafiche/page.tsx`, `anagrafiche/clienti/page.tsx`, `anagrafiche/clienti/nuovo/page.tsx`, `anagrafiche/clienti/[id]/page.tsx`, `anagrafiche/clienti/[id]/modifica/page.tsx` → `richiediPermesso("GESTIRE_CLIENTI")`.
      - `anagrafiche/clienti/actions.ts` → `richiediPermessoApi("GESTIRE_CLIENTI")`.
      - `anagrafiche/clienti/[id]/offerte/[offertaId]/page.tsx`, `anagrafiche/clienti/[id]/offerte/nuova/page.tsx`, `offerte/page.tsx`, `offerte/nuova/page.tsx`, `offerte/[offertaId]/page.tsx` → `richiediPermesso("GESTIRE_OFFERTE")`.
      - `anagrafiche/clienti/[id]/offerte/actions.ts`, `offerte/actions.ts` → `richiediPermessoApi("GESTIRE_OFFERTE")`.
      - `report/avanzamento-offerte/page.tsx` → diventa `async` e chiama `await richiediPermesso("GESTIRE_OFFERTE")` prima del redirect a `/offerte`.
      - I 4 file di test elencati in Read: rinominare la chiave del mock (`richiediRuoloApi` → `richiediPermessoApi`, aggiungendo `richiediAlmenoUnPermessoApi` dove il modulo testato lo usa) e sostituire le asserzioni `toHaveBeenCalledWith("AMMINISTRATORE")` con il permesso o l'elenco atteso. Rinominare variabili e titoli dei test (`mockRichiediRuoloApi` → `mockRichiediPermessoApi`, «propaga l'errore di richiediRuoloApi» → «… di richiediPermessoApi»).
      - Non-goal: non toccare `offerte/[offertaId]/collaboratori/**` (TASK-03); non cambiare logica di dominio né query Prisma.

      ## Steps
      1. Modificare `src/lib/clienti.ts` e `src/lib/offerte.ts` (import da `@/lib/dal`: `richiediPermessoApi`, `richiediAlmenoUnPermessoApi`).
      2. Modificare pagine e action elencate (import `richiediPermesso` / `richiediPermessoApi` al posto delle guardie per ruolo).
      3. Adattare i 4 file di test senza eliminare nessun caso; ogni caso che prima verificava la guardia ora verifica il permesso specifico.
      4. Controllare che in queste aree non resti nulla: `grep -rnE 'richiediRuolo(Api)?\(' src/lib/clienti.ts src/lib/offerte.ts "src/app/(back-office)/anagrafiche/clienti" "src/app/(back-office)/anagrafiche/page.tsx" "src/app/(back-office)/offerte/actions.ts" "src/app/(back-office)/offerte/page.tsx" "src/app/(back-office)/offerte/nuova" "src/app/(back-office)/offerte/[offertaId]/page.tsx"` deve essere vuoto.

      ## Verify
      - Run: `npx vitest run tests/unit/clienti-dal-actions.test.ts tests/unit/offerte-dal-actions.test.ts tests/unit/elenca-offerte-con-avanzamento.test.ts tests/unit/gestione-offerte-actions.test.ts`
      - Expect: tutti verdi, con lo stesso numero di casi di prima.
      - Run: `npm test` e `npx tsc --noEmit -p tsconfig.json 2>&1 | grep "error TS" | grep -v "^\.next/"`
      - Expect: suite verde; output tsc vuoto.

      ## Done
      - [ ] AC-2 — query, action e pagine di clienti e offerte richiedono `GESTIRE_CLIENTI`/`GESTIRE_OFFERTE`; i test affermano l'argomento esatto
      - [ ] AC-1 — nessuna guardia per ruolo rimasta nei file del task
      - [ ] AC-7 — nessun caso di test rimosso

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Area abilitazioni e ingaggi — guardie GESTIRE_ABILITAZIONI
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Query, action e pagina di abilitazioni e ingaggi richiedono `GESTIRE_ABILITAZIONI`, e i test unitari lo affermano.

      ## Read
      - src/lib/abilitazioni.ts — `elencaOfferteAbilitate`, `elencaOfferteAbilitabili`, `elencaCollaboratoriIngaggiati`, `elencaCollaboratoriIngaggiabili`
      - src/lib/actions/abilitazioni-offerte.ts — `abilitaCollaboratoreSuOfferta`
      - `src/app/(back-office)/anagrafiche/collaboratori/[id]/abilitazioni-actions.ts`, `src/app/(back-office)/offerte/[offertaId]/collaboratori/ingaggi-actions.ts`, `src/app/(back-office)/offerte/[offertaId]/collaboratori/page.tsx`
      - tests/unit/abilita-collaboratore-su-offerta-action.test.ts, tests/unit/abilitazioni-dal-actions.test.ts, tests/unit/ingaggi-offerta-dal-actions.test.ts

      ## Change
      - Le 4 query di `src/lib/abilitazioni.ts`, `src/lib/actions/abilitazioni-offerte.ts`, le 2 chiamate di `abilitazioni-actions.ts` e le 2 di `ingaggi-actions.ts` → `richiediPermessoApi("GESTIRE_ABILITAZIONI")`.
      - `offerte/[offertaId]/collaboratori/page.tsx` → `richiediPermesso("GESTIRE_ABILITAZIONI")` (la pagina chiama anche `offertaPerId`, che da TASK-02 accetta `GESTIRE_ABILITAZIONI`).
      - I 3 file di test: chiave del mock `richiediRuoloApi` → `richiediPermessoApi`, asserzioni `"AMMINISTRATORE"` → `"GESTIRE_ABILITAZIONI"`, messaggi di errore simulati e titoli dei casi aggiornati («non abilita se il chiamante non ha il permesso»). Nessun caso rimosso.
      - Non-goal: nessuna modifica alla logica di abilitazione o ingaggio.

      ## Steps
      1. Sostituire import e chiamate nei 6 file sorgente.
      2. Adattare i 3 file di test.
      3. `grep -rnE 'richiediRuolo(Api)?\(' src/lib/abilitazioni.ts src/lib/actions "src/app/(back-office)/anagrafiche/collaboratori/[id]/abilitazioni-actions.ts" "src/app/(back-office)/offerte/[offertaId]/collaboratori"` deve essere vuoto.

      ## Verify
      - Run: `npx vitest run tests/unit/abilita-collaboratore-su-offerta-action.test.ts tests/unit/abilitazioni-dal-actions.test.ts tests/unit/ingaggi-offerta-dal-actions.test.ts`
      - Expect: tutti verdi, stesso numero di casi.
      - Run: `npm test`
      - Expect: suite verde.

      ## Done
      - [ ] AC-2 — abilitazioni e ingaggi richiedono `GESTIRE_ABILITAZIONI` (i test affermano `toHaveBeenCalledWith("GESTIRE_ABILITAZIONI")`)
      - [ ] AC-1 — nessuna guardia per ruolo nei file del task
