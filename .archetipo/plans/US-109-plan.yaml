    body: |-
      ## Objective
      Il layout del back office verifica solo la sessione, `richiediRuolo` e `richiediRuoloApi` non esistono più nel DAL, e i casi che le testavano sono convertiti uno a uno in casi su `richiediPermessoApi`.

      ## Read
      - `src/app/(back-office)/layout.tsx` — usa `richiediRuolo("AMMINISTRATORE")` e passa la sessione a `StrutturaApplicazione`
      - src/lib/dal.ts — `richiediRuolo` (r.~113), `richiediRuoloApi` (r.~194), JSDoc di `ErroreAutorizzazione`, import di `Ruolo` (ancora usato da `SessioneUtente`)
      - tests/unit/dal-guards.test.ts — `describe("richiediRuoloApi")` (r.~252-293: «lancia 403 se il collaboratore prova ad accedere a un'area admin», «restituisce la sessione se il ruolo corrisponde») e l'import di `richiediRuoloApi`
      - tests/unit/permessi-pagine-back-office.test.ts (TASK-06)

      ## Change
      - `src/app/(back-office)/layout.tsx` — `const sessione = await verificaSessione();` al posto di `richiediRuolo("AMMINISTRATORE")`, con un commento di una riga: l'autorizzazione è delle singole pagine (guardia per permesso); la guardia d'ingresso arriverà con US-110. Rendering invariato.
      - src/lib/dal.ts — cancellare `richiediRuolo` e `richiediRuoloApi` con i loro JSDoc. Aggiornare il JSDoc di `ErroreAutorizzazione` («non ha il permesso richiesto (403)»). Togliere `import type { Ruolo }` solo se non resta nessun uso (resta in `SessioneUtente.ruolo`, quindi probabilmente rimane).
      - tests/unit/dal-guards.test.ts — sostituire il `describe("richiediRuoloApi")` con `describe("richiediPermessoApi")`, mantenendo i due casi con lo stesso setup: il collaboratore → rejects `{ statusCode: 403 }` su `richiediPermessoApi("GESTIRE_CLIENTI")`; l'amministratore → resolves con la sessione. Aggiornare l'import e il commento del mock di `next/navigation` (r.~40).
      - tests/unit/permessi-pagine-back-office.test.ts — aggiungere un caso: `layout.tsx` contiene `verificaSessione()` e non contiene `richiediRuolo`.
      - Non-goal: non toccare `verificaAccessoDatiCollaboratore`, `foglio-attivita.ts`, `struttura-applicazione.tsx`, `policy-rotte.ts`/proxy (US-110 o invariati).

      ## Steps
      1. Aggiornare il layout.
      2. Cancellare le due guardie dal DAL e sistemare i JSDoc.
      3. Convertire il `describe` in `dal-guards.test.ts` e aggiungere il caso del layout al guardrail.
      4. `grep -rnE 'richiediRuolo(Api)?\b' src tests --exclude-dir=generated` deve essere vuoto: anche commenti e mock residui vanno aggiornati, compresi i commenti in `src/lib/offerte.ts`, `src/lib/report.ts` e nelle route del report già toccati in TASK-02 e TASK-05.

      ## Verify
      - Run: `npx tsc --noEmit -p tsconfig.json 2>&1 | grep "error TS" | grep -v "^\.next/"`
      - Expect: output vuoto (nessun consumer residuo delle guardie rimosse).
      - Run: `npx vitest run tests/unit/dal-guards.test.ts tests/unit/dal-permessi.test.ts tests/unit/permessi-pagine-back-office.test.ts`
      - Expect: verdi; `dal-guards` ha lo stesso numero di casi di prima.
      - Run: `npm test`
      - Expect: suite verde, con un numero di test ≥ 1193 più i nuovi.

      ## Done
      - [ ] AC-6 — `grep -nE "richiediRuolo" src/lib/dal.ts` vuoto
      - [ ] AC-1 — `grep -rnE 'richiediRuolo(Api)?\(' src --exclude-dir=generated` vuoto; tsc pulito
      - [ ] AC-5 — layout con sola sessione: le pagine continuano a reindirizzare il collaboratore tramite `richiediPermesso` (guardrail verde)
      - [ ] AC-7 — i casi su `richiediRuoloApi` sono convertiti uno a uno, nessuno rimosso

      ## Blockers
      None.
