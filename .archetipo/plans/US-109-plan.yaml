  - id: TASK-06
    title: Guardrail unitario — ogni pagina del back office richiede il permesso della propria area
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective
      Un test unitario fallisce se una `page.tsx` sotto `src/app/(back-office)` non chiama `richiediPermesso("<permesso atteso>")` secondo la mappa area → permesso. È la rete di sicurezza necessaria ora che il layout verifica solo la sessione.

      ## Read
      - Piano, sezione «Mappa area → permesso»
      - `find "src/app/(back-office)" -name page.tsx` — 31 pagine attese
      - src/domain/permessi.ts — tipo `Permesso`
      - vitest.config.* — conferma che `tests/unit/**` gira in ambiente node

      ## Change
      - tests/unit/permessi-pagine-back-office.test.ts — nuovo file. Nessuna modifica ai sorgenti.

      ## Steps
      1. Elencare i file con `fs.readdirSync(radice, { recursive: true })` (radice = `path.join(process.cwd(), "src/app/(back-office)")`), tenendo solo quelli che finiscono con `page.tsx` e normalizzando i separatori in `/`.
      2. Definire `const PERMESSO_PER_PREFISSO: ReadonlyArray<readonly [string, Permesso]>`, ordinato dal prefisso più specifico: `["anagrafiche/clienti/[id]/offerte/", "GESTIRE_OFFERTE"]`, `["anagrafiche/clienti/", "GESTIRE_CLIENTI"]`, `["anagrafiche/collaboratori/", "GESTIRE_COLLABORATORI"]`, `["anagrafiche/persone/", "GESTIRE_UTENTI"]`, `["anagrafiche/utenti/", "GESTIRE_UTENTI"]`, `["anagrafiche/voci-rimborso/", "GESTIRE_VOCI_RIMBORSO"]`, `["anagrafiche/page.tsx", "GESTIRE_CLIENTI"]`, `["offerte/[offertaId]/collaboratori/", "GESTIRE_ABILITAZIONI"]`, `["offerte/", "GESTIRE_OFFERTE"]`, `["report/avanzamento-offerte/", "GESTIRE_OFFERTE"]`, `["report/fatturazione-clienti/", "CONSULTARE_REPORT_FATTURAZIONE_CLIENTI"]`, `["report/fatturazione-collaboratori/", "CONSULTARE_REPORT_FATTURAZIONE_COLLABORATORI"]`, `["report/marginalita/", "CONSULTARE_REPORT_MARGINALITA"]`, `["righe-sospese/", "GESTIRE_RIGHE_SOSPESE"]`, `["importazione/", "GESTIRE_IMPORTAZIONE"]`.
      3. `it.each(pagine)`: trovare il primo prefisso che corrisponde (`startsWith`); se nessuno corrisponde il test fallisce con «pagina senza area: <percorso>», così una pagina nuova obbliga ad aggiornare la mappa. Leggere il sorgente e verificare `toContain(\`richiediPermesso("${permessoAtteso}")\`)`.
      4. Un caso aggiuntivo verifica che l'elenco non sia vuoto (`pagine.length` ≥ 31), così un percorso di radice sbagliato non fa passare il test a vuoto.

      ## Verify
      - Run: `npx vitest run tests/unit/permessi-pagine-back-office.test.ts`
      - Expect: verde. Prova di non-tautologia: cambiare temporaneamente il permesso atteso di una voce della mappa deve far fallire il caso della pagina corrispondente; poi ripristinare.
      - Run: `npx eslint tests/unit/permessi-pagine-back-office.test.ts`
      - Expect: exit 0.

      ## Done
      - [ ] AC-2 — le 31 pagine del back office sono collegate ciascuna al permesso della propria area, verificato dal test
      - [ ] AC-1 — nessuna pagina senza guardia per permesso (il test fallisce per una pagina non mappata o senza la chiamata)

      ## Blockers
      None.
    ref: TASK-06
