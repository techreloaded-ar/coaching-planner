  - id: TASK-05
    title: Test e2e Playwright del report marginalità e coerenza con la fatturazione
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Un test e2e deterministico prova il flusso reale dell'amministratore: sidebar → selezione periodo → valori per cliente e offerta, badge del margine negativo e coerenza dei ricavi con il report "Fatturazione clienti".

      ## Read
      - `tests/e2e/README.md` — contratto e2e (factory, mesi riservati, selettori)
      - `tests/e2e/support/fixtures.ts` — `test`, `expect`, fixture `factory`
      - `tests/e2e/support/factory.ts` — `createCliente`, `createOfferta({ cliente, codice, descrizione, tariffaGiornaliera })`, `createCollaboratore({ nome, cognome, tariffaGiornaliera, utenteOptions })`, `createRigaAttivita({ collaboratore, cliente, offerta, data, ore, fatturabile })`
      - `tests/e2e/support/date.ts` — `mesePassatoRiservato`, `dataNelMesePassatoRiservato`
      - `tests/e2e/support/report-data.ts` — come costruire `Date` da `dataNelMesePassatoRiservato` e suffissi univoci
      - `tests/e2e/report-fatturazione-clienti.spec.ts` — `verificaDatasetReport` (asserzioni su `report-client-{id}-totale`, formattatori `Intl`)
      - `tests/e2e/support/auth.ts` — `accediComeAdmin`

      ## Change
      - `tests/e2e/report-marginalita.spec.ts` — nuovo file. Nessuna modifica a `date.ts` (nessuno slot esclusivo: le asserzioni sono confinate al cliente creato dal test).
      - Non-goal: modificare entità di seed, aggiungere spec `demo__` (il video lo registra `archetipo-review`).

      ## Steps
      1. Costante `const CODICE_SPEC_MARGINALITA = "US-017-REPORT-MARGINALITA";` passata **come letterale** alle chiamate di `date.ts` (il guardrail di lint deve poterla risolvere staticamente). `meseUno = mesePassatoRiservato(CODICE_SPEC_MARGINALITA, 2)`, `meseDue = mesePassatoRiservato(CODICE_SPEC_MARGINALITA, 1)` (mesi contigui, `meseUno` precede `meseDue`).
      2. Dataset con la fixture `factory`: cliente `E2E Marginalità {suffisso}` (suffisso da `factory.namespace`); offerta A `MRG-A-{suffisso}` tariffa `"600.00"`; offerta B `MRG-B-{suffisso}` tariffa `"300.00"`; un collaboratore con tariffa `"400.00"`. Righe: meseUno giorno 5 → A 8 ore fatturabile; meseDue giorno 6 → A 4 ore fatturabile; meseDue giorno 7 → B 8 ore fatturabile; meseDue giorno 8 → A 6 ore **non** fatturabile. Date costruite come `new Date(`${dataNelMesePassatoRiservato(CODICE_SPEC_MARGINALITA, giorno, mesiIndietro)}T00:00:00.000Z`)`.
      3. Formattatore euro locale `Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" })` come nello spec fatturazione.
      4. Test "periodo di due mesi" (AC-1, AC-2, AC-4): `accediComeAdmin(page)`; `page.goto("/report/fatturazione-clienti")`; click `getByRole("link", { name: "Marginalità", exact: true })`; `waitForURL("**/report/marginalita")`; `getByLabel("Dal mese").fill(meseUno)`; `getByLabel("Al mese").fill(meseDue)`; click `getByRole("button", { name: "Applica", exact: true })`; `waitForURL` con `da=${meseUno}` e `a=${meseDue}`. Poi:
         - card `getByTestId(`marginalita-cliente-${cliente.id}`)` contiene `1.200,00 €`, `1.000,00 €`, `200,00 €` (via formattatore) e **non** contiene "Margine negativo" a livello card: verificare con `cardCliente.getByText("Margine negativo")` che il conteggio sia 1 (solo la riga B dentro la card);
         - riga `getByTestId(`marginalita-offerta-${offertaA.id}`)` contiene `900,00 €`, `600,00 €`, `300,00 €` e `toHaveCount(0)` per `getByText("Margine negativo")`;
         - riga `getByTestId(`marginalita-offerta-${offertaB.id}`)` contiene `300,00 €`, `400,00 €`, `-100,00 €` (usare il formattatore su `-100`) e `getByText("Margine negativo")` visibile.
      5. Test "coerenza con il report fatturazione" (AC-3), dataset creato nel proprio test con lo stesso helper: `page.goto(`/report/marginalita?da=${meseDue}&a=${meseDue}`)` → card cliente contiene `600,00 €` come ricavi; `page.goto(`/report/fatturazione-clienti?mese=${meseDue}`)` → `getByTestId(`report-client-${cliente.id}-totale`)` ha testo `600,00 €` (dataset senza rimborsi, quindi totale = imponibile manodopera), seguendo lo stesso pattern di `verificaDatasetReport` (se lì il pannello del cliente va espanso prima, espanderlo allo stesso modo).
      6. Nessun `waitForTimeout`, nessun selettore di classi Tailwind, nessun `selectOption({ index })`.

      ## Verify
      - Run: `npx playwright test tests/e2e/report-marginalita.spec.ts`
      - Expect: 2 test passati (prerequisito: Postgres e2e e variabili come in `.github/workflows/ci.yml`).
      - Run: `npx playwright test tests/e2e/report-marginalita.spec.ts --repeat-each=3`
      - Expect: tutti passati (nessuna dipendenza dall'ordine o da dati condivisi).
      - Run: `npm run lint`
      - Expect: exit 0, "Guardrail e2e anti-flakiness passed" senza nuovi warning oltre ai 4 preesistenti.

      ## Done
      - [ ] AC-1 — dopo "Applica" la card del cliente mostra ricavi 1.200,00 €, costi 1.000,00 €, margine 200,00 € sul periodo di due mesi
      - [ ] AC-2 — le righe offerta A e B mostrano i rispettivi ricavi, costi e margine
      - [ ] AC-3 — per il mese 2 i ricavi in marginalità (600,00 €) coincidono con l'importo del report fatturazione per lo stesso cliente
      - [ ] AC-4 — "Margine negativo" visibile sulla sola offerta B

      ## Blockers
      None.
    ref: TASK-05
