schema: archetipo/plan/v2
spec_code: US-035
body: |-
  ## Soluzione tecnica

  La spec è una ristrutturazione puramente presentazionale della tabella trasversale `/offerte`. Tutti i dati necessari sono già esposti da `VoceElencoOfferta` (`src/lib/offerte.ts`) e la server action `cambiaStatoOfferta` (`src/app/(back-office)/offerte/actions.ts`) conserva già la riga espansa attraverso il redirect tramite il campo `offertaEspansaId`. Non si toccano query, action, dominio o schema.

  L'intera modifica applicativa è confinata a `src/app/(back-office)/offerte/offerte-tabella.tsx`:

  - **Colonne**: le colonne "Giorni previsti", "Erogate", "Residuo" e "Stato" vengono rimosse; al loro posto un'unica colonna "Giorni erogati" allineata a destra con testo `erogate/previste` (es. "2/23") formattato con l'esistente `formattaGiornate` (it-IT, max 1 decimale). La tabella passa da 8 a 5 colonne (Offerta, Cliente, Tariffa giornaliera, Giorni erogati, Azioni); i `colSpan={8}` della riga vuota di ricerca e della riga espansa passano a 5.
  - **Avanzamento**: la mini barra di avanzamento (role="img" con aria-label percentuale) e i flag rossi "Esaurita"/"Oltre budget" (logica `eCritica`/`oltreBudget`/`esaurita` invariata) si spostano nella cella "Giorni erogati".
  - **Indicatore di stato**: accanto al badge del codice, un pulsante circolare (verde `emerald-500` se attiva, grigio se non attiva) che riusa lo stesso form `cambiaStatoOfferta` con gli hidden input `id`/`attiva`/`offertaEspansaId` oggi nella cella Stato. Attributi: `title` "Offerta attiva"/"Offerta non attiva" (tooltip testuale richiesto da AC-3), `aria-label` "Disattiva"/"Attiva" **identiche alle attuali** per non rompere i selettori e2e esistenti, `aria-pressed`, `stopPropagation` sul click per non attivare l'espansione della riga (AC-4). L'attenuazione `opacity-60` delle righe non attive resta invariata.
  - **Testabilità**: `data-testid="contenitore-tabella-offerte"` sul div `overflow-x-auto`, per verificare l'assenza di scorrimento orizzontale a 1366px (AC-5).

  **Fuori perimetro** (come da spec): `offerte-cliente-tabella.tsx` (elenco annidato cliente), `dettaglio-avanzamento-offerta.tsx` (pannello espanso), `page.tsx`, action e query.

  **ADR**: nessuna. La scelta è una ristrutturazione reversibile della presentazione di una vista esistente: non tocca dati persistenti, sicurezza, confini di integrazione né policy trasversali, quindi resta sotto la soglia ADR.

  **Mockup**: non generati (`mockup_generated = false`). È una compattazione di una tabella esistente che riusa il linguaggio visivo già presente (badge, mini barra, flag rossi); nessuna nuova pagina né nuovo componente con layout proprio. Chiamata borderline segnalata nel brief: l'utente può richiederli esplicitamente.

  ## Baseline

  Rilevata il 2026-07-20 su `main`, da `/Users/smarello/repo/coaching-planner`:

  - `npx tsc --noEmit` → **exit 0, 0 errori**.
  - `npm run lint` → **0 errori, 3 warning pre-esistenti** (`@typescript-eslint/no-unused-vars`) in file NON toccati da questo piano: `src/app/(front-office)/attivita/[data]/page.tsx`, `src/lib/policy-rotte.ts`, `tests/unit/rimborso-trasferta.test.ts`. Il guardrail e2e anti-flakiness passa. I file toccati dal piano non hanno diagnostiche: nessun nuovo warning è ammesso su di essi.
  - `npm test` (vitest) → **27 file, 435 test passati**.
  - `npx playwright test tests/e2e/offerte-trasversali.spec.ts tests/e2e/gestione-offerte.spec.ts tests/e2e/dettaglio-avanzamento-offerta.spec.ts --reporter=line` → **14 passed (12s)**. Prerequisiti ambiente: `E2E_DATABASE_URL` configurata (già presente nell'ambiente locale; la config Playwright fallisce subito se assente) e `prisma generate` già eseguito via `postinstall`/`npm run dev`.

  Il viewport Playwright di default è Desktop Chrome 1280×720: il requisito AC-5 a 1366px richiede un `test.use({ viewport })` dedicato.

  ## Mappa evidenze di accettazione

  | AC | Livello | Fixture / stato di partenza | Oracolo osservabile | Task |
  |---|---|---|---|---|
  | AC-1 | e2e browser | Offerta factory 10 gg previsti + riga attività 16h fatturabili (=2 gg) | La 4ª cella della riga (`celle.nth(3)`) ha testo `/^2\/10\s*gg$/` (it-IT, max 1 decimale via formattaGiornate) | TASK-02 (impl. TASK-01) |
  | AC-2 | e2e browser | Offerta factory esaurita (2 gg previsti, 16h) e offerta oltre budget (2 gg previsti, 24h) | Testo "Esaurita" e "Oltre budget" visibili nella riga; barra `getByRole("img", { name: "Erogato 100% del previsto" })` presente nella cella | TASK-02 |
  | AC-3 | e2e browser | Offerta factory attiva e offerta factory non attiva | Indicatore `getByRole("button")` con name "Disattiva" e `title="Offerta attiva"` (attiva) / name "Attiva" e `title="Offerta non attiva"` (non attiva), posizionato nella prima cella accanto al badge | TASK-02, TASK-03 |
  | AC-4 | e2e browser | Offerta factory attiva con riga espansa (click sul codice) | Dopo il click sull'indicatore della stessa riga: URL con `esito=stato-offerta-aggiornato&offertaEspansaId=<id>`, pulsante dettaglio `aria-expanded="true"`, region di dettaglio visibile, indicatore con name "Attiva" e title "Offerta non attiva" | TASK-03 |
  | AC-5 | e2e browser | Viewport 1366×768, cliente e offerta factory con testi lunghi | Link "Modifica" e pulsante "Elimina" visibili nella riga; sul contenitore `getByTestId("contenitore-tabella-offerte")`: `scrollWidth − clientWidth ≤ 0` | TASK-04 |

  Nota su AC-3: il colore verde/grigio non è asserito via classi CSS (i selettori di classi Tailwind sono vietati dal guardrail e2e); l'evidenza è semantica (title + name accessibile + `aria-pressed`), che è anche ciò che dichiara lo stato all'utente via tooltip.

  ## Strategia di test

  **Browser e2e obbligatorio**: il percorso di accettazione attraversa route e server boundary (server action con redirect), persistenza (stato `attiva` su Postgres) e comportamento solo-browser (overflow orizzontale a viewport dato). Si riusa il framework Playwright esistente con il contratto anti-flakiness di US-023: factory per ogni entità mutata (mai seed), selettori per ruolo/etichetta, attese web-first, `attendiTabellaOfferteIdratata` dopo ogni redirect, nessun hard wait, `data-testid` minimale solo per il contenitore di scroll.

  Nessun nuovo unit test: non nasce logica di dominio (formattazione e classificazioni esistono già e sono coperte da `tests/unit/avanzamento-offerte.test.ts` e `tests/unit/elenca-offerte-con-avanzamento.test.ts`). La suite unit fa da regressione nel gate.

  I demo spec `demo__offerte-trasversali.spec.ts` (US-025) e `demo__gestione-offerte.spec.ts` (US-026) asserisco oggi su indici di cella e etichette rimosse: vanno adattati alla nuova struttura mantenendo il flusso narrativo (TASK-05), altrimenti la suite completa diventa rossa.

  **Dimostrazione filmabile**: sì — flusso interamente UI su `/offerte` a viewport desktop. La registrazione video e la decisione finale di record/skip restano in carico ad archetipo-review.
tasks:
  - id: TASK-01
    title: 'Ristrutturare offerte-tabella.tsx: colonna unica Giorni erogati e indicatore circolare di stato'
    type: Impl
    status: DONE
    body: |-
      ## Objective
      La tabella `/offerte` mostra 5 colonne (Offerta, Cliente, Tariffa giornaliera, Giorni erogati, Azioni) con un indicatore circolare di stato accanto al badge del codice, al posto delle colonne Giorni previsti/Erogate/Residuo/Stato.

      ## Read
      - src/app/(back-office)/offerte/offerte-tabella.tsx — thead, RigaOfferta, form cambiaStatoOfferta nella cella Stato, formattaGiornate, eCritica/oltreBudget/esaurita, i due colSpan={8}
      - src/app/(back-office)/offerte/actions.ts — contratto di cambiaStatoOfferta (hidden input id, attiva, offertaEspansaId); NON va modificato
      - src/lib/offerte.ts — VoceElencoOfferta: contiene già tutti i dati necessari

      ## Change
      - src/app/(back-office)/offerte/offerte-tabella.tsx — unico file modificabile. Non-goal: actions.ts, page.tsx, src/lib/offerte.ts, dettaglio-avanzamento-offerta.tsx, offerte-cliente-tabella.tsx (elenco annidato cliente) e il contenuto del pannello espanso restano invariati.

      ## Steps
      1. Nel thead rimuovi le th "Giorni previsti", "Erogate", "Residuo" e "Stato"; aggiungi dopo "Tariffa giornaliera" una th "Giorni erogati" allineata a destra con le stesse classi delle th numeriche esistenti.
      2. Nella prima cella di RigaOfferta, tra il pulsante di espansione e il badge del codice, inserisci il form `cambiaStatoOfferta` oggi nella cella Stato (stessi hidden input id/attiva/offertaEspansaId) con pulsante submit a indicatore circolare: pallino pieno verde (`bg-emerald-500`) se attiva, grigio (`bg-zinc-300 dark:bg-zinc-600`) se non attiva; `title` = "Offerta attiva"/"Offerta non attiva"; `aria-label` = "Disattiva"/"Attiva" (identiche alle attuali: i test le usano come name accessibile); `aria-pressed={offerta.attiva}`; `onClick={(e) => e.stopPropagation()}` per non far scattare l'espansione della riga. Area cliccabile di almeno 16px e focus-visible outline coerente con gli altri controlli.
      3. Sostituisci le tre celle Giorni previsti/Erogate/Residuo con una cella "Giorni erogati" allineata a destra: testo `formattaGiornate(offerta.giornateErogate)` + "/" + `formattaGiornate(offerta.giorniPrevisti)` con suffisso "gg" in piccolo (stile dei suffissi attuali); conserva la mini barra di avanzamento esistente (span role="img" con aria-label `Erogato N% del previsto`, stessa logica percentuale e colori); sposta qui i flag rossi "Esaurita"/"Oltre budget" oggi nella cella Residuo, con logica invariata.
      4. Rimuovi la cella "Stato" (interruttore + etichetta "Attiva"/"Non attiva"). Lascia invariati il form cambiaStatoOfferta dentro ModaleElimina e la cella Azioni.
      5. Aggiorna i due `colSpan={8}` (riga "Nessuna offerta corrisponde alla ricerca" e riga espansa del dettaglio) a `colSpan={5}`.
      6. Aggiungi `data-testid="contenitore-tabella-offerte"` al div `overflow-x-auto` che avvolge la tabella (serve al test di AC-5).

      ## Verify
      - Run: `npx tsc --noEmit` (da /Users/smarello/repo/coaching-planner)
      - Expect: exit 0, nessun errore (baseline: 0 errori)
      - Run: `npx eslint "src/app/(back-office)/offerte/offerte-tabella.tsx"`
      - Expect: 0 errori e 0 warning sul file (baseline: file senza diagnostiche; i 3 warning pre-esistenti del repo sono in altri file)

      ## Done
      - [ ] AC-1 — la cella unica "Giorni erogati" mostra erogate/previste nel formato "2/23" via formattaGiornate (it-IT, max 1 decimale)
      - [ ] AC-2 — mini barra di avanzamento e flag rossi "Esaurita"/"Oltre budget" restano visibili nella cella "Giorni erogati" della riga
      - [ ] AC-3 — indicatore circolare accanto al badge codice: verde se attiva, grigio se non attiva, con `title` testuale che dichiara lo stato
      - [ ] AC-4 — il click sull'indicatore invia il form con l'`offertaEspansaId` corrente e non attiva l'espansione della riga (stopPropagation)
      - [ ] AC-5 — thead e righe hanno 5 colonne; i colSpan sono aggiornati a 5

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Aggiornare offerte-trasversali.spec.ts al formato erogate/previste e all'indicatore di stato
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `tests/e2e/offerte-trasversali.spec.ts` prova il formato "erogate/previste" della cella unica, i flag rossi in riga (inclusa la variante oltre budget) e lo stato espresso dall'indicatore circolare.

      ## Read
      - tests/e2e/offerte-trasversali.spec.ts — i due test esistenti: indici di cella nth(3)/nth(4)/nth(5) e asserzioni getByText("Attiva"/"Non attiva")
      - tests/e2e/support/fixtures.ts e tests/e2e/support/offerte.ts — factory e apriPaginaOfferte
      - src/app/(back-office)/offerte/offerte-tabella.tsx — markup prodotto da TASK-01 (title e aria-label dell'indicatore)

      ## Change
      - tests/e2e/offerte-trasversali.spec.ts — solo questo file. Rispetta il contratto e2e: solo factory, selettori per ruolo/etichetta, niente classi Tailwind, attese web-first.

      ## Steps
      1. Test "elenca l'offerta con avanzamento": sostituisci le asserzioni sulle celle nth(3)/nth(4)/nth(5) con `await expect(celle.nth(3)).toHaveText(/^2\/10\s*gg$/)` (16h su 10 gg previsti); sostituisci `riga.getByText("Attiva", { exact: true })` con: indicatore `riga.getByRole("button", { name: "Disattiva" })` visibile e `toHaveAttribute("title", "Offerta attiva")`.
      2. Test "evidenzia offerte non attive ed esaurite": per l'offerta non attiva sostituisci `getByText("Non attiva")` con indicatore `getByRole("button", { name: "Attiva" })` con `title` "Offerta non attiva"; per l'esaurita conserva l'asserzione sul testo "Esaurita" nella riga, sostituisci la verifica "Attiva" con indicatore name "Disattiva" + title "Offerta attiva" e aggiungi `riga.getByRole("img", { name: "Erogato 100% del previsto" })` visibile.
      3. Nello stesso test (o in uno scenario dedicato dello stesso describe) crea via factory un'offerta oltre budget (giorniPrevisti: 2, riga attività 24.00 ore fatturabili → 3 gg erogate, residuo −1) e verifica che nella sua riga sia visibile il testo "Oltre budget".

      ## Verify
      - Run: `npx playwright test tests/e2e/offerte-trasversali.spec.ts --reporter=line`
      - Expect: tutti i test del file passano (baseline: 2 passed; dopo l'aggiornamento 2-3 a seconda dello scenario aggiunto)

      ## Done
      - [ ] AC-1 — oracolo: la cella "Giorni erogati" ha testo /^2\/10\s*gg$/ per 16h fatturabili su 10 gg previsti
      - [ ] AC-2 — oracolo: "Esaurita" e "Oltre budget" visibili nella riga compatta; barra role img con aria-label percentuale presente
      - [ ] AC-3 — oracolo: indicatore con name accessibile "Disattiva"/"Attiva" e title "Offerta attiva"/"Offerta non attiva"

      ## Blockers
      Richiede TASK-01 completato.
    ref: TASK-02
  - id: TASK-03
    title: Aggiornare i test del toggle e provare che la riga espansa resta espansa (AC-4)
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il toggle dall'indicatore è provato end-to-end: cambio stato persistito attraverso il redirect e riga espansa che resta espansa dopo il click sull'indicatore della stessa riga.

      ## Read
      - tests/e2e/gestione-offerte.spec.ts — test "toggle stato: disattivazione e riattivazione dal pulsante di riga"
      - tests/e2e/dettaglio-avanzamento-offerta.spec.ts — helper rigaOfferta/pulsanteDettaglio/dettaglioOfferta e test "preserva l'espansione nel filtro e non espande le righe dalle azioni" (asserzione "Non attiva" a riga ~269)
      - tests/e2e/support/offerte.ts — apriPaginaOfferte, attendiTabellaOfferteIdratata

      ## Change
      - tests/e2e/gestione-offerte.spec.ts — solo le asserzioni sulle etichette di stato del test toggle
      - tests/e2e/dettaglio-avanzamento-offerta.spec.ts — l'asserzione "Non attiva" nel test del filtro e un nuovo test per AC-4

      ## Steps
      1. In gestione-offerte.spec.ts, test toggle: i click restano su `getByRole("button", { name: "Disattiva" })` / `{ name: "Attiva" }`; sostituisci le asserzioni `getByText("Attiva"/"Non attiva", { exact: true })` con: dopo la disattivazione indicatore name "Attiva" con `title` "Offerta non attiva"; dopo la riattivazione indicatore name "Disattiva" con `title` "Offerta attiva" e `getByRole("button", { name: "Attiva" })` a count 0 nella riga.
      2. In dettaglio-avanzamento-offerta.spec.ts, test "preserva l'espansione nel filtro": sostituisci `rigaBDisattivata.getByText("Non attiva", { exact: true })` con la verifica del `title` "Offerta non attiva" sull'indicatore della riga B.
      3. Sempre in dettaglio-avanzamento-offerta.spec.ts aggiungi il test "il click sull'indicatore conserva l'espansione della stessa riga": crea via factory cliente + offerta attiva; `apriPaginaOfferte`; espandi la riga cliccando il codice (pattern esistente) e verifica la region di dettaglio visibile; clicca l'indicatore `getByRole("button", { name: "Disattiva" })` della stessa riga; `page.waitForURL` con predicato: pathname `/offerte`, `esito=stato-offerta-aggiornato` e `offertaEspansaId` = id dell'offerta factory (pattern già usato nel test del filtro); `attendiTabellaOfferteIdratata(page)`; verifica: pulsante dettaglio con `aria-expanded="true"`, region di dettaglio visibile, indicatore con name "Attiva" e title "Offerta non attiva".

      ## Verify
      - Run: `npx playwright test tests/e2e/gestione-offerte.spec.ts tests/e2e/dettaglio-avanzamento-offerta.spec.ts --reporter=line`
      - Expect: tutti i test passano (baseline: 12 passed su questi due file; dopo la modifica 13)

      ## Done
      - [ ] AC-4 — oracolo: dopo il click sull'indicatore della riga espansa, l'URL contiene offertaEspansaId dell'offerta, aria-expanded="true" e la region di dettaglio è visibile, con stato cambiato (title "Offerta non attiva")
      - [ ] AC-3 — oracolo: name/title dell'indicatore riflettono lo stato dopo entrambe le transizioni del toggle

      ## Blockers
      Richiede TASK-01 completato.
    ref: TASK-03
  - id: TASK-04
    title: 'Test e2e a viewport 1366px: tutte le colonne visibili senza scorrimento orizzontale (AC-5)'
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Un test e2e prova che a 1366px di larghezza la tabella offerte mostra tutte le colonne, inclusi Modifica ed Elimina, senza scorrimento orizzontale.

      ## Read
      - tests/e2e/offerte-trasversali.spec.ts — struttura dei describe e helper comeRegExp
      - tests/e2e/support/offerte.ts — apriPaginaOfferte
      - playwright.config.ts — viewport di default Desktop Chrome 1280×720 (per questo serve il test.use dedicato)

      ## Change
      - tests/e2e/offerte-trasversali.spec.ts — aggiungi un describe dedicato. Nessun altro file.

      ## Steps
      1. Aggiungi `test.describe("Layout compatto a 1366px")` con `test.use({ viewport: { width: 1366, height: 768 } })` e il beforeEach di login admin come nel describe esistente.
      2. Nel test: crea via factory un cliente con ragione sociale lunga realistica e un'offerta con descrizione lunga (stressa i truncate), poi `apriPaginaOfferte(page)`.
      3. Verifica visibili: intestazione di colonna "Giorni erogati" (`getByRole("columnheader", { name: "Giorni erogati" })`), e nella riga factory il link "Modifica" e il pulsante "Elimina".
      4. Verifica l'assenza di overflow orizzontale sul contenitore: `const contenitore = page.getByTestId("contenitore-tabella-offerte");` poi `await expect.poll(() => contenitore.evaluate((el) => el.scrollWidth - el.clientWidth)).toBeLessThanOrEqual(0);`.

      ## Verify
      - Run: `npx playwright test tests/e2e/offerte-trasversali.spec.ts --reporter=line`
      - Expect: tutti i test del file passano, incluso il nuovo describe a 1366px

      ## Done
      - [ ] AC-5 — oracolo: a viewport 1366×768 il link Modifica e il pulsante Elimina della riga sono visibili e sul contenitore della tabella scrollWidth − clientWidth ≤ 0

      ## Blockers
      Richiede TASK-01 completato (data-testid sul contenitore).
    ref: TASK-04
  - id: TASK-05
    title: Adattare i demo spec di US-025 e US-026 alla riga compatta
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      I demo spec `demo__offerte-trasversali.spec.ts` (US-025) e `demo__gestione-offerte.spec.ts` (US-026) restano verdi con la struttura a 5 colonne, mantenendo invariato il flusso narrativo.

      ## Read
      - tests/e2e/demo__offerte-trasversali.spec.ts — helper giornateDellaRiga (legge celle nth(3)/nth(4)/nth(5)) e le tre asserzioni su `getByRole("cell").nth(6)`
      - tests/e2e/demo__gestione-offerte.spec.ts — asserzione `getByText("Non attiva")` al passo 4

      ## Change
      - tests/e2e/demo__offerte-trasversali.spec.ts e tests/e2e/demo__gestione-offerte.spec.ts — solo gli adattamenti alla nuova struttura; non cambiare dati usati, ordine dei passi né i commenti di contratto sui seed.

      ## Steps
      1. In demo__offerte-trasversali: riscrivi `giornateDellaRiga` perché legga la sola cella nth(3) nel formato "erogate/previste gg" (regex tipo /^(-?\d+(?:,\d+)?)\/(-?\d+(?:,\d+)?)/ sul testo, conversione it-IT come l'attuale giornateANumero) e restituisca previste, erogate e residuo calcolato come previste − erogate; mantieni le stesse asserzioni numeriche (previste 40/10/25, erogate come oggi, residuo ora derivato); sostituisci le tre asserzioni su nth(6) con l'indicatore: name "Disattiva" + title "Offerta attiva" per TS-2025-01 e DF-2025-02, name "Attiva" + title "Offerta non attiva" per GE-2024-03. Aggiorna il commento di testata che descrive le colonne.
      2. In demo__gestione-offerte, passo 4: sostituisci `rigaDisattivata.getByText("Non attiva")` con la verifica del `title` "Offerta non attiva" sull'indicatore (l'asserzione già presente sul name "Attiva" resta e continua a coprire il click di riattivazione).

      ## Verify
      - Run: `npx playwright test tests/e2e/demo__offerte-trasversali.spec.ts tests/e2e/demo__gestione-offerte.spec.ts --reporter=line`
      - Expect: 2 passed

      ## Done
      - [ ] AC-1 — oracolo demo: i valori seed letti dal formato "erogate/previste" sono coerenti (residuo derivato = previste − erogate sulla stessa cella)
      - [ ] AC-3 — oracolo demo: lo stato delle offerte seed è espresso da name/title dell'indicatore circolare

      ## Blockers
      Richiede TASK-01 completato.
    ref: TASK-05
