      ## Objective
      Tutte le verifiche della spec passano sull'albero finale e ogni task risulta DONE prima della richiesta di review.

      ## Read
      - Nessun file da ispezionare: questo task esegue solo i comandi elencati in Verify, nell'ordine dato.

      ## Change
      - Nessuna modifica prevista. Se un comando fallisce, correggi la causa nei file dei task precedenti e riesegui l'intero blocco di Verify da capo.

      ## Steps
