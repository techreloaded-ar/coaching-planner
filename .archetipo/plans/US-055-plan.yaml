      3. Marcare TASK-04 come `DONE` solo dopo che tutti i comandi del punto 1 sono verdi.
      4. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo spec show US-055` e confermare che TASK-01, TASK-02, TASK-03 e TASK-04 risultano tutti `DONE`, senza alcun task ancora `TODO`.
