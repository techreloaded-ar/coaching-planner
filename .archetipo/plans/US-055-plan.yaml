      1. Da `/Users/smarello/repo/coaching-planner` eseguire `archetipo wiki --project-root /Users/smarello/repo/coaching-planner reset domains/attivita`, che riporta la pagina a `status: generated` rimuovendo il blocco `review` consolidato il 31 luglio.
