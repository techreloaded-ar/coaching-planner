      - Expect: tutti verdi. Riferimento di baseline: 38 file e 607 test unit passati, eslint senza errori, messaggio «Guardrail e2e anti-flakiness passed», nessuna diagnostica TypeScript. Il build non e stato eseguito in fase di planning: e atteso verde perche il repository e verde su `b0b108e` in CI e la modifica e limitata a un componente client gia compilato.
