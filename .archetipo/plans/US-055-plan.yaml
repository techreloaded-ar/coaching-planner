      ## Change
      Nessuna modifica di codice: task di sola esecuzione e verifica.

      ## Steps
      1. Da `/Users/smarello/repo/coaching-planner` eseguire, nell'ordine:
         - `npx vitest run` (suite unit completa);
         - `npm run lint` (eslint piu guardrail e2e anti-flakiness);
         - `npx tsc --noEmit -p tsconfig.json`;
         - `npm run build`;
         - `npx playwright test tests/e2e/calendario-salto-mese.spec.ts tests/e2e/calendario-navigazione-reattiva.spec.ts tests/e2e/calendario-cache-mesi.spec.ts --retries=0`.
