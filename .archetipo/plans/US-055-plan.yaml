      - `docs/wiki/decisions/cache-client-calendario-collaboratore.md` — per confermare che le sue affermazioni restano accurate e che non va toccata.

      ## Change
      - `docs/wiki/domains/attivita.md`: frontmatter `sources`, punto 7 dei flussi, tabella «Codice», sezione «Verifica».
      - `docs/wiki/index.md` e `docs/wiki/log.md`: solo come output dei comandi `archetipo wiki reset` e `archetipo wiki catalog`, mai modificati a mano.

      Non-goal: **non** modificare `docs/wiki/decisions/cache-client-calendario-collaboratore.md` ne `docs/wiki/engineering/code-map.md`. Sono co-citazioni tracciate di `calendario-mensile.tsx` restituite da `wiki affected`, ma le loro affermazioni restano accurate perche il salto riusa cache e confini gia documentati senza alterarne la semantica; la loro eventuale riconferma `evidence-changed` e competenza dell'accettazione. Non creare nuove pagine e nessun ADR.

