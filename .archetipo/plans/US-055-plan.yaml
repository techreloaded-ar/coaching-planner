         - `- path: tests/e2e/calendario-salto-mese.spec.ts` con `role: verification`, in coda alle altre voci `verification`.
      3. Nel punto 7 di «Flussi osservati» aggiungere in coda al paragrafo esistente una frase che descrive il controllo di selezione diretta: raggiunge in un solo passo qualunque mese e anno riusando lo stesso intento di navigazione e lo stesso commit dei controlli esistenti, quindi stesso indicatore di attesa sul mese non ancora in cache, stesso contratto URL `?mese=YYYY-MM` e controlli esistenti coerenti dal mese raggiunto. Non riscrivere il resto del paragrafo ne i punti 8, 9 e 10.
