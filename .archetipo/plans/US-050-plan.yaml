schema: archetipo/plan/v2
spec_code: US-050
body: |-
  # US-050: Cambio mese reattivo nel calendario con indicatore di caricamento — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-28 (rev. 3: contratto Wiki allineato alle nuove direttive — chiave `update` e task dedicati per ogni pagina; rev. 2: aggiunto prefetch dei mesi adiacenti su richiesta del product owner)

  ---

  ## Spec

  **Epic:** EP-005 — Evoluzioni Post-MVP
  **Priorità:** HIGH | **Punti:** 3

  **Storia Utente**
  Come collaboratore, voglio che il passaggio da un mese all'altro del mio calendario attività risponda in modo quasi istantaneo e mostri un indicatore quando i dati stanno caricando, così da navigare lo storico senza attese cieche in cui l'applicazione sembra bloccata.

  **Criteri di Accettazione**
  - AC-1 — Al click sui controlli di navigazione mese (precedente, successivo, mese corrente) l'interfaccia dà riscontro visivo immediato, senza intervallo percepibile in cui il click sembra ignorato.
  - AC-2 — Quando i dati del mese non sono ancora disponibili, un indicatore di caricamento è visibile sulla zona del calendario e scompare quando le celle del nuovo mese sono valorizzate.
  - AC-3 — La navigazione conserva il contratto attuale dell'URL: il mese visualizzato resta raggiungibile e condivisibile tramite l'indirizzo con il token `YYYY-MM`, e l'apertura diretta di quell'indirizzo mostra il mese richiesto.
  - AC-4 — Il contenuto delle celle (clienti, ore cumulate, indicatore "+N") e l'apertura del giorno restano invariati rispetto al comportamento attuale.

  ---

  ## Soluzione Tecnica

  Oggi la navigazione mese usa tre `<Link>` verso `/attivita?mese=…` in `src/app/(front-office)/attivita/calendario-mensile.tsx`: la pagina server (`page.tsx`) ricalcola i dati e, durante l'attesa, il client non mostra alcun feedback (la rotta è dinamica e senza `loading.tsx`, quindi il click sembra ignorato su rete lenta). La soluzione combina due leve, entrambe allineate alle guide locali di Next 16.2.9 (`04-linking-and-navigating.md`, `prefetching.md`, `staleTimes.md`):

  **Leva 1 — Reattività percepita (transizione client-side):**
  - I tre controlli di navigazione (precedente, successivo, mese corrente) diventano `<button type="button">` con identiche classi, icone e `aria-label`; il click chiama `router.push('/attivita?mese=…')` (per "Mese corrente": `router.push('/attivita')`) dentro `startTransition` di `useTransition`. La griglia del mese corrente resta visibile durante la transizione e `isPending` pilota l'indicatore: riscontro immediato (AC-1) senza svuotare la pagina.
  - Il token di destinazione è calcolato lato client riusando le funzioni pure già esistenti `mesePrecedente`, `meseSuccessivo`, `tokenMeseCorrente` di `src/domain/calendario` (prive di dipendenze dal framework). Un ref `ultimaDestinazione` incatena i click rapidi: la base del calcolo è l'ultima destinazione richiesta, non il prop `token` non ancora aggiornato, così tre click su "successivo" avanzano di tre mesi. Il ref si azzera quando il prop `token` cambia (effetto). I prop `tokenPrecedente`/`tokenSuccessivo` e il loro calcolo in `page.tsx` vengono rimossi perché non più usati.
  - L'indicatore di caricamento è un overlay assoluto sulla `<section>` del calendario (che diventa `relative` e riceve `aria-busy={isPending}`): sfondo semi-trasparente, spinner `animate-spin`, `role="status"` con testo `sr-only`, `data-testid="indicatore-caricamento-mese"`. Parte con `opacity: 0` e compare via animazione CSS con ritardo di ~120ms (keyframes in `src/app/globals.css`), come raccomandato dalla guida per evitare il flash sulle transizioni veloci.

  **Leva 2 — Velocità reale (prefetch dei mesi adiacenti):**
  - Un `useEffect` con dipendenza sul `token` chiama `router.prefetch()` per `/attivita?mese={mesePrecedente}`, `/attivita?mese={meseSuccessivo}` e `/attivita` (destinazione di "Mese corrente"), con il callback `onInvalidate` che ri-prefetcha lo stesso URL quando Next segnala che il payload è diventato stantio (pattern documentato in `prefetching.md`, righe 140-166; firma `router.prefetch(href, { onInvalidate })` da `use-router.md`, disponibile da v15.4).
  - Per la guida locale `staleTimes.md`, i payload ottenuti via `router.prefetch` ricadono nella finestra `static` della cache client (default 5 minuti): al click su precedente/successivo il mese si renderizza dalla cache senza round-trip server — questo rende il cambio mese effettivamente istantaneo anche su rete lenta, ed è il motivo per cui NON serve abilitare la config sperimentale `experimental.staleTimes` in `next.config.ts` (nessuna modifica di configurazione globale).
  - Conseguenza accettata (decisione di prodotto esplicita del PO): navigando tra mesi già prefetchati si possono vedere dati vecchi fino a 5 minuti. Mitigazioni già presenti nel codebase: le server action di `src/lib/actions/righe-attivita.ts` chiamano `revalidatePath`, che per la guida locale `revalidatePath.md` "purga la Client Cache" — quindi le modifiche fatte dall'utente stesso invalidano subito la cache; `dettaglio-giornata.tsx` chiama inoltre `router.refresh()`. Il refresh del browser (F5) bypassa sempre la cache client (in-memory, per scheda) e ricarica dati freschi.
  - Vincolo operativo: il prefetching è attivo **solo in produzione** (`next start`); in `next dev` è disabilitato. I test e2e che provano il cache-hit devono girare contro il server di produzione (come fa la CI, che usa `PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start"`).
  - Il contratto URL (AC-3) è intatto: `router.push` aggiorna l'indirizzo con `?mese=YYYY-MM` e `page.tsx` continua a leggere `searchParams.mese` invariato. Celle, link giorno e link "Riepilogo mese" non vengono toccati (AC-4).
  - Alternativa scartata `loading.tsx`: sostituirebbe l'intera pagina con uno skeleton a ogni navigazione, perdendo la griglia visibile. Alternativa scartata `useLinkStatus`: pending confinato dentro il singolo `<Link>`. Alternativa scartata `experimental.staleTimes` globale: avrebbe esteso la finestra di staleness a tutte le navigazioni dell'applicazione per ottenere lo stesso effetto che `router.prefetch` dà già localmente.

  ### Decisioni Architetturali

  **ADR nuovo — `decisions/prefetch-mesi-adiacenti` (da creare con il task dedicato TASK-06; nessuna decisione esistente in materia: verificato con `archetipo wiki search --type decision`).** La scelta supera la soglia ADR perché cambia la semantica di consistenza osservabile del calendario attività: letture potenzialmente stantie fino a 5 minuti durante la navigazione client-side, in cambio di cambio mese istantaneo. Contesto: navigazione mese percepita come bloccata su rete lenta; il PO privilegia la velocità e accetta esplicitamente la staleness. Opzione scelta: `router.prefetch` dei mesi adiacenti con `onInvalidate`, senza config globale. Alternative valutate: (a) nessun prefetch — solo indicatore, nessun rischio staleness ma nessun guadagno reale di velocità; (b) `experimental.staleTimes` in `next.config.ts` — stessa velocità ma estende la staleness a tutta l'app ed è una config sperimentale; (c) `loading.tsx` — prefetch parziale ma skeleton a pagina intera. Trade-off: finestra di staleness ≤5 min limitata alla scheda corrente, mitigata da `revalidatePath` nelle action (le modifiche proprie invalidano la cache) e dal refresh browser. Intento di verifica: e2e che prova il cache-hit (nessuna richiesta di rete al click su mese prefetchato) e regressione sull'aggiornamento dopo inserimento riga. La transizione client-side (Leva 1) resta invece sotto soglia ADR: pattern locale raccomandato dal framework, reversibile, senza impatti trasversali.

  ---

  ## Baseline

  Eseguita il 2026-07-28 su `/Users/smarello/repo/coaching-planner` (nessun worktree per US-050).

  | Verifica | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npx vitest run tests/unit/calendario.test.ts tests/unit/attivita.test.ts` | Verde: 2 file, 46 test passati | Le verifiche dei task possono attendersi `passa`; il dominio calendario non cambia. |
  | `npx tsc --noEmit` | Verde: exit 0, nessun errore | I file toccati non devono introdurre nuovi errori di tipo. |
  | `npm run lint` | Verde: eslint + guardrail anti-flakiness e2e passati | Il nuovo spec e2e deve superare il guardrail (niente hard wait, niente selettori Tailwind). |

  Prerequisiti d'ambiente (non errori di codice): i test e2e richiedono `E2E_DATABASE_URL` valorizzata (già presente in locale; `playwright.config.ts` fallisce esplicitamente se assente), web server avviato da Playwright (`npm run dev` default locale, `npm run start` in CI) e Chromium installato (`npx playwright install chromium` se mancante). Prisma client generato via `npm run db:generate` se necessario. Il prefetch è attivo solo con server di produzione: per esercitarlo in locale servono `npm run build` seguito da `PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start" npx playwright test …`.

  ---

  ## Mappa delle Evidenze di Accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task produttore |
  |---|---|---|---|---|
  | AC-1 (riscontro immediato) | Collaboratore factory con riga attività nel mese riservato US-050 arretrato di 1 (`mesePassatoRiservato("US-050", 1)`); risposta di rete del mese di destinazione trattenuta via `page.route` registrata prima del `goto` | E2E Playwright | Dopo il click su "Mese precedente" e con la risposta ancora trattenuta, `getByTestId("indicatore-caricamento-mese")` è visibile e la `<section>` del calendario ha `aria-busy="true"` — il click ha prodotto riscontro immediato senza attendere il server | TASK-03 |
  | AC-1 (tempo percepito istantaneo con prefetch) | Stessa struttura dati; server di produzione (`npm run start`); risposta di prefetch del mese adiacente attesa con `waitForResponse` prima del click | E2E Playwright (solo produzione, skip condizionale in dev) | Al click su "Mese precedente" le celle del mese si valorizzano SENZA che venga emessa alcuna nuova richiesta di rete per quel mese (contatore richieste invariato): il mese è servito dalla cache client prefetchata | TASK-05 |
  | AC-2 | Fixture AC-1 con risposta trattenuta | E2E Playwright | Indicatore visibile mentre la risposta è trattenuta; dopo il rilascio della route l'indicatore scompare (`toBeHidden`) e la cella `a[href="/attivita/{data}?mese={meseArrivo}"]` è visibile con l'etichetta cliente valorizzata | TASK-03 |
  | AC-3 | Stessa fixture; nessuna interception | E2E Playwright | Dopo la navigazione l'URL soddisfa `toHaveURL(/mese={meseArrivo}/)`; in un test separato `page.goto("/attivita?mese={meseArrivo}")` diretto mostra la cella del giorno con l'attività | TASK-03 |
  | AC-4 | Stessa fixture | E2E Playwright + regressione suite esistente | La cella mostra badge righe, ore `3.0 h` ed etichetta cliente come oggi; il click sulla cella apre `/attivita/{data}?mese={meseArrivo}`; gli spec esistenti `calendario-etichette-clienti`, `apertura-giorno-calendario`, `calendario-segregazione`, `demo__calendario-mensile` restano verdi | TASK-03, TASK-08 |

  Gli oracoli restano osservabili: gli unici doppi di test sono il trattenimento della route di rete (`page.route` con promessa di sblocco) e il conteggio delle richieste, che non nascondono né il componente calendario né il contratto URL — la pagina reale, il server component e il database e2e restano nel percorso.

  ---

  ## Strategia di Test

  Il comportamento cambia solo nel client component di navigazione: le funzioni di dominio (`mesePrecedente`, `meseSuccessivo`, griglia) sono già coperte da `tests/unit/calendario.test.ts` e non vengono modificate. L'evidenza di accettazione vive quindi a livello browser e2e, dove il percorso attraversa route, sessione e persistenza — il repository non ha testing-library per component test React e non va introdotta per questa spec.

  - E2E deterministico secondo il contratto di `tests/e2e/README.md`: collaboratore/cliente/offerta/righe creati dalla factory (`tests/e2e/support/fixtures.ts`), mesi riservati `meseRiservato("US-050")` e `mesePassatoRiservato("US-050", 1)` da `tests/e2e/support/date.ts`, nessun hard wait: la "rete lenta" è simulata trattenendo la risposta con `page.route` sbloccata da una promessa dopo che l'asserzione sull'indicatore è passata. L'interception va registrata PRIMA del `goto` iniziale: in produzione la richiesta del mese adiacente parte al mount come prefetch e va trattenuta anch'essa, così il click trova la transizione ancora pending in entrambe le modalità (dev: nessun prefetch, la richiesta parte al click; prod: il click riusa il prefetch in volo).
  - Il cache-hit del prefetch si prova con un oracolo di rete, non di tempo: si attende la risposta del prefetch (`waitForResponse`, event-driven), si clicca, si verifica che le celle siano valorizzate e che il contatore delle richieste per quel mese non sia aumentato. Nessuna asserzione sui millisecondi (sarebbe flaky). Il test si auto-esclude con `test.skip` motivato quando il web server e2e non è di produzione, perché il prefetching di Next è attivo solo in produzione; in CI gira sempre (`PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start"`).
  - Il selettore dell'indicatore è `data-testid="indicatore-caricamento-mese"`; Playwright considera visibile un elemento con `opacity: 0` (l'animazione ritarda solo l'opacità), quindi l'asserzione non dipende dai tempi dell'animazione.
  - Regressione staleness: gli e2e esistenti che inseriscono righe via UI restano validi perché le server action chiamano `revalidatePath` (purga della cache client) e i dati factory sono creati prima del `goto` (il prefetch successivo li include già).
  - Regressione: `demo__calendario-mensile.spec.ts` va aggiornato nel solo selettore "Mese corrente" (da `link` a `button`); i `getByLabel` esistenti restano validi.
  - `npm run lint` va rieseguito dopo ogni modifica e2e: include il guardrail anti-flakiness.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (`@playwright/test` 1.60, config `playwright.config.ts`, `fullyParallel: true` da preservare)
  **Demo video:** attesa — la Dimostrazione è filmabile (navigazione tra mesi + indicatore su rete rallentata); la registrazione e la decisione finale spettano ad `archetipo-review`

  | Scenario | Descrizione del flusso utente |
  |---|---|
  | Cambio mese con rete lenta | Il collaboratore apre il calendario sul mese riservato, preme "Mese precedente" mentre la risposta del server è trattenuta: l'indicatore di caricamento compare subito sull'area calendario (AC-1, AC-2), al rilascio le celle del nuovo mese si valorizzano, l'indicatore scompare e l'URL contiene il token del mese (AC-3); la cella mostra etichette e ore invariate e il click apre il giorno (AC-4) |
  | Cambio mese istantaneo da cache prefetchata (solo produzione) | Il collaboratore apre il calendario, il browser prefetcha i mesi adiacenti in background; al click su "Mese precedente" il mese compare valorizzato senza alcuna nuova richiesta di rete (AC-1, tempo percepito istantaneo) |
  | Apertura diretta dell'URL con token mese | Il collaboratore apre direttamente `/attivita?mese=YYYY-MM` di un mese con attività e vede il calendario di quel mese con le celle valorizzate (AC-3) |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [domains/attivita]
    update: [domains/attivita]
    create: [decisions/prefetch-mesi-adiacenti]
  ```

  Ogni ID in `update` e `create` ha il proprio task Impl dedicato, come richiesto dal contratto: `decisions/prefetch-mesi-adiacenti` è creato da TASK-06 (nuovo ADR sulla semantica di consistenza: staleness ≤5 min accettata in cambio di navigazione istantanea, contratto `type: decision` completo di marker); `domains/attivita` è aggiornato da TASK-07 (il flusso osservato 5 cambia: navigazione mese come transizione client-side con griglia visibile, indicatore di caricamento e prefetch dei mesi adiacenti con cache client; la pagina torna in stato `generated` e l'approvazione resta alla review). `engineering/code-map` è emerso dalla discovery `wiki affected` come sola co-citazione a livello di boundary: le sue affermazioni restano accurate, quindi resta fuori dal contratto richiesto.

  ---

  _Piano generato via ARchetipo Planning — 2026-07-28 (rev. 3)_
tasks:
  - id: TASK-01
    title: Transizione client-side e indicatore di caricamento nel calendario mensile
    type: Impl
    status: DONE
    body: |-
      ## Objective
      La navigazione mese del calendario reagisce immediatamente al click mantenendo visibile la griglia corrente e mostra un overlay di caricamento sull'area calendario finché il nuovo mese non è renderizzato, senza cambiare il contratto URL `?mese=YYYY-MM`.

      ## Read
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — i tre `<Link>` di navigazione (aria-label "Mese precedente", "Mese successivo", testo "Mese corrente"), la `<section>` con `aria-label="Calendario mensile delle attività"`, le classi Tailwind dei controlli da preservare identiche.
      - `src/app/(front-office)/attivita/page.tsx` — calcolo di `tokenPrev`/`tokenNext` e props passate a `CalendarioMensile`.
      - `src/domain/calendario/index.ts` — firme di `mesePrecedente`, `meseSuccessivo`, `tokenMeseCorrente` (funzioni pure, importabili nel client component).
      - `src/app/globals.css` — struttura Tailwind v4 (`@import "tailwindcss"`, blocchi `@theme`) dove aggiungere i keyframes.
      - `node_modules/next/dist/docs/01-app/01-getting-started/04-linking-and-navigating.md` — sezione "Client-side transitions" e "Slow networks" (riferimento del pattern, Next 16.2.9).

      ## Change
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — sostituire i tre `<Link>` di navigazione con `<button type="button">`; aggiungere `useTransition`/`useRouter`, il ref `ultimaDestinazione`, l'overlay indicatore; `relative` e `aria-busy` sulla `<section>`; rimuovere le props `tokenPrecedente`/`tokenSuccessivo`.
      - `src/app/(front-office)/attivita/page.tsx` — rimuovere il calcolo e il passaggio di `tokenPrev`/`tokenNext` (e gli import `mesePrecedente`/`meseSuccessivo` se non più usati).
      - `src/app/globals.css` — aggiungere i keyframes `comparsa-caricamento`.
      - Non-goal: NON toccare il link "Riepilogo mese", i `<Link>` delle celle giorno, `src/domain/calendario/index.ts`, `src/lib/attivita.ts` né il contenuto delle celle (AC-4). Nessun `loading.tsx`. Il prefetch dei mesi adiacenti è di TASK-04, non di questo task.

      ## Steps
      1. In `calendario-mensile.tsx` (`"use client"` già presente) importare `useRouter` da `next/navigation`, `useTransition`, `useRef`, `useEffect` da `react` e `mesePrecedente`, `meseSuccessivo`, `tokenMeseCorrente` da `@/domain/calendario`.
      2. Nel componente: `const router = useRouter();` e `const [inCaricamento, avviaTransizione] = useTransition();` più `const ultimaDestinazione = useRef<string | null>(null);`.
      3. Definire `function navigaVersoMese(calcola: (base: string) => string) { const base = ultimaDestinazione.current ?? token; const destinazione = calcola(base); ultimaDestinazione.current = destinazione; avviaTransizione(() => { router.push(`/attivita?mese=${destinazione}`); }); }` e per "Mese corrente" una variante che imposta `ultimaDestinazione.current = tokenMeseCorrente()` e fa `router.push("/attivita")` nella transizione.
      4. Aggiungere `useEffect(() => { ultimaDestinazione.current = null; }, [token]);` così i click rapidi si incatenano ma lo stato si riallinea quando arriva il nuovo mese.
      5. Sostituire i tre `<Link>` di navigazione con `<button type="button" onClick={...}>` mantenendo INVARIATI classi Tailwind, SVG, `aria-label="Mese precedente"`, `aria-label="Mese successivo"` e il testo visibile "Mese corrente" (aggiungere `cursor-pointer` alle classi dei bottoni se il reset del browser lo richiede). Rimuovere `tokenPrecedente`/`tokenSuccessivo` da `CalendarioMensileProps`.
      6. Sulla `<section aria-label="Calendario mensile delle attività">` aggiungere la classe `relative` e `aria-busy={inCaricamento}`. Dentro la section, renderizzare `{inCaricamento && (<div data-testid="indicatore-caricamento-mese" role="status" className="absolute inset-0 z-10 flex items-center justify-center bg-white/60 opacity-0 animate-[comparsa-caricamento_200ms_ease-out_120ms_forwards] dark:bg-zinc-900/60"><span className="h-8 w-8 animate-spin rounded-full border-[3px] border-rose-200 border-t-rose-600 dark:border-rose-900 dark:border-t-rose-400" /><span className="sr-only">Caricamento del mese in corso…</span></div>)}`.
      7. In `src/app/globals.css` aggiungere: `@keyframes comparsa-caricamento { to { opacity: 1; } }`.
      8. In `page.tsx` eliminare `tokenPrev`/`tokenNext`, gli import ora inutilizzati e le due props dal JSX di `<CalendarioMensile>`.

      ## Verify
      - Run: `npx tsc --noEmit` (da `/Users/smarello/repo/coaching-planner`)
      - Expect: exit 0, nessun errore (baseline verde).
      - Run: `npx vitest run tests/unit/calendario.test.ts tests/unit/attivita.test.ts`
      - Expect: 46 test passati come da baseline (nessuna regressione di dominio).
      - Run: `npx eslint "src/app/(front-office)/attivita/calendario-mensile.tsx" "src/app/(front-office)/attivita/page.tsx"`
      - Expect: nessun errore né warning nuovi sui file toccati.

      ## Done
      - [ ] AC-1 — I controlli mese sono bottoni che avviano la transizione client-side: al click lo stato `inCaricamento` diventa immediatamente vero e la griglia corrente resta visibile (evidenza browser prodotta da TASK-03).
      - [ ] AC-2 — L'overlay `indicatore-caricamento-mese` è renderizzato sull'area calendario mentre la transizione è pending e scompare al termine.
      - [ ] AC-3 — La navigazione aggiorna l'URL con `?mese=YYYY-MM` via `router.push` e `page.tsx` continua a leggere `searchParams.mese` invariato.
      - [ ] AC-4 — Celle giorno, loro `<Link>` e link "Riepilogo mese" non modificati (diff limitato ai punti elencati in Change).
      - [ ] Click ripetuti su "Mese successivo"/"Mese precedente" incatenano le destinazioni tramite `ultimaDestinazione` (tre click = tre mesi).

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Aggiorna i selettori e2e esistenti al nuovo ruolo button dei controlli mese
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Gli spec e2e esistenti che selezionano i controlli di navigazione mese del calendario attività restano compilabili e coerenti con i nuovi `<button>` (stesse etichette accessibili, ruolo diverso).

      ## Read
      - `tests/e2e/demo__calendario-mensile.spec.ts` — riga ~69: `page.getByRole("link", { name: "Mese corrente" })`; righe ~63-64: `getByLabel("Mese precedente")`/`getByLabel("Mese successivo")` (questi restano validi: `getByLabel` non dipende dal ruolo).
      - `tests/e2e/calendario-segregazione.spec.ts` righe ~85-86 e `tests/e2e/apertura-giorno-calendario.spec.ts` riga ~99 — usano `getByLabel`, verificare che non ci siano altri `getByRole("link")` sui controlli mese di `/attivita`.
      - Non toccare `tests/e2e/report-fatturazione-clienti.spec.ts`: riguarda la pagina report back-office, fuori perimetro.

      ## Change
      - `tests/e2e/demo__calendario-mensile.spec.ts` — sostituire `getByRole("link", { name: "Mese corrente" })` con `getByRole("button", { name: "Mese corrente" })`; adeguare eventuali altri selettori basati sul ruolo `link` per i soli controlli precedente/successivo/corrente del calendario attività.
      - Non-goal: nessun cambiamento a flussi, asserzioni sui contenuti o altri spec.

      ## Steps
      1. Cercare in `tests/e2e/` tutte le occorrenze di `getByRole("link"` con nomi "Mese precedente", "Mese successivo", "Mese corrente" e classificarle per pagina: aggiornare al ruolo `button` solo quelle che operano su `/attivita` (calendario collaboratore).
      2. Applicare la sostituzione in `demo__calendario-mensile.spec.ts`.
