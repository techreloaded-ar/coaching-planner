  - id: TASK-03
    title: 'Nuovo e2e: navigazione mese reattiva con indicatore e contratto URL'
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Uno spec Playwright deterministico prova AC-1, AC-2, AC-3 e AC-4: indicatore visibile al click con risposta trattenuta, scomparsa a celle valorizzate, URL con token `YYYY-MM`, apertura diretta dell'URL e contenuto celle/apertura giorno invariati.

      ## Read
      - `tests/e2e/calendario-etichette-clienti.spec.ts` — pattern completo di riferimento: fixtures `{ page, collaboratore, factory }`, `meseRiservato`, `dataNelMese`, helper `dataDb`, `accediComeCollaboratore`, selettore cella `a[href="/attivita/{data}?mese={mese}"]`.
      - `tests/e2e/support/date.ts` — `meseRiservato("US-050")` e `mesePassatoRiservato("US-050", 1)` (mese riservato arretrato di 1, destinazione del click su "Mese precedente").
      - `tests/e2e/support/fixtures.ts` e `tests/e2e/support/auth.ts` — factory e login.
      - `tests/e2e/README.md` — contratto anti-flakiness (niente hard wait, niente selettori Tailwind, web-first expect).

      ## Change
      - Creare `tests/e2e/calendario-navigazione-reattiva.spec.ts` (nuovo file, `test.describe("US-050 Navigazione mese reattiva")`).
      - Non-goal: nessuna modifica a spec esistenti, fixtures o config Playwright (preservare `fullyParallel: true`, `retries` invariati). Il test del cache-hit prefetch è di TASK-05, non di questo task.

      ## Steps
      1. Setup dati: `const mesePartenza = meseRiservato("US-050"); const meseArrivo = mesePassatoRiservato("US-050", 1); const data = dataNelMese(meseArrivo, 12);` poi `factory.createClienteConOfferta()` e `factory.createRigaAttivita({ collaboratore, cliente, offerta, data: dataDb(data), ore: "3.00" })`.
      2. Test 1 "indicatore visibile durante il caricamento e celle valorizzate al termine": login con `accediComeCollaboratore`. PRIMA del `goto`, creare il gate deterministico e registrare l'interception: `let sblocca: (() => void) | undefined; const attesa = new Promise<void>((resolve) => { sblocca = resolve; });` e `await page.route(`**/attivita?*mese=${meseArrivo}*`, async (route) => { await attesa; await route.continue(); });`. L'ordine è essenziale: con il server di produzione la richiesta di `meseArrivo` parte al mount come PREFETCH e va trattenuta anch'essa, così il click trova sempre la transizione pending (in dev il prefetch non esiste e la richiesta parte al click: entrambe le modalità restano deterministiche). Il pattern matcha solo `mese={meseArrivo}`, quindi il caricamento iniziale su `mesePartenza` non è bloccato.
      3. `await page.goto(`/attivita?mese=${mesePartenza}`);` e attendere `expect(page.getByLabel("Calendario mensile delle attività")).toBeVisible()`.
      4. Click su `page.getByLabel("Mese precedente")`; con la risposta trattenuta asserire: `await expect(page.getByTestId("indicatore-caricamento-mese")).toBeVisible();` (AC-1: riscontro immediato; AC-2: indicatore sull'area calendario — l'opacità animata non conta per la visibilità Playwright) e `await expect(page.getByLabel("Calendario mensile delle attività")).toHaveAttribute("aria-busy", "true");`.
      5. Rilasciare con `sblocca!();` poi asserire: cella `page.locator(`a[href="/attivita/${data}?mese=${meseArrivo}"]`)` visibile con `data-con-attivita="true"` e testo `3.0 h` (celle valorizzate, AC-2/AC-4), `await expect(page.getByTestId("indicatore-caricamento-mese")).toBeHidden();` (AC-2), `await expect(page).toHaveURL(new RegExp(`mese=${meseArrivo}`));` (AC-3), `aria-busy` tornato `"false"`. Chiudere con `await page.unroute(`**/attivita?*mese=${meseArrivo}*`);`.
      6. Sempre nel Test 1 (AC-4): click sulla cella e `await expect(page).toHaveURL(new RegExp(`/attivita/${data}`));` (apertura giorno invariata).
      7. Test 2 "apertura diretta dell'URL con token mese" (AC-3): nuovo login/goto diretto `page.goto(`/attivita?mese=${meseArrivo}`)` senza interception e asserzione che la cella del giorno con `3.0 h` sia visibile.
      8. Nessun `waitForTimeout`, nessun selettore su classi Tailwind: solo ruoli, label, testid e href esatti.

      ## Verify
      - Run: `npx playwright test tests/e2e/calendario-navigazione-reattiva.spec.ts` (da `/Users/smarello/repo/coaching-planner`; richiede `E2E_DATABASE_URL` nell'ambiente, web server avviato automaticamente dalla config)
      - Expect: 2 test passati, 0 flaky (nessun retry consumato).
      - Run: `npm run lint`
      - Expect: eslint + guardrail anti-flakiness verdi (il guardrail copre il nuovo file).

      ## Done
      - [ ] AC-1 — Oracolo: indicatore visibile subito dopo il click mentre la risposta è trattenuta dal gate `page.route` (il click non sembra mai ignorato).
      - [ ] AC-2 — Oracolo: `indicatore-caricamento-mese` visibile durante l'attesa e `toBeHidden` dopo che la cella del nuovo mese è visibile e valorizzata.
      - [ ] AC-3 — Oracolo: `toHaveURL` con `mese={meseArrivo}` dopo la navigazione e apertura diretta dell'URL che mostra il mese richiesto.
      - [ ] AC-4 — Oracolo: cella con `data-con-attivita="true"`, ore `3.0 h` e apertura giorno su `/attivita/{data}` invariate.
      - [ ] Il test usa esclusivamente entità factory e mesi riservati US-050; nessuna mutazione di entità seed.

      ## Blockers
      Dipende da TASK-01 (indicatore e bottoni devono esistere). Prerequisito d'ambiente: `E2E_DATABASE_URL` configurata e Chromium Playwright installato (`npx playwright install chromium` se assente).
