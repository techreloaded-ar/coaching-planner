  - id: TASK-04
    title: '[FUORI PERIMETRO — vedi US-052] Prefetch dei mesi adiacenti con cache client'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Al mount e a ogni cambio mese il calendario prefetcha i payload dei mesi adiacenti (`precedente`, `successivo`, `/attivita`), rendendo il cambio mese servibile dalla cache client senza round-trip server in produzione.

      ## Read
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — dopo TASK-01: hook `useRouter`, effetto esistente su `token`, funzioni `mesePrecedente`/`meseSuccessivo` già importate.
      - `node_modules/next/dist/docs/01-app/02-guides/prefetching.md` — sezione "Manual prefetch" e l'esempio con `onInvalidate` (righe ~140-166); nota: il prefetching è attivo solo in produzione.
      - `node_modules/next/dist/docs/01-app/03-api-reference/04-functions/use-router.md` — firma `router.prefetch(href, { onInvalidate })`.
      - `node_modules/next/dist/docs/01-app/03-api-reference/05-config/01-next-config-js/staleTimes.md` — conferma che i payload da `router.prefetch` usano la finestra `static` (default 5 minuti): nessuna modifica a `next.config.ts` necessaria.

      ## Change
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — aggiungere un solo `useEffect` di prefetch; nessun'altra modifica.
      - Non-goal: NON toccare `next.config.ts` (niente `experimental.staleTimes`), NON aggiungere prefetch ai `<Link>` delle celle giorno o al link "Riepilogo mese". La pagina ADR è di TASK-06, non di questo task.

      ## Steps
      1. In `calendario-mensile.tsx` aggiungere: `useEffect(() => { const destinazioni = [`/attivita?mese=${mesePrecedente(token)}`, `/attivita?mese=${meseSuccessivo(token)}`, "/attivita"]; let annullato = false; for (const href of destinazioni) { const prefetch = () => { if (!annullato) router.prefetch(href, { onInvalidate: prefetch }); }; prefetch(); } return () => { annullato = true; }; }, [token, router]);` (il flag `annullato` replica il pattern della guida: nessun ri-prefetch dopo lo smontaggio o il cambio mese).

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0 (nessun nuovo errore di tipo).
      - Run: `npx eslint "src/app/(front-office)/attivita/calendario-mensile.tsx"`
      - Expect: nessun errore né warning (attenzione alle dipendenze dell'effetto: `token` e `router`).

      ## Done
      - [ ] AC-1 — In produzione i payload dei mesi adiacenti sono prefetchati e il cambio mese è servito dalla cache client (evidenza browser prodotta da TASK-05); il tempo percepito resta istantaneo anche su rete lenta.
      - [ ] `next.config.ts` non è stato modificato.

      ## Blockers
      Dipende da TASK-01 (l'effetto usa hook e import introdotti lì).
    ref: TASK-04
  - id: TASK-05
    title: '[FUORI PERIMETRO — vedi US-052] Nuovo e2e: cambio mese servito dalla cache prefetchata senza richieste di rete'
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-04
    body: |-
      ## Objective
      Uno spec Playwright prova con un oracolo di rete che, con server di produzione, il click su "Mese precedente" mostra le celle del mese adiacente senza emettere alcuna nuova richiesta per quel mese: il payload proviene dalla cache client prefetchata.

      ## Read
      - `tests/e2e/calendario-navigazione-reattiva.spec.ts` (da TASK-03) — setup dati e selettori da riusare.
      - `tests/e2e/support/date.ts`, `tests/e2e/support/fixtures.ts`, `tests/e2e/support/auth.ts` — mesi riservati, factory, login.
      - `playwright.config.ts` — `PLAYWRIGHT_WEB_SERVER_COMMAND` determina il server e2e (default `npm run dev`; produzione con `npm run start`): è la condizione dello skip.

      ## Change
      - Creare `tests/e2e/calendario-prefetch-mesi.spec.ts` (nuovo file, `test.describe("US-050 Prefetch mesi adiacenti")`).
      - Non-goal: nessuna modifica a config Playwright o spec esistenti; nessuna asserzione temporale in millisecondi (flaky per costruzione).

      ## Steps
      1. In testa al test: `test.skip(!(process.env.PLAYWRIGHT_WEB_SERVER_COMMAND ?? "").includes("start"), "Il prefetching di Next è attivo solo con il server di produzione");` — in CI (`npm run start`) il test gira sempre, in locale con `npm run dev` si auto-esclude in modo esplicito e motivato.
      2. Setup dati identico a TASK-03 ma con giorno diverso per chiarezza: `const mesePartenza = meseRiservato("US-050"); const meseArrivo = mesePassatoRiservato("US-050", 1); const data = dataNelMese(meseArrivo, 15);` più factory cliente/offerta e `createRigaAttivita` con ore `"2.00"` (la segregazione per collaboratore factory evita ogni interferenza con TASK-03 in `fullyParallel`).
      3. Registrare il contatore di rete PRIMA del `goto`: `const richiesteMeseArrivo: string[] = []; page.on("request", (richiesta) => { if (richiesta.url().includes(`mese=${meseArrivo}`)) richiesteMeseArrivo.push(richiesta.url()); });`.
      4. Login con `accediComeCollaboratore`, `await page.goto(`/attivita?mese=${mesePartenza}`);` e attesa event-driven del completamento del prefetch: `await page.waitForResponse((risposta) => risposta.url().includes(`mese=${meseArrivo}`) && risposta.ok());` (nessun hard wait: si attende l'evento di rete reale del prefetch).
      5. Registrare il conteggio: `const richiesteDopoPrefetch = richiesteMeseArrivo.length;` (atteso ≥1: il prefetch è partito).
      6. Click su `page.getByLabel("Mese precedente")` e asserzioni: cella `a[href="/attivita/${data}?mese=${meseArrivo}"]` visibile con testo `2.0 h` (mese renderizzato e valorizzato), `await expect(page).toHaveURL(new RegExp(`mese=${meseArrivo}`));`.
      7. Oracolo cache-hit: `expect(richiesteMeseArrivo.length).toBe(richiesteDopoPrefetch);` — nessuna nuova richiesta per `meseArrivo` dopo il click: il payload è arrivato dalla cache client (AC-1, tempo percepito istantaneo).

      ## Verify
      - Run: `npm run build && PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start" npx playwright test tests/e2e/calendario-prefetch-mesi.spec.ts` (da `/Users/smarello/repo/coaching-planner`)
      - Expect: 1 test passato (non skippato) senza retry consumati.
      - Run: `npx playwright test tests/e2e/calendario-prefetch-mesi.spec.ts`
      - Expect: 1 test skippato con la motivazione esplicita (comportamento atteso con server dev).
      - Run: `npm run lint`
      - Expect: eslint + guardrail anti-flakiness verdi.

      ## Done
      - [ ] AC-1 — Oracolo: dopo il prefetch atteso via `waitForResponse`, il click mostra le celle del mese adiacente valorizzate senza alcuna nuova richiesta di rete per quel mese (contatore invariato) e l'URL contiene il token.
      - [ ] Il test si auto-esclude con motivazione quando il server e2e non è di produzione e gira sempre in CI.
      - [ ] Solo entità factory e mesi riservati US-050; nessuna mutazione di entità seed; nessun `waitForTimeout`.

      ## Blockers
      Dipende da TASK-04 (il prefetch deve esistere) e da TASK-01. Prerequisito d'ambiente: build di produzione disponibile per l'esecuzione non-skippata (`npm run build`).
    ref: TASK-05
