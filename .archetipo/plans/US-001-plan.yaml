schema: archetipo/plan/v2
spec_code: US-001
body: |-
  # US-001: Scaffold dell'applicazione Next.js e ambiente di sviluppo — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-06-11

  ---

  ## Spec

  **Epic:** EP-000 — Fondazione del Progetto
  **Priorità:** HIGH | **Punti:** 2

  **Storia Utente**
  Come sviluppatore del progetto Coaching Planner, voglio un'applicazione Next.js (App Router) con TypeScript, Tailwind CSS e la struttura di cartelle prevista dall'architettura, così da poter sviluppare tutte le funzionalità successive su una base coerente e avviabile in locale.

  **Criteri di Accettazione**
  - [ ] L'applicazione Next.js 15 con TypeScript si avvia in locale e mostra una pagina iniziale
  - [ ] La struttura di cartelle prevista è presente: aree front office e back office, modulo di dominio, lib e components
  - [ ] Lint configurato e in esecuzione senza errori sul codice di partenza
  - [ ] Le variabili d'ambiente sono gestite tramite file locale non committato, con un file di esempio versionato

  ---

  ## Soluzione Tecnica

  Scaffold tramite `create-next-app` (Next.js 15, App Router, TypeScript, Tailwind CSS, ESLint, directory `src/`, alias `@/*`), poi adeguamento alla struttura feature-based definita nel PRD. Nessun database né autenticazione in questa spec: si predispongono solo le cartelle e i punti di estensione che le spec successive riempiranno.

  - Route group `(front-office)`, `(back-office)` e route `login/` sotto `src/app/`, con la pagina iniziale (`src/app/page.tsx`) come landing placeholder dell'applicazione.
  - Modulo di dominio `src/domain/consuntivi/` (vuoto, con `src/domain/types.ts`) separato dal framework, più `src/lib/` e `src/components/` come previsto dall'ADR-006 e dalla struttura di progetto del PRD.
  - Variabili d'ambiente: `.env.local` ignorato da git, `.env.example` versionato con i placeholder (`DATABASE_URL`, `AUTH_SECRET`) che le spec successive valorizzeranno.
  - ESLint con la configurazione Next.js (core-web-vitals + TypeScript); script `dev`, `build`, `lint`, `test`, `test:e2e` in `package.json`.
  - Cartelle `tests/unit` e `tests/e2e` predisposte con le rispettive configurazioni (Vitest e Playwright), come da stack di testing del PRD.

  ---

  ## Strategia di Test

  Spec di fondazione senza logica di business: la strategia verifica che l'ambiente sia sano e ripetibile, e mette in piedi l'infrastruttura di test che tutte le spec successive riuseranno.

  - Verifica strutturale: `npm run lint` e `npm run build` senza errori sul codice di partenza (criterio di accettazione diretto).
  - Setup Vitest con un test di fumo che dimostra che la toolchain unit (TypeScript + alias di import) funziona.
  - Setup Playwright con uno scenario e2e di fumo sull'avvio dell'applicazione.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright (indicato dal PRD; nessuna infrastruttura e2e esiste ancora, il setup è incluso come task)
  **Registrazione video:** solo scenario demo (da campo Dimostrazione della spec); gli altri scenari girano senza registrazione. Video salvato in `docs/test-results/US-001/`.

  | Scenario | Descrizione del flusso utente |
  |---|---|
  | Demo — Avvio applicazione (video) | Uno sviluppatore avvia l'app in locale, apre il browser sulla home e vede la pagina iniziale del Coaching Planner renderizzata correttamente |

  ---

  _Piano generato via ARchetipo Planning — 2026-06-11_
tasks:
  - id: TASK-01
    title: Scaffold Next.js 15 con TypeScript, Tailwind CSS ed ESLint
    description: Eseguire create-next-app con App Router, TypeScript, Tailwind CSS, ESLint, directory src/ e alias @/*. Verificare che l'app si avvii in locale con la pagina di default.
    type: Impl
    status: TODO
  - id: TASK-02
    title: Creare la struttura di cartelle prevista dall'architettura
    description: Creare i route group (front-office) e (back-office), la route login/, il modulo src/domain/consuntivi con src/domain/types.ts, src/lib, src/components e le cartelle tests/unit e tests/e2e. Sostituire la home di default con una pagina iniziale placeholder del Coaching Planner.
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
  - id: TASK-03
    title: Configurare la gestione delle variabili d'ambiente
    description: Versionare .env.example con i placeholder DATABASE_URL e AUTH_SECRET, verificare che .env.local sia escluso da git tramite .gitignore e documentare l'uso nel README.
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
  - id: TASK-04
    title: Verificare lint e build sul codice di partenza
    description: Completare gli script npm (dev, build, lint) ed eseguire npm run lint e npm run build assicurando zero errori su tutta la struttura creata.
    type: Impl
    status: TODO
    dependencies:
      - TASK-02
      - TASK-03
  - id: TASK-05
    title: Setup Vitest con test di fumo
    description: Installare e configurare Vitest (config con alias @/*), script npm test, e un test di fumo in tests/unit che dimostri il funzionamento della toolchain.
    type: Test
    status: TODO
    dependencies:
      - TASK-02
  - id: TASK-06
    title: Setup Playwright con scenario e2e demo e registrazione video
    description: Installare e configurare Playwright con supporto alla registrazione video limitata allo scenario demo, script npm test:e2e, e lo scenario di fumo che avvia l'app e verifica la pagina iniziale, con video salvato in docs/test-results/US-001/.
    type: Test
    status: TODO
    dependencies:
      - TASK-02
      - TASK-04
