  - id: TASK-05
    title: Spec e2e del dettaglio avanzamento espandibile nella pagina cliente (AC-1..AC-4)
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Uno spec Playwright deterministico prova in browser AC-1..AC-4 sulla pagina di dettaglio cliente con dati creati via factory.

      ## Read
      - tests/e2e/README.md — contratto anti-flakiness della suite
      - tests/e2e/dettaglio-avanzamento-offerta.spec.ts — helper da riprendere: `codiceUnivoco`, `testoLetterale`, `rigaOfferta`, `pulsanteDettaglio`, `dettaglioOfferta`, `indicatore`
      - tests/e2e/anagrafica-offerte.spec.ts — pattern di apertura del dettaglio cliente via `page.goto("/anagrafiche/clienti/{cliente.id}")` e tabella "Offerte del cliente"
      - tests/e2e/support/fixtures.ts e tests/e2e/support/factory.ts — `createClienteConOfferta`, `createCollaboratore`, `createRigaAttivita`
      - tests/e2e/support/auth.ts — `accediAlBackOfficeComeAdmin`
      - src/app/(back-office)/anagrafiche/clienti/[id]/offerte-cliente-tabella.tsx — aria-label e ruoli effettivi introdotti dal TASK-03

      ## Change
      - Nuovo file tests/e2e/dettaglio-avanzamento-offerta-cliente.spec.ts
      - Non-goal: NON modificare spec esistenti; NON usare entità seed (Giulia Conti, TechSolutions, DataFlow); NON usare hard wait, selettori su classi Tailwind o `selectOption({ index })`; `fullyParallel` invariato.

      ## Steps
      1. `beforeEach`: `accediAlBackOfficeComeAdmin(page)`.
      2. Scenario AC-1/AC-2: la factory crea cliente+offerta (codice univoco, 10 giorni previsti) e due collaboratori con nomi distinti, ognuno con una riga fatturabile da "16.00" ore su quell'offerta. `page.goto` sul dettaglio del cliente; attesa web-first su `getByRole("table", { name: "Offerte del cliente" })`. Click sulla riga (sul testo del codice) → region "Dettaglio avanzamento {codice}" visibile, chevron `aria-expanded` "true", badge "In corso", Previste 10 gg, Erogate 4 gg, Residuo 6 gg, "40%" e barra con `width: 40%`; per ciascun collaboratore riga con "16 h", "2 gg", "50%". Secondo click sulla riga → region con count 0 e chevron `aria-expanded` "false" (AC-2).
      3. Scenario AC-3: la factory crea cliente+offerta; apri il dettaglio cliente; verifica che la region abbia count 0; click su `getByRole("link", { name: "Modifica" })` della riga → `waitForURL` su `/anagrafiche/clienti/{cliente.id}/offerte/{offerta.id}` e form di modifica visibile (campo Codice valorizzato o heading della pagina). La navigazione diretta partendo da riga compatta prova che il click non è stato consumato dal toggle.
      4. Scenario AC-4: la factory crea cliente+offerta senza righe attività; click sulla riga → region con testo esatto "Nessuna attività registrata per questa offerta".

      ## Verify
      - Run: `npm run test:e2e -- dettaglio-avanzamento-offerta-cliente` (prerequisiti: Postgres attivo con `docker compose up -d`, browser con `npx playwright install`; il `webServer` di playwright.config.ts avvia l'app)
      - Expect: tutti gli scenari verdi
      - Run: `npm run lint`
      - Expect: passa, incluso il guardrail e2e anti-flakiness (baseline: verde)

      ## Done
      - [ ] AC-1, AC-2, AC-3, AC-4 provati in browser con oracoli osservabili (valori, messaggi, URL reali, nessun proxy)
      - [ ] Spec conforme al contratto anti-flakiness: fixtures factory, ruoli/label, expect web-first, `fullyParallel` invariato

      ## Blockers
      Dipende da TASK-03 (UI) e, per l'assetto finale del layer applicativo, da TASK-04.
    ref: TASK-05
