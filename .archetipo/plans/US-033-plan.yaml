schema: archetipo/plan/v2
spec_code: US-033
body: |-
  ## Soluzione Tecnica

  ### Approccio
  La US replica nella pagina di dettaglio cliente (`src/app/(back-office)/anagrafiche/clienti/[id]/page.tsx`) l'espansione di riga introdotta dalla US-032 nella pagina Offerte, riusando integralmente il componente `DettaglioAvanzamentoOfferta`. Tre mosse:

  1. **Layer applicativo** — oggi la pagina usa `elencaOffertePerCliente`, che restituisce entità Prisma grezze senza avanzamento. Si estrae da `elencaOfferteConAvanzamento` (`src/lib/offerte.ts`) un helper privato `costruisciVociElencoOfferte(offerte, righe)` (mappature, `calcolaAvanzamentoOfferte`, conteggio righe) e si aggiunge `elencaOffertePerClienteConAvanzamento(clienteId)` che interroga solo offerte e righe attività del cliente e ordina per codice, preservando l'ordine attuale della pagina. `elencaOfferteConAvanzamento` mantiene il suo ordinamento a gruppi: nessun cambiamento osservabile sulla pagina Offerte.
  2. **UI** — la tabella oggi inline nel Server Component diventa il componente client `offerte-cliente-tabella.tsx` (stesse 5 colonne: fuori perimetro rispettato) con lo stesso pattern di espansione di `offerte-tabella.tsx`: stato `offertaEspansaId`, riga cliccabile, bottone chevron accessibile (`aria-expanded`, `aria-label` "Dettaglio avanzamento {codice}"), seconda `<tr><td colSpan={5}>` che monta `DettaglioAvanzamentoOfferta` (import da `@/app/(back-office)/offerte/dettaglio-avanzamento-offerta`), `stopPropagation` sulla cella Azioni così il link Modifica naviga senza toccare l'espansione (AC-3). Stato vuoto e header di sezione restano nel Server Component.
  3. **Pulizia** — dopo l'aggancio, `elencaOffertePerCliente` resta senza consumatori e viene rimossa insieme ai suoi unit test (igiene del codice morto, come da prassi US-032).

  ### Decisioni chiave
  - **Riuso del componente US-032 senza spostarlo**: import cross-cartella dentro lo stesso route group; spostarlo in `src/components` sarebbe churn senza beneficio. Stessa semantica di region/aria-label, quindi gli e2e riusano gli stessi selettori.
  - **Nessuna fetch on-demand**: i dati del pannello viaggiano nel payload della pagina (volumi contenuti, stesso pattern US-032).
  - **Query dedicata filtrata** invece del riuso della query trasversale con filtro in memoria: evita di caricare offerte e righe di tutti i clienti e preserva l'ordinamento per codice della pagina.
  - **Nessun ADR**: si segue un pattern già stabilito; nessuna scelta tocca dati persistenti, sicurezza, confini di integrazione o politiche trasversali, quindi la soglia ADR non è superata.

  ### Mockup
  Non necessari: il pannello espanso riusa `DettaglioAvanzamentoOfferta` così com'è e le colonne dell'elenco non cambiano; nessuna nuova pagina, nessun nuovo componente con layout proprio, nessuna ristrutturazione. I mockup US-032 in `docs/mockups/US-032/` restano il riferimento visivo.

  ### Baseline (2026-07-16, workdir = project root)
  | Comando | Esito |
  |---|---|
  | `npx tsc --noEmit` | ✅ exit 0, nessun errore |
  | `npx vitest run tests/unit/elenca-offerte-con-avanzamento.test.ts tests/unit/offerte-dal-actions.test.ts` | ✅ 26 test verdi |
  | `npm run lint` | ✅ eslint + guardrail e2e anti-flakiness |
  | e2e Playwright | non eseguiti in baseline: richiedono Postgres locale; da eseguire nei task dedicati |

  Prerequisiti ambiente per i comandi e2e: database Postgres attivo (`docker compose up -d`), client Prisma generato (`npm run db:generate`, già eseguito dal `postinstall`), browser Playwright installati (`npx playwright install`); il `webServer` di `playwright.config.ts` avvia l'app automaticamente.

  ### Mappa delle evidenze di accettazione
  | AC | Livello | Oracolo osservabile | Fixture / stato di partenza | Task |
  |---|---|---|---|---|
  | AC-1 | e2e browser | click sulla riga in `/anagrafiche/clienti/{id}` → region "Dettaglio avanzamento {codice}" con badge "In corso", Previste 10 gg, Erogate 4 gg, Residuo 6 gg, "40%" con barra `width: 40%` e ripartizione per collaboratore (16 h, 2 gg, 50% ciascuno) | factory: cliente+offerta 10 gg, 2 collaboratori con 16h fatturabili ciascuno | TASK-05 |
  | AC-1 (dati) | unit | `elencaOffertePerClienteConAvanzamento` interroga solo il cliente indicato (`where { clienteId }` / `where { offerta: { clienteId } }`), espone `percentualeUtilizzo` e `perCollaboratore` coerenti col dominio e ordina per codice | mock Prisma (pattern del file esistente) | TASK-02 |
  | AC-2 | e2e browser | secondo click sulla riga espansa → region non più presente, chevron `aria-expanded` "false" | scenario AC-1 | TASK-05 |
  | AC-3 | e2e browser | con region assente, click su "Modifica" → URL `/anagrafiche/clienti/{id}/offerte/{offertaId}` con form di modifica visibile (navigazione diretta, click non consumato dal toggle) | factory: cliente+offerta | TASK-05 |
  | AC-4 | e2e browser | offerta senza righe: la region espansa mostra "Nessuna attività registrata per questa offerta" | factory: offerta senza attività | TASK-05 |

  ### Strategia di test
  - **Unit (Vitest)**: nuovi `it` in `tests/unit/elenca-offerte-con-avanzamento.test.ts` per la nuova query (filtri passati a Prisma, campi di avanzamento, ordinamento per codice, caso senza attività, guardia di ruolo). Il calcolo di dominio e la resa del pannello sono già coperti dalla US-032 e non cambiano.
  - **E2E browser (obbligatorio)**: il percorso di accettazione attraversa route/server boundary (pagina server-rendered e navigazione al form di modifica), autorizzazione admin e persistenza via factory: i livelli inferiori non possono provare gli esiti osservabili. Framework Playwright già presente: nessun setup infrastrutturale. Nuovo file `tests/e2e/dettaglio-avanzamento-offerta-cliente.spec.ts` conforme al contratto anti-flakiness (factory, ruoli e label, expect web-first, niente hard wait né selettori su classi).
  - **Regressione**: gli spec esistenti `anagrafica-offerte.spec.ts` e `demo__anagrafica-offerte.spec.ts` contano righe `tbody tr` e cliccano link nella tabella "Offerte del cliente" ora resa cliccabile: il gate finale esegue l'intera suite e2e a protezione.
  - **Demonstrates filmabile**: sì — flusso interamente UI (espansione, richiusura, navigazione a Modifica, caso vuoto). La registrazione della demo è di competenza di `archetipo-review`.

  ### Impatto Wiki
  Nessun nuovo ADR (soglia non superata, vedi Decisioni chiave). Dopo l'accettazione aggiornare `domains.offerte`: la vista annidata del cliente mostra l'avanzamento espandibile e `elencaOffertePerCliente` è sostituita da `elencaOffertePerClienteConAvanzamento`. Tocco marginale su `domains.clienti` (pagina di dettaglio arricchita) da valutare in review.

  ### Rischi
  - Il nome accessibile delle righe della tabella cliente ora include l'`aria-label` del bottone chevron: i selettori `getByRole("row", { name: ... })` esistenti usano match parziali e restano validi, ma la suite completa nel gate lo verifica.
  - La cella Azioni deve fermare la propagazione del click, altrimenti gli spec esistenti che cliccano "Modifica" aprirebbero l'espansione prima di navigare.
tasks:
  - id: TASK-01
    title: Query applicativa elencaOffertePerClienteConAvanzamento con helper condiviso
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `src/lib/offerte.ts` espone `elencaOffertePerClienteConAvanzamento(clienteId)` che restituisce `VoceElencoOfferta[]` del solo cliente indicato, ordinate per codice, riusando il calcolo di dominio senza duplicazioni.

      ## Read
      - src/lib/offerte.ts — `elencaOfferteConAvanzamento` (mappature, uso di `calcolaAvanzamentoOfferte`, conteggio righe), tipi `OffertaConCliente`, `RigaAttivitaConCollaboratore`, `VoceElencoOfferta`
      - src/domain/consuntivi/index.ts (righe 522-552) — tipi `RigaAvanzamento`, `VoceCollaboratoreAvanzamento`, `VoceAvanzamentoOfferta`

      ## Change
      - src/lib/offerte.ts — unica modifica consentita: estrazione dell'helper privato + nuova funzione esportata. NON toccare `src/domain/consuntivi` né il comportamento osservabile di `elencaOfferteConAvanzamento` (ordinamento a gruppi incluso). NON rimuovere ancora `elencaOffertePerCliente` (lo fa TASK-04).

      ## Steps
      1. Estrai dal corpo di `elencaOfferteConAvanzamento` un helper privato `costruisciVociElencoOfferte(offerte: OffertaConCliente[], righe: RigaAttivitaConCollaboratore[]): VoceElencoOfferta[]` che esegue: mappatura in `OffertaAvanzamento[]` e `RigaAvanzamento[]`, chiamata a `calcolaAvanzamentoOfferte`, costruzione della mappa degli avanzamenti, conteggio `numeroRighePerOfferta` e costruzione delle `voci`. L'ordinamento NON entra nell'helper: resta nei chiamanti.
      2. Riscrivi `elencaOfferteConAvanzamento` in termini dell'helper mantenendo query Prisma e sort a gruppi identici a oggi.
      3. Aggiungi `export async function elencaOffertePerClienteConAvanzamento(clienteId: string): Promise<VoceElencoOfferta[]>`: `await richiediRuoloApi("AMMINISTRATORE")`; `db.offerta.findMany({ where: { clienteId }, include: { cliente: true } })`; `db.rigaAttivita.findMany({ where: { offerta: { clienteId } }, include: { collaboratore: true } })`; costruzione voci con l'helper; sort finale `voci.sort((a, b) => a.codice.localeCompare(b.codice))` (stesso ordine per codice usato oggi dalla pagina cliente).
      4. JSDoc in italiano nello stile del file (accesso riservato all'amministratore, risultato interamente serializzabile).

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0, nessun errore (baseline: verde)
      - Run: `npx vitest run tests/unit/elenca-offerte-con-avanzamento.test.ts tests/unit/offerte-dal-actions.test.ts`
      - Expect: 26 test verdi come baseline

      ## Done
      - [ ] AC-1 — la query filtrata per cliente espone classificazione, giornate, percentuale e ripartizione (dati abilitanti)
      - [ ] AC-4 — offerta senza righe: percentuale 0, ripartizione vuota, residuo pari alle previste (dato abilitante)
      - [ ] `elencaOfferteConAvanzamento` invariata nel comportamento: i 26 test baseline restano verdi

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Unit test della query filtrata per cliente
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `elencaOffertePerClienteConAvanzamento` è coperta da unit test con oracoli sui valori reali restituiti e sui filtri passati a Prisma.

      ## Read
      - tests/unit/elenca-offerte-con-avanzamento.test.ts — mock hoisted di `@/lib/db` e `@/lib/dal`, builder `offertaConCliente` e `rigaConCollaboratore`
      - src/lib/offerte.ts — firma e ordinamento della nuova funzione (TASK-01)

      ## Change
      - tests/unit/elenca-offerte-con-avanzamento.test.ts — solo aggiunta di un nuovo `describe` con nuovi `it`; non modificare i test esistenti.

      ## Steps
      1. Importa `elencaOffertePerClienteConAvanzamento` accanto all'import esistente.
      2. Test filtri e campi: `mockOfferta.findMany` risolve un'offerta di `cli-1` da 10 giorni previsti (builder esistente) e `mockRigaAttivita.findMany` una riga fatturabile da 16 ore. Asserzioni: `mockOfferta.findMany` chiamata con `where: { clienteId: "cli-1" }`; `mockRigaAttivita.findMany` chiamata con `where: { offerta: { clienteId: "cli-1" } }`; la voce espone `percentualeUtilizzo` 0.2, `giornateErogate` 2 e `perCollaboratore` con un elemento (`oreErogate` 16, `giornateErogate` 2, nome del builder).
      3. Test ordinamento: il mock risolve offerte con codici in ordine sparso ("OFF-C", "OFF-A", "OFF-B") → le voci risultano ordinate per codice crescente.
      4. Test offerta senza attività: righe vuote → `percentualeUtilizzo` 0, `perCollaboratore` array vuoto, `residuo` pari a `giorniPrevisti`.
      5. Test guardia: `mockRichiediRuoloApi` rifiuta → la funzione rigetta e `mockOfferta.findMany` non viene chiamata.

      ## Verify
      - Run: `npx vitest run tests/unit/elenca-offerte-con-avanzamento.test.ts`
      - Expect: verdi tutti i test esistenti più i 4 nuovi (baseline del file: verde)

      ## Done
      - [ ] AC-1 — il contratto dati (filtro per cliente, percentuale, ripartizione, ordinamento per codice) è provato sui valori reali della funzione, senza proxy
      - [ ] AC-4 — il caso senza attività produce ripartizione vuota e percentuale 0

      ## Blockers
      Dipende da TASK-01.
    ref: TASK-02
  - id: TASK-03
    title: Componente client OfferteClienteTabella con righe espandibili e aggancio alla pagina
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Nella pagina di dettaglio cliente il click su una riga dell'elenco offerte espande sotto la riga il pannello `DettaglioAvanzamentoOfferta`, un secondo click la richiude e il link Modifica naviga senza toccare l'espansione.

      ## Read
      - src/app/(back-office)/anagrafiche/clienti/[id]/page.tsx — tabella inline attuale (righe 180-231), stato vuoto, `formattaEuro`
      - src/app/(back-office)/offerte/offerte-tabella.tsx — pattern di espansione US-032: stato `offertaEspansaId`, `<tr>` cliccabile, bottone chevron con `aria-expanded`/`aria-label`, `stopPropagation` sulle celle interattive, `Fragment` con riga espansa `colSpan`
      - src/app/(back-office)/offerte/dettaglio-avanzamento-offerta.tsx — props (`offerta: VoceElencoOfferta`), region e aria-label resi

      ## Change
      - Nuovo file src/app/(back-office)/anagrafiche/clienti/[id]/offerte-cliente-tabella.tsx — componente client `OfferteClienteTabella`
      - src/app/(back-office)/anagrafiche/clienti/[id]/page.tsx — aggancio della nuova query e del componente
      - Non-goal: NON cambiare le 5 colonne, l'intestazione di sezione, lo stato vuoto o il link "Nuova offerta"; NON aggiungere filtro, interruttore attiva/disattiva o eliminazione (fuori perimetro); NON modificare offerte-tabella.tsx né dettaglio-avanzamento-offerta.tsx.

      ## Steps
      1. Crea `offerte-cliente-tabella.tsx` ("use client") con `OfferteClienteTabella({ clienteId, offerte }: { clienteId: string; offerte: VoceElencoOfferta[] })`: sposta il markup della tabella dalla pagina (thead con le 5 colonne attuali, `aria-label` "Offerte del cliente" invariata) e il formattatore euro (la tariffa ora è string: `Number(offerta.tariffaGiornaliera)`; usa i campi `offertaId`, `codice`, `descrizione`, `tariffaGiornaliera`, `giorniPrevisti` di `VoceElencoOfferta`).
      2. Aggiungi `const [offertaEspansaId, setOffertaEspansaId] = useState<string | null>(null)` e per ogni offerta renderizza un `Fragment key={offerta.offertaId}` con: `<tr>` cliccabile (`onClick` con toggle stessa riga → null / altra riga → suo id, `cursor-pointer`, classi hover esistenti) e, quando espansa, `<tr><td colSpan={5} className="bg-zinc-100 p-0 dark:bg-zinc-800/50">` che monta `DettaglioAvanzamentoOfferta` importato da `@/app/(back-office)/offerte/dettaglio-avanzamento-offerta`.
      3. Nella cella Codice aggiungi il bottone chevron accessibile ripreso da `RigaOfferta` di offerte-tabella.tsx: `aria-expanded={espansa}`, `aria-label` "Dettaglio avanzamento {codice}", toggle con `e.stopPropagation()`, icona ruotata di 90° quando espansa.
      4. Sulla cella Azioni imposta `onClick={(e) => e.stopPropagation()}`: il link Modifica (href invariato `/anagrafiche/clienti/${clienteId}/offerte/${offerta.offertaId}`) naviga senza espandere né richiudere (AC-3).
      5. In `page.tsx` sostituisci import e chiamata: `elencaOffertePerClienteConAvanzamento(cliente.id)` al posto di `elencaOffertePerCliente(cliente.id)`; nel ramo `offerte.length > 0` monta `<OfferteClienteTabella clienteId={cliente.id} offerte={offerte} />`; rimuovi dalla pagina il markup della tabella e `formattaEuro` ora inutilizzato. Contatore "N offerte" e stato vuoto continuano a funzionare su `offerte.length`.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0 (baseline: verde)
      - Run: `npm run lint`
      - Expect: passa (baseline: verde)
      - Run: `npx vitest run`
      - Expect: nessun nuovo fallimento rispetto alla baseline

      ## Done
      - [ ] AC-1 — click sulla riga → pannello con classificazione, previste, erogate, residuo, percentuale con barra e ripartizione per collaboratore
      - [ ] AC-2 — secondo click sulla riga espansa → elenco compatto
      - [ ] AC-3 — link Modifica: navigazione al form senza toggle dell'espansione (propagazione fermata sulla cella Azioni)
      - [ ] AC-4 — offerta senza attività: il pannello mostra il messaggio dedicato (comportamento già interno a `DettaglioAvanzamentoOfferta`)

      ## Blockers
      Dipende da TASK-01 (tipo e query dei dati passati al componente).
    ref: TASK-03
