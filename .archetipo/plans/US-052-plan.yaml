      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — success handler e `router.refresh()`.
      - `src/app/(front-office)/attivita/calendario-cache-provider.tsx` — `invalidate`.
      - `tests/unit/righe-attivita-actions.test.ts` — asserzioni `revalidatePath`.

      ## Change
