      2. Generare la migrazione con `npx prisma migrate dev --name indice_calendario_collaboratore` sul database locale di sviluppo configurato.
      3. Ispezionare il SQL: deve contenere soltanto `CREATE INDEX` per le tre colonne nell'ordine dichiarato.
      4. Aggiornare la sezione DB del record performance con piano/tempo su cardinalità rappresentativa; non imporre un `Index Scan` su una tabella CI minuscola se PostgreSQL sceglie legittimamente un seq scan.

