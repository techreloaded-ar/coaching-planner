      - Expect: route e contratto tipizzano senza errori.
      - Run: `npm run build`
      - Expect: compare la route dinamica `/api/attivita/calendario` e il build passa.

      ## Done
      - [ ] AC-2 — Esiste un confine dati più piccolo della pagina RSC e conteggiabile dall'oracolo di rete.
      - [ ] AC-3 — La risposta non introduce una seconda cache HTTP con staleness implicita.
      - [ ] AC-4 — Il DTO contiene tutti e soli i dati necessari a ricostruire le celle esistenti.

      ## Blockers
      Dipende da TASK-02.
