  - id: TASK-11
    title: Prova zero-request, miss, race, history e misura il miglioramento
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-06
      - TASK-09
      - TASK-10
    body: |-
      ## Objective
      E2E production dimostrano l'esito utente e l'oracolo di rete completo; il record prestazionale confronta prima/dopo senza introdurre timing flaky nel gate.

      ## Read
      - `tests/e2e/calendario-navigazione-reattiva.spec.ts` — gate Promise e contratti US-050.
      - `tests/e2e/calendario-segregazione.spec.ts`, `tests/e2e/apertura-giorno-calendario.spec.ts`, `tests/e2e/calendario-etichette-clienti.spec.ts` — regressioni.
      - `tests/e2e/support/fixtures.ts`, `tests/e2e/support/date.ts`, `tests/e2e/README.md` — factory, mesi riservati e anti-flakiness.
      - `docs/test-results/US-052-calendario-performance.md` — baseline TASK-01.

      ## Change
      - Creare `tests/e2e/calendario-cache-mesi.spec.ts`.
      - Aggiornare `tests/e2e/calendario-navigazione-reattiva.spec.ts` per trattenere il GET dati invece della pagina RSC e rimuovere commenti stantii.
      - Aggiornare `docs/test-results/US-052-calendario-performance.md` con sezione `Dopo`, misure, versione, esito TTL e confronto.
      - Non mutare seed, non serializzare la suite, non aumentare retry e non usare `waitForTimeout`/`networkidle`.

      ## Steps
      1. Creare A/B/C con `meseRiservato("US-052")` e offset, collaboratore/cliente/offerta/righe factory univoche.
      2. Warm: attendere event-driven il prefetch B; dopo il gate contare/abortire sia GET endpoint sia RSC pagina per la destinazione e provare B→A con zero richieste, celle e URL corretti.
      3. Cold: usare un mese fuori dai due adiacenti, trattenere la GET con Promise; asserire vecchia griglia, overlay e busy prima del rilascio, poi nuovo dato/URL.
      4. Race: trattenere B/C, rilasciare C prima di B e provare che B tardiva non cambia etichetta, URL o celle C.
      5. Back/Forward: ripercorrere entry fresh con gli stessi abort di pagina/API e contenuto corretto.
      6. Mutazione: dal giorno factory crea o modifica una riga, torna al calendario e osserva la sintesi nuova; una entry invalidata non può mascherarla.
      7. Ripetere 20 alternanze warm e campioni cold su build production; registrare request count, p50/p95 e byte senza asserire una soglia temporale host-dependent. L'oracolo zero-request resta bloccante.
      8. Eseguire lint subito dopo gli e2e.

      ## Verify
      - Run: `npm run lint`
      - Expect: ESLint e guardrail anti-flakiness verdi.
      - Run: `PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start" npx playwright test tests/e2e/calendario-cache-mesi.spec.ts tests/e2e/calendario-navigazione-reattiva.spec.ts tests/e2e/apertura-giorno-calendario.spec.ts tests/e2e/calendario-segregazione.spec.ts tests/e2e/calendario-etichette-clienti.spec.ts --retries=0`
      - Expect: tutti gli scenari passano senza retry; warm/history hanno zero richieste pagina/API dopo il gate.
      - Run: `rg -n "Prima|Dopo|p50|p95|richieste|300" docs/test-results/US-052-calendario-performance.md`
      - Expect: record completo e confrontabile.

      ## Done
      - [ ] AC-2 — Oracolo: mese già visitato completo con RSC e GET abortiti/contati a zero.
      - [ ] AC-3 — Record con TTL effettivo, invalidazione, reload e misure prima/dopo.
      - [ ] AC-4 — Miss, indicatore, URL diretto, Back/Forward, race, celle e apertura giorno provati sul browser reale.
      - [ ] Solo factory/mesi riservati, `fullyParallel: true`, nessun hard wait o seed mutato.

      ## Blockers
      Dipende da TASK-04, TASK-06, TASK-09 e TASK-10.
    ref: TASK-11
