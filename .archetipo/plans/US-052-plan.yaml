    body: |-
      ## Objective
      Un endpoint GET restituisce il DTO del mese per il solo collaboratore autenticato, con validazione ed errori HTTP espliciti e senza cache HTTP condivisa.

      ## Read
      - `src/app/api/auth/google/callback/route.ts` — pattern Route Handler/NextResponse.
      - `src/lib/dal.ts` — `ErroreAutorizzazione` e risoluzione profilo.
