      ## Steps
      1. Leggere `mese` da `request.nextUrl.searchParams` e restituire 400 per assenza/formato invalido.
      2. Risolvere il profilo dalla sessione server; 401 per sessione assente e 403 per profilo assente/disattivato.
      3. Chiamare la query specializzata soltanto con `profilo.collaboratore.id` derivato dal DAL.
      4. Restituire il DTO JSON con header `Cache-Control: private, no-store` e `Vary: Cookie`.
      5. Mappare solo `ErroreAutorizzazione`; errori inattesi restano 500 senza dettagli sensibili.

      ## Verify
