      - `src/app/(front-office)/attivita/[data]/dettaglio-giornata.tsx` — invalidare `data.slice(0, 7)` dopo crea/modifica/elimina/rimozione trasferta e prima di `router.refresh()`.
      - `tests/unit/righe-attivita-actions.test.ts` — aggiornare tutte le aspettative d'invalidazione.
      - Non cambiare validazioni, autorizzazioni o messaggi delle action.

      ## Steps
      1. Aggiungere l'invalidazione pagina soltanto dopo il commit DB riuscito in ogni action.
      2. Consumare il context nel dettaglio e centralizzare un helper client `invalidaMeseERicarica` per evitare omissioni tra handler.
      3. Non invalidare su esiti `{success:false}` o eccezioni.
      4. Conservare l'invalidazione specifica del giorno e del riepilogo.
      5. Provare tutte le action, inclusa elimina/rimuovi che ricavano la data dal DB.

      ## Verify
      - Run: `npx vitest run tests/unit/righe-attivita-actions.test.ts`
      - Expect: tutti i test passano e ogni successo osserva anche `revalidatePath('/attivita')`; i fallimenti non invalidano.
      - Run: `npx tsc --noEmit`
      - Expect: exit 0.

      ## Done
      - [ ] AC-3 — Mitigazioni effettive: revalidation server e invalidazione provider sono entrambe provate e non confuse.
      - [ ] AC-4 — Il dettaglio continua a refreshare e il ritorno mostra la sintesi aggiornata.

      ## Blockers
      Dipende da TASK-07 e TASK-09.
