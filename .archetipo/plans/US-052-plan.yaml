  - id: TASK-07
    title: Crea il provider di cache mensile in memoria
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      L'area attività dispone di una cache per-sessione in memoria con seed, TTL 300 secondi, LRU 12, single-flight, prefetch, invalidazione e gestione sicura degli errori.

      ## Read
      - `src/app/(front-office)/layout.tsx` — confine layout esistente.
      - `src/app/(front-office)/attivita/page.tsx` e route figlie — punti che devono condividere la cache.
      - `src/lib/attivita-contract.ts` — DTO.
      - `node_modules/next/dist/docs/01-app/01-getting-started/04-linking-and-navigating.md` — Native History API; la cache non deve dipendere da API instabili.

      ## Change
      - Creare `src/app/(front-office)/attivita/calendario-cache-provider.tsx`.
      - Creare `src/app/(front-office)/attivita/layout.tsx` che risolve la sessione e monta il provider attorno alle route attività.
      - Non usare storage persistente, service worker, librerie cache, `experimental.staleTimes` o Cache Components.

      ## Steps
      1. Implementare un context con API stabili `seed`, `read`, `load`, `prefetch`, `invalidate`, `clear`; provider scoped alla sessione ricevuta dal layout.
      2. Mantenere Map dati e Map Promise in-flight in ref, non in stato globale di modulo; massimo 12 entry con LRU deterministico.
      3. Definire fresh TTL 300000 ms e clock iniettabile per i test; a fresh hit non chiamare loader.
      4. A entry stale restituire il dato immediatamente e avviare una sola revalidation; errore di prefetch non elimina un dato valido.
      5. Su 401/403 fare `clear` e segnalare al consumer la necessità di hard navigation; nessun dato di una sessione precedente sopravvive al provider.
      6. Rendere stabili i metodi context per non ridisegnare inutilmente le route figlie.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: provider e layout compilano senza trasformare il layout in un Client Component.
      - Run: `npm run build`
      - Expect: tutte le route attività restano compilabili; Cache Components resta disabilitato.

      ## Done
      - [ ] AC-2 — Una entry fresh è leggibile senza loader o rete.
      - [ ] AC-3 — TTL, LRU, scope memoria, single-flight, clear e invalidazione sono espliciti e non delegati al router Next.
      - [ ] AC-5 — Nessun flag globale di rendering viene abilitato.

      ## Blockers
      Dipende da TASK-02 per il DTO.
    ref: TASK-07
  - id: TASK-08
    title: Prova TTL, LRU, deduplica e invalidazione del provider
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Test deterministici con clock controllato dimostrano il confine reale della finestra fresh e tutte le semantiche della cache senza hard wait.

      ## Read
      - `src/app/(front-office)/attivita/calendario-cache-provider.tsx` — provider TASK-07.
      - `tests/unit/calendario.test.ts` — stile test del dominio calendario.

      ## Change
      - Creare `tests/unit/calendario-cache-provider.test.ts`.
      - Se necessario, estrarre la macchina cache pura nello stesso file provider o in `src/app/(front-office)/attivita/calendario-cache.ts`; non creare uno store globale.

      ## Steps
      1. Iniettare clock e loader controllabili; seed e lettura a `TTL-1` devono fare zero load.
      2. Portare il clock esattamente a TTL e provare una sola revalidation, registrando `cachedAt`, `expiresAt` ed età effettiva.
      3. Lanciare due load concorrenti dello stesso token e risolvere una sola Promise loader.
      4. Superare 12 mesi e provare l'espulsione LRU senza toccare la entry più recente.
      5. Invalidare uno o più token e provare che il load successivo va a rete.
      6. Simulare risposta vecchia/nuova fuori ordine: entrambe possono essere cachate per la propria chiave, ma l'API non decide quale mese è attivo.
      7. Coprire errore prefetch, retry esplicito e clear su cambio sessione/401.

      ## Verify
      - Run: `npx vitest run tests/unit/calendario-cache-provider.test.ts`
      - Expect: tutti i casi passano senza timer reali o hard wait.
      - Run: `npx tsc --noEmit`
      - Expect: exit 0.

      ## Done
      - [ ] AC-2 — Fresh hit provato con loader invocato zero volte.
      - [ ] AC-3 — Il bordo 300000 ms, l'età osservata, single-flight, LRU e invalidazione sono provati con oracoli sul dato restituito.

      ## Blockers
      Dipende da TASK-07.
    ref: TASK-08
  - id: TASK-09
    title: Porta la navigazione mese su cache dati e History API
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-07
      - TASK-08
    body: |-
      ## Objective
      Il calendario usa il DTO SSR come seed, prefetcha mesi adiacenti e naviga tra entry fresh senza RSC, preservando UI US-050, URL, Back/Forward e gestione dei click rapidi.

      ## Read
      - `src/app/(front-office)/attivita/page.tsx` — dati iniziali e stato profilo.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — `ultimaDestinazione`, `useTransition`, overlay, celle e link riepilogo.
      - `src/app/(front-office)/attivita/calendario-cache-provider.tsx` — API TASK-07.
      - `src/domain/calendario/index.ts` — token, etichetta e griglia pure.
      - Guide locali `04-linking-and-navigating.md` e `single-page-applications.md` — `pushState`/`replaceState` integrate nel router.

      ## Change
      - `src/app/(front-office)/attivita/page.tsx` — passare il DTO iniziale, non la griglia serializzata.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — source of truth client, cache load/prefetch, History API, popstate, timer/focus revalidation, errore accessibile e retry.
      - Impostare `prefetch={false}` sui 42 link giorno; non cambiare href, contenuto, classi o link riepilogo.
      - Non aggiungere `loading.tsx`, non chiamare `router.prefetch` e non abilitare config sperimentale.

      ## Steps
      1. Seminare/aggiornare il provider con il DTO SSR e derivare `etichetta`/`griglia` localmente con `useMemo`.
      2. Dopo il commit di un token, prefetcharne precedente e successivo; il click riusa la Promise in-flight se presente.
      3. Fresh hit: aggiornare token/sintesi e `pushState` nello stesso handler senza `router.push`, fetch o indicatore.
      4. Cold miss: mantenere griglia precedente, impostare `aria-busy`/overlay, caricare una sola GET, committare dato+URL solo se la destinazione è ancora l'ultima intenzione.
      5. Gestire Back/Forward con `popstate`; per entry evicted/stale usare lo stesso load senza creare una nuova history entry.
      6. Programmare revalidation del mese attivo alla scadenza e su focus/visibility; aggiornamento background senza cancellare la griglia.
      7. Su errore miss mostrare `role=alert` con retry, terminare busy e non lasciare URL/dato incoerenti; su 401/403 pulire e fare hard navigation.
      8. Conservare il comportamento del pulsante mese corrente e il token condivisibile; rimuovere commenti US-050 sul prefetch RSC ormai stantii.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0.
      - Run: `npm run lint`
      - Expect: ESLint e guardrail e2e verdi.
      - Run: `npm run build`
      - Expect: build verde e nessun Cache Components.

      ## Done
      - [ ] AC-2 — Il codice del fresh hit non invoca pagina, endpoint o router RSC.
      - [ ] AC-3 — Scadenza/focus provocano revalidation bounded e reload resta una lettura SSR fresca.
      - [ ] AC-4 — Griglia precedente, overlay, `aria-busy`, URL, celle, click rapidi e Back/Forward hanno contratti espliciti.

      ## Blockers
      Dipende da TASK-05, TASK-07 e TASK-08.
    ref: TASK-09
  - id: TASK-10
