schema: archetipo/plan/v2
spec_code: US-052
body: |-
  # US-052: Rivaluta il cambio mese senza round-trip quando il runtime prefetching sarà stabile — Piano di Implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-28

  ---

  ## Spec

  **Epic:** EP-005 — Evoluzioni Post-MVP
  **Priorità:** LOW | **Punti:** 5

  **Storia Utente**
  Come collaboratore, voglio che il passaggio da un mese all'altro del calendario mostri i dati senza attendere il server, così da consultare lo storico con la stessa immediatezza di un'applicazione locale.

  **Criteri di Accettazione**
  - AC-1 — Verificare sulla versione Next.js in uso che il runtime prefetching non sia più instabile; altrimenti registrare versione ed esito.
  - AC-2 — Il ritorno a un mese già visitato nella stessa scheda non produce richieste dati per quel mese.
  - AC-3 — La finestra di staleness è documentata e misurata con mitigazioni effettive.
  - AC-4 — Restano invariati griglia precedente durante il miss, indicatore di caricamento e URL `?mese=YYYY-MM`.
  - AC-5 — Se si adotta Cache Components, la regressione copre l'intera suite e2e.

  ### Nota di coerenza sul gate AC-1

  La verifica è già negativa sulla checkout corrente: `package.json` e il package installato riportano Next.js 16.2.9; `use-cache-private.md` è ancora `experimental` e dichiara il runtime prefetching non stabile, mentre `instant.md` è `draft` e usa `unstable_instant`. La via Cache Components/runtime prefetching resta quindi bloccata e non viene proposta.

  La richiesta corrente autorizza esplicitamente la valutazione di una via diversa con obiettivo prestazionale più ampio. Il piano tratta perciò AC-1 come gate a due rami: registra l'esito negativo, esclude ogni API instabile e procede con una soluzione indipendente dal runtime prefetching. Prima dell'implementazione o, al più tardi, prima dell'accettazione, il testo persistito della spec va riallineato sostituendo la frase «la spec resta bloccata» con «resta bloccata la via runtime prefetching; è ammessa l'alternativa framework-independent approvata dall'ADR». Il piano non dichiara stabilizzata una funzionalità che non lo è.

  ---

  ## Soluzione Tecnica

  Vale la pena cambiare approccio. Il risultato richiesto si ottiene con un'isola SPA limitata al calendario: SSR/RSC resta autorevole per primo ingresso, reload e URL diretto; dopo l'idratazione, i dati dei mesi vengono letti da un endpoint JSON autenticato e conservati in una cache esplicita in memoria della sola area attività. Il cambio URL usa la Native History API, supportata e integrata dal router nella documentazione locale di Next 16.2.9, quindi non avvia una navigazione RSC.

  ### Percorso caldo: zero round-trip sul mese già disponibile

  - Un provider client sotto un nuovo layout annidato `/attivita` conserva DTO mensili per l'utente autenticato. La cache non usa `localStorage`, `sessionStorage`, IndexedDB o service worker: vive solo nella memoria della scheda, sopravvive alle route figlie dell'area attività e viene distrutta da reload, logout o uscita dal layout.
  - Chiave effettiva: sessione del provider + token `YYYY-MM`; limite LRU di 12 mesi. Finestra fresh: 300 secondi. Entro la finestra, un ritorno A→B→A legge A sincronicamente e produce zero richieste sia a `/attivita` sia all'endpoint dati.
  - Dopo ogni commit di un mese, il provider prefetcha in background precedente e successivo tramite il vero endpoint dati. Richieste concorrenti per lo stesso token condividono una sola Promise; errori di prefetch sono silenziosi. Sul miss esplicito la griglia precedente e l'indicatore US-050 restano visibili.
  - Alla scadenza, la entry può essere mostrata immediatamente ma parte una sola revalidation in background; un timer sul mese attivo e la revalidation su focus/visibility delimitano davvero la staleness invece di controllarla soltanto alla navigazione successiva. Una risposta tardiva può popolare la propria entry, ma non può sovrascrivere l'ultima destinazione richiesta.
  - `window.history.pushState` registra il token soltanto quando il mese è pronto; `popstate` gestisce Back/Forward usando la stessa cache. Un URL diretto o un reload continua a passare da `page.tsx` e dal server.

  ### Contratto dati e sicurezza

  - Nuovo `GET /api/attivita/calendario?mese=YYYY-MM`: valida il token, deriva sempre il collaboratore dalla sessione server, non accetta alcun `collaboratoreId` dal browser e risponde con il solo DTO necessario al calendario. Risposte sensibili: `Cache-Control: private, no-store`; la staleness è governata esclusivamente dal provider client.
  - Il DTO condiviso contiene token e sintesi per giorno. Etichetta e griglia di 42 celle sono derivate nel client dalle funzioni pure già esistenti, riducendo il payload RSC iniziale e quello JSON.
  - 401/403 svuotano il provider e forzano un nuovo ingresso autenticato. Un miss fallito mantiene la griglia precedente, termina `aria-busy` e mostra un errore accessibile con retry.
  - Il percorso server iniziale riusa sessione e profilo già autorizzati invece di risolverli nuovamente dentro la query mensile. La lettura specializzata seleziona soltanto `data`, `ore`, `createdAt` e `cliente { id, ragioneSociale }`, usa un intervallo half-open e non carica intere entità Offerta/Cliente non usate dalla griglia.

  ### Percorso freddo e database

  `AttivitaPage` oggi esegue `verificaSessione`, `risolviProfiloCollaboratoreCorrente` e poi `attivitaDelMese`, che risolve nuovamente il profilo. Con la latenza SiteGround misurata di 51,4 ms per round-trip, letture logiche duplicate si sommano prima del rendering. Il piano passa la sessione già verificata al resolver profilo e l'ID collaboratore autorizzato alla read query specializzata. Inoltre aggiunge `@@index([collaboratoreId, data, createdAt])` a `RigaAttivita`, con migrazione Prisma, per sostenere filtro mensile e ordinamento.

  Le 42 celle restano link accessibili, ma ricevono `prefetch={false}`: sulla versione corrente il loro prefetch dinamico non trasporta i dati del giorno e compete inutilmente con il prefetch mensile esplicito.

  ### Invalidazione e consistenza

  - Le quattro server action (`creaRiga`, `modificaRiga`, `eliminaRiga`, `rimuoviTrasferta`) aggiungono `revalidatePath('/attivita')` alle invalidazioni esistenti di giorno e riepilogo.
  - Dopo ogni mutazione riuscita, `DettaglioGiornata` invalida nel provider il token `data.slice(0, 7)` prima di `router.refresh()`. `revalidatePath` protegge SSR/RSC; l'invalidazione esplicita protegge la cache custom. Nessuna delle due viene presentata come sostituto dell'altra.
  - Una modifica da altra scheda/dispositivo può restare invisibile per massimo 300 secondi; timer/focus provocano revalidation. Reload distrugge la cache e rilegge dal server. La durata effettiva e il bordo di scadenza vengono provati con clock controllato e registrati insieme alle misure browser.

  ### Alternative valutate

  - **Cache Components + `use cache: private`/runtime prefetch:** scartata perché ancora sperimentale/draft su Next 16.2.9 e perché il flag altera il rendering di tutte le route.
  - **`experimental.staleTimes.dynamic`:** scartata perché globale, sperimentale, non garantisce il payload dati sul mese freddo e non offre controllo locale affidabile della consistenza.
  - **Caricare precedente+corrente+successivo nel payload iniziale:** scartata come default perché aumenta TTFB, query e payload della prima pagina con dati forse inutilizzati; resta fallback solo se la misura dimostra che il prefetch post-idratazione arriva sistematicamente tardi.
  - **SWR/React Query:** scartati per questa singola read query: non sono installati e introdurrebbero dipendenza, bundle e semantica ulteriore senza un secondo consumatore.
  - **Cache persistente browser/service worker:** scartata per privacy, segregazione al cambio account e perché sopravviverebbe al reload, eliminando una mitigazione esplicita di AC-3.
  - **Solo indice/query DB:** utile per primo ingresso e miss, ma incapace di soddisfare AC-2 perché lascerebbe un round-trip a ogni ritorno.

  ### Decisioni Architetturali

  La scelta supera la soglia ADR: introduce un nuovo confine GET autenticato e una semantica di consistenza client con TTL, invalidazione ed error handling. Va creato `decisions/cache-client-calendario-collaboratore`, con contesto, opzione scelta, alternative, trade-off, finestra fresh di 300 secondi, LRU 12, assenza di storage persistente, invalidazioni, comportamento cross-tab e intenti di verifica. Nessuna decisione esistente copre questa scelta; `decisions/autorita-ruolo-dal` resta valida e viene soltanto riusata.

  ### Budget e misura

  Le soglie funzionali sono deterministiche e bloccanti; i tempi sono misure diagnostiche, non asserzioni CI fragili:

  - warm hit entro TTL: zero richieste dati a pagina/API e commit di etichetta+celle nello stesso giro evento; obiettivo diagnostico p95 < 50 ms;
  - cold miss client: una sola GET deduplicata all'endpoint e zero navigazioni RSC `/attivita`;
  - primo ingresso: nessuna duplicazione di sessione/profilo nel percorso pagina, payload senza griglia serializzata e TTFB p95 non peggiore di oltre il 10% rispetto alla baseline raccolta prima delle modifiche;
  - registrare su build production 20 campioni cold/warm, p50/p95, conteggio richieste e byte RSC/JSON in `docs/test-results/US-052-calendario-performance.md`; non trasformare la latenza host locale in un gate flaky.

  ---

  ## Baseline

  Eseguita il 2026-07-28 in `/Users/smarello/repo/coaching-planner`; `data.workdir` coincide con il project root.

  | Verifica | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npx vitest run tests/unit/attivita.test.ts tests/unit/righe-attivita-actions.test.ts tests/unit/calendario.test.ts` | Verde: 3 file, 79 test | I test focalizzati devono restare verdi. |
  | `npm test` | Verde: 37 file, 576 test | Il gate finale richiede l'intera suite verde. |
  | `npx tsc --noEmit` | Verde, exit 0 | Nessuna nuova diagnostica nei file modificati. |
  | `npm run lint` | Verde: ESLint e guardrail e2e anti-flakiness | Ogni nuovo/aggiornato e2e deve rispettare il contratto US-023. |
  | `npm run db:validate` | Verde: schema Prisma valido | Schema e migrazione devono restare validi. |
  | `npm run build` | Verde; Next 16.2.9; `/attivita` dinamica | Il piano non abilita Cache Components e il build deve restare verde. |
  | `PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start" npx playwright test tests/e2e/calendario-navigazione-reattiva.spec.ts tests/e2e/calendario-segregazione.spec.ts tests/e2e/calendario-etichette-clienti.spec.ts tests/e2e/apertura-giorno-calendario.spec.ts --retries=0` | Verde: 7 test su build production | Questi flussi sono la regressione minima del calendario. |

  Baseline strutturale: Next 16.2.9 dichiara ancora runtime prefetching non stabile; il ritorno a un mese emette oggi una nuova richiesta RSC. `RigaAttivita` non ha un indice su collaboratore/data. La latenza SiteGround già registrata è 51,4 ms per round-trip. Non vengono ripetuti gli esperimenti US-050 su `router.prefetch` o PPR.

  Prerequisiti: Node 22, dipendenze installate, Prisma Client generato, PostgreSQL locale; Playwright richiede `E2E_DATABASE_URL` dedicato e vuoto, Chromium installato e usa il proprio global setup. La CI esegue migrazioni/seed, lint, unit, build e intera suite e2e con `PLAYWRIGHT_WEB_SERVER_COMMAND="npm run start"`.

  ---

  ## Mappa delle Evidenze di Accettazione

  | Criterio | Stato iniziale / fixture | Livello | Oracolo osservabile | Task produttore |
  |---|---|---|---|---|
  | AC-1 | `next@16.2.9`, guide bundled della stessa versione | Verifica documentale riproducibile | Versione e righe `experimental`/`not yet stable` registrate; `next.config.ts` resta senza Cache Components e la soluzione non importa API runtime-prefetch | TASK-01 |
  | AC-2 | Collaboratore factory; A=`meseRiservato("US-052")`, B=`mesePassatoRiservato("US-052", 1)` con righe univoche | E2E Playwright production | Dopo A→B e l'attivazione del gate di rete, B→A mostra URL, etichetta e cella factory di A mentre ogni richiesta RSC `/attivita?mese=A` e GET endpoint per A viene abortita/contata: contatore zero | TASK-11 |
  | AC-3 | Cache con clock iniettato; mutazione factory; build production | Unit + E2E + ADR | A `TTL-1` il loader non parte; al bordo TTL parte una sola revalidation; mutazione propria invalida e forza una nuova lettura; reload rilegge dal server; il record prestazionale riporta durata e misure effettive | TASK-08, TASK-10, TASK-11, TASK-12 |
  | AC-4 | Test US-050 con mese freddo trattenuto; scenari Back/Forward e click rapidi | E2E Playwright | Durante il miss griglia precedente visibile, overlay e `aria-busy=true`; dopo risposta URL/celle corretti e indicatore nascosto; risposta tardiva non sovrascrive l'ultima destinazione; URL diretto e apertura giorno restano corretti | TASK-09, TASK-11 |
  | AC-5 | `next.config.ts` invariato, nessun Cache Components | Build + regressione | La condizione Cache Components è N/A motivata; build e suite completa e2e restano verdi, con tre esecuzioni consecutive come da contratto del repository | TASK-01, TASK-14 |

  Gli oracoli di rete contano sia il pathname pagina con header RSC sia `/api/attivita/calendario`; spostare i dati su un nuovo endpoint non può creare un falso positivo. I doppi trattengono o abortiscono la rete ma non sostituiscono pagina, provider, auth o database reali.

  ---

  ## Strategia di Test

  - Unit su read model e DAL: proiezione minima, intervallo half-open, ordine, aggregazione e assenza della risoluzione duplicata quando sessione/profilo sono già autorizzati.
  - Unit route handler: token invalido 400, sessione assente 401, profilo non operativo 403, DTO del solo collaboratore corrente, header `private, no-store`; nessun input di identità accettato.
  - Unit provider con clock e loader iniettati: seed, hit fresh senza loader, bordo TTL, single-flight, LRU 12, invalidazione, errori prefetch, clear su 401, risposte fuori ordine.
  - Browser e2e obbligatorio perché il percorso attraversa route, autenticazione, database, History API e Back/Forward. Factory e mesi riservati; `fullyParallel: true`; nessun seed mutato, hard wait, `networkidle`, retry aggiuntivo o selettore Tailwind.
  - Il miss usa Promise trattenute e rilasciate in `finally`; la race B/C rilascia C prima di B e asserisce l'ultima intenzione. Gli oracoli prestazionali bloccanti sono request count e contenuto, non millisecondi.
  - Dopo modifiche e2e: `npm run lint`. Il gate locale finale esegue la suite completa tre volte con `--retries=0`, senza serializzarla.

  ### Test E2E — Simulazione Utente

  **Framework:** Playwright 1.60, Chromium, `fullyParallel: true`
  **Demo video:** attesa — cache hit, miss con indicatore, Back/Forward e refresh dopo modifica sono filmabili; l'assenza di round-trip richiede comunque il log/oracolo di rete allegato da `archetipo-review`.

  | Scenario | Flusso utente |
  |---|---|
  | Warm A→B→A | Il collaboratore apre A, attende in modo event-driven il prefetch dati B, apre B e ritorna ad A con pagina/API interdette: A compare completa senza richieste. |
  | Cold miss e race | Naviga a un mese non prefetcheato: la griglia precedente resta visibile con indicatore; due click rapidi ricevono risposte invertite ma resta mostrata l'ultima destinazione. |
  | Back/Forward e URL diretto | I token visitati sono ripercorsi dalla history senza RSC quando fresh; un `goto` diretto e un reload continuano a mostrare il mese richiesto dal server. |
  | Invalidazione dopo mutazione | Crea/modifica/elimina nel dettaglio giorno, torna al calendario e vede il dato aggiornato; la vecchia entry non viene riusata. |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [domains/attivita, decisions/autorita-ruolo-dal, decisions/postgres-siteground]
    update: [domains/attivita]
    create: [decisions/cache-client-calendario-collaboratore]
  ```

  `wiki affected` ha restituito anche pagine che co-citano DAL o schema. Le loro affermazioni restano corrette: l'autorità sul ruolo non cambia, il provider PostgreSQL non cambia e l'indice non altera la decisione di hosting. Solo `domains/attivita` cambia semanticamente. La nuova ADR e l'aggiornamento dominio hanno task dedicati.

  Nessun mockup: non nasce una nuova pagina, non cambia il layout e l'unica aggiunta visiva è un errore inline nel componente esistente.

  ---

  _Piano generato via ARchetipo Planning — 2026-07-28_
tasks:
  - id: TASK-01
    title: Registra il gate framework e la baseline prestazionale di US-052
    type: Test
    status: DONE
    body: |-
      ## Objective
      Esiste un record riproducibile che prova lo stato ancora instabile del runtime prefetching su Next 16.2.9, blocca la sola via Cache Components e fissa la baseline prima di implementare l'alternativa indipendente.

      ## Read
      - `package.json` — versione Next fissata.
      - `node_modules/next/dist/docs/01-app/03-api-reference/01-directives/use-cache-private.md` — stato experimental e dipendenza da runtime prefetching.
      - `node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/02-route-segment-config/instant.md` — stato draft/unstable.
      - `src/app/(front-office)/attivita/page.tsx`, `src/lib/dal.ts`, `src/lib/attivita.ts` — percorso query attuale.
      - `docs/siteground-postgres-connectivity-spike.md` — latenza DB già misurata.

      ## Change
      - Creare `docs/test-results/US-052-calendario-performance.md` con sezione `Prima`: versione, fonti locali, esito gate, conteggio strutturale delle letture duplicate, assenza indice, richiesta RSC sul ritorno e campioni production pre-modifica.
      - Non modificare `package.json`, `next.config.ts` o le guide bundled; non ripetere gli esperimenti `router.prefetch`/PPR di US-050.

      ## Steps
      1. Registrare `next@16.2.9` dal manifest e dal package installato.
      2. Citare nel record le righe locali che marcano `use cache: private` experimental/runtime non stabile e `unstable_instant` draft.
      3. Dichiarare bloccata la via framework e selezionata l'alternativa del piano, con la nota di riallineamento testuale di AC-1.
      4. Contare le chiamate logiche sessione/profilo/query nel cold path e riportare la latenza SiteGround già misurata, senza contattare il database remoto.
      5. Su build production raccogliere 20 campioni iniziali/cambio mese, request count, p50/p95 e byte RSC; i tempi sono diagnostici, l'oracolo bloccante è la presenza della richiesta.

      ## Verify
      - Run: `node -p "require('./node_modules/next/package.json').version"`
      - Expect: `16.2.9`.
      - Run: `rg -n "version: experimental|not yet stable|version: draft|unstable_instant" node_modules/next/dist/docs/01-app/03-api-reference/01-directives/use-cache-private.md node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/02-route-segment-config/instant.md docs/test-results/US-052-calendario-performance.md`
      - Expect: il record contiene fonti ed esito senza dichiarare stabile il runtime.

      ## Done
      - [ ] AC-1 — Versione ed esito negativo sono registrati; Cache Components/runtime prefetching sono esclusi dall'implementazione.
      - [ ] AC-5 — `next.config.ts` resta invariato e la condizione Cache Components è documentata come non applicabile all'alternativa.
      - [ ] La sezione `Prima` contiene request count e campioni confrontabili con il dopo.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Introduci il DTO calendario e la lettura mensile autorizzata senza risoluzioni duplicate
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il primo rendering e l'endpoint futuro ottengono una sintesi mensile minima usando sessione e collaboratore già autorizzati, senza rieseguire la catena sessione/profilo dentro la query.

      ## Read
      - `src/lib/dal.ts` — `verificaSessione`, `richiediSessioneApi`, `risolviProfiloCollaboratoreCorrente`.
      - `src/lib/attivita.ts` — tipi sintesi, `attivitaDelMese` e aggregazione corrente.
      - `src/app/(front-office)/attivita/page.tsx` — ordine sessione/profilo/query e serializzazione.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — tipo `SintesiGiorno` consumato dal client.

      ## Change
      - Creare `src/lib/attivita-contract.ts` come contratto client-safe per `SintesiClienteGiorno`, `SintesiGiorno` e `DatiCalendarioMese`.
      - `src/lib/dal.ts` — consentire a `risolviProfiloCollaboratoreCorrente` di riusare una `SessioneUtente` già verificata, mantenendo invariato il comportamento senza argomento.
      - `src/lib/attivita.ts` — aggiungere `datiCalendarioMesePerCollaboratoreAutorizzato(token, collaboratoreId)` con select minimo, range `gte`/`lt`, ordine data/createdAt e aggregazione condivisa; non accettare l'ID dal browser.
      - `src/app/(front-office)/attivita/page.tsx` — passare la sessione già verificata al resolver e l'ID del profilo alla nuova query.
      - `src/app/(front-office)/attivita/calendario-mensile.tsx` — aggiornare il solo import type al contratto condiviso.
      - Non cambiare i contratti di `attivitaDelMese`, `righeDelGiorno` o riepilogo usati altrove.

      ## Steps
      1. Estrarre i tipi serializzabili senza import server-only e mantenere re-export compatibili se necessari.
      2. Estrarre l'aggregatore giornaliero in helper riusabile che preserva ordine cliente, somma ore e numero righe.
      3. Implementare la query specializzata selezionando solo `data`, `ore`, `createdAt` e `cliente.id/ragioneSociale`; usare fine esclusiva al primo giorno del mese successivo.
      4. Far riusare a `AttivitaPage` la sessione e il profilo già risolti; nessun wrapper può fidarsi di un collaboratore proveniente da search params/body.
      5. Conservare token invalido e profilo non operativo con gli stessi esiti UI attuali.

      ## Verify
      - Run: `npx tsc --noEmit`
      - Expect: exit 0 e nessuna diagnostica nei file modificati.
      - Run: `npx vitest run tests/unit/attivita.test.ts tests/unit/dal-guards.test.ts`
      - Expect: baseline esistente verde in attesa dei test specifici di TASK-03.

      ## Done
      - [ ] AC-2 — Esiste il DTO serializzabile e autorizzato che alimenterà cache/API senza payload RSC completo.
      - [ ] AC-4 — Sintesi, ordine clienti, ore e comportamento profilo restano invariati.
      - [ ] Il percorso pagina non risolve una seconda volta sessione/profilo dentro la query mensile.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Copri read model e riuso del contesto autorizzato
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Test unitari provano proiezione minima, aggregazione e assenza delle risoluzioni duplicate senza nascondere i filtri per collaboratore e mese.

      ## Read
      - `tests/unit/attivita.test.ts` — mock Prisma e casi `attivitaDelMese`.
      - `tests/unit/dal-guards.test.ts` — contratti delle guardie e del profilo.
      - `src/lib/attivita-contract.ts`, `src/lib/attivita.ts`, `src/lib/dal.ts` — implementazione TASK-02.

      ## Change
      - `tests/unit/attivita.test.ts` — nuovi casi per `datiCalendarioMesePerCollaboratoreAutorizzato`.
      - `tests/unit/dal-guards.test.ts` — caso con sessione prevalidata che non richiama nuovamente il resolver sessione.
      - Non indebolire né rimuovere i test esistenti.

      ## Steps
      1. Asserire il `where` con `collaboratoreId`, `gte` e `lt`, il select minimo e l'ordine `data, createdAt`.
      2. Provare aggregazione di più offerte dello stesso cliente, più clienti e ordine di prima apparizione.
      3. Provare token invalido senza query e risultato vuoto.
      4. Provare che una sessione fornita al resolver profilo evita la seconda lettura sessione ma continua a leggere e verificare il profilo.
      5. Mantenere osservabile il DTO restituito, non soltanto le chiamate ai mock.

      ## Verify
      - Run: `npx vitest run tests/unit/attivita.test.ts tests/unit/dal-guards.test.ts`
      - Expect: tutti i test passano e i nuovi casi asseriscono contenuto e filtri.
      - Run: `npx tsc --noEmit`
      - Expect: exit 0.

      ## Done
      - [ ] AC-2 — Il contratto dati destinato alla cache è provato con contenuto reale osservabile.
      - [ ] AC-4 — Aggregazione e segregazione restano identiche al calendario esistente.

      ## Blockers
      Dipende da TASK-02.
