  summary: 'Promemoria email di fine mese ai collaboratori attivi. Invio via SMTP SiteGround con nodemailer (unica nuova dipendenza, ^10.2.1, con lockfile coerente) in src/lib/email.ts: con E2E_TEST_MODE l''invio è simulato, con configurazione assente restituisce false, i log riportano solo name/code dell''errore e EMAIL_DESTINATARIO_DI_PROVA dirotta tutte le email (pensata per locale e staging). L''orchestrazione in src/lib/promemoria-fine-mese.ts ha due modalità. AUTOMATICA: parte solo se oggi, nel fuso Europe/Rome, è l''ultimo giorno lunedì–venerdì del mese, e prenota (collaboratoreId, mese) nella nuova tabella PromemoriaFineMeseInviato. Con PK composta un P2002 conta come già inviato; se l''invio fallisce la prenotazione viene cancellata, così il cron ritenta. MANUALE: invia subito a tutti, senza registro. I destinatari sono Collaboratore.attivo AND Utente.attivo, all''indirizzo Utente.email, senza leggere RigaAttivita. La route GET /api/cron/promemoria-fine-mese risponde 401 se CRON_SECRET è vuoto o il bearer è errato. Il proxy la classifica come cron-public e vercel.json la pianifica alle 07:00 UTC dal 26 al 31 di ogni mese. Nel report /report/fatturazione-clienti c''è il pulsante ''Invia promemoria di fine mese'' (Server Action con richiediRuoloApi AMMINISTRATORE) con un banner role=status ''Promemoria inviati: N. Non riusciti: M.''. Le variabili d''ambiente sono documentate in .env.example. Migration dedicata con la sola nuova tabella; seed invariato. Tasks: 10/10 DONE. Evidenze raccolte in review il 2026-10-27: tsc --noEmit exit 0; npm test 59 file / 873 test passati; npm run lint exit 0 con i soli warning noti ''chiave riservata non risolvibile staticamente'' e il guardrail e2e passato; e2e tests/e2e/promemoria-fine-mese.spec.ts 3/3 passati con --repeat-each=3 --retries=0 sul DB dedicato coaching_planner_e2e. Video demo registrato e passato: docs/test-results/US-019/demo__promemoria-fine-mese-92d9d--dal-report-di-fatturazione-chromium/video.webm. Il fotogramma finale mostra ''Promemoria inviati: 2. Non riusciti: 0.'' (i 2 collaboratori attivi del seed). La review ha aggiunto il file demo tests/e2e/demo__promemoria-fine-mese.spec.ts. Valutazione statica della CI (.github/workflows/ci.yml), verdetto: passerebbe. npm ci: lockfile coerente, e nodemailer 10 compila senza @types (tsc verde). prisma migrate deploy: migration applicata con successo sul DB e2e. seed: invariato ed eseguito senza errori. lint: verde. unit: verdi. build: non eseguito, rischio basso perché i tipi passano e le variabili SMTP/CRON sono lette solo a runtime. e2e: in CI E2E_TEST_MODE=true, il test non muta entità del seed e non asserisce conteggi fissi. Gate Wiki: non applicato, perché wiki.enabled è false nel config; il piano dichiara correttamente wiki_impact vuoto e nessuna pagina Wiki è stata toccata.'
  criteria:
    - id: AC-1
      verdict: met
      note: 'L''ultimo giorno lavorativo ogni collaboratore attivo riceve automaticamente l''email al proprio indirizzo. Unit dominio: ultimoGiornoLavorativoDelMese salta sabato e domenica (2026-10 ⇒ 30, 2027-02 ⇒ 26, 2026-05 ⇒ 29). giornoCivile è testato in ora solare e legale. Unit orchestrazione: il 2026-10-31 (sabato) non c''è nessuna query; il 2026-10-30 c''è un invio per collaboratore all''Utente.email. Unit route: 401 senza header, con secret errato o con CRON_SECRET vuoto; 200 con modalita AUTOMATICA. vercel.json: ''0 7 26-31 * *''. L''esecuzione reale di Vercel Cron (solo sui deploy di produzione) e la consegna SMTP non sono verificabili dagli artifact: richiedono CRON_SECRET e SMTP_* configurati su Vercel. Le festività infrasettimanali non sono gestite (assunzione dichiarata nel piano). Se il cron dell''ultimo giorno lavorativo fallisce, nei giorni successivi non ritenta (non sono più l''ultimo giorno lavorativo).'
    - id: AC-2
      verdict: met
      note: 'contenutoEmailPromemoriaFineMese: l''oggetto è ''Promemoria di fine mese: coaching planner e fattura di {mese}''. Il testo ha il saluto per nome, l''invito a completare la compilazione del coaching planner del mese e a emettere la fattura, e il link NEXT_PUBLIC_APP_URL + /attivita (senza slash doppio). Coperto da unit. Solo testo, niente HTML (fuori scope dichiarato). Se NEXT_PUBLIC_APP_URL manca, il link punta a http://localhost:3000, come le altre route.'
    - id: AC-3
      verdict: met
      note: 'L''orchestrazione legge solo collaboratore.findMany e non legge RigaAttivita: l''invio va a tutti gli attivi restituiti, indipendentemente dalle attività (unit con db mockato senza rigaAttivita).'
    - id: AC-4
      verdict: met
      note: 'Filtro where { attivo: true, utente: { attivo: true } }, la stessa definizione del DAL, verificato in unit sulla chiamata a findMany. Nel video demo l''esito è 2 inviati: Giulia e Marco, i soli collaboratori attivi del seed.'
    - id: AC-5
      verdict: met
      note: 'La tabella PromemoriaFineMeseInviato ha PK composta (collaboratoreId, mese) e FK ON DELETE CASCADE (migration 20261027142342). In automatico la riga si prenota prima dell''invio: con P2002 conta come giaInviati e salta; se l''invio fallisce la prenotazione viene cancellata così il cron ritenta; gli altri errori del DB vengono rilanciati (unit). Vale solo per l''invio automatico, come dice il criterio: l''invio manuale non usa il registro, quindi un collaboratore può ricevere sia il manuale sia l''automatico nello stesso mese.'
    - id: AC-6
      verdict: met
      note: 'Il pulsante ''Invia promemoria di fine mese'' sta nell''intestazione di /report/fatturazione-clienti, con l''avviso ''Invia subito l''email a tutti i collaboratori attivi''. La Server Action inviaPromemoriaFineMeseOra chiama richiediRuoloApi(''AMMINISTRATORE''); in unit, senza ruolo nessun invio. Fa redirect con promemoriaInviati e promemoriaFalliti. Il banner role=status è verde se i falliti sono 0, ambra altrimenti, e i parametri non numerici vengono ignorati. E2E: 3/3 passati. Video demo registrato e passato, il fotogramma finale mostra ''Promemoria inviati: 2. Non riusciti: 0.''.'
  minor_findings:
    - 'Le modifiche non sono committate: worktree.enabled=false e non c''è un branch per la spec. Il lavoro di US-019 è nel working tree di main insieme a modifiche estranee: .archetipo/specs/US-020.yaml, .archetipo/plans/US-020-plan.yaml, docs/mockups/US-020/, le nuove spec US-066…US-071 e .archetipo/preview.json. Al commit vanno separate.'
    - 'Il piano prevedeva npm install -D @types/nodemailer: non è stato aggiunto. Non serve, perché tsc --noEmit passa con nodemailer 10.2.1. Scostamento dal piano senza impatto.'
    - eDoppione riconosce P2002 dal solo campo code invece di usare instanceof Prisma.PrismaClientKnownRequestError come indicato nel piano. Funziona ed è testato; scostamento minore.
    - La route cron confronta Authorization con !== invece di un confronto a tempo costante. Il rischio è basso per un secret random di 32 byte; si può migliorare con crypto.timingSafeEqual.
    - 'Il comando build (npm run build) non è stato eseguito in review: la valutazione CI è statica come da AGENTS.md. tsc, lint, unit ed e2e mirati sono verdi.'
    - 'Per la registrazione della demo la review ha usato un E2E_DATABASE_URL esportato solo nella shell, che punta al DB dedicato coaching_planner_e2e: in locale E2E_DATABASE_URL coincide con DATABASE_URL e la guardia di sicurezza e2e rifiuta l''esecuzione. .env non è stato letto né modificato.'
    - 'Rischi operativi dichiarati nel piano: in locale e in staging senza EMAIL_DESTINATARIO_DI_PROVA il pulsante scrive ai collaboratori reali (avviso presente in .env.example); SiteGround può limitare le email orarie; sul piano Hobby di Vercel l''orario del cron è approssimato all''ora.'
    - 'Wiki (informativo, non bloccante perché wiki.enabled=false): se la Wiki verrà riattivata, servono l''ADR decisions/promemoria-email-fine-mese, l''aggiornamento di operations/deploy-vercel-siteground (variabili SMTP_*, EMAIL_MITTENTE, CRON_SECRET, EMAIL_DESTINATARIO_DI_PROVA, Vercel Cron), di domains/identita-accesso (/api/cron/* pubblico e autorizzato con CRON_SECRET), di domains/fatturazione-clienti (pulsante di invio) e la mappatura della capability promemoria-fine-mese in engineering/code-map.'
