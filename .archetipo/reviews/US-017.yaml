  summary: 'Nuova pagina /report/marginalita riservata all''amministratore (voce "Marginalità" in sidebar). Con due campi mese ("Dal mese"/"Al mese", query ?da=YYYY-MM&a=YYYY-MM, estremi scambiati se invertiti) mostra per ogni cliente e per ogni offerta ricavi (giornate fatturabili × tariffa offerta), costi (giornate fatturabili × tariffa del collaboratore) e margine con percentuale, più i totali del periodo. I rimborsi trasferta sono esclusi. I margini negativi sono in rosso con badge testuale "Margine negativo". Dominio: calcolaMarginalitaClienti e normalizzaPeriodoMesi; lettura in reportMarginalitaPeriodo (src/lib/report.ts). Tutti i 6 task del piano sono DONE. Evidenze: 15 unit test nuovi (inclusa la coerenza al centesimo con calcolaReportFatturazioneClienti e calcolaRiepilogoMese), 2 e2e nuovi passati anche con --repeat-each=3, 1 demo e2e registrato (docs/test-results/US-017/demo__analisi-marginalita--292c4--e-vede-il-margine-negativo-chromium/video.webm). Suite finale: unit 792/792, build ok con route /report/marginalita, e2e completa 193 passed. Layout aderente ai mockup in docs/mockups/US-017/ (la barra proporzionale ricavi/costi del mockup non è stata implementata perché non richiesta dagli AC). Wiki non abilitata (wiki.enabled=false): nessun impatto Wiki. Stato ricontrollato in questa esecuzione: spec in REVIEW, task tutti DONE, tsc verde, unit di marginalità 15/15.'
