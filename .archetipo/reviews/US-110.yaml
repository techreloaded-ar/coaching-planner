    - PERMESSI_BACK_OFFICE include GESTIRE_ABILITAZIONI, GESTIRE_COLLABORATORI e GESTIRE_RIGHE_SOSPESE, che non hanno una voce in sidebar. Un futuro ruolo con solo uno di questi permessi entrerebbe nel back office e vedrebbe l'etichetta «Amministrazione» senza alcuna voce di navigazione. Oggi non succede con i ruoli esistenti ed è fuori perimetro, ma conviene tenerne conto quando arriverà un ruolo parziale (per esempio la voce Righe sospese).
    - 'Video demo non registrato pur con e2e.record_demo_video true: lo spec è tecnico e la UI dei ruoli reali è invariata per definizione. Se il revisore lo vuole, si può registrare uno scenario amministratore/collaboratore della sidebar.'
