      note: 'risolviCollaboratoreConsultato, collaboratoriDelSelettore e verificaAccessoDatiCollaboratore richiedono CONSULTARE_FOGLI_ATTIVITA_ALTRUI. Senza permesso: 403 sulle API (giornata, calendario, contesto-inserimento, offerte-cliente tramite risolviCollaboratoreDelFoglio) e sulle Server Action di scrittura (righe-attivita.ts), redirect al proprio foglio nelle pagine RSC tramite collaboratoreConsultatoDellaPagina. Coperto da tests/unit/foglio-attivita.test.ts (describe «permesso di consultare i fogli altrui», con insiemi fittizi anche con ruolo AMMINISTRATORE privo del permesso) e dall''e2e foglio-attivita-amministratore.spec.ts (collaboratore → redirect su /attivita e 403 dall''API giornata, Demonstrates 4).'
    - id: AC-6
