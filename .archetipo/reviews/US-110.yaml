    - id: AC-7
      verdict: met
      note: 'PERMESSI_PER_RUOLO non cambia (AMMINISTRATORE = tutti, COLLABORATORE = nessuno), quindi il comportamento per i due ruoli reali resta lo stesso. Il menu account usa ancora il ruolo per l''etichetta, come prevede l''out of scope. Suite rieseguite in questa review: vitest 1261/1261 verdi, Playwright 308/308 verdi con la build di produzione; sidebar.spec.ts verifica le voci esatte di amministratore e collaboratore (Demonstrates 3-4).'
  minor_findings:
