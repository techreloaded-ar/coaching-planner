  summary: 'US-110 sposta su permessi le ultime decisioni ancora prese sul ruolo. Il catalogo di dominio ora espone PERMESSI_BACK_OFFICE e haAccessoBackOffice (tutti i permessi tranne CONSULTARE_FOGLI_ATTIVITA_ALTRUI). Il layout del back office usa la nuova guardia richiediAccessoBackOffice nel DAL, che reindirizza a /attivita chi non ha alcun permesso di back office. Le voci di amministrazione della sidebar sono state spostate nel modulo puro src/app/navigazione-amministrazione.ts, ognuna con il permesso della pagina di destinazione (corrispondenza verificata con richiediPermesso nelle 8 pagine). gruppiAmministrazioneVisibili elimina i gruppi vuoti insieme al titolo, e l''etichetta «Amministrazione» dipende da haAccessoBackOffice. Il foglio attività altrui (API, Server Action, pagine RSC) e il selettore nel titolo del front office dipendono da CONSULTARE_FOGLI_ATTIVITA_ALTRUI; il link a Persone nello stato del profilo dipende da GESTIRE_UTENTI. Task 7/7 DONE. Il diff è sul working tree di main, non committato: 14 file modificati e 3 nuovi non tracciati (src/app/navigazione-amministrazione.ts, tests/unit/navigazione-amministrazione.test.ts, tests/unit/layout-front-office.test.ts). Totale +308/-111 sui file tracciati. Evidenze rieseguite in questa review: vitest 87 file / 1261 test passati; npm run lint verde, guardrail e2e incluso; tsc --noEmit pulito sui sorgenti (gli unici errori vengono da tipi stale in .next/dev, generati e non pertinenti); Playwright completo 308 passed in 1.3m con la build di produzione (npm run build && npm run start), senza flaky. L''e2e è stato lanciato sul Postgres della sandbox ARchetipo del checkout, con il database dedicato coaching_planner_e2e: in locale E2E_DATABASE_URL coincide con DATABASE_URL e il Postgres su :5432 non è attivo. Valutazione statica della CI (.github/workflows/ci.yml): passerebbe. npm ci: nessuna nuova dipendenza. prisma migrate/seed: nessuna modifica a schema o seed. Lint, unit test, build ed e2e: verdi in locale. Condizione: il commit deve includere i 3 file nuovi non tracciati, altrimenti build e unit test fallirebbero per l''import mancante di navigazione-amministrazione. Wiki: disattivata (wiki.enabled false), il piano non dichiara alcun impatto Wiki, quindi niente dossier Wiki. Video demo: non registrato, anche se e2e.record_demo_video è true. I punti 1-2 di Demonstrates sono test unitari; i punti 3-4 chiedono che la UI di amministratore e collaboratore resti «come prima», quindi non c''è un incremento visibile da filmare. Quei punti sono già coperti dagli e2e sidebar.spec.ts e foglio-attivita-amministratore.spec.ts.'
  criteria:
