      verdict: met
      note: 'src/app/(back-office)/layout.tsx usa richiediAccessoBackOffice (src/lib/dal.ts), che chiama verificaSessione e reindirizza a HOME_AUTENTICATA (/attivita) se haAccessoBackOffice(sessione.permessi) è falso. Coperto da tests/unit/dal-permessi.test.ts (describe richiediAccessoBackOffice) e dall''e2e autorizzazione-ruoli.spec.ts («collaboratore tenta /anagrafiche → finisce su /attivita»). Nota: anche i permessi senza voce in sidebar (GESTIRE_ABILITAZIONI, GESTIRE_COLLABORATORI, GESTIRE_RIGHE_SOSPESE) aprono il back office. È coerente con il criterio, ma oggi un utente con solo uno di questi permessi vedrebbe «Amministrazione» senza alcuna voce.'
    - id: AC-2
      verdict: met
      note: In src/app/navigazione-amministrazione.ts ogni voce dichiara il proprio permesso; le 8 corrispondenze sono state verificate con richiediPermesso(...) nelle rispettive page.tsx. tests/unit/navigazione-amministrazione.test.ts controlla per ciascuna voce che compaia con il solo suo permesso e sparisca con tutti gli altri, e che il solo CONSULTARE_REPORT_FATTURAZIONE_CLIENTI mostri la sola voce Fatturazione clienti (Demonstrates 1).
