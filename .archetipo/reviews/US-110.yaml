      note: gruppiAmministrazioneVisibili filtra i gruppi con voci.length > 0 e la sidebar rende solo i gruppi restituiti, titolo compreso. Il test verifica che con il solo report clienti il gruppo «Anagrafica» non compaia e che con il ruolo COLLABORATORE o il solo permesso dei fogli altrui non compaia alcun gruppo.
    - id: AC-4
      verdict: met
      note: In sidebar-applicazione.tsx l'etichetta «Amministrazione» è condizionata a haAccessoBackOffice(permessi). Il test unitario controlla true con il solo report clienti e false per COLLABORATORE, più un controllo sul sorgente della sidebar. L'e2e sidebar.spec.ts copre il rendering per amministratore e collaboratore.
